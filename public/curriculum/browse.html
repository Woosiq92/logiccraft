<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성취기준 조회 — 2022 개정 교육과정</title>
<style>
  :root {
    --ink: #14171c; --dim: #5d6570; --line: #e3e6ea; --bg: #fbfcfd; --card: #fff;
    --fill: 20, 92, 168;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 80px; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--dim); font-size: 13.5px; margin: 0 0 26px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .card {
    flex: 1 1 200px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .n { font-size: 30px; font-weight: 650; letter-spacing: -.03em; }
  .card .l { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .bar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; position: sticky; top: 0; z-index: 2;
  }
  .bar input, .bar select {
    font: inherit; font-size: 14px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .bar input { flex: 1 1 280px; min-width: 200px; }
  .bar input:focus, .bar select:focus { outline: 2px solid rgb(var(--fill)); outline-offset: -1px; }
  .count { color: var(--dim); font-size: 13px; margin: 16px 2px 10px; }
  .hit {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .meta { font-size: 12.5px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  code {
    font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #eef2f7; color: #1b4d8a; border-radius: 5px; padding: 2px 6px;
  }
  .stmt { margin-top: 6px; }
  mark { background: #fff3b8; color: inherit; border-radius: 3px; padding: 0 1px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 13px; color: var(--dim); }
  summary:hover { color: var(--ink); }
  .expl { margin-top: 6px; font-size: 14px; color: #2c333c; }
  .src { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .empty { color: var(--dim); padding: 30px 2px; }
  .more { color: var(--dim); font-size: 13px; padding: 12px 2px 0; }
</style>
</head>
<body>
<div class="wrap" style="padding-bottom:10px"><a href="./" style="font-size:13.5px;color:#5d6570;text-decoration:none">← 성취기준 인덱스</a></div>

<div class="wrap">
  <h1>성취기준 조회</h1>
  <p class="sub">2022 개정 교육과정. 교육부 고시 원문에서 뽑아 검증을 통과한 것만 싣는다. 코드로도 문구로도 찾을 수 있다.</p>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <input id="q" type="search" placeholder="코드 또는 문구로 찾기 — 예: 6수03, 소인수분해, 광합성" autocomplete="off">
    <select id="subj"></select>
    <select id="grade"></select>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const D = {"항목":[{"교":"국어","c":"2국01-01","과":"국어","학":"초1~2","영":"듣기⋅말하기","p":"중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다."},{"교":"국어","c":"2국01-02","과":"국어","학":"초1~2","영":"듣기⋅말하기","p":"바르고 고운 말로 서로의 감정을 나누며 듣고 말한다.","h":["이 성취기준은 대화를 나눌 때 자신의 감정을 적절하게 표현함으로써 타인과의 관계를 형성하고 유지하며 발전시키는 능력을 기르기 위해 설정하였다. 기쁨, 슬픔, 사랑, 미움 등 다양한 감정과 관련된 표현 알기, 감정을 표현하는 과정에서 바르고 고운 말을 사용하기, 상대의 감정을 이해하고 수용하기 등을 학습한다."]},{"교":"국어","c":"2국01-03","과":"국어","학":"초1~2","영":"듣기⋅말하기","p":"상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.","h":["이 성취기준은 구어 의사소통의 상호 교섭성을 인식하는 출발점으로, 대화 상황에서 상대의 말에 집중하여 그 내용을 이해하고 순서를 교대하며 구어 의사소통에 참여하는 기본 능력을 기르기 위해 설정하였다. 상대의 말을 집중하여 듣기, 다음 말할 사람을 선택하여 다음 말할 사람을 선택하여 부르거나, 고갯짓, 시선, 억양 등의 말차례 교환 신호를 활용하여 다음 사람이 말차례를 알아차릴 수 있도록 하기, 말차례 교환 신호를 확인하여 자신의 말차례 지키기 등을 학습한다."]},{"교":"국어","c":"2국01-04","과":"국어","학":"초1~2","영":"듣기⋅말하기","p":"자신의 경험이나 생각을 바른 자세로 발표한다.","h":["이 성취기준은 교실에서 자신의 경험이나 생각을 바른 자세로 표현하고 학습에 참여할 수 있는 기본 능력을 기르기 위해 설정하였다. 자신의 경험이나 생각을 동료 학습자들 앞에서 간단히 말하기, 자신의 경험이나 배경지식을 바탕으로 말하기, 수업 시간에 바른 자세로 서서 말하기, 듣는 사람을 바라보며 말하기, 적절한 크기의 소리로 말하기 등을 학습한다."]},{"교":"국어","c":"2국01-05","과":"국어","학":"초1~2","영":"듣기⋅말하기","p":"듣기와 말하기에 관심과 흥미를 가진다.","h":["이 성취기준은 삶에서 듣기⋅말하기의 즐거움을 느끼고 듣기⋅말하기의 중요성을 인식하도록 하기 위해 설정하였다. 듣기⋅말하기가 다양한 생각과 감정을 나누며 의사소통하기 위한 기본적인 도구임을 인식하기, 듣기⋅말하기의 역할과 중요성을 직접 경험해 보기, 다양한 놀이를 통해 듣기⋅말하기에 흥미 가지기 등을 학습한다."]},{"교":"국어","c":"2국02-01","과":"국어","학":"초1~2","영":"읽기","p":"글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다."},{"교":"국어","c":"2국02-02","과":"국어","학":"초1~2","영":"읽기","p":"의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.","h":["이 성취기준은 글을 의미 단위에 알맞게 띄어 읽으며 글의 의미를 파악하는 능력을 기르기 위해 설정하였다. 글을 읽으면서 의미 단위를 인식하고 이에 맞게 띄어 읽는 것은 글의 의미를 정확하게 파악하고 읽기 유창성을 높이는 데 중요한 요소이다. 글의 의미를 이해하기 위해 의미 단위에 따른 어구나 어절 단위 등으로 띄어 읽기, 주어부와 서술어부 등을 단위로 하여 띄어 읽기, 문장 부호에 따라 문장 단위를 인식하면서 띄어 읽기, 쉬는 지점, 쉼의 길이에 유의하며 띄어 읽기 등을 학습한다."]},{"교":"국어","c":"2국02-03","과":"국어","학":"초1~2","영":"읽기","p":"글을 읽고 중심 내용을 확인한다."},{"교":"국어","c":"2국02-04","과":"국어","학":"초1~2","영":"읽기","p":"인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.","h":["이 성취기준은 글에 등장하는 인물의 마음과 생각을 짐작하는 능력과 타인에 대한 공감 능력을 기르기 위해 설정하였다. 인물의 마음이나 생각을 짐작하는 것은 글의 내용에 대한 이해와 더불어 실제 주변 인물에 대한 이해를 높이는 데 도움이 된다. 인물의 처지나 상황을 파악하기, 자신의 경험에 비추어 인물의 마음이나 생각 짐작하기, 감정을 드러내는 다양한 어휘를 활용하여 인물의 마음이나 생각을 표현하기, 인물의 마음이나 생각과 관련된 자신의 경험이나 생각을 떠올리며 비교하기 등을 학습한다."]},{"교":"국어","c":"2국02-05","과":"국어","학":"초1~2","영":"읽기","p":"읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다."},{"교":"국어","c":"2국03-01","과":"국어","학":"초1~2","영":"쓰기","p":"글자와 단어를 바르게 쓴다."},{"교":"국어","c":"2국03-02","과":"국어","학":"초1~2","영":"쓰기","p":"쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다.","h":["이 성취기준은 쓰기에 흥미를 가지고 자신의 생각이나 느낌을 문장으로 표현하는 능력을 기르기 위해 설정하였다. 쓰기에 대한 긍정적인 인식을 가지고 문장 쓰기를 수행하는 것은 필자로 성장하기 위한 출발점에 해당한다. 자신의 생각이나 느낌을 문장으로 구성하는 방법, 꾸며 주는 말을 넣어 자신의 생각이나 느낌을 표현하는 방법 등을 학습한다. 이를 통해 학습자가 자신이 쓰고 싶은 화제나 주제를 찾아 다양한 문장으로 표현하는 즐거움을 경험하도록 한다."]},{"교":"국어","c":"2국03-03","과":"국어","학":"초1~2","영":"쓰기","p":"주변 소재에 대해 소개하는 글을 쓴다."},{"교":"국어","c":"2국03-04","과":"국어","학":"초1~2","영":"쓰기","p":"겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다.","h":["이 성취기준은 자신이 겪은 일을 내용이나 형식에 제한 없이 자유롭게 표현하고, 그 과정과 결과를 독자와 공유하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 자신이 겪은 일 중 글로 쓰고 싶은 경험 떠올리기, 경험에 대한 자신의 생각이나 느낌 떠올리기, 자유롭게 표현하기, 쓴 글을 함께 읽고 반응하기 등을 학습한다."]},{"교":"국어","c":"2국04-01","과":"국어","학":"초1~2","영":"문법","p":"한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다."},{"교":"국어","c":"2국04-02","과":"국어","학":"초1~2","영":"문법","p":"소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다."},{"교":"국어","c":"2국04-03","과":"국어","학":"초1~2","영":"문법","p":"문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다.","h":["이 성취기준은 문장으로 의사소통하기 위해 필요한 기초적인 문식성을 기르고, 글자, 단어, 문장을 주의 깊게 관찰하고 탐구하는 자세를 기르기 위해 설정하였다. 자신의 생각을 문장으로 쓰는 것은 의사소통 능력의 핵심으로서, 특히 한글 학습 초기에는 음성 언어와는 다른 문자 언어의 특성을 이해하는 것이 중요하다. 문장 부호의 이름과 쓰임, 평서문⋅의문문⋅감탄문 등 다양한 종류의 문장 쓰기와 그에 따른 문장 부호 사용하기를 다루되, 문장 부호 사용의 필요성을 깨닫고 문장을 비롯하여 문장을 이루는 글자, 단어에도 호기심을 갖도록 한다."]},{"교":"국어","c":"2국05-01","과":"국어","학":"초1~2","영":"문학","p":"말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다.","h":["이 성취기준은 흥미로운 말놀이와 분위기를 살린 낭송을 통해 언어 활동의 재미와 즐거움을 느끼며 언어적 감수성을 기르게 하기 위해 설정하였다. 일상에서 쉽게 접할 수 있는 작품은 물론 일상적 대화 등을 통해 언어의 놀이적 성격을 인지하도록 하고, 의성어와 의태어, 규칙적으로 반복되는 소리, 언어유희, 재치 있는 문답, 수수께끼, 끝말잇기 등에서 말놀이의 재미와 가치를 느끼게 한다. 또한 작품의 느낌과 분위기를 살려 낭송해 보면서 목소리 크기나 말의 속도, 어조 등을 달리함에 따라 다양한 느낌을 전달할 수 있음을 알고 문학을 즐겨 향유하도록 한다."]},{"교":"국어","c":"2국05-02","과":"국어","학":"초1~2","영":"문학","p":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다.","h":["이 성취기준은 학습자들이 작품에 대해 느끼거나 생각한 점을 다른 이들과 나누는 과정에서 문학에 대해 더욱 흥미를 느끼고, 주체적으로 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 학습자의 발달과 정서적 측면을 고려하여 시, 노래, 이야기 등 다양한 갈래의 작품을 제시하고, 학습자가 이들 작품을 대상으로 자신의 생각이나 느낌을 표현할 수 있도록 한다. 이 과정에서 학습자로 하여금 작품에 대한 다른 학습자들의 말을 경청하게 하고, 사람마다 작품을 다르게 받아들일 수 있다는 점을 이해하게 한다."]},{"교":"국어","c":"2국05-03","과":"국어","학":"초1~2","영":"문학","p":"작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다."},{"교":"국어","c":"2국05-04","과":"국어","학":"초1~2","영":"문학","p":"시나 노래, 이야기에 흥미를 가진다."},{"교":"국어","c":"2국06-01","과":"국어","학":"초1~2","영":"매체","p":"일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다.","h":["이 성취기준은 매체와 관련된 일상 경험을 나눔으로써 매체와 매체 자료에 대한 흥미와 관심을 가지고 매체의 가치와 필요성을 자연스럽게 인식하도록 하기 위해 설정하였다. 매체란 소통을 매개하는 도구, 기술, 환경으로, 책, TV, 스마트폰, 컴퓨터, 태블릿, 인터넷 등이 이에 속하며, 매체 자료에는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화 등이 있다. 이 성취기준에서는 학습자가 친숙한 매체와 매체 자료를 토대로 일상의 경험을 매체와 연결 지어 이야기하여 매체와 매체 자료의 개념과 쓰임을 이해하고 다양한 매체와 매체 자료에 흥미와 관심을 갖도록 한다."]},{"교":"국어","c":"2국06-02","과":"국어","학":"초1~2","영":"매체","p":"일상의 경험과 생각을 글과 그림으로 표현한다.","h":["이 성취기준은 글과 그림으로 자신의 생각과 느낌을 표현하는 즐거움을 경험하도록 하기 위해 설정하였다. 글, 그림(또는 사진, 이모티콘 등)을 활용하여 자신, 친구, 가족, 학교, 교실 등 친숙한 주제에 대해 표현하거나 그림일기를 작성해 보는 활동을 통해 자신의 경험과 생각을 다양한 방식으로 표현해 보는 데 중점을 둔다."]},{"교":"국어","c":"4국01-01","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다."},{"교":"국어","c":"4국01-02","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다."},{"교":"국어","c":"4국01-03","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다.","h":["이 성취기준은 구어 의사소통 상황에서 억양, 어조, 속도 등의 준언어적 표현과 표정, 시선, 몸동작, 자세 등의 비언어적 표현을 활용하여 의미를 효과적으로 전달하고 이해할 수 있는 능력을 기르기 위해 설정하였다. 다양한 상황에 알맞은 준언어⋅비언어적 표현의 중요성 이해하기, 준언어⋅비언어적 표현의 의미와 효과 파악하기, 준언어⋅비언어적 표현의 적절성 점검하기, 상황에 적절한 준언어⋅비언어적 표현 활용하기 등을 학습한다."]},{"교":"국어","c":"4국01-04","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"상황과 상대의 입장을 이해하고 예의를 지키며 대화한다."},{"교":"국어","c":"4국01-05","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.","h":["이 성취기준은 교과 학습 상황을 비롯하여 다양한 상황에서 필요한 기초적인 발표 능력을 기르기 위해 설정하였다. 주어진 자료에서 발표 목적과 주제에 알맞은 내용을 중심으로 발표 내용 정리하기, 준비한 내용이 명확하게 전달되는지를 점검하며 발표 연습하기, 준언어⋅비언어적 표현을 효과적으로 사용하는지 점검하며 발표 연습하기, 연습 과정에서 부족했던 부분을 조정하여 자신감을 가지고 발표하기 등을 학습한다."]},{"교":"국어","c":"4국01-06","과":"국어","학":"초3~4","영":"듣기⋅말하기","p":"주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다.","h":["이 성취기준은 문제를 합리적으로 해결하기 위한 기초 능력으로서 토의 능력을 기르기 위해 설정하였다. 주제에 적절한 의견을 이유와 함께 제시하기, 상대의 의견을 구체적으로 파악하거나 의견과 이유의 적절성을 점검하기 위해 서로 묻고 답하기, 다른 사람의 생각 존중하기 등을 학습한다."]},{"교":"국어","c":"4국02-01","과":"국어","학":"초3~4","영":"읽기","p":"글의 의미를 파악하며 유창하게 글을 읽는다.","h":["이 성취기준은 글의 의미를 효과적으로 표현하는 방법을 사용하여 유창하게 글을 읽는 능력을 기르기 위해 설정하였다. 글의 유형에 따라 글의 분위기, 장면, 인물의 특성 등을 파악하고 이를 고려하되, 어조, 억양, 속도, 강세 등의 표현 요소를 활용하여 글을 읽으면서 글의 의미를 효과적으로 표현하기 등을 학습한다."]},{"교":"국어","c":"4국02-02","과":"국어","학":"초3~4","영":"읽기","p":"문단과 글에서 중심 생각을 파악하고 내용을 간추린다."},{"교":"국어","c":"4국02-03","과":"국어","학":"초3~4","영":"읽기","p":"질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다.","h":["이 성취기준은 글을 읽으며 글에 대한 질문을 만들고 이에 대한 답을 예측하면서 글을 읽는 추론적 읽기 능력을 기르기 위해 설정하였다. 읽기 전이나 읽기 중에 이루어지는 질문을 통해 자신의 배경지식이나 경험을 글과 관련짓기, 배경지식이나 경험을 활성화하여 글의 의미 추론하기, 제목이나 글의 차례, 사진이나 그림 등의 자료를 통해 글의 의미 추론하기, 질문을 통해 단어의 의미, 이어질 내용이나 사건의 전후를 예측하기, 질문을 통해 글을 이해한 정도를 점검하거나 읽기 과정에서 겪는 어려움을 점검하기 등을 학습한다."]},{"교":"국어","c":"4국02-04","과":"국어","학":"초3~4","영":"읽기","p":"글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다.","h":["이 성취기준은 글에 나타난 사실과 의견을 구별하고 필자와 자신의 의견을 비교하면서 필자의 의견을 일방적으로 수용하지 않고 글을 비판적으로 읽는 능력을 기르기 위해 설정하였다. 글을 읽고 필자의 의견과 객관적 사실을 구별하기, 필자의 의견과 자신의 의견을 비교하기, 필자의 의견에 대한 타당성을 평가하기, 동일한 주제나 상황에 대한 서로 다른 의견 비교하기 등을 학습한다."]},{"교":"국어","c":"4국02-05","과":"국어","학":"초3~4","영":"읽기","p":"글이나 자료의 출처가 믿을 만한지 판단한다.","h":["이 성취기준은 도서관이나 인터넷 등을 통해 글이나 자료를 찾아 읽을 때 출처의 신뢰성을 평가하며 읽고 믿을 만한 글이나 자료를 선별하는 능력을 기르기 위해 설정하였다. 글이나 자료의 출처 확인 방법이나 필요성 이해하기, 다양한 매체를 활용하여 글이나 자료 탐색하기, 글이나 자료의 정보 출처 파악하기, 정보 출처의 유형이나 정보의 최신성 확인하기, 권위나 공신력 등을 고려한 신뢰성 평가하기, 여러 정보를 비교하며 내용의 신뢰성 평가하기 등을 학습한다."]},{"교":"국어","c":"4국02-06","과":"국어","학":"초3~4","영":"읽기","p":"바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다."},{"교":"국어","c":"4국03-01","과":"국어","학":"초3~4","영":"쓰기","p":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다.","h":["이 성취기준은 문단을 짜임새 있게 쓰는 능력을 길러 글을 쓰는 과정에서 이를 적용할 수 있도록 하기 위해 설정하였다. 문단의 개념, 문단의 기능과 역할, 중심 문장과 뒷받침 문장의 관계, 중심 문장과 뒷받침 문장을 쓰는 방법, 중심 문장과 뒷받침 문장을 갖추어 문단을 쓰는 방법, 문장과 문단을 중심으로 글을 고쳐 쓰는 방법 등을 학습한다."]},{"교":"국어","c":"4국03-02","과":"국어","학":"초3~4","영":"쓰기","p":"절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다.","h":["이 성취기준은 교과 학습의 기초가 되는 보고하는 글을 쓰는 능력을 기르기 위해 설정하였다. 보고하는 글의 개념, 보고하는 글에 들어가야 할 내용 요소, 절차와 결과가 드러나게 글의 내용을 조직하는 방법, 절차와 결과를 정확하게 표현해야 하는 이유, 정확한 표현으로 보고하는 글 쓰기 등을 학습한다."]},{"교":"국어","c":"4국03-03","과":"국어","학":"초3~4","영":"쓰기","p":"대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다.","h":["이 성취기준은 어떤 대상이나 사실, 문제에 대한 자신의 의견을 구체적이고 명료하게 글로 쓰는 능력을 기르기 위해 설정하였다. 의견의 개념, 의견을 제시하는 것이 필요한 이유와 상황, 주제를 고려하여 자신의 의견을 제시하는 방법, 의견에 대한 이유를 드는 방법 등을 학습한다."]},{"교":"국어","c":"4국03-04","과":"국어","학":"초3~4","영":"쓰기","p":"목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다."},{"교":"국어","c":"4국03-05","과":"국어","학":"초3~4","영":"쓰기","p":"자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다."},{"교":"국어","c":"4국04-01","과":"국어","학":"초3~4","영":"문법","p":"단어와 단어 간의 의미 관계를 파악한다."},{"교":"국어","c":"4국04-02","과":"국어","학":"초3~4","영":"문법","p":"단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다.","h":["이 성취기준은 단어에 대한 기본적인 이해를 바탕으로 국어사전에서 단어를 찾고 국어사전에 수록된 정보를 활용하여 능동적인 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 명사, 동사, 형용사에 대한 기본적인 이해를 바탕으로 하되, 상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 동형이의어와 다의어가 국어사전에 수록된 방식을 이해하고, 동사와 형용사의 기본형과 활용형을 구분할 수 있도록 한다. 또한 국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해하고, 단어의 정확한 발음과 표기를 국어사전에서 찾아 어법에 맞는 국어생활을 할 수 있도록 한다."]},{"교":"국어","c":"4국04-03","과":"국어","학":"초3~4","영":"문법","p":"기본적인 문장의 짜임을 이해하고 적절하게 사용한다."},{"교":"국어","c":"4국04-04","과":"국어","학":"초3~4","영":"문법","p":"글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다.","h":["이 성취기준은 높임 표현과 지시⋅접속 표현이 상황 맥락에 맞는 언어 표현을 선택하거나 글이나 담화를 유기적으로 구성하는 데 필요한 지식임을 이해하고, 글이나 담화에서 높임 표현과 지시⋅접속 표현을 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 높임 표현의 기능과 적절한 사용 방식, 앞에 나온 말을 가리키는 지시 표현 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다."]},{"교":"국어","c":"4국04-05","과":"국어","학":"초3~4","영":"문법","p":"언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다."},{"교":"국어","c":"4국05-01","과":"국어","학":"초3~4","영":"문학","p":"인물과 이야기의 흐름을 중심으로 작품을 감상한다.","h":["이 성취기준은 문학 작품 속 인물의 특성과 서사의 기본 구조를 파악하며 작품을 이해하는 능력을 기르게 하기 위해 설정하였다. 이야기를 읽을 때 인물의 성격과 역할을 파악하고, 이를 고려하여 시간적 순서나 인과관계를 생각하며 이야기의 흐름을 파악하는 활동에 중점을 둔다. 나아가 작품 속 다양한 인물의 특성을 고려하면서 이어질 이야기를 상상하여 표현해 봄으로써 작품을 능동적으로 이해하고 감상하게 한다."]},{"교":"국어","c":"4국05-02","과":"국어","학":"초3~4","영":"문학","p":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다.","h":["이 성취기준은 작품 속의 세계가 현실 세계를 반영한 것이지만, 허구적 세계로서 현실 세계와 구별된다는 점을 인식하며 작품을 감상할 수 있게 하기 위해 설정하였다. 작품 속의 인물⋅정서⋅상황⋅배경⋅분위기⋅사건 등을 이해할 때 학습자 자신의 경험을 바탕으로 경험과 상상, 사실과 허구를 비교하며 생각하게 하고, 허구적으로 표현한 부분에 대한 의견을 나누며 작품을 감상하도록 한다."]},{"교":"국어","c":"4국05-03","과":"국어","학":"초3~4","영":"문학","p":"작품을 듣거나 읽고 마음에 드는 작품을 소개한다."},{"교":"국어","c":"4국05-04","과":"국어","학":"초3~4","영":"문학","p":"감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다.","h":["이 성취기준은 문학 표현 방식의 효과와 기능을 이해하며 작품을 감상하고, 자신의 생각이나 느낌을 다양한 방법으로 나타내어 다른 이들과 나누게 하기 위해 설정하였다. 학습자로 하여금 감각적 표현을 통해 작품 속에 형상화된 대상을 생동감 있게 체험하면서 문학의 즐거움을 느끼게 하는 데 중점을 둔다. 또한 자신의 생각과 감정을 효과적으로 전달할 수 있는 감각적 표현을 활용하여 말을 하거나 글을 써 보고 감각적 표현을 사용하였을 때와 그렇지 않을 때의 차이를 비교하게 한다."]},{"교":"국어","c":"4국05-05","과":"국어","학":"초3~4","영":"문학","p":"재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다."},{"교":"국어","c":"4국06-01","과":"국어","학":"초3~4","영":"매체","p":"인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다.","h":["이 성취기준은 다양한 교과 학습 맥락에서 인터넷에 접속하여 다양한 자료에 효과적으로 접근하고 유용한 정보를 선택하여 목적에 맞게 활용할 때 필요한 기초 능력을 기르기 위해 설정하였다. 교사의 안내에 따라 디지털 매체를 통해 지정된 인터넷 공간에 접속하기, 다양한 자료 훑어보기, 자료의 내용 파악하기, 유용한 자료 선택하기 등을 수행하고, 이를 통해 인터넷 접속 방법, 비선형적 자료의 탐색 방법, 목적에 맞는 정보 선택 방법 등을 체계적으로 학습한다."]},{"교":"국어","c":"4국06-02","과":"국어","학":"초3~4","영":"매체","p":"매체를 활용하여 간단한 발표 자료를 만든다."},{"교":"국어","c":"4국06-03","과":"국어","학":"초3~4","영":"매체","p":"매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다.","h":["이 성취기준은 매체 기반의 소통에서 지켜야 할 기본적인 윤리를 이해하고 이를 고려하며 매체 자료를 활용하거나 공유할 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 자료를 활용하거나 공유하는 과정에서 저작권과 초상권 침해, 개인 정보 유출 등의 문제가 발생할 수 있음을 이해한다. 다양한 사례를 통해 매체 이용자로서 소통 윤리를 지키려는 태도를 기르고, 매체 자료를 안전하고 올바르게 활용하고 공유할 수 있는 방법 등을 학습한다."]},{"교":"국어","c":"6국01-01","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"대화에서 생략된 내용을 추론하며 듣는다."},{"교":"국어","c":"6국01-02","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다."},{"교":"국어","c":"6국01-03","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다.","h":["이 성취기준은 교과 학습 상황을 비롯한 다양한 상황에서 주제와 관련하여 적극적으로 질문하며 구어 의사소통에 참여하는 능력을 기르기 위해 설정하였다. 들은 내용을 확인하거나 명료하게 이해하기 위한 질문, 생략된 내용을 추론하기 위한 질문, 상대의 의도를 파악하기 위한 질문, 다른 사람의 생각과 자신의 생각을 연결하기 위한 질문, 자료에서 제시되지 않은 대안이나 더 많은 정보를 찾기 위한 질문 등 다양한 목적으로 질문 생성하기, 분명한 표현으로 질문하기, 예절을 지켜 질문하기 등을 학습한다."]},{"교":"국어","c":"6국01-04","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다.","h":["이 성취기준은 일련의 절차에 따라 면담을 경험해 봄으로써 정보 수집 등의 목적을 가진 구어 의사소통을 효과적이고 체계적으로 수행하는 능력을 기르기 위해 설정하였다. 면담 준비⋅진행⋅결과 정리 등 면담의 절차 이해하기, 면담의 목적⋅대상⋅주제 등 설정하기, 사전 정보 수집하기, 면담 대상 섭외하기, 목적⋅대상⋅주제에 알맞은 질문 준비하기, 녹음기나 기록용 노트 등 면담에 필요한 매체 준비하기, 준비한 질문을 바탕으로 면담하기, 면담 결과를 발표하거나 글로 써서 보고하기 등을 학습한다. 면담 상대를 배려하여 사전에 약속 시간 정하기, 녹음 여부에 대해 동의 구하기, 민감하거나 불편한 질문은 아닌지 점검하기, 종료 후 감사 표현하기 등 면담 과정에서 지켜야 할 예절도 학습한다."]},{"교":"국어","c":"6국01-05","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다."},{"교":"국어","c":"6국01-06","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다."},{"교":"국어","c":"6국01-07","과":"국어","학":"초5~6","영":"듣기⋅말하기","p":"절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다.","h":["이 성취기준은 민주적 의사소통 능력으로서 토론 능력을 기르기 위해 설정하였다. 찬성 또는 반대의 입장에서 주장하는 바에 대한 이유 마련하기, 이유를 뒷받침할 수 있는 객관적인 사실 또는 정보를 활용하여 근거 마련하기, 주장이 가치 있고 실천 가능한지 검토하기, 이유가 주장과 관련이 있는지 검토하기, 이유가 상대에게 받아들여질 수 있는지 검토하기, 근거가 이유와 관련이 있는지 검토하기, 근거로 제시한 자료의 출처가 명확하고 믿을 만한지 검토하기, 상대의 의견을 존중하며 토론하기, 절차와 규칙에 따라 합리적으로 소통하는 태도 형성하기 등을 학습한다."]},{"교":"국어","c":"6국02-01","과":"국어","학":"초5~6","영":"읽기","p":"글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다.","h":["이 성취기준은 글의 구조를 고려하며 글의 중심 내용을 파악하고 자신의 언어로 요약하는 능력을 기르기 위해 설정하였다. 요약하기의 일반 원리를 이해하기, 글의 구조를 시각화한 도해 조직자를 활용하여 글의 구조와 내용 파악하기, 주제나 주장을 파악하기, 글의 중심 내용을 자신의 언어로 재구성하여 요약하기 등을 학습한다."]},{"교":"국어","c":"6국02-02","과":"국어","학":"초5~6","영":"읽기","p":"글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다.","h":["이 성취기준은 글의 문맥을 고려하여 글에 표면적으로 드러나지 않은 내용을 추론하며 읽는 능력을 기르기 위해 설정하였다. 중요 단어나 문장, 문단 등의 수준에서 의미 추론하기, 글의 전체적인 흐름을 고려할 때 글에서 빠진 세부 내용이나 이어질 내용 추론하기, 학습자의 배경지식을 이용하여 함축적 표현이 암시하거나 내포하는 의미 추측하기 등을 학습한다."]},{"교":"국어","c":"6국02-03","과":"국어","학":"초5~6","영":"읽기","p":"글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다."},{"교":"국어","c":"6국02-04","과":"국어","학":"초5~6","영":"읽기","p":"문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.","h":["이 성취기준은 학습자가 직면한 문제를 해결하기 위해 다양한 관점의 글을 찾아 읽고 문제 해결에 필요한 지식이나 정보를 구성하는 창의적 읽기 능력을 기르기 위해 설정하였다. 문제 상황과 관련한 읽기 목적 명료화하기, 문제 상황 해결에 도움을 줄 수 있는 다양한 관점의 글 선정하기, 다양한 관점의 글을 읽고 내용의 타당성과 유용성 평가하기, 문제 해결을 위한 자신만의 창의적인 해결 방안 마련하기 등을 학습한다."]},{"교":"국어","c":"6국02-05","과":"국어","학":"초5~6","영":"읽기","p":"긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다."},{"교":"국어","c":"6국03-01","과":"국어","학":"초5~6","영":"쓰기","p":"알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.","h":["이 성취기준은 설명하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 설명하고자 하는 대상의 특성을 드러낼 수 있는 내용을 선정하는 방법, 개념 정의, 부연 상술, 예시, 열거, 인용, 비교와 대조 등을 활용하여 독자가 대상의 특성을 이해하기 쉽게 내용을 구성하고 표현하는 방법, 설명 대상과 설명 방법의 관련성 등을 학습한다. 설명 대상은 인문, 사회, 과학, 예술, 체육 등 교과 내용에서 선정한다."]},{"교":"국어","c":"6국03-02","과":"국어","학":"초5~6","영":"쓰기","p":"적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다.","h":["이 성취기준은 주장하는 글을 쓰는 데에 필요한 능력과 쓰기 윤리를 준수하며 글을 쓰는 태도를 기르기 위해 설정하였다. 주장하는 글 쓰기의 중요성과 특성, 주장과 이유 및 근거의 개념과 관계, 주장하는 글에 적절한 근거가 필요한 까닭, 역사적 사실, 실험 및 조사 결과, 통계 수치, 전문가의 견해 등을 활용하여 근거 생성하기, 이유와 근거를 활용하여 주장하는 글 쓰기, 인용의 출처를 밝혀야 하는 이유와 기본적인 인용 방법 등을 학습한다."]},{"교":"국어","c":"6국03-03","과":"국어","학":"초5~6","영":"쓰기","p":"체험한 일에 대한 감상을 나타내는 글을 쓴다."},{"교":"국어","c":"6국03-04","과":"국어","학":"초5~6","영":"쓰기","p":"독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다.","h":["이 성취기준은 글을 쓰는 과정에서 쓰기 목적, 독자와 매체 등과 같은 상황 맥락을 고려하여 내용을 생성하고 표현하는 능력을 기르기 위해 설정하였다. 예상 독자의 개념 이해하기, 독자 고려의 필요성 인식하기, 온라인 대화, 인터넷 게시판 댓글, 전자 우편, 블로그, 휴대전화 문자 메시지 등 다양한 매체의 특성 이해하기, 글의 목적이나 주제에 따라 알맞은 매체와 예상 독자 선정하기, 독자와 매체의 특성을 고려하여 계획 및 내용 생성하기, 독자와 매체의 특성을 고려하여 표현하기 등을 학습한다."]},{"교":"국어","c":"6국03-05","과":"국어","학":"초5~6","영":"쓰기","p":"쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.","h":["이 성취기준은 필자가 자신의 쓰기 과정을 점검⋅조정하고 그 결과를 바탕으로 글을 고쳐 쓰는 능력을 기르기 위해 설정하였다. 글쓰기에서 통일성의 개념과 중요성, 쓰기 과정에 대한 점검과 조정의 필요성, 쓰기 과정의 회귀적 특성, 글에 대한 독자의 반응을 생각하며 고쳐쓰기, 글의 주제와 목적, 예상 독자 등을 고려하여 글의 통일성 점검하기 등을 학습한다."]},{"교":"국어","c":"6국03-06","과":"국어","학":"초5~6","영":"쓰기","p":"쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다."},{"교":"국어","c":"6국04-01","과":"국어","학":"초5~6","영":"문법","p":"음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다.","h":["이 성취기준은 생각을 표현하는 언어 양식으로서 음성 언어와 문자 언어의 특성을 이해하고, 매체 자료에서 생성된 음성 언어 및 문자 언어의 표현 효과를 평가하는 능력을 기르기 위해 설정하였다. 음성 언어 및 문자 언어의 특성을 비교하되, 복합양식적 특성을 지니는 다양한 매체 자료에 사용된 언어 양식의 표현 효과를 학습하고, 표현하고자 하는 목적이나 핵심 주제가 같더라도 언어 양식이 다르면 전달되는 내용과 표현 효과가 다를 수 있음을 분석적, 비판적 시각으로 이해하고 평가할 수 있도록 한다."]},{"교":"국어","c":"6국04-02","과":"국어","학":"초5~6","영":"문법","p":"표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다.","h":["이 성취기준은 국어 화자의 의사소통에서 표준어와 방언이 담당하는 기능이 다르다는 점을 알고, 자신이 속한 언어 공동체 특유의 한국어 변이형들로 인해 자신의 국어생활이 상황에 따라 다양하게 실현됨을 이해하도록 하기 위해 설정하였다. 방언의 형성과 존재 양상을 파악함으로써 지역적 요인에 따라 자연스럽게 한국어에 변이가 일어남을 이해하도록 하고, 이러한 다양성을 아우르는 언어 공동체 규준인 표준어의 개념과 필요성을 함께 다루도록 한다. 또한 의사소통의 공적⋅사적 상황에 따라, 상대방과의 거리감 조절 등 화자의 의도에 따라 표준어와 방언을 선택함으로써 다양한 의사소통 기능이 실현된다는 점을 확인할 수 있도록 한다."]},{"교":"국어","c":"6국04-03","과":"국어","학":"초5~6","영":"문법","p":"고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다.","h":["이 성취기준은 고유어와 관용 표현의 쓰임과 가치를 이해하고 국어문화에 대한 관심과 우리말을 소중히 여기는 태도를 고양하기 위해 설정하였다. 한자어, 외래어와 함께 국어 어휘의 일부를 이루는 고유어의 특성과 가치, 고유어에 다양하게 발달해 있는 관용 표현의 특성과 쓰임에 대한 이해에 중점을 두되, 상황과 표현 의도에 따라 어휘를 적절하게 사용하고 외래어의 오⋅남용 방지 등 국어 순화의 필요성을 자각하며 실천할 수 있도록 한다."]},{"교":"국어","c":"6국04-04","과":"국어","학":"초5~6","영":"문법","p":"문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","h":["이 성취기준은 문장을 구성하는 성분들 사이의 호응 관계가 올바르고 자연스러운 문장을 구성하는 데 필요한 능력을 기르기 위해 설정하였다. 문장에서 주어, 목적어, 서술어의 역할, 성분 간의 호응 관계(주어와 서술어의 호응, 목적어와 서술어의 호응)에 대해 학습하고, 이전 학년군의 높임 표현 및 동일 학년군의 시간 표현 성취기준과 연계하여 높임이나 시제의 일치를 함께 학습할 수 있다."]},{"교":"국어","c":"6국04-05","과":"국어","학":"초5~6","영":"문법","p":"글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다.","h":["이 성취기준은 효과적인 의사소통을 위해 상황 맥락에 맞게 시간 표현을 사용하는 것의 중요성을 알고 시간을 표현할 때 사용되는 언어 형식을 이해하고 활용하는 능력을 기르기 위해 설정하였다. ‘-았-/-었-, -는-/-ㄴ-, -겠-, -(으)ㄹ 것이-’나 시간 부사 등 글이나 담화에서 과거, 현재, 미래를 표현하는 언어 형식 및 방법을 학습하고, 다양한 상황 맥락에서 시간 표현을 사용한 후 그 적절성을 평가해 보도록 한다."]},{"교":"국어","c":"6국04-06","과":"국어","학":"초5~6","영":"문법","p":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다."},{"교":"국어","c":"6국05-01","과":"국어","학":"초5~6","영":"문학","p":"작가의 의도를 생각하며 작품을 읽는다.","h":["이 성취기준은 작품을 만든 이에 대해 호기심을 가지고 작가라는 존재를 고려하면서 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 작가가 작품을 쓰게 된 계기나 상황을 생각하고, 작가의 취지와 의도를 헤아리면서 작품을 더 깊고 넓게 이해할 수 있게 한다. 또한 작가에 대한 관심을 바탕으로 작가의 다른 작품들도 찾아 읽는 태도를 가지며 능동적인 문학 향유자로 성장할 수 있게 한다. 아울러 다양한 상상의 세계를 펼쳐 보이는 창의성을 가진 인간에게 관심을 가짐으로써 학습자도 그러한 창의성을 가진 인간으로 성장하는 계기가 될 수 있게 한다. 다만 작품의 의미는 작가의 의도에 한정되는 것이 아니며, 다양한 독자들의 해석이 더해져서 계속 생성되어 가는 것이라는 점을 함께 생각하며 문학 소통에 적극적으로 참여할 수 있게 한다."]},{"교":"국어","c":"6국05-02","과":"국어","학":"초5~6","영":"문학","p":"비유적 표현의 효과에 유의하여 작품을 감상한다."},{"교":"국어","c":"6국05-03","과":"국어","학":"초5~6","영":"문학","p":"소설이나 극을 읽고 인물, 사건, 배경을 파악한다.","h":["이 성취기준은 작품을 이루는 주요 요소를 중심으로 작품을 분석하고 이해하는 능력을 기르게 하기 위해 설정하였다. 작품 속 인물, 사건, 배경을 파악하고, 각 요소의 기능 및 요소 간 관계를 이해하도록 한다. 예를 들어 인물의 성격과 사건의 전개 과정 간의 관계, 인물의 성격이 사건 전개 과정에 끼치는 영향, 사건의 전개 과정과 배경과의 관련, 배경의 변화에 따른 사건 전개 과정의 변화 등을 파악하여 작품을 깊이 있게 감상한다. 나아가 이러한 요소의 역할이나 관계가 모든 작품에서 동일한 양상으로 나타나는 것이 아니며, 작품에 따라 특정 요소가 두드러지게 부각되기도 하고 요소 간의 관계가 독특하게 형성되기도 한다는 점을 생각하며 작품을 수용하게 한다."]},{"교":"국어","c":"6국05-04","과":"국어","학":"초5~6","영":"문학","p":"인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.","h":["이 성취기준은 학습자가 작품에 대한 자신의 생각을 적극적으로 표현하고, 이를 타인과 나눔으로써 보다 주체적인 문학 수용 능력을 기르게 하기 위해 설정하였다. 이를 위해 인상적인 장면을 중심으로 작품에 대한 의견을 나누되, 인상적이라고 생각하는 이유나 근거를 작품과 연결 지어 설명하도록 한다. 또한 상대방의 수용 경험에도 귀를 기울여 작품에 대한 해석이 다양한 관점에서 이루어질 수 있음을 알고 문학 소통에 즐겁게 참여하도록 한다."]},{"교":"국어","c":"6국05-05","과":"국어","학":"초5~6","영":"문학","p":"자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다."},{"교":"국어","c":"6국05-06","과":"국어","학":"초5~6","영":"문학","p":"작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다.","h":["이 성취기준은 작품을 읽고 성찰하는 과정을 통해 자신을 돌아보는 것은 물론 자신이 속한 공동체의 삶에 대해서도 생각하게 하기 위해 설정하였다. 학습자가 작품을 적극적으로 수용하여 작품에 담긴 가치를 내면화하는 가운데 자신의 삶의 모습을 되돌아보게 한다. 또한 공동체의 다양한 문제를 다룬 작품을 읽을 때에도 먼저 자신의 삶을 돌아보고, 함께 살아가는 삶을 위해 공동체 구성원으로서 가져야 할 바람직한 자세나 태도에 대하여 생각해 보도록 한다."]},{"교":"국어","c":"6국06-01","과":"국어","학":"초5~6","영":"매체","p":"정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.","h":["이 성취기준은 정보 검색 도구의 특성을 이해하고 적절한 정보 검색 전략을 수립하여 자신의 목적에 맞는 매체 자료를 찾아 활용하는 능력을 향상하기 위해 설정하였다. 정보 유형별로 검색 결과를 제시하는 정보 검색 도구의 기능을 이해한다. 또한 핵심 단어 중심으로 검색이 되는 정보 검색 도구의 특징을 이해하여 자신의 목적에 적합한 검색어를 만들 수 있도록 한다. 인터넷의 특성을 고려하여 정보 검색 과정에서 지속적인 성찰과 점검을 통해 자신의 목적에 부합한 자료 검색 과정이 이루어질 수 있도록 한다."]},{"교":"국어","c":"6국06-02","과":"국어","학":"초5~6","영":"매체","p":"뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다.","h":["이 성취기준은 뉴스 및 각종 정보 매체의 매체 자료에 대해 신뢰성 측면을 중심으로 평가하는 능력을 기르기 위해 설정하였다. 뉴스 및 각종 정보 매체 자료는 개인과 공동체에 미치는 영향력이 크기 때문에 매체 자료를 수용할 때는 그것이 신뢰할 만한 것인지 평가하는 태도가 중요하다는 점을 이해하도록 한다. 매체 자료의 신뢰성은 제작자가 얼마나 해당 분야에 전문적이고 권위가 있는지, 실제 취재하거나 수집한 근거 자료를 기반으로 제작된 것인지, 근거 자료가 얼마나 정확하고 최신의 것이며 증빙 가능한 것인지 등의 측면에서 평가할 수 있다."]},{"교":"국어","c":"6국06-03","과":"국어","학":"초5~6","영":"매체","p":"적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다.","h":["이 성취기준은 매체 및 매체 자료의 양식과 수용자에게 끼칠 영향을 고려하여 복합양식 자료를 제작하는 능력을 기르기 위해 설정하였다. 의도나 주제를 드러내는 다양한 표현 양식을 이해하고 자신의 목적, 주제, 수용자 반응을 고려하여 이미지가 포함된 글, 카드 뉴스, 발표 자료, 동영상 등의 복합양식 매체 자료를 제작한 다음 이를 공유하여 그 효과성을 점검한다."]},{"교":"국어","c":"6국06-04","과":"국어","학":"초5~6","영":"매체","p":"자신의 매체 이용 양상에 대해 성찰한다."},{"교":"국어","c":"9국01-01","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"화자의 의도와 관점을 추론하며 듣는다.","h":["이 성취기준은 담화의 맥락을 고려하여 담화에서 표면적으로 드러나지 않는 숨겨진 요소를 추론하며 들음으로써 담화의 내용을 깊이 이해하는 능력을 기르기 위해 설정하였다. 일상의 대화 상황에서 상대의 발화 의도 추론하기, 정보 전달이나 설득 등 다양한 목적의 담화에서 여러 가지 정보와 상황 맥락을 고려하여 화자의 숨겨진 의도와 관점, 가치관 추론하기 등을 학습한다."]},{"교":"국어","c":"9국01-02","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"설득 전략을 비판적으로 분석하며 듣는다."},{"교":"국어","c":"9국01-03","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"담화 공동체에 따른 듣기⋅말하기 방식의 다양성을 고려하여 듣고 말한다.","h":["이 성취기준은 개인이 속해 있는 담화 공동체의 듣기⋅말하기 방식이 가진 다양성을 고려하여 구어 의사소통에 참여함으로써 사회⋅문화적 맥락에 맞는 의사소통 능력을 기르기 위해 설정하였다. 듣기⋅말하기 방식에 영향을 미치는 요인으로 세대, 성, 직업, 지역, 공동체의 관심사나 이해관계, 공동체의 언어문화와 관습 등이 있음을 이해하기, 개인이 속한 집단이나 공동체에 따라 듣기⋅말하기 방식이 다양할 수 있음을 이해하기, 듣기⋅말하기 방식의 다양성에 대한 존중이 긍정적인 관계 형성과 유지에 기여함을 이해하기, 서로 다른 듣기⋅말하기 방식을 이해하고 존중하는 태도 형성하기, 자신의 듣기⋅말하기 방식이 상황 맥락이나 자신이 속한 공동체에 적절한지를 지속적으로 점검하여 개선하기 등을 학습한다."]},{"교":"국어","c":"9국01-04","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"상대의 말을 경청하고 상대의 감정과 입장에 공감하는 반응을 보이며 대화한다."},{"교":"국어","c":"9국01-05","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"면담의 다양한 목적과 상대를 고려하여 질문을 점검하고 효과적으로 면담한다.","h":["이 성취기준은 효과적으로 면담을 수행함으로써 목적과 상대를 고려하는 의사소통 능력을 기르기 위해 설정하였다. 말하기나 글쓰기를 위한 자료 수집, 의사 결정, 상담, 선발 등 다양한 면담 목적과 상대를 고려하여 질문 마련하기, 구조화 면담 또는 반구조화 면담 등 면담 유형에 적절한 면담 수행 계획 세우기, 면담 대상자의 입장이나 반응 등에 따라 면담 질문의 내용이나 순서, 진행 방법 등을 조정하여 면담하기, 면담 중에 추가 질문하기, 면담 후 면담 계획이나 목적에 따라 면담이 원만하게 진행되었는지를 점검하기, 질문의 의도와 답변자의 의도를 고려하여 면담 내용을 정리하기 등을 학습한다."]},{"교":"국어","c":"9국01-06","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"다양한 자료를 재구성하여 내용을 체계적으로 조직하고 청중이 이해하기 쉽게 발표한다.","h":["이 성취기준은 말할 내용을 체계적으로 조직하여 청중이 이해하기 쉽게 발표하는 능력을 함양하기 위해 설정하였다. 다양한 자료를 청자가 이해하기 쉬운 방향으로 재구성하기, 발표 내용을 도입부⋅전개부⋅정리부로 나누어 체계적으로 구성하기, 발표 목적이나 대상의 특성에 적절한 설명 방법 활용하기, 청중이 이해하기 쉽게 발표하기, 발표 준비와 실행 과정을 되돌아보고 수행의 적절성 점검하기 등을 학습한다."]},{"교":"국어","c":"9국01-07","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"토의에서 다양한 의견을 교환하여 대안을 마련하고 문제를 해결한다."},{"교":"국어","c":"9국01-08","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"토론에서 반론을 고려하여 타당한 논증을 구성하고 논리적으로 반박한다.","h":["이 성취기준은 합리적이고 민주적인 의사 결정을 위한 토론 능력을 기르기 위해 설정하였다. 토론 논제에 대한 찬성과 반대 입장별로 각 입장을 뒷받침하는 이유와 근거 마련하기, 상대방이 제기할 수 있는 반론을 고려하여 논증 구성하기, 주장⋅이유⋅근거⋅반론에 대한 고려 등 논증 구성 요소들이 타당한지 비판적으로 분석하여 반박하기, 논증의 논리적 전개 과정에서 논리적 허점이나 오류가 없는지 분석하여 반박하기 등을 학습한다."]},{"교":"국어","c":"9국01-09","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"서로의 감정이나 바라는 바를 진솔하게 표현하면서 갈등을 조정한다.","h":["이 성취기준은 갈등을 조정할 수 있는 대화 방법을 배움으로써 상대방과의 관계를 원만하게 유지할 수 있는 능력을 기르기 위해 설정하였다. 자신의 생각과 감정을 진솔하게 표현하는 것이 왜 중요한지 이해하기, 자신과 상대의 생각과 감정, 욕구 등을 정확히 파악하기, 어떠한 차이로 인해 갈등이 발생하게 되었는지 분석하기, 사건에 대한 주관적 해석을 배제하고 객관적으로 전달하기, 상황이나 사건에 대한 자신의 감정과 욕구를 진솔하게 표현하기, 자신이 상대에게 바라는 것이 무엇인지 구체적으로 요청하기 방법을 활용하여 갈등 조정하기, 갈등을 악화시킬 수 있는 표현 경계하기, 상대의 의견과 감정을 존중하기 등을 학습한다."]},{"교":"국어","c":"9국01-10","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"언어폭력의 문제점을 성찰하고, 서로를 존중하는 표현을 사용하여 말한다."},{"교":"국어","c":"9국01-11","과":"국어","학":"중1~3","영":"듣기⋅말하기","p":"듣기⋅말하기 과정을 점검하고 듣기⋅말하기의 어려움을 효과적으로 조정한다.","h":["이 성취기준은 듣기⋅말하기 전⋅중⋅후 과정을 점검하고 구어 의사소통 과정에서 발생하는 다양한 어려움을 효과적으로 조정하는 상위 인지 능력을 기르기 위해 설정하였다. 듣기⋅말하기 활동 후에 자신의 듣기⋅말하기 과정이 적절했는지 성찰하기, 듣기⋅말하기 과정에서 부딪히는 어려움 분석하기, 향후의 듣기⋅말하기를 효과적으로 수행하기 위해 조정해야 할 점을 찾아 개선 계획 세워보기, 말하기 불안을 느끼는 상황에서 이를 완화할 수 있는 방법을 연습하고 적용하기 등을 학습한다."]},{"교":"국어","c":"9국02-01","과":"국어","학":"중1~3","영":"읽기","p":"읽기는 사회⋅문화적 맥락에서 의미를 구성하는 과정임을 이해하며 사회적 독서에 참여하고 사회적 독서 문화 형성에 기여한다.","h":["이 성취기준은 읽기가 다양한 사회⋅문화적 맥락에 속한 공동체 구성원들이 상호 작용하며 의미를 구성하는 과정임을 이해하고 사회적 독서 문화 형성에 기여하도록 하기 위해 설정하였다. 독자는 자신이 처한 상황이나 사회⋅문화, 역사적 배경에 따라 의미를 형성해 간다. 또한 공동체 구성원들이 구성한 의미를 협력적으로 소통함에 따라 타인의 삶에 대한 이해나 공동체가 지향해야 할 가치를 발견할 수 있다. 사회⋅문화적으로 가치 있는 주제의 글을 선정하여 읽기, 사회⋅문화적 맥락을 고려하여 필자의 의도 파악하기, 독서 토론을 통해 구성원 간의 다양한 의미 교환하기, 사회⋅문화적 맥락에서 새로운 의미 발견하기, 사회적 독서 문화 형성하기 등을 학습한다."]},{"교":"국어","c":"9국02-02","과":"국어","학":"중1~3","영":"읽기","p":"읽기 목적과 글의 구조를 고려하며 글을 효과적으로 요약한다."},{"교":"국어","c":"9국02-03","과":"국어","학":"중1~3","영":"읽기","p":"독자의 배경지식과 글에 나타난 정보 등을 활용하여 글에 드러나지 않은 의도나 관점을 추론하며 읽는다."},{"교":"국어","c":"9국02-04","과":"국어","학":"중1~3","영":"읽기","p":"복합양식으로 구성된 글이나 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며 읽는다.","h":["이 성취기준은 복합양식으로 구성된 글이나 자료를 내용과 형식의 측면에서 비판적으로 평가하며 읽을 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 환경에서는 문자 언어로만 이루어진 단일양식뿐만 아니라 문자, 소리, 그림, 사진, 동영상 등 다양한 기호가 함께 어우러진 복합양식의 글이나 자료를 비판적으로 읽을 수 있어야 한다. 단일양식과 복합양식의 글이나 자료 비교하기, 복합양식의 글이나 자료가 작성된 맥락 파악하기, 복합양식으로 구성된 글이나 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며 읽기 등을 학습한다."]},{"교":"국어","c":"9국02-05","과":"국어","학":"중1~3","영":"읽기","p":"글에 사용된 다양한 설명 방법과 논증 방법을 파악하고, 그 타당성을 평가하며 읽는다."},{"교":"국어","c":"9국02-06","과":"국어","학":"중1~3","영":"읽기","p":"동일한 화제를 다룬 여러 글이나 자료를 주제 통합적으로 읽는다.","h":["이 성취기준은 동일한 화제를 다룬 여러 글이나 자료를 비판적으로 읽고 자신의 관점에 따라 의미를 재구성할 수 있는 주제 통합적 읽기 능력을 기르기 위해 설정하였다. 동일한 화제에 대해 서로 다른 관점을 지닌 글을 대조하며 읽거나 비슷한 주제를 담은 다양한 형식을 비교하며 읽으면서, 독자는 편견이나 선입견을 배제하고 합리적으로 판단할 수 있게 된다. 여러 글이나 자료를 비교하며 읽는 과정에서 독자는 화제와 관련된 쟁점에 대한 충분한 이해를 바탕으로 자신의 관점을 세울 수 있다. 관점이나 형식이 다른 다양한 글이나 자료를 비교⋅분석하기, 대상 화제에 대한 자신의 관점 수립하기, 서로 다른 관점과 형식의 글을 자신의 관점을 토대로 통합하기, 자신의 관점에 따라 의미를 구성하고 표현하기 등을 학습한다."]},{"교":"국어","c":"9국02-07","과":"국어","학":"중1~3","영":"읽기","p":"진로나 관심 분야에 대한 다양한 책이나 자료를 스스로 찾아 읽는다.","h":["이 성취기준은 자신의 진로나 관심 분야에 대한 책이나 자료 등을 스스로 탐색하고 선정하여 읽는 능력을 기르기 위해 설정하였다. 학습자가 다양한 글이나 자료를 자기 선택적으로 읽으며 주체적으로 자신의 진로나 관심 분야를 탐색할 수 있도록 한다. 학습자가 관심을 가지고 있는 진로나 관심 분야를 파악하기, 도서관이나 인터넷 등에서 자신의 진로 탐색이나 관심 분야에 대한 깊이 있는 이해를 위해 적합한 책이나 자료를 탐색하고 선정하기, 필요한 정보를 선별하며 읽기, 진로나 관심 분야가 유사한 학습자 간에 읽기 결과를 공유하기 등을 학습한다."]},{"교":"국어","c":"9국02-08","과":"국어","학":"중1~3","영":"읽기","p":"자신의 독서 상황과 수준에 맞는 글을 선정하고 읽기 과정을 점검⋅조정하며 읽는다."},{"교":"국어","c":"9국03-01","과":"국어","학":"중1~3","영":"쓰기","p":"대상의 특성에 적합한 설명 방법을 활용하여 글을 쓴다.","h":["이 성취기준은 대상의 특성에 적합한 설명 방법을 활용하여 독자가 이해하기 쉬운 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 대상과 관련한 독자의 배경지식 및 관심 고려하기, 정의, 인과, 분석, 분류 등 다양한 설명 방법을 익히고 전달하고자 하는 정보의 특성을 고려하여 설명 방법 활용하기, 대상의 특성을 효과적으로 전달하기 위한 글의 구조 및 표현 방법 이해하기 등을 학습한다."]},{"교":"국어","c":"9국03-02","과":"국어","학":"중1~3","영":"쓰기","p":"복수의 자료를 활용하여 다양한 형식으로 정보를 전달하는 글을 쓴다.","h":["이 성취기준은 둘 이상의 자료를 활용하여 다양한 형식으로 보고서나 설명문을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 객관적인 정보의 공유와 소통을 위해 다양한 정보를 담고 있는 복수의 자료 활용하기, 정보를 전달하는 글의 내용을 생성하는 과정에서 책, 신문, 인터넷 등 다양한 매체에서 정보 수집하기, 수집한 정보의 중요도 분석하기, 수집한 정보 통합하기, 쓰기 윤리를 지키며 자료 활용하기, 문자 언어와 함께 도표, 그림, 사진 등을 활용하여 정보를 전달하기 등을 학습한다."]},{"교":"국어","c":"9국03-03","과":"국어","학":"중1~3","영":"쓰기","p":"주장을 뒷받침할 수 있는 타당한 근거를 들고 적절한 표현을 사용하여 주장하는 글을 쓴다."},{"교":"국어","c":"9국03-04","과":"국어","학":"중1~3","영":"쓰기","p":"의견 차이가 있는 사안에 대해 자료를 수집하고 사회⋅문화적 맥락을 고려하며 주장하는 글을 쓴다.","h":["이 성취기준은 의견 차이가 있는 사안이 발생한 상황을 이해하고 쟁점을 분석하여 자신의 주장을 제시하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 의견 차이가 있는 사안 찾기, 쟁점을 분석하고 쟁점에 대한 다양한 의견과 자료를 수집하기, 쟁점에 대한 자신의 관점을 수립하여 주장을 논리적으로 전개하기, 자신의 주장이 사회⋅문화적 맥락 내에서 수용될 수 있도록 제시하기 등을 학습한다."]},{"교":"국어","c":"9국03-05","과":"국어","학":"중1~3","영":"쓰기","p":"자신의 삶과 경험을 바탕으로 정서를 진솔하게 표현하는 글을 쓴다."},{"교":"국어","c":"9국03-06","과":"국어","학":"중1~3","영":"쓰기","p":"다양한 표현을 활용하여 자신의 생각과 느낌이 드러나는 글을 쓰고 독자와 공유한다."},{"교":"국어","c":"9국03-07","과":"국어","학":"중1~3","영":"쓰기","p":"복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하며 글을 쓴다.","h":["이 성취기준은 글을 쓸 때 복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하는 능력을 기르기 위해 설정하였다. 문자, 소리, 그림, 사진, 동영상 등이 결합된 복합양식 자료의 특징 및 유형 이해하기, 복합양식 자료를 활용하여 내용 생성하기, 글의 유형을 고려하여 내용 조직하기 등을 학습한다."]},{"교":"국어","c":"9국03-08","과":"국어","학":"중1~3","영":"쓰기","p":"쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고, 독자를 고려하여 글을 고쳐 쓴다.","h":["이 성취기준은 쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고 독자를 고려하여 글을 고쳐 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 독자를 고려하여 글을 고쳐 쓰는 것은 글의 내용 차원, 조직 차원, 표현 차원에서 두루 이루어질 필요가 있다. 쓰기 과정과 전략을 점검⋅조정하기, 독자의 지식, 기대나 요구, 태도를 분석하기, 독자 분석의 결과를 반영하여 글을 고쳐쓰기 등을 학습한다."]},{"교":"국어","c":"9국03-09","과":"국어","학":"중1~3","영":"쓰기","p":"언어 공동체의 구성원인 필자로서 자신에 대해 성찰하며, 윤리적 소통 문화를 형성하는 데에 기여한다.","h":["이 성취기준은 필자가 자신과 자신의 쓰기 과정 및 결과를 성찰하여 언어 공동체의 구성원으로 성장하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 필자로서 자기 자신이 어떤 사람인지 필자 정체성 성찰하기, 언어 공동체의 개념 이해하기, 윤리적 소통 문화의 특성과 필요성 이해하기, 책임감 있게 글을 쓰는 태도 기르기 등을 학습한다."]},{"교":"국어","c":"9국04-01","과":"국어","학":"중1~3","영":"문법","p":"국어의 음운 체계와 문자 체계를 이해하고 국어생활에 활용한다.","h":["이 성취기준은 국어의 음운 체계와 문자 체계를 종합적으로 탐구함으로써, 말소리와 문자의 관련성을 체계적으로 이해하도록 하기 위해 설정하였다. 말소리와 음운의 관계, 음운 체계에 대한 이해를 바탕으로 발음 및 표기를 정확하게 할 수 있도록 한다. 이와 관련지어 훈민정음 창제 정신과 원리를 중심으로 국어의 문자 체계를 탐구하고, 디지털⋅정보화 시대에 한글이 지니는 가치 및 발전 방향을 다각도로 탐색하도록 한다."]},{"교":"국어","c":"9국04-02","과":"국어","학":"중1~3","영":"문법","p":"단어의 짜임을 분석하여 새말 형성의 원리를 이해한다."},{"교":"국어","c":"9국04-03","과":"국어","학":"중1~3","영":"문법","p":"품사의 종류와 특성을 이해하고 국어 자료를 분석한다.","h":["이 성취기준은 품사의 종류와 특성을 이해하고 이를 바탕으로 다양한 국어 자료를 분석할 수 있는 능력을 기르기 위해 설정하였다. 품사 분류를 통해 우리말에 대한 이해의 폭을 넓힘은 물론 품사의 특성을 고려해 정확하고 적절하게 단어를 사용할 수 있도록 한다. 또한, 문장을 단어별로 나누어 문장 안에서의 쓰임을 분석하거나, 글이나 담화에 쓰인 단어의 정확성⋅적절성을 평가하거나, 단어 부류의 빈도나 분포에 따라 글이나 담화의 특성을 간략히 기술하는 등, 품사 지식을 활용해 국어 자료의 특성을 간단히 분석해 봄으로써 품사가 국어 탐구를 위한 기초적이고 유용한 도구임을 이해하도록 한다."]},{"교":"국어","c":"9국04-04","과":"국어","학":"중1~3","영":"문법","p":"문장의 짜임을 이해하고 표현 효과를 고려하여 문장을 구성한다."},{"교":"국어","c":"9국04-05","과":"국어","학":"중1~3","영":"문법","p":"피동 표현과 인용 표현의 의도와 효과를 분석하고 상황에 맞게 활용한다.","h":["이 성취기준은 피동 표현과 인용 표현을 활용해 의도를 정확하고 적절하게 표현하고, 그 효과를 분석하는 능력을 기르기 위해 설정하였다. 피동 표현과 인용 표현의 형식적 특성과 기능, 표현 효과를 학습하는 데 중점을 둔다. 피동 표현과 인용 표현의 사용을 표현 의도와 관련지어 이해하고, 그 효과를 분석하여 실제 국어생활에서 상황 맥락에 맞게 적절하게 활용할 수 있도록 한다."]},{"교":"국어","c":"9국04-06","과":"국어","학":"중1~3","영":"문법","p":"한글 맞춤법의 기본 원리와 내용을 이해하고 국어생활에 적용한다.","h":["이 성취기준은 한글 맞춤법의 기본 원리를 이해하여 정확하고 교양 있는 국어생활을 영위하도록 하기 위해 설정하였다. ‘공통국어2’의 한글 맞춤법 관련 성취기준에서 내용이 심화⋅연계됨을 고려하여, ‘소리대로 적되 어법에 맞도록 함을 원칙으로 한다.’라는 한글 맞춤법 총칙을 중심으로 한글 맞춤법의 기본 원리를 탐구하는 데 중점을 두고, 음운 변동에 대한 지식을 필요로 하는 한글 맞춤법 조항 등은 다루지 않는다."]},{"교":"국어","c":"9국04-07","과":"국어","학":"중1~3","영":"문법","p":"세대⋅분야⋅매체에 따른 어휘의 양상과 쓰임을 분석하고 다양한 집단과 사회의 언어에 관용적 태도를 지닌다.","h":["이 성취기준은 세대⋅분야⋅매체에 따라 어휘가 변이되고 팽창하는 양상을 다양한 국어 자료를 바탕으로 탐구하고, 이를 바탕으로 다양한 집단과 사회의 언어에 대해 관용적 태도를 지니도록 하기 위해 설정하였다. 어휘는 언어 사용의 구체적인 맥락과 세대, 분야, 매체 등의 요인에 따라 다양한 양상으로 나타난다. 청소년어, 노인어, 전문어, 인터넷 언어, 새말 등을 대상으로 어휘의 특성과 쓰임, 변이와 생성 과정에 대한 탐구를 통해, 이들 어휘를 중심으로 한 언어 실천이 상황 맥락 및 사회･문화적 맥락을 고려한 사회적 행위임을 이해하고 다양한 집단과 사회의 언어에 대해 관용적 태도를 견지할 수 있도록 한다."]},{"교":"국어","c":"9국04-08","과":"국어","학":"중1~3","영":"문법","p":"자신과 주변의 다양한 국어 실천 양상을 비판적으로 분석하여 언어와 자아 및 세계 사이의 관계를 인식한다.","h":["이 성취기준은 다양한 국어 자료에 대한 분석과 성찰을 통해 언어의 본질과 힘을 인식하고, 언어 주체로서 능동적인 국어생활을 영위하도록 하기 위해 설정하였다. 욕설이나 부정적 표현 및 말투 등이 개인의 정체성 형성에 미치는 영향을 분석하고, 의도를 제대로 전달하지 못하는 표현, 편견 및 고정 관념을 유발하거나 사실을 왜곡하는 표현, 갈등을 조장하거나 강화하는 표현, 규범과 관습에 적절하지 않은 표현 등이 개인 간 관계 형성 및 언어 공동체에 미치는 영향을 성찰하고 비판하여, 언어가 자아 및 세계를 구성하는 핵심 자원임을 이해하도록 한다."]},{"교":"국어","c":"9국05-01","과":"국어","학":"중1~3","영":"문학","p":"운율, 비유, 상징의 특성과 효과에 유의하며 작품을 감상하고 창작한다."},{"교":"국어","c":"9국05-02","과":"국어","학":"중1~3","영":"문학","p":"갈등의 진행과 해결 과정을 파악하며 작품을 감상한다."},{"교":"국어","c":"9국05-03","과":"국어","학":"중1~3","영":"문학","p":"인간의 성장을 다룬 작품을 읽으며 문학의 가치를 내면화한다."},{"교":"국어","c":"9국05-04","과":"국어","학":"중1~3","영":"문학","p":"보는 이나 말하는 이의 특성과 효과를 파악하며 작품을 감상한다.","h":["이 성취기준은 시의 화자 또는 소설의 시점 및 서술자에 주목하여 작품을 깊이 있게 감상하는 능력을 기르게 하기 위해 설정하였다. 문학 작품에서 누가 보는가, 누가 말하는가에 따라 전달하는 내용이나 작품의 분위기가 크게 달라진다. 보는 이나 말하는 이가 누구인지, 어떤 특성을 가지고 있는지를 파악하고, 보는 이나 말하는 이의 특성이 작품 전체의 주제나 분위기에 어떤 효과를 미치는가에 주목하며 작품을 감상하도록 한다."]},{"교":"국어","c":"9국05-05","과":"국어","학":"중1~3","영":"문학","p":"작품에 반영된 사회⋅문화적 상황을 이해하며 작품을 감상한다."},{"교":"국어","c":"9국05-06","과":"국어","학":"중1~3","영":"문학","p":"자신의 경험을 개성적인 발상과 표현으로 형상화한다.","h":["이 성취기준은 학습자가 문학을 수용하는 데에 그치지 않고 자신의 삶의 경험을 창의적으로 표현하며 문학 문화를 향유할 수 있도록 하기 위해 설정하였다. 학습자로 하여금 여러 작품들의 개성적 발상과 표현을 참고하면서 반어, 역설, 풍자 등 다양한 문학적 표현 방식을 활용하여 자신의 경험을 개성적으로 형상화하도록 한다. 이 과정에서 학습자가 자신의 경험을 성찰하고 새롭게 의미를 부여하며 가치를 찾도록 하는 한편, 실제 작품 생산의 경험을 통해 개성적인 발상 및 표현에 대한 이해를 심화할 수 있도록 한다."]},{"교":"국어","c":"9국05-07","과":"국어","학":"중1~3","영":"문학","p":"연관성이 있는 다른 작품들과의 관계를 파악하며 작품을 감상한다.","h":["이 성취기준은 작품들 간의 관계에 주목하며 작품을 감상할 수 있게 하기 위해 설정하였다. 다른 문학 작품들과의 관계 속에서 작품을 다각도로 살핀다면 독자는 작품에 대해 더 다양하고 깊이 있는 감상이 가능해진다. 통시적⋅공시적으로 유사한 주제나 형식을 가진 작품들, 서로 영향을 주고받은 작품들을 찾아보고, 작품 간의 공통점 및 차이점, 상호 간의 연관 관계를 파악하며 작품을 감상하도록 한다. 또한 학습자가 스스로 여러 작품 간의 관계를 찾아 새로운 의미 연관성의 맥락을 만들어 볼 수 있도록 한다."]},{"교":"국어","c":"9국05-08","과":"국어","학":"중1~3","영":"문학","p":"근거를 바탕으로 작품을 해석하고, 다른 해석들과 비교하여 자신의 해석을 평가한다.","h":["이 성취기준은 주체적인 관점에서 작품을 해석하며 평가할 수 있는 능력을 기르게 하기 위해 설정하였다. 작품을 해석할 때는 작품 속의 내용적⋅형식적 근거나 작품 밖의 맥락적 근거 등을 토대로 하여 작품을 해석하는 것이 필요하다. 작품 해석은 독자의 지식, 경험, 가치관 등을 바탕으로 이루어지는 과정이기 때문에 독자에 따라 얼마든지 달라질 수 있다. 다만 이때 작품을 잘못 이해하는 오독을 범하지 않으려면 작품 안과 밖의 여러 근거를 바탕으로 작품을 해석해야 한다. 적절한 근거를 들어 작품을 해석하고, 이를 다른 사람들의 해석과 비교하면서 자기 해석의 적절성을 검토하도록 한다."]},{"교":"국어","c":"9국05-09","과":"국어","학":"중1~3","영":"문학","p":"문학을 통해 타자를 이해하고 공동체의 문제에 참여하는 태도를 지닌다.","h":["이 성취기준은 내가 아닌 다른 사람들, 그리고 다른 존재들을 이해하고, 그들에 공감하는 능력을 기르며, 그들과 어떻게 함께 살아갈 것인가를 공동체의 관점에서 고려하고, 공동체의 현안에 참여하는 태도를 가지게 하기 위해 설정하였다. 타자를 이해하는 능력은 평화로운 공존과 협력적 연대를 위한 핵심적 요인이다. 작품 속 인물들의 생각과 마음을 이해하고 다양한 삶을 간접적으로 체험하도록 함으로써 타자에 대한 이해와 공감의 폭을 넓힐 수 있도록 한다. 또한 가정, 학교, 이웃 사회, 생태환경 등 다양한 공동체의 문제와 그 해결 과정을 담은 작품을 읽고, 학습자가 속한 공동체의 문제에 대한 인식 능력과 실천적 참여 능력을 함양하도록 한다."]},{"교":"국어","c":"9국06-01","과":"국어","학":"중1~3","영":"매체","p":"대중매체와 개인 인터넷 방송의 특성과 영향력을 비교한다."},{"교":"국어","c":"9국06-02","과":"국어","학":"중1~3","영":"매체","p":"소통 맥락과 수용자 참여 양상을 고려하여 상호 작용적 매체를 분석한다.","h":["이 성취기준은 상호 작용적 매체의 특성을 이해하고 상황 맥락과 사회⋅문화적 맥락에 맞게 소통하는 능력을 기르기 위해 설정하였다. 예를 들어 사회 관계망 서비스(SNS)는 생각, 의견, 관점 등을 비교적 자유롭게 공유할 수 있는 개방적인 공간이며, 학교나 학급의 누리집은 공적인 정보를 공유하는 데 초점을 둔 공간이다. 이처럼 소통 목적, 소통 공간의 특성에 따라 참여자들이 소통하는 방식이 어떻게 달라지는지 다양한 각도에서 분석해 보고 자신의 소통 방식의 적절성에 대해서도 점검해 보도록 한다."]},{"교":"국어","c":"9국06-03","과":"국어","학":"중1~3","영":"매체","p":"복합양식성을 고려하여 영상 매체 자료를 제작하고 공유한다."},{"교":"국어","c":"9국06-04","과":"국어","학":"중1~3","영":"매체","p":"매체 소통에서의 권리와 책임을 이해하고, 수용자의 반응을 고려하며 매체 자료의 제작 과정을 성찰한다."},{"교":"국어","c":"9국06-05","과":"국어","학":"중1~3","영":"매체","p":"매체 자료의 재현 방식을 이해하고 광고나 홍보물을 분석한다.","h":["이 성취기준은 매체 텍스트가 현실을 재현하는 방식을 이해하는 능력을 기르기 위해 설정하였다. 매체 자료는 제작자의 의도와 관점이 반영된 재현물이라는 것에 대한 이해를 바탕으로 다양한 광고나 홍보물을 살펴보며 사건, 쟁점, 인물 등을 표현하기 위해 어떤 문구나 이미지가 선택되거나 배제되었는지를 탐구하고, 사회상이나 특정 집단에 대해 어떤 고정 관념이 반영되어 있는지 분석하도록 한다."]},{"교":"국어","c":"9국06-06","과":"국어","학":"중1~3","영":"매체","p":"사회⋅문화적 맥락을 고려하여 매체 자료의 공정성을 평가한다.","h":["이 성취기준은 매체 자료를 공정성의 측면에서 비판적으로 이해하는 능력을 기르기 위해 설정하였다. 타당하고 신뢰성 있는 정보라 하더라도 그것이 의도에 따라 과도하게 반복, 과장, 축소되어 전달되는 경우에는 공정한 매체 자료라고 보기 어렵다. 특정 사건이나 쟁점을 다루는 매체 자료를 비교하고, 그 매체 자료가 제작된 사회⋅문화적 맥락이 어떠한지 파악한다. 그리고 매체 자료가 특정 제품이나 업체를 홍보하고 있지는 않은지, 다양한 주장을 전달하지 않고 특정 입장을 지닌 주장을 전달하면서 한쪽으로 치우쳐 있지는 않은지, 피상적인 사실 전달에 그쳐 특정한 쟁점이나 사건에 대한 진실을 간과하거나 호도하고 있지는 않은지 등을 점검한다."]},{"교":"국어","c":"10공국1-01-01","과":"공통국어1","학":"고1","영":"듣기⋅말하기","p":"대화의 원리를 고려하여 대화하고 자신의 듣기⋅말하기 과정과 공동체의 담화 관습을 성찰한다.","h":["이 성취기준은 대화의 원리를 기반으로 언행적 목적과 관계적 목적을 두루 달성할 수 있는 대화 능력을 기르고, 공동체 담화 관습을 비판적으로 성찰하고 개선하기 위한 계기를 마련하기 위해 설정하였다. 협력의 원리, 공손성의 원리, 체면 유지의 원리 등 대표적인 대화의 원리를 바탕으로 대화하기, 자신의 듣기⋅말하기 과정과 전략 점검하기, 담화 공동체의 과거와 현재의 담화 관습 조사하기, 담화 관습에 대해 비판적으로 인식하기, 오늘날의 시대 상황을 고려하여 담화 관습을 보다 바람직한 방향으로 개선하기 위한 방안 모색하기 등을 학습한다."]},{"교":"국어","c":"10공국1-01-02","과":"공통국어1","학":"고1","영":"듣기⋅말하기","p":"논제의 필수 쟁점별로 논증을 구성하고 논증이 타당한지 평가하며 토론한다."},{"교":"국어","c":"10공국1-02-01","과":"공통국어1","학":"고1","영":"읽기","p":"다양한 글이나 자료를 읽으며 논증의 타당성을 평가하고 자신의 관점을 바탕으로 논증을 재구성한다.","h":["이 성취기준은 글이나 자료에 사용된 논증 방법을 파악하고 논증의 타당성을 평가한 후, 자신의 관점에 기반하여 논증을 비판적으로 재구성하며 읽는 능력을 기르기 위해 설정하였다. 논증이란 주장이 정당함을 입증하기 위해 이유와 근거를 제시하는 방식을 의미하기도 하고 주장과 이를 뒷받침하는 이유와 근거 간의 관계를 의미하기도 한다. 글에 나타난 논증의 요소와 방법 파악하기, 필자의 주장과 이를 뒷받침하는 이유와 근거, 반론에 대한 반박 등 논증 요소의 타당성 평가하기, 논증 방법의 설득 효과 평가하기, 평가의 결과를 토대로 자신의 관점을 세워 필자의 논증을 재구성하기 등을 학습한다."]},{"교":"국어","c":"10공국1-02-02","과":"공통국어1","학":"고1","영":"읽기","p":"자신의 진로나 관심 분야와 관련한 다양한 글이나 자료를 찾아 주제 통합적으로 읽고 읽은 결과를 공유한다.","h":["이 성취기준은 자신의 진로나 관심 분야에 대한 다양한 글이나 자료를 자기 선택적으로 읽으며 읽기 목적에 알맞게 정보를 통합하고 재구성하며 읽는 능력을 기르기 위해 설정하였다. 진로와 직업에 관련된 도서 목록이나 도서 정보를 탐색한 후 자신의 진로나 관심 분야를 고려하여 다양한 글이나 책, 매체 자료를 찾아 읽기, 진로나 관심 분야가 유사한 학습자 간에 모둠을 구성하고 도서나 자료 목록 작성하기, 관심 분야에 관한 도서나 자료를 읽으며 자신의 진로 의사 결정 및 진로 개발에 필요한 유의미한 정보를 선별하기, 유의미한 정보들을 통합하여 진로 분야에 대한 정보를 모둠원 간에 공유하기, 읽기 목적을 고려하여 포트폴리오 제작하기, 독서 토론이나 발표 등을 통해 읽은 결과 공유하기 등을 학습한다."]},{"교":"국어","c":"10공국1-03-01","과":"공통국어1","학":"고1","영":"쓰기","p":"내용 전개의 일반적 원리를 고려하여 사회적 쟁점에 대한 자신의 견해를 정교하게 표현하는 글을 쓴다."},{"교":"국어","c":"10공국1-03-02","과":"공통국어1","학":"고1","영":"쓰기","p":"다양한 언어 공동체의 특성을 고려하며 필자의 개성이 드러나는 글을 쓴다.","h":["이 성취기준은 언어 공동체 구성원으로서 필자의 개성이 드러나는 글을 쓰는 경험을 통해 의사소통 문화의 발전을 도모하는 태도를 기르기 위해 설정하였다. 지역, 세대, 성, 문화에 따라 언어 공동체는 다양하게 구성될 수 있으며 이들이 언어 사용을 통해 삶을 공유한다는 점에서 언어 사용자에게는 바람직한 언어문화를 가꾸어야 할 책무가 있음을 이해하고 실천해야 한다. 또한 언어 공동체의 특성이 고정된 것이 아니라 구성원의 참여를 통해 새로운 의사소통 문화를 만들어 갈 수 있으므로 필자의 개성이 드러나는 글이 언어 공동체의 확장 및 발전에 기여할 수 있음을 이해해야 한다. 언어 공동체의 특성 및 다양성에 대해 인식하기, 글을 쓰는 경험을 통해 자아의 성장과 언어 공동체의 발전에 기여하기, 일상의 경험에 가치를 부여하는 글 쓰기, 필자의 고유한 목소리가 드러나는 개성 있는 글 쓰기 등을 학습한다."]},{"교":"국어","c":"10공국1-04-01","과":"공통국어1","학":"고1","영":"문법","p":"언어 공동체가 다변화함에 따라 다양해진 언어 실천 양상을 분석하고 언어 주체로서 책임감을 가지며 국어생활을 한다.","h":["이 성취기준은 점차 복잡해지는 언어 공동체의 다양한 언어 실천 양상을 이해하고 책임감 있는 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 사회가 다원화됨에 따라 새롭게 등장하는 언어 실천의 양상을 다루되, 특히 다문화 사회에 진입함에 따른 언어 공동체의 다변화 문제, 남북한 언어 실천의 이질화 문제와 통일 시대를 대비한 동질성 회복 방안 등을 중점적으로 다루어, 의사소통 상황에서 발생할 수 있는 갈등과 차별을 예상하고 이에 대응하며, 언어 주체로서 책임감을 가지고 언어 실천에 참여하는 태도를 기르도록 한다."]},{"교":"국어","c":"10공국1-04-02","과":"공통국어1","학":"고1","영":"문법","p":"음운 변동을 탐구하여 발음과 표기에 올바르게 적용한다."},{"교":"국어","c":"10공국1-04-03","과":"공통국어1","학":"고1","영":"문법","p":"다양한 분야의 글과 담화에 나타난 문법 요소 및 어휘의 표현 효과를 평가하고 적절한 표현을 생성한다.","h":["이 성취기준은 다양한 분야의 글과 담화에서 문법 요소와 어휘를 통해 실현되는 언어 주체의 태도와 인식을 파악하고 표현 효과를 평가하여, 문법 요소와 어휘를 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 참여자 간의 관계나 장면의 격식성 등 상황 맥락에 따라 달리 쓰인 높임 표현의 효과, 시간의 경과가 드러나거나 시간에 대한 인식이 중요한 기능을 하는 글이나 담화에 쓰인 시간 표현의 효과, 신문 기사, 뉴스 보도, 학술문, 토론, 강연 등 특정 글이나 담화 종류에서 두드러지게 쓰이는 피동 표현과 인용 표현의 효과 등을 언어 주체의 태도 및 인식과 관련하여 종합적으로 탐구하고, 글이나 담화 맥락에 적절한 표현을 생성하도록 한다. 또한, 화제에 대한 필자의 태도나 입장이 드러나는 어휘, 학술적인 글이나 담화에 사용되어 논리 및 사고 전개 과정을 드러내는 사고 도구어와 전문어 등을 대상으로 하여, 글이나 담화의 맥락이나 종류, 분야에 따른 어휘 선택과 효과를 다루고 이러한 어휘를 활용하여 글이나 담화에 적절한 표현을 생성하도록 한다."]},{"교":"국어","c":"10공국1-05-01","과":"공통국어1","학":"고1","영":"문학","p":"문학 소통의 특성을 고려하며 문학 소통에 참여한다.","h":["이 성취기준은 문학 소통의 특성을 이해하고 그 효과를 생각하며 능동적으로 문학을 향유하는 능력을 기르게 하기 위해 설정하였다. 문학은 일상적 언어 활동과는 달리 한 작품을 둘러싸고 작가 맥락, 독자 맥락, 사회⋅문화적 맥락, 문학사적 맥락 등이 다층적으로 작용하는 특성이 있다. 또한 실용적 목적보다는 허구와 상상을 통해 아름다움이나 재미를 추구하는 경향이 강하며, 작가와 독자의 소통에 작품의 아름다움과 가치를 평가하는 비평의 담론이 더하여져서 더욱 풍부한 소통의 장이 펼쳐진다. 학습자로 하여금 이러한 문학 소통의 특성을 이해하고, 능동적인 감상자의 역할은 물론 전문적이지는 않더라도 작품을 쓰거나 비평하는 활동을 시도하면서 문학 소통에 주체적으로 참여하도록 한다."]},{"교":"국어","c":"10공국1-05-02","과":"공통국어1","학":"고1","영":"문학","p":"갈래에 따른 형상화 방법의 특성을 고려하며 작품을 수용한다."},{"교":"국어","c":"10공국1-05-03","과":"공통국어1","학":"고1","영":"문학","p":"작품 구성 요소의 유기적 관계와 맥락에 유의하여 작품을 수용하고 생산한다.","h":["이 성취기준은 문학 작품 내적으로는 구성 요소들이 유기적 관계를 형성하고 있고, 외적으로는 다양한 맥락들과 연관되어 있음을 이해하며 작품을 수용하고 생산하는 능력을 기르게 하기 위해 설정하였다. 문학을 수용하고 생산할 때는 문학 작품의 각 구성 요소들이 유기적 관계를 맺음으로써 개별 요소의 합을 넘어서는 고유한 가치와 개성을 가지게 된다는 점에 유의할 필요가 있다. 또 문학 작품은 시간이 흐름에 따라 새로운 독자와 새로운 시대를 만나게 되고 다른 작품들과의 관계도 새롭게 형성되기 때문에 이전과는 다른 각도에서 조명되며 새로운 의미와 가치를 가지게 된다는 점도 중요하게 인식할 필요가 있다. 이러한 점들에 유의하면서 작품 구성 요소들의 관계, 그리고 작품을 둘러싼 맥락을 다각도로 살피며 작품을 수용하고 생산할 수 있게 한다."]},{"교":"국어","c":"10공국1-06-01","과":"공통국어1","학":"고1","영":"매체","p":"사회적 의제를 다룬 매체 자료를 비판적으로 분석한다.","h":["이 성취기준은 사회적 의제를 다룬 매체 자료를 주체적으로 분석하고 수용할 수 있는 역량을 기르기 위해 설정하였다. 현대 사회의 사회적 의제를 다룬 영화, 뉴스, 개인 방송 등 다양한 유형의 매체 자료를 사회⋅문화적 맥락을 고려하여 비판적으로 분석하여 매체 자료가 전달하는 주제를 주체적으로 수용할 수 있도록 한다."]},{"교":"국어","c":"10공국1-06-02","과":"공통국어1","학":"고1","영":"매체","p":"소통 맥락과 매체 특성을 고려하여 다양한 목적의 매체 자료를 제작한다.","h":["이 성취기준은 매체 소통의 맥락과 특성을 이해하고, 적절한 매체를 선정하여 매체 자료를 제작하는 역량을 기르기 위해 설정하였다. 매체 소통의 영향력을 이해하고 소통 목적에 맞는 매체를 선정하여 지역 문화 소개하기, 캠페인 참여하기 등 사회⋅문화적 특성을 반영한 다양한 매체 자료를 책임감 있게 제작함으로써 사회적 소통에 능동적으로 참여한다."]},{"교":"국어","c":"10공국2-01-01","과":"공통국어2","학":"고1","영":"듣기⋅말하기","p":"청중의 관심과 요구에 맞게 내용을 구성하여 발표하고 청중의 질문에 효과적으로 답변한다.","h":["이 성취기준은 청중과 상호 작용하는 발표 능력을 기르기 위해 설정하였다. 예상 청중의 관심사, 배경지식, 주제에 대한 태도, 지적 수준 등을 분석하기, 청중 분석 결과를 바탕으로 청중에게 적합한 내용을 선정하기, 발표 내용을 청중이 이해하기 쉽도록 요점을 중심으로 체계적으로 조직하기, 청중의 관심을 유지하기 위한 다양한 전략을 활용하여 발표하기, 청중과 질의응답할 수 있는 시간을 확보하기 위해 발표 시간 조절하기, 청중의 질문에 효과적으로 답변하며 청중과 소통하기 등을 학습한다."]},{"교":"국어","c":"10공국2-01-02","과":"공통국어2","학":"고1","영":"듣기⋅말하기","p":"쟁점과 이해관계를 고려하여 문제를 해결할 수 있는 대안을 탐색하며 협상한다.","h":["이 성취기준은 협상에 대한 이해와 실행을 통해 개인 또는 집단의 갈등을 조정하여 문제를 해결하는 능력을 기르기 위해 설정하였다. 협상의 중요성과 협상이 필요한 상황 이해하기, 협상의 진행 절차 이해하기, 일련의 절차에 따라 협상 의제로 부각된 쟁점을 중심으로 의견 조정하기, 표면적으로 드러난 입장의 이면에 숨겨진 근원적인 동기를 고려하여 대안 마련하기, 상대의 의견을 존중하며 표현하기 등을 학습한다."]},{"교":"국어","c":"10공국2-01-03","과":"공통국어2","학":"고1","영":"듣기⋅말하기","p":"사회적 소통 과정에서 말의 영향력을 고려하여 책임감 있게 듣고 말한다."},{"교":"국어","c":"10공국2-02-01","과":"공통국어2","학":"고1","영":"읽기","p":"복합양식으로 구성된 글이나 자료에 내재된 필자의 관점이나 의도, 표현 방법을 평가하며 읽는다."},{"교":"국어","c":"10공국2-02-02","과":"공통국어2","학":"고1","영":"읽기","p":"동일한 화제의 글이나 자료라도 서로 다른 관점과 형식으로 표현됨을 이해하며 읽기 목적을 고려하여 글이나 자료를 주제 통합적으로 읽는다.","h":["이 성취기준은 동일한 화제에 대하여 다양한 관점과 형식으로 작성된 글이나 자료를 읽으며 읽기 목적에 따라 글이나 자료를 비판적으로 재구성할 수 있는 주제 통합적 읽기 능력을 기르기 위해 설정하였다. 읽기 상황이나 과제와 관련하여 읽기 목적을 구체화하기, 글이나 자료를 비교 분석하기, 읽기 목적을 고려하여 유의미한 정보 선별하기, 정보 간의 상충되거나 모순되는 점을 확인하고 평가하기, 읽기 목적을 고려하며 화제에 대한 자신의 견해를 재구성하기 등을 학습한다."]},{"교":"국어","c":"10공국2-02-03","과":"공통국어2","학":"고1","영":"읽기","p":"의미 있는 사회적 독서 활동에 참여함으로써 타인과 교류하고 다양한 지식이나 정보, 삶에 대한 가치관 등을 이해하는 태도를 지닌다."},{"교":"국어","c":"10공국2-03-01","과":"공통국어2","학":"고1","영":"쓰기","p":"언어 공동체가 공유하는 작문 관습의 특성을 이해하고 쓰기 과정과 전략을 점검하며 책임감 있게 글을 쓴다."},{"교":"국어","c":"10공국2-03-02","과":"공통국어2","학":"고1","영":"쓰기","p":"논증 요소에 따른 분석을 바탕으로 효과적으로 내용을 조직하여 논증하는 글을 쓴다.","h":["이 성취기준은 논증 요소를 중심으로 글을 쓸 수 있는 능력을 기르기 위해 설정하였다. 논증의 요소는 주장과 그 주장을 지지하는 객관적 자료인 근거, 근거를 바탕으로 주장을 가능하게 하는 주관적 요인인 이유, 예상되는 반론과 이에 대한 반박 등을 포함한다. 논증 요소와 이들 요소 간의 관계, 연역과 귀납 등의 논증 방법을 활용하여 효과적으로 내용 조직하기 등을 학습한다."]},{"교":"국어","c":"10공국2-03-03","과":"공통국어2","학":"고1","영":"쓰기","p":"신뢰할 수 있는 정보를 종합하여 복합양식 자료가 포함된 공동 보고서를 쓴다.","h":["이 성취기준은 수집한 정보의 가치를 판단하고 정보를 종합하여 공동으로 글을 쓰는 능력을 기르기 위해 설정하였다. 특정 주제에 대하여 관심 있는 학습자들이 함께 모여서 연구를 수행하고 보고서를 작성하기 위한 공동 보고서 주제 찾기, 주제에 따른 목차 구성하기, 정보의 신뢰성 판단하며 자료 수집하기, 수집한 자료를 보고서의 형식에 맞게 조직하기, 복합양식 자료를 효과적으로 활용하기, 협력적 태도로 공동 보고서 작성하기 등을 학습한다."]},{"교":"국어","c":"10공국2-04-01","과":"공통국어2","학":"고1","영":"문법","p":"과거 및 현재의 국어생활에 나타나는 국어의 변화를 이해하고 국어문화 발전에 참여한다."},{"교":"국어","c":"10공국2-04-02","과":"공통국어2","학":"고1","영":"문법","p":"한글 맞춤법의 원리를 적용하여 국어생활을 성찰하고 문제를 해결한다.","h":["이 성취기준은 한글 맞춤법의 원리를 적용하여 자신의 국어생활을 성찰하고 실생활에서 발생하는 국어 문제를 해결하는 능력을 길러 교양 있는 표기 생활을 영위하도록 하기 위해 설정하였다. 중학교 1~3학년 ‘국어’의 한글 맞춤법 관련 성취기준에서 한글 맞춤법의 총칙을 중심으로 기본 원리에 대해 학습한 것을 바탕으로, 실제 국어생활에서 자주 혼동되는 표기나 띄어쓰기와 관련된 한글 맞춤법의 조항을 찾아 문제를 해결하도록 하는 데 중점을 둔다. 또한 ‘공통국어1’의 음운 변동 관련 성취기준에서 학습한 지식과 연계된 조항을 다루어 한글 맞춤법에 대한 이해를 심화할 수 있다."]},{"교":"국어","c":"10공국2-05-01","과":"공통국어2","학":"고1","영":"문학","p":"한국 문학사의 흐름을 고려하여 작품을 수용한다.","h":["이 성취기준은 개별 작품을 한국 문학사의 흐름 속에서 파악하고 그 가치를 이해하는 능력을 기르게 하기 위해 설정하였다. 한국 문학사가 전개되는 과정에 나타나는 특성, 갈래나 작품 형식의 변화, 향유층의 다양화 등을 고려하며 작품을 수용하게 되면, 개별 작품의 가치와 의미를 더 입체적으로 파악할 수 있게 된다. 한 작품이 다른 여러 작품들과 관계 맺는 양상은 물론 그 관계들로 형성되는 문학사적 맥락 속에서 개별 작품이 가지는 가치와 의의 등을 생각하면서 작품을 수용하도록 한다."]},{"교":"국어","c":"10공국2-05-02","과":"공통국어2","학":"고1","영":"문학","p":"주체적인 관점에서 작품을 해석하고 평가하며 문학을 생활화하는 태도를 지닌다.","h":["이 성취기준은 작품을 주체적인 관점에서 해석하고 작품에 대해 능동적으로 평가할 수 있는 안목을 기르게 하기 위해 설정하였다. 다른 사람의 생각을 존중하고 해석의 다양성에 대한 이해를 높이는 한편 자신의 해석과 평가를 설득력 있게 표현하는 경험을 바탕으로 문학을 주체적으로 즐기며 생활화하는 태도를 지닐 수 있도록 한다."]},{"교":"국어","c":"10공국2-06-01","과":"공통국어2","학":"고1","영":"매체","p":"매체 비평 자료를 비판적으로 수용하고 자신의 관점을 담아 매체 비평 자료를 제작한다.","h":["이 성취기준은 전문성 있는 기존의 매체 비평 자료에 대한 이해를 바탕으로 매체 자료를 비판적으로 수용하는 방법을 익히고, 더 나아가 주체적으로 매체 비평 자료를 제작할 수 있는 능력을 기르기 위해 설정하였다. 매체 자료에 대해 학습자 스스로 비평하는 활동을 수행한 후 복수의 매체 비평 자료를 참조하여 자신이 비평한 내용과 어떤 공통점 및 차이점이 있는지, 참조한 비평 자료에서는 어떤 특징이 두드러지는지 등을 분석해 본다. 이러한 경험을 토대로 다양한 매체 자료에 대해 주체적으로 비평하는 활동에 참여할 수 있도록 한다."]},{"교":"국어","c":"10공국2-06-02","과":"공통국어2","학":"고1","영":"매체","p":"매체의 변화가 소통 문화에 끼치는 영향을 탐구한다.","h":["이 성취기준은 매체의 변천을 역사적 관점에서 이해하고 매체를 기반으로 한 소통 문화를 탐구할 수 있는 능력을 기르기 위해 설정하였다. 매체의 변화는 매체를 기반으로 한 소통 방식과 소통 문화의 변화에 영향을 끼치고 있다. 무선 인터넷의 보급과 스마트폰의 활용, 개인 방송 등 매체 변화로 인해 생겨난 소통 문화의 특성, 매체 기반의 소통에서 나타나는 언어의 특징, 사회 관계망 서비스(SNS)에서 이루어지는 소통 특성 등에 대한 깊이 있는 탐구를 통해 매체 소통 문화를 이해하고 성찰하는 기회를 가지도록 한다."]},{"교":"국어","c":"12화언01-01","과":"화법과 언어","학":"고2~3","영":"","p":"언어를 인간의 삶과 관련지어 이해하고, 국어와 국어생활이 시간의 흐름에 따라 변화하는 양상을 분석한다.","h":["이 성취기준은 언어에 대한 이해가 곧 인간에 대한 이해임을 바탕으로 언어를 인간의 사고⋅사회⋅문화와 관련하여 분석하고, 국어와 국어생활이 시간의 흐름에 따라 변화함을 이해하며 국어 활동을 하는 능력을 기르기 위해 설정하였다. 실제 언어 자료에 나타난 언어와 사고의 관계, 사회⋅문화와 언어의 표상 관계에 대해 알아보고, 고대 국어 시대부터 현재까지의 국어와 국어생활에서 발견할 수 있는 다양한 변이와 변화를 탐구한다."]},{"교":"국어","c":"12화언01-02","과":"화법과 언어","학":"고2~3","영":"","p":"표준 발음을 이해하고 정확하게 발음하는 국어생활을 한다."},{"교":"국어","c":"12화언01-03","과":"화법과 언어","학":"고2~3","영":"","p":"품사와 문장 구조에 대한 지식을 활용하여 언어 자료를 분석하고 설명한다.","h":["이 성취기준은 품사와 문장 구조에 대해 이전 학년까지 학습한 내용을 심화하며 그 지식을 활용하여 언어 자료의 특징을 분석하고 설명하는 능력을 기르기 위해 설정하였다. 언어 자료에 사용된 단어의 품사나 문장의 구조를 단순하게 분석하기보다는, 특정 사건이나 현상을 명사로 나타내는 경우와 동사로 나타내는 경우의 표현 효과 차이, 어떠한 생각을 홑문장과 겹문장, 이어진문장과 안은문장 등의 서로 다른 문장 구조로 표현할 때의 적절성과 효과 차이 등을 분석하며 언어 자료를 설명하고, 품사와 문장 구조에 관한 지식을 담화 특성에 맞게 활용한다."]},{"교":"국어","c":"12화언01-04","과":"화법과 언어","학":"고2~3","영":"","p":"단어의 짜임과 의미, 단어 간의 의미 관계를 중심으로 어휘를 이해하고 담화에 적절히 활용한다."},{"교":"국어","c":"12화언01-05","과":"화법과 언어","학":"고2~3","영":"","p":"담화의 맥락에 적절한 어휘와 문법 요소를 선택하여 화자의 태도를 드러낸다.","h":["이 성취기준은 담화에 사용된 어휘와 문법 요소가 화자의 태도를 드러내는 기능을 한다는 것을 이해하고 담화의 맥락에 적절한 어휘와 문법 요소를 사용할 수 있는 능력을 기르기 위해 설정하였다. 화자의 의도, 청자의 특성, 담화의 목적 등에 적절한 어휘와 문법 요소를 선택하기, 학습자가 담화 맥락을 고려하여 직접 담화를 구성하며 자신의 태도를 드러내는 어휘와 문법 요소를 선택적으로 활용하기 등을 학습한다. 이때 문법 요소로는 문장 종결 표현, 높임 표현, 시간 표현, 피동 표현, 사동 표현, 인용 표현, 부정 표현 중 일부를 학습한다."]},{"교":"국어","c":"12화언01-06","과":"화법과 언어","학":"고2~3","영":"","p":"담화의 구조를 고려하여 적절한 어휘와 문장으로 응집성 있는 담화를 구성한다."},{"교":"국어","c":"12화언01-07","과":"화법과 언어","학":"고2~3","영":"","p":"다양한 유형의 담화와 매체를 대상으로 언어의 공공성을 이해하고 평가한다.","h":["이 성취기준은 현대 사회의 급변하는 언어 환경에서 공적 담화와 매체를 대상으로 언어의 공공성을 이해하고 평가할 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체가 발달한 오늘날의 의사소통 상황에서는 개인이 생산한 담화가 음성 언어, 문자 언어, 복합양식 등의 형식으로 불특정 다수에게 전달되는 경우가 많음을 고려하여, 표현의 정확성, 적절성, 공정성, 존중과 배려의 언어 등을 중심으로 실제 담화와 매체 자료 속에서 공공성을 이해하고 평가하며 자신이 사용하는 언어에 책임감을 가진다."]},{"교":"국어","c":"12화언01-08","과":"화법과 언어","학":"고2~3","영":"","p":"자아 개념이 의사소통 방식에 미치는 영향을 인식하고 협력적인 관계 형성에 적절한 방식으로 대화한다.","h":["이 성취기준은 대화를 통해 자아 성장과 대인 관계 발전에 필요한 능력을 기르기 위해 설정하였다. 이전 학년까지 언어 예절 및 배려하고 경청하며 공감하는 대화 방법을 학습한 것에서 나아가, 대화를 통한 자아 개념 형성과 대인 관계 형성에 중점을 둔다. 자아 개념이 타인과의 의사소통 과정에서 형성되며 타인과 소통하는 방식에 영향을 끼치는 순환적인 것임을 이해하고, 긍정적이고 협력적인 관계 형성을 위한 대화 방식을 학습한다."]},{"교":"국어","c":"12화언01-09","과":"화법과 언어","학":"고2~3","영":"","p":"정제된 언어적 표현 전략 및 적절한 준언어적⋅비언어적 표현 전략을 활용하여 발표한다."},{"교":"국어","c":"12화언01-10","과":"화법과 언어","학":"고2~3","영":"","p":"화자의 공신력을 이해하고 효과적인 설득 전략을 활용하여 연설한다.","h":["이 성취기준은 이성적 설득 전략, 감성적 설득 전략과 함께 화자의 공신력을 활용한 설득 전략도 청중의 태도 변화를 이끌어 내기에 효과적인 설득 전략임을 이해하고, 연설을 통해 설득력 있게 말하는 능력을 기르기 위해 설정하였다. 화자의 성품, 평판, 전문성 등이 연설에서 화자의 공신력을 구성하는 요소이며, 솔직하고 수용적인 태도나 적극성과 자신감이 드러나는 태도 또한 화자의 공신력에 영향을 미침을 이해하고, 다양한 설득 전략의 효과적인 활용 방법을 학습한다."]},{"교":"국어","c":"12화언01-11","과":"화법과 언어","학":"고2~3","영":"","p":"토의에서 주제와 관련된 다양한 자료를 통해 공동체의 문제를 분석하고 합리적으로 해결한다.","h":["이 성취기준은 의사소통 행위가 공동체의 발전에 기여할 수 있음을 이해하고 토의를 통하여 공동체의 문제를 해결하는 능력을 기르기 위해 설정하였다. 이전 학년까지 토의의 의견 조정하기와 문제를 해결하는 대안 마련하기를 학습한 것에서 나아가, 이 성취기준에서는 토의 주제와 관련된 다양한 자료를 탐색하고 활용하여 공동체가 해결해야 할 문제를 명확히 인식하고 분석하기, 공동체의 문제를 해결하는 합리적인 대안들 도출하기, 대안의 선택을 위한 판단 준거를 설정하고 그것을 바탕으로 합리적인 대안을 선택하여 문제 해결하기 등을 학습한다."]},{"교":"국어","c":"12화언01-12","과":"화법과 언어","학":"고2~3","영":"","p":"주장, 이유, 근거를 비판적으로 검토하여 논증의 타당성, 신뢰성, 공정성에 대해 반대 신문하며 토론한다."},{"교":"국어","c":"12화언01-13","과":"화법과 언어","학":"고2~3","영":"","p":"상황에 맞는 협상 전략을 사용하여 서로 만족할 수 있는 대안을 찾아 의사 결정을 한다.","h":["이 성취기준은 협상 실행 절차에 따라 상황에 맞는 전략을 사용하여 서로 다른 의견이나 주장을 조율하고 함께 만족할 만한 대안을 모색하는 의사 결정 능력을 기르기 위해 설정하였다. 협상 상황에 따라 다양한 협상 전략을 사용하는 과정에서 상대측 의견이나 제안을 받아들이기, 서로의 의견이나 제안이 다른 경우에 자신의 의견이나 제안을 전략적으로 조정하기, 협상 중 갈등이 생기는 경우에 타협하고 조정하여 상호 만족하는 대안 도출하기 등을 학습한다."]},{"교":"국어","c":"12화언01-14","과":"화법과 언어","학":"고2~3","영":"","p":"기호를 활용한 사회적 행위로서의 국어생활을 성찰하고 문제점을 개선하는 태도를 지닌다."},{"교":"국어","c":"12화언01-15","과":"화법과 언어","학":"고2~3","영":"","p":"언어 공동체의 담화 관습을 이해하고, 다양성을 존중하는 의사소통 문화 형성에 기여하는 태도를 지닌다."},{"교":"국어","c":"12독작01-01","과":"독서와 작문","학":"고2~3","영":"","p":"독서와 작문의 의사소통 방법과 특성을 이해하고 문어 의사소통 생활을 주도적으로 실천하고 성찰한다."},{"교":"국어","c":"12독작01-02","과":"독서와 작문","학":"고2~3","영":"","p":"독서의 목적과 작문의 맥락을 고려하여 가치 있는 글이나 자료를 탐색하고 선별한다.","h":["이 성취기준은 독자가 자신의 독서 목적에 부합하는 글이나 자료를 스스로 선정하여 자기 선택적 독서를 실천하는 능력, 그리고 작문 맥락에 부합하는 글이나 자료를 탐색하고 선별하여 이를 작문에 활용하는 능력을 기르기 위해 설정하였다. 도서관이나 인터넷 등에서 글이나 자료를 탐색하고 수집하기, 독서 목적과 작문 맥락을 고려하여 글이나 자료를 평가하고 선별하기, 글이나 자료의 출처를 형식에 맞게 정리하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-03","과":"독서와 작문","학":"고2~3","영":"","p":"글에 드러난 정보를 바탕으로 글의 내용을 파악하고 글에 드러나지 않은 정보를 추론하며 읽는다.","h":["이 성취기준은 글에 드러난 정보를 정확하게 파악하는 사실적 독해 능력을 기르고, 글에 명시적으로 드러나지 않은 정보를 학습자의 배경지식 및 경험을 활용하거나 문맥을 고려하여 파악하는 추론적 독해 능력을 기르기 위해 설정하였다. 사실적 독해와 관련해서는 단어⋅문장⋅문단의 내용 파악하기, 각 문단 사이의 관계 파악하기, 글의 구조나 내용의 전개 방식 파악하기, 내용의 중요도 평가하기, 중심 내용 파악하기, 중심 내용과 세부 내용 구분하기, 요약하기 등을 학습할 수 있다. 추론적 독해와 관련해서는 필자의 의도나 목적 파악하기, 숨겨진 내용 추론하기, 생략된 내용 예측하기, 인물의 특성이나 장면의 분위기 추측하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-04","과":"독서와 작문","학":"고2~3","영":"","p":"글의 내용이나 관점, 표현 방법, 필자의 의도나 사회⋅문화적 이념을 평가하며 읽는다."},{"교":"국어","c":"12독작01-05","과":"독서와 작문","학":"고2~3","영":"","p":"글을 읽으며 다양한 내용 조직 방법과 표현 전략을 찾고 이를 글쓰기에 활용한다.","h":["이 성취기준은 작문의 목적, 글의 유형, 예상 독자 등 작문의 맥락에 따라 적합한 내용 조직 방법과 표현 전략이 달라질 수 있음을 독서 과정을 통해 인식하고, 이를 작문 상황에서 실제로 적용하여 글을 쓰는 능력을 기르기 위해 설정하였다. 필자의 의도를 고려하여 글에 사용된 내용 조직 방법과 표현 전략을 찾고 분석하기, 독자의 반응을 고려하여 글에 사용된 내용 조직 방법과 표현 전략의 효과성 평가하기, 글의 목적⋅유형⋅예상 독자를 고려하여 효과적인 내용 조직 방법과 표현 전략 활용하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-06","과":"독서와 작문","학":"고2~3","영":"","p":"자신의 글을 분석적⋅비판적 관점으로 읽고, 내용과 형식을 효과적으로 고쳐 쓴다."},{"교":"국어","c":"12독작01-07","과":"독서와 작문","학":"고2~3","영":"","p":"인간과 예술을 다룬 인문⋅예술 분야의 글을 읽고 삶과 예술에 대한 자신의 생각을 담은 글을 쓴다.","h":["이 성취기준은 인문⋅예술 분야의 글을 읽고 인문학적 세계관을 이해하며 삶과 예술에 대한 인식적⋅윤리적⋅심미적 경험을 글로 표현하는 능력을 기르기 위해 설정하였다. 인문⋅예술 분야의 글에 담긴 인문학적 세계관 파악하기, 삶과 예술의 문제를 대하는 필자의 관점 파악하기, 필자의 관점을 비판적으로 이해하기, 삶과 예술에 대한 경험과 가치관을 진솔하게 표현하기, 삶과 예술에 대해 쓴 글을 발표하고 의견 공유하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-08","과":"독서와 작문","학":"고2~3","영":"","p":"사회적⋅역사적 현상이나 쟁점 등을 다룬 사회⋅문화 분야의 글을 읽고 사회⋅문화적 사건이나 역사적 인물에 대한 관점을 담은 글을 쓴다."},{"교":"국어","c":"12독작01-09","과":"독서와 작문","학":"고2~3","영":"","p":"과학⋅기술의 원리나 지식을 다룬 과학⋅기술 분야의 글을 읽고 과학⋅기술의 개념이나 현상을 설명하는 글을 쓴다.","h":["이 성취기준은 과학⋅기술의 원리나 지식을 다룬 글을 읽고 학습자가 수집한 다양한 정보와 자료를 활용하여 과학⋅기술의 원리나 현상을 설명하는 글을 쓰는 능력을 기르기 위해 설정하였다. 과학⋅기술의 원리나 지식을 다룬 글을 읽고 정보를 효과적으로 파악하기, 과학⋅기술 분야의 글의 구조와 전개 방식 파악하기, 과학⋅기술 분야의 글을 읽고 내용 생성에 필요한 자료 수집하기, 수집한 자료의 객관성과 신뢰성 평가하기, 예상 독자를 고려하여 효과적으로 조직 및 표현하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-10","과":"독서와 작문","학":"고2~3","영":"","p":"글이나 자료에서 가치 있는 정보를 수집하고 효과적으로 조직하면서 정보를 전달하는 글을 쓴다."},{"교":"국어","c":"12독작01-11","과":"독서와 작문","학":"고2~3","영":"","p":"글이나 자료에서 타당한 근거를 수집하고 효과적인 설득 전략을 활용하여 논증하는 글을 쓴다.","h":["이 성취기준은 객관적인 근거와 다양한 설득 전략을 활용하여 필자의 주장을 논리적으로 입증하는 능력을 기르기 위해 설정하였다. 논증하는 글을 쓸 때에는 역사적 사실, 실험 결과, 통계 수치, 전문가의 의견, 일반적 여론이나 상식 등 객관적인 근거를 활용하여 필자의 주장이 신뢰할 수 있음을 입증하는 데에 중점을 둔다. 논제와 관련하여 쟁점을 파악하고 필자의 관점 정립하기, 다양한 글과 자료를 수집⋅분석⋅평가하여 객관적인 근거 마련하기, 예상 독자를 고려하여 반론을 예상하고 반박 마련하기, ‘주장과 이유 간의 관계, 이유와 근거 간의 관계, 주장과 예상되는 반론 간의 관계’ 등 논증 요소 간의 논리적 관계를 고려하여 효과적으로 조직하기, 논증하는 글 쓰기의 관습을 고려하여 효과적으로 표현하기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-12","과":"독서와 작문","학":"고2~3","영":"","p":"정서 표현과 자기 성찰의 글을 읽고 자신의 정서를 진솔하게 표현하거나 자신의 삶을 성찰하는 글을 쓴다.","h":["이 성취기준은 정서 표현과 자기 성찰의 글을 읽고 필자의 체험과 생각을 통해 삶에 대한 교훈과 깨달음을 얻고 학습자 자신의 정서를 진솔하게 표현하거나 스스로의 삶을 성찰하는 글을 쓸 수 있는 능력을 기르기 위해 설정하였다. 필자가 가지고 있는 삶에 대한 정서나 가치관 파악하기, 삶에 대한 필자의 가치관과 자신의 가치관 비교하기, 자신의 정서를 과장이나 왜곡 없이 진정성 있게 표현하기, 자신의 경험이나 생각을 되돌아보고 다양한 방식으로 표현하기, 자신의 일상을 기록하는 습관 형성하기, 자신의 삶을 성찰하는 글 쓰기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-13","과":"독서와 작문","학":"고2~3","영":"","p":"다양한 글을 주제 통합적으로 읽고 학습의 목적과 교과의 특성을 고려하여 학습을 위한 글을 쓴다.","h":["이 성취기준은 하나의 주제나 화제에 대해 다양한 관점과 형식을 보이는 글을 읽고 글에 드러난 정보를 비판적으로 수용하고 재구성하는 과정을 통해 주제나 화제에 관하여 학습하기 위한 글을 쓰는 능력을 기르기 위해 설정하였다. 동일한 주제나 화제에 대해 다양한 관점을 지닌 글을 비교⋅대조하면서 분석하기, 교과의 특성을 고려한 정보 전달 방식 파악하기, 학습 목적을 고려하여 내용 요약하기, 교과의 개념이나 원리를 효과적으로 설명하는 글 쓰기, 다양한 표나 그래프를 분석하고 해석하는 글 쓰기, 실험⋅조사의 과정과 결과가 드러나게 보고하는 글 쓰기 등을 학습할 수 있다."]},{"교":"국어","c":"12독작01-14","과":"독서와 작문","학":"고2~3","영":"","p":"매체의 유형과 특성을 고려하며 글이나 자료를 읽고 쓴다."},{"교":"국어","c":"12독작01-15","과":"독서와 작문","학":"고2~3","영":"","p":"독서와 작문의 관습과 소통 문화를 이해하고 공동체의 소통 문화 및 담론 형성에 책임감 있게 참여한다."},{"교":"국어","c":"12문학01-01","과":"문학","학":"고2~3","영":"","p":"문학이 인간과 세계에 대한 이해를 돕고, 삶의 의미를 깨닫게 하며, 정서적⋅미적으로 삶을 고양함을 이해한다."},{"교":"국어","c":"12문학01-02","과":"문학","학":"고2~3","영":"","p":"문학의 여러 갈래들의 특성과 문학의 맥락에 대해 이해한다.","h":["이 성취기준은 문학의 갈래와 맥락에 대한 심화된 이해를 바탕으로 문학 문화를 향유하는 능력을 기르기 위해 설정하였다. 문학 작품은 문학의 갈래와 맥락의 영향을 받으며 형상화되고 이해된다. 문학의 갈래에 따라 세계를 인식하고 형상화하는 원리와 그 특성을 탐구하는 한편, 문학의 주요 맥락인 작가 맥락, 독자 맥락, 사회⋅문화적 맥락, 문학사적 맥락 등을 종합적으로 고려하며 작품을 수용하고 생산하는 데 학습의 초점을 맞춘다."]},{"교":"국어","c":"12문학01-03","과":"문학","학":"고2~3","영":"","p":"주요 작품을 중심으로 한국 문학의 범위와 갈래, 변화 양상을 탐구한다.","h":["이 성취기준은 한국 문학을 대표하는 작품들의 감상을 바탕으로 한국 문학의 범위와 갈래, 그리고 변화 양상을 이해하고 탐구하기 위해 설정하였다. 한국 문학의 범위를 이해할 때는 구체적인 작품을 통해 창작 주체, 표현 언어, 내용 등에 대해 학습자들이 능동적으로 탐구하도록 한다. 문학의 기본 갈래는 언어의 성격에 따라 구비 문학, 한문학, 국문 문학의 세 영역 아래 다양한 역사적 갈래로 구현되는 양상을 탐구하도록 하는 데 중점을 둔다. 여러 작품을 비교하고 대조하는 등 학습자의 능동적인 감상을 통해 갈래의 특징과 변화 양상을 파악하도록 한다."]},{"교":"국어","c":"12문학01-04","과":"문학","학":"고2~3","영":"","p":"한국 문학에 반영된 시대 상황을 이해하고 문학과 역사의 상호 영향 관계를 탐구한다."},{"교":"국어","c":"12문학01-05","과":"문학","학":"고2~3","영":"","p":"한국 작품과 외국 작품을 비교하며 읽고 한국 문학의 보편성과 특수성을 파악한다."},{"교":"국어","c":"12문학01-06","과":"문학","학":"고2~3","영":"","p":"문학 작품에서는 내용과 형식이 긴밀하게 연관됨을 이해하며 작품을 수용한다."},{"교":"국어","c":"12문학01-07","과":"문학","학":"고2~3","영":"","p":"작품을 공감적, 비판적, 창의적으로 감상하며, 다양한 방식으로 작품에 대해 비평한다.","h":["이 성취기준은 문학 작품에 대한 감상과 비평 능력을 높이기 위해 설정하였다. 작품을 읽으면서 독자는 자신의 처지와 관점에 따라 작품에 공감하기도 하고, 작품 속 인물의 행동이나 작품 속 현실에 비판적인 입장을 취하기도 하며, 작품을 매개로 다양한 상상을 하고 창의적인 생각을 펼치며 감상한다. 이러한 점에 유의하면서 작품의 의미나 주제 등에 대한 기존의 정보에 의존하기보다 학습자가 스스로 자신의 처지와 관점, 취향에 따라 적극적이며 주체적인 태도로 감상하도록 하는 데 중점을 둔다. 이때의 감상 활동은 비평 활동, 즉 작품이 독자에게 주는 의미를 명확하게 하고, 작품의 아름다움이나 감동에 대해 근거를 가지고 설명하는 활동으로 원활히 이어지는 것이 중요하다. 비평 활동은 비평문 작성만이 아닌, 대면 토론이나 온라인 대화, 영상 제작 등 다양한 방식으로 이루어질 수 있다."]},{"교":"국어","c":"12문학01-08","과":"문학","학":"고2~3","영":"","p":"작품을 읽고 새로운 시각으로 재구성하거나 주체적인 관점에서 작품을 창작한다.","h":["이 성취기준은 학습자가 수동적인 문학 수용자에 그치지 않고, 문학의 형식으로 자신을 표현하며 세상과 적극적으로 소통하는 능력을 갖추도록 하기 위해 설정하였다. 기존의 작품을 활용하여 작품의 일부를 바꾸거나 개작하는 활동을 할 경우 기계적 모방에 그치지 않고, 개작의 과정에서 문학의 갈래적 특성이나 형식적 특징을 익힐 수 있게 하는 것이 필요하다. 또한 재구성의 과정에서 예전에는 당연했던 가치관이나 인식을 담은 작품들을 현재의 시각이나 독자의 시각에서 비판적으로 살펴보고 주제나 내용을 새롭게 재구성하는 데 중점을 둔다. 그리고 이러한 활동 경험들을 통해 창작에 대한 부담감이나 두려움을 낮추고, 나아가 자신의 생각이나 감정을 적극적으로 담아내려 시도하는 가운데 자연스럽게 학습자의 창작 능력이 향상될 수 있게 한다."]},{"교":"국어","c":"12문학01-09","과":"문학","학":"고2~3","영":"","p":"다양한 매체로 구현된 작품의 창의적 표현 방법과 심미적 가치를 문학적 관점에서 수용하고 소통한다."},{"교":"국어","c":"12문학01-10","과":"문학","학":"고2~3","영":"","p":"문학을 통하여 자아를 성찰하고, 타자를 이해하며 상호 소통한다."},{"교":"국어","c":"12문학01-11","과":"문학","학":"고2~3","영":"","p":"문학을 통해 공동체가 처한 여러 문제들을 이해하고 문제 해결에 참여하는 태도를 지닌다.","h":["이 성취기준은 학습자가 문학을 통해 자신이 속한 공동체의 문제를 인식하고 문제를 해결하기 위한 소통의 과정에 적극적으로 참여하는 시민으로서의 능력과 태도를 함양하도록 하기 위해 설정하였다. 우리가 속한 공동체는 생태적 위기, 사회적 불평등 및 차별의 문제 등 여러 난제에 직면해 있다. 이러한 내용을 다루는 문학 작품의 수용과 생산 활동을 통해 공동체의 문제를 이해하고, 다양성을 존중하며 공존의 해법을 찾는 과정에 참여하는 태도를 기르는 데 중점을 둔다."]},{"교":"국어","c":"12문학01-12","과":"문학","학":"고2~3","영":"","p":"주체적인 문학 활동을 생활화하여 지속적으로 문학을 즐기는 태도를 지닌다.","h":["이 성취기준은 일상생활에서 작품의 수용과 생산 활동에 주체적으로 참여하고 문학을 꾸준히 즐기는 태도를 갖추어 능동적이고 지속적인 문학 향유자로 성장하도록 하기 위해 설정하였다. 학습자들이 자신의 흥미와 관심사에 따라 문학 작품을 적극적으로 찾아 읽거나 쓰는 데 기쁨과 즐거움을 느끼고, 관심사를 확장하여 다양한 작품을 읽으며 문학 활동을 통한 경험의 영역을 확장할 수 있도록 하는 데 중점을 둔다. 특히, 이러한 활동이 일상생활에서 지속적으로 이루어지도록 하고, 성인기의 삶에서도 문학 생활화가 지속되도록 하는 기반을 마련한다. 이를 위해 학교 안팎에서 이루어지는 다양한 문학 활동에 참여한다. 사회 관계망 서비스(SNS)를 활용한 문학 감상 및 창작물 공유, 낭송⋅낭독 모임, 작가와의 만남, 문학 동아리, 북 콘서트, 문학관 방문, 문학 답사 등에 적극적으로 참여할 기회를 갖는다."]},{"교":"국어","c":"12주탐01-01","과":"주제 탐구 독서","학":"고2~3","영":"","p":"주제 탐구 독서의 의미를 이해하고 관심 있는 분야에서 탐구할 주제를 탐색한다."},{"교":"국어","c":"12주탐01-02","과":"주제 탐구 독서","학":"고2~3","영":"","p":"학업과 진로 탐색을 위해 주제 탐구의 독서 목적을 수립하고 주제를 선정한다."},{"교":"국어","c":"12주탐01-03","과":"주제 탐구 독서","학":"고2~3","영":"","p":"관심 분야의 책과 자료가 지닌 특성을 파악하며 주제 탐구 독서를 한다.","h":["이 성취기준은 주제 탐구를 위해 학습자가 관심 있는 분야에서 선정한 책과 자료의 특성을 파악하며 주체적이고 능동적인 독서 활동을 통해 ‘의사소통 역량’ 및 ‘비판적⋅창의적 사고 역량’을 함양하기 위해 설정하였다. 교과 학습 과정에서 학습자의 흥미와 진로를 고려하여 선정한 각 분야별 책과 자료가 지닌 특성을 이해하고, 이를 바탕으로 적절하고 효과적인 독서 방법을 선택하여 읽는다. 이 과정에서 모든 분야의 책과 자료가 지닌 특성을 알아야 하는 것은 아니므로 학습자가 선택한 분야와 주제로 범위를 한정하여 학습 부담이 과중되지 않도록 한다."]},{"교":"국어","c":"12주탐01-04","과":"주제 탐구 독서","학":"고2~3","영":"","p":"주제와 관련된 책이나 자료를 탐색하면서 신뢰할 수 있고 가치 있는 정보를 선정하여 분석하며 읽는다.","h":["이 성취기준은 주제와 관련된 책이나 자료를 다양하게 탐색하면서 적절한 정보를 선정하는 능력을 기르고, 선정한 정보를 깊이 있게 이해⋅분석하는 능력을 신장시키기 위해 설정하였다. 주제와 관련된 책이나 자료를 능동적으로 탐색하는 태도는 주제 탐구 독서의 바탕이 됨을 알고, 주제와 자료의 관련성 및 정보의 신뢰성을 종합적으로 판단하여 가치 있는 정보를 선정할 수 있도록 한다. 또한 학습자가 선정한 정보의 내용을 깊이 있게 이해하고 체계적으로 분석할 수 있도록 안내한다."]},{"교":"국어","c":"12주탐01-05","과":"주제 탐구 독서","학":"고2~3","영":"","p":"주제에 관련된 책과 자료를 종합하여 읽으며 자신의 관점과 견해를 형성한다.","h":["이 성취기준은 선정한 지식과 정보를 비교⋅분석하고 재구성하는 등의 의미 확장 과정을 통해 학습자가 주제에 대한 관점과 견해를 형성할 수 있도록 하기 위해 설정하였다. 주제와 관련된 다양한 책과 자료들을 비교⋅분석하기 위해 텍스트 구조 이해하기, 책과 자료에 드러난 정보 비교⋅대조하기 등을 학습한다. 이해 정도를 점검⋅조정하고 상충되는 정보를 통합해 보면서 주제에 대한 자신의 관점과 견해를 형성할 수 있도록 안내한다."]},{"교":"국어","c":"12주탐01-06","과":"주제 탐구 독서","학":"고2~3","영":"","p":"매체를 포함한 다양한 방법으로 주제 탐구 독서의 과정이나 결과를 사회적으로 공유하고 소통한다.","h":["이 성취기준은 매체 활용을 바탕으로 한 ‘디지털⋅미디어 역량’과 주제 탐구 독서의 과정이나 결과를 공유하고 사회적으로 소통할 수 있는 ‘의사소통 역량’을 기르기 위해 설정하였다. 주제 탐구 독서에서는 서평, 주제 탐구 보고서 등 전통적인 글쓰기 이외에도 다양한 매체를 활용한 구두 발표 형식으로 탐구의 과정이나 결과를 구성원들과 공유할 수 있다. 특히 오늘날에는 카드 뉴스, 웹툰, 동영상 등 온라인 플랫폼과 사회 관계망 서비스(SNS) 등의 다양한 매체가 빠르게 발전하고 있으므로, 이러한 매체를 적극적으로 활용할 수 있도록 한다."]},{"교":"국어","c":"12주탐01-07","과":"주제 탐구 독서","학":"고2~3","영":"","p":"주제 탐구 독서를 생활화하여 주도적으로 삶을 성찰하고 계발한다."},{"교":"국어","c":"12문영01-01","과":"문학과 영상","학":"고2~3","영":"","p":"문학과 영상의 형상화 방법과 그 특성을 이해한다.","h":["이 성취기준은 문학과 영상의 형상화 방법과 그 특성을 파악함으로써 문학과 영상에 대한 이해를 넓히고, 이를 바탕으로 문학과 영상을 이해하는 능력을 기르기 위해 설정하였다. 문학은 갈래에 따라 언어적 형상화 방법을 다양하게 발전시켜 온 분야이며, 영상은 시각적 요소와 청각적 요소의 결합과 배치를 통해 영화, 드라마, 광고, 애니메이션 등 다양한 장르를 창출해 온 분야이다. 빛, 색상, 구도, 동작 등의 시각적 요소와 대사, 음향 효과, 배경 음악 등의 청각적 요소가 영상 속에서 조화를 이루며 결합되어 하나의 영상물로 완성된다는 점을 고려하면서 영상의 형상화 방법과 그 특성을 학습한다. 문학 작품과 영상물을 감상하는 과정에서 문학과 영상의 형상화 방법과 그 특성을 비교하여 탐구함으로써 둘의 공통점과 차이점을 이해한다.","과 [12문영01-03]을 지도할 때는 문학 작품이 영상물을 위한 상상력의 원천으로 영향을 미쳤다는 점을 인식하면서도 문학과 영상물의 관계가 상호적이라는 점을 고려하며 제재를 선정하고 학습 활동을 계획할 필요가 있다. 문학 작품이 영상물의 원천이 된 사례와 영상물이 문학 작품의 원천이 된 사례를 함께 제시함으로써 문학 작품과 영상물의 관계가 일방적이 아니라 상호적이라는 점을 이해하게 한다. 이 과정에서 특정한 장르가 다른 장르에 비해 우월하거나 열등하다고 인식하지 않도록 유의한다. 영상물의 범위를 영화에 국한할 필요는 없으며, 영상 기법을 활용하여 제작된 드라마, 영상 문학, 게임, 웹툰 등도 폭넓게 고려하여 제재나 학습 활동을 계획할 필요가 있다."]},{"교":"국어","c":"12문영01-02","과":"문학과 영상","학":"고2~3","영":"","p":"양식과 매체에 따른 특성과 효과를 고려하여 문학 작품과 영상물을 해석하고 비평한다.","h":[", [12문영01-04], [12문영01-05]와 관련하여 문학 작품과 영상물의 수용을 지도할 때는 전문적인 비평이나 기존의 해석에만 의존하지 않고 주체적인 해석과 평가가 이루어지도록 한다. 학습자가 자신의 관점에서 문학 작품과 영상물을 수용하되 합리적이고 타당한 근거를 갖추는 것이 중요하다. 이를 위해 자신의 해석과 평가를 타인과 공유하면서 해석의 다양성을 인식하고 자신의 해석과 평가를 성찰할 수 있도록 한다."]},{"교":"국어","c":"12문영01-03","과":"문학과 영상","학":"고2~3","영":"","p":"문학 작품과 영상물 간의 영향 관계와 상호 작용의 효과를 파악한다.","h":["이 성취기준은 문학 작품과 영상물 간의 영향 관계와 상호 작용의 효과를 파악하는 능력을 기르기 위해 설정하였다. 영향 관계가 있거나 유의미한 비교가 가능한 문학 작품과 영상물을 찾아 유사점과 차이점을 분석하고, 문학 작품과 영상물 간 상호 작용의 효과와 그 의의 등을 학습한다. 문학과 영상의 특성을 고려하며 문학 작품과 영상물을 감상하면서 표현 방식, 내용 전개, 관점, 주제 등을 비교하며 분석하는 데 중점을 두고, 문학 작품을 영상물로, 영상물을 문학 작품으로 재구성한 사례 등을 통해 상호 작용의 효과를 파악하는 데 초점을 맞춘다."]},{"교":"국어","c":"12문영01-04","과":"문학과 영상","학":"고2~3","영":"","p":"문학 창작과 영상 창작의 요소와 기법을 바탕으로 문학 작품과 영상물을 수용⋅생산한다.","h":["이 성취기준은 문학과 영상의 창작 요소를 중심으로 다양한 기법의 특성과 효과를 이해하고 이를 바탕으로 문학 작품과 영상물을 수용하고 생산하는 능력을 기르기 위해 설정하였다. 문학 창작의 요소와 기법을 학습할 때는 갈래별 구성 요소를 중심으로 미적 형식과 문학적 표현 방식에 중점을 두어 이해하고, 영상 창작의 요소와 기법은 시각적 요소와 청각적 요소를 중심으로 화면의 구도와 시점, 소리의 크기와 음색, 컷의 배열과 화면 전환 등 연출 기법에 중점을 두어 이해한다. 기법에 대한 전문적인 지식을 강조하기보다는 실제적인 수용⋅생산 활동을 통해 기법의 특성과 효과를 이해할 수 있도록 한다. 이때 수용 활동과 생산 활동은 선택적 혹은 통합적으로 계획하여 학습할 수 있다.",", [12문영01-09]와 관련하여, 문학 작품과 영상물의 창작을 지도할 때는 문학과 영상의 관습적 표현과 전개 방식을 이해하고, 이를 바탕으로 개성과 창의성을 발휘하여 자신만의 독창적인 문학 작품과 영상물을 창작할 수 있도록 한다. 창작 활동이 지나치게 전문적인 작업이 되지 않도록 학습자의 수준과 수업 여건을 고려하여 학습 활동을 설계한다. 예를 들어, 새로운 창작 활동 외에 기존 작품을 활용한 개작, 부분 완성, 장르 변환, 매체 변환 등 창조적인 재구성 활동을 다룰 수 있다. 특히 영상물을 창작할 때는 교수⋅학습 상황을 고려하여 영상물의 유형과 창작 범위를 설정할 필요가 있다."]},{"교":"국어","c":"12문영01-05","과":"문학과 영상","학":"고2~3","영":"","p":"소재가 유사한 문학 작품과 영상물을 비교하면서 통합적으로 수용한다.","h":["이 성취기준은 유사한 소재를 형상화한 문학 작품과 영상물을 찾고 통합적으로 수용할 수 있는 능력을 기르기 위해 설정하였다. 문학과 영상은 특정한 인물 유형, 사건, 가치, 정서, 시공간 등과 관련된 소재나 주제, 발상을 공유하되 서로 다른 관점과 형식으로 형상화한다. 학습자가 유사한 소재를 다룬 문학 작품과 영상물을 다양하게 찾아 선별한 후 소재에 대한 관점과 형상화 방식 등을 비교하고 서평 쓰기, 비평문 쓰기, 발표하기, 공유하기 등을 통해 학습자의 시각으로 통합할 수 있도록 한다."]},{"교":"국어","c":"12문영01-06","과":"문학과 영상","학":"고2~3","영":"","p":"문학 작품과 영상물을 효과적으로 전달할 수 있는 경로와 매체를 선택하여 공유한다.","h":["을 지도할 때는 학습자들이 각자의 창작물을 서로 공유하면서 문학과 영상 창작의 경험을 확장할 수 있도록 한다. 학습자가 문학 작품과 영상물의 특성을 고려하면서 전달 경로와 매체를 선정하고 그 효과를 성찰하도록 수업을 설계하는 것이 중요하다. 이를 위해 생산 활동을 할 때는 타인과 공유할 수 있는 창작이 이루어지도록 안내한다. 또한, 공유 과정에서 자신의 생산 활동을 성찰하고, 동료의 창작에 대해 생산적인 평가가 이루어지도록 유도한다."]},{"교":"국어","c":"12문영01-07","과":"문학과 영상","학":"고2~3","영":"","p":"문학과 영상에 관련된 진로와 분야에서 요구하는 문화적 소양에 대해 탐구한다.","h":["이 성취기준은 문학과 영상에 관련된 진로와 분야에서 요구하는 문화적 소양을 갖추기 위해 설정하였다. 문학과 영상은 교육과 산업, 비평과 연구, 편집과 출판, 창작과 제작 등의 다양한 진로 및 분야와 관련이 깊다. 학습자가 이러한 진로와 분야를 능동적으로 탐색하고 설계할 수 있도록 조사와 면담, 참여 관찰 등을 통해 관련 진로와 분야를 직간접적으로 체험하고, 진로와 분야가 요구하는 지식, 능력, 경험 등 문화적 소양을 파악할 수 있도록 한다."]},{"교":"국어","c":"12문영01-08","과":"문학과 영상","학":"고2~3","영":"","p":"문학 작품과 영상물을 비판적으로 수용하며 자신의 삶을 성찰한다."},{"교":"국어","c":"12문영01-09","과":"문학과 영상","학":"고2~3","영":"","p":"문학 작품과 영상물을 통해 창의적 사고를 표현하고 세계와 적극적으로 소통하는 태도를 가진다."},{"교":"국어","c":"12문영01-10","과":"문학과 영상","학":"고2~3","영":"","p":"문학 작품과 영상물의 수용과 생산 활동에 따르는 윤리적 책임을 인식하면서 주체적이고 능동적으로 참여한다.","h":["이 성취기준은 문학 작품과 영상물의 수용과 생산 활동에 필요한 윤리적 책임감과 주체적이고 능동적인 태도를 기르기 위해 설정하였다. 문학 작품과 영상물의 사회적 영향력을 인식하면서 문학 작품과 영상물의 수용과 생산이 다른 작품의 가치나 권리 등을 존중하고 개인과 공동체의 삶을 성찰적으로 재현하는 과정이라는 점을 이해하는 데 중점을 둔다. 또한, 매체 환경의 변화에 따라 수용과 생산이 긴밀하게 연계된다는 점을 인식하면서 문학 작품과 영상물을 주체적이고 능동적으로 수용하고 생산하려는 태도를 기르는 데 학습의 초점을 맞춘다."]},{"교":"국어","c":"12직의01-01","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 의사소통의 목적과 맥락, 매체, 참여자 특성을 이해하고 적절한 표현을 사용하여 능동적으로 소통한다.","h":["이 성취기준은 직무 의사소통의 다양하고 역동적인 상황 및 사회⋅문화적 맥락, 참여자의 특성을 이해하고 그에 적합한 표현을 사용하여 소통할 수 있는 능력을 기르기 위해 설정하였다. 직무 의사소통의 목적, 맥락, 매체, 참여자 특성, 직무 환경에 적합한 어휘 사용하기, 어법에 맞고 의미가 정확한 문장 사용하기, 다양한 직무 상황에 적합하게 자신의 생각이나 의견 표현하기 등을 학습한다."]},{"교":"국어","c":"12직의01-02","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 공동체의 다양한 소통 문화와 직무 환경 변화에 적합하게 자기를 소개하고 면접에 참여한다."},{"교":"국어","c":"12직의01-03","과":"직무 의사소통","학":"고2~3","영":"","p":"효과적인 진로 탐색 및 직무 수행을 위해 다양한 방법으로 정보를 수집하고 분석하여 내용을 이해하고 평가한다.","h":["이 성취기준은 진로 탐색과 취업 준비, 실질적인 직무 수행과 관련된 다양한 정보를 조사⋅수집⋅분석⋅해석함으로써 직무를 명료하게 수행할 수 있는 능력을 기르기 위해 설정하였다. 직무와 관련된 문제를 해결하기 위한 정보와 자료를 조사⋅수집하기, 정보와 자료를 목적에 맞게 선별⋅분석하여 핵심 내용을 이해하기, 정보와 자료에 담긴 의도를 추론하고 내용을 비판하기 등을 학습한다."]},{"교":"국어","c":"12직의01-04","과":"직무 의사소통","학":"고2~3","영":"","p":"적절한 매체를 사용하여 직무에 필요한 정보를 체계적으로 관리하고 활용한다.","h":["이 성취기준은 직무에 필요한 정보를 적절하고 효과적으로 활용하기 위하여 정보에 대한 이해를 바탕으로, 직무와 관련된 정보를 안전하고 체계적으로 관리하는 능력을 기르기 위해 설정하였다. 직무 관련 정보를 체계적으로 관리하기, 정보를 직무 의사소통 맥락에 맞게 적절하게 활용하기 등을 학습한다."]},{"교":"국어","c":"12직의01-05","과":"직무 의사소통","학":"고2~3","영":"","p":"정보를 효과적으로 조직하여 직무의 목적⋅대상⋅상황에 적합하게 표현한다."},{"교":"국어","c":"12직의01-06","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 수행 과정에서 발생하는 의사소통 문제와 대인 관계 갈등에 대해 대화와 협의로 대처하고 조정한다."},{"교":"국어","c":"12직의01-07","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 공동체의 의사 결정 과정에 적극적으로 참여하여 대안을 탐색하고 합리적으로 문제를 해결한다."},{"교":"국어","c":"12직의01-08","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 상황에서 구성원들과 다양한 매체를 활용하여 적극적으로 협업하고 언어 예절을 갖추어 소통한다.","h":["이 성취기준은 직무 공동체에서 구성원들이 함께 직무를 수행하는 과정 중에 다양한 매체를 활용해 협업하고 소통하는 능력과 직무 상황에 적절하게 의사소통 예절을 갖추어 표현하는 능력을 기르기 위해 설정하였다. 메타버스, 원격 화상 회의 등 직무 의사소통 수행 양상이 다변화함에 따라 다양한 매체를 소통의 도구로 활용할 수 있음을 이해하기, 직무에 활용할 수 있는 매체의 종류와 이용 방법 및 유의점 파악하기, 각각의 매체들이 가진 특성을 고려하여 직무 의사소통에 적절한 매체 선정하기, 공동의 문제를 해결하기 위해 적절한 매체를 활용해 협업하기, 직장 언어 예절 지키기 등을 학습한다."]},{"교":"국어","c":"12직의01-09","과":"직무 의사소통","학":"고2~3","영":"","p":"개인의 권리와 정보 보안에 대한 책무를 인식하면서 직무 의사소통에 참여한다.","h":["이 성취기준은 직무 공동체에서 의사소통을 하고 직무 관련 각종 정보를 관리하고 활용하는 과정에서 개인의 권리와 정보 보안의 중요성 및 책무성을 인식하는 태도를 기르기 위해 설정하였다. 자신과 타인의 권리 보호 및 정보 보안에 대한 책무성을 인식하고 실천하기, 저작권, 초상권 등의 개인 권리와 정보 보안이 지켜지지 않았을 때의 문제 상황에 따른 대응 방법 익히기 등을 학습한다."]},{"교":"국어","c":"12직의01-10","과":"직무 의사소통","학":"고2~3","영":"","p":"직무 환경의 변화에 대응하여 지속적으로 자기를 계발하고, 직무 의사소통에 능동적이고 협력적으로 참여하는 태도를 지닌다."},{"교":"국어","c":"12독토01-01","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"개인이나 공동체의 관심사를 고려하여 읽을 책을 선정한 후 질문을 생성하고 주체적으로 해석하며 책을 읽는다.","h":["이 성취기준은 독서 토론과 글쓰기의 맥락을 고려하여 스스로 책을 선정하고 자기주도적으로 독서하는 능력을 기르기 위해 설정하였다. 개인의 요구나 관심사, 학업이나 진로, 공동체의 문제나 사회적 현안 등을 고려하여 읽을 책을 선정하고, 독서 전⋅중⋅후 과정에서 필자, 독자, 텍스트, 맥락 등 독서의 구성 요소에 대해 질문을 생성하거나, 내용을 확인하며 읽기, 추론하며 읽기, 비판적으로 읽기, 창의적으로 읽기 등의 방법을 고려하여 질문을 생성하도록 한다. 주체적 해석을 위해서는 저자의 생각에 대한 이유나 근거 파악하기, 저자와 자신의 생각을 비교하기, 자신의 삶에 비추어 책의 내용 해석하기, 책에 담긴 정보나 저자의 의견에 대한 타당성과 신뢰성 판단하기 등을 학습한다."]},{"교":"국어","c":"12독토01-02","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"대화, 토의, 토론 등 적절한 방법을 활용하여, 서로 다른 생각과 관점을 존중하며 독서 토론을 한다."},{"교":"국어","c":"12독토01-03","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"독서 토론의 내용을 바탕으로 쓰기 목적, 독자, 매체를 고려하여 글을 쓰고 공유한다."},{"교":"국어","c":"12독토01-04","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"인간의 삶에 대한 다양한 시각과 해석이 담긴 책을 읽고 독서 토론하고 글을 쓰며 자아를 탐색하고 타자와 세계를 이해한다.","h":["이 성취기준은 독서 토론과 글쓰기 과정에서 더불어 살아가는 삶의 가치를 인식하고 자신과 타자, 세계를 이해하고 공감하는 능력을 기르기 위해 설정하였다. 다양한 인간상이나 삶의 가치를 다룬 문학 작품, 인간 탐구를 주제로 하는 인문학 관련 책, 개인과 사회의 관계나 인간과 자연의 관계를 탐구하는 책 등을 읽고, 책 속에 담긴 다양한 삶의 방식 이해하기, 책 속의 인물이나 사회가 추구하는 가치관 비평하기, 자아와 타자 또는 자아와 세계의 관계에 대해 대화하기, 자아와 타자, 세계에 대한 성찰이나 이해가 드러나는 글을 쓰고 공유하기 등을 학습한다."]},{"교":"국어","c":"12독토01-05","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"다양한 분야의 정보가 담긴 책을 읽고 독서 토론하고 글을 쓰며 학습이나 삶에 필요한 지식을 확장하고 교양을 함양한다.","h":["이 성취기준은 독서 토론과 글쓰기 과정에서 학습이나 삶에 필요한 지식을 확장하고 교양을 함양하여 평생 학습을 실현하고 교양인으로서의 품위를 기르기 위해 설정하였다. 인문⋅예술, 사회⋅문화, 과학⋅기술 등의 분야에서 학문적 성과가 담긴 책, 새로운 관점이나 사유가 담긴 책 등을 읽고, 책에 담긴 정보의 의미와 정보 간의 관계 파악하기, 학습이나 진로, 실생활에 필요한 정보를 선별하고 재구성하기, 새로운 정보의 가치에 대해 토의하고 비판적으로 수용하기, 새롭게 알게 된 정보를 활용하여 글을 쓰고 공유하기 등을 학습한다."]},{"교":"국어","c":"12독토01-06","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"사회적인 현안이나 쟁점이 담긴 책을 읽고 독서 토론하고 글을 쓰며 공동체 문제를 해결하고 사회적 담론에 참여한다.","h":["이 성취기준은 독서 토론과 글쓰기 과정에서 공동체의 문제를 탐구하고 해결하며 사회적인 담론에 능동적으로 참여하는 능력을 기르기 위해 설정하였다. 청소년 관련 사회 문제를 다룬 책, 집단 간의 갈등, 인권, 생태⋅환경 등 우리 사회의 문제나 전 지구적인 문제를 다룬 책을 읽고, 공동체 문제와 관련된 현안이나 쟁점 분석하기, 책의 내용을 바탕으로 문제 해결 방안을 모색하는 토의 및 토론하기, 다양한 대안을 찾고 대안의 타당성과 실현 가능성 평가하기, 사회적 담론에 참여하는 글을 쓰고 공유하기 등을 학습한다."]},{"교":"국어","c":"12독토01-07","과":"독서 토론과 글쓰기","학":"고2~3","영":"","p":"독서 토론과 글쓰기의 특성을 이해하고 독서, 독서 토론, 글쓰기에 능동적으로 참여한다."},{"교":"국어","c":"12매의01-01","과":"매체 의사소통","학":"고2~3","영":"","p":"매체의 기능과 역할에 대한 이해를 바탕으로 시대별 매체 환경과 소통 문화의 변화 과정을 탐색한다.","h":["이 성취기준은 매체의 기능과 역할에 대한 이해를 바탕으로 매체 환경의 변화가 개인과 사회에 미치는 영향력을 인식하고 매체 소통 현상에 대한 관찰력을 기르기 위해 설정하였다. 정보 수집 및 전달, 갈등 조정, 문화 전파 및 전수, 오락 기능 등을 중심으로 매체의 기능에 대해 이해하고, 매체의 사회적 역할을 인식하도록 한다. 이를 바탕으로 신문, 라디오, 텔레비전, 컴퓨터와 인터넷, 스마트폰 등 시대를 대표하는 매체의 등장이 매체 환경에 어떤 변화를 가져왔는지 파악하고 매체의 기능과 역할, 소통 문화, 생활 방식 등이 어떻게 달라졌는지 탐구하도록 한다."]},{"교":"국어","c":"12매의01-02","과":"매체 의사소통","학":"고2~3","영":"","p":"소셜 미디어나 온라인 동영상 플랫폼 등의 디지털 매체 환경에서 청소년 문화가 지닌 문제와 가능성을 탐구한다.","h":["이 성취기준은 소셜 미디어나 온라인 동영상 플랫폼 등의 디지털 매체 환경에서 청소년들이 매체 의사소통의 주체로서 자신의 문화를 성찰하고 가능성을 탐구하는 능력을 기르기 위해 설정하였다. 청소년들은 매체를 통해 자기를 표현하고 타인과 관계를 맺으며 소통하고, 학업 및 진로 등에 필요한 정보나 즐거움을 얻기도 한다. 이 과정에서 청소년은 집단지성을 발휘하여 지식을 확장하고 공유하며, 다양한 사회활동에 참여하면서 자신의 역량과 잠재력을 발휘한다. 동시에 부적절한 정보나 매체 자료의 영향을 받거나 디지털 소통에 과몰입하기도 한다. 청소년의 매체 이용 방식에 대해 성찰하고, 자신과 공동체의 문제 해결을 위한 방안에 대해 탐구하도록 한다."]},{"교":"국어","c":"12매의01-03","과":"매체 의사소통","학":"고2~3","영":"","p":"영화, 게임, 웹툰 등의 매체 자료가 현실을 재현하는 방식을 분석하며 생산자의 의도나 관점을 파악한다.","h":["이 성취기준은 영화, 광고, 게임, 웹툰, 웹드라마, 애니메이션 등 다양한 매체 자료가 현실을 어떻게 재현하고 있는가를 분석하는 능력을 기르기 위해 설정하였다. 재현이란 현실에 존재하는 대상을 매체를 통하여 다시 나타내는 것으로, 매체가 재현하는 현실은 특정한 관점과 의도에 의해 선택되거나 배제된, ‘중재된’ 세상이다. 예를 들어, 영화, 게임, 웹툰 등 서사가 드러난 매체 자료에서 특정한 이야기나 사건, 인물을 나타내기 위해 어떤 표현이 선택되거나 배제되는지를 파악하면서 매체에 재현된 현실이 매체 생산자의 의도나 관점에 따라 다름을 이해한다. 그리고 특정한 성, 지역, 직업, 계층, 연령 등과 관련된 고정 관념이 매체 자료에 어떻게 표현되는지를 분석하면서 매체 자료가 어떤 사회적 메시지나 가치를 담고 있는지를 분석하고, 그에 따라 생산자의 의도가 무엇인지 또한 이에 대한 자신의 생각이나 관점이 무엇인지 설명할 수 있도록 안내한다."]},{"교":"국어","c":"12매의01-04","과":"매체 의사소통","학":"고2~3","영":"","p":"디지털 매체 환경에서 매체 생산자의 관점을 파악하고 매체 자료의 신뢰성을 판단한다.","h":["이 성취기준은 포털사이트, 소셜 미디어, 온라인 동영상 플랫폼 등 디지털 매체 환경에서 매체 자료를 비판적으로 분석하고 수용하는 능력을 기르기 위해 설정하였다. 언론사에서 생산한 뉴스, 개인이나 집단이 소셜 미디어 등에서 생산⋅공유한 정보의 내용과 표현 방식 등을 탐색하면서 매체 생산자가 의도한 상업적 이익이나 사회적 목적이 무엇인지 분석하도록 한다. 예를 들어, 매체 자료가 실제 대상이나 사건의 어떤 점을 부각하는지, 어떤 관점을 대변하고 어떤 쟁점에 침묵하는지 등을 분석하여 매체 생산자의 의도와 관점을 파악할 수 있다. 또한 매체 자료에 포함된 근거 자료가 정확한지, 매체의 출처가 믿을 만한지를 확인하고 유사한 주제를 다루었거나 관점이 다른 매체 자료와 비교하면서 매체 자료를 신뢰할 수 있는지를 종합적으로 판단하도록 한다."]},{"교":"국어","c":"12매의01-05","과":"매체 의사소통","학":"고2~3","영":"","p":"사회적 규범과 규제가 매체 자료의 생산과 소통에 미치는 영향을 조사하고 그 의미를 탐구한다.","h":["이 성취기준은 매체 자료가 사회적 규범과 규제 속에서 소통된다는 것을 이해하고, 이를 바탕으로 매체 자료에 반영된 사회적 규범과 규제의 영향을 분석하기 위해 설정하였다. 이를 위해 이용자가 참여하는 플랫폼을 둘러싸고 있는 생태계의 특성이나 특정 플랫폼에서 자체적으로 생성한 자율적인 규범이나 준칙 등에 대해 조사하고 공유하도록 한다. 그리고 저작권, 초상권, 개인 정보 보호, 잊힐 권리 등 디지털 매체 환경에서 지키도록 사회적으로 합의된 규범이 무엇인지 탐색하도록 한다. 또한 이용 등급 분류, 보도 준칙, 방송 광고 규제, 인터넷 실명제, 게임 시간 선택제 등 사회적 규제의 원칙과 쟁점 사항을 분석하도록 한다. 이를 통해 매체 자료의 생산과 소통에 미치는 사회적 규범과 규제의 특성과 적절성을 비판적으로 탐구하도록 한다."]},{"교":"국어","c":"12매의01-06","과":"매체 의사소통","학":"고2~3","영":"","p":"개인적⋅사회적 관심사에 대한 자신의 관점이 드러나는 주제를 선정하여 설득력 있는 매체 자료를 제작하고 공유한다."},{"교":"국어","c":"12매의01-07","과":"매체 의사소통","학":"고2~3","영":"","p":"매체 자료의 생산자이자 수용자로서 권리와 책임을 인식하고 사회적 가치와 문제에 대해 소통한다."},{"교":"국어","c":"12언탐01-01","과":"언어생활 탐구","학":"고2~3","영":"","p":"자신의 언어생활에서 의미 있는 탐구 주제를 발견하여 탐구 절차에 따라 언어 자료를 수집하고 비판적으로 분석한다."},{"교":"국어","c":"12언탐01-02","과":"언어생활 탐구","학":"고2~3","영":"","p":"언어 자료를 평가⋅해석하고 그 결과를 공유하며 자신과 공동체의 언어생활에 대한 민감성과 책임감을 지닌다."},{"교":"국어","c":"12언탐01-03","과":"언어생활 탐구","학":"고2~3","영":"","p":"글과 담화의 소통 맥락을 고려하여 다양한 분야 및 교과의 언어 자료에 나타난 표현 특성과 효과를 탐구한다.","h":["이 성취기준은 다양한 분야와 교과에서 글이나 담화가 소통되는 맥락을 이해하고, 글이나 담화에 전략적으로 사용된 표현 특성과 효과를 탐구하는 능력을 기르기 위해 설정하였다. 다양한 전문 분야 및 교과의 글이나 담화에서 수집한 어휘, 문장, 문법 요소, 담화 구조 등을 분석하여 언어 사용 주체의 의도가 반영된 표현 전략과 그 효과를 파악한다. 또한 각 전문 분야 및 교과의 글이나 담화에 사용되는 전문어와 사고 도구어를 살펴보고, 각 교과에 사용된 언어를 비교⋅분석하여 학습을 위한 언어의 표현 방식과 특성을 탐구한다."]},{"교":"국어","c":"12언탐01-04","과":"언어생활 탐구","학":"고2~3","영":"","p":"가정, 학교, 사회의 언어 사용에 나타난 정체성의 실현 양상과 관계 형성의 양상을 탐구한다.","h":["이 성취기준은 인간은 언어를 사용하여 자신의 정체성을 다층적으로 드러낸다는 점을 이해하고, 사회적 관계를 만들어 가는 기호적 실천 행위로서 언어가 지니는 특성을 탐구하기 위해 설정하였다. 언어에는 언어 사용자의 개인적⋅사회적 정체성이 반영됨을 이해하고, 가정⋅학교⋅사회의 각 공동체에서 소속 여부 및 친소 관계나 사회적 지위 관계 등에 따른 언어 사용의 공통점과 차이점을 비교한다. 학습자의 일상생활을 비롯하여 책, 드라마나 영화 등의 여러 매체에 나타나는 구체적인 의사소통 맥락을 중심으로 자신의 언어 사용에 나타난 정체성 및 공동체 구성원과의 관계를 규정하고 형성해 나가는 양상을 탐구한다."]},{"교":"국어","c":"12언탐01-05","과":"언어생활 탐구","학":"고2~3","영":"","p":"다양한 매체 환경에서 사회적 담론이 형성되는 맥락과 과정을 탐구한다.","h":["이 성취기준은 다양한 매체 환경에서 소통되는 언어 자료를 분석하여 사회적 담론이 형성되는 과정과 소통 맥락을 탐구하고 이를 바탕으로 사회적 담론을 비판적으로 읽어 내는 안목을 기르기 위해 설정하였다. 광고 언어나 보도 언어 등의 소통 맥락과 언어적 특성을 살펴 ‘누가,’ ‘어떻게’, ‘무엇’을 말하고 있는지, 더 나아가 무엇을 숨기고 있거나 당연한 것으로 전제하고 있는지 등을 파악함으로써, 사회적 담론이 형성되는 맥락과 과정을 탐구한다. 방송, 신문과 같은 전통적인 대중 매체뿐만 아니라 사회 관계망 서비스(SNS), 인터넷 커뮤니티 등 인터넷을 기반으로 소통되는 언어 자료를 탐구하되, 사회적 담론에 대해 비판적이고도 균형적인 시각을 형성할 수 있도록 다양한 사례를 탐구한다."]},{"교":"국어","c":"12언탐01-06","과":"언어생활 탐구","학":"고2~3","영":"","p":"품격 있는 언어생활의 특성을 이해하고 공공 언어 사용의 실제를 탐구한다.","h":["이 성취기준은 품격 있는 언어생활의 중요성을 이해하고 공공 언어가 사용되는 실제를 탐구하여 바람직한 언어문화를 주도하는 능력을 기르기 위해 설정하였다. 정부 및 공공기관에서 사회 구성원을 대상으로 사용하는 언어를 주요 탐구 대상으로 하되, 개인의 언어 역시 맥락에 따라 공공성을 가질 수 있음을 인지하고 이를 탐구하도록 한다. 비속어, 욕설 등의 저속한 표현이나 차별⋅혐오 표현, 상황 맥락에 따른 구어 표현과 문어 표현, 청자 혹은 독자의 이해를 돕거나 방해하는 표현 등의 특징을 분석하고, 정확성과 적절성, 소통성, 품격 등을 중심으로 공공 언어 사용의 실제를 탐구한다."]},{"교":"국어","c":"12언탐01-07","과":"언어생활 탐구","학":"고2~3","영":"","p":"언어가 우리 삶에서 담당하는 역할을 이해하고, 주체적⋅능동적으로 바람직한 언어문화를 실천한다."},{"교":"도덕","c":"4도01-01","과":"도덕","학":"초3~4","영":"자신과의 관계","p":"자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다."},{"교":"도덕","c":"4도01-02","과":"도덕","학":"초3~4","영":"자신과의 관계","p":"정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다."},{"교":"도덕","c":"4도01-03","과":"도덕","학":"초3~4","영":"자신과의 관계","p":"성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다."},{"교":"도덕","c":"4도01-04","과":"도덕","학":"초3~4","영":"자신과의 관계","p":"다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다."},{"교":"도덕","c":"6도01-01","과":"도덕","학":"초5~6","영":"자신과의 관계","p":"자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다."},{"교":"도덕","c":"6도01-02","과":"도덕","학":"초5~6","영":"자신과의 관계","p":"생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다.","h":["이 성취기준의 취지는 자신의 행동에 대한 문제점을 확인하고 재정립하도록 하여 반성하는 태도를 기르기 위한 것이다. 학생이 스스로 자기 행동의 문제를 인식하고 개선하려 노력함으로써 바른 도덕 생활의 토대를 마련하도록 한다."]},{"교":"도덕","c":"6도01-03","과":"도덕","학":"초5~6","영":"자신과의 관계","p":"자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다."},{"교":"도덕","c":"4도02-01","과":"도덕","학":"초3~4","영":"타인과의 관계","p":"효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다."},{"교":"도덕","c":"4도02-02","과":"도덕","학":"초3~4","영":"타인과의 관계","p":"친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다."},{"교":"도덕","c":"4도02-03","과":"도덕","학":"초3~4","영":"타인과의 관계","p":"공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다."},{"교":"도덕","c":"6도02-01","과":"도덕","학":"초5~6","영":"타인과의 관계","p":"봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다.","h":["이 성취기준의 취지는 봉사의 의미와 중요성을 지식적으로만 이해하는 것에 그치지 않고 타인의 환경에 대한 관심을 바탕으로 생활 속에서 자연스럽게 봉사를 실천할 수 있는 역량을 함양하기 위한 것이다. 타인을 위한 봉사 경험을 통해 학생에게 진정한 이타심과 봉사 의지를 다지고 고양할 기회를 제공하도록 한다."]},{"교":"도덕","c":"6도02-02","과":"도덕","학":"초5~6","영":"타인과의 관계","p":"편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다."},{"교":"도덕","c":"6도02-03","과":"도덕","학":"초5~6","영":"타인과의 관계","p":"인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다."},{"교":"도덕","c":"4도03-01","과":"도덕","학":"초3~4","영":"사회⋅공동체와의 관계","p":"불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다.","h":["이 성취기준의 취지는 학생이 자신의 삶에서 공정이라는 가치에 관해 성찰하는 기회를 갖도록 하여 공정한 사회로 발전해가는 토대를 마련하려는 것이다. 학생이 공정과 불공정의 사례를 스스로 탐구하고 일상에서 공정을 실제로 추구하는 활동을 실천함으로써 공정의 가치를 생활화할 수 있도록 한다."]},{"교":"도덕","c":"4도03-02","과":"도덕","학":"초3~4","영":"사회⋅공동체와의 관계","p":"디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다."},{"교":"도덕","c":"4도03-03","과":"도덕","학":"초3~4","영":"사회⋅공동체와의 관계","p":"통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다."},{"교":"도덕","c":"6도03-01","과":"도덕","학":"초5~6","영":"사회⋅공동체와의 관계","p":"인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다."},{"교":"도덕","c":"6도03-02","과":"도덕","학":"초5~6","영":"사회⋅공동체와의 관계","p":"정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안하며 기초적인 시민의식을 기른다."},{"교":"도덕","c":"6도03-03","과":"도덕","학":"초5~6","영":"사회⋅공동체와의 관계","p":"통일과정과 통일 이후 사회의 여러 가지 상황을 예상하고 바람직한 통일과정과 통일 국가의 사회상을 제시한다"},{"교":"도덕","c":"6도03-04","과":"도덕","학":"초5~6","영":"사회⋅공동체와의 관계","p":"다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다."},{"교":"도덕","c":"4도04-01","과":"도덕","학":"초3~4","영":"자연과의 관계","p":"생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다."},{"교":"도덕","c":"4도04-02","과":"도덕","학":"초3~4","영":"자연과의 관계","p":"인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.","h":["이 성취기준의 취지는 학생이 일상에서 자연스럽게 생태 감수성과 생태전환적 사고에 따라 실천하도록 하기 위한 것이다. 생태전환과 관련된 도덕적 쟁점을 마주할 때 단순히 생태 체험에만 그치지 않고, 인간중심 사고에서 벗어나 자연과의 공존을 위한 생각과 행동의 변화까지 모색한다."]},{"교":"도덕","c":"6도04-01","과":"도덕","학":"초5~6","영":"자연과의 관계","p":"지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일상에서 실천하고자 노력한다."},{"교":"도덕","c":"6도04-02","과":"도덕","학":"초5~6","영":"자연과의 관계","p":"지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다."},{"교":"도덕","c":"9도01-01","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"자신의 삶과 가치관에 대한 성찰을 통해 자아를 올바로 이해하고, 삶에서 도덕이 필요한 이유에 근거하여 도덕적인 삶에 대한 의지를 기른다."},{"교":"도덕","c":"9도01-02","과":"도덕","학":"중1~3","영":"자신과
