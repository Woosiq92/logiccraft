 문제를 찾고, 연구 윤리와 안전 사항을 준수하여 과학 탐구의 전체 과정을 수행하며, 해결책을 다양한 표상을 통해 산출하도록 한다."]},{"교":"과학","c":"10과탐2-01-03","과":"과학탐구실험2","학":"고1","영":"생활 속의 과학 탐구","p":"과학 개념을 적용하여 실생활 문제의 해결방안을 창의적으로 고안하고, 필요한 도구를 설계⋅제작할 수 있다.","h":["‘운동 관련 안전사고 예방 장치 고안하기’ 탐구 활동을 통해 협업의 가치를 깨닫고, 과학 탐구 전체 과정을 경험하여 공학적 설계 과정을 거쳐 창의적인 산출물을 고안하게 한다."]},{"교":"과학","c":"10과탐2-02-01","과":"과학탐구실험2","학":"고1","영":"미래 사회와 첨단 과학 탐구","p":"첨단 과학기술 속의 과학 원리를 찾아내는 탐구 활동을 통해 과학 지식이 활용된 사례를 추론할 수 있다.","h":["마이크로 컨트롤러(Micro Controller unit)를 활용한 각종 자료 수집⋅분석 등의 활동을 통해 첨단 과학기술에 포함된 기초 과학 원리를 파악하고, 주변 환경을 탐구하고 개선하는 데 첨단 과학기술을 활용하는 체험을 제공한다."]},{"교":"과학","c":"10과탐2-02-02","과":"과학탐구실험2","학":"고1","영":"미래 사회와 첨단 과학 탐구","p":"과학 원리가 적용된 첨단 과학기술 및 탐구 산출물을 발표하고 공유하며, 이를 확산할 수 있다.","h":["사물인터넷 센서의 실시간 데이터 활용 등을 통해 첨단 과학기술을 이용한 산출물을 만들어내는 탐구 활동을 진행한다."]},{"교":"과학","c":"10과탐2-02-03","과":"과학탐구실험2","학":"고1","영":"미래 사회와 첨단 과학 탐구","p":"탐구 활동 과정에서 지켜야 할 생명 존중, 연구 진실성, 지식 재산권 존중 등과 같은 연구 윤리와 함께, 과학기술 이용과 관련된 과학 윤리 및 안전 사항을 준수할 수 있다.","h":["자원탐사 및 정주 공간 확보를 위한 우주개발 사례 조사 등의 활동을 통해 미래 과학기술의 발전 방향, 과학기술 이용과 관련된 환경정의, 안전 사항을 점검할 기회를 제공한다."]},{"교":"과학","c":"12물리01-01","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"물체에 작용하는 알짜힘과 돌림힘이 0일 때 평형을 이룸을 알고, 다양한 구조물의 안정성을 분석할 수 있다.","h":["일상생활에서 접할 수 있는 다양한 상황에서 돌림힘을 적용하되, 동역학적 상황이나 돌림힘의 기준점이 2개 이상이 되는 등 현실에서 찾기 힘든 복잡한 상황은 다루지 않는다."]},{"교":"과학","c":"12물리01-02","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"뉴턴 운동 법칙으로 등가속도 운동을 설명하고, 교통안전 사고 예방에 적용할 수 있다."},{"교":"과학","c":"12물리01-03","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"작용과 반작용 관계와 운동량 보존 법칙을 알고, 스포츠, 교통수단, 발사체 등에 적용할 수 있다."},{"교":"과학","c":"12물리01-04","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"일과 운동 에너지의 관계를 이해하고, 위치 에너지와 역학적 에너지 보존 법칙을 설명할 수 있다.","h":["역학적 에너지 보존의 예로 지표 근처의 중력에 의한 위치 에너지와 탄성력에 의한 위치 에너지를 포함한다."]},{"교":"과학","c":"12물리01-05","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"역학적 에너지가 열의 형태로 전환될 때 에너지 총량이 변하지 않음을 설명할 수 있다.","h":["열역학 과정을 명시적으로 다루지 않고, 열의 형태로 에너지가 전환되면서 발생하는 다양한 현상으로 열전달, 물질의 상태 변화, 기상 현상 등 중학교 과정에서 다룬 내용을 정성적으로 설명한다."]},{"교":"과학","c":"12물리01-06","과":"물리학","학":"고2~3","영":"힘과 에너지","p":"열이 역학적 에너지로 전환되는 과정의 효율을 정성적으로 이해하고, 영구기관이 불가능함을 사례를 통해 논증할 수 있다."},{"교":"과학","c":"12물리02-01","과":"물리학","학":"고2~3","영":"전기와 자기","p":"전하를 띤 입자들이 전기장과 전위차를 형성하여 서로 전기적으로 상호작용함을 설명할 수 있다."},{"교":"과학","c":"12물리02-02","과":"물리학","학":"고2~3","영":"전기와 자기","p":"전기 회로에서 저항의 연결에 따라 소비 전력이 달라짐을 알고, 다양한 전기 기구에서 적용되는 사례를 찾을 수 있다.","h":["저항의 연결에 따른 차이를 설명하는 사례로 가정에서 여러 개의 전기 제품을 병렬연결하여 사용하는 상황 등을 제시하고, 전기 안전과 연관지어 안전한 전기 사용 방안을 도출하도록 한다."]},{"교":"과학","c":"12물리02-03","과":"물리학","학":"고2~3","영":"전기와 자기","p":"축전기에서 전기 에너지를 저장하는 원리가 각종 센서와 전기 신호 입력 장치 등 실생활 제품에서 활용됨을 설명할 수 있다.","h":["축전기에서 전기 에너지가 저장되는 원리와 활용 방안을 다루되, 축전기의 전기 용량, 연결, 유전체는 포함하지 않는다."]},{"교":"과학","c":"12물리02-04","과":"물리학","학":"고2~3","영":"전기와 자기","p":"자성체의 종류를 알고 일상생활과 산업 기술에서 자성체가 활용되는 예를 찾을 수 있다."},{"교":"과학","c":"12물리02-05","과":"물리학","학":"고2~3","영":"전기와 자기","p":"전류의 자기 작용을 이용하여 에너지를 전환하는 장치의 원리를 알고, 스피커와 전동기 등을 설계할 수 있다.","h":["전류의 자기 작용의 예시로 스피커와 전동기의 원리를 에너지 전환 관점에서 설명하고, 학생들이 스피커를 공학적으로 설계하고 제작하도록 지도한다."]},{"교":"과학","c":"12물리02-06","과":"물리학","학":"고2~3","영":"전기와 자기","p":"전자기 유도 현상이 센서, 무선통신, 무선충전 등 에너지 전달 기술에 적용되어 현대 문명에 미친 영향을 인식할 수 있다.","h":["전자기 유도 법칙 자체보다는 에너지와 신호 전달 기술에 초점을 맞추어 내용을 전개한다."]},{"교":"과학","c":"12물리03-01","과":"물리학","학":"고2~3","영":"빛과 물질","p":"빛의 중첩과 간섭을 통해 빛의 파동성을 알고, 이를 이용한 기술과 현상을 예를 들어 설명할 수 있다."},{"교":"과학","c":"12물리03-02","과":"물리학","학":"고2~3","영":"빛과 물질","p":"빛의 굴절을 이용하여 볼록렌즈에서 상이 맺히는 과정을 설명하고, 반도체와 디스플레이 제작 공정에서 중요하게 활용됨을 인식할 수 있다.","h":["상이 맺히는 과정을 설명하기 위해 광선 추적법을 도입하며, 결상 공식이나 렌즈 제작자 공식, 복합 렌즈 등 복잡한 상황은 다루지 않는다. 광학 기술이 반도체 제작 공정에서 매우 정밀한 회로 기판을 인쇄하는 데 사용됨을 포토 리소그래피(photo-lithography) 과정을 중심으로 개략적으로 소개한다."]},{"교":"과학","c":"12물리03-03","과":"물리학","학":"고2~3","영":"빛과 물질","p":"빛과 물질의 이중성이 전자 현미경과 영상 정보 저장 등 다양한 분야에 활용됨을 설명할 수 있다."},{"교":"과학","c":"12물리03-04","과":"물리학","학":"고2~3","영":"빛과 물질","p":"원자 내의 전자는 양자화된 에너지 준위를 가지고 있음을 스펙트럼 관찰 증거를 바탕으로 논증할 수 있다.","h":["수소 선스펙트럼 결과를 바탕으로 보어(Bohr)의 수소 원자 모형을 제시하고, 보어 모형의 한계를 언급한다."]},{"교":"과학","c":"12물리03-05","과":"물리학","학":"고2~3","영":"빛과 물질","p":"고체의 에너지띠 구조로부터 도체와 부도체의 차이를 알고, 반도체 소자의 원리를 설명할 수 있다.","h":["반도체 소자의 원리를 설명하는 사례로 p-n 접합과 다이오드를 다룬다."]},{"교":"과학","c":"12물리03-06","과":"물리학","학":"고2~3","영":"빛과 물질","p":"모든 관성계에서 빛의 속력이 동일하다는 원리로부터 시간 팽창, 길이 수축 현상이 나타남을 알고, 이러한 지식이 사회에 미친 영향을 조사할 수 있다.","h":["특수 상대성 이론은 광속 불변의 결과로 시간 팽창과 길이 수축이 일어나는 현상 위주로 설명하고, 동시성의 상대성과 정량적 계산은 다루지 않는다."]},{"교":"과학","c":"12화학01-01","과":"화학","학":"고2~3","영":"화학의 언어","p":"화학이 현대 과학⋅기술⋅사회의 발전에 기여한 사례를 조사⋅발표하며 화학에 흥미와 호기심을 가질 수 있다."},{"교":"과학","c":"12화학01-02","과":"화학","학":"고2~3","영":"화학의 언어","p":"다양한 단위를 몰로 환산할 수 있음을 이해하고, 물질의 양을 몰 단위로 표현할 수 있다."},{"교":"과학","c":"12화학01-03","과":"화학","학":"고2~3","영":"화학의 언어","p":"여러 가지 반응을 화학 반응식으로 나타내고, 화학 반응에서 물질의 양적 관계를 설명할 수 있다.","h":["화학 반응식의 계수비는 반응하는 물질의 몰수비임을 강조하고, 화학 반응의 양적 관계를 다룰 때는 몰질량을 이용하여 몰수로 표현하면 반응물과 생성물의 양적 관계를 쉽게 이해할 수 있음을 강조한다."]},{"교":"과학","c":"12화학02-01","과":"화학","학":"고2~3","영":"물질의 구조와 성질","p":"실험을 통해 화학 결합의 전기적 성질을 설명할 수 있다."},{"교":"과학","c":"12화학02-02","과":"화학","학":"고2~3","영":"물질의 구조와 성질","p":"전기 음성도의 주기적 변화를 이해하고, 결합한 원소들의 전기 음성도 차이와 쌍극자 모멘트를 이용하여 결합의 극성을 판단할 수 있다.","h":["쌍극자 모멘트는 정성적으로 다룬다."]},{"교":"과학","c":"12화학02-03","과":"화학","학":"고2~3","영":"물질의 구조와 성질","p":"원자와 분자를 루이스 전자점식으로 표현하고, 전자쌍 반발 이론을 근거로 분자의 구조를 추론하여 모형으로 나타낼 수 있다.","h":["중심 원자는 2, 3주기 전형 원소 중 Be, B와 옥텟 규칙을 따르는 경우로 한정한다."]},{"교":"과학","c":"12화학02-04","과":"화학","학":"고2~3","영":"물질의 구조와 성질","p":"물질의 물리적, 화학적 성질을 분자의 구조와 연관 짓고, 이에 대한 호기심을 가질 수 있다."},{"교":"과학","c":"12화학03-01","과":"화학","학":"고2~3","영":"화학 평형","p":"가역 반응에서 나타나는 화학 평형 상태의 특징을 설명할 수 있다.","h":["가역 반응의 예시를 들 때 거시적으로 관찰 가능한 화학 평형 상태의 특징과 동적 평형 상태를 구분하여 다룬다."]},{"교":"과학","c":"12화학03-02","과":"화학","학":"고2~3","영":"화학 평형","p":"화학 반응에서 반응물과 생성물의 농도 자료를 통해 평형 상수의 의미를 설명할 수 있다.","h":["몰 농도 개념에 대한 설명은 평형 상수의 의미를 이해하는 데 필요한 정도로만 하고 자세한 내용은 ‘역동적인 화학 반응’에서 다룬다. 압력 평형 상수는 다루지 않는다."]},{"교":"과학","c":"12화학03-03","과":"화학","학":"고2~3","영":"화학 평형","p":"반응 지수의 의미를 알고, 이를 평형 상수와 비교하여 반응의 진행 방향을 예측할 수 있다."},{"교":"과학","c":"12화학03-04","과":"화학","학":"고2~3","영":"화학 평형","p":"농도, 압력, 온도 변화에 따른 화학 평형의 이동을 이해하고, 이를 일상생활 속 현상을 설명하는 데 적용하여 화학의 유용함을 느낄 수 있다."},{"교":"과학","c":"12화학04-01","과":"화학","학":"고2~3","영":"역동적인 화학 반응","p":"물의 자동 이온화와 물의 이온화 상수를 이해하고, 수소 이온의 농도를 pH로 표현할 수 있다."},{"교":"과학","c":"12화학04-02","과":"화학","학":"고2~3","영":"역동적인 화학 반응","p":"몰 농도의 의미를 이해하고, 원하는 몰 농도의 용액을 만들 수 있다."},{"교":"과학","c":"12화학04-03","과":"화학","학":"고2~3","영":"역동적인 화학 반응","p":"중화 반응을 이해하고, 중화 반응에서의 양적 관계를 설명할 수 있다.","h":["중화 반응에서의 양적 관계는 강산과 강염기의 반응으로 제한한다."]},{"교":"과학","c":"12화학04-04","과":"화학","학":"고2~3","영":"역동적인 화학 반응","p":"중화 적정 실험을 계획하고 수행하여 미지 시료의 농도를 찾을 수 있다.","h":["중화 적정 곡선은 다루지 않는다."]},{"교":"과학","c":"12생과01-01","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"생물 및 생명과학의 특성을 이해하고 생명과학의 성과를 협력적으로 소통할 수 있다.","h":["생물과 비생물의 특성을 비교하고, 생명과학 분야의 학문적 특징은 간략하게 다루며, 현대 생명과학 분야의 성과는 여러 학문 분야의 성과와 결합되어 나타난다는 것에 초점을 두도록 한다."]},{"교":"과학","c":"12생과01-02","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"세포에서부터 생태계까지 생명 시스템의 구성 단계의 특징을 바탕으로 체계적인 설명 자료를 만들 수 있다.","h":["세포로부터 개체, 그리고 생태계에 이르기까지 생물의 구성 단계들이 구조적 체계를 이루고 있으며, 각각이 생명 시스템으로서 기능을 하고 있다는 것을 다룬다."]},{"교":"과학","c":"12생과01-03","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"물질대사 과정에서의 에너지 전환 과정을 바탕으로 다양한 생명 활동에서의 에너지 사용을 추론할 수 있다.","h":["ATP 구조를 구체적으로 다루기보다는 모든 살아있는 세포는 물질대사 과정에서 에너지가 ATP로 저장되고 사용된다는 수준에서 다루도록 한다."]},{"교":"과학","c":"12생과01-04","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"소화, 순환, 호흡, 배설 과정이 기관계의 통합적 작용으로 나타남을 신체의 생리적 변화와 연관지어 추론할 수 있다.","h":["기관계의 통합적 작용을 실제 인체 활동 과정에서 나타나는 생리적 변화의 사례를 바탕으로 설명하도록 한다."]},{"교":"과학","c":"12생과01-05","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"물질대사 관련 질병 조사를 위한 방법을 고안하여 수행하고 대사성 질환을 예방하기 위한 올바른 생활 습관에 대해 토의하며 협력적으로 소통할 수 있다."},{"교":"과학","c":"12생과01-06","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"생태계의 구조를 이해하고 물질의 순환과 에너지의 흐름을 추론하여 생태계 구성 요소들의 중요성을 설명할 수 있다.","h":["생태계를 하나의 살아있는 유기체와 같은 개념으로서 이해하도록 하여 외부 환경의 변화에 의해 생태계 평형이 깨질 수 있음을 다룬다."]},{"교":"과학","c":"12생과01-07","과":"생명과학","학":"고2~3","영":"생명 시스템의 구성","p":"개체군과 군집의 특성을 이해하고 이들의 상호작용의 예를 조사하여 발표할 수 있다.","h":["개체군 내의 상호작용은 텃세, 순위제, 리더제, 사회생활, 가족생활을, 군집 내의 상호작용은 종간 경쟁, 분서, 공생, 기생, 포식과 피식을 다룬다."]},{"교":"과학","c":"12생과02-01","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"신경 세포의 구조와 기능을 이해하고, 신경 세포에서의 전도 과정을 모식도로 표현할 수 있다."},{"교":"과학","c":"12생과02-02","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"시냅스를 통한 신경 신호의 전달 과정을 이해하고, 약물이 시냅스 전달에 영향을 미치는 사례를 조사하여 발표할 수 있다."},{"교":"과학","c":"12생과02-03","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"사람 신경계의 구조와 기능을 이해하고 중추 신경계와 말초 신경계의 특징을 설명할 수 있다.","h":["중학교 수준에서 다루었던 자극과 반응 사이에 정보를 전달하는 신경계의 구조와 종류보다는 중추 신경계의 핵심인 대뇌 중심으로 뇌의 구조와 기능을 설명하고 중뇌, 소뇌, 연수, 간뇌는 간략하게 다루도록 한다."]},{"교":"과학","c":"12생과02-04","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"내분비계와 신경계 작용 원리와 상호작용의 이해를 바탕으로 우리 몸의 항상성이 유지되는 과정을 추론할 수 있다.","h":["내분비계는 호르몬의 종류에 초점을 두기보다는 신경계와 호르몬의 통합적 작용에 의한 항상성 조절에 초점을 두어 다루도록 한다."]},{"교":"과학","c":"12생과02-05","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"병원체의 종류와 특징을 이해하고 우리 몸의 방어 작용을 선천적 면역과 후천적 면역으로 구분하여 설명할 수 있다."},{"교":"과학","c":"12생과02-06","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"항원 항체 반응의 특이성을 이해하고, 혈액의 응집 반응 원리를 이용하여 혈액형을 판정할 수 있다."},{"교":"과학","c":"12생과02-07","과":"생명과학","학":"고2~3","영":"항상성과 몸의 조절","p":"백신의 종류와 작용 원리를 조사하고 질병의 예방 측면에서 백신의 필요성을 인식하여 협력적으로 소통할 수 있다.","h":["백신 제조 방법에 따른 다양한 종류의 백신을 조사하고 감염성 질병을 일으키는 병원체들의 특징을 감염이나 예방과 관련지어 이해하도록 한다."]},{"교":"과학","c":"12생과03-01","과":"생명과학","학":"고2~3","영":"생명의 연속성과 다양성","p":"염색체의 구조를 이해하고, DNA, 유전자의 관계를 설명할 수 있다.","h":["염색체, DNA, 유전자의 개념을 단계적으로 다루고, 이들 간의 상호 관계를 이해하도록 한다."]},{"교":"과학","c":"12생과03-02","과":"생명과학","학":"고2~3","영":"생명의 연속성과 다양성","p":"생식세포 형성과정을 체세포분열 과정과 비교하고, 생식세포 형성의 중요성을 생명의 연속성 및 다양성과 관련지어 추론할 수 있다."},{"교":"과학","c":"12생과03-03","과":"생명과학","학":"고2~3","영":"생명의 연속성과 다양성","p":"생물 진화의 원리를 이해하고, 생물 진화 연구의 다양한 사례를 조사하여 협력적으로 소통할 수 있다.","h":["진화에 대한 다윈의 아이디어를 조사하는 활동 등 자연선택에 의한 진화 과정을 중심으로 다루며, 하디-바인베르크 법칙은 다루지 않고 진화의 사례를 조사하여 변이와 자연선택에 의한 진화의 원리를 이해하도록 한다."]},{"교":"과학","c":"12생과03-04","과":"생명과학","학":"고2~3","영":"생명의 연속성과 다양성","p":"생물의 분류 체계를 바탕으로 각 분류군의 차이를 이해하고 생물군을 분류 체계에 따라 설명할 수 있다.","h":["생물의 분류 체계를 역과 계 수준에서만 다루도록 하고 세부적인 분류기준들을 설명하지 않는다."]},{"교":"과학","c":"12생과03-05","과":"생명과학","학":"고2~3","영":"생명의 연속성과 다양성","p":"동물과 식물 분류군의 특징을 문 수준에서 이해하고, 생물의 유연관계를 계통수로 나타낼 수 있다.","h":["동물과 식물의 분류군의 특징을 문 수준에서 다루도록 하며, 식물과 동물의 계통수를 통해 유연관계를 이해하도록 한다."]},{"교":"과학","c":"12지구01-01","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"해수의 물리적, 화학적 성질을 이해하고, 실측 자료를 활용하여 해수의 온도, 염분, 밀도, 용존 산소량 등의 분포를 분석⋅해석할 수 있다."},{"교":"과학","c":"12지구01-02","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"심층 순환의 발생 원리와 분포를 알고, 표층 순환 및 기후변화의 관련성을 추론할 수 있다."},{"교":"과학","c":"12지구01-03","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"중위도 저기압과 고기압이 통과할 때 날씨의 변화를 일기도, 위상 영상, 레이더 영상을 종합하여 예측할 수 있다.","h":["온대 저기압이란 용어는 중위도 저기압(mid-latitude Low)으로 표현한다. 저기압은 규모에 따라 전선을 동반한 저기압(중위도 종관 규모 저기압)과 중규모 저기압(소나기(스콜)를 만드는 저기압)으로 구분한다는 것을 다룬다. 실제 우리나라 주변의 일기도와 관련지어 중위도 저기압이 통과하면서 나타나는 날씨의 변화를 설명한다."]},{"교":"과학","c":"12지구01-04","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"태풍의 발생, 이동, 소멸 과정 및 태풍 영향권에서 날씨를 예측하고, 뇌우, 집중호우, 폭설, 강풍, 황사 등 주요 악기상의 생성 메커니즘과 대처 방안을 제시할 수 있다.","h":["최근에 발생한 사례를 중심으로 태풍이 우리나라에 준 피해와 영향 및 위력을 간략하게 다루면서, 대기와 해양 및 대기와 육지의 상호작용 등에 초점을 둔다. 뇌우, 집중호우, 강풍, 폭설, 우박 등과 같은 우리나라의 주요 악기상을 소개하고 이들의 생성 메커니즘을 간단히 다룬다."]},{"교":"과학","c":"12지구01-05","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"대기와 해양의 상호작용의 사례로서 해수의 용승과 침강, 엘니뇨-남방진동(ENSO)의 현상의 진행 과정 및 관련 현상을 설명할 수 있다.","h":["대기와 해양의 상호작용과 기후시스템의 주기적인 변동성에 초점을 맞추어 엘니뇨-남방진동(ENSO)의 영향을 다루고, 엘니뇨와 라니냐 시기에 나타나는 현상을 중심으로 설명한다."]},{"교":"과학","c":"12지구01-06","과":"지구과학","학":"고2~3","영":"대기와 해양의 상호작용","p":"기후변화의 원인을 자연적 요인과 인위적 요인으로 구분하여 설명하고, 인간 활동에 의한 기후변화 문제를 과학적으로 해결하는 방법을 탐색할 수 있다."},{"교":"과학","c":"12지구02-01","과":"지구과학","학":"고2~3","영":"지구의 역사와 한반도의 암석","p":"지층 형성의 선후 관계를 결정짓는 법칙들을 활용하여 상대 연령을 비교하고, 방사성 동위 원소를 이용한 광물의 절대 연령 자료로 암석의 절대 연령을 구할 수 있다.","h":["지층 형성의 선후 관계를 결정짓는 법칙들(수평퇴적의 법칙, 지층누중의 법칙, 동물군 천이의 법칙, 관입의 법칙, 부정합의 법칙 등)을 이해하고, 시간과 암석에 따라 층의 순서를 결정하고 지구의 역사에 대해 설명한다. 지층의 나이를 결정하는 데 상대 연령과 절대 연령이 있음을 이해하고 절대 연령의 경우 방사성 동위 원소를 이용하는 원리를 설명하고 간단한 계산을 통해 적용해 본다."]},{"교":"과학","c":"12지구02-02","과":"지구과학","학":"고2~3","영":"지구의 역사와 한반도의 암석","p":"지질시대를 기(紀) 수준에서 구분하고, 지층과 화석을 통해 지질시대의 생물과 환경 변화를 해석할 수 있다.","h":["지층에서는 퇴적암의 퇴적 구조와 퇴적 환경을 함께 다루고, 지질시대의 환경을 다루면서 표준 화석으로 살펴본 고생물, 지질시대를 결정하는 생물의 변천, 지구 환경의 변화 등을 다룬다. 또한, 지구의 역사를 통하여 기후가 어떻게 변해왔는지를 고기후 연구 방법을 조사하여 설명하되, 고기후 연구 방법만 소개하고 자세한 메커니즘은 다루지 않는다."]},{"교":"과학","c":"12지구02-03","과":"지구과학","학":"고2~3","영":"지구의 역사와 한반도의 암석","p":"변동대에서 마그마가 생성되고, 그 조성에 따라 다양한 화성암이 생성됨을 설명할 수 있다."},{"교":"과학","c":"12지구02-04","과":"지구과학","학":"고2~3","영":"지구의 역사와 한반도의 암석","p":"변성작용의 종류와 지각 변동에 따른 구조를 변동대와 관련지어 설명하고, 지구시스템에서 암석이 순환함을 추론할 수 있다."},{"교":"과학","c":"12지구02-05","과":"지구과학","학":"고2~3","영":"지구의 역사와 한반도의 암석","p":"우리나라의 대표적인 지질공원의 지질학적 형성 과정을 추론하고, 지역사회와 함께하는 지질공원의 지속가능한 발전방안을 제안할 수 있다.","h":["우리나라의 모든 국가지질공원에 대해 각각의 특성을 열거하는 방식으로 다루는 것은 지양하며, 주변의 지질공원을 방문할 때 관찰 가능한 내용을 중심으로 다루도록 한다."]},{"교":"과학","c":"12지구03-01","과":"지구과학","학":"고2~3","영":"태양계 천체와 별과 우주의 진화","p":"태양-지구-달 시스템에서의 식 현상을 이해하고 모형을 이용하여 태양계 행성의 겉보기 운동을 설명할 수 있다.","h":["천체의 운동을 3차원 공간에서 이해할 수 있도록 천체 관측 시뮬레이션 프로그램을 활용한다. 식 현상은 중학교의 ‘태양계’에서 학습한 내용을 심화하여 천체의 공전 궤도 특징으로부터 식 현상의 원리를 설명하며, 일식은 지표면에 드리워진 달 그림자의 이동 궤적과 개기, 금환, 부분, 혼성 일식을, 월식은 개기, 부분 월식과 반영식을 다룬다."]},{"교":"과학","c":"12지구03-02","과":"지구과학","학":"고2~3","영":"태양계 천체와 별과 우주의 진화","p":"별의 분광형 결정 및 별의 분류 과정을 이해하고, 흑체복사 법칙을 이용하여 별의 물리량을 추론할 수 있다."},{"교":"과학","c":"12지구03-03","과":"지구과학","학":"고2~3","영":"태양계 천체와 별과 우주의 진화","p":"다양한 질량을 가진 별의 진화 과정을 H-R도에 나타내고 해석할 수 있다.","h":["다양한 질량을 가진 별들의 진화 경로를 H-R도상에 제시하고, 영년 주계열을 기준으로 전주계열과 후주계열을 비교하여 이해한다. 별이 진화의 마지막 단계를 거쳐 다시 성간 물질로 되돌아가는 과정을 다룬다."]},{"교":"과학","c":"12지구03-04","과":"지구과학","학":"고2~3","영":"태양계 천체와 별과 우주의 진화","p":"허블의 은하 분류 체계에 따른 은하의 특징을 비교하고 외부은하의 자료를 이용하여 특이 은하의 관측적 특징을 추론할 수 있다.","h":["허블의 은하 분류 체계가 형태학적 분류임을 이해하고 은하의 유형에 따른 성간 물질의 비율, 구성 천체의 나이 등의 특징을 비교하여 다룬다. 다양한 파장으로 관측한 외부은하의 관측 자료로부터 특이 은하의 스펙트럼을 이해할 수 있도록 지도한다."]},{"교":"과학","c":"12지구03-05","과":"지구과학","학":"고2~3","영":"태양계 천체와 별과 우주의 진화","p":"허블-르메트르 법칙으로 우주의 팽창을 이해하고 우주의 진화에 대한 다양한 설명 체계의 의의를 현대 우주론의 관점에서 비교할 수 있다.","h":["우주에 대한 관측적 증거를 바탕으로 현대 우주론이 정립되기까지의 과정에서 정적 우주, 팽창 우주, 급팽창, 가속 팽창의 개념을 다루며, 관측 가능한 우주의 개념을 도입한다."]},{"교":"과학","c":"12역학01-01","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"물체에 작용하는 여러 가지 힘의 합력을 구하여 물체의 운동을 정량적으로 예측할 수 있다.","h":["마찰력, 장력, 수직항력 등 물체에 작용하는 여러 가지 힘은 2차원 평면상에서 작용하는 힘으로만 다루도록 제한하고, 벡터의 합성을 통해 힘의 합력을 구하여 물체의 운동 예측에 활용할 수 있게 한다."]},{"교":"과학","c":"12역학01-02","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"뉴턴 운동 법칙을 이용하여 물체의 포물선 운동을 정량적으로 설명하고, 포물선 운동에서의 역학적 에너지를 구할 수 있다."},{"교":"과학","c":"12역학01-03","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"물체에 작용하는 힘의 방향에 따라 물체의 운동 방향이 변할 수 있음을 원운동 등 다양한 예를 들어 설명할 수 있다."},{"교":"과학","c":"12역학01-04","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"케플러 법칙으로부터 중력의 존재가 밝혀지는 과학사적 배경을 이해하고, 중력을 이용하여 인공위성과 행성의 운동을 분석하고 설명할 수 있다.","h":["태양과 행성 사이의 중력이 구심력이 됨을 이용하여 케플러 법칙을 설명할 수 있으며, 이러한 과학적 사고가 중력의 존재를 설명하는 데 과학사적으로 활용되었음을 이해하게 한다. 인공위성과 천체의 운동은 원운동에만 한정하여 정량적으로 설명하게 하며, 타원 운동에 대한 정량적인 설명은 도입하지 않는다."]},{"교":"과학","c":"12역학01-05","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"역학적 에너지 보존을 이용하여 행성에 따라 탈출 속도가 다름을 이해하고, 운동량 보존을 이용하여 우주선이 발사되어 궤도에 오르는 원리를 설명할 수 있다.","h":["탈출 속도의 차이로 인해 행성별로 대기의 구성이 다름을 정성적으로 소개하고, 우주선이 발사되어 궤도에 오르는 원리를 정량적으로 다루지 않고 뉴턴 운동 법칙과 운동량 보존 법칙을 이용하여 정성적으로 설명한다."]},{"교":"과학","c":"12역학01-06","과":"역학과 에너지","학":"고2~3","영":"시공간과 운동","p":"등가 원리와 시공간의 휘어짐으로 인해 블랙홀과 중력 시간 지연이 나타남을 이해하고, 일반 상대론에 흥미를 느낄 수 있다.","h":["중력 질량과 관성 질량의 등가 원리 및 시공간의 휘어짐에 대한 기초적인 설명과 함께, 탈출 속도의 의미로부터 블랙홀의 의미를 기초적으로 설명하고, 위성 항법 장치(GPS) 시간 보정 등 중력 시간 지연이 실생활에서 활용되는 사례를 찾을 수 있게 한다."]},{"교":"과학","c":"12역학02-01","과":"역학과 에너지","학":"고2~3","영":"열과 에너지","p":"건축을 포함한 다양한 열에너지 관련 기술에 단열, 열팽창 등이 활용된 예를 조사함으로써 과학의 유용성에 대한 가치를 인식할 수 있다.","h":["고체뿐만 아니라 액체, 기체와 같은 유체에서 열이 전도, 대류, 복사 등의 방법으로 전달되는 과정을 이해하고, 냉난방을 위한 건축물의 단열재 및 건축물의 구조 등 실생활에 활용되는 사례를 조사하고 설명할 수 있게 한다."]},{"교":"과학","c":"12역학02-02","과":"역학과 에너지","학":"고2~3","영":"열과 에너지","p":"열에 의한 물질의 상태 변화를 이해하고, 이상 기체의 온도, 압력, 부피의 관계를 설명할 수 있다.","h":["물질의 고유한 특성인 비열과 잠열을 정량적으로 이해할 수 있게 하고, 이상 기체 법칙을 실생활에서의 다양한 열 현상에 적용할 수 있게 한다."]},{"교":"과학","c":"12역학02-03","과":"역학과 에너지","학":"고2~3","영":"열과 에너지","p":"계에 가해진 열이 계의 내부 에너지를 변화시키거나 외부에 일을 할 수 있음을 이해하고, 일상생활 속의 예를 찾음으로써 흥미를 느낄 수 있다.","h":["등압 과정, 등적 과정, 등온 과정 등 다양한 열역학 과정을 통해 이상 기체에 가해진 열과 일, 내부 에너지의 변화 등 열역학 제1법칙의 기초를 이해할 수 있게 하고, 열역학 제1법칙이 에너지 보존 법칙의 다른 표현임을 이해할 수 있게 한다."]},{"교":"과학","c":"12역학02-04","과":"역학과 에너지","학":"고2~3","영":"열과 에너지","p":"다양한 열기관에서의 순환 과정과 열효율을 설명하고, 열기관의 개발과 활용이 인류 공동체에 미친 영향을 산업발전과 환경 측면에서 평가할 수 있다."},{"교":"과학","c":"12역학02-05","과":"역학과 에너지","학":"고2~3","영":"열과 에너지","p":"열의 이동, 기체의 확산과 같은 비가역 현상을 엔트로피를 이용하여 설명할 수 있다."},{"교":"과학","c":"12역학03-01","과":"역학과 에너지","학":"고2~3","영":"탄성파와 소리","p":"용수철 진자를 통해 단진동을 이해하고, 가속도와 변위 사이의 관계를 설명할 수 있다."},{"교":"과학","c":"12역학03-02","과":"역학과 에너지","학":"고2~3","영":"탄성파와 소리","p":"탄성파의 진행, 투과, 반사를 이해하고, 탄성파가 활용되는 예를 찾음으로써 과학의 유용성을 인식할 수 있다.","h":["탄성파의 진행을 파장, 진동수, 진행 속력으로 기술하도록 한다. 탄성파가 매질의 경계면에서 투과 또는 반사를 할 때 탄성파의 위상이 변화됨을 다루고, 탄성파가 활용되는 예로 초음파 영상, 비파괴 검사 등을 이용한다."]},{"교":"과학","c":"12역학03-03","과":"역학과 에너지","학":"고2~3","영":"탄성파와 소리","p":"도플러 효과를 이해하고 물체의 속도 측정 등 다양한 장치에 이용됨을 설명할 수 있다."},{"교":"과학","c":"12역학03-04","과":"역학과 에너지","학":"고2~3","영":"탄성파와 소리","p":"음향 장치 또는 실내외 공간에서의 소음 제어에 음파의 간섭이 활용됨을 이해하고, 실생활에 사용되는 사례를 조사할 수 있다.","h":["둘 이상의 파원에서 만들어지는 파동은 중첩될 수 있으며, 특히 중첩이 일정한 형태로 지속될 때 간섭 현상이 발생함을 알게 하여, 이를 활용한 소음 제거, 소리의 증폭 등 다양한 활용이 가능함을 알게 한다."]},{"교":"과학","c":"12역학03-05","과":"역학과 에너지","학":"고2~3","영":"탄성파와 소리","p":"현악기, 관악기 등에서 소리를 내는 원리를 정상파를 이용하여 설명할 수 있다.","h":["정상파의 특성을 악기를 이용하여 이해하게 하고, 현 또는 관의 길이에 따라 정상파의 파장이 달라짐을 정량적으로 설명할 수 있게 한다."]},{"교":"과학","c":"12전자01-01","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"전하 주위의 전기장을 정량적으로 구하고, 전기력선과 등전위면으로부터 전기장의 세기와 방향을 추리할 수 있다."},{"교":"과학","c":"12전자01-02","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"정전기 유도와 유전분극을 설명하고, 일상생활에서 적용되는 예를 찾을 수 있다."},{"교":"과학","c":"12전자01-03","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"자기력선을 이용하여 전류가 흐르는 도선 주위의 자기장의 세기와 방향을 추리할 수 있다."},{"교":"과학","c":"12전자01-04","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"로런츠 힘이 발생하는 조건을 알고, 로런츠 힘과 관련된 현상과 기술을 설명할 수 있다.","h":["도선이 받는 힘, 입자 가속기, 토카막, 밴앨런대 등 로런츠 힘과 관련된 다양한 현상과 사례를 다룬다."]},{"교":"과학","c":"12전자01-05","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"자기선속의 변화로 전자기 유도를 이해하고, 변압기, 인덕터 등 전자기 유도의 활용 기술을 설명할 수 있다."},{"교":"과학","c":"12전자01-06","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"저항, 축전기, 인덕터를 활용하는 장치를 찾아 에너지 관점에서 정성적으로 설명할 수 있다."},{"교":"과학","c":"12전자01-07","과":"전자기와 양자","학":"고2~3","영":"전자기적 상호작용","p":"다이오드, 트랜지스터 등 반도체 소자를 활용하는 전자회로를 분석하고, 현대 문명에서 반도체의 중요성을 인식할 수 있다.","h":["반도체 소자를 활용한 정류, 증폭, 기초 논리회로 등을 회로 위주로 다루며, 미시적 작동 원리에 초점을 맞추지 않도록 한다."]},{"교":"과학","c":"12전자02-01","과":"전자기와 양자","학":"고2~3","영":"빛과 정보 통신","p":"빛의 간섭과 회절을 알고, 홀로그램 등 현대의 정밀 기술에 활용되는 예를 찾을 수 있다.","h":["반사에 의한 위상변화를 포함하여 간섭 현상을 다루며, 회절과 분해능은 정성적으로만 다룬다."]},{"교":"과학","c":"12전자02-02","과":"전자기와 양자","학":"고2~3","영":"빛과 정보 통신","p":"렌즈와 거울을 이용한 광학 기기의 원리와 수차를 설명할 수 있다.","h":["카메라, 망원경, 현미경 등의 광학 기기는 정성적 원리 위주로 다루며, 렌즈, 거울, 프리즘 등이 광학 기기에서 어떻게 활용되며 어떤 원리가 관련되는지를 설명할 수 있도록 지도한다. 수차는 구면수차와 색수차에 대한 용어 도입 없이 정성적으로 다룬다."]},{"교":"과학","c":"12전자02-03","과":"전자기와 양자","학":"고2~3","영":"빛과 정보 통신","p":"편광의 원리를 이해하고, 이를 활용한 디지털 정보 기술의 사례를 조사할 수 있다.","h":["편광판을 지나는 빛의 투과량 변화는 정성적으로 다룬다."]},{"교":"과학","c":"12전자02-04","과":"전자기와 양자","학":"고2~3","영":"빛과 정보 통신","p":"광전효과에서 빛과 물질이 상호작용하는 방식을 알고, 디지털 영상 정보, 광센서, 태양전지 등 광전효과와 관련된 다양한 기술을 조사할 수 있다."},{"교":"과학","c":"12전자02-05","과":"전자기와 양자","학":"고2~3","영":"빛과 정보 통신","p":"레이저의 특징과 빛이 증폭되는 원리를 알고, 레이저가 디지털 광통신 등 여러 영역에서 활용됨을 조사하여 현대 문명에서 레이저의 중요성을 인식할 수 있다."},{"교":"과학","c":"12전자03-01","과":"전자기와 양자","학":"고2~3","영":"양자와 미시세계","p":"단일 양자 수준의 이중 슬릿 실험을 통해서 입자-파동 이중성을 확인하고, 단일 양자의 분포에 대한 실험 결과를 확률 파동의 간섭을 토대로 해석할 수 있다.","h":["드브로이 관계식을 바탕으로 단일 전자나 광자 수준의 이중 슬릿 실험에서 나타나는 입자-파동 이중성의 기묘함을 학생들이 인식할 수 있도록 정성적으로 다룬다."]},{"교":"과학","c":"12전자03-02","과":"전자기와 양자","학":"고2~3","영":"양자와 미시세계","p":"중첩과 측정을 통한 확률적 상태 변화를 이해하고, 이를 이용한 양자컴퓨터, 양자암호통신 등의 양자 기술이 일상생활과 미래 사회에 미칠 영향을 인식할 수 있다.","h":["양자 기술은 물리적 원리보다는 사회에 미치는 영향을 중심으로 다룬다."]},{"교":"과학","c":"12전자03-03","과":"전자기와 양자","학":"고2~3","영":"양자와 미시세계","p":"터널 효과를 설명하고, 관련된 현상과 기술을 조사하여 발표할 수 있다.","h":["터널 효과가 고전적으로 불가능하지만 전자소자 소형화에 따른 터널 효과 발생 문제와 주사 터널링 현미경(STM) 등 다양한 현상과 기술에서 나타나는 확률적 현상임을 정성적으로 설명하여 지도한다."]},{"교":"과학","c":"12전자03-04","과":"전자기와 양자","학":"고2~3","영":"양자와 미시세계","p":"현대의 원자모형을 불확정성 원리와 확률을 기반으로 설명하고, 보어의 원자모형과 비교할 수 있다.","h":["현대의 원자모형에서 오비탈은 다루지 않는다."]},{"교":"과학","c":"12전자03-05","과":"전자기와 양자","학":"고2~3","영":"양자와 미시세계","p":"별에서 핵융합에 의해 에너지가 생성되고 빛이 방출되는 원리를 알고, 별빛의 스펙트럼에 기반하여 별의 구성 원소를 추리할 수 있다."},{"교":"과학","c":"12물에01-01","과":"물질과 에너지","학":"고2~3","영":"물질의 세 가지 상태","p":"기체의 온도, 압력, 부피, 몰수 사이의 관계를 통합적으로 이해하고, 이상 기체 방정식을 근사적으로 활용하는 사례를 조사하여 화학의 유용함을 인식할 수 있다."},{"교":"과학","c":"12물에01-02","과":"물질과 에너지","학":"고2~3","영":"물질의 세 가지 상태","p":"혼합 기체의 부분 압력과 몰 분율의 관계를 알고, 일상생활에서 유용하게 사용되는 혼합 기체에 호기심을 가질 수 있다."},{"교":"과학","c":"12물에01-03","과":"물질과 에너지","학":"고2~3","영":"물질의 세 가지 상태","p":"물질이 액체로 존재할 수 있는 이유를 분자 간 상호작용으로 이해하고, 액체의 종류에 따라 끓는점이 달라짐을 설명할 수 있다."},{"교":"과학","c":"12물에01-04","과":"물질과 에너지","학":"고2~3","영":"물질의 세 가지 상태","p":"고체를 결정과 비결정으로 구분하고, 결정성 고체를 화학 결합의 종류에 따라 분류할 수 있다.","h":["결정 구조는 다루지 않고, 이온 결합, 공유 결합, 금속 결합을 이용하여 결정성 고체를 이온 결정, 분자 결정, 공유 결정, 금속 결정으로 구분하는 수준으로 다룬다."]},{"교":"과학","c":"12물에02-01","과":"물질과 에너지","학":"고2~3","영":"용액의 성질","p":"다른 액체와 구별되는 물의 성질을 수소 결합으로 설명하고, 경이로운 물의 성질에 흥미를 느낄 수 있다."},{"교":"과학","c":"12물에02-02","과":"물질과 에너지","학":"고2~3","영":"용액의 성질","p":"실험 데이터를 이용하여 용액의 농도에 따른 증기압, 끓는점, 어는점의 변화를 비교하고, 일상생활에서 나타나는 사례와 연관 지어 설명할 수 있다.","h":["끓는점 오름과 어는점 내림은 몰랄 농도 또는 몰 분율을 도입하여 다룬다."]},{"교":"과학","c":"12물에02-03","과":"물질과 에너지","학":"고2~3","영":"용액의 성질","p":"용액의 농도에 따른 삼투현상을 이해하고, 일상생활에서 삼투현상이 나타나는 사례를 찾아 화학 원리가 유용하게 적용됨을 인식할 수 있다."},{"교":"과학","c":"12물에03-01","과":"물질과 에너지","학":"고2~3","영":"화학 변화의 자발성","p":"엔탈피의 의미를 알고, 엔탈피를 이용하여 열화학 반응식을 표현할 수 있다.","h":["화학 반응에서 열의 출입에 관련된 내용으로 제한하며, 열역학 함수로서의 엔탈피는 다루지 않는다."]},{"교":"과학","c":"12물에03-02","과":"물질과 에너지","학":"고2~3","영":"화학 변화의 자발성","p":"측정하기 어려운 화학 반응의 엔탈피를 헤스 법칙으로 구하여 화학 법칙의 유용성을 인식할 수 있다."},{"교":"과학","c":"12물에03-03","과":"물질과 에너지","학":"고2~3","영":"화학 변화의 자발성","p":"엔트로피의 의미를 이해하고, 엔탈피와 엔트로피의 변화로 화학 변화의 자발성을 설명할 수 있다.","h":["깁스 자유 에너지는 다루지 않으며, 엔트로피는 정성적으로 다룬다."]},{"교":"과학","c":"12물에04-01","과":"물질과 에너지","학":"고2~3","영":"반응 속도","p":"화학 반응 속도를 반응물의 농도로 표현할 수 있음을 알고, 자료 해석을 통하여 반응 속도식을 구할 수 있다."},{"교":"과학","c":"12물에04-02","과":"물질과 에너지","학":"고2~3","영":"반응 속도","p":"1차 반응의 반감기가 반응물의 농도에 의존하지 않음을 이해하고, 1차 반응의 반감기가 활용되는 사례를 조사⋅발표할 수 있다.","h":["적분 속도식을 유도하는 것은 다루지 않으며, 자료 해석을 통해 반감기를 찾도록 한다."]},{"교":"과학","c":"12물에04-03","과":"물질과 에너지","학":"고2~3","영":"반응 속도","p":"화학 반응에서 유효 충돌과 활성화 에너지의 의미를 알고, 화학 반응이 일어나기 위한 조건에 관심을 가질 수 있다."},{"교":"과학","c":"12물에04-04","과":"물질과 에너지","학":"고2~3","영":"반응 속도","p":"농도, 온도, 촉매에 따라 반응 속도가 달라짐을 이해하고, 일상생활에서 각각의 예를 찾아 화학의 유용성을 인식할 수 있다."},{"교":"과학","c":"12반응01-01","과":"화학 반응의 세계","학":"고2~3","영":"산 염기 평형","p":"브뢴스테드-라우리 산과 염기의 정의를 이해하고, 이에 따라 산과 염기를 구별할 수 있다.","h":["브뢴스테드-라우리 산과 염기 정의의 확장성과 유용성을 다룬다."]},{"교":"과학","c":"12반응01-02","과":"화학 반응의 세계","학":"고2~3","영":"산 염기 평형","p":"이온화 상수를 이용하여 산과 염기의 상대적인 세기를 추론하고, 약산과 약염기 수용액의 pH를 구할 수 있다."},{"교":"과학","c":"12반응01-03","과":"화학 반응의 세계","학":"고2~3","영":"산 염기 평형","p":"중화 적정 실험의 pH 변화를 데이터에 근거하여 해석할 수 있다."},{"교":"과학","c":"12반응01-04","과":"화학 반응의 세계","학":"고2~3","영":"산 염기 평형","p":"이온화 상수를 이용하여 염의 가수 분해를 설명할 수 있다."},{"교":"과학","c":"12반응01-05","과":"화학 반응의 세계","학":"고2~3","영":"산 염기 평형","p":"화학 평형으로 생체 내 완충 작용을 설명하고, 화학 원리의 신비로움을 느낄 수 있다.","h":["완충 작용을 설명할 때 복잡한 pH 계산은 지양하고, 생체 내 화학 반응에서 완충 용액의 중요성을 중심으로 다룬다."]},{"교":"과학","c":"12반응02-01","과":"화학 반응의 세계","학":"고2~3","영":"산화⋅환원 반응","p":"전자의 이동과 산화수 변화로 산화⋅환원 반응을 이해하고, 반쪽 반응식을 활용하여 산화⋅환원 반응식을 완성할 수 있다.","h":["산화⋅환원 반응은 동시에 일어남을 다룬다. 산화제와 환원제가 따로 정해져 있는 것이 아니라 특정 산화⋅환원 반응에서 상대적 세기에 의해 결정되는 것임을 강조한다."]},{"교":"과학","c":"12반응02-02","과":"화학 반응의 세계","학":"고2~3","영":"산화⋅환원 반응","p":"화학 전지의 발전 과정을 조사하여 실용 전지의 구조적 공통점을 추론할 수 있다."},{"교":"과학","c":"12반응02-03","과":"화학 반응의 세계","학":"고2~3","영":"산화⋅환원 반응","p":"화학 전지의 원리를 산화⋅환원 반응으로 설명하고, 표준 환원 전위를 이용하여 전위차를 구할 수 있다.","h":["산화⋅환원 반응을 통하여 화학 에너지가 전기 에너지로 전환되는 원리를 다룬다."]},{"교":"과학","c":"12반응02-04","과":"화학 반응의 세계","학":"고2~3","영":"산화⋅환원 반응","p":"전기 분해의 원리를 산화⋅환원 반응으로 설명하고, 산업 현장에서 활용되는 전기 분해의 예를 조사하여 발표할 수 있다."},{"교":"과학","c":"12반응02-05","과":"화학 반응의 세계","학":"고2~3","영":"산화⋅환원 반응","p":"생명 현상 및 화학 전지에서 이용되는 다양한 산화⋅환원 반응과 그 반응에 이용된 물질의 역할을 조사하여 화학의 신비로움을 느낄 수 있다."},{"교":"과학","c":"12반응03-01","과":"화학 반응의 세계","학":"고2~3","영":"탄소 화합물과 반응","p":"일상생활에 유용한 탄소 화합물을 작용기에 따라 분류할 수 있다."},{"교":"과학","c":"12반응03-02","과":"화학 반응의 세계","학":"고2~3","영":"탄소 화합물과 반응","p":"간단한 탄소 화합물의 화학 반응 예를 찾아 작용기의 변화로 설명할 수 있다."},{"교":"과학","c":"12반응03-03","과":"화학 반응의 세계","학":"고2~3","영":"탄소 화합물과 반응","p":"단위체의 중합 반응으로 다양한 고분자가 합성되는 것을 이해하여 화학 반응의 유용성을 인식할 수 있다.","h":["단백질, 핵산과 같은 천연 고분자뿐만 아니라 합성 고분자도 단위체의 반복적 결합으로 만들어진다는 것을 이해하는 수준으로 다룬다."]},{"교":"과학","c":"12반응03-04","과":"화학 반응의 세계","학":"고2~3","영":"탄소 화합물과 반응","p":"탄소 화합물의 반응을 통해 합성된 새로운 물질이 과학⋅기술⋅사회 발전에 끼친 영향을 조사하여 화학의 유용성을 깨달을 수 있다."},{"교":"과학","c":"12세포01-01","과":"세포와 물질대사","학":"고2~3","영":"세포","p":"탄수화물과 지질의 종류와 주요 기능을 이해하고 생물체에 들어있는 탄수화물과 지질을 관찰할 수 있다."},{"교":"과학","c":"12세포01-02","과":"세포와 물질대사","학":"고2~3","영":"세포","p":"핵산과 단백질의 기본 구조와 세포에서의 주요 기능을 조사하여 설명할 수 있다."},{"교":"과학","c":"12세포01-03","과":"세포와 물질대사","학":"고2~3","영":"세포","p":"동물세포와 식물세포를 구성하는 세포 소기관의 구조와 기능을 이해하고, 세포 소기관들의 유기적 관계를 추론하여 협력적으로 소통할 수 있다.","h":["세포 소기관의 구조와 기능은 전자현미경을 포함한 다양한 현미경의 이용, 세포 분획법, 자기 방사법 등의 방법으로 알아낼 수 있음을 이해하도록 하고, 세포 소기관의 유기적 관계는 물질의 합성과 분비를 중심으로 다루도록 한다."]},{"교":"과학","c":"12세포01-04","과":"세포와 물질대사","학":"고2~3","영":"세포","p":"원핵세포와 진핵세포의 공통점과 차이점을 설명할 수 있다.","h":["원핵세포와 진핵세포의 차이를 DNA, 세포 내 막 구조, 리보솜, 세포벽을 중심으로 다룬다."]},{"교":"과학","c":"12세포01-05","과":"세포와 물질대사","학":"고2~3","영":"세포","p":"세포막의 구조와 특성을 이해하고, 세포막을 통한 물질 수송 과정을 추론할 수 있다."},{"교":"과학","c":"12세포02-01","과":"세포와 물질대사","학":"고2~3","영":"물질대사와 에너지","p":"물질대사는 생명체에서 생명을 유지하기 위해 일어나는 화학 반응임을 이해하고 에너지의 출입이 동반됨을 추론할 수 있다.","h":["물질대사 과정에서 효소를 이용한 화학 반응이 일어나며, 에너지 출입을 통한 생명 활동 과정에서 균형있는 에너지 섭취와 소비의 중요성을 다룬다."]},{"교":"과학","c":"12세포02-02","과":"세포와 물질대사","학":"고2~3","영":"물질대사와 에너지","p":"생명 활동에 필요한 에너지를 공급하는 과정에서 광합성과 세포호흡 그리고 ATP의 역할을 설명할 수 있다.","h":["세포호흡을 통한 물질 분해 및 에너지 생성 과정, 광합성에서는 물질 합성 및 에너지 저장 과정에 중점을 두어 다룬다."]},{"교":"과학","c":"12세포02-03","과":"세포와 물질대사","학":"고2~3","영":"물질대사와 에너지","p":"효소의 종류와 특성을 이해하고 효소의 활성에 영향을 미치는 요인에 대한 실험을 설계하여 수행할 수 있다.","h":["효소의 작용에 영향을 미치는 요인들에 대해 스스로 변인을 설정하여 실험을 설계하고 수행할 수 있도록 지도한다."]},{"교":"과학","c":"12세포02-04","과":"세포와 물질대사","학":"고2~3","영":"물질대사와 에너지","p":"효소의 작용 기작을 이해하고, 생명체 내에서 일어나는 효소 작용의 중요성에 대해 다양한 매체를 활용하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"12세포02-05","과":"세포와 물질대사","학":"고2~3","영":"물질대사와 에너지","p":"효소가 우리 생활이나 산업에 다양하게 이용되는 사례를 조사하여 발표할 수 있다."},{"교":"과학","c":"12세포03-01","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"미토콘드리아의 구조를 이해하고 생명체 내에서의 미토콘드리아의 기능을 추론할 수 있다."},{"교":"과학","c":"12세포03-02","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"세포호흡 과정의 단계별 특징을 다양한 매체를 활용하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"12세포03-03","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"세포호흡 과정에서의 인산화 과정을 기질 수준의 인산화와 산화적 인산화 과정으로 구분할 수 있다.","h":["산화적 인산화 과정에서 화학 삼투에 의해 ATP가 합성된다는 수준 정도를 다루도록 한다."]},{"교":"과학","c":"12세포03-04","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"산소호흡과 발효의 공통점과 차이점을 이해하고, 실생활에서 발효를 이용한 사례 조사 계획을 세워 조사할 수 있다."},{"교":"과학","c":"12세포03-05","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"엽록체의 구조를 이해하고 기능과 관련지어 설명할 수 있다."},{"교":"과학","c":"12세포03-06","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"광합성의 명반응과 탄소 고정반응을 단계별로 구분하여 특징을 이해하고 두 반응의 상호 관계를 추론할 수 있다."},{"교":"과학","c":"12세포03-07","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"광합성과 세포호흡의 전자 전달계를 비교하여 공통점과 차이점을 다양한 매체를 활용하여 설명할 수 있다.","h":["광합성과 세포호흡의 전자 전달 과정에서 이루어지는 인산화 반응을 에너지, 효소, 산화⋅환원 반응 중심으로 다루도록 한다."]},{"교":"과학","c":"12세포03-08","과":"세포와 물질대사","학":"고2~3","영":"세포호흡과 광합성","p":"광합성 관련 과학사적 연구 결과를 조사하여 시각화 자료를 창의적으로 제작하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"12유전01-01","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"유전 형질이 유전자를 통해 자손에게 유전됨을 이해하고, 상염색체 유전과 성염색체 유전 양상의 차이를 설명할 수 있다.","h":["유전 형질을 다룰 때, 과학적으로 명확하게 증명된 사례를 도입하여 유전자와 유전 형질의 관계를 다루도록 한다."]},{"교":"과학","c":"12유전01-02","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"사람 유전 연구 방법의 어려움을 이해하고, 사람의 유전 현상 분석을 근거로 유전 형질의 유전적 특성을 추론할 수 있다."},{"교":"과학","c":"12유전01-03","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"사람의 다유전자유전에 대해 이해하고, 유전 현상의 다양성 사례를 조사하여 과학적 근거를 활용하여 협력적으로 소통할 수 있다.","h":["사람의 다유전자유전 사례에 초점을 두기보다는 사람의 유전 대부분이 다유전자유전에 의해 이루어지고 있다는 의미에 초점을 두도록 한다."]},{"교":"과학","c":"12유전01-04","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"염색체와 유전자 이상에 대해 이해하고, 사람의 유전병을 발병 원인별 조사 계획을 세워 조사할 수 있다."},{"교":"과학","c":"12유전01-05","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"DNA의 구조와 유전물질 규명 관련 과학사적 연구 결과를 설명하기 위한 발표 자료를 창의적으로 제작할 수 있다."},{"교":"과학","c":"12유전01-06","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"원핵세포와 진핵세포의 유전자 구조와 유전체 구성을 이해하고, 공통점과 차이점을 비교하여 설명할 수 있다."},{"교":"과학","c":"12유전01-07","과":"생물의 유전","학":"고2~3","영":"유전자와 유전물질","p":"반보존적 DNA 복제 과정을 이해하고 그 의미를 추론하여 협력적으로 소통할 수 있다.","h":["반보존적 복제의 구체적인 분자생물학적 기작보다는 반보존적 복제가 갖는 의미를 중심으로 다루며, DNA의 반보존적 복제를 다룰 때, RNA 프라이머나 관여하는 효소의 기능 등을 상세히 다루기보다는 용어 수준에서 다루도록 한다."]},{"교":"과학","c":"12유전02-01","과":"생물의 유전","학":"고2~3","영":"유전자의 발현","p":"전사와 번역 과정을 거쳐 유전자가 발현되는 중심원리를 이해하고, 모형을 이용하여 유전자 발현 과정을 설명할 수 있다."},{"교":"과학","c":"12유전02-02","과":"생물의 유전","학":"고2~3","영":"유전자의 발현","p":"유전 부호를 이해하고, 유전 부호 표를 사용하여 유전 정보를 해독할 수 있다."},{"교":"과학","c":"12유전02-03","과":"생물의 유전","학":"고2~3","영":"유전자의 발현","p":"원핵생물과 진핵생물의 유전자 발현 조절 과정을 비교하기 위한 설명 자료를 다양한 매체를 활용하여 제작할 수 있다.","h":["원핵생물의 전사 조절 과정을 주로 다루고, 진핵생물의 경우는 원핵생물의 전사 조절과의 다른 점만을 간략하게 다루도록 한다."]},{"교":"과학","c":"12유전02-04","과":"생물의 유전","학":"고2~3","영":"유전자의 발현","p":"생물의 발생 과정에서 세포 분화가 유전자 발현 조절 과정을 통해 일어남을 추론할 수 있다.","h":["생물의 발생 초기 단계의 유전자 발현 조절 과정을 다루도록 한다."]},{"교":"과학","c":"12유전02-05","과":"생물의 유전","학":"고2~3","영":"유전자의 발현","p":"생물의 유전자 발현 조절 및 발생에 대한 연구가 인류 복지에 기여한 사례를 조사하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"12유전03-01","과":"생물의 유전","학":"고2~3","영":"생명공학기술","p":"생명공학기술 발달 과정에서의 주요 사건을 조사하고 다양한 매체를 활용하여 발표할 수 있다.","h":["생명공학기술의 발달 과정에서의 주요 사건이 가져온 기술 발달뿐만 아니라 성과를 우리 생활과 관련된 사례를 중심으로 다루어 흥미를 유발하도록 한다."]},{"교":"과학","c":"12유전03-02","과":"생물의 유전","학":"고2~3","영":"생명공학기술","p":"단일클론항체, 줄기세포, 유전자 편집 기술이 난치병 치료에 활용된 사례를 조사하고, 이러한 치료법의 전망에 대해 협력적으로 소통할 수 있다."},{"교":"과학","c":"12유전03-03","과":"생물의 유전","학":"고2~3","영":"생명공학기술","p":"생명공학기술 관련 학문 분야를 이해하고 우리 생활과 산업에 활용 사례를 조사하여 창의적으로 설명 자료를 제작할 수 있다."},{"교":"과학","c":"12유전03-04","과":"생물의 유전","학":"고2~3","영":"생명공학기술","p":"유전자 변형 생물체(LMO)의 특징을 이해하고 인간과 생태계에 미치는 영향을 추론할 수 있다."},{"교":"과학","c":"12유전03-05","과":"생물의 유전","학":"고2~3","영":"생명공학기술","p":"생명공학기술의 활용 과정에서 나타나는 문제점과 이에 대한 사회적 책임을 인식하고 생명윤리 쟁점에 대해 의사 결정할 수 있다."},{"교":"과학","c":"12지시01-01","과":"지구시스템과학","학":"고2~3","영":"지구 탄생과 생동하는 지구","p":"지구의 탄생 이후 지구 대기, 원시 바다, 생명체 탄생 등의 과정을 통한 지구시스템 각 권역의 형성 과정을 추론할 수 있다.","h":["지구 생명체 탄생 이전의 권역 형성을 다룬다. 원시 태양계 성운에서 행성계인 태양계가 형성되는 물리적 과정(응축, 집적, 분화)을 알아보고, 행성으로서 지구가 탄생하고 진화하는 모습을 설명한다. 마그마 바다에서 화성암이 형성됨을 다루고 이후 냉각 과정에서의 상호작용을 다룬다."]},{"교":"과학","c":"12지시01-02","과":"지구시스템과학","학":"고2~3","영":"지구 탄생과 생동하는 지구","p":"지구시스템이 진화해온 역사에서 물, 탄소, 산소의 순환 과정을 통해 지권, 수권, 기권이 변화해 왔음을 추적할 수 있다.","h":["생명체 탄생 이후 생명체와 지구계의 상호작용을 중심으로 다룬다. 산소의 순환은 남세균과 호상철광층의 형성, 탄소의 순환은 얼음덩어리 지구와 석회암의 퇴적, 물의 순환은 풍화, 침식, 퇴적 작용과 지형의 형성을 다룬다. 그리고 이 과정에서 생명과 행성의 공진화 개념을 다루어 환경과 생명의 소중함을 인식하도록 한다."]},{"교":"과학","c":"12지시01-03","과":"지구시스템과학","학":"고2~3","영":"지구 탄생과 생동하는 지구","p":"판구조론의 발달사와 관련지어 판을 움직이는 맨틀의 상부 운동과 플룸에 의한 구조 운동을 구분할 수 있다.","h":["상부 맨틀의 대류에 의한 판 운동과 맨틀-핵의 경계에서 올라오는 플룸 운동을 구분하여 이해하며, 플룸 상승류의 사례로 열점을 설명한다. 판을 움직이는 힘의 경우, 맨틀 대류에 의한 수동적인 움직임으로 설명하기보다는, 판을 움직이는 능동적인 힘(섭입하는 판이 당기는 힘, 해령에서 미는 힘 등)에 관해 다룬다."]},{"교":"과학","c":"12지시01-04","과":"지구시스템과학","학":"고2~3","영":"지구 탄생과 생동하는 지구","p":"암석의 순환 과정에서 화산 활동의 역할과 화산 활동으로 생성되는 암석의 특성을 추론할 수 있다.","h":["마그마의 특성에 따라 순상화산과 성층화산으로 화산체의 형태를 분류하며, 분출되는 물질의 종류가 달라짐을 다룬다. 편광현미경을 이용한 화산암과 심성암 박편 관찰을 통해 화산암의 유리질, 반상조직과 심성암의 조립질을 비교⋅관찰하는 정도만 다루며, 광학적 성질에 대해서는 다루지 않는다."]},{"교":"과학","c":"12지시01-05","과":"지구시스템과학","학":"고2~3","영":"지구 탄생과 생동하는 지구","p":"지진파의 종류와 특성을 이해하고, 지진파를 이용하여 지구 내부구조를 알아내는 과정을 탐구할 수 있다.","h":["지진파 단층 촬영 결과를 이용하여 알아낸 지구 내부구조를 함께 다룬다."]},{"교":"과학","c":"12지시02-01","과":"지구시스템과학","학":"고2~3","영":"해수의 운동","p":"에크만 수송과 관련지어 지형류의 발생 원리를 설명할 수 있다.","h":["지구 규모의 해수 순환에 대한 정성적 이해를 바탕으로, 수압 경도력과 전향력에 의한 정역학 평형을 학습하여 해수를 움직이는 힘을 정량적으로 이해하도록 한다."]},{"교":"과학","c":"12지시02-02","과":"지구시스템과학","학":"고2~3","영":"해수의 운동","p":"해파의 발생 과정을 이해하고, 천해파와 심해파의 차이점을 비교⋅설명할 수 있다.","h":["해파는 해수면이 주기적으로 상하 운동하면서 에너지를 전파하는 현상으로 바닷물이 직접 이동하는 것은 아니라는 사실을 이해시킨다. 이때 심해파와 천해파의 중간 영역(전이파)에 대한 개념을 간단히 다룬다."]},{"교":"과학","c":"12지시02-03","과":"지구시스템과학","학":"고2~3","영":"해수의 운동","p":"해일이 발생하는 여러 가지 원인을 이해하고, 피해 사례와 대처 방안을 제안할 수 있다.","h":["해일 발생 당시의 기압, 만조 시기, 해안 및 해저 지형에 따라서도 해일의 피해가 달라질 수 있음을 이해한다."]},{"교":"과학","c":"12지시02-04","과":"지구시스템과학","학":"고2~3","영":"해수의 운동","p":"조석의 발생 과정을 이해하고 자료 해석을 통해 각 지역에서의 조석 양상을 설명할 수 있다.","h":["기조력을 정성적으로 도입하고 평형 조석론 정도만 다루며, 달에 의한 기조력이 태양보다 2배 정도 크다는 것을 다룬다."]},{"교":"과학","c":"12지시03-01","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"대기를 구성하는 기체들이 선택적 흡수체임을 이해하고, 온실효과 및 태양 자외선 차단 효과, 물의 존재 등으로 지구 생명체 존재 조건을 추론할 수 있다.","h":["생명가능지대로서의 지구, 즉 지구에 물이 존재함으로써 생명체가 발생하고 존재할 수 있는 이유에 대한 근거를 다룬다."]},{"교":"과학","c":"12지시03-02","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"지표와 대기의 열 출입과 관련된 물리 과정 및 전 지구 평균 열수지를 해석할 수 있다.","h":["지표와 대기의 열 출입을 물리 과정, 즉 산란, 반사, 흡수, 굴절 등으로 설명한다. 에너지(열) 수지를 다루면서 잠열의 효과가 가장 크다는 것을 파악함으로써 구름 생성을 위한 단열변화로 연결한다."]},{"교":"과학","c":"12지시03-03","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"기온의 연직 분포와 대기의 안정도와의 관계를 이해하고, 단열변화를 통해 안개나 구름이 생성되는 과정 및 강수 과정을 분석할 수 있다.","h":["단열변화에서 기온과 습도의 변화를 이해하고, 단열변화와 단열 감률을 고려한 대기의 안정도를 구름의 생성과 관련지어 다룬다."]},{"교":"과학","c":"12지시03-04","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"기압의 연직 분포로 정역학적 균형을 이해하고, 대기 중 연직 운동의 발생 원인을 추론할 수 있다."},{"교":"과학","c":"12지시03-05","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"지균풍, 경도풍, 지상풍의 발생 원리와 관련된 힘의 작용을 설명할 수 있다."},{"교":"과학","c":"12지시03-06","과":"지구시스템과학","학":"고2~3","영":"강수 과정과 대기의 운동","p":"행성파의 발달 과정을 이해하고, 지상 고⋅저기압 발달에서 편서풍 파동의 역할을 평가할 수 있다."},{"교":"과학","c":"12행우01-01","과":"행성우주과학","학":"고2~3","영":"우주탐사와 행성계","p":"태양계 탐사선의 활동을 통해 알아낸 성과를 이해하고, 인공위성을 활용한 우주탐사의 필요성을 토론할 수 있다.","h":["최근의 태양계 탐사선 탐사 결과로부터 새롭게 밝혀진 사실을 중심으로 다룬다. 태양계 탐사선과 관련하여 행성 탐사선, 소천체 탐사선 등의 활동과 성과를 다룬다. 우리나라의 우주개발 성과와 계획을 간략히 소개한다."]},{"교":"과학","c":"12행우01-02","과":"행성우주과학","학":"고2~3","영":"우주탐사와 행성계","p":"태양 활동 감시 시스템과 지구 접근 천체를 비롯한 지구를 위협하는 우주 위험 감시 기술의 중요성을 우주 재난 측면에서 인식할 수 있다.","h":["우주 위험 감시 기술과 관련하여 우주기상, 소천체 충돌, 우주 쓰레기 등의 문제를 다룬다."]},{"교":"과학","c":"12행우01-03","과":"행성우주과학","학":"고2~3","영":"우주탐사와 행성계","p":"태양계를 지배하는 힘이 태양의 중력임을 이해하고, 케플러의 세 가지 법칙을 이용하여 태양계 구성 천체들의 운동을 설명할 수 있다.","h":["케플러의 세 가지 법칙에서 각 법칙의 물리적 의미를 다루고, 태양계의 모든 천체에 케플러의 법칙이 적용된다는 사실을 설명할 수 있도록 한다."]},{"교":"과학","c":"12행우01-04","과":"행성우주과학","학":"고2~3","영":"우주탐사와 행성계","p":"행성과 소천체의 정의를 구분하여 이해하고, 소천체 탐사 자료를 통해 이들의 특징을 추론할 수 있다.","h":["소천체에 속하는 왜소행성, 소행성, 혜성, 운석 등을 설명하고, 이들을 태양계 원시 물질로 구성된 천체와 분화된 천체로 구분할 수 있음을 다룬다."]},{"교":"과학","c":"12행우01-05","과":"행성우주과학","학":"고2~3","영":"우주탐사와 행성계","p":"외계 행성계 탐사의 원리를 이해하고, 외계 행성에 생명체가 존재할 수 있는 조건과 외계 생명체의 존재 가능성에 대해 논증할 수 있다.","h":["외계 행성계에서의 생명가능지대가 중심별의 표면 온도 등에 의해 결정된다는 것을 설명하며, 생명가능지대가 액체 상태의 물이 존재할 수 있는 범위로 설정된다는 사실을 통해 물이 생명 현상의 중요한 요소임을 이해하도록 한다."]},{"교":"과학","c":"12행우02-01","과":"행성우주과학","학":"고2~3","영":"태양과 별의 관측","p":"태양의 광구와 대기에서 나타나는 현상을 설명하고, 이러한 현상이 다양한 파장의 관측 자료에서 어떻게 나타나는지 비교⋅분석할 수 있다.","h":["태양 광구에서 흑점과 쌀알 무늬가 나타나는 이유를 이해하고, 흑점의 관측 자료로부터 태양 활동의 주기와 차등 자전을 설명한다. 태양의 위성 영상자료를 컴퓨터로 합성하는 활동을 통해 태양의 차등 자전을 이해한다."]},{"교":"과학","c":"12행우02-02","과":"행성우주과학","학":"고2~3","영":"태양과 별의 관측","p":"별의 시차와 밝기를 이용하여 거리를 측정하는 다양한 방법을 비교⋅평가할 수 있다.","h":["별의 연주시차를 이용하여 거리를 계산하는 방법을 다루고, 별의 겉보기 등급과 절대등급을 이용하여 거리를 계산하는 방법(거리지수)을 설명한다."]},{"교":"과학","c":"12행우02-03","과":"행성우주과학","학":"고2~3","영":"태양과 별의 관측","p":"별의 시선속도와 접선속도의 합으로 공간 운동이 나타남을 이해하고, 별자리를 구성하는 별들의 장시간에 걸친 형태 변화를 추론할 수 있다.","h":["별의 접선속도와 시선속도를 관측하여 공간 운동을 계산할 수 있음을 소개하고, 별자리를 구성하는 별들이 물리적인 연관성은 없지만, 시선 방향의 범위가 비슷한 별들의 집단임을 이해하도록 한다."]},{"교":"과학","c":"12행우02-04","과":"행성우주과학","학":"고2~3","영":"태양과 별의 관측","p":"쌍성의 관측 자료를 이용하여 항성의 질량을 직접적으로 구할 수 있음을 이해하고, 질량-광도 관계를 이용하여 쌍성이 아닌 별의 질량을 구할 수 있다.","h":["케플러의 법칙을 쌍성계에 적용하여 쌍성계의 주기와 장반경으로부터 쌍성계를 구성하는 별의 질량을 구하는 과정을 이상적인 조건에 대해서만 다룬다."]},{"교":"과학","c":"12행우02-05","과":"행성우주과학","학":"고2~3","영":"태양과 별의 관측","p":"광도곡선의 특징을 비교하여 맥동변광성과 폭발 변광성을 구분하고, 폭발 변광성 중 초신성 관측 자료를 통해 알 수 있는 과학적 사실을 추론할 수 있다.","h":["변광성의 관측 자료를 제시하여 맥동변광성과 폭발 변광성을 구분하게 하며, 맥동변광성의 맥동 기작은 다루지 않는다. 초신성의 종류와 초신성 폭발 과정은 다루지 않는다."]},{"교":"과학","c":"12행우03-01","과":"행성우주과학","학":"고2~3","영":"은하와 우주","p":"성단의 C-M도를 이용하여 성단의 나이와 거리를 비교하고, 맥동변광성의 주기-광도 관계를 이용하여 우리은하의 구조와 규모를 추론할 수 있다.","h":["성단은 C-M도를 도입하여 설명하며, 성단의 주계열 맞추기를 이용하여 거리를 구하는 방법을 다룬다. 세페이드 변광성의 주기-광도 관계를 이용하여 우리은하의 규모를 계산하는 방법을 이해할 수 있도록 한다."]},{"교":"과학","c":"12행우03-02","과":"행성우주과학","학":"고2~3","영":"은하와 우주","p":"성간 소광 자료를 통해 성간 티끌의 존재를 추론하고, 성간 티끌의 특징을 설명할 수 있다.","h":["성간 기체가 다양한 상태로 분포하고 있음을 설명하고, 성간 소광에 의해 천체의 거리가 실제와 다르게 측정될 수 있음을 알고 관측 결과를 보정해야 하는 이유를 다룬다."]},{"교":"과학","c":"12행우03-03","과":"행성우주과학","학":"고2~3","영":"은하와 우주","p":"은하의 회전 속도 곡선을 이용하여 질량 분포를 이해하고 은하에 빛을 내지 않는 물질의 존재를 추론할 수 있다.","h":["우리은하의 회전 속도 곡선으로부터 계산된 질량과 별의 광도로부터 추정한 은하의 질량이 일치하지 않는다는 사실로부터 빛을 내지 않는 물질의 존재 가능성을 이해할 수 있도록 한다."]},{"교":"과학","c":"12행우03-04","과":"행성우주과학","학":"고2~3","영":"은하와 우주","p":"대규모로 이루어진 외부은하의 적색 편이 탐사의 성과를 이해하고, 은하의 공간 분포를 파악함에 있어서 분광 관측 자료의 중요성을 인식할 수 있다."},{"교":"과학","c":"12행우03-05","과":"행성우주과학","학":"고2~3","영":"은하와 우주","p":"은하의 공간 분포 자료를 통해 은하의 집단을 이해하고, 은하 장성, 보이드 등 우주의 거시적인 구조를 현대 우주론과 관련지어 설명할 수 있다."},{"교":"과학","c":"12과사01-01","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 문명의 탄생과 통합","p":"인류 문명의 탄생 과정에서 인류의 지혜가 담긴 과학적 사례를 발견하고, 이를 통해 과학이 인류 문명의 형성 과정에 기여하였음을 이해할 수 있다."},{"교":"과학","c":"12과사01-02","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 문명의 탄생과 통합","p":"고대 그리스 철학자의 과학적 사고나 주장 등을 조사하고, 그리스 문명이 고대에서 현대에 이르기까지 인간의 삶에 미친 영향을 설명할 수 있다.","h":["고대 그리스 시대의 우주관과 자연관을 이해하고, 고대 그리스 철학자들의 생각이 오늘날 과학이나 예술, 철학 등 다양한 분야에서 어떻게 활용되고 있는지 조사하도록 한다."]},{"교":"과학","c":"12과사01-03","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 문명의 탄생과 통합","p":"중세 시대 유럽과 중동 지역을 중심으로 종교나 문화가 과학에 기여한 바를 이해하고, 고대 그리스의 과학과 중세 과학의 특징을 비교할 수 있다."},{"교":"과학","c":"12과사01-04","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 문명의 탄생과 통합","p":"르네상스와 과학혁명이 일어난 사회문화적 배경을 조사하고, 과학과 예술 사이의 융합적 사례를 설명할 수 있다.","h":["예술 작품에 등장하는 과학적 소재나 창작 과정에서 나타난 과학적 개념이나 원리를 탐색하도록 한다."]},{"교":"과학","c":"12과사01-05","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 문명의 탄생과 통합","p":"과학 지식의 형성 과정에서 과학자의 신념이나 세계관이 영향을 준 사례를 조사하여 발표할 수 있다."},{"교":"과학","c":"12과사02-01","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"상대성 이론 등과 같은 현대 과학의 등장이 당시의 사회문화에 끼친 영향을 이해함으로써 과학의 사회적 가치를 느낄 수 있다."},{"교":"과학","c":"12과사02-02","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"현대 과학의 등장 과정에서 나타난 과학자들의 논쟁이나 토론 사례를 조사하고, 과학적 의사소통에서 지켜야 할 규범과 태도를 이해할 수 있다."},{"교":"과학","c":"12과사02-03","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"현대 예술 작품이나 건축물에 과학적 원리가 적용된 사례를 조사하고, 과학과 문화의 관련성을 추론할 수 있다."},{"교":"과학","c":"12과사02-04","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"감염병이 사회에 영향을 미친 대표적인 사례를 찾고, 과학이 사회 문제 해결에 기여함을 인식할 수 있다.","h":["근대 사회 등장 이래 우리나라뿐만 아니라 유럽 및 세계 전역에서 유행했던 감염병을 조사하고, 감염병 등장이 미친 사회 변화와 이러한 문제를 극복하는 과정에서 과학의 역할을 조사하여 능동적으로 문제를 발견하고 해결하는 자세를 갖도록 한다."]},{"교":"과학","c":"12과사02-05","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"과학기술이 교통수단의 발달에 미친 영향을 인식하고, 교통수단의 발전이 가져올 미래 사회의 변화를 예측할 수 있다."},{"교":"과학","c":"12과사02-06","과":"과학의 역사와 문화","학":"고2~3","영":"변화하는 과학과 세계","p":"산업혁명 이후 나타난 과학기술이 인류 문명에 미친 긍정적 효과와 부정적 효과에 대해 토론할 수 있다.","h":["산업혁명 이후 화학 무기, 원자력, 유전자 재조합 등의 과학기술 발전으로 발생한 사회적 갈등을 알아봄으로써 과학기술이 갖는 양면성을 이해하고, 새롭게 등장하는 과학기술에 대해 균형적으로 판단할 수 있는 시야를 갖도록 한다."]},{"교":"과학","c":"12과사03-01","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"과학기술의 발전을 통해 새롭게 나타난 문화적 변화를 찾아보고, 과학을 주제로 하는 예술 작품이나 콘텐츠를 제작하여 발표할 수 있다."},{"교":"과학","c":"12과사03-02","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"일상생활이나 미디어에서 사용되는 과학 용어를 조사하고, 과학 용어가 우리 사회에 미치는 파급효과를 설명할 수 있다.","h":["에너지나 DNA와 같은 과학 용어를 뉴스나 미디어 속에서 어떻게 활용하는지 찾아보고 과학적 맥락과 그 밖의 맥락에서 활용하는 용어의 의미를 서로 비교하여 차이점을 이해하도록 한다. 또한, 새로운 과학 용어를 다양한 사회 또는 자연 현상 설명에 활용한다는 점을 통해 과학적 아이디어를 다양한 상황이나 맥락에 적용하도록 한다."]},{"교":"과학","c":"12과사03-03","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"과학기술의 발전이 음악에 영향을 끼친 사례를 탐색하고 인공지능으로 음악을 창작하거나 로봇을 활용한 연주를 통해 과학의 심미적 가치를 느낄 수 있다."},{"교":"과학","c":"12과사03-04","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"인간과 기계, 사물 등을 연결하는 과학기술의 발전 동향을 파악하고 미래 사회의 변화를 예측할 수 있다."},{"교":"과학","c":"12과사03-05","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"가상 현실이나 증강 현실을 활용한 우리 주변의 사례를 조사하고, 이러한 기술이 미래 사회에 미칠 수 있는 영향에 대해 토론할 수 있다."},{"교":"과학","c":"12과사03-06","과":"과학의 역사와 문화","학":"고2~3","영":"과학과 인류의 미래","p":"집단적 의사결정을 통해 과학기술과 관련된 사회적 문제를 해결한 사례를 조사하여 과학기술에 대한 시민의 이해와 균형 있는 가치 판단의 필요성을 인식할 수 있다.","h":["핵발전소 가동 연장이나 자동차의 안전성 논란 등 과학과 관련된 사회적 쟁점의 사례를 조사하여 대중의 과학적 시각과 균형적인 가치 판단이 중요함을 깨닫도록 한다."]},{"교":"과학","c":"12기환01-01","과":"기후변화와 환경생태","학":"고2~3","영":"기후와 환경생태의 특성","p":"날씨와 기후의 특성을 이해하고, 이를 비교하여 설명할 수 있다.","h":["기후를 결정하는 기후요소와 기후인자를 구분하여 이해하도록 한다."]},{"교":"과학","c":"12기환01-02","과":"기후변화와 환경생태","학":"고2~3","영":"기후와 환경생태의 특성","p":"기후시스템이 유지되는 되먹임 과정을 이해하고 생물권과 다른 권역 간 상호작용을 설명할 수 있다.","h":["지구시스템의 기권, 수권, 지권과 생물권 간 상호작용을 이해하도록 한다."]},{"교":"과학","c":"12기환01-03","과":"기후변화와 환경생태","학":"고2~3","영":"기후와 환경생태의 특성","p":"기후변화가 생태계와 우리의 생활환경에 영향을 미친 사례를 조사하여 발표할 수 있다."},{"교":"과학","c":"12기환02-01","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"기후위기가 일어나는 주요 원인을 이해하고, 기후위기의 심각성을 인식할 수 있다."},{"교":"과학","c":"12기환02-02","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"빙상의 융해와 열팽창으로 인한 해수면 상승을 기후변화와 연계하여 설명할 수 있다."},{"교":"과학","c":"12기환02-03","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"극한 기상 현상의 종류와 원인을 이해하고 극한 기상 현상이 환경생태에 미친 영향을 사례를 들어 설명할 수 있다.","h":["극한 기상 현상은 슈퍼 태풍이나 메가 가뭄과 같은 대표적인 사례들을 중심으로 다룬다."]},{"교":"과학","c":"12기환02-04","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"기후변화 시나리오에 따른 미래 생태계 변화 예측 보고서를 찾아보고, 미래의 기후와 생태계의 변화 양상을 추론할 수 있다.","h":["기후변화 시나리오에 따른 생물의 분포 변화와 관련된 다양한 보고서나 자료들을 안내하고, 자기주도적으로 자료를 분석하고 해석한 후 토론이나 발표를 하도록 한다."]},{"교":"과학","c":"12기환02-05","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"꽃의 개화 시기 변화 자료를 조사하고, 꽃의 개화 시기 변화가 우리 생활에 끼치는 영향을 추론할 수 있다."},{"교":"과학","c":"12기환02-06","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"꿀벌을 비롯한 곤충의 개체 수 감소 원인을 기후변화와 연계하여 설명할 수 있다."},{"교":"과학","c":"12기환02-07","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"수생태계의 물꽃 현상을 이해하고, 기후변화가 수생태계의 생물다양성에 끼치는 영향을 추론할 수 있다."},{"교":"과학","c":"12기환02-08","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기와 환경생태 변화","p":"모기나 파리와 같은 곤충 매개 감염병이 새롭게 출현하거나 급격히 확산되는 현상을 기후변화와 연계하여 설명할 수 있다."},{"교":"과학","c":"12기환03-01","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기에 대응하는 우리의 노력","p":"산호의 멸종으로 인한 백화현상의 예를 통해 기후변화가 해양생태계에 미치는 영향을 살펴보고, 바다 사막화를 예방하거나 복원할 수 있는 과학기술의 사례를 제시할 수 있다."},{"교":"과학","c":"12기환03-02","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기에 대응하는 우리의 노력","p":"기후변화에 따라 가속화되는 사막화, 대형산불, 지역적 가뭄과 홍수 등을 이해하고, 이를 극복하기 위한 인류의 노력에 대해 토의할 수 있다."},{"교":"과학","c":"12기환03-03","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기에 대응하는 우리의 노력","p":"탄소중립 사회를 이루기 위한 탄소 저감 관련 과학기술 개발 현황을 알아보고, 이의 적용 사례를 제시할 수 있다."},{"교":"과학","c":"12기환03-04","과":"기후변화와 환경생태","학":"고2~3","영":"기후위기에 대응하는 우리의 노력","p":"기후위기와 환경생태 변화에 대응하기 위한 국제사회의 노력을 알아보고, 민주 시민으로서 참여 방안을 제안할 수 있다.","h":["국제사회의 생물다양성 협약, 기후변화에 관한 정부 간 협의체나 국제기구를 소개하고, 이들의 노력이나 체결된 국제 협약 등을 다룬다."]},{"교":"과학","c":"12융탐01-01","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 이해","p":"과학이 다양한 분야와 연계하여 인류 사회의 문제해결에 기여하였음을 이해하고, 융합적 탐구의 유용성을 느낄 수 있다.","h":["현미경을 이용한 물질의 구조에 대한 분석, X-선 분광학 기술을 이용한 DNA 구조의 발견 등과 같이 다양한 분야의 과학기술이 서로 결합하여 과학의 발전을 가져온 사례 등을 다룬다."]},{"교":"과학","c":"12융탐01-02","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 이해","p":"예술에서의 창작이나 사회과학적 탐구 과정을 이해하고, 과학적 탐구 과정과의 공통점과 차이점을 비교할 수 있다."},{"교":"과학","c":"12융탐01-03","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 이해","p":"과학적 탐구 과정에서 사용되는 다양한 데이터의 종류를 이해하고, 지식의 창출 과정에서 데이터의 가치와 중요성을 인식할 수 있다."},{"교":"과학","c":"12융탐01-04","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 이해","p":"인공지능을 포함한 디지털 탐구 도구나 기술의 활용 사례를 조사하고, 과학적 탐구 과정에서 디지털 탐구 도구와 기술 활용의 의의를 평가할 수 있다."},{"교":"과학","c":"12융탐02-01","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"실생활에서 관찰이나 경험을 통해 직접 얻은 데이터나 공개된 데이터를 가공하여 융합적 탐구 문제를 스스로 발견할 수 있다."},{"교":"과학","c":"12융탐02-02","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"융합적 탐구 문제해결을 위한 가설이나 모형을 고안하고, 문제를 해결할 수 있는 방법이나 절차 등을 설계할 수 있다."},{"교":"과학","c":"12융탐02-03","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"디지털 탐구 도구를 포함한 다양한 도구를 활용하여 데이터를 수집하고, 수집한 데이터의 타당성과 신뢰성을 평가할 수 있다.","h":["센서나 기기가 데이터를 측정 또는 수집하는 방법을 경험함으로써 데이터 수집의 한계나 어려움을 이해할 수 있도록 한다."]},{"교":"과학","c":"12융탐02-04","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"융합적 탐구 과정을 통해 얻은 데이터를 탐구 목적이나 맥락에 맞게 시각 자료로 표현할 수 있다.","h":["표, 막대그래프, 히스토그램, 분산형 그래프 등 다양한 시각 자료의 특성을 이해하고 수집한 데이터를 적절한 형태로 시각화하도록 한다."]},{"교":"과학","c":"12융탐02-05","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"평균, 표준편차 등을 바탕으로 데이터의 특성을 파악하고, 이를 토대로 가설이나 모형을 평가할 수 있다."},{"교":"과학","c":"12융탐02-06","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"데이터 분석 결과를 바탕으로 결론을 도출하고 평가할 수 있다."},{"교":"과학","c":"12융탐02-07","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 과정","p":"다양한 표현 방법을 활용하여 융합적 탐구 문제, 과정, 결과, 결론 등을 효과적으로 발표하고 토론할 수 있다."},{"교":"과학","c":"12융탐03-01","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 전망","p":"과학기술의 변화와 발전을 고려하여 미래 사회에 등장할 새로운 융합과학기술을 예측할 수 있다."},{"교":"과학","c":"12융탐03-02","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 전망","p":"오늘날 인류가 겪고 있는 난제를 융합과학기술을 활용하여 해결할 수 있는 방안에 대해 토의할 수 있다.","h":["오늘날 인류가 직면한 식량이나 물 부족, 각종 자원의 고갈, 기후변화나 싱크홀 등과 같은 난제에 대해 융합과학기술을 통한 간학문적 문제 해결 방안에 대해 토의하도록 한다."]},{"교":"과학","c":"12융탐03-03","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 전망","p":"융합과학 탐구 과정에서 준수해야 할 윤리에 대해 알아보고, 과학기술의 발달에 따라 발생할 수 있는 윤리적 쟁점을 토론할 수 있다."},{"교":"과학","c":"12융탐03-04","과":"융합과학 탐구","학":"고2~3","영":"융합과학 탐구의 전망","p":"융합과학기술을 활용하여 사회 문제를 해결하는 과정에서 시민참여가 문제해결에 도움을 준 사례를 제시할 수 있다."},{"교":"실과(기술⋅가정)","c":"6실01-01","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다.","h":["이 성취기준은 아동기의 신체, 사회⋅정서, 성, 진로 발달의 특징을 이해하여 자신이 여러 영역에서 발달과정에 있다는 것과 발달의 개인차가 있다는 것을 인식하도록 한다. 또한 건강하게 발달하기 위해서는 가족이나 어른들의 도움만이 아니라 자신의 다양한 노력이 필요함을 이해하여 이를 실천한다."]},{"교":"실과(기술⋅가정)","c":"6실01-02","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다."},{"교":"실과(기술⋅가정)","c":"6실01-03","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다.","h":["이 성취기준은 삶의 기본적 조건인 의식주생활을 충족시키는 가족의 역할은 가족이 처한 상황이나 조건에 따라 다양할 수 있음을 알도록 하며, 이 과정에서 가정생활의 중요성과 가정일에 있어서 협력적 소통에 기반한 가족의 역할 분담에 대해 이해하고 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실01-04","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다."},{"교":"실과(기술⋅가정)","c":"6실01-05","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다.","h":["이 성취기준은 옷이 자기 몸을 보호하고 활동을 편하게 하면서 자신을 표현하는 수단임을 이해하도록 하여 때와 장소, 상황에 따라 건강, 안전, 위생, 예절을 고려한 옷차림을 영위하는 능력과 태도를 기르도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실01-06","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다."},{"교":"실과(기술⋅가정)","c":"6실01-07","과":"실과","학":"초5~6","영":"인간 발달과 주도적 삶","p":"직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다.","h":["이 성취기준은 가정일 뿐 아니라 직업으로서 일에 대한 필요성을 알고 다양한 직업 중에서 적성, 흥미, 성격 등의 특성을 고려하여 진로 발달 계획을 주도적으로 탐색하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실02-01","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높이는 방법을 탐색한다."},{"교":"실과(기술⋅가정)","c":"6실02-02","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"생활자원 관리의 필요성을 인식하고, 생활자원의 합리적인 보관과 활용방법을 익힌다."},{"교":"실과(기술⋅가정)","c":"6실02-03","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다.","h":["이 성취기준은 옷, 음식, 생활용품 등 생활자원은 올바른 사용 방법 및 사용 후 버리기 여부의 선택과 처리 방법에 따라 또 다른 생활자원이나 혹은 쓰레기가 될 수 있음을 알고 쓰레기 줄이기 및 분리배출 방법 등을 익혀 실천하도록 한다. 아울러 개인과 가족의 자원 사용이 지구환경에 미치는 영향을 이해하여 생활자원을 소중히 여기고 지속가능한 삶의 태도로서 나눔과 기부를 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실02-04","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다.","h":["이 성취기준은 자연에서 먹거리로 생산되는 다양한 식재료의 맛을 느끼고 즐길 수 있으며 이 과정에서 맛에 대한 경험을 통해 자연이 주는 먹거리의 의미를 이해하고, 이를 편식 교정 등에 적용할 수 있도록 한다. 특히 지역 및 제철 식품의 이용을 통해 친환경적인 식생활의 의미를 알게 한다."]},{"교":"실과(기술⋅가정)","c":"6실02-05","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"음식의 조리과정을 체험하여 자기 간식이나 식사를 스스로 마련하는 식생활을 실천한다."},{"교":"실과(기술⋅가정)","c":"6실02-06","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사  예절을 실천한다.","h":["이 성취기준은 먹는다는 것의 의미와 음식문화의 기본으로서 우리나라의 고유한 식사 형식인 밥상차림을 이해하도록 한다. 또한 음식을 준비하여 함께 먹는 의미와 즐거움을 경험할 수 있도록 하며 이 과정에서 식사예절이 필요함을 인식하고 이를 실천할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실02-07","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명한다."},{"교":"실과(기술⋅가정)","c":"6실02-08","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"다양한 도구와 재료를 활용하여 간단한 생활용품을 만들어 보면서 직접 만들어 쓰는 즐거움과 창의적 태도를 가진다.","h":["이 성취기준은 다양한 바느질 도구와 재료를 활용하여 간단한 생활용품을 만들어 보는 과정에서 즐거움과 의미를 느낄 수 있도록 한다. 아울러 이러한 활동을 통해 손 조작 능력, 도전성, 창의성 등 다양한 능력을 향상할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실02-09","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"간단한 옷의 수선 등 의생활과 관련된 문제를 스스로 해결하려는 태도를 가진다."},{"교":"실과(기술⋅가정)","c":"6실02-10","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"자신의 생활공간을 쾌적하고 위생적으로 관리하는 것의 중요성을 알고, 정리정돈과 청소 및 쓰레기 처리의 방법을 익혀 실천한다."},{"교":"실과(기술⋅가정)","c":"6실02-11","과":"실과","학":"초5~6","영":"생활환경과 지속가능한 선택","p":"생태 지향적 삶을 위해 자신의 의식주 생활에서 할 수 있는 구체적인 행동을 계획하여 실천한다.","h":["이 성취기준은 건강과 환경을 생각하고 배려의 마음이 깃든 생태 지향적 삶이 왜 필요하고 중요한지를 이해하고, 평소 자신의 의식주 생활습관을 살펴보면서 이를 바탕으로 하여 지속가능한 의식주생활을 위한 구체적인 행동을 계획하고 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실03-01","과":"실과","학":"초5~6","영":"기술적 문제해결과 혁신","p":"발명의 의미를 이해하고, 일상생활을 바꾼 발명품을 탐색하여 발명과 기술에 대한 중요성과 가치를 인식한다.","h":["이 성취기준은 발명의 의미를 발견과 비교하여 이해하도록 하고 일상생활에 영향을 끼친 다양한 발명품 사례를 탐색하도록 한다. 또한 발명품 중에서 소외된 지역의 사람들에게 도움을 주는 적정기술 사례를 찾아 나눔과 공유의 가치를 인식하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실03-02","과":"실과","학":"초5~6","영":"기술적 문제해결과 혁신","p":"발명사고기법과 기술적 문제 해결 과정을 이해하고, 다양한 재료를 활용하여 생활 속 문제를 해결할 수 있는 창의적인 제품을 구상하고 만들어 봄으로써 실천적 태도를 갖는다.","h":["이 성취기준은 일상생활에서 불편한 문제를 찾고 이를 해결하기 위하여 다양한 발명 사고 기법을 적용하여 개선된 아이디어를 내도록 한다. 이를 위해 기술적 문제해결 과정(문제 확인, 아이디어 탐색 및 구체화, 실행, 평가)에 따라 창의적인 물건을 구상하고 만들어서 공유하는 메이커 활동으로 연결되도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실03-03","과":"실과","학":"초5~6","영":"기술적 문제해결과 혁신","p":"발명과 특허의 관계를 이해하고, 특허 침해 사례를 통하여 지식재산권의 중요성을 인식하여 올바른 방법으로 활용한다."},{"교":"실과(기술⋅가정)","c":"6실03-04","과":"실과","학":"초5~6","영":"기술적 문제해결과 혁신","p":"수송의 의미와 수송 수단의 발달과정에 대한 이해를 바탕으로 생활 속 다양한 수송 수단을 탐색한다."},{"교":"실과(기술⋅가정)","c":"6실03-05","과":"실과","학":"초5~6","영":"기술적 문제해결과 혁신","p":"수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다.","h":["이 성취기준은 수송 수단의 기본 요소가 구동장치, 조향장치, 제동장치 등으로 구성되어 있음을 일상생활에서의 수송 수단 사례를 들어 설명하여 간단한 수송 수단을 만들고 공유하는 메이커 활동으로 연결한다. 수송 수단의 구동장치를 작동시키기 위하여 태양광 전지와 같은 친환경 에너지를 사용하여 수송 수단을 만들어 보면서 수송기술의 중요성과 가치를 인식하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실04-01","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험하면서 건설기술에 대한 가치를 인식한다.","h":["이 성취기준은 건설기술의 의미와 특성에 대한 이해를 바탕으로 건설 구조물에는 건축 구조물과 토목 구조물이 있음을 알고 건설 구조물을 탐색하는 체험 활동을 통해 중등의 건설기술과 연계되도록 설정하였다. 특히, 최근 대두되고 있는 친환경 건설 구조물의 사례를 탐색하고 간단한 구조물을 만드는 메이커 활동을 제시한다."]},{"교":"실과(기술⋅가정)","c":"6실04-02","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다."},{"교":"실과(기술⋅가정)","c":"6실04-03","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다.","h":["이 성취기준은 활동으로 만든 발표 자료를 사이버 공간에 공유하는 방법에 대한 이해를 바탕으로 자료를 공유할 때 개인 정보 및 저작권 보호의 중요성을 인식하고 실천하도록 설정하였다. 여기에서는 정보윤리를 지키는 방법에 관해 사례나 구체적인 방법을 제시하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실04-04","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다."},{"교":"실과(기술⋅가정)","c":"6실04-05","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다."},{"교":"실과(기술⋅가정)","c":"6실04-06","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작시키는 체험을 통해 융합 기술의 가치를 인식하다.","h":["이 성취기준은 로봇에 다양한 정보기술이 융합되는 사례를 탐색하여 로봇과 융합된 다양한 제품 개발에 대해 알고, 로봇의 다양한 센서와 동작을 위하여 블록 기반 프로그램으로 제어할 수 있는 활동을 하도록 하였다. 여기에서는 ‘디지털 사회와 인공지능’에서 학습한 블록 기반의 교육용 프로그래밍 도구를 활용하여 움직이는 간단한 인공지능형 로봇을 제작하여 구동시켜 보면서 로봇의 작동 원리를 학습하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실04-07","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색한다."},{"교":"실과(기술⋅가정)","c":"6실04-08","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태 존중감을 가진다."},{"교":"실과(기술⋅가정)","c":"6실04-09","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다.","h":["이 성취기준은 친환경 농업에 대한 이해를 바탕으로 이를 이루기 위한 농업사례들을 구분하여 지속가능한 농업이 이루어지기 위한 농업의 순환성을 이해하고 중요성을 인식하도록 설정하였다. 특히, 지속가능성 농업의 순환에 대한 다양한 사례(예, 친환경 농업, 스마트팜, 로컬 푸드, 푸드 마일리지 등)를 통해 학습하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실04-10","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다.","h":["이 성취기준은 생활 속에서 농업활동과 연관 지을 수 있는 모습에 대한 예측을 바탕으로 다양한 농업활동 분야들을 알고 이와 관련된 농업활동 체험을 통해 농업에 대한 관심과 흥미를 가질 수 있도록 설정하였다. 특히, 농업활동은 실내원예활동, 농업생산물 가공 활동, 원예 및 동물치료 활동 등과 같은 생활상의 변화와 관련된 체험을 제시하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실04-11","과":"실과","학":"초5~6","영":"지속가능한 기술과 융합","p":"농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다.","h":["이 성취기준은 농업과 농촌은 농산물 생산뿐 아닌 그 외에도 다원적인 역할을 하고 있음을 이해하고 이에 대한 인식과 이해를 바탕으로 농업과 농촌에 대한 올바른 진로역량을 기르기 위해서 설정하였다. 특히, 다원적인 농업과 농촌의 가치를 환경, 생태, 사회, 문화적인 가치로 분류하여 이와 관련된 진로를 탐색하고 건전한 진로역량을 기르도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실05-01","과":"실과","학":"초5~6","영":"디지털 사회와 인공지능","p":"컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다.","h":["이 성취기준은 컴퓨터의 개념을 이해하고 다양한 문제 상황에서 컴퓨터가 활용되는 사례 탐색을 통해 그 가치와 활용 방법을 알 수 있어야 한다. 일상생활에서 컴퓨터를 활용해 해결할 수 있는 문제를 탐색하고, 문제 상황에 제시된 요소들을 분석해 문제의 현재 상태와 목표 상태를 정의한다. 언플러그드 활동 등을 통한 문제 해결 과정을 알고리즘으로 작성하기 위해 자연어, 의사코드(pseudocode), 순서도 등으로 문제 해결 과정을 표현하도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실05-02","과":"실과","학":"초5~6","영":"디지털 사회와 인공지능","p":"컴퓨터에게 명령하는 방법을 체험하고, 주어진 문제를 해결하는 프로그램을 작성한다."},{"교":"실과(기술⋅가정)","c":"6실05-03","과":"실과","학":"초5~6","영":"디지털 사회와 인공지능","p":"실생활의 문제를 해결하는 프로그램을 협력하여 작성하고, 산출물을 타인과 공유한다."},{"교":"실과(기술⋅가정)","c":"6실05-04","과":"실과","학":"초5~6","영":"디지털 사회와 인공지능","p":"디지털 데이터와 아날로그 데이터의 특징을 이해하고, 인공지능에 활용할 수 있는 데이터의 유형이나 형태를 탐색한다.","h":["이 성취기준은 놀이⋅체험을 중심으로 생활 주변에서 접할 수 있는 디지털 및 아날로그 데이터를 찾아 각각의 특징을 비교하는 과정을 통해 데이터의 의미를 이해하고, 인공지능에 활용할 수 있는 숫자, 글자, 소리, 이미지 데이터의 유형이나 형태를 탐색할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"6실05-05","과":"실과","학":"초5~6","영":"디지털 사회와 인공지능","p":"인공지능이 만들어지는 과정을 체험하고, 인공지능이 사회에 미치는 영향을 탐색한다.","h":["이 성취기준은 기계학습이 적용된 간단한 인공지능 도구의 체험을 통해 기계학습의 기본 원리를 이해하고 인공지능으로 인한 사회의 발전과 직업의 변화를 이해하여 인공지능이 사회에 미치는 영향을 탐색할 수 있어야 한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-01","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"자아 존중감을 향상시키고 긍정적인 자아 정체성을 형성하기 위해 청소년기의 발달 특징을 자신의 발달 특징과 연결 지어 자신을 총체적으로 이해한다."},{"교":"실과(기술⋅가정)","c":"9기가01-02","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"의생활, 식생활이 청소년기 성장과 건강에 미치는 영향을 탐색하고 성장과 건강을 위해 바람직한 의생활과 식생활의 실천 방안을 탐색하여 이를 실천한다.","h":["이 성취기준은 의생활과 식생활을 어떻게 영위하는지에 따라 청소년기 발달에 차이가 발생할 수 있음을 이해하고, 건강한 생활을 영위하고 청소년기의 긍정적인 발달을 이끄는 방안을 탐색하여 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-03","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"건강과 성장을 위한 청소년기 영양의 중요성을 이해하여 자신의 식생활을 평가하고, 식생활 문제를 개선하여 건강한 식생활을 실천한다."},{"교":"실과(기술⋅가정)","c":"9기가01-04","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"의복디자인 요소를 고려한 자기이미지에 맞는 옷차림으로 자신을 긍정적으로 표현한다.","h":["이 성취기준은 자기 이미지에 맞는 옷차림을 하는 것이 자아를 표현하는 효과적인 수단이 될 수 있음을 인식하고, 의복디자인 요소를 고려한 옷차림으로 자신을 긍정적으로 표현할 수 있도록 한다. 또한 한복에서 자신에게 맞는 디자인 요소를 찾아보는 활동을 추가하여 진행할 수 있다."]},{"교":"실과(기술⋅가정)","c":"9기가01-05","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"청소년기의 건강한 발달을 위협하는 스트레스, 분노, 우울 등의 여러 가지 행동 및 심리 문제의 원인을 분석하고, 적응 유연성을 기를 수 있는 다양한 예방 및 해결방안을 탐색하여 적용한다."},{"교":"실과(기술⋅가정)","c":"9기가01-06","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"사회변화로 증가하는 여러 가지 청소년 중독의 유형을 탐색하여 이를 예방하고 대응할 수 있는 방안을 제안한다.","h":["이 성취기준은 디지털 생활환경의 확산으로 나타나는 중독 문제(게임, 스마트폰, 도박 등)와 청소년 건강과 관련된 중독 문제(니코틴, 카페인, 약물 등)의 발생 원인과 영향을 분석하고, 이를 예방 및 해결하는 방안을 제안하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-07","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"자기 이해를 기반으로 전 생애적 관점에서 진로 설계의 중요성을 인식하고, 자기 적성에 맞는 진로를 설계한다."},{"교":"실과(기술⋅가정)","c":"9기가01-08","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"성적 자기 결정권의 중요성을 이해하고, 성인지 감수성과 건강한 성 가치관을 함양하여 상호 존중의 관계를 실천할 수 있는 방안을 탐색한다.","h":["이 성취기준은 이차 성징의 변화를 경험하는 중학교 학습자들이 남성과 여성의 서로 다른 성에 대해 이해하여 부정확한 지식이나 편견을 갖지 않도록 하며, 성인지 감수성을 바탕으로 자신의 뜻을 분명히 하는 주체적이고 책임감 있는 태도를 길러 자기 자신과 상대방을 보호하며 존중할 수 있는 성적 자기 결정권에 대한 이해를 함양하도록 한다. 이 권리는 왜곡된 성 관련 정보와 위험한 환경으로부터 자신을 보호할 수 있는 근거가 될 수 있으며, 다른 의미로 해석되지 않도록 유의한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-09","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"일상생활 및 가상공간에서 만나는 또래와 건강한 관계를 형성하고, 다양한 주변인들과 친밀한 세대 간 관계를 형성하는 방안을 탐색하여 실천한다.","h":["이 성취기준은 자신을 둘러싼 관계에는 횡적(또래) 관계뿐 아니라 종적(다양한 세대) 관계도 있음을 인식하고, 다양한 주변인들과 건강하고 친밀한 관계를 형성하는 방안을 실천하도록 한다. 이때, 현실 세계에서 교류하는 타인뿐만 아니라 확장된 생활환경(사회 관계망 서비스(SNS), 게임, 메타버스와 같은 가상세계)에서 교류하는 타인도 함께 다룬다. 인터넷상의 익명성을 올바르게 활용할 수 있는 방안과 인터넷 언어폭력, 사이버 폭력의 심각성을 알아보는 활동을 추가하여 진행할 수 있다."]},{"교":"실과(기술⋅가정)","c":"9기가01-10","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"다양한 현대 가족에 내재된 가족생활의 보편성과 고유한 가치를 존중하는 동시에 가족에 대한 유연한 태도를 길러, 뉴노멀 사회에서의 새로운 가족문화를 탐색한다.","h":["이 성취기준은 사회 변화로 인해 가족 유형의 다양성이 증가하고 있지만, 이러한 다양성을 관통하는 가족이 지닌 고유의 가치를 인식하도록 한다. 또한 다양한 가족에 대한 유연한 태도와 더불어 살아가는 공동체의 가치에 대해 탐색하도록 한다. 나아가 테크놀로지와 미디어 발달로 인해 발생한 변화에 적합한 새로운 가족문화를 탐색하여 실천할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-11","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"대인 관계에서 발생하는 갈등의 원인과 배경을 분석하고, 효과적인 의사소통을 통해 갈등을 해결하는 방안을 탐색하여 이를 적용한다.","h":["이 성취기준은 갈등을 원만하게 해결하기 위한 의사소통능력의 필요성을 인식하고, 효과적 의사소통 방법의 의미와 원리를 파악한다. 또한 객관적 관점에서 갈등을 조망하여 타인과의 갈등을 해결하고 원만한 대인 관계를 형성할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가01-12","과":"기술⋅가정","학":"중1~3","영":"인간 발달과 주도적 삶","p":"성폭력과 가정폭력의 사회⋅구조적인 원인과 영향을 분석하고, 다양한 문제 상황을 중심으로 이를 대처하고 지원하는 방안을 탐색한다."},{"교":"실과(기술⋅가정)","c":"9기가02-01","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"생활자원의 종류와 특성 및 순환과정을 이해하고, 의식주 자원관리의 중요성을 인식한다.","h":["이 성취기준은 생활자원을 인적⋅물적 자원으로 구분하고 일상생활을 영위하는데 필수적인 의식주 자원이 물적 자원에 포함됨을 이해한다. 점차 심각해지는 기후위기에 대응하여 인간과 자연이 공존하기 위해서는 순환 가능성을 고려한 의식주 자원관리가 중요함을 인식할 수 있게 한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-02","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"한국인 영양소 섭취기준과 식사구성안을 바탕으로 균형 잡힌 식사를 계획한다."},{"교":"실과(기술⋅가정)","c":"9기가02-03","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"건강과 환경을 고려한 식품의 선택, 관리, 보관 방법을 탐색하여 실생활에 적용한다."},{"교":"실과(기술⋅가정)","c":"9기가02-04","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"개인과 가족의 영양 요구와 지속가능성을 충족하는 식사를 계획하고 조리한다.","h":["이 성취기준은 식사 계획 시 개인과 가족의 영양 및 기호 등을 고려하는 것뿐만 아니라 제철 식품, 로컬 푸드, 대체식품, 탄소배출, 음식물 쓰레기 감량 등의 지속가능성을 고려하여 식품을 선택하고, 조리 시에도 건강 및 안전을 고려한 조리법을 적용하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-05","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"의복 재료의 특성을 이해하고 건강과 환경을 고려한 의복의 세탁과 관리 방안을 탐색하여 실천한다."},{"교":"실과(기술⋅가정)","c":"9기가02-06","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"지속가능성을 고려하여 의복 마련 계획을 세우고, 이를 창의적이고 친환경적인 의생활에 적용한다.","h":["이 성취기준은 패스트 패션과 같은 현대 사회의 의생활 문제를 분석하여 의복 구매 시 디자인, 가격 등의 개인적 요구뿐 아니라 자신의 선택이 사회, 환경에 미치는 영향까지도 고려해야 함을 성찰한다. 나아가 3R(Reduce, Reuse, Re(Up)cycle)을 일상생활에서 실천하는 방안을 탐색하여 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-07","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"주거의 의미와 가치가 변화함에 따라 나타나는 다양한 생활 양식을 탐색하고, 더불어 살아가는 주거 문화를 실천한다.","h":["이 성취기준은 주거의 의미와 기능을 살펴보고, 현대 사회 주거 가치와 인식 변화에 따른 다양한 주생활 양식을 탐색한다. 또한 대면 교류가 줄어들고 있는 현실에서 더불어 사는 주거 문화의 중요성을 인식하고 실천 방안을 탐색하여 공동체 가치 함양 및 역량이 강화되도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-08","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"생활공간으로서 주거환경의 조건을 분석하고, 쾌적하고 안전한 주거 관리 방안을 탐색하여 실생활에 적용한다.","h":["이 성취기준은 열, 빛, 공기, 소음이 인간에게 미치는 영향을 이해하여 쾌적한 주거환경을 조성하기 위한 능력을 기른다. 특히 디지털 환경 확대에 따른 인공지능 기반 주거 서비스(안전성, 쾌적성, 편의성, 유지 및 관리 등)의 쾌적성과 안전성에 대해 분석해 보도록 한다. 또한 주생활에서 탄소중립을 실천하기 위해 가정생활에서의 탄소발자국 줄이기 활동 등을 진행할 수 있다."]},{"교":"실과(기술⋅가정)","c":"9기가02-09","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"효율적인 주거 공간 구성 방안을 탐색하여 자신의 생활에 적합한 주거 공간 구성에 활용한다."},{"교":"실과(기술⋅가정)","c":"9기가02-10","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"의식주 생활자원의 생산과 폐기과정을 탐색하고, 일상생활에서 의식주 생활자원을 선택한 과정과 그 결과를 성찰한다.","h":["이 성취기준은 의식주 생활자원의 순환과정에 초점을 두어 그 일생을 추론하고, 자신과 가족의 선택이 미치는 영향을 실천적 추론 등의 방법을 통해 성찰한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-11","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"급변하는 소비환경의 변화를 이해하고, 다양한 소비자 정보를 비판적으로 분석하여 자신의 소비생활에 활용한다.","h":["이 성취기준은 디지털 소비환경으로 변화함에 따라 무분별하게 쏟아지는 사회 관계망 광고, 추적 광고, 맞춤형 광고 등의 소비자 정보를 비판적으로 분석하여 문제점을 인식한다. 신유형 광고와 중립적 소비자 정보를 구분하는 활동을 통해 미디어 리터러시 역량을 함양하고, 유용한 소비자 정보를 선별하여 자신의 소비생활에 가치 있게 활용할 수 있도록 지도한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-12","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"청소년 소비자의 특성을 이해하고 소비자 의사 결정 과정을 통한 합리적인 소비생활을 실천한다."},{"교":"실과(기술⋅가정)","c":"9기가02-13","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"책임 있는 소비자로서 소비자의 권리와 역할을 인식하고, 소비생활에서 발생하는 소비자 문제와 해결 방안을 탐색하여 소비생활에 적용한다.","h":["이 성취기준은 소비자 문제와 관련된 사회적 현안을 선정하여 소비자 문제의 발생 원인을 파악하고 적합한 문제 해결 방안을 선택하고 실천하여, 비판적 사고능력을 기르고 적극적인 소비자 시민으로서의 사회적 역할을 탐색해 보도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가02-14","과":"기술⋅가정","학":"중1~3","영":"생활환경과 지속가능한 선택","p":"디지털 생활환경으로 나타난 일상생활의 혁신과 변화를 비판적으로 분석한 결과를 삶의 질 향상에 활용할 수 있는 방안을 탐색하여 제안한다.","h":["이 성취기준은 디지털 생활환경으로 변화함에 따라 의식주 생활에 새롭게 등장한 변화를 찾아 이것이 우리 삶에 미친 긍정적 영향과 부작용을 모두 살펴보고, 이를 삶의 질 향상에 활용할 수 있는 방안을 탐색하여 제안하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가03-01","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"기술의 의미와 특성을 이해하고 기술의 발달에 따른 사회의 변화를 파악하며, 미래의 기술과 사회의 변화를 평가하고 예측함으로써 기술에 대한 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"9기가03-02","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"기술의 표준화, 적정 기술과 같은 기술 활용 사례를 탐구하고, 기술이 사회에 미치는 영향을 바르게 인식하여 기술 혁신과 사회 발전에 참여하는 태도를 갖는다."},{"교":"실과(기술⋅가정)","c":"9기가03-03","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"기술적 문제 해결 과정의 이해를 바탕으로 문제를 확인하고, 정보를 수집하며, 확산적 사고와 수렴적 사고를 통해 해결방안을 탐색하고 대안을 선정한다.","h":[", [9기가03-04] 이 성취기준은 기술적 문제 해결 과정의 각 단계를 학생들이 이해하고, 각 단계에 맞는 실제적인 활동을 수행하여 기술적 문제해결 역량을 기르는데 주안점이 있다."]},{"교":"실과(기술⋅가정)","c":"9기가03-04","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"기술적 문제 해결 방안을 시각화하고 도면을 작성하며, 올바른 도구를 선택하여 시제품 또는 모형을 제작 및 평가하는 과정에서 협업 능력, 공감 능력과 의사소통 능력을 기른다.","h":["이 성취기준은 아이디어의 시각화는 기술적 문제 해결 과정에서 문제를 해결하는 주요 수단이라는 것을 인지하고, 아이디어의 산출 및 기록, 소통 등의 중요성을 이해하는데 주안점을 둔다. 또한 도면 작성 시 투상법, 도면의 크기, 척도, 선의 종류와 용도, 치수 기재 등 제도의 기본 통칙(KS)을 이해하고 도면 작성을 체험하도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가03-05","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"발명의 개념을 이해하고, 발명 문제 해결 과정을 바탕으로 발명 활동을 체험하여 창조에 대한 자신감을 갖고 발명이 사회에 미친 영향과 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"9기가03-06","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"지식재산권의 종류와 특징을 이해하고, 지식재산과 관련한 다양한 사례 조사 및 체험을 통해 지식재산권의 창출, 보호, 활용을 이해하고 실천한다."},{"교":"실과(기술⋅가정)","c":"9기가03-07","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"재료의 종류와 특성을 이해하며, 목적에 맞는 재료를 선택하고, 안전한 가공 방법을 실천한다.","h":["이 성취기준은 기술적 활동에 사용되는 주요 재료인 목재, 금속, 플라스틱 등의 종류, 특성, 용도에 대해 이해하고 안전하고 바른 방법으로 재료를 가공 및 활용하는 능력을 기르는데 주안점이 있다."]},{"교":"실과(기술⋅가정)","c":"9기가03-08","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"설계의 가치와 필요성을 인식하고, 제도의 기본 통칙에 따라 도면을 작성한다.","h":["이 성취기준은 기술적 산출물을 제작하거나 아이디어를 표현하고자 할 때 스케치, 도면, 디지털 기반 설계 등 다양한 아이디어 시각화 방법들이 사용되므로 목적에 따른 도면의 작성 방법, 도면의 기능과 필요성을 인식하는데 있다. 또한 도면 작성 시 투상법, 도면의 크기, 척도, 선의 종류와 용도, 치수 기재 등 제도의 기본 통칙(KS)을 이해하고 도면 작성을 체험하도록 하는데 주안점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가03-09","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"제품의 제작 순서를 이해하고 올바른 도구를 선택하여 제품을 안전하게 제작하고 평가한다.","h":["이 성취기준은 학생이 기술적 문제 해결 능력을 함양하기 위해 제품을 직접 제작하는 것은 중요한 학습 활동이므로 설정하였다. 따라서 문제 해결에 필요한 제품 가공 방법을 이해할 수 있도록 하는데 주안점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가03-10","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"친환경 에너지 자원의 특성을 이해하고, 종류와 활용 사례를 조사하여 친환경 에너지 개발의 중요성을 인식한다.","h":["이 성취기준은 기후변화, 환경오염 및 에너지 자원 고갈 문제는 기술의 발달과 함께 지속적으로 제기되고 있는 문제이며, 친환경 에너지 자원은 지속가능한 기술의 발전을 위해 중요하기 때문에 친환경 에너지의 다양한 활용과 개발 사례를 조사함으로써 우리의 생활에서 친환경 에너지의 필요성을 인식하도록 하는데 주안점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가03-11","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"에너지와 관련된 문제를 발견하고 창의적인 해결방안을 탐색하여 실현하고 평가한다."},{"교":"실과(기술⋅가정)","c":"9기가03-12","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"다양한 수송 수단과 물류 체제를 이해하고 발달과정 및 특징과 혁신적인 활용 사례를 조사하여 수송 분야의 발달을 전망한다.","h":["이 성취기준은 현대 사회가 내연기관뿐 아니라 다양한 형태의 동력 발생 장치를 이용한 수송 수단을 활용하고 있으며, 자율주행 기술로 인해 물류가 자동화되면서 수송기술의 중요성이 더욱 강조되고 있으므로 육상, 해상, 항공우주 분야의 혁신적인 수송 장치와 물류 시스템을 이해하고 이를 활용하는 방안을 종합적으로 살펴봄으로써 미래 수송 분야의 발달을 예측할 수 있도록 하는데 주안점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가03-13","과":"기술⋅가정","학":"중1~3","영":"기술적 문제해결과 혁신","p":"수송 수단 및 물류 체제와 관련된 문제를 이해하고 해결방안을 탐색하여 실현하고 평가한다."},{"교":"실과(기술⋅가정)","c":"9기가04-01","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"건설기술의 개념 및 발달과정, 건설 구조물의 종류와 특성을 이해하고, 건설 구조물의 혁신사례를 탐구함으로써 건설기술의 중요성을 인식한다."},{"교":"실과(기술⋅가정)","c":"9기가04-02","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"건설 구조물의 종류에 따른 계획, 설계, 시공, 유지관리 방법을 탐구하고 건설과정의 중요성을 이해하며 건설 구조물의 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"9기가04-03","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"사용자 요구 및 주어진 환경과 조건을 충족하는 지속가능한 건설 구조물의 모형을 설계⋅제작 및 평가한다.","h":["이 성취기준은 주어진 환경과 조건에 따른 건설 구조물의 종류와 형태, 설계 및 시공 방법의 이해를 바탕으로 건설 구조물의 설계와 시공 방법을 기술적 문제 해결 과정을 통해 학습하기 위해 설정하였다."]},{"교":"실과(기술⋅가정)","c":"9기가04-04","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"전기⋅전자 부품의 종류와 기능을 이해하고 기능에 맞는 부품을 선택하여 문제를 해결하기 위한 간단한 회로를 구성하고 제작 및 평가한다.","h":["이 성취기준은 제어 및 자동화를 위해서는 전기⋅전자 부품을 이용한 회로 구성이 필수적인 요소이므로 주어진 문제를 해결할 수 있는 반도체를 포함한 전기⋅전자 부품들을 선택하고 이들의 회로 구성을 통해 액추에이터를 제어할 수 있는 학습이 되도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가04-05","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"정보통신과 인공지능 기술의 활용 사례를 탐구하고, 정보통신과 인공지능 기술이 우리 삶에 미치는 영향을 다양한 관점에서 평가한다.","h":["이 성취기준은 현대 사회에서 정보통신 기술이 다른 기술 영역과 융합하여 기술적 문제 해결 능력을 기를 기회를 제공하기 때문에 설정한 것이다. 또한, 인공지능 기술 발달에 따른 사회 문화적 영향을 이해하고, 이와 관련된 윤리적인 이슈를 다양한 관점에서 바라볼 수 있도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가04-06","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"정보통신과 인공지능 기술 관련 문제를 이해하고 해결 방안을 탐색, 실현, 평가함으로써 긍정적인 문제 해결 태도를 갖는다.","h":["이 성취기준은 빅데이터, 사물인터넷, 인공지능 기술을 비롯한 정보통신 관련 프로젝트 활동을 기반으로 관련 분야의 문제를 탐색하고 이를 해결할 수 있는 최적의 방안을 도출하며, 제품을 제작 및 평가, 피드백 하는 과정을 통해 정보통신과 인공지능 기술을 활용하는 역량을 키우는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"9기가04-07","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"기계의 구성 요소 및 동력 전달 장치의 종류와 특징을 이해하고, 작동 원리에 맞는 기계요소를 선택하여 평가한다.","h":["이 성취기준은 기계요소와 동력 전달 장치가 다양한 영역의 기술에 기초가 되므로 기계요소와 동력 전달장치의 종류와 특징을 이해하도록 설정하였다. 특히 다양한 체험활동을 통해 기계요소 및 동력 전달 장치의 종류와 특징을 이해하고, 자동화 및 로봇 등에 활용되는 기계요소와 동력 전달 장치를 바르게 선택하여 활용할 수 있는 역량을 신장할 수 있는 학습이 이루어지도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가04-08","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"다양한 기계요소와 동력 전달 방법을 활용하여 주어진 문제를 해결할 수 있는 운동 물체를 안전하게 제작하고 평가한다."},{"교":"실과(기술⋅가정)","c":"9기가04-09","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"로봇에 활용되고 있는 제어 및 자동화 기술 등을 탐구하여 간단한 로봇을 제작하고 평가함으로써 창조에 대한 자신감을 갖는다.","h":["이 성취기준은 우리 생활 주변에는 다양한 형태의 로봇이 있으며, 로봇은 인간의 삶을 보다 편리하게 영위할 수 있도록 도와주므로 학습자가 기술적 체험을 통해 로봇에 대한 이해가 필요하기 때문에 설정하였다. 다양한 전기⋅전자 부품, 기계요소와 동력전달 장치 등을 활용하여 제한된 조건을 해결할 수 있는 간단한 로봇(자동화 장치)을 설계, 제작, 평가할 수 있는 문제 해결 기반 프로젝트 학습이 이루어지도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가04-10","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"인간의 건강과 생명 연장을 위해 의료 분야에서 활용되는 생명기술 사례를 조사하고, 생명기술이 개인과 사회에 미친 영향을 평가한다.","h":["이 성취기준은 생명기술이 인간의 건강과 생명 연장을 위해 의공학의 발전과 신약 개발에 힘써왔다는 것에 대한 이해를 바탕으로 생명기술과 생명 윤리의 중요성을 인식할 수 있도록 설정한 것이다. 여기서는 생명기술의 발달과 생명기술 사례를 다양한 관점에서 탐구하며 그 영향에 대한 평가가 이루어질 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"9기가04-11","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"생명기술을 이해하며, 이와 관련된 문제의 해결 방안을 탐색, 실현, 평가하고, 생명 존중 및 윤리적 태도를 갖는다."},{"교":"실과(기술⋅가정)","c":"9기가04-12","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"기술적 문제에 대한 도전적 태도로 다양한 분야에 활용되고 있는 융합 기술의 사례를 탐구하고 미래의 기술 변화를 전망한다."},{"교":"실과(기술⋅가정)","c":"9기가04-13","과":"기술⋅가정","학":"중1~3","영":"지속가능한 기술과 융합","p":"긍정적이고 공감하는 문제 해결 태도를 바탕으로 지속가능한 발전과 혁신을 위해 융합 기술 문제를 해결하고 과정과 결과를 평가한다.","h":["이 성취기준은 우리 생활에 실제 이용되고 있는 기술 대부분은 다양한 지식이 융합되어 이용되며, 기술의 발전이 가속화됨에 따라 기술의 융합도 더욱 가속화되고 있음을 이해하고, 융합적 사고와 사용자 중심의 공감 및 긍정적 문제 해결 태도를 바탕으로 융합 프로젝트를 수행하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가01-01","과":"기술⋅가정","학":"고2~3","영":"생활문화와 디지털 환경","p":"지속되는 일상생활에서 가치 존중을 바탕으로 일상생활의 축적이 생활양식과 생활문화로 확장됨을 이해하고 새로운 생활문화를 제안한다.","h":["이 성취기준은 지속되는 일상 속 문화의 축적이 개인과 가족의 생활양식을 형성하고 이러한 생활양식이 사회와 공동체로 확대되어 생활문화로 이어짐을 이해하여 자신의 일상과 생활 문화와의 관계를 파악할 수 있도록 한다. 특히 무분별한 생활문화 답습에 대한 비판적 태도를 갖고 미래지향적 생활문화의 가치를 창조하는 방안을 탐색한다."]},{"교":"실과(기술⋅가정)","c":"12기가01-02","과":"기술⋅가정","학":"고2~3","영":"생활문화와 디지털 환경","p":"생활문화에 대한 문화감수성을 바탕으로 한국 의식주 생활문화의 독창적 요소를 탐색하고, 다른 나라의 생활문화를 비교⋅분석한다.","h":["이 성취기준은 한국의 의식주 생활문화가 발전되어온 역사를 인식하여 독창성을 파악하고 다른 나라의 생활문화를 탐색하는 과정에서 다양한 생활문화를 수용하는 문화 감수성을 높일 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가01-03","과":"기술⋅가정","학":"고2~3","영":"생활문화와 디지털 환경","p":"식생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 식생활 문제를 개선하고 건강한 식생활 문화를 실천한다.","h":["이 성취기준에서 미래 식량으로서 다양한 식생활 유형(대체식품 활용, HMR(Home Meal Replacement), 저탄소 식생활 등)과 그 의미를 탐색한다. 또한, 푸드테크가 식품산업에 ICT기술과 AI 기반 식생활 관리와 접목되어 생산, 가공, 유통, 서비스까지 전 범위에 걸쳐 변화를 이끌며 식생활 문제와 관련된 건강, 위생, 안전의 문제에 깊이 관여하고 있다는 것을 인식할 수 있도록 한다. 더불어 미래 식량과 푸드테크의 장⋅단점을 분석하여 실생활에 적용할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가01-04","과":"기술⋅가정","학":"고2~3","영":"생활문화와 디지털 환경","p":"의생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 삶의 질을 높이며 지속가능한 의생활 문화를 제안한다.","h":["이 성취기준은 의생활에 적용되어 삶의 질을 높일 수 있는 다양한 지능형 의류의 유형들을 탐색한다. 또한 메타 패션은 디지털 기술을 이용해 이미지나 동영상으로 제작한 디지털 패션 산업을 뜻하며 지속가능한 의생활문화로 개선될 수 있는 방안을 제안하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가01-05","과":"기술⋅가정","학":"고2~3","영":"생활문화와 디지털 환경","p":"주생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 안전한 주생활 문화를 영위하는 방안을 제안한다.","h":["이 성취기준은 디지털 환경이 확대됨에 따라 주생활에 적용된 다양한 기술(유비쿼터스 주거, 주거와 사물인터넷 등)들을 탐색하고 장⋅단점을 분석하여 안전한 주생활 문화와 관련된 인식을 높일 수 있도록 지도한다."]},{"교":"실과(기술⋅가정)","c":"12기가02-01","과":"기술⋅가정","학":"고2~3","영":"소비자와 생활복지","p":"저출생⋅고령사회에서 생활 설계의 필요성을 인식하고, 전 생애에 걸친 안정적인 삶을 준비하기 위한 생활을 설계한다.","h":["이 성취기준은 저출생⋅고령사회의 생활을 예측해보고, 생애주기적 관점과 가족생활주기 관점에 따라 건강, 가족 관계, 자녀 교육, 경제 등의 생활 설계 요소를 고려하여 균형 있는 생활을 설계하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가02-02","과":"기술⋅가정","학":"고2~3","영":"소비자와 생활복지","p":"경제적 자립의 태도를 갖추기 위해 개인과 가족의 상황에 맞는 가계 재무 설계의 필요성을 이해하고, 가정경제 관리 방안을 계획한다.","h":["이 성취기준은 경제적 자립을 위한 목표를 설정하고 자산이 가지는 의미를 파악하여 이를 형성할 수 있는 다양한 방법을 비판적으로 분석하도록 한다. 개인과 가족의 전 생애에 걸친 수입과 지출의 균형을 고려하여 가계 재무를 설계하고 평가한다."]},{"교":"실과(기술⋅가정)","c":"12기가02-03","과":"기술⋅가정","학":"고2~3","영":"소비자와 생활복지","p":"소비자의 안전을 위협하는 다양한 문제를 비판적으로 성찰하여 소비자 시민성을 반영한 소비생활을 실천한다.","h":["이 성취기준은 학생이 경험하는 생활환경(가족, 학교, 지역사회 등) 전반에서 소비로 인해 발생할 수 있는 안전 문제를 파악하도록 한다. 또한 소비자의 역할이 책임과 권리에만 집중되지 않고 공공의 선을 위한 참여 및 실천 의식을 가질 수 있도록 소비자 시민성을 함양한다."]},{"교":"실과(기술⋅가정)","c":"12기가02-04","과":"기술⋅가정","학":"고2~3","영":"소비자와 생활복지","p":"생활복지서비스와 일상생활에서 생성되는 빅데이터 적용의 의미를 파악하고 이를 활용하여 생활에 적용할 수 있는 새로운 복지 방안을 제안한다.","h":["이 성취기준은 빅데이터가 생활과 복지 분야에 활용되는 현황을 파악하고 이를 활용하여 새로운 복지에 관한 아이디어를 창출하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가02-05","과":"기술⋅가정","학":"고2~3","영":"소비자와 생활복지","p":"개인 및 가족의 생애 주기에 따른 맞춤형 스마트 복지 현황을 파악하고 자신이 설정한 삶의 목표 실현에 적용할 수 있는 복지서비스 정책을 제안한다.","h":["이 성취기준은 빅데이터(워드클라우드 등의 도구)를 활용하여 복지 사각지대를 파악하고 개인과 가족이 전 생애에 걸쳐 활용할 수 있는 시민 참여형 복지 정책을 제안한다."]},{"교":"실과(기술⋅가정)","c":"12기가03-01","과":"기술⋅가정","학":"고2~3","영":"인간과 성장하는 관계","p":"성년기의 성과 사랑에 관하여 탐구하고, 성인으로서의 독립과 자신과 타인을 보호하는 건강한 관계 맺기의 의미를 추론한다.","h":["이 성취기준은 성년기 발달과업인 성인으로서의 독립과 새로운 가족의 형성을 이해하기 위하여 자아에 대한 이해 및 성숙, 독립된 타인에 대한 존중이 바탕이 되는 성과 사랑에 대하여 이론적인 탐색을 바탕으로 다양한 관점에서 성찰하도록 한다. 또한, 성년기 타인과의 건강한 관계가 가지는 중요성과 가치를 이해하고 자신과 타인의 주체성과 독립성을 인정하는 관계 맺기를 통해 자신과 타인을 보호할 수 있음을 인식하도록 하고, 특히 디지털 상에서의 관계 맺기에서도 사이버 공간에서의 폭력이 발생하지 않도록 서로 간의 존중과 보호가 전제되어야 하는 사실을 알게 한다."]},{"교":"실과(기술⋅가정)","c":"12기가03-02","과":"기술⋅가정","학":"고2~3","영":"인간과 성장하는 관계","p":"부모됨의 의미를 성찰하고 건강한 임신과 출산의 방안을 탐색하여 책임 있는 부모가 되기 위해 필요한 역량을 탐색한다.","h":["이 성취기준은 부모됨의 의미와 관련하여 우리 사회의 고정 관념에 대한 배경과 맥락을 이해하고 남녀 공동의 주체적인 선택에 따른 건강한 임신과 출산의 방안을 탐색하여 부부가 함께 준비하는 책임 있는 부모에게 필요한 역량을 탐색한다."]},{"교":"실과(기술⋅가정)","c":"12기가03-03","과":"기술⋅가정","학":"고2~3","영":"인간과 성장하는 관계","p":"가족 내 소통과 협력의 태도를 기르기 위하여 중년기와 청소년기의 발달 특성을 인식하고 차이와 공통점을 탐구하여 자신과 가족의 생활에 적용한다.","h":["이 성취기준은 중년기의 신체적, 인지적, 사회⋅정서적 발달 특성을 인식하여 중년기가 생의 절정이기도 하지만 위기의 시기일 수도 있음을 이해하도록 하며, 질풍노도와도 같은 청소년기에 반영된 자신의 발달상의 특성과 비교하며 자신과 부모에 대한 이해를 높여 가족 관계의 향상을 도모한다."]},{"교":"실과(기술⋅가정)","c":"12기가03-04","과":"기술⋅가정","학":"고2~3","영":"인간과 성장하는 관계","p":"후반기 인생 설계의 중요성과 웰다잉의 의미 탐색을 위하여 노년기의 발달 특성을 이해하며 노년기 삶의 존중 및 나이듦에 대한 긍정적 인식을 함양하고, 유니버설디자인의 배경과 맥락을 파악하여 노년기 생활에 적용할 수 있는 방안을 탐구한다.","h":["이 성취기준은 인간의 평균 수명 연장으로 개인이 경험하는 노년기의 의미가 매우 중요해졌음을 인식하고 노년기 발달 특성을 탐색하여 세대 간 이해를 높인다. 후반기 인생 설계에 대한 기초 개념을 가질 수 있도록 하여 웰다잉(well dying)의 의미를 탐색하도록 한다. 또한, 유니버설 디자인과 디지털 기기 및 서비스 이용을 통해 노년기의 생활자립과 생활의 질을 향상시키는 요소를 분석한다."]},{"교":"실과(기술⋅가정)","c":"12기가03-05","과":"기술⋅가정","학":"고2~3","영":"인간과 성장하는 관계","p":"가족생활에서 발생하는 다양한 위기의 회복과 치유 방안을 탐색하고 회복탄력성을 발휘하여 성장하는 방안을 추론한다.","h":["이 성취기준은 가족생활에서 발생하는 다양한 위기(가족의 관계 단절, 가족 해체, 상실, 신체적⋅정신적 질병, 경제적 위기 등)를 부정적으로 받아들이기보다는 회복탄력성 발휘를 통하여 회복과 치유의 과정에서 더 성장하는 기회로 삼을 수 있도록 하는 방안을 찾도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가04-01","과":"기술⋅가정","학":"고2~3","영":"공학의 기초","p":"공학이 발달해 온 역사와 공학의 세계를 탐구하는 과정에서 공학의 가치를 인식하고, 미래 사회를 예측한다.","h":["이 성취기준은 인류 문명과 더불어 공학이 발달해온 과정과 공학의 발달이 사회, 문화, 역사 등의 변화에 미친 영향을 이해하는 과정에서 공학의 중요성과 가치를 인식하고, 미래의 공학을 예측하는 활동을 통해 공학 연구와 실천의 가치관 함양에 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12기가04-02","과":"기술⋅가정","학":"고2~3","영":"공학의 기초","p":"공학의 개념을 정의하고 공학의 설계 과정을 이해하며, 공학의 혁신 사례를 조사하여 공학의 가치를 인식한다.","h":["이 성취기준은 공학의 특징을 바탕으로 사용자 요구 확인-공학적 문제 정의-아이디어 창출-최적의 아이디어 평가 – 구체적 계획 및 설계 - 실행 - 평가로 이루어지는 공학적 문제해결 과정 절차를 이해하며, 공학의 혁신 사례를 통해 공학이 우리 삶에 미친 영향을 분석한다."]},{"교":"실과(기술⋅가정)","c":"12기가04-03","과":"기술⋅가정","학":"고2~3","영":"공학의 기초","p":"기술, 수학, 과학, 예술 등과 융합하여 공학이 발전된 사례를 분석하여 공학의 융합적 특성과 중요성을 이해한다.","h":["이 성취기준은 공학이 기술, 수학, 과학, 예술 등 다양한 영역의 지식과 융합하여 생활 속 공학적 문제를 해결하며 발전해왔다는 것을 인식하는 데 초점을 둠으로써 실생활의 문제를 해결 과정에서 공학의 융합적 특성이 중요함을 강조한다."]},{"교":"실과(기술⋅가정)","c":"12기가04-04","과":"기술⋅가정","학":"고2~3","영":"공학의 기초","p":"공학적 문제해결 사례를 통해 창의성, 팀워크, 의사소통 역량과 같은 공학적 소양의 중요성과 필요성을 인식한다.","h":["이 성취기준은 공학자가 공학적 문제를 해결하기 위해 창의성, 팀워크, 리더십, 효율적인 의사소통 능력이 중요하다는 것을 강조하기 위한 것으로, 구체적인 공학 문제해결 사례 분석을 통해 공학적 소양의 필요성과 중요성을 이해하도록 하는데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12기가04-05","과":"기술⋅가정","학":"고2~3","영":"공학의 기초","p":"다양한 공학 분야를 탐색하여 공학자의 역할을 이해하고, 자신의 흥미, 적성, 능력에 맞는 공학 분야의 진로를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12기가05-01","과":"기술⋅가정","학":"고2~3","영":"미래를 여는 공학 혁신","p":"공학적 문제를 해결하기 위한 아이디어 시각화 과정에서 제도의 기본 규칙에 대한 이해를 바탕으로 컴퓨터를 이용한 디지털 기반의 설계를 적용하며, 아이디어 시각화를 통한 의사소통의 중요성을 인식한다.","h":[", [12기가05-02] 이 성취기준은 공학적 문제를 해결하는 과정에서 아이디어 시각화를 통한 의사소통의 중요성 이해에 초점이 있다. 특히, 디지털 기반 설계에서도 학생들이 아이디어를 창출하는 과정에서 이루어지는 기본적인 스케치 방법과 제도의 기본적인 통칙(KS)을 학습할 수 있도록 하며, 최종적으로 디지털 기반의 설계를 통해 아이디어가 2D 혹은 3D로 구현되는 체험을 할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가05-02","과":"기술⋅가정","학":"고2~3","영":"미래를 여는 공학 혁신","p":"디지털 기반 설계 및 제조 과정을 이용해 공학적 문제를 해결할 수 있는 제품을 제작하고 산출물을 평가하는 과정에서 공학에 대한 도전적 태도를 기른다."},{"교":"실과(기술⋅가정)","c":"12기가05-03","과":"기술⋅가정","학":"고2~3","영":"미래를 여는 공학 혁신","p":"로봇의 구성 및 활용 사례를 바탕으로, 자동화를 위한 제어 장치의 활용 방법을 탐구하고 로봇을 제작하여 인공 세계와 공학 제품에 대한 호기심을 갖는다.","h":["이 성취기준은 로봇이 다양한 하드웨어와 소프트웨어로 구성되어 있다는 이해를 바탕으로 실생활에 활용되고 있는 사례를 조사하여 로봇이 우리 생활에 미치는 영향을 이해할 수 있도록 설정한 것이다. 여기서는 센서-마이크로 컨트롤러-액추에이터로 구성된 로봇을 제작함으로써 공학적 문제해결에 필요한 반복적인 성찰과 도전적 자세를 신장할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가05-04","과":"기술⋅가정","학":"고2~3","영":"미래를 여는 공학 혁신","p":"친환경 에너지의 종류와 원리, 활용 사례를 탐구하며, 에너지 전환과 관련된 공학적 문제를 해결하는 과정에서 창의적 자신감과 태도를 갖는다.","h":["이 성취기준은 인류의 지속가능한 발전을 위한 친환경 에너지의 종류와 원리를 이해하고, 전력, 난방, 운송 등 다양한 분야에 대한 에너지 전환의 중요성을 공감하는 것에 초점이 있다. 특히, 친환경 에너지, 스마트 그리드 등의 에너지 관련 공학적 문제를 해결하는 과정에서 창의적 태도와 문제해결에 대한 자신감이 신장되도록 체험 중심 활동이 이루어질 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가05-05","과":"기술⋅가정","학":"고2~3","영":"미래를 여는 공학 혁신","p":"첨단 수송수단 및 항공우주 분야에 사용되는 공학적 지식을 분석하고, 발달 현황 및 미래의 방안을 토의하고 발표하며, 첨단 수송수단 및 항공우주와 관련된 공학 문제를 창의적으로 해결한다.","h":["이 성취기준은 자율주행(운항)으로 대표되는 수송기술인 모빌리티와 항공우주 분야의 공학적 원리를 이해하고, 발전 방향을 예측하여 첨단 수송기술 분야의 공학적 발전을 파악하는 것에 초점이 있다. 특히, 모빌리티, 항공우주와 관련된 공학적 문제를 해결하는 과정에서 창의적 태도와 문제해결에 대한 자신감을 갖도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가06-01","과":"기술⋅가정","학":"고2~3","영":"지속가능한 융합 공학","p":"빅데이터, 사물인터넷, 인공지능 등 최신 기술을 통해 정보통신 공학을 이해하고, 정보통신 공학의 활용 사례를 탐구하여 정보통신 기술을 윤리적으로 활용하는 태도를 갖는다.","h":[", [12기가06-02] 이 성취기준은 정보통신과 관련된 공학적 문제를 해결하기 위하여 초연결사회를 대표하는 빅데이터, 사물인터넷, 인공지능 등의 기술 원리와 활용을 이해하며, 공학적 문제해결 과정을 통하여 그 해결방안을 선정하고 산출물을 제작하는 과정에서 공학적 문제해결의 중요성을 인식할 수 있도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12기가06-02","과":"기술⋅가정","학":"고2~3","영":"지속가능한 융합 공학","p":"초연결사회와 정보통신 관련 공학 문제를 공학적 문제해결 과정을 통해 해결하고, 산출물 평가를 통해 공학적 의사소통의 중요성을 인식한다."},{"교":"실과(기술⋅가정)","c":"12기가06-03","과":"기술⋅가정","학":"고2~3","영":"지속가능한 융합 공학","p":"스마트 도시 건설에 필요한 핵심 기술과 동향을 파악하며, 관련한 건설공학 문제를 창의적으로 해결하고 그 과정과 산출물을 평가한다."},{"교":"실과(기술⋅가정)","c":"12기가06-04","과":"기술⋅가정","학":"고2~3","영":"지속가능한 융합 공학","p":"생명공학이 인류의 식량자원 확보, 온실가스 배출감소, 생명 연장, 의공학의 발전에 기여할 수 있는 방안을 탐구하고, 생명공학과 관련된 문제를 창의적으로 해결하는 과정에서 공학의 가치를 인식한다.","h":["이 성취기준은 생명공학이 인류의 식량 자원 확보, 생명 연장, 친환경 에너지 자원 개발을 위하여 농업, 의료, 에너지 분야에 다양하게 활용되고 있으며, 다양한 분야의 지식과 융합하여 발전하고 있다는 것을 이해하는 데 초점이 있다. 또한 생명공학으로 인해 발생되는 문제점과 윤리적 고려 사항을 학습하여 생명공학이 우리 삶에 미치는 영향을 균형 있게 살필 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12기가06-05","과":"기술⋅가정","학":"고2~3","영":"지속가능한 융합 공학","p":"다양한 지식과 융합된 공학의 세계를 탐구하고 융합 공학 문제를 해결하며, 그 과정에서 공학에 대한 긍정적 태도와 공학 윤리 실천의 중요성을 인식한다.","h":["이 성취기준은 다양한 영역의 지식을 융합하여 공학적 문제를 해결한 융합공학 사례를 탐색하는 과정에서 공학에 대한 긍정적 태도를 가지고 공학 윤리 실천의 중요성을 인식하도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12로봇01-01","과":"로봇과 공학세계","학":"고2~3","영":"로봇의 이해","p":"로봇의 공학적 특성과 구성을 이해하고, 융합공학으로서의 로봇을 탐구하여 로봇에 대한 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12로봇01-02","과":"로봇과 공학세계","학":"고2~3","영":"로봇의 이해","p":"로봇 하드웨어와 소프트웨어의 탐구를 통해 로봇의 작동 원리를 이해하고 간단한 로봇을 제작하여 로봇에 대한 흥미와 자신감 및 도전 의식을 갖는다.","h":["이 성취기준은 로봇을 구성하는 하드웨어와 인공지능 기술을 포함하는 소프트웨어의 기초 원리를 이해하고 하드웨어와 소프트웨어를 결합하여 간단한 로봇을 만들어 볼 수 있도록 하는 데 중점을 둔다. 특히 전기⋅전자⋅기계요소를 포함하는 마이크로 컨트롤러를 활용한 하드웨어 구성과 코딩프로그램을 포함하는 소프트웨어를 활용한 제어 알고리즘을 해석하여 로봇의 동작 원리를 이해하고 로봇 프로젝트를 위한 기본적인 능력을 기르도록 한다."]},{"교":"실과(기술⋅가정)","c":"12로봇01-03","과":"로봇과 공학세계","학":"고2~3","영":"로봇의 이해","p":"로봇의 활용 분야를 이해하고 생활 속 다양한 로봇 활용 분야를 탐구하여 로봇 개발과 활용에 대한 긍정적인 사고를 함양한다.","h":["이 성취기준은 산업용, 의료용, 교육용, 서비스용, 재난구호용 등 일상에서 활용되는 생활 속의 로봇을 중심으로 조사하고 탐색하여 로봇 개발과 활용에 대한 창의적인 사고를 기르도록 한다."]},{"교":"실과(기술⋅가정)","c":"12로봇01-04","과":"로봇과 공학세계","학":"고2~3","영":"로봇의 이해","p":"인공지능 기술을 활용한 로봇의 특징과 문제점을 조사⋅분석하고 이를 통해 로봇 개발 및 활용에 대한 바람직한 윤리의식을 함양한다.","h":["이 성취기준은 인공지능 기술에 대하여 이해하고 이를 접목한 로봇의 활용에 따른 장⋅단점을 분석하여 미래 로봇 개발과 활용에 대한 바람직한 윤리의식을 함양하는데 초점이 있다."]},{"교":"실과(기술⋅가정)","c":"12로봇02-01","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"제조 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다.","h":["~[12로봇02-06] 이 성취기준은 제조 분야 공학(기계, 정밀기계, 기계설계, 신소재, 생산기계, 메카트로닉스 공학과 등), 건설 분야 공학(건축, 토목, 건설공학과 등), 생명⋅환경 분야 공학(바이오, 생명, 환경공학과 등), 에너지⋅수송 분야 공학(신재생에너지, 자동차, 우주항공학과 등), 정보통신 및 인공지능 기술 분야 공학(전기, 전자, 정보통신, 컴퓨터 공학과 등) 등에서 공학에 대한 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야에서 활용되는 로봇의 종류와 기능을 조사⋅탐구하여 해당 분야의 문제를 해결하기 위한 공학적 원리를 찾아 발표하여 로봇 활용에 대한 가치와 태도를 함양하도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12로봇02-02","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"건설 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12로봇02-03","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"생명 및 환경 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12로봇02-04","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"에너지 및 수송 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12로봇02-05","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"정보통신 및 인공지능 기술 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12로봇02-06","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"기타 공학 분야의 개념과 특징을 이해하고 해당 분야에서 활용되는 로봇을 탐색하여 로봇 및 공학과 관련된 직업에 대한 흥미와 관심을 높인다."},{"교":"실과(기술⋅가정)","c":"12로봇02-07","과":"로봇과 공학세계","학":"고2~3","영":"공학세계의 탐색과 로봇의 활용","p":"공학의 각 분야에서 활용되는 로봇의 발전 방향을 조사⋅탐구하고, 로봇의 개발과 활용에 대한 바람직한 윤리의식을 기른다.","h":["이 성취기준은 미래의 공학 기술(반도체, 자율 주행 자동차, 드론, 우주탐사용 로봇, 심해저 탐사 로봇, 건설용 로봇, 구조 로봇 등) 및 로봇 기술을 이해하고, 미래 공학 및 로봇 활용에 대한 바람직한 윤리 의식을 함양하도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12로봇03-01","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"로봇공학 프로젝트 수행을 위하여 사용자 공감하기를 바탕으로 로봇공학 문제를 확인하고 정의한다.","h":["이 성취기준은 로봇공학 프로젝트 수행을 위하여 디자인 씽킹 과정에 따라 사용자의 요구 및 공감을 바탕으로 로봇공학 문제를 정의하고 아이디어를 탐색하도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12로봇03-02","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"로봇공학 프로젝트 수행 과정에서 로봇을 구성하는 하드웨어 및 관련 부품을 제어하는 소프트웨어의 특성을 이해하고, 정보를 수집하고 탐색한다."},{"교":"실과(기술⋅가정)","c":"12로봇03-03","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"로봇공학 프로젝트 수행을 위하여 로봇 제어의 원리를 이해하고, 관련 문제해결을 위한 소프트웨어 알고리즘을 구상한다.","h":["이 성취기준은 로봇 프로젝트에서 활용되는 전자 부품 및 센서에 대한 종류와 특징, 전기⋅전자회로의 구성, 액추에이터에 대한 전체적인 메카니즘을 이해하고 프로그램과 마이크로 컨트롤러를 활용하여 알고리즘을 작성해 볼 수 있도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12로봇03-04","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"로봇공학 프로젝트 문제해결을 위한 대안 선정, 제작, 작동을
