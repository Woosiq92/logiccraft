},{"교":"음악","c":"6음02-01","과":"음악","학":"초5~6","영":"감상","p":"음악을 듣고 음악의 요소를 감지하며 구별한다.","h":["이 성취기준은 감상곡의 음악 요소를 감지하여 구별하고 반응하는 능력을 기르도록 하기 위해 설정하였다. 음악을 들으며 악곡에 나타나는 여러 음악 요소를 감지하여 구별하고, 이를 노래, 악기, 신체, 언어, 그림 등의 다양한 방법으로 표현해보면서 이해하는 데 중점을 둔다."]},{"교":"음악","c":"6음02-02","과":"음악","학":"초5~6","영":"감상","p":"다양한 문화권의 음악을 듣고 음악적 특징과 음악의 간단한 구성을 인식한다.","h":["이 성취기준은 문화권에 따라 다양하게 나타나는 음악의 특징과 음악의 간단한 구성을 인식하도록 하기 위해 설정하였다. 우리나라를 비롯하여 여러 지역이나 나라의 다양한 음악을 듣고 음악의 간단한 구성과 전반적인 특징을 인식하여, 이를 평하기, 설명하기, 표현하기 등의 다양한 행동적 활동을 통해 나타내 보는 데 중점을 둔다."]},{"교":"음악","c":"6음02-03","과":"음악","학":"초5~6","영":"감상","p":"다양한 종류의 음악을 듣고 음악의 배경과 활용을 설명한다.","h":["이 성취기준은 음악의 내적 측면과 외적 측면을 균형 있게 파악하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악의 쓰임과 배경을 이해하고 건강, 행사, 환경 등 학습자의 생활과 관련된 다양한 음악의 활용에 대하여 폭넓게 학습하여 이를 설명할 수 있도록 하는 데 중점을 둔다."]},{"교":"음악","c":"6음02-04","과":"음악","학":"초5~6","영":"감상","p":"생활 속에서 음악을 찾아 들으며 아름다움을 느끼고 공감한다.","h":["이 성취기준은 생활 속에서 접하는 다양한 음악의 아름다움을 인식하고 공감하는 능력을 기르도록 하기 위해 설정하였다. 국악, 서양음악, 대중음악, 세계음악 등 생활 속에서 접할 수 있는 다양한 음악에 관심을 가지고 스스로 찾아 들으며, 음악에 대한 느낌을 여러 방식으로 표현할 수 있는 데 중점을 둔다."]},{"교":"음악","c":"6음02-05","과":"음악","학":"초5~6","영":"감상","p":"우리나라 음악 문화유산을 찾아 듣고 국악의 가치를 인식한다.","h":["이 성취기준은 우리나라 음악 문화유산의 경험을 바탕으로 국악의 가치를 인식하도록 하기 위해 설정하였다. 무형문화재에 대한 이해를 바탕으로 시도 무형문화재, 국가 무형문화재로 지정된 음악 문화유산을 찾아 들어보고 음악적⋅문화적 의미를 이해하여 국악의 가치를 인식하는 데에 중점을 둔다."]},{"교":"음악","c":"6음03-01","과":"음악","학":"초5~6","영":"창작","p":"느낌과 아이디어를 떠올려 여러 매체나 방법으로 자신감 있게 표현한다.","h":["이 성취기준은 음악 창작의 소재로서 느낌과 아이디어를 발산해 내고 이를 음악으로 표현하며 음악적 상상력과 자신감을 기르도록 하기 위해 설정하였다. 자신의 경험과 관련된 다양한 느낌과 아이디어를 떠올려 그림, 기호, 언어 등을 활용하여 기록하고, 목소리, 악기, 물체, 신체, 디지털 매체 등을 통해 새롭게 표현해 보도록 하는 데 중점을 둔다."]},{"교":"음악","c":"6음03-02","과":"음악","학":"초5~6","영":"창작","p":"기초적인 기보를 활용하여 간단한 조건에 따라 악곡의 일부를 바꾼다.","h":["이 성취기준은 음악적 약속으로서 통용되는 기초 기보를 이해하고 이를 활용한 음악 창작 능력을 기르도록 하기 위해 설정하였다. 음이름, 계이름, 율명을 익히고 음악을 기록하는 오선보나 정간보 등의 기보 방법을 기초적 수준에서 이해하여 주어진 조건에 따라 노랫말, 말붙임새 등 악곡의 일부를 바꾸어 기보해본다. 또한 이를 통한 느낌이나 생각을 공유하는 데 중점을 둔다."]},{"교":"음악","c":"6음03-03","과":"음악","학":"초5~6","영":"창작","p":"음악의 요소를 활용하여 간단한 음악을 만든다.","h":["이 성취기준은 음악에서 음악 요소의 의미와 효과를 이해하고 이를 활용하여 음악을 창작하는 능력을 기르도록 하기 위해 설정하였다. 음악 요소의 특징이 드러나는 짧고 단순한 형태의 음악을 간단한 기보, 프로그램, 매체 등을 활용하여 스스로 혹은 협력적으로 만들며 서로의 음악적 산출물을 공유해 보는 데 중점을 둔다."]},{"교":"음악","c":"6음03-04","과":"음악","학":"초5~6","영":"창작","p":"생활 주변 상황이나 이야기를 활용하여 음악을 만들며 열린 태도를 갖는다.","h":["이 성취기준은 학생들의 실제 생활과 경험을 토대로 음악 창작과 삶을 연계하여 음악에 대한 긍정적인 태도를 기르도록 하기 위해 설정하였다. 주변의 다양한 상황이나 이야기를 소재로 음악적 아이디어를 끌어내어 간단한 음악극이나 음악 영상 등으로 함께 만들어 나눔으로써 서로의 음악에 대한 열린 태도를 갖고 소통하는 데 중점을 둔다."]},{"교":"음악","c":"9음01-01","과":"음악","학":"중1~3","영":"연주","p":"다양한 주법과 표현 기법을 향상시켜 노래나 악기로 개성 있게 연주한다.","h":["이 성취기준은 노래 부르기와 악기 연주의 음악 표현 활동을 위한 기능을 보다 확장 및 향상시키기 위해 설정하였다. 목소리와 악기의 다양한 주법이나 국악, 서양음악, 대중음악, 세계음악 등 음악 고유의 표현 기법을 익히고 향상시켜 아름답고 풍부한 소리로 개성 있게 연주하도록 한다. 또한 자신의 연주 역량을 향상시키기 위하여 스스로 연습하고 그 과정을 주도적으로 관리하는 태도를 형성하는 데 중점을 둔다."]},{"교":"음악","c":"9음01-02","과":"음악","학":"중1~3","영":"연주","p":"음악 요소와 음악적 특징을 살려 노래나 악기로 발표하고 평한다.","h":["이 성취기준은 악곡의 다양한 음악 요소와 음악적 특징을 파악하여 노래나 악기 연주 활동에 적용하도록 하기 위해 설정하였다. 악곡에서 드러나는 특성들을 살려 연주하고, 나아가 자신들의 연주 활동을 돌아보며 다양한 관점에서 서로 평해 봄으로써 공동체 속에서 음악으로 소통하는 데 중점을 둔다."]},{"교":"음악","c":"9음01-03","과":"음악","학":"중1~3","영":"연주","p":"소리의 상호작용을 인식하고 매체를 활용하여 함께 표현한다.","h":["이 성취기준은 다양한 양상으로 나타나는 소리의 상호작용을 이해하고 함께 하는 음악 표현의 즐거움을 경험하도록 하기 위해 설정하였다. 목소리, 악기, 신체, 물체, 가상 악기 등 연주에 사용되는 다양한 매체를 활용하여 여러 양상으로 나타나는 소리의 어울림을 이해하고, 이를 바탕으로 다른 사람과 함께 연주 활동을 해봄으로써 협력적 음악 표현을 경험할 수 있도록 하는 데 중점을 둔다."]},{"교":"음악","c":"9음01-04","과":"음악","학":"중1~3","영":"연주","p":"생활 속 다양한 형태의 연주에 참여하고 전통과 현대의 연주 문화 다양성을 인식한다.","h":["이 성취기준은 학생들이 생활 속 연주 활동에 주도적으로 참여하여 다양한 연주 문화를 인식하도록 하기 위하여 설정하였다. 학교, 마을, 지역의 행사나 축제에 온⋅오프라인 네트워크를 활용하여 다양한 형태의 연주를 계획하거나 참여할 수 있도록 한다. 이를 통해 국악, 서양음악, 대중음악, 세계음악 등 전통에서 현대까지 다양하게 변화⋅발전하는 연주 문화를 인식하고 생활 속에서 주도적으로 음악 활동에 참여하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"9음02-01","과":"음악","학":"중1~3","영":"감상","p":"음악을 듣고 다양한 음악 요소에 집중하여 분석한다.","h":["이 성취기준은 감상곡에 포함된 다양한 음악 요소 분석을 통해 악곡을 이해하는 능력을 함양하도록 하기 위해 설정하였다. 악곡 감상을 통해 음악 요소들이 음악으로 구현된 양상을 찾아내고 이를 여러 가지 방법으로 설명하거나 표현하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"9음02-02","과":"음악","학":"중1~3","영":"감상","p":"다양한 시대와 문화권의 음악을 듣고 음악적 특징과 음악의 구성을 파악한다.","h":["이 성취기준은 감상곡의 음악 내적 특징과 악곡의 전반적인 구성을 인식하고 파악하는 능력을 기르도록 하기 위해 설정하였다. 다양한 종류의 음악을 듣고 시대별⋅문화권별 음악의 특징과 전반적 구성을 설명하거나 표현하는 데 중점을 둔다."]},{"교":"음악","c":"9음02-03","과":"음악","학":"중1~3","영":"감상","p":"다양한 시대⋅사회⋅문화권의 음악을 듣고 음악의 배경과 역할을 비교한다.","h":["이 성취기준은 다양한 시대, 사회, 문화권을 기반으로 한 음악의 외적 배경과 역할을 이해하여 음악 감상 활동과 연계하는 능력을 기르도록 하기 위해 설정하였다. 음악의 다양한 활용이나 배경을 시대⋅사회⋅문화적 맥락에서 조사하여 비교함으로써, 사회⋅문화 속에서 음악이 갖는 다양한 의미와 역할 등을 파악하는 데 중점을 둔다."]},{"교":"음악","c":"9음02-04","과":"음악","학":"중1~3","영":"감상","p":"생활 속에서 음악을 들으며 다양한 감성과 가치를 인식하고 존중한다.","h":["이 성취기준은 생활 속 다양한 음악 감상 활동을 통해 음악적 감수성을 기르고 이를 내면화⋅가치화하는 태도를 형성하도록 하기 위해 설정하였다. 여러 매체를 활용하여 생활 속에서 음악을 찾아 들으며 다양한 느낌과 정서를 경험하고 이를 공유함으로써 음악에 대한 서로 다른 감성과 가치를 인식하고 존중하는 데 중점을 둔다."]},{"교":"음악","c":"9음02-05","과":"음악","학":"중1~3","영":"감상","p":"유네스코에 등재된 우리나라의 음악 문화유산을 찾아 듣고, 세계 속 국악의 위상과 문화적 가치를 인식한다.","h":["이 성취기준은 유네스코에 등재된 음악 문화유산을 찾아 들어보고, 세계 속 국악의 문화적 가치를 인식하도록 하기 위해 설정하였다. 유네스코 무형문화유산으로 등재된 국악을 경험하고 우리 전통문화의 고유성을 이해하며, 국악이 지닌 문화적 가치와 세계 속의 국악의 위상을 인식하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"9음03-01","과":"음악","학":"중1~3","영":"창작","p":"음악적 의도나 아이디어를 여러 매체나 방법에 적용하여 자기 주도적으로 창작한다.","h":["이 성취기준은 음악적 의도나 아이디어를 독창적으로 사고하고 자유롭게 발산하는 능력을 기르도록 하기 위해 설정하였다. 음악의 소재나 주제에 따라 아이디어를 떠올려 보고, 창작에 사용되는 다양한 매체를 활용하여 노래나 연주, 신체표현 등 자신이 표현하고자 하는 방식으로 나타낼 수 있도록 주도적으로 계획하고 창작하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"9음03-02","과":"음악","학":"중1~3","영":"창작","p":"오선보, 정간보 등의 기보법을 활용하여 조건에 따라 악곡의 일부를 바꾼다.","h":["이 성취기준은 다양한 기보법에 대한 이해를 바탕으로 음악 창작 능력을 기르도록 하기 위해 설정하였다. 음악 표현과 소통을 위한 기보의 필요성을 인식하고, 오선보나 정간보 등 기존의 기보법과 앱이나 프로그램 등 다양한 소프트웨어를 활용하여 음악 요소나 주제 등의 조건에 따라 악곡의 일부를 변형하며 새롭게 만들어보는 데 중점을 둔다."]},{"교":"음악","c":"9음03-03","과":"음악","학":"중1~3","영":"창작","p":"음악의 요소와 특징을 활용하여 간단한 형식의 음악을 만든다.","h":["이 성취기준은 창작에 필요한 음악 요소를 활용하여 자신이 의도한 음악적 특징이 드러나도록 국악, 서양음악, 대중음악 등 간단한 형식의 음악으로 표현하는 능력을 기르도록 하기 위해 설정하였다. 혼자 또는 여럿이 창작 의도에 따라 음악 요소를 선택하고 구조화하여 간단한 형식의 음악을 만들어 공유함으로써 음악으로 소통하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"9음03-04","과":"음악","학":"중1~3","영":"창작","p":"생활 속의 영역과 연계하여 음악을 만들고 활용하며 책임감을 갖는다.","h":["이 성취기준은 생활 속의 다양한 영역 및 타 교과와 연계하여 음악 산출물을 주체적으로 만들고 활용하며 창작과 관련된 윤리 의식과 책임감을 기르도록 하기 위해 설정하였다. 실생활과 관련된 음악 영상이나 음악극 등 여러 형태의 음악을 창작하고 활용하며 다양한 분야를 경험하도록 한다. 또한 음악 창작에서 저작권의 중요성과 필요성을 인식하여 자신과 타인의 음악 산출물에 대한 책임감 있는 태도를 형성함으로써 서로의 음악을 존중하고 소통하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음01-01","과":"음악","학":"고2~3","영":"연주","p":"다양한 주법과 표현 기법을 심화시켜 노래나 악기로 개성 있게 연주한다.","h":["이 성취기준은 노래나 악기 연주하기의 음악 표현 활동을 위한 기능을 보다 심화시키기 위해 설정하였다. 목소리와 악기의 다양한 주법이나 국악, 서양음악, 대중음악, 세계음악 등 음악 고유의 표현 기법을 심화시키고, 나아가 자신의 표현을 살려 개성 있게 연주하도록 한다. 또한 자신의 연주를 심화하기 위하여 스스로 연습하고 그 과정을 주도적으로 관리하는 태도를 형성하는 데 중점을 둔다."]},{"교":"음악","c":"12음01-02","과":"음악","학":"고2~3","영":"연주","p":"음악 요소와 음악적 특징의 변화를 살려 노래나 악기로 발표하고 비평한다.","h":["이 성취기준은 악곡의 다양한 음악 요소와 음악적 특징의 변화를 파악하여 노래나 악기 연주 활동에 적용하도록 하기 위해 설정하였다. 다양한 시대와 문화권의 악곡에서 드러나는 특성들을 살려 연주하고, 나아가 자신들의 연주 활동을 다양한 관점에서 함께 분석 및 비평하며 음악적 표현력과 소통하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12음01-03","과":"음악","학":"고2~3","영":"연주","p":"소리의 상호작용을 인식하고 다양한 매체를 적용하여 표현하며 연주로 소통한다.","h":["이 성취기준은 다양한 양상으로 나타나는 소리의 상호작용을 인식하여 연주로 표현함으로써 음악으로 소통하도록 하기 위해 설정하였다. 목소리, 악기, 신체, 물체, 가상 악기 등을 통해 나타나는 소리들의 상호작용을 인식하고, 연주에 사용되는 다양한 매체로 연주하도록 한다. 이를 통해 공동체 속에서 음악으로 협력하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12음01-04","과":"음악","학":"고2~3","영":"연주","p":"다양한 상황과 맥락을 고려하여 연주를 생활 속에서 실천하며 서로 다른 연주 문화를 존중한다.","h":["이 성취기준은 생활 속 다양한 연주 활동에 주도적으로 참여하며, 서로 다른 연주 문화를 비교 경험하고 존중하는 태도를 기르도록 하기 위해 설정하였다. 학교, 마을, 지역의 행사나 축제에 온⋅오프라인의 네트워크 형태로 참여하며 연주를 계획하거나 실천함으로써 다양한 연주 문화를 존중하도록 한다. 나아가 평생의 삶에서 공동체 발전을 위해 여러 상황과 문제에 관심을 가지고 연주 활동을 실천하는 태도를 기르도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음02-01","과":"음악","학":"고2~3","영":"감상","p":"음악을 듣고 다양한 음악 요소와 원리를 인지하며 분석한다.","h":["이 성취기준은 감상곡에 적용된 다양한 음악 요소와 원리를 파악하고 분석하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악을 들으며 음악을 구성하고 있는 요소와 원리에 대한 이해를 바탕으로 음악적 변화와 표현을 감지하고 분석하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음02-02","과":"음악","학":"고2~3","영":"감상","p":"다양한 시대⋅사회⋅문화권의 음악을 듣고 음악적 특징과 구성의 변화를 해석한다.","h":["이 성취기준은 시대, 사회, 문화권별 다양한 음악의 특성을 알아보며 음악 구성의 변화 양상을 이해하는 능력을 기르도록 하기 위해 설정하였다. 전통과 현대를 아우르는 다양한 시대, 사회, 문화권의 음악을 듣고, 서로 다른 음악적 특징과 전체적인 구성을 파악하여 해석하는 데 중점을 둔다."]},{"교":"음악","c":"12음02-03","과":"음악","학":"고2~3","영":"감상","p":"다양한 시대⋅사회⋅문화권의 음악을 듣고 맥락, 기능, 기여의 관점에서 비평한다.","h":["이 성취기준은 다양한 시대, 사회, 문화권 등에서 형성되어 온 음악의 의미와 가치를 맥락과 연계하여 폭넓게 이해하는 능력을 기르도록 하기 위해 설정하였다. 시대, 사회, 문화권에 따라 달라지는 음악의 맥락을 이해하면서 다양한 음악을 듣고 미적⋅문화적⋅사회적 의미와 기여에 대해 이해하며 비평한다. 이로써 음악의 내적 측면과 외적 맥락을 종합적으로 학습하고, 나아가 산업, 경제, 생태환경 등 미래 삶의 다양한 관점에서 그 음악의 기여와 공헌을 생각해 보도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음02-04","과":"음악","학":"고2~3","영":"감상","p":"생활 속에서 음악을 들으며 감성, 정체성, 가치를 내면화하고 향유한다.","h":["이 성취기준은 음악 감상을 통해 다양한 감성을 경험하고 가치를 인식하며 음악을 실생활에서 향유하는 태도를 기르도록 하기 위해 설정하였다. 주도적으로 음악을 찾아 들으며 자신의 음악적 정체성과 가치를 내면화하고, 평생의 삶에 걸쳐 다양한 관점에서 음악을 향유할 수 있는 태도를 기르도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음02-05","과":"음악","학":"고2~3","영":"감상","p":"시대별 국악을 듣고 비평하며, 국악을 계승⋅발전시키려는 태도를 갖는다.","h":["이 성취기준은 다양한 국악 감상을 통해 국악을 계승⋅발전시킬 수 있는 태도를 형성하도록 하기 위해 설정하였다. 다양한 시대의 국악을 듣고 전통부터 현대에 이르기까지 국악이 변화되어 온 양상을 살펴보고 비평하며, 전통 국악뿐만 아니라 현대에 창작된 국악에 대해 폭넓게 관심을 가지도록 한다. 생활 속에서 국악을 향유하는 방안을 모색하여 실천하고, 이를 통해 국악을 지속적으로 계승⋅발전시킬 수 있는 태도를 함양하는 데 중점을 둔다."]},{"교":"음악","c":"12음03-01","과":"음악","학":"고2~3","영":"창작","p":"다양한 맥락과 연계되는 음악적 의도나 아이디어를 여러 매체나 방법에 적용하여 창작하고 성찰한다.","h":["이 성취기준은 다양한 맥락과 연결 지어 새로운 음악적 의도나 아이디어를 자유롭게 발산할 수 있는 능력을 기르도록 하기 위해 설정하였다. 창작에 사용되는 다양한 매체를 활용하여 음악을 둘러싼 다양한 사회⋅문화⋅시대적 맥락을 바탕으로 자신의 의도에 따라 주도적으로 음악을 구성하고 성찰해 보도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음03-02","과":"음악","학":"고2~3","영":"창작","p":"오선보, 정간보 등의 다양한 기보법을 활용하여 주제에 맞게 악곡을 변화시킨다.","h":["이 성취기준은 다양한 기보법에 대한 이해와 실제를 바탕으로 음악을 변화시킬 수 있는 능력을 기르도록 하기 위해 설정하였다. 오선보나 정간보 등 기존의 기보법과 사보⋅작곡⋅연주⋅음향 편집 관련 소프트웨어, 음향적 변화나 효과 관련 기기 등을 다양하게 활용하여 음악을 창의적으로 변화시키는 방법을 이해하고, 주어진 주제에 맞게 편곡하는 데 중점을 둔다."]},{"교":"음악","c":"12음03-03","과":"음악","학":"고2~3","영":"창작","p":"음악 요소와 음악적 특징의 변화를 활용하여 다양한 형식의 음악을 만든다.","h":["이 성취기준은 창작에 필요한 음악 요소를 다양하게 변화시켜 자신이 의도한 음악적 특징이 드러나도록 여러 가지 형식의 음악을 창의적으로 만드는 능력을 기르도록 하기 위해 설정하였다. 혼자 또는 여럿이 창작 의도에 따라 음악 요소를 선택하고 다양한 악곡의 형식으로 구조화하여 음악을 만들어 공유함으로써 음악으로 소통하고 가치화하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12음03-04","과":"음악","학":"고2~3","영":"창작","p":"생활 속에서 여러 영역과 융합한 음악을 만들며, 저작권의 중요성 및 음악의 역할과 기여에 대하여 인식한다.","h":["이 성취기준은 예술, 체육, 인문, 과학 등 생활 속 여러 영역과 융합한 음악을 창작할 수 있는 능력과 창작자로서의 자질을 기르도록 하기 위해 설정하였다. 음악 창작을 중심으로 자신의 진로와 연관 지어 여러 영역과의 융합적 가능성을 탐색하고 이를 적용하여 음악극이나 음악 영상 등을 만들며 창작의 주체로 활동하도록 한다. 이 과정에서 저작권의 중요성과 사회 내에서 음악 창작이 갖는 역할과 기여에 대해 인식하며, 민주시민으로서 책임감 있는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12연창01-01","과":"음악 연주와 창작","학":"고2~3","영":"표현과 창작","p":"다양한 연주 형태, 형식, 장르, 양식의 악곡을 자신의 해석을 담아 바른 발성과 주법으로 연주한다.","h":["이 성취기준은 악곡에 담긴 고유한 음악적 특징을 자신만의 음악적 해석과 표현으로 연주하는 능력을 기르도록 하기 위해 설정하였다. 연주해야 할 악곡의 연주 형태, 형식, 장르, 양식에 따른 음악 요소와 특징을 분석하고 악곡에 어울리는 올바른 발성법이나 연주법을 익혀 자신만의 느낌과 표현으로 연주하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12연창01-02","과":"음악 연주와 창작","학":"고2~3","영":"표현과 창작","p":"음악적 의도를 음악 요소와 구조에 반영하고 적합한 기보법이나 매체를 활용하여 창작한다.","h":["이 성취기준은 자신의 창작 의도에 따라 작품의 방향을 결정하고 이에 적합한 기보법이나 매체를 활용하여 창작하는 능력을 기르도록 하기 위해 설정하였다. 작곡법, 편곡법 등 창작을 위한 음악 이론과 자신의 음악 경험을 바탕으로 음악 요소와 연주 형태, 형식, 장르, 양식 등을 구조화하고, 다양한 기보법이나 매체를 적절하게 활용하여 창작해 보는 데 중점을 둔다."]},{"교":"음악","c":"12연창01-03","과":"음악 연주와 창작","학":"고2~3","영":"표현과 창작","p":"음악에 대한 개인적⋅사회적 윤리의식을 갖추고 다양한 표현을 담아 공연을 구상하거나 발전시킨다.","h":["이 성취기준은 창작자와 연주자가 지켜야 할 올바른 공연 윤리를 바탕으로 창의적인 공연을 구상하고 발전시키는 능력을 기르도록 하기 위해 설정하였다. 저작권, 도덕성 등 창작자와 연주자가 지켜야 할 창작과 표현에 관한 개인적, 사회적 윤리의식에 대해 함께 알아보고, 참신한 아이디어와 다양한 표현을 바탕으로 공연을 계획하고 실제 공연 활동으로 발전시켜 보는 데 중점을 둔다."]},{"교":"음악","c":"12연창01-04","과":"음악 연주와 창작","학":"고2~3","영":"표현과 창작","p":"다양한 음악 문화의 공연 예절을 이해하고 서로의 음악 문화를 존중하며 배려하는 태도를 지닌다.","h":["이 성취기준은 사회⋅문화적 배경과 맥락 속에서 발달하여 온 다양한 공동체의 공연 예절을 이해하며 서로의 음악 문화를 존중하는 태도를 기르도록 하기 위해 설정하였다. 다양한 문화적 기반을 바탕으로 성장해 온 여러 공동체의 공연을 비교 감상하며 서로 다른 공연 문화와 예절을 이해하고, 실제 공연에 적용함으로써 음악의 문화적 다양성을 존중하고 배려하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12연창02-01","과":"음악 연주와 창작","학":"고2~3","영":"실천과 소통","p":"다양한 사회와 문화 속의 음악을 듣고, 연주와 창작 활동 양상을 해석하며 비평한다.","h":["이 성취기준은 다양한 사회, 문화 속에서 이루어지는 연주나 창작 활동의 현상이나 흐름을 균형 있게 해석하고 비평하는 능력을 기르도록 하기 위해 설정하였다. 다양한 사회, 문화, 공동체의 음악을 조사하고 감상해 보며, 생활 속에서 나타나는 연주와 창작 활동의 양상과 의미, 변화 과정을 다양한 주제와 관점으로 해석하고 비평해 봄으로써 음악을 미적으로 수용하고 소통하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12연창02-02","과":"음악 연주와 창작","학":"고2~3","영":"실천과 소통","p":"음악의 가치와 역할을 이해하여 연주 및 창작 활동에 능동적으로 참여한다.","h":["음악이 인간과 사회에 미치는 영향을 바탕으로 공동체를 위한 연주와 창작 활동에 자발적으로 참여하는 태도를 기르도록 하기 위해 설정하였다. 사회⋅문화적 맥락에 따라 나타나는 음악의 의미와 역할, 영향력을 인식하고, 이와 연계한 연주와 창작 활동을 통해 서로가 소통하는 즐거움을 경험하며 음악 활동에 능동적인 태도로 참여하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12연창02-03","과":"음악 연주와 창작","학":"고2~3","영":"실천과 소통","p":"다양한 소리와 매체, 음악적 아이디어를 연계하고 활용하여 공동체에 기여할 수 있는 공연을 기획한다.","h":["이 성취기준은 공연의 목적과 취지에 적합한 다양한 소리와 매체, 아이디어를 조합하여 음악을 통한 사회 참여를 경험하도록 하기 위해 설정하였다. 공연을 위해 다양한 음악적 아이디어, 악기와 매체의 필요성을 인식하고 효과적인 활용 방안을 탐구한다. 또한 공동체의 지속 가능한 음악 문화 발전에 두루 기여할 수 있는 주제, 대상, 방법 등을 포함하여 공연을 기획하고 만들어가도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12연창02-04","과":"음악 연주와 창작","학":"고2~3","영":"실천과 소통","p":"다양한 영역과 융합하고 협업하는 연주⋅창작 활동을 통해 서로 포용하는 태도를 갖는다.","h":["이 성취기준은 음악 활동과 예술, 과학 등 다양한 영역을 연결하고 협업하는 과정을 통해 서로의 분야를 이해하고 포용하는 태도를 가지도록 하기 위해 설정하였다. 음악 활동을 위한 내⋅외적 상황이나 환경 등을 고려하여 다른 영역과의 연계 가능성을 탐색하고, 함께 연주하거나 창작하며 생성되는 음악의 새로움과 다양성을 열린 마음으로 수용하고 서로를 존중하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12감비01-01","과":"음악 감상과 비평","학":"고2~3","영":"감상과 반응","p":"음악 요소와 악곡 구성의 원리를 이해하며 음악을 듣고 특징을 비교⋅분석하여 설명한다.","h":["이 성취기준은 음악적 이해를 바탕으로 악곡이 지닌 음악적 특징에 대한 자신의 느낌과 견해를 설명할 수 있는 음악적 감성을 기르도록 하기 위해 설정하였다. 음악 요소와 악곡 구성의 원리를 통해 나타나는 느낌과 정서를 인식하고, 감상을 통해 알게 된 바를 다양한 관점에서 비교하고 분석하며, 인지적 이해를 바탕으로 자신의 느낌을 설명하고 내면화하는 데 중점을 둔다."]},{"교":"음악","c":"12감비01-02","과":"음악 감상과 비평","학":"고2~3","영":"감상과 반응","p":"다양한 시대, 지역, 문화, 공동체의 음악을 집중하여 듣고 변화와 발전 양상을 파악한다.","h":["이 성취기준은 음악이 속한 시대와 사회의 다양성이 음악에 끼친 영향을 파악하고 관련성을 탐구하는 태도를 기르도록 하기 위해 설정하였다. 다양한 시대, 지역, 사회, 문화, 공동체 속 음악을 비교하여 들으며 음악이 파생되고 전개되어 온 배경과 요인을 파악하고 변화⋅발전되어 온 양상을 실제 악곡을 통해 탐구해 보도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12감비01-03","과":"음악 감상과 비평","학":"고2~3","영":"감상과 반응","p":"음악을 듣고 음악에 내재된 미적 특성을 수용⋅공감하며 다양한 방법으로 표현한다.","h":["이 성취기준은 음악을 들으며 음악의 미적 특성에 기반한 느낌을 다양한 방법으로 표현하는 능력을 기르도록 하기 위해 설정하였다. 음악을 듣고 악곡의 구조와 표현 속에 내재되어 있는 미적 특성을 수용하고 공감하도록 한다. 이를 통해 자신이 느낀 바를 말이나 글과 같은 언어적 표현, 동작이나 안무와 같은 신체적 표현, 색채나 그림과 같은 시각적 표현 등 다양한 방법으로 표현해 보도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12감비01-04","과":"음악 감상과 비평","학":"고2~3","영":"감상과 반응","p":"생활 속에서 음악을 찾아 들으며 자신의 음악적 취향을 발견하고, 감상 경험을 공유하며 상호 존중하는 태도를 갖는다.","h":["이 성취기준은 음악 감상 경험이 개인의 삶과 결합하여 만들어지는 음악적 취향을 바탕으로 음악 감상을 생활화하는 태도를 기르도록 하기 위해 설정하였다. 실생활의 음악 감상 경험 속에서 자신이 좋아하고 즐기는 음악의 특성을 통해 음악적 취향을 정립하고 감상 경험을 타인과 공유하며 서로의 음악적 취향을 존중하는 태도를 갖도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12감비02-01","과":"음악 감상과 비평","학":"고2~3","영":"비평과 활용","p":"사회⋅문화⋅시대적 의미, 음악적 특징, 맥락 등의 관점에서 음악을 듣고 비평한다.","h":["이 성취기준은 음악을 여러 관점과 맥락에서 종합적으로 감상하고 비평하는 능력을 기르도록 하기 위해 설정하였다. 사회⋅문화⋅시대적 배경, 음악적 특징, 맥락 등 다양한 관점에서 음악을 이해하고 자신만의 균형감 있는 자세와 관점으로 비평함으로써 음악을 통한 소통과 공감을 경험하는 데 중점을 둔다."]},{"교":"음악","c":"12감비02-02","과":"음악 감상과 비평","학":"고2~3","영":"비평과 활용","p":"사회, 문화, 산업 속의 음악을 듣고 음악의 역할과 필요성에 관해 토의하거나 토론한다.","h":["이 성취기준은 사회 속 다양한 영역에서 생활과 밀접하게 연결되는 여러 음악의 역할과 필요성에 대한 넓은 안목을 갖추도록 하기 위해 설정하였다. 사회, 문화, 산업 속에서 활용되는 다양한 종류의 음악을 듣고 음악의 사회적 기능과 역할, 필요성에 관해 함께 토의하거나 토론해 봄으로써 음악을 주제로 한 문제 인식과 해결 과정에 참여하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12감비02-03","과":"음악 감상과 비평","학":"고2~3","영":"비평과 활용","p":"생활 속 음악의 가치와 영향력을 이해하고 여러 분야와 연계하여 음악을 활용한다.","h":["이 성취기준은 생활 속에서 활용되는 음악의 가치와 영향력을 파악하고 음악을 다른 분야와 연계하며 다양하게 활용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 생활 주변의 다양한 상황에서 가치 있게 활용되는 음악 사례를 조사하고 발표하며 우리 삶 속에 미치는 음악의 영향력에 대해 알아보도록 한다. 이를 바탕으로 인문, 사회, 자연, 과학 등 생활과 관련된 다양한 분야와 연계하며 실생활에 음악을 활용하는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12감비02-04","과":"음악 감상과 비평","학":"고2~3","영":"비평과 활용","p":"감상자와 비평자의 관점에서 음악을 듣고 비평하며 삶 속에서 향유하는 태도를 갖는다.","h":["이 성취기준은 학생들이 감상자와 비평자의 관점에서 균형감 있게 음악을 감상하고 비평하며 삶 속에서 음악을 향유할 수 있도록 하기 위해 설정하였다. 감상자와 비평자의 입장뿐만 아니라 연주자의 입장 등 다양한 기준과 관점에서 음악을 감상하고 비평함으로써 음악의 특성을 포괄적이고 총체적으로 바라보며, 자신의 삶 속에서 음악을 적극적으로 즐기는 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12음미01-01","과":"음악과 미디어","학":"고2~3","영":"미디어 탐구","p":"음악에 활용되는 미디어의 종류와 특징을 조사하고 변화와 발전과정을 파악한다.","h":["이 성취기준은 음악에 활용되고 있는 미디어를 주도적으로 탐색함으로써 음악과 미디어를 창의적으로 융합하기 위한 기초를 형성하도록 하기 위해 설정하였다. 사보, 창작, 연주 등 음악의 다양한 영역에서 활용되고 있는 미디어의 역사, 종류, 특징 등을 조사하고 구체적인 사례를 찾아보도록 한다. 이를 통해 그 변화와 발전과정을 파악함으로써 음악과 미디어의 창의적 융합에 대해 깊이 있게 탐구하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음미01-02","과":"음악과 미디어","학":"고2~3","영":"미디어 탐구","p":"음악과 미디어의 관계를 분석하고 음악에 활용되는 미디어의 의미와 역할에 대해 토의하거나 토론한다.","h":["이 성취기준은 실제 사례와 작품을 중심으로 음악과 미디어의 관계를 분석함으로써 음악 미디어의 의미와 역할을 이해하도록 하기 위해 설정하였다. 연주, 창작, 감상 등 음악 활동에 활용되는 도구로서의 미디어, 영화⋅광고⋅애니메이션 음악 등 장르로서의 미디어 음악과 같이 다양한 사례를 통해 음악과 미디어의 관계를 분석한다. 또한 이를 바탕으로 토의하거나 토론하며 음악에서 미디어의 의미와 역할을 능동적으로 파악하는 데 중점을 둔다."]},{"교":"음악","c":"12음미01-03","과":"음악과 미디어","학":"고2~3","영":"미디어 탐구","p":"다양한 미디어 음악을 감상하고 비평하며 음악에 활용되는 미디어의 가치를 인식한다.","h":["이 성취기준은 생활 속에서 다양하게 활용되는 미디어 음악을 감상하고 비평함으로써 음악에서의 미디어 활용 가치를 통찰하는 능력을 기르도록 하기 위해 설정하였다. 영화 음악, 광고 음악, 게임 음악 등 다양한 미디어 음악을 주도적으로 찾아 감상하고, 특징, 기능, 역할 등에 대해 비평해 보도록 한다. 이를 통해 미디어 음악의 활용에 따른 예술적⋅사회적⋅경제적 가치를 인식하며 음악에서 미디어의 활용에 대한 가치를 폭넓게 이해하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음미01-04","과":"음악과 미디어","학":"고2~3","영":"미디어 탐구","p":"미디어가 음악 산업에 미치는 영향을 비판적으로 분석하고 균형적 시각을 갖는다.","h":["이 성취기준은 미디어의 발달이 음악 산업 전반에 미치는 영향을 분석함으로써 음악에서 미디어의 활용에 대한 비판적⋅균형적 안목을 기르도록 하기 위해 설정하였다. 음악의 기록⋅전달⋅유통 등과 관련된 음악 산업 전반에서 미디어의 기능, 역할, 영향 등에 대해 비판적으로 분석하는 과정을 통해 음악에서 미디어의 활용에 대한 균형적 시각을 형성하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음미02-01","과":"음악과 미디어","학":"고2~3","영":"실용적 연계","p":"소리⋅악기⋅아이디어와 미디어 사이의 상호작용을 탐색하고 다양한 상황에 적용하여 표현한다.","h":["이 성취기준은 다양한 소리나 악기, 음악적 아이디어를 기반으로 한 음악 활동과 미디어 사이의 상호작용을 자신의 음악적 표현에 적용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 소리, 악기, 음악적 아이디어가 미디어와의 상호작용을 통해 창의⋅융합적으로 표현된 다양한 사례를 찾아보도록 한다. 또한 자신의 음악적 아이디어를 표현하는 수단으로써 미디어를 활용할 수 있는 방안을 탐색해 보고, 이를 다양한 상황에 적용하여 창의적으로 표현해 보는 데 중점을 둔다."]},{"교":"음악","c":"12음미02-02","과":"음악과 미디어","학":"고2~3","영":"실용적 연계","p":"음악에서 활용되는 미디어를 주체적으로 사용하여 개성 있게 연주하거나 창작한다.","h":["이 성취기준은 음악에서 활용되는 미디어의 기능과 사용 방법을 익히고, 이를 자신의 연주나 창작 활동과 연계하여 주체적으로 사용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 사보⋅작곡⋅연주⋅음향 편집 관련 소프트웨어, 음향적 변화나 효과 관련 기기 등 연주와 창작 활동에 적합한 미디어를 선택하고, 이를 활용하여 자신의 개성 있는 표현을 담아 연주하거나 창작하도록 한다. 이를 통해 음악에서 미디어의 활용에 대한 주체적인 태도를 기르는 데 중점을 둔다."]},{"교":"음악","c":"12음미02-03","과":"음악과 미디어","학":"고2~3","영":"실용적 연계","p":"미디어를 활용하여 다양한 분야와 연계⋅융합한 창의적인 음악 작품을 기획한다.","h":["이 성취기준은 미디어 활용을 통해 다양한 분야와 연계하여 음악 작품을 구성하고 기획함으로써 창의⋅융합적 사고력 및 표현력을 기르도록 하기 위해 설정하였다. 개인 또는 다른 사람과의 협업을 통해 아이디어를 자유롭게 발산하여 음악 작품의 주제를 정하고, 주제 구현을 위해 적합한 미디어를 선택하여 활용하도록 한다. 또한 이 과정에서 다른 분야와 연계하거나 융합하여 음악 작품을 기획하는 활동을 통해 다양한 진로를 탐색할 수 있도록 하며, 융합적으로 사고하고 창의적으로 표현하는 기회를 갖도록 하는 데 중점을 둔다."]},{"교":"음악","c":"12음미02-04","과":"음악과 미디어","학":"고2~3","영":"실용적 연계","p":"다양한 미디어와 디지털 기술의 음악적 활용에 대하여 올바른 윤리의식을 갖는다.","h":["이 성취기준은 음악과 관련된 다양한 상황 속에서 미디어를 윤리적으로 활용하는 태도를 기르도록 하기 위해 설정하였다. 다양한 미디어와 디지털 기술을 음악에 활용하는 과정에서 발생할 수 있는 저작권 침해, 도용 등과 같은 문제들을 실제 사례를 통해 탐색해 보도록 한다. 이를 바탕으로 미디어와 디지털 기술의 윤리적 활용 방안과 구체적인 실천 과제에 대해 토의하거나 토론해 봄으로써 음악에서 미디어의 활용과 관련한 바람직한 윤리의식을 가지도록 하는 데 중점을 둔다."]},{"교":"미술","c":"4미01-01","과":"미술","학":"초3~4","영":"미적 체험","p":"자연물과 인공물을 탐색하는 데 다양한 감각을 활용할 수 있다."},{"교":"미술","c":"4미01-02","과":"미술","학":"초3~4","영":"미적 체험","p":"주변 대상을 체험하며 떠오른 느낌과 생각을 다양한 방법으로 나타낼 수 있다."},{"교":"미술","c":"4미01-03","과":"미술","학":"초3~4","영":"미적 체험","p":"미적 탐색에 호기심을 갖고 참여하며 자신의 감각으로 대상의 특징을 이해할 수 있다.","h":["성취기준은 객관적 지식을 적용하거나 고정 관념에 따라 대상을 이해하는 방식에서 벗어나 몸의 다양한 감각으로 직접 대상을 탐색하는 데 호기심을 갖고 참여하며 자신의 감각을 바탕으로 대상의 특징을 이해하는 데 중점을 둔다. 같은 대상이라도 지각하고 반응하는 방식은 학생마다 다를 수 있다. 대상을 지각하며 자연스럽게 떠올린 자신의 감정, 느낌, 생각 등을 나타내고 친구들의 다양한 반응을 접하며 자신만의 고유한 감각을 통해 대상이 지닌 다채로운 특징을 이해한다."]},{"교":"미술","c":"4미01-04","과":"미술","학":"초3~4","영":"미적 체험","p":"생활 속에서 활용되는 미술에 관심을 가지고 미술의 특징과 역할을 발견할 수 있다."},{"교":"미술","c":"4미02-01","과":"미술","학":"초3~4","영":"표현","p":"관찰과 상상으로 아이디어를 떠올려 표현 주제를 구체화할 수 있다."},{"교":"미술","c":"4미02-02","과":"미술","학":"초3~4","영":"표현","p":"기본적인 표현 재료와 용구의 특성을 이해하고 사용 방법을 익힐 수 있다.","h":["성취기준은 기본적인 표현 재료의 물성을 경험하고 표현 용구의 사용법을 충분히 익히는 활동에 중점을 둔다. 표현 재료와 용구는 단순히 표현 수단을 넘어 그 자체로서 학생들에게 새로운 느낌과 생각을 가지게 한다. 초등학교 3~4학년 수준에서 다룰 수 있는 기본적인 표현 재료에는 종이류(도화지, 색종이, 한지 등), 드로잉 재료(연필, 펜 등), 채색 재료(크레파스, 파스텔, 수채화물감, 아크릴물감, 먹 등), 조소 재료(찰흙, 종이죽, 공예용 철사 등)가 있으며 그 밖에 생활 속에서 익숙하게 다루고 있는 다양한 생활용품 및 디지털 매체를 활용할 수 있다."]},{"교":"미술","c":"4미02-03","과":"미술","학":"초3~4","영":"표현","p":"조형 요소의 특징을 자유롭게 탐색하며 주제 표현에 알맞게 활용할 수 있다.","h":["성취기준은 미술 표현에 기초가 되는 조형 요소의 특징을 탐색하고 표현 주제와 연결 지어 조형 요소를 활용하는 데 중점을 둔다. 조형 요소에는 선, 형과 형태, 색, 질감, 양감 등이 있다. 각 조형 요소를 탐색하여 시각적 특징을 발견하고 표현하고자 하는 주제와 어울리는 조형 요소를 찾아 주제 표현에 활용한다."]},{"교":"미술","c":"4미02-04","과":"미술","학":"초3~4","영":"표현","p":"표현 의도를 가지고 작품을 제작하며 자기 작품을 소중히 여길 수 있다.","h":["성취기준은 작품 제작을 위한 계획 단계부터 작품을 완성한 후 발표 및 전시에 이르기까지 학생들의 제작 의도와 작품을 대하는 태도에 중점을 둔다. 작품 제작에 분명한 의도를 갖는 것은 주도적으로 작품을 제작하는 바탕이 되어 표현 재료와 용구, 조형 요소의 특징을 탐색하여 작품에 활용하는 일련의 과정을 이끈다. 또한, 자신의 의도에 따라 주도적으로 제작한 작품에는 특별한 의미가 부여되어 작품을 소중히 여기는 태도로 이어질 수 있다."]},{"교":"미술","c":"4미02-05","과":"미술","학":"초3~4","영":"표현","p":"미술과 타 교과를 관련지어 주제를 표현하는데 흥미를 가질 수 있다."},{"교":"미술","c":"4미03-01","과":"미술","학":"초3~4","영":"감상","p":"미술 작품을 자세히 보고 작품과 미술가에 관해 질문할 수 있다.","h":["성취기준은 작품에 대한 교사의 질문이나 조사에 의존하는 감상 방식에서 벗어나 학생들이 작품을 충분히 보고 자신의 느낌과 생각을 바탕으로 질문을 만들어 상호 작용하는 데 중점을 둔다. 질문하기를 통한 감상은 작품과 나누는 대화의 시작이다. 작품 정보를 활용한 질문, 작품의 내용이나 형식에 관한 질문, 작가의 입장이 되어 던지는 질문 등 다양한 질문을 통하여 학생들이 감상에 흥미를 느끼고 감상 관점을 기르도록 한다."]},{"교":"미술","c":"4미03-02","과":"미술","학":"초3~4","영":"감상","p":"미술 작품의 특징과 작품에 관한 자신의 느낌과 생각을 설명할 수 있다."},{"교":"미술","c":"4미03-03","과":"미술","학":"초3~4","영":"감상","p":"미술 문화에 관심을 가지고 전시 및 행사에 참여할 수 있다."},{"교":"미술","c":"4미03-04","과":"미술","학":"초3~4","영":"감상","p":"작품 감상에 흥미를 가지고 참여하며 작품에 대한 자신의 감상 관점을 존중할 수 있다."},{"교":"미술","c":"6미01-01","과":"미술","학":"초5~6","영":"미적 체험","p":"다양한 감각과 매체를 활용하여 자신과 대상을 탐색할 수 있다."},{"교":"미술","c":"6미01-02","과":"미술","학":"초5~6","영":"미적 체험","p":"자신이나 주변 환경에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타낼 수 있다.","h":["성취기준은 자신이나 대상, 그리고 시시각각 변화하는 현상 등 주변 환경을 탐색하며 예민하게 찾은 감각적 특징과 체험 과정에서 떠오른 느낌과 생각을 관련지어 보는 경험에 중점을 둔다. 미술의 특성상 시각적 특징을 우선 다루게 되지만, 보이지 않아도 느낄 수 있는 특징이나 느낌과 상상이 반영된 색, 형, 이미지, 문구, 소리, 움직임 등을 자유롭게 활용한다. 이를 통해 감각이 사고에 미치는 영향뿐만 아니라 자신과 환경 사이의 관계를 이해한다."]},{"교":"미술","c":"6미01-03","과":"미술","학":"초5~6","영":"미적 체험","p":"주변 환경에 대한 민감한 태도로 대상과 상호 작용하며 새로운 의미를 발견할 수 있다.","h":["성취기준은 주변 환경 속 대상과 민감하게 상호 작용하며 경험한 느낌과 생각을 바탕으로 대상에 이름 붙이기, 자신을 닮은 대상 찾기, 대상을 연결하여 이야기 만들기 등 대상에 의미를 부여하는 활동에 중점을 둔다. 보는 사람, 시간과 장소, 분위기 등에 따라 대상과 다양하게 교감하며 그 과정에서 생성되는 의미를 성찰할 수 있도록 한다. 이를 통해 예술적 사고를 이끄는 대상의 가치를 이해하고 자신과 환경과의 생태 전환적 관계를 인식한다."]},{"교":"미술","c":"6미01-04","과":"미술","학":"초5~6","영":"미적 체험","p":"이미지가 나타내는 의미를 비판적으로 이해하고 느낌과 생각을 전달하는 데 활용할 수 있다."},{"교":"미술","c":"6미02-01","과":"미술","학":"초5~6","영":"표현","p":"다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시킬 수 있다."},{"교":"미술","c":"6미02-02","과":"미술","학":"초5~6","영":"표현","p":"디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 작품 제작에 활용할 수 있다.","h":["성취기준은 하나의 표현 주제에도 다양한 표현 방식이 있음을 이해하고 학생들이 자신의 의도에 따라 표현 재료와 방법을 선택하여 작품을 제작하는 데 중점을 둔다. 표현 주제에 적합한 표현 재료와 용구의 쓰임을 학생 스스로 탐색하고 습득하여 주제가 잘 드러날 수 있도록 적용하게 한다. 특히, 디지털 매체는 신체적 감각과 지각을 확장하는 표현의 도구로써 디지털 매체의 특징과 사용법을 익혀 작품 제작에 효과적으로 활용하게 한다."]},{"교":"미술","c":"6미02-03","과":"미술","학":"초5~6","영":"표현","p":"조형 요소의 어울림을 통해 조형 원리를 이해하고 주제 표현에 연결할 수 있다."},{"교":"미술","c":"6미02-04","과":"미술","학":"초5~6","영":"표현","p":"주제 표현에 의지를 갖고 표현 과정을 돌아보며 작품을 발전시킬 수 있다.","h":["성취기준은 계획 단계를 비롯한 작품 완성의 전 과정에서 주제 표현에 의지를 갖고 표현 방법과 절차를 재고하는 성찰의 태도를 기르는 데 중점을 둔다. 주제 표현의 의지를 갖는 것은 표현 주제를 나타내기 위해 다양한 표현 재료와 용구, 조형 요소와 원리를 작품에 활용하는 일련의 과정을 이끈다. 또한 작품을 주도적으로 돌아보고 보완하며 발전시키는 경험을 통해 학생들은 작품 완성의 기준을 스스로 설정하고 창작에 대한 상위 인지를 활성화한다."]},{"교":"미술","c":"6미02-05","과":"미술","학":"초5~6","영":"표현","p":"미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다."},{"교":"미술","c":"6미03-01","과":"미술","학":"초5~6","영":"감상","p":"미술 작품을 작품이 만들어진 시대적, 지역적 배경 등과 연결하여 이해할 수 있다."},{"교":"미술","c":"6미03-02","과":"미술","학":"초5~6","영":"감상","p":"미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요소와 원리 등)을 분석하여 작품의 특징을 설명할 수 있다."},{"교":"미술","c":"6미03-03","과":"미술","학":"초5~6","영":"감상","p":"공동체의 미술 문화 활동에 관심을 가지고 참여하며 경험을 공유할 수 있다.","h":["성취기준은 교실 수업이라는 시공간을 확장하여 전시, 지역 축제, 문화 행사 등 학생들이 살아가는 지역 사회의 미술 문화에 관심을 가지고 적극적으로 참여함으로써 문화를 향유하는 태도를 생활화하는 데 중점을 둔다. 또한 그 경험을 공유하고 소통함으로써 새로운 문화를 생성해가는 데까지 관심을 확장한다."]},{"교":"미술","c":"6미03-04","과":"미술","학":"초5~6","영":"감상","p":"다양한 방법을 활용하여 작품을 감상하며 작품에 관한 서로 다른 관점을 존중할 수 있다."},{"교":"미술","c":"9미01-01","과":"미술","학":"중1~3","영":"미적 체험","p":"감각을 활용하여 대상과 현상을 탐색하고 자신과 환경에 대한 감수성을 확장할 수 있다.","h":["성취기준은 다양한 감각을 활용하여 주변의 대상과 현상을 탐색하고 자신과 자신을 둘러싼 환경에 대한 미적 인식을 통해 감수성을 일깨우는 데 중점을 둔다. 감각을 활용하여 대상과 현상을 탐색하고 상호 작용하여 미적 인식에 이르는 경험을 통해 주변 환경을 포함하여 생태적, 문화적, 사회적 환경까지 새롭게 바라보고 의미를 부여하며 앎을 성찰할 수 있다."]},{"교":"미술","c":"9미01-02","과":"미술","학":"중1~3","영":"미적 체험","p":"시각 문화의 의미와 역할을 알고 이미지를 비판적으로 해석할 수 있다."},{"교":"미술","c":"9미01-03","과":"미술","학":"중1~3","영":"미적 체험","p":"다양한 문화를 존중하며 이미지를 활용하여 소통할 수 있다."},{"교":"미술","c":"9미01-04","과":"미술","학":"중1~3","영":"미적 체험","p":"삶과 미술의 관계를 이해하고 다양한 분야와의 연결 방안을 모색할 수 있다.","h":["성취기준은 삶 속에서 미술이 어떻게 상호 작용하고 있는지 그 중요성을 인식하는 것으로 출발한다. 인문, 과학, 공학 등 타 분야와 사회 현상에 이르기까지 폭넓게 연결된 미술의 사례를 찾고 자신의 흥미에 맞는 진로나 직업 및 관심 분야와 관련하여 적용 방안을 탐색하는 데 중점을 둔다. 미술과 관련된 직업과 진로를 적극적으로 탐색하고, 자유학기제 진로 탐색 활동, 진로연계교육 등과 연계할 수 있다."]},{"교":"미술","c":"9미02-01","과":"미술","학":"중1~3","영":"표현","p":"주제를 탐구하고 의도를 반영하여 적합한 표현을 계획할 수 있다."},{"교":"미술","c":"9미02-02","과":"미술","학":"중1~3","영":"표현","p":"주도적이고 도전적인 태도로 다양한 미술 표현을 실험하고 작품에 적용할 수 있다.","h":["성취기준은 주제를 효과적으로 시각화하는 방법을 찾기 위해 도전하고 실험하는 태도를 기르는 데 중점을 둔다. 실패를 두려워하거나 익숙한 표현 방법에 안주하지 않고 작품에 적합한 표현 방법과 매체를 주도적으로 탐색하고 활용할 수 있다."]},{"교":"미술","c":"9미02-03","과":"미술","학":"중1~3","영":"표현","p":"조형 요소와 원리, 표현 재료와 방법, 디지털 매체를 포함한 다양한 매체를 활용하여 주제를 효과적으로 표현할 수 있다."},{"교":"미술","c":"9미02-04","과":"미술","학":"중1~3","영":"표현","p":"자신과 타인의 작품을 존중하며, 다양한 방법으로 공유하고 소통할 수 있다.","h":["성취기준은 자신의 작품을 소중히 여기고 타인의 작품을 존중하는 태도를 지니며, 효과적인 방법으로 작품을 공유하고 소통하는 과정을 통해 표현의 가능성을 확장하는 데 중점을 둔다. 미술 표현 과정과 결과물을 교실, 복도, 지역 사회 공간, 온라인 공간까지 확장하여 공유하고 발표하며 토론할 수 있다."]},{"교":"미술","c":"9미02-05","과":"미술","학":"중1~3","영":"표현","p":"미술 표현 과정에서의 경험을 성찰하고 삶의 문제 해결에 활용할 수 있다.","h":["성취기준은 미술 표현 과정에서 마주하는 크고 작은 질문과 답을 찾아 나가는 과정이 가지는 가치를 알고 그 경험을 삶의 다양한 문제에 활용하는 데 중점을 둔다. 표현 주제를 찾고, 계획하고, 실험하고, 제작하고, 타인과 상호 작용하는 전체 과정에서 경험한 지식⋅이해, 과정⋅기능, 가치⋅태도를 삶의 다양한 문제와 연결할 수 있다."]},{"교":"미술","c":"9미03-01","과":"미술","학":"중1~3","영":"감상","p":"미술의 시대적, 지역적, 사회적 맥락을 이해하고 설명할 수 있다."},{"교":"미술","c":"9미03-02","과":"미술","학":"중1~3","영":"감상","p":"작품의 내용과 형식을 분석하고 미술 용어와 지식을 활용하여 설명할 수 있다."},{"교":"미술","c":"9미03-03","과":"미술","학":"중1~3","영":"감상","p":"다양한 감상 방법과 관점을 활용하여 작품을 해석할 수 있다."},{"교":"미술","c":"9미03-04","과":"미술","학":"중1~3","영":"감상","p":"미술의 다원성에 대한 존중을 바탕으로 미술 감상 경험을 삶과 연결하고 공동체 문화에 기여할 수 있다.","h":["성취기준은 미술의 다원성을 존중하는 태도를 바탕으로 미술 감상 과정과 결과에서 얻은 지식과 경험을 자신의 삶과 연결하여 통찰을 얻고 자신이 속한 공동체가 더 나은 문화를 만들어 나가도록 하는 데 중점을 둔다. 미술 작품과 그에 얽힌 다양한 주제에 관해 의견을 나누는 가운데 미술의 가치와 역할을 인식하고 미술을 통해 나와 공동체의 문화를 새롭게 하는 데 기여할 수 있다."]},{"교":"미술","c":"12미01-01","과":"미술","학":"고2~3","영":"미적 체험","p":"자신과 세계를 지각하고 미적으로 인식하며, 대상과 현상의 미적 가치를 발견하고 분석할 수 있다.","h":["성취기준은 자신과 세계를 감각으로 탐색하여 민감하게 지각하는 과정에서 대상과 현상을 다양한 방법으로 분석함으로써 새로운 시각에서 인식하고 미적 가치를 발견하기 위하여 설정되었다. 미적 가치의 발견과 분석은 세계를 이해하는 미적 안목을 바탕으로 개인의 관심사에서 출발하여 자신이 속한 공동체, 나아가 가상공간으로 범위를 확대한다."]},{"교":"미술","c":"12미01-02","과":"미술","학":"고2~3","영":"미적 체험","p":"시각 문화의 다양성과 의미 전달 방식을 이해하여 시각 문화를 비판적으로 수용하고 향유할 수 있다."},{"교":"미술","c":"12미01-03","과":"미술","학":"고2~3","영":"미적 체험","p":"이미지를 활용한 소통방식을 탐구하여 미술이 삶 속에서 가지는 의미에 대해 공감할 수 있다."},{"교":"미술","c":"12미01-04","과":"미술","학":"고2~3","영":"미적 체험","p":"삶과 연결된 미술을 이해하여 공동체와 생태환경으로 확장할 수 있다."},{"교":"미술","c":"12미02-01","과":"미술","학":"고2~3","영":"표현","p":"다양한 발상으로 주제를 심화하여 작품을 계획할 수 있다.","h":["성취기준은 하나의 주제를 깊이 있게 발전시키는 과정을 통해 주제를 심화하고 발상 과정과 표현 계획을 시각화하기 위해 설정한 것이다. 주제 심화를 위해 발상 기법을 활용하거나 자유로운 발상 과정을 시각화하여 주제가 작품으로 구현되는 과정을 인식하는 것에 초점을 둔다."]},{"교":"미술","c":"12미02-02","과":"미술","학":"고2~3","영":"표현","p":"주제에 적합한 표현 매체와 방법을 실험하고 융합하는 과정에 집중할 수 있다."},{"교":"미술","c":"12미02-03","과":"미술","학":"고2~3","영":"표현","p":"표현 과정을 성찰하고 새로운 표현 효과를 탐색하여 다음 작품에 반영할 수 있다."},{"교":"미술","c":"12미02-04","과":"미술","학":"고2~3","영":"표현","p":"주제를 확장하기 위한 미술 활동에 관심을 가지고 참여할 수 있다.","h":["성취기준은 우리 사회가 직면하고 있는 전 지구적인 이슈에 관심을 가지고 이를 미술 활동의 주제로 확장하고 연결하기 위해 설정한 것이다. 지속가능한 발전, 생태전환, 시민성, 디지털 소양 등 자신을 둘러싸고 있는 사회에서 발견할 수 있는 주제를 폭넓게 탐색하며 적용함으로써 미술을 통한 정체성과 공동체성의 함양에 초점을 둔다."]},{"교":"미술","c":"12미03-01","과":"미술","학":"고2~3","영":"감상","p":"미술의 시대적, 지역적, 사회⋅문화적 변천 과정을 이해하고 작품을 감상하며 자신의 견해를 논리적으로 표현할 수 있다.","h":["성취기준은 미술의 시대적, 지역적, 사회⋅문화적 변천 과정과 미술 작품의 관련성을 맥락적으로 이해하고 감상하기 위해 설정된 것이다. 시대적, 역사적 변화의 맥락 속에서 미술 작품의 특징과 의미, 자신의 견해를 미술 용어를 사용하여 논리적인 글과 말로 표현하는 데 초점을 둔다."]},{"교":"미술","c":"12미03-02","과":"미술","학":"고2~3","영":"감상","p":"비평 방법을 활용하여 미술과 시대, 사회, 환경과의 상호 관련성을 분석하고 가치를 판단할 수 있다."},{"교":"미술","c":"12미03-03","과":"미술","학":"고2~3","영":"감상","p":"미술 작품 감상과 비평의 관점을 활용한 소통으로 미술 문화의 다원적 가치를 이해하고 존중할 수 있다."},{"교":"미술","c":"12미03-04","과":"미술","학":"고2~3","영":"감상","p":"전시의 목적과 유형을 이해하여 전시를 기획하고 참여할 수 있다."},{"교":"미술","c":"12미창01-01","과":"미술 창작","학":"고2~3","영":"설계와 창작","p":"다양한 정보를 수집하여 자신의 진로나 관심 분야와 연결된 주제를 탐색할 수 있다.","h":["성취기준은 학생들이 자신의 진로 및 자신을 둘러싸고 있는 세계의 여러 관심 분야를 면밀하게 탐색하는 과정을 통하여 작품의 주제를 삶 속에서 찾도록 설정된 것이다. 자신의 진로, 지속가능한 발전, 생태전환, 시민성, 문화 다양성 등에 대한 정보를 수집하고 깊이 있는 탐색을 통해 표현 주제를 선정하는 데 초점을 둔다."]},{"교":"미술","c":"12미창01-02","과":"미술 창작","학":"고2~3","영":"설계와 창작","p":"창의적 발상 방법을 알고 아이디어를 시각화할 수 있다."},{"교":"미술","c":"12미창01-03","과":"미술 창작","학":"고2~3","영":"설계와 창작","p":"표현 기법과 매체를 탐구하고 이해하여 발견된 문제를 해결할 수 있다."},{"교":"미술","c":"12미창01-04","과":"미술 창작","학":"고2~3","영":"설계와 창작","p":"주제에 적합한 표현 매체와 방법을 선정하고 몰입하여 작품을 창작할 수 있다.","h":["성취기준은 주제에 적합한 표현 매체와 방법을 선정하고 작품 창작에 몰입하여 창의적으로 작품을 제작하도록 설정된 것이다. 여기에서 몰입은 자신의 의도대로 예술 작품을 제작하기 위해서 창작의 전체 설계를 스스로 조절하며 집중하는 태도로서 학생들이 적극적으로 창작 활동을 즐기는 상위 수준의 태도를 의미한다. 설계와 창작은 주제 선정, 아이디어 발상 및 시각화, 표현 기법과 매체 탐구, 표현 매체와 방법 선정, 작품 창작으로 이어지는 창작의 과정 자체가 곧 작품이 됨을 이해하고 창의적으로 표현하는 데 초점을 둔다."]},{"교":"미술","c":"12미창02-01","과":"미술 창작","학":"고2~3","영":"창작의 확장","p":"표현 기법과 매체를 적극적으로 실험하고 융합하여 효과를 발견하고 작품에 적용할 수 있다."},{"교":"미술","c":"12미창02-02","과":"미술 창작","학":"고2~3","영":"창작의 확장","p":"도전적 문제 해결 태도로 주제, 표현 기법, 매체 등 작품의 내용과 형식을 심화하여 창작할 수 있다.","h":["성취기준은 주제, 표현 기법, 매체를 심화하여 작품의 완성도를 높여 표현하도록 설정된 것이다. 창작 결과를 전시하기 전 주제, 표현 기법, 매체의 표현을 통해 자신의 의도가 작품에 드러나는지 확인하고 발견된 문제를 해결하며 부족한 부분은 깊이 있는 표현을 추가하여 완성하도록 한다. 작품의 내용과 형식을 심화하여 자신의 의도대로 주제를 표현하는 것에 초점을 둔다."]},{"교":"미술","c":"12미창02-03","과":"미술 창작","학":"고2~3","영":"창작의 확장","p":"전시 목적과 방법에 따라 전시를 기획하고 구성하면서 서로 다른 미적 인식을 비판적으로 수용할 수 있다."},{"교":"미술","c":"12미창02-04","과":"미술 창작","학":"고2~3","영":"창작의 확장","p":"창작의 과정과 결과의 연결성을 성찰하고 다양성을 존중하여 그 결과를 확장할 수 있다.","h":["성취기준은 발상, 실험, 제작, 확장으로 이어지는 창작 과정과 온오프라인, 학교와 지역사회 등 시공간이 확장된 전시로 창작 과정과 결과가 연결되어 있음을 이해하기 위한 것이다. 작품의 전시를 통하여 창작의 과정과 결과를 이해하고 작품에 나타난 다양한 생각을 존중하는 것에 초점을 둔다."]},{"교":"미술","c":"12미감01-01","과":"미술 감상과 비평","학":"고2~3","영":"미술 감상","p":"미술의 역사, 정치, 경제, 사회적 변천 과정과 특징을 분석하여 작가와 작품의 미술사적 의의를 이해할 수 있다."},{"교":"미술","c":"12미감01-02","과":"미술 감상과 비평","학":"고2~3","영":"미술 감상","p":"자신의 삶과 관련된 작가와 작품을 탐색하여 공감하고 진로와 연결할 수 있다.","h":["성취기준은 자신의 관심과 흥미, 진로와 관련 있는 작가의 작품을 탐색하고 공감하는 활동을 통하여 자신의 삶과 미술 작품이 관련이 있음을 이해하는 활동으로 설정하였다. 작가의 작품이 자신의 삶과 관련성을 맺고 있음을 알고 삶에서 적용되고 이어지는 활동이 되도록 초점을 둔다."]},{"교":"미술","c":"12미감01-03","과":"미술 감상과 비평","학":"고2~3","영":"미술 감상","p":"온오프라인 전시 공간에서 작품을 감상하고 해석하며 서로의 의견을 포용할 수 있다."},{"교":"미술","c":"12미감01-04","과":"미술 감상과 비평","학":"고2~3","영":"미술 감상","p":"작가와 작품의 특징을 맥락적으로 이해하는 과정에서 문화 다양성을 수용하고 공동체 의식을 함양할 수 있다."},{"교":"미술","c":"12미감02-01","과":"미술 감상과 비평","학":"고2~3","영":"미술 비평","p":"미술 작품의 특징, 지식과 정보 등의 근거를 바탕으로 작품의 의미를 이해하고 설명할 수 있다."},{"교":"미술","c":"12미감02-02","과":"미술 감상과 비평","학":"고2~3","영":"미술 비평","p":"다양한 미술 비평 방법을 이해하고 활용하여 작품을 해석하고 평가할 수 있다."},{"교":"미술","c":"12미감02-03","과":"미술 감상과 비평","학":"고2~3","영":"미술 비평","p":"비평 관점에 따라 자신의 반응을 명료화하고 작품의 가치를 판단하며 미술 용어를 활용하여 논리적으로 표현할 수 있다.","h":["성취기준은 다양한 미술 비평의 관점을 활용하여 작품의 의미와 특징 등을 논리적인 말과 글로 표현함으로써 작품에 대한 자신의 생각을 명료화하는 비평 활동이 이루어지도록 설정하였다. 작품에 대한 자신의 견해를 미술 용어를 활용하여 다른 사람에게 논리적으로 전달하는 데에 초점을 둔다."]},{"교":"미술","c":"12미감02-04","과":"미술 감상과 비평","학":"고2~3","영":"미술 비평","p":"사회적 이슈를 비롯하여 타 분야와 연계한 비평 활동으로 형성된 비판적 사고를 사회와 삶으로 확장할 수 있다.","h":["성취기준은 미술 비평의 관점에서 삶 속의 다양한 문제를 비평 활동을 통해 형성된 비판적 사고로 해결할 수 있는 방법을 찾아보도록 설정하였다. 사회적 이슈나 자신의 진로와 연계하여 작품을 평가하고 가치를 재창출하며 다양한 측면의 관점을 폭넓게 탐구하는 데에 초점을 둔다."]},{"교":"미술","c":"12미매01-01","과":"미술과 매체","학":"고2~3","영":"매체의 이해","p":"시대별, 지역별 매체의 변화를 비교하고 미술과 매체를 관련지을 수 있다."},{"교":"미술","c":"12미매01-02","과":"미술과 매체","학":"고2~3","영":"매체의 이해","p":"미술에서 매체의 역할과 의미를 탐색하고 미적 가치를 발견할 수 있다.","h":["성취기준은 매체가 작가의 생각과 감정, 시대 인식을 반영한 결과물임을 이해하고 미술 속 매체의 역할과 의미를 탐색하여 미적 가치를 발견할 수 있도록 설정된 것이다. 미술 작품을 통해 작가의 내러티브, 디지털 혁명에 의한 기술의 발달, 기후위기, 환경 재난 등의 환경적 변화를 이해하는 등 매체의 역할과 의미를 탐색하는 과정에서 미술에서 매체의 미적 가치를 발견하는 데 초점을 둔다."]},{"교":"미술","c":"12미매01-03","과":"미술과 매체","학":"고2~3","영":"매체의 이해","p":"미술에 활용되는 아날로그와 디지털 매체의 개념과 종류를 이해하고 개방적 태도로 표현 매체를 선택할 수 있다."},{"교":"미술","c":"12미매01-04","과":"미술과 매체","학":"고2~3","영":"매체의 이해","p":"매체의 특성과 표현 원리를 실험하고 작품에 반영할 수 있다.","h":["성취기준은 건식 매체, 습식 매체, 유화 물감, 아크릴 물감, 사진, 도자, 유리, 금속, 나무 등 아날로그 매체와 디지털 이미지, 인터넷, 가상현실 등 디지털 매체의 특성과 표현 원리를 실험하고 그 효과를 이해하여 작품에 반영할 수 있도록 설정된 것이다. 매체의 미적, 물성적, 기술적 특성과 표현 원리를 실험하며 기존에 미술 매체로 사용해보지 않았던 새로운 매체들을 발견하고 경험하여 표현에 적용하는 데 초점을 둔다."]},{"교":"미술","c":"12미매02-01","과":"미술과 매체","학":"고2~3","영":"매체의 활용","p":"아날로그 매체와 디지털 매체를 창의적으로 활용하여 표현할 수 있다."},{"교":"미술","c":"12미매02-02","과":"미술과 매체","학":"고2~3","영":"매체의 활용","p":"아날로그와 디지털 매체를 타 분야와 연결하고 융합하며 매체의 가치를 공유할 수 있다.","h":["성취기준은 매체의 표현 기술과 방법을 타 분야와 연결하고 융합하여 자신의 의도대로 작품을 창의적으로 표현하도록 설정된 것이다. 미술을 다양한 분야와 융합하여 표현하는 현대 미술의 다원화된 표현 방법 속 매체의 가치를 이해하고, 전통적으로 사용해오던 아날로그 매체와 디지털 매체를 융합하여 새로운 매체 표현을 시도하며 매체의 가치를 발견하고 공유하는 데 초점을 둔다. 일상에서 지나치던 매체를 새로운 표현 매체와 융합하여 작품에 활용하는 과정에서 깊이 있는 학습이 이루어지며 타 분야에 대해 개방적인 태도를 기르게 된다."]},{"교":"미술","c":"12미매02-03","과":"미술과 매체","학":"고2~3","영":"매체의 활용","p":"작품의 정교한 표현과 보존 방법을 이해하고 다양한 매체로 표현한 작품을 전시할 수 있다.","h":["성취기준은 매체의 표현 기술을 활용하여 자신의 의도대로 작품을 섬세하고 치밀하게 표현하는 방법과 아날로그 매체와 디지털 매체를 사용한 작품의 보존 방법의 차이를 이해하고 작품을 효과적으로 전시하도록 설정된 것이다. 아날로그 매체를 사용한 작품은 화랑이나 미술관에서 작품을 보존하고 전시하지만 디지털 매체를 사용한 작품은 작품 보존과 전시에 있어서 차이가 있음을 이해하고, 온오프라인 공간을 탐색하고 활용하여 작품을 보존하고 전시하는 것에 초점을 둔다. 다양한 매체를 활용하여 학습자의 생각과 작품의 표현을 함께 정교화하고 작품에 적합한 방법을 활용하여 전시하는 과정을 통해 학생들은 예술적 성취를 경험한다."]},{"교":"미술","c":"12미매02-04","과":"미술과 매체","학":"고2~3","영":"매체의 활용","p":"전시된 작품 속 매체의 효과에 반응하고 공감하며 비판적으로 수용할 수 있다."},{"교":"영어","c":"4영01-01","과":"영어","학":"초3~4","영":"이해","p":"알파벳과 쉽고 간단한 단어의 소리를 듣고 식별한다."},{"교":"영어","c":"4영01-02","과":"영어","학":"초3~4","영":"이해","p":"알파벳 대소문자를 식별하여 읽는다."},{"교":"영어","c":"4영01-03","과":"영어","학":"초3~4","영":"이해","p":"쉽고 간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다."},{"교":"영어","c":"4영01-04","과":"영어","학":"초3~4","영":"이해","p":"소리와 철자의 관계를 이해하며 쉽고 간단한 단어, 어구, 문장을 소리 내어 읽는다.","h":["이 성취기준은 단어, 어구, 문장을 개별 소리와 철자 관계에 주목하며 소리 내어 읽음으로써 독자적인 문자 해독의 기초를 형성하는 데 초점이 있다. 초기 학습 단계에서는 소리와 철자 관계가 규칙적이면서 친숙한 단어를 읽고, 나아가 두음이나 각운이 같은 단어를 포함한 어구나 문장, 의미를 알고 있는 어구나 문장을 반복하여 읽으며 소리와 철자 관계를 이해하는 것을 의미한다."]},{"교":"영어","c":"4영01-05","과":"영어","학":"초3~4","영":"이해","p":"쉽고 간단한 단어, 어구, 문장의 의미를 이해한다."},{"교":"영어","c":"4영01-06","과":"영어","학":"초3~4","영":"이해","p":"자기 주변 주제에 관한 담화의 주요 정보를 파악한다.","h":["이 성취기준은 말이나 대화를 듣고 명시적이고 구체적으로 언급된 정보를 파악하는 사실적 이해의 수준을 말하며, 담화의 상황과 내용을 이해하는 데 가장 핵심이 되는 한두 가지의 정보를 파악하는 것을 의미한다."]},{"교":"영어","c":"4영01-07","과":"영어","학":"초3~4","영":"이해","p":"적절한 전략을 활용하여 담화나 문장을 듣거나 읽는다.","h":["이 성취기준은 영어 듣기와 읽기 전략에 관한 것으로 실물, 그림, 동작 등의 시각 정보를 활용하여 담화의 상황이나 내용, 문장의 의미를 파악하는 것을 의미한다."]},{"교":"영어","c":"4영01-08","과":"영어","학":"초3~4","영":"이해","p":"다양한 매체로 표현된 담화나 문장을 흥미를 가지고 듣거나 읽는다."},{"교":"영어","c":"4영01-09","과":"영어","학":"초3~4","영":"이해","p":"시, 노래, 이야기를 공감하며 듣는다.","h":["이 성취기준은 시, 노래, 이야기 등 문학이나 예술적 감성을 불러일으키는 듣기 자료를 통해 기쁨, 슬픔 등의 감정을 느끼고 공감하는 것을 의미한다."]},{"교":"영어","c":"4영01-10","과":"영어","학":"초3~4","영":"이해","p":"자기 주변 주제나 문화에 관한 담화나 문장을 존중의 태도로 듣거나 읽는다."},{"교":"영어","c":"4영02-01","과":"영어","학":"초3~4","영":"표현","p":"쉽고 간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 따라 말한다."},{"교":"영어","c":"4영02-02","과":"영어","학":"초3~4","영":"표현","p":"알파벳 대소문자를 구별하여 쓴다."},{"교":"영어","c":"4영02-03","과":"영어","학":"초3~4","영":"표현","p":"소리와 철자의 관계를 바탕으로 쉽고 간단한 단어를 쓴다.","h":["이 성취기준은 단어를 쓰는 단계에서 학습자가 기계적으로 철자를 외워서 쓰는 것이 아니라 단어의 개별 소리에 대응하는 철자를 생각해 보며 쓰도록 하는 것을 의미한다."]},{"교":"영어","c":"4영02-04","과":"영어","학":"초3~4","영":"표현","p":"실물, 그림, 동작 등을 보고 쉽고 간단한 문장으로 말하거나 단어나 어구를 쓴다."},{"교":"영어","c":"4영02-05","과":"영어","학":"초3~4","영":"표현","p":"자신, 주변 사람이나 사물의 소개나 묘사를 쉽고 간단한 문장으로 말하거나 보고 쓴다.","h":["이 성취기준은 간단한 인사말과 함께 자신과 가족, 친구 등의 이름이나 외모, 주변의 물건이나 동물 등의 특징을 쉬운 언어 형식의 한두 문장으로 말하거나 제시된 문장을 그대로 보고 쓰는 것을 의미한다."]},{"교":"영어","c":"4영02-06","과":"영어","학":"초3~4","영":"표현","p":"행동 지시를 쉽고 간단한 문장으로 말하거나 보고 쓴다."},{"교":"영어","c":"4영02-07","과":"영어","학":"초3~4","영":"표현","p":"자신의 감정을 쉽고 간단한 문장으로 말하거나 보고 쓴다."},{"교":"영어","c":"4영02-08","과":"영어","학":"초3~4","영":"표현","p":"자기 주변 주제에 관한 담화의 주요 정보를 묻거나 답한다."},{"교":"영어","c":"4영02-09","과":"영어","학":"초3~4","영":"표현","p":"적절한 매체나 전략을 활용하여 창의적으로 의미를 표현한다.","h":["이 성취기준은 의사소통 과정에서 사진, 그림, 디지털 매체 등을 활용하여 다양한 방식으로 의미를 전달하거나 교환하는 것을 말한다. 이는 표정, 몸짓, 동작 등의 비언어적 수단을 수반하여 말하는 것과 함께 그림 글자나 단어 쓰기, 고안 철자(invented spelling) 쓰기, 철자 점검하며 다시 쓰기 등의 전략을 적절하게 사용하는 것을 의미한다."]},{"교":"영어","c":"4영02-10","과":"영어","학":"초3~4","영":"표현","p":"의사소통 활동에 흥미와 자신감을 가지고 대화 예절을 지키며 참여한다.","h":["이 성취기준은 말하기⋅쓰기 활동 및 과업을 수행하는 과정에서 학습자가 흥미와 자신감을 가지고 능동적으로 참여하도록 다양한 학습 경험을 제공하는 데 초점이 있으며, 대화 상대자의 영어 사용 수준이나 문화적 차이를 고려하여 상대방을 배려하고 차례를 지키며 대화에 참여하도록 하는 것을 의미한다."]},{"교":"영어","c":"6영01-01","과":"영어","학":"초5~6","영":"이해","p":"간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다."},{"교":"영어","c":"6영01-02","과":"영어","학":"초5~6","영":"이해","p":"간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 소리 내어 읽는다."},{"교":"영어","c":"6영01-03","과":"영어","학":"초5~6","영":"이해","p":"간단한 단어, 어구, 문장의 의미를 이해한다."},{"교":"영어","c":"6영01-04","과":"영어","학":"초5~6","영":"이해","p":"일상생활 주제에 관한 담화나 글의 세부 정보를 파악한다."},{"교":"영어","c":"6영01-05","과":"영어","학":"초5~6","영":"이해","p":"일상생활 주제에 관한 담화나 글의 중심 내용을 파악한다."},{"교":"영어","c":"6영01-06","과":"영어","학":"초5~6","영":"이해","p":"일상생활 주제에 관한 담화나 글에서 일이나 사건의 순서를 파악한다.","h":["이 성취기준은 말이나 대화, 글의 흐름을 파악하는 데 초점을 둔 것으로, 주요한 일이나 사건의 전후 관계 및 시간적 순서를 파악하는 것을 의미한다. 그림이나 만화 등을 이용하여 사건이 일어난 순서에 따라 연결하거나 배열하기, 일이 일어난 순서대로 번호 쓰기 등의 활동을 하는 수준을 말한다."]},{"교":"영어","c":"6영01-07","과":"영어","학":"초5~6","영":"이해","p":"적절한 전략을 활용하여 일상생활 주제에 관한 담화나 글을 듣거나 읽는다.","h":["이 성취기준은 듣기나 읽기 전⋅중⋅후 과정에서 다양한 단서를 활용하여 담화나 글의 내용을 예측하기, 특정 정보를 찾아 듣거나 읽기, 내용 확인을 위해 다시 듣거나 읽기 등의 전략을 활용하는 것을 의미한다."]},{"교":"영어","c":"6영01-08","과":"영어","학":"초5~6","영":"이해","p":"다양한 매체로 표현된 담화나 글을 흥미와 자신감을 가지고 듣거나 읽는다.","h":["이 성취기준은 일상생활 주제에 관해 다양한 매체로 표현된 학습 자료를 듣거나 읽으면서 영어에 대한 흥미와 자신감을 높이고, 학습자 스스로 자신의 수준에 맞는 다양한 영어 자료를 자기주도적으로 찾아 즐기는 것을 의미한다."]},{"교":"영어","c":"6영01-09","과":"영어","학":"초5~6","영":"이해","p":"시, 노래, 이야기를 공감하며 듣거나 읽는다."},{"교":"영어","c":"6영01-10","과":"영어","학":"초5~6","영":"이해","p":"일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다.","h":["이 성취기준은 공동체 구성원으로서의 가치⋅태도와 관련된 것으로, 일상생활 주제나 문화에 관한 담화나 글을 듣거나 읽으면서 다른 사람의 생각과 의견을 존중하고 이해하는 태도를 갖는 것을 의미한다. 이는 우리나라와 다른 문화권의 다양한 의사소통 방식과 생활 양식을 수용하는 것을 포함한다."]},{"교":"영어","c":"6영02-01","과":"영어","학":"초5~6","영":"표현","p":"간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다."},{"교":"영어","c":"6영02-02","과":"영어","학":"초5~6","영":"표현","p":"실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다."},{"교":"영어","c":"6영02-03","과":"영어","학":"초5~6","영":"표현","p":"알파벳 대소문자와 문장 부호를 문장에서 바르게 사용한다."},{"교":"영어","c":"6영02-04","과":"영어","학":"초5~6","영":"표현","p":"주변 사람이나 사물을 간단한 문장으로 소개하거나 묘사한다."},{"교":"영어","c":"6영02-05","과":"영어","학":"초5~6","영":"표현","p":"주변 장소나 위치, 행동 순서나 방법을 간단한 문장으로 설명한다.","h":["이 성취기준은 주변의 장소를 찾아가는 방법이나 위치, 일상생활에서 이루어지는 활동을 위한 일련의 행동 순서나 방법에 대하여 두세 문장으로 말하거나 쓰는 것을 의미한다. 이때 문장과 문장을 이어 주는 말(and, but 등)이나 순서를 나타내는 말(first, second 등)을 적절하게 활용할 수 있다."]},{"교":"영어","c":"6영02-06","과":"영어","학":"초5~6","영":"표현","p":"자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다."},{"교":"영어","c":"6영02-07","과":"영어","학":"초5~6","영":"표현","p":"일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다."},{"교":"영어","c":"6영02-08","과":"영어","학":"초5~6","영":"표현","p":"예시문을 참고하여 목적에 맞는 간단한 글을 쓴다.","h":["이 성취기준은 초대, 감사, 축하 등을 목적으로 하는 카드나 이메일, 경험을 담은 일기나 기행문 등 일상생활에서 빈번하게 일어나는 쓰기의 상황과 목적을 고려하여 글을 쓰는 것으로서, 예시문을 참고하여 글의 형식에 맞게 적절한 내용으로 변형하거나 응용하여 쓰는 수준을 말한다."]},{"교":"영어","c":"6영02-09","과":"영어","학":"초5~6","영":"표현","p":"적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다.","h":["이 성취기준은 구어나 문어로 의사소통하는 과정에서 학습자의 수준과 특성에 알맞은 매체와 전략을 사용하여 창의적으로 의미를 생성하고 표현하는 것을 말한다. 이는 브레인스토밍이나 생각 그물 등을 활용하여 아이디어를 생성하고, 이를 동작이나 그림과 같은 전통적인 매체뿐만 아니라 다양한 앱이나 디지털 매체 등을 활용하여 새로운 방법으로 말하거나 쓰는 것을 의미한다. 또한 의사소통 과정에서 발생하는 어려움을 극복하기 위해 반복하기, 반복 및 확인 요청하기 등의 말하기 전략과 고쳐 쓰거나 다시 쓰기 등의 쓰기 전략을 활용하는 것을 의미한다."]},{"교":"영어","c":"6영02-10","과":"영어","학":"초5~6","영":"표현","p":"의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다.","h":["이 성취기준은 온오프라인 공간에서 제공된 다양한 형태의 말하기⋅쓰기 과업이나 활동에 흥미와 자신감을 가지고 능동적으로 참여하는 것을 의미한다. 지속적으로 이루어지는 짝이나 모둠별 말하기⋅쓰기 활동을 통해 학습자들이 서로 가르쳐 주거나 배우는 과정에서 긍정적인 피드백을 주고받으며 말하거나 쓰고 싶은 의욕과 자신감을 높이는 것을 말한다."]},{"교":"영어","c":"9영01-01","과":"영어","학":"중1~3","영":"이해","p":"단어, 어구, 문장을 듣고 연음이나 축약된 소리를 식별한다.","h":["이 성취기준은 자주 사용되는 단어나 어구 또는 다양한 언어 형식의 문장을 듣고 영어의 리듬, 강세, 억양뿐만 아니라 연음이나 축약된 소리를 식별하여 자연스럽게 영어로 말하는 것을 듣고 이해할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영01-02","과":"영어","학":"중1~3","영":"이해","p":"친숙한 주제에 관한 담화나 글에서 세부 정보를 파악한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관하여, 말이나 대화를 듣거나 글을 읽고 그 속에서 숫자, 위치, 사건 등의 세부 정보를 파악할 수 있으며, 그림, 사진, 도표 등의 시각적 정보를 포함한 말, 대화, 글에서 세부 정보를 파악할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영01-03","과":"영어","학":"중1~3","영":"이해","p":"친숙한 주제에 관한 담화나 글의 중심 내용을 파악한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관하여, 말이나 대화를 듣거나 글을 읽고, 줄거리, 주제, 요지 등의 중심 내용을 파악할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영01-04","과":"영어","학":"중1~3","영":"이해","p":"친숙한 주제에 관한 담화나 글에서 일이나 사건의 논리적 관계를 파악한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관하여, 말이나 대화를 듣거나 글을 읽고 일이나 사건의 순서, 전후 관계, 원인과 결과 등의 논리적 관계를 파악할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영01-05","과":"영어","학":"중1~3","영":"이해","p":"친숙한 주제에 관한 담화나 글에서 인물의 기분이나 감정을 추론한다."},{"교":"영어","c":"9영01-06","과":"영어","학":"중1~3","영":"이해","p":"친숙한 주제에 관한 담화나 글에서 화자나 필자의 의도나 목적을 추론한다."},{"교":"영어","c":"9영01-07","과":"영어","학":"중1~3","영":"이해","p":"단어, 어구, 문장의 함축적 의미를 추론한다."},{"교":"영어","c":"9영01-08","과":"영어","학":"중1~3","영":"이해","p":"적절한 전략을 활용하여 다양한 매체로 표현된 담화나 글을 듣거나 읽는다.","h":["이 성취기준은 학습자가 방송, 영상, 인터넷 등 다양한 매체로 표현된 친숙한 주제에 관한 말, 대화 또는 글을 듣거나 읽을 때, ‘다음에 나올 내용을 추측하며 듣거나 읽기’와 ‘훑어보기’와 같은 다양한 전략을 적절하게 활용할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영01-09","과":"영어","학":"중1~3","영":"이해","p":"다양한 관점을 존중하는 태도로 듣거나 읽는다."},{"교":"영어","c":"9영01-10","과":"영어","학":"중1~3","영":"이해","p":"자신의 관심사에 관한 다양한 담화나 글을 선택하여 적극적으로 듣거나 읽는다.","h":["이 성취기준은 학습자가 자신의 관심 분야와 관련된 말, 대화 또는 글을 스스로 선택하여 계획성 있고 적극적인 태도로 듣거나 읽을 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-01","과":"영어","학":"중1~3","영":"표현","p":"연음이나 축약된 소리를 활용하여 단어, 어구, 문장을 말한다.","h":["이 성취기준은 학습자가 영어의 리듬, 강세, 억양뿐만 아니라 연음이나 축약된 소리를 적절히 활용하여 실제 상황에서 단어, 어구, 문장을 이해할 수 있는 발음으로 자연스럽게 말할 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-02","과":"영어","학":"중1~3","영":"표현","p":"대상이나 인물의 감정을 묘사한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관해, 자신이나 상대방이 느끼는 기분이나 감정을 묘사하는 말이나 대화를 하거나 문장 또는 문단으로 쓸 수 있는 것을 의미한다. 또한 주변 사람이나 사물 등에 대해 적절하게 묘사하는 말이나 대화를 하거나 문장 또는 문단으로 쓸 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-03","과":"영어","학":"중1~3","영":"표현","p":"친숙한 주제에 관해 사실적 정보를 설명한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관해 사람, 사물, 위치나 장소, 방법이나 절차 등을 적절하게 설명하는 말이나 대화를 하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다. 또한 그림, 사진, 도표 등 시각적 정보와 관련하여 특정 정보를 설명하는 말이나 대화를 하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-04","과":"영어","학":"중1~3","영":"표현","p":"친숙한 주제에 관해 경험이나 계획을 설명한다."},{"교":"영어","c":"9영02-05","과":"영어","학":"중1~3","영":"표현","p":"친숙한 주제에 관해 일이나 사건의 논리적 관계를 설명한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관한 일이나 사건의 상황에 대해 분석적으로 생각해 보고 이를 통해 일이나 사건의 순서, 전후 관계, 원인과 결과 등의 논리적 관계에 대해 말이나 대화를 하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-06","과":"영어","학":"중1~3","영":"표현","p":"친숙한 주제에 관해 자신의 의견을 주장한다.","h":["이 성취기준은 학습자가 개인 생활, 학교생활, 사회생활 등에서 흔히 접할 수 있는 친숙한 주제에 관해 자신의 의견을 주장하는 말이나 대화를 하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다. 이는 또한 학습자의 주장이 설득력을 갖추기 위해 의견을 뒷받침할 만한 근거를 함께 제시할 수 있도록 하는 것이다."]},{"교":"영어","c":"9영02-07","과":"영어","학":"중1~3","영":"표현","p":"친숙한 주제에 관해 듣거나 읽고 내용을 요약한다."},{"교":"영어","c":"9영02-08","과":"영어","학":"중1~3","영":"표현","p":"간단한 일기, 편지, 이메일 등의 글을 쓴다."},{"교":"영어","c":"9영02-09","과":"영어","학":"중1~3","영":"표현","p":"적절한 매체를 활용하여 정보 윤리를 준수하며 말하거나 쓴다.","h":["이 성취기준은 학습자가 인용한 내용이나 자료의 출처를 언급하는 등의 정보 윤리를 준수하며 이미지, 영상, 인터넷 등 다양한 매체를 적절하게 활용하여 자신의 생각을 말하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-10","과":"영어","학":"중1~3","영":"표현","p":"적절한 전략을 활용하여 상황이나 목적에 맞게 말하거나 쓴다.","h":["이 성취기준은 학습자가 실생활의 여러 말하기나 글쓰기 상황에서 ‘바꿔 말하기’ 또는 ‘고쳐 쓰기’와 같은 적절하고 다양한 전략을 활용하여 상황이나 목적에 맞게 효과적으로 말이나 대화를 하거나 문장이나 문단으로 쓸 수 있는 것을 의미한다."]},{"교":"영어","c":"9영02-11","과":"영어","학":"중1~3","영":"표현","p":"상대방을 배려하는 태도로 말하거나 쓴다."},{"교":"영어","c":"10공영1-01-01","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글에 포함된 세부 정보를 파악한다."},{"교":"영어","c":"10공영1-01-02","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"10공영1-01-03","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글의 분위기나 화자나 인물의 심정 및 의도 등을 추론한다."},{"교":"영어","c":"10공영1-01-04","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글에 나타난 일이나 사건의 논리적 관계를 파악한다."},{"교":"영어","c":"10공영1-01-05","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글에 포함된 표현의 함축적 의미를 추론한다.","h":["이 성취기준은 화자나 필자가 사용하는 표현의 함축적 의미를 상황과 맥락 및 문화적 배경에 대한 지식을 통해 추론하는 것이다. 학습자는 문학적이거나 창의적인 표현을 통해 언어 사용의 묘미를 느끼고, 명시적이고 직설적인 표현과 비교하며 함축적 표현의 전달 효과를 이해하게 된다."]},{"교":"영어","c":"10공영1-01-06","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글의 전개 방식이나 구조를 파악한다.","h":["이 성취기준은 담화나 글이 구성된 형식이나 틀을 이해하고 내용을 보다 효과적으로 전달하기 위해 화자나 필자가 사용한 서론, 본론, 결론 등의 구성 체계나 내용의 전개 방식을 파악하는 것이다. 학습자는 주제문의 위치, 예시나 근거 자료의 제시, 단락을 잇는 연결어 및 내용의 일관성을 유지하기 위한 장치 등을 주목하며 말과 글이 전개되는 구성의 틀을 이해하게 된다."]},{"교":"영어","c":"10공영1-01-07","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글의 이해를 위한 적절한 전략을 적용한다.","h":["이 성취기준은 여러 가지 매체로 표현된 말이나 글을 학습자가 적절한 듣기 및 읽기 전략을 사용하여 효과적으로 이해하는 것이다. 듣기의 경우 발화의 특징이나 언어의 격식 및 화자와 청자 간의 관계 등에 따라 듣기 전략을 다르게 적용하여 내용을 보다 쉽고 효과적으로 파악한다. 읽기의 경우 글의 종류나 소재, 글의 길이 및 어휘의 수준, 읽는 목적 등에 따라 읽기 전략을 다르게 적용하여 내용을 효과적으로 파악한다. 또한 학습자는 자신이 사용한 듣기 및 읽기 전략의 효과를 스스로 평가하고 전략을 수정 또는 정교화한다."]},{"교":"영어","c":"10공영1-01-08","과":"공통영어1","학":"고1","영":"이해","p":"말이나 글에 나타난 다양한 관점이나 의견을 포용적인 태도로 분석한다.","h":["이 성취기준은 말이나 글에 나타난 화자나 필자의 관점이나 의견을 다양성의 측면에서 포용적으로 이해하는 태도를 의미하는 것이다. 학습자는 개개인이 처한 상황이나 문화적 배경에 따라 사물이나 현상을 보는 관점이나 관습 등이 다를 수 있음을 이해하고, 자신과 다른 관점이나 의견을 비교⋅분석하는 데 있어서 포용적인 태도를 취하게 된다."]},{"교":"영어","c":"10공영1-02-01","과":"공통영어1","학":"고1","영":"표현","p":"실물, 그림, 사진, 도표 등을 활용하여 내용을 설명한다.","h":["이 성취기준은 비언어적 자료로 제시된 정보나 시각 자료 등을 적절히 활용하여 전달하고자 하는 내용을 설명하는 것이다. 학습자는 실물이나 그림, 사진, 도표 자료 등 일상적으로 접하게 되는 다양한 형태의 자료를 활용하여 전달 내용에 대한 청자나 독자의 이해도를 높인다."]},{"교":"영어","c":"10공영1-02-02","과":"공통영어1","학":"고1","영":"표현","p":"사실적 정보나 지식을 말이나 글로 전달한다."},{"교":"영어","c":"10공영1-02-03","과":"공통영어1","학":"고1","영":"표현","p":"경험이나 계획 등을 말하거나 기술한다."},{"교":"영어","c":"10공영1-02-04","과":"공통영어1","학":"고1","영":"표현","p":"자신의 생각이나 의견, 감정, 감상 등을 표현한다."},{"교":"영어","c":"10공영1-02-05","과":"공통영어1","학":"고1","영":"표현","p":"듣거나 읽은 내용을 요약하여 말하거나 기술한다.","h":["이 성취기준은 듣거나 읽고 이해한 자료의 핵심 내용을 짧은 말이나 문장으로 요약하는 것이다. 내용 전체를 아우르면서도 지엽적인 내용을 빼고, 핵심 어구와 주제를 포함하면서 내용의 맥락에 맞게 핵심 내용을 간추린다."]},{"교":"영어","c":"10공영1-02-06","과":"공통영어1","학":"고1","영":"표현","p":"어휘나 표현을 점검하여 내용을 명확하게 전달한다.","h":["이 성취기준은 말하기나 쓰기 과정에서 동료나 교사의 피드백 및 온라인 도구 등을 통해 어휘나 표현의 적절성을 점검하고 수정하여 전달하고자 하는 내용의 명확성을 높이는 것이다. 학습자는 자신의 반복적인 실수나 오류를 점검하고 최소화하여 어휘나 문장 수준에서 말이나 글의 의미를 명확히 표현한다."]},{"교":"영어","c":"10공영1-02-07","과":"공통영어1","학":"고1","영":"표현","p":"적절한 전략과 다양한 매체를 활용하여 상황과 목적에 맞게 말하거나 쓴다.","h":["이 성취기준은 다양한 의사소통 목적과 상황 및 맥락을 고려하여 상대방과의 대화나 소통을 유의미하게 이어가거나, 다양한 매체를 활용하여 메시지를 효과적으로 전달하면서 과제를 해결하기 위해 적절한 전략을 활용하는 것이다. 학습자는 핵심 단어 반복하기, 재구성하기, 우회적으로 표현하기, 쉬운 말로 대체하기, 질문하거나 환기하기, 예시 들기, 통계 자료 제시하기 등 다양한 소통 목적에 맞게 적절한 전략을 사용하고, 사용한 전략의 효과에 대해 스스로 평가해 본다."]},{"교":"영어","c":"10공영1-02-08","과":"공통영어1","학":"고1","영":"표현","p":"상대방의 생각이나 관점을 존중하고 언어 예절을 갖추어 표현한다.","h":["이 성취기준은 말하거나 글을 쓸 때 청자나 독자의 입장을 고려하여 자신과 다른 관점을 포용적 태도로 이해하고 존중하며, 적절한 언어 예절을 갖추어 생각이나 의견을 표현하는 것이다. 언어 사용에 있어서 차별이나 편견을 내포하고 있는 표현을 사용하지 않고, 격식과 예절을 갖춘 포용적 언어를 사용하도록 적극 권장한다."]},{"교":"영어","c":"10공영2-01-01","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글에 포함된 세부 정보를 파악한다."},{"교":"영어","c":"10공영2-01-02","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"10공영2-01-03","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글의 분위기나 등장인물의 심정 및 의도 등을 추론한다."},{"교":"영어","c":"10공영2-01-04","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글에 나타난 일이나 사건의 논리적 관계를 파악한다."},{"교":"영어","c":"10공영2-01-05","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글에 포함된 표현의 함축적 의미를 추론한다."},{"교":"영어","c":"10공영2-01-06","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글의 전개 방식이나 구조를 파악한다."},{"교":"영어","c":"10공영2-01-07","과":"공통영어2","학":"고1","영":"이해","p":"다양한 매체의 말이나 글을 비판적으로 이해한다.","h":["이 성취기준은 다양한 매체를 통해 듣거나 읽은 내용에 대한 이해와 가치 판단에 있어서, 주장의 타당성이나 근거의 적절성에 대해 분석하고 정보의 편향성이 있는지 판단하여 내용을 비판적으로 이해하는 것이다. 화자나 필자가 사용하는 표현의 특징이나 전략 등을 파악하고, 다양한 관점이나 가치 기준을 고려하여 듣거나 읽음으로써 내용에 대한 비판적 이해력을 함양한다."]},{"교":"영어","c":"10공영2-01-08","과":"공통영어2","학":"고1","영":"이해","p":"말이나 글의 이해를 위한 적절한 전략을 적용한다."},{"교":"영어","c":"10공영2-02-01","과":"공통영어2","학":"고1","영":"표현","p":"실물, 그림, 사진, 도표 등을 활용하여 내용을 설명한다."},{"교":"영어","c":"10공영2-02-02","과":"공통영어2","학":"고1","영":"표현","p":"사실적 정보나 지식을 말이나 글로 전달한다."},{"교":"영어","c":"10공영2-02-03","과":"공통영어2","학":"고1","영":"표현","p":"경험이나 계획 등을 말하거나 기술한다."},{"교":"영어","c":"10공영2-02-04","과":"공통영어2","학":"고1","영":"표현","p":"자신의 생각이나 의견, 감정, 감상 등을 표현한다."},{"교":"영어","c":"10공영2-02-05","과":"공통영어2","학":"고1","영":"표현","p":"듣거나 읽은 내용을 요약하여 말하거나 기술한다."},{"교":"영어","c":"10공영2-02-06","과":"공통영어2","학":"고1","영":"표현","p":"다양한 소통의 목적에 맞게 말하거나 글로 표현한다.","h":["이 성취기준은 소통하려는 목적과 대상에 맞게 내용과 형식을 갖추어 말이나 글로 표현함으로써 언어를 통한 다양한 의사소통 목적을 달성하는 것이다. 요청, 감사, 신청, 초대, 사과, 제안, 위로 등 다양한 소통 목적에 맞게 소통하는 대상과의 관계를 고려하여 언어 예절을 갖추어 내용을 말하거나 쓴다."]},{"교":"영어","c":"10공영2-02-07","과":"공통영어2","학":"고1","영":"표현","p":"어휘나 표현을 점검하여 내용을 명확하게 전달한다."},{"교":"영어","c":"10공영2-02-08","과":"공통영어2","학":"고1","영":"표현","p":"적절한 전략과 다양한 매체를 활용하여 상황과 목적에 맞게 말하거나 쓴다."},{"교":"영어","c":"10공영2-02-09","과":"공통영어2","학":"고1","영":"표현","p":"다른 사람과 의견을 조율하며 문제 해결을 위해 협력한다.","h":["이 성취기준은 다른 사람과 서로 의견을 교환하고 조율하며 소통을 통해 문제를 해결하는 협력적인 태도를 의미하는 것이다. 다른 사람의 의견을 경청하고 자신의 의견을 논리적으로 제시하며 합의 및 문제 해결에 이르는 과정을 경험함으로써 민주적 의사 결정 과정을 체화한다."]},{"교":"영어","c":"10기영1-01-01","과":"기본영어1","학":"고1","영":"이해","p":"말이나 글의 세부 정보를 파악한다."},{"교":"영어","c":"10기영1-01-02","과":"기본영어1","학":"고1","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"10기영1-01-03","과":"기본영어1","학":"고1","영":"이해","p":"화자나 필자 또는 인물의 의도 및 목적을 파악한다."},{"교":"영어","c":"10기영1-01-04","과":"기본영어1","학":"고1","영":"이해","p":"화자나 필자 또는 인물의 심정이나 태도를 파악한다."},{"교":"영어","c":"10기영1-01-05","과":"기본영어1","학":"고1","영":"이해","p":"말이나 글에 나타난 일이나 사건의 절차나 순서를 파악한다."},{"교":"영어","c":"10기영1-01-06","과":"기본영어1","학":"고1","영":"이해","p":"말이나 글의 전개 방식이나 구조를 파악한다.","h":["이 성취기준은 말이나 글에서 서론, 본론, 결론 등의 구성 체계나 내용의 전개 방식을 파악하는 것을 의미한다. 효과적으로 주제를 전달하기 위해 화자나 필자가 선택하는 서사, 분류, 인과, 정의, 상세화, 예시, 비교, 대조, 문제와 해결 등의 다양한 글의 구조를 이해하게 된다."]},{"교":"영어","c":"10기영1-01-07","과":"기본영어1","학":"고1","영":"이해","p":"적절한 듣기 또는 읽기 전략을 적용하고 성찰한다.","h":["이 성취기준은 청자와 독자로서 상대를 배려하며 적절한 이해 전략을 선택하여 적용할 수 있는 것을 말한다. 이를 위해 청자는 화자가 보여 주는 다양한 소통 방식을 이해하고 존중하는 자세가 필요하며, 독자는 필자의 의도를 이해하기 위해 읽기 과정에서 자신의 읽기 방법을 조정할 필요가 있다. 또한 선택하여 적용한 듣기 및 읽기 전략의 효과를 스스로 성찰하여 더 나은 선택이 무엇인지를 평가한다."]},{"교":"영어","c":"10기영1-01-08","과":"기본영어1","학":"고1","영":"이해","p":"다양한 매체로 듣거나 읽으며 학습 동기를 형성한다.","h":["이 성취기준은 학습자가 다양한 매체를 통해 전달되는 정보나 지식을 듣거나 읽으며 의미를 이해하는 즐거움을 알고, 다양한 자료를 스스로 찾아 듣거나 읽으며 매체를 통해 전달된 정보나 지식을 더 깊이 이해하고자 하는 것을 말한다. 인쇄 매체, 영상 매체, 인터넷 매체, 상호 작용 매체 등을 자기주도적으로 활용하며 학습 동기를 높인다."]},{"교":"영어","c":"10기영1-02-01","과":"기본영어1","학":"고1","영":"표현","p":"실물, 그림, 사진, 도표 등에 포함된 사실적 정보를 설명한다."},{"교":"영어","c":"10기영1-02-02","과":"기본영어1","학":"고1","영":"표현","p":"경험이나 사건을 묘사한다."},{"교":"영어","c":"10기영1-02-03","과":"기본영어1","학":"고1","영":"표현","p":"자신의 의견이나 감정을 표현한다."},{"교":"영어","c":"10기영1-02-04","과":"기본영어1","학":"고1","영":"표현","p":"목적에 적합한 매체를 활용하여 정보를 전달한다.","h":["이 성취기준은 책, 신문, 잡지, 라디오, 사진, 광고, 텔레비전, 인터넷 등과 같이 다양한 메시지를 전달하는 소통 수단이 가진 상호 작용 방식이나 언어적 특징을 고려하여 말이나 글로 정보를 전달하는 것을 말한다. 표현하고자 하는 목적과 의도에 적절한 매체를 선택하고 문자 이외의 시각적 이미지나 도표 등의 배치 방식이 가지는 의미와 적절성도 함께 고려한다."]},{"교":"영어","c":"10기영1-02-05","과":"기본영어1","학":"고1","영":"표현","p":"주어진 서식에 맞게 말하거나 글을 쓸 수 있다.","h":["이 성취기준은 간단한 서식이나 양식이 요구하는 부분을 말하거나 글로 완성하는 것을 의미한다. 학습자는 자기소개서, 신청서, 보고서, 이메일, 댓글 양식 등 일반적으로 통용되는 서식에 맞추어 자신이 표현하고자 하는 내용을 비교적 간략하고 명확하게 말하거나 적는다."]},{"교":"영어","c":"10기영1-02-06","과":"기본영어1","학":"고1","영":"표현","p":"말이나 글의 목적에 맞게 내용이나 표현을 점검하여 고쳐 쓴다.","h":["이 성취기준은 말이나 글의 정확성과 전달력을 높이기 위해 맥락을 고려하여 그 내용과 형식을 점검하고 다시 고쳐 쓰는 것을 의미한다."]},{"교":"영어","c":"10기영1-02-07","과":"기본영어1","학":"고1","영":"표현","p":"적절한 말하기 또는 쓰기 전략을 적용하고 성찰한다.","h":["이 성취기준은 상대방과 소통을 유의미하게 이어가거나 소통하고자 하는 메시지를 효과적으로 전달하면서 제시된 문제를 해결하기 위해 적절한 전략을 활용하는 것을 의미한다. 학습자는 핵심 단어 반복하기, 재구성하기, 우회적으로 표현하기, 쉬운 말로 대체하기, 질문하거나 환기하기, 예시나 근거 들기, 통계 자료 제시하기 등 다양한 소통 목적에 맞게 적절한 전략을 적용하여 말하기 및 쓰기 능력을 향상시키고, 이러한 전략 사용의 효과를 스스로 성찰하고 평가한다."]},{"교":"영어","c":"10기영1-02-08","과":"기본영어1","학":"고1","영":"표현","p":"의사소통 활동에 흥미와 자신감을 가지고 능동적으로 참여한다."},{"교":"영어","c":"10기영2-01-01","과":"기본영어2","학":"고1","영":"이해","p":"말이나 글의 세부 정보를 파악한다."},{"교":"영어","c":"10기영2-01-02","과":"기본영어2","학":"고1","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"10기영2-01-03","과":"기본영어2","학":"고1","영":"이해","p":"화자나 필자 또는 인물의 의도 및 목적을 근거를 찾아 파악한다.","h":["이 성취기준은 듣거나 읽으면서 이해한 정보나 자료 속 화자나 필자 또는 인물의 의도나 목적을 근거와 연관하여 파악할 수 있음을 의미한다."]},{"교":"영어","c":"10기영2-01-04","과":"기본영어2","학":"고1","영":"이해","p":"화자나 필자 또는 인물의 심정이나 태도를 근거를 찾아 파악한다.","h":["이 성취기준은 듣거나 읽으면서 이해한 정보나 자료 속 화자나 필자 또는 인물의 심정이나 태도를 근거와 연관하여 파악할 수 있음을 의미한다. 파악한 정보의 근거를 찾아보는 것이 정확한 이해에 도움이 된다."]},{"교":"영어","c":"10기영2-01-05","과":"기본영어2","학":"고1","영":"이해","p":"말이나 글에 나타난 일이나 사건의 절차나 순서를 파악한다."},{"교":"영어","c":"10기영2-01-06","과":"기본영어2","학":"고1","영":"이해","p":"말이나 글의 전개 구조 및 논리적 관계를 파악한다.","h":["이 성취기준은 말이나 글에서 서론, 본론, 결론의 구성 및 서사, 분류, 인과, 정의, 상세화, 예시, 비교, 대조, 문제와 해결 등의 다양한 구조를 파악하는 것을 의미한다. 또한 말이나 글의 각 부분이 서로 논리적으로 연결되는지를 판단한다."]},{"교":"영어","c":"10기영2-01-07","과":"기본영어2","학":"고1","영":"이해","p":"적절한 듣기 또는 읽기 전략을 적용하고 성찰한다."},{"교":"영어","c":"10기영2-01-08","과":"기본영어2","학":"고1","영":"이해","p":"다양한 매체로 듣거나 읽으며 학습 동기를 형성한다."},{"교":"영어","c":"10기영2-02-01","과":"기본영어2","학":"고1","영":"표현","p":"실물, 그림, 사진, 도표 등에 포함된 사실적 정보를 설명한다."},{"교":"영어","c":"10기영2-02-02","과":"기본영어2","학":"고1","영":"표현","p":"경험이나 사건을 묘사한다."},{"교":"영어","c":"10기영2-02-03","과":"기본영어2","학":"고1","영":"표현","p":"의견이나 감정을 근거를 들어 표현한다.","h":["이 성취기준은 듣거나 읽으면서 이해한 정보나 자료에 대한 의견이나 감정을 근거를 들어 표현할 수 있음을 의미한다. 근거를 바탕으로 의견과 감정을 표현함으로써 객관성과 신뢰성을 높인다."]},{"교":"영어","c":"10기영2-02-04","과":"기본영어2","학":"고1","영":"표현","p":"목적에 적합한 매체를 활용하여 정보를 전달한다."},{"교":"영어","c":"10기영2-02-05","과":"기본영어2","학":"고1","영":"표현","p":"주어진 서식을 활용하여 말하거나 글을 쓴다.","h":["이 성취기준은 서식의 구조에 맞추어 기입한 정보를 재구조화하고 간단하게 요약하여 말하거나 기술하는 것을 의미한다."]},{"교":"영어","c":"10기영2-02-06","과":"기본영어2","학":"고1","영":"표현","p":"말이나 글의 목적에 맞게 내용이나 표현을 점검하여 고쳐 쓴다."},{"교":"영어","c":"10기영2-02-07","과":"기본영어2","학":"고1","영":"표현","p":"적절한 말하기 또는 쓰기 전략을 적용하고 성찰한다."},{"교":"영어","c":"10기영2-02-08","과":"기본영어2","학":"고1","영":"표현","p":"의사소통 활동에 흥미와 자신감을 가지고 능동적으로 참여한다.","h":["이 성취기준은 상대의 입장과 감정을 고려하고 공감하는 자세로 생각과 느낌을 공유하면서 소통의 즐거움을 깨닫고 능동적으로 의사소통에 참여하는 것을 의미한다. 실수를 두려워하지 않고 자신 있게 생각이나 감정을 표현하고 열린 마음으로 타인 및 대상과 소통하는 태도를 기른다."]},{"교":"영어","c":"12영Ⅰ-01-01","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"말이나 글의 세부 정보를 파악한다."},{"교":"영어","c":"12영Ⅰ-01-02","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"12영Ⅰ-01-03","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"화자나 필자의 심정이나 의도를 추론한다."},{"교":"영어","c":"12영Ⅰ-01-04","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"말이나 글에서 일이나 사건의 논리적 관계를 파악한다.","h":["이 성취기준은 말이나 글에 나타난 일이나 사건의 시간적 순서나 절차 또는 원인과 결과 등의 논리적 관계를 파악하기 위한 것이다. 말이나 글에 나타난 상황이나 맥락을 바탕으로 전후 관계, 인과 관계, 비교⋅대조 관계, 보충 또는 부연 관계 등과 같은 다양한 논리적 관계를 파악하여 말이나 글의 전체적인 내용을 논리적으로 이해하는 것을 의미한다."]},{"교":"영어","c":"12영Ⅰ-01-05","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"말이나 글의 맥락을 바탕으로 어구나 문장의 함축적 의미를 추론한다.","h":["이 성취기준은 말이나 글의 흐름을 바탕으로 문맥을 통해 어구나 문장 단위에서 내포하고 있는 함축적 의미를 추론하기 위한 것이다. 낯선 단어나 관용 표현의 의미를 문화적 배경지식을 통해 추론하거나, 명시적으로 드러난 어구나 문장과 비교하면서 전체적인 맥락 속에서 함축된 의미를 추론하는 것을 의미한다."]},{"교":"영어","c":"12영Ⅰ-01-06","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"말이나 글의 전개 방식이나 구조를 파악한다.","h":["이 성취기준은 말과 글의 내용을 효과적으로 파악하기 위해 말이나 글을 구성하고 있는 구조를 이해하고 내용의 전개 방식을 파악하기 위한 것이다. 말이나 글의 흐름에 따라 서론, 본론, 결론 등의 전개 방식을 이해하고 주제문, 예시문, 연결어 등의 사용을 확인함으로써 다양한 형식으로 전개되는 전형적인 말이나 글의 내용을 효과적으로 파악한다.","과 같이 글의 내용 전개 방식이나 구조를 파악하는 성취기준을 위한 읽기 활동에서는 다양한 형식으로 드러나는 전형적인 글(기사, 연설문, 편지글, 홍보 글, 인터넷 게시 글, 칼럼, 보고서, 소설, 에세이 등)을 활용할 수 있다."]},{"교":"영어","c":"12영Ⅰ-01-07","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"적절한 전략을 활용하여 다양한 매체로 된 말이나 글의 의미를 파악한다.","h":["이 성취기준은 매체의 특성을 이해하고 그에 맞는 적절한 듣기 또는 읽기 전략을 활용하여 다양한 매체로 된 말이나 글의 의미를 파악하기 위한 것이다. 텔레비전, 라디오, 안내 방송, 인터넷 영상, 사회 관계망 서비스(SNS) 등의 다양한 매체를 통해 전달되는 말이나 대화에서 화자와 청자의 관계, 발화의 내용 등에 따른 듣기 전략이나, 글의 종류 및 목적에 따른 다양한 읽기 전략을 적용하고 매체나 전략의 효과를 스스로 평가해 봄으로써 말이나 글의 내용을 보다 효과적으로 파악하는 것을 의미한다.","이나 [12영Ⅰ-01-08]과 같이 전략 및 문화의 차이를 강조하는 성취기준은 다른 성취기준과 결합하고 재구성하여 교수⋅학습 및 평가에 효과적으로 적용할 수 있다. 예를 들어 [12영Ⅰ-01-03]의 화자의 심정이나 의도를 추론하는 성취기준과 [12영Ⅰ-01-07]의 듣기 전략 적용 성취기준을 결합하여 명시적으로 드러난 핵심 단어나 표현에 초점을 두어 화자의 심정이나 의도를 추론하는 전략을 지도하고 평가할 수 있다."]},{"교":"영어","c":"12영Ⅰ-01-08","과":"영어Ⅰ","학":"고2~3","영":"이해","p":"우리 문화 및 타 문화의 다양한 관점에 대해 포용하고 공감하는 태도를 가진다.","h":["이 성취기준은 말이나 글에 나타난 우리 문화 및 타 문화에 대한 화자나 필자의 다양한 관점을 존중하고 포용하며 듣기나 읽기 활동에 참여하는 태도에 관한 것이다. 언어적인 지식뿐만 아니라 언어에 수반된 사회⋅문화적 배경지식을 이해하고 문화 간 차이를 열린 마음으로 수용하는 태도로 듣기와 읽기 활동에 참여함으로써, 다양한 문화에 대한 공감 능력과 문화적 감수성을 기르기 위한 것이다."]},{"교":"영어","c":"12영Ⅰ-02-01","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"사실적 정보를 말이나 글로 설명한다.","h":["이 성취기준은 그림, 사진, 도표 등의 시각 자료의 세부 내용에 대한 사실적 정보를 영어로 설명하기 위한 것이다. 사회생활이나 학업에서 학습자가 자주 접하는 다양한 자료에 대해 한두 문장에서 한 문단 정도의 말이나 글로 설명함으로써 시각 자료에 대한 정보를 전달하는 것을 의미한다."]},{"교":"영어","c":"12영Ⅰ-02-02","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"경험이나 계획 또는 일이나 사건을 말이나 글로 설명한다."},{"교":"영어","c":"12영Ⅰ-02-03","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"상대방을 배려하고 존중하는 태도로 자신의 의견이나 감정을 표현한다."},{"교":"영어","c":"12영Ⅰ-02-04","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"듣거나 읽은 내용을 말이나 글로 요약한다."},{"교":"영어","c":"12영Ⅰ-02-05","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"서신, 신청서, 지원서 등의 서식을 목적에 맞게 작성한다.","h":["이 성취기준은 글의 목적에 따라 필요한 형식과 구조를 갖추어 서식에 맞는 글을 쓰기 위한 것이다. 지원서, 보고서, 자기소개서 등과 같이 실용적인 목적이나 진로와 연관된 서식 작성의 기본 구조와 작성법을 익히고, 다양한 목적과 상황에 맞는 용어를 적절히 사용하여 서식을 작성한다."]},{"교":"영어","c":"12영Ⅰ-02-06","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"글의 구조나 내용 및 표현을 점검하고 쓰기 윤리를 준수하여 고쳐 쓴다.","h":["이 성취기준은 쓰기 활동에서 글의 목적에 맞게 쓴 글을 검토하고 수정하여 고쳐 쓰기 위한 것이다. 학습자는 글의 의미를 명확하게 표현할 수 있도록 전체적인 내용이나 구조, 표현, 어휘 등의 적절성에 대해 스스로 점검하고, 교사나 동료의 피드백을 반영하면서 쓰기 윤리를 준수하여 책임감 있게 글을 고쳐 쓴다."]},{"교":"영어","c":"12영Ⅰ-02-07","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"다양한 매체와 적절한 전략을 활용하여 정보를 창의적으로 전달한다.","h":["이 성취기준은 학습자가 상대방에게 정보를 설명할 때 다양한 매체나 적절한 말하기 또는 쓰기 전략을 활용하여 창의적인 방법으로 정보를 전달하기 위한 것이다. 학습자는 책, 신문, 방송, 동영상, 인터넷, 사회 관계망 서비스(SNS) 등의 매체를 활용하거나 재구성하기, 자신의 언어로 표현하기, 우회적으로 표현하기 등의 전략을 창의적으로 활용하여 정보를 효과적으로 설명하게 된다.","과 같이 전략 활용에 대한 성취기준을 적용하는 말하기 활동에서는 언어적 의사소통 전략(풀어서 말하기, 자기 말로 바꾸어 말하기, 재구성하기, 우회적으로 표현하기, 쉬운 말로 대체하기, 반복하여 말하기 등)뿐만 아니라 다양한 문화권의 비언어적 의사소통 전략도 함께 지도하여 언어⋅문화적 배경이 다른 청자와 자신감 있게 소통하는 태도를 보일 수 있도록 지도한다."]},{"교":"영어","c":"12영Ⅰ-02-08","과":"영어Ⅰ","학":"고2~3","영":"표현","p":"협력적이고 능동적으로 말하기나 쓰기 과업을 수행한다.","h":["이 성취기준은 사회생활이나 학업 관련 등 일반적 주제에 관하여 묻고 답하는 말하기 활동이나 의견 교환을 위한 쓰기 활동에서 협력적이고 능동적으로 상호 작용하는 활동에 참여하는 태도에 대한 것이다. 학습자가 생각과 느낌을 공유하고 의견을 교환하는 활동에서 상대를 배려하고 존중하는 태도로 자신의 의견을 제시하고 상호 협력적으로 과제 수행에 참여하는 것을 의미한다."]},{"교":"영어","c":"12영Ⅱ-01-01","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"다양한 주제에 대한 말이나 글의 세부 정보를 파악한다."},{"교":"영어","c":"12영Ⅱ-01-02","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"말이나 글의 주제나 요지를 파악한다."},{"교":"영어","c":"12영Ⅱ-01-03","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"말이나 글에 나타난 화자, 필자, 인물 등의 심정이나 의도를 추론한다.","h":["이 성취기준은 전반적인 상황과 맥락을 이해하면서 말이나 글에 명시적으로 드러나지 않은 화자, 필자, 인물 등의 심정이나 어조, 의도나 목적을 추론하는 것이다. 다양한 의견이나 감정에 대해 공감하는 포용적인 태도로 화자나 필자의 소통 방식과 행동, 성격, 억양, 표현, 태도 등을 통해 심정이나 어조를 파악하고, 말이나 글에 나타난 관점을 바탕으로 상황, 동기, 맥락 등을 종합적으로 고려하여 의도나 목적을 적절하게 파악한다."]},{"교":"영어","c":"12영Ⅱ-01-04","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"말이나 글에서 일이나 사건의 논리적 관계를 추론한다.","h":["이 성취기준은 말이나 글의 내용의 흐름에 초점을 두어 일이나 사건의 절차나 순서, 또는 원인과 결과 등의 논리적 관계를 추론하는 것이다. 담화의 상황이나 맥락을 전반적으로 이해하면서 사건의 인과 관계, 인물 간의 관계, 담화가 전개되는 순서 등을 바탕으로 하여 의미를 논리적으로 분석한다."]},{"교":"영어","c":"12영Ⅱ-01-05","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"말이나 글의 맥락을 바탕으로 함축된 의미를 추론한다.","h":["이 성취기준은 말이나 글에 사용된 표현과 문장에서 명시적인 의미로 파악되지 않는 함축적인 의미를 문맥이나 말 전체의 흐름을 통해 추론하는 것이다. 학습자는 주제를 파악하고 함축적이거나 비유적인 언어 사용을 이해하여 내용을 재구성하며 맥락을 바탕으로 생략되거나 숨겨진 의미를 파악하는 등의 능동적인 이해 태도를 기른다."]},{"교":"영어","c":"12영Ⅱ-01-06","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"다양한 유형의 말이나 글의 전개 방식이나 구조를 파악한다.","h":["이 성취기준은 다양한 유형 및 장르의 말이나 글에 사용되는 전개 방식과 구조에 관심을 두고 분석하여 담화에 대한 이해도를 높이는 것을 의미한다. 학습자는 다양한 장르에 드러나는 전형적인 말이나 글의 구조를 파악하고 분석하는 능력을 길러 효과적으로 내용을 이해한다."]},{"교":"영어","c":"12영Ⅱ-01-07","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"적절한 전략을 적용하여 다양한 매체 자료의 말이나 글을 이해한다.","h":["이 성취기준은 다양한 매체의 특성과 목적에 대한 이해를 바탕으로 적절한 듣기 또는 읽기 전략을 적용하여 매체로 전달되는 정보를 이해하는 것이다. 예를 들어 텔레비전, 라디오, 책, 신문, 이메일, 영화, 소셜 미디어, 온라인 콘텐츠 등 다양한 매체의 구조와 표현 방식에 대한 이해를 바탕으로 매체로 표현된 내용을 추측하기, 담화 표지 파악하기 등의 적절한 전략을 사용하여 파악한다."]},{"교":"영어","c":"12영Ⅱ-01-08","과":"영어Ⅱ","학":"고2~3","영":"이해","p":"다양한 문화와 관점에 대해 포용하고 공감하는 태도를 가진다.","h":["이 성취기준은 말이나 글에 나타난 다양한 문화권의 언어적⋅비언어적 의사소통 방식과 사고방식에 대해 포용적으로 공감하는 태도를 갖는 것이다. 학습자는 의사소통 방식의 차이점을 깨닫고 열린 마음으로 수용하며 소통할 수 있는 세계시민으로서의 역량을 기른다."]},{"교":"영어","c":"12영Ⅱ-02-01","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"다양한 주제에 대한 사실적 정보를 말이나 글로 설명한다."},{"교":"영어","c":"12영Ⅱ-02-02","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"지식과 경험을 활용하여 자신의 감상이나 느낌을 표현한다."},{"교":"영어","c":"12영Ⅱ-02-03","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"상대방을 배려하고 존중하는 태도로 자신의 의견이나 주장을 제시한다.","h":["이 성취기준은 개인, 집단, 공동체의 사안이나 문제에 대해 의문점이나 해결책을 찾기 위해 소통하는 과정에서 상대방을 배려하고 존중하는 태도로 자신의 의견이나 주장을 제시하는 것이다. 주제에 대한 이해를 바탕으로 하여 다양성을 존중하는 태도를 가지고 여러 의견을 조율하고 종합하여 자신의 의견이나 주장을 제시한다."]},{"교":"영어","c":"12영Ⅱ-02-04","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"다양한 주제에 대해 듣거나 읽은 내용을 재구성하여 요약한다."},{"교":"영어","c":"12영Ⅱ-02-05","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"적절한 전략을 활용하여 논리적으로 대상을 설득한다.","h":["이 성취기준은 다양한 주제에 관한 주장⋅연설이나 논설⋅사설 등과 같이 의견을 제시하는 것으로, 언어적⋅비언어적 의사소통 방식의 적절한 말하기 또는 쓰기 전략을 활용하여 논리적으로 대상을 설득하는 것을 의미한다. 대상과 주제에 대한 이해를 바탕으로 논제에 부합하는 분명한 관점을 견지하면서 타당한 내용을 논거로 제시하고 설득력 있는 전개로 대상을 설득한다."]},{"교":"영어","c":"12영Ⅱ-02-06","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"자기소개서, 이력서, 보고서 등의 서식을 목적에 맞게 작성한다."},{"교":"영어","c":"12영Ⅱ-02-07","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"글을 쓰는 과정에서 글의 내용과 형식을 점검하고 쓰기 윤리를 준수하여 고쳐 쓴다.","h":["이 성취기준은 과정 중심 글쓰기 접근법을 기반으로, 계획을 세워 글을 쓴 후 스스로의 점검과 교사나 동료의 피드백을 반영하여 쓰기 윤리를 준수하면서 글의 내용과 형식을 고쳐 쓰는 것이다. 글의 목적과 내용에 맞게 논리적이고 명확한 표현으로 글의 완성도를 높이고 쓰기 윤리를 준수하여 책임감을 가지고 쓰기 활동에 임하는 것이다."]},{"교":"영어","c":"12영Ⅱ-02-08","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"다양한 매체를 활용하여 정보를 창의적이고 효과적으로 전달한다.","h":["이 성취기준은 전달 내용의 목적, 형식, 방법 등을 이해하고 다양한 매체를 활용하여 주요 내용을 자신만의 방법으로 효과적으로 전달하는 것이다. 정보 전달 과정에서 청자나 독자의 특징과 반응을 고려하여 적절한 내용을 선정하고, 다양한 매체를 사용할 수 있는 디지털 리터러시를 기른다."]},{"교":"영어","c":"12영Ⅱ-02-09","과":"영어Ⅱ","학":"고2~3","영":"표현","p":"원활한 의견 교환을 위해 협력적이고 능동적으로 의사소통 활동에 참여한다."},{"교":"영어","c":"12영독01-01","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 세부 정보를 파악한다."},{"교":"영어","c":"12영독01-02","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 주제나 요지를 파악한다."},{"교":"영어","c":"12영독01-03","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"화자나 필자의 심정이나 의도를 추론한다.","h":["이 성취기준은 글의 맥락이나 흐름을 통해 명시적으로 드러나지 않은 화자나 필자 또는 글 속 인물의 심정이나 어조, 의도나 목적을 추론하는 것이다. 학습자는 글의 분위기나 상황 등 글에 나타난 맥락을 파악하여 타인의 다양한 의견이나 감정을 이해하고 공감하는 태도를 갖춘다."]},{"교":"영어","c":"12영독01-04","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 구조를 고려하여 내용의 논리적 관계를 파악한다.","h":["이 성취기준은 글에 기술된 사건의 시간 및 순서, 전후 관계, 인과 관계, 비교⋅대조 관계 등을 분석하여 글의 논리적 관계를 파악하는 것이다. 학습자는 글의 내용 흐름에 따라 다양한 논리적 관계를 분석하고 종합적으로 이해하는 능력을 기른다."]},{"교":"영어","c":"12영독01-05","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 맥락과 배경지식을 활용하여 함축적 의미를 추론한다.","h":["이 성취기준은 글을 읽고 문자적인 의미뿐만 아니라, 문맥상 내포되어 있는 의미를 추론하는 것이다. 학습자는 명시적으로 드러나지 않은 어구, 문장, 관용 표현 등을 추론하는 활동을 함으로써 문학적⋅창의적 표현을 이해하고 공감하는 능력을 기른다."]},{"교":"영어","c":"12영독01-06","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 전개 방식이나 구조를 파악한다."},{"교":"영어","c":"12영독01-07","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 매체로 표현된 정보를 파악한다.","h":["이 성취기준은 다양한 매체의 특성을 이해하고 매체를 통해 전달된 정보를 파악하는 것이다. 학습자는 책, 신문, 소셜 미디어, 광고 등 다양한 매체에서 나타나는 형식과 구조, 표현 방식 등을 이해함으로써 매체로 표현된 정보의 내용을 파악한다."]},{"교":"영어","c":"12영독01-08","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 의견과 문화에 대한 공감적 이해와 포용적 태도를 가진다.","h":["이 성취기준은 글에 나타난 다양한 의견, 문화, 관점 등에 대해 공감적으로 이해하는 것이다. 학습자는 글을 읽으면서 언어 지식뿐만 아니라 사회⋅문화적 배경지식을 이해하고 수용함으로써 포용적 태도와 문화적 감수성을 기른다."]},{"교":"영어","c":"12영독01-09","과":"영어 독해와 작문","학":"고2~3","영":"독해","p":"적절한 읽기 전략을 적용하여 자기주도적으로 읽기 활동에 참여한다.","h":["이 성취기준은 글의 유형과 글을 읽는 목적에 따라 적절한 읽기 전략을 적용하여 읽기를 효율적으로 수행하는 것이다. 학습자는 읽기 전략을 계획하고 실행하면서 자기주도적 읽기 활동에 보다 적극적으로 참여한다."]},{"교":"영어","c":"12영독02-01","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 주제에 대한 사실적 정보를 글로 설명한다."},{"교":"영어","c":"12영독02-02","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"자신의 경험이나 계획, 사건을 글로 설명한다."},{"교":"영어","c":"12영독02-03","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"포용적 태도로 자신의 의견이나 감정을 제시한다."},{"교":"영어","c":"12영독02-04","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"읽은 내용을 재구성하여 요약한다.","h":["이 성취기준은 읽은 내용에 대해 주제 및 요지, 필자의 의도나 목적 등을 파악하여 요약하는 것으로, 핵심이 되는 내용을 바탕으로 주제가 잘 드러나도록 재구성하여 글을 쓰는 것이다. 이는 글에 대한 전반적인 이해 수준을 파악할 수 있으며, 학습자는 다양한 일상적인 자료나 매체에서 접하게 되는 내용을 주제 및 요지 등이 포함되도록 논리적으로 조직하고 표현하는 활동에 참여한다."]},{"교":"영어","c":"12영독02-05","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"자기소개서, 이력서, 이메일 등의 서식을 목적과 형식에 맞게 작성한다.","h":["이 성취기준은 자기소개서, 이력서, 이메일 등의 서식을 목적 및 형식에 맞게 작성하는 것이다. 학습자는 다양한 목적과 상황, 전달 매체에 맞는 글쓰기 활동을 통해 의미를 구성하고 상대방과의 관계를 반영하여 올바른 의미를 전달할 수 있는 사회적 상호 작용으로서의 쓰기 활동에 참여한다."]},{"교":"영어","c":"12영독02-06","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"내용이나 형식에 맞게 점검하고 쓰기 윤리를 준수하여 고쳐 쓴다.","h":["이 성취기준은 교사, 동료, 스스로의 점검 등을 통해 글을 반복적으로 검토하고 수정하는 과정을 중심으로 완성된 글을 쓰는 것이다. 학습자는 언어 형식, 글의 구조, 전개 방식 등을 스스로의 점검, 교사, 동료의 피드백을 통해 자신의 논지나 관점에 부합하도록 재구성하고 쓰기 윤리를 준수하여 글을 쓰는 능력을 기른다."]},{"교":"영어","c":"12영독02-07","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 매체를 활용하여 형식 및 목적에 맞게 정보를 전달한다.","h":["이 성취기준은 인쇄물, 영상, 온라인 매체 등의 특성을 이해하고 다양한 매체를 활용하여 형식 및 목적 등에 맞게 정보를 전달하는 것이다. 학습자는 독자의 특성과 반응을 고려하여 적절한 내용과 매체를 선정할 수 있는 능력과 다양한 매체를 활용할 수 있는 디지털 리터러시를 기른다."]},{"교":"영어","c":"12영독02-08","과":"영어 독해와 작문","학":"고2~3","영":"작문","p":"적절한 쓰기 전략을 적용하여 자기주도적으로 쓰기 활동에 참여한다."},{"교":"영어","c":"12직영01-01","과":"직무 영어","학":"고2~3","영":"","p":"진로 및 직무 관련 주제에 관하여 주요 내용을 파악한다."},{"교":"영어","c":"12직영01-02","과":"직무 영어","학":"고2~3","영":"","p":"직무 수행과 관련된 말이나 대화를 듣고 상황 및 화자 간의 관계를 파악한다.","h":["이 성취기준은 다양한 직무 수행과 관련된 말이나 대화를 듣고 주어진 맥락을 통해 말이나 대화의 상황이나 화자 간의 관계를 파악하는 것이다. 학습자는 상황이나 화자 간의 관계를 파악할 수 있는 단서를 맥락 속에서 찾아낼 수 있다."]},{"교":"영어","c":"12직영01-03","과":"직무 영어","학":"고2~3","영":"","p":"진로 탐색 및 직무 수행과 관련된 일이나 사건의 절차나 순서를 파악한다.","h":["이 성취기준은 진로 탐색 및 직무 수행에 관한 말을 듣거나 글을 읽고 일이나 사건을 절차나 순서에 맞게 배열하거나 인과 관계 등을 파악하는 것이다. 학습자는 말과 글의 전개 방식, 지시어나 연결어 등을 파악하여 그 구조를 이해할 수 있다."]},{"교":"영어","c":"12직영01-04","과":"직무 영어","학":"고2~3","영":"","p":"직무 수행과 관련된 정보에 대해 적절한 의사소통 전략을 적용하여 묻고 답한다.","h":["이 성취기준은 다양한 직무 수행 상황에서 적절한 의사소통 전략을 적용하여 상대방 또는 여러 사람과 정보에 대해 묻고 답하면서 상호 작용하는 것이다. 학습자는 효과적인 의사소통을 하기 위해 생략하기, 풀어서 말하기, 재구성하기, 우회적으로 표현하기, 쉬운 말로 대체하기, 반복하기 등의 적절한 의사소통 전략을 사용한다."]},{"교":"영어","c":"12직영01-05","과":"직무 영어","학":"고2~3","영":"","p":"직무 수행과 관련된 사실적 정보를 다양한 매체를 활용하여 재구성하여 전달한다.","h":["이 성취기준은 직무 수행과 관련된 사실적 정보를 전달할 때 다양한 매체를 직무 상황에 응용하여 내용의 전달력을 높이는 것이다. 학습자는 사진, 도표, 뉴스, 신문 기사, 동영상 등의 매체를 활용하여 주어진 상황이나 목적에 맞게 정보를 체계적으로 재구성하고 적절한 어휘와 표현을 사용하여 그 정보를 전달한다."]},{"교":"영어","c":"12직영01-06","과":"직무 영어","학":"고2~3","영":"","p":"진로 탐색 및 직무 수행 상황이나 목적에 맞는 서식의 글을 작성한다.","h":["이 성취기준은 진로 탐색 및 직무 수행에서 상황과 목적에 맞는 서식의 글을 작성하는 것이다. 학습자는 글을 쓰는 목적과 상황에 적합한 어휘나 표현을 활용하고 적절한 쓰기 전략을 적용하여 이메일, 안내문, 경고문, 광고, 메모, 자기소개서, 이력서, 계획서, 보고서, 게시 글 등 다양한 유형의 글을 작성한다."]},{"교":"영어","c":"12직영01-07","과":"직무 영어","학":"고2~3","영":"","p":"직무와 관련된 문화의 다양성에 대해 공감하며 협력적으로 소통하는 태도를 가진다.","h":["이 성취기준은 직무 상황에서 다양한 문화에 대해 이해하고 존중하는 협력적인 태도를 함양하는 것이다. 학습자는 언어⋅문화적 배경이 다른 사람과 의사소통하는 직무 상황에서 타 문화에 대해 이해하고 문화 다양성을 존중하며 공감하는 태도를 지닌다."]},{"교":"영어","c":"12직영01-08","과":"직무 영어","학":"고2~3","영":"","p":"직무 의사소통과 관련하여 개인의 권리와 정보 보안에 대한 책무성을 인식한다.","h":["이 성취기준은 직무 의사소통 상황에서 개인의 정보 보안 의무를 준수하고 정보 윤리의 책무성을 인식하는 것이다."]},{"교":"영어","c":"12영발01-01","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"발표의 목적과 맥락에 맞게 정보를 수집하고 발표 개요를 준비한다."},{"교":"영어","c":"12영발01-02","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"자신이 경험한 일화나 듣거나 읽은 이야기를 이야기 구조에 맞게 소개한다.","h":["이 성취기준은 배경, 등장인물, 목적, 갈등, 결말의 이야기 구조에 맞추어 일화를 스토리텔링(storytelling) 형식으로 발표하는 것을 의미한다. 학습자는 비유, 과장, 반복, 리듬, 의성어 등의 수사법과 대화체 등을 활용하여 생동감 있게 상황을 묘사하며 이야기를 전달한다."]},{"교":"영어","c":"12영발01-03","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"사물, 개념, 방법, 절차, 통계 자료 등에 대한 사실적 정보를 설명한다.","h":["이 성취기준은 다양한 사실적 정보의 세부 내용을 설명하는 ‘정보 전달 연설’ 형태로 발표하는 것이다. 학습자는 사물이나 개념, 그림, 사진, 도표 등의 정보를 전달하거나 일이나 과업의 수행 방법이나 절차를 객관적으로 설명한다."]},{"교":"영어","c":"12영발01-04","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"사실, 가치, 정책 등에 대한 자신의 관점을 설득력 있게 전달한다.","h":["이 성취기준은 자신의 생각이나 의견을 상대방에게 주장하거나 설득하는 ‘설득적 연설’ 형태로 발표하는 것이다. 학습자는 자신의 관점이나 주장을 명확하게 제시하고 그것을 뒷받침할 수 있는 타당한 논거를 제시하며 설득력 있는 표현 전략을 활용하여 청중을 설득한다. 설득의 전략으로 이성, 감성, 인성에 호소하는 방식을 적용하여 자신의 주장을 효과적으로 전달한다."]},{"교":"영어","c":"12영발01-05","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"다양한 매체를 활용하여 정보 윤리를 준수하며 발표한다.","h":["이 성취기준은 주제와 관련된 적절한 매체를 선택하여 발표에 응용함으로써 내용의 전달력을 높이는 능력을 기르기 위한 것이다. 학습자는 효과적인 발표를 위해 사진, 도표, 뉴스, 신문 기사, 동영상 등의 매체를 통해 주제와 목적에 맞는 자료를 검색⋅수집하고 정리하는 활동을 한다. 이때 인용한 내용의 출처를 정확하게 언급하고 적절한 인용 방식을 취함으로써 표절 예방을 위한 정보 윤리 의식을 기른다."]},{"교":"영어","c":"12영발01-06","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"문화 간 다양한 언어적⋅비언어적 의사소통 방식을 이해하고 적용한다.","h":["이 성취기준은 다양한 문화에서 사용되는 언어적⋅비언어적 의사소통 방식의 차이를 이해하여 효과적인 의사소통을 제고하는 것이다. 학습자가 여러 문화권에서 사용하는 영어의 다양한 억양과 비언어적 특징을 접하며 다양성을 인식하고 존중하는 태도를 기름으로써 세계 영어의 다양성을 포용하는 세계시민으로서의 소양을 갖추는 것을 의미한다."]},{"교":"영어","c":"12영발01-07","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"적절한 발표 기법 및 의사소통 전략을 적용한다.","h":["이 성취기준은 화제의 전환을 유도하는 담화 표지를 사용하고 적절한 발표 전략을 활용하여 효과적으로 자신의 생각이나 의견을 전달하는 것이다. 화제의 전환, 맺음말 등을 유도하는 담화 표지 사용하기 및 바꿔 말하기, 핵심어 강조하기, 관용구 사용, 비언어적 의사소통 방식 사용하기 등의 발표 전략을 활용하여 학습자가 효과적으로 자신의 생각이나 의견을 전달하는 것을 의미한다."]},{"교":"영어","c":"12영발01-08","과":"영어 발표와 토론","학":"고2~3","영":"발표","p":"발표 과정 및 결과에 대해서 평가하고 비판적으로 성찰한다."},{"교":"영어","c":"12영발02-01","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"토론의 목적과 맥락에 맞게 정보를 수집하고 토론 개요를 준비한다."},{"교":"영어","c":"12영발02-02","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"학술 자료, 통계, 사례 등 주장에 대한 근거를 설명한다."},{"교":"영어","c":"12영발02-03","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"토론 논제에 대한 자신의 관점을 설득력 있게 전달한다.","h":["이 성취기준은 논제에 대한 입장을 정하고 주장을 뒷받침할 만한 타당한 논리적 근거를 찾아 자신의 의견을 설득력 있게 전달하는 것이다. 설득의 전략으로 이성, 감성, 인성에 호소하는 방식을 적용하여 자신의 주장을 효과적으로 전달한다."]},{"교":"영어","c":"12영발02-04","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"상대방 주장의 논리를 분석하여 반대 심문하며 토론한다.","h":["이 성취기준은 다양한 주제에 관하여 상대방의 주장을 비판적으로 분석⋅평가하고 논리적으로 반박하며 토의⋅토론하는 것을 의미한다. 학습자는 상대방의 주장에서 논리적 오류를 찾아내고 반박함으로써 비판적으로 토의⋅토론한다."]},{"교":"영어","c":"12영발02-05","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"다양한 매체를 활용하여 정보 윤리를 준수하며 토론한다."},{"교":"영어","c":"12영발02-06","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"문화 간 다양한 언어적⋅비언어적 의사소통 방식을 이해하고 적용한다."},{"교":"영어","c":"12영발02-07","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"적절한 토론 기법 및 의사소통 전략을 적용한다.","h":["이 성취기준은 입론, 질문, 반론, 최종 발언 등에 해당하는 적절한 토론 절차와 효과적인 의사소통 전략을 적용하여 토의⋅토론하는 것이다. 화제의 전환이나 맺음말 등을 유도하는 담화 표지 사용하기 및 바꿔 말하기, 핵심어 강조하기, 비언어적 의사소통 방식 사용하기 등의 전략을 활용하여 학습자가 효과적으로 자신의 생각이나 의견을 전달하는 것을 의미한다."]},{"교":"영어","c":"12영발02-08","과":"영어 발표와 토론","학":"고2~3","영":"토론","p":"토론 과정 및 결과에 대해서 평가하고 비판적으로 성찰한다."},{"교":"영어","c":"12심영01-01","과":"심화 영어","학":"고2~3","영":"이해","p":"다양한 주제나 기초 학문 분야 주제의 말이나 글의 주요 내용을 파악한다."},{"교":"영어","c":"12심영01-02","과":"심화 영어","학":"고2~3","영":"이해","p":"다양한 장르의 말이나 글에서 화자, 필자, 등장인물 등의 심정이나 의도를 추론한다."},{"교":"영어","c":"12심영01-03","과":"심화 영어","학":"고2~3","영":"이해","p":"다양한 장르의 말이나 글을 듣거나 읽고 이어질 내용을 예측한다.","h":["이 성취기준은 말을 듣거나 글을 읽고 뒤에 이어질 내용에 대해 추론하는 것이다. 말이나 글의 상황이나 맥락, 화자나 필자의 의도를 이해하여 다음에 이어질 내용을 예측함으로써 전체의 흐름을 파악한다."]},{"교":"영어","c":"12심영01-04","과":"심화 영어","학":"고2~3","영":"이해","p":"말이나 글의 구성 방식을 파악하여 내용의 논리적 관계를 추론한다."},{"교":"영어","c":"12심영01-05","과":"심화 영어","학":"고2~3","영":"이해","p":"말이나 글로 표현된 어휘, 어구, 문장의 함축적 의미를 맥락에 맞게 추론한다."},{"교":"영어","c":"12심영01-06","과":"심화 영어","학":"고2~3","영":"이해","p":"다양한 매체의 말이나 글에 표현된 의견이나 주장을 비판적으로 평가한다.","h":["이 성취기준은 다양한 매체를 통해 표현된 말이나 글의 내용을 타당성, 신뢰성, 객관성 등을 고려하여 비판적인 시각으로 평가하는 것이다. 말이나 글에 나타난 사실과 의견을 구분하고 화자나 필자의 가치관과 태도를 분석⋅평가하며 다양한 관점으로 말과 글을 재구성하여 비판적으로 해석한다."]},{"교":"영어","c":"12심영01-07","과":"심화 영어","학":"고2~3","영":"이해","p":"우리 문화 및 타 문화의 생활 양식, 사고방식, 의사소통 방식에 관한 말이나 글을 듣거나 읽고 문화의 다양성에 대한 포용적인 태도를 기른다.","h":["이 성취기준은 문화 간 차이에서 오는 의사소통 방식, 생활 양식, 사고방식의 차이를 이해하고 문화의 다양성을 존중하는 포용적인 태도를 통해 세계시민으로서의 소양을 함양하기 위한 것이다."]},{"교":"영어","c":"12심영01-08","과":"심화 영어","학":"고2~3","영":"이해","p":"적절한 전략을 적용하여 다양한 매체로 표현된 말이나 글을 이해한다.","h":["이 성취기준은 다양한 매체의 특성에 따라 적절한 듣기 또는 읽기 전략을 사용하여 매체로 표현된 말이나 글의 내용을 이해하는 것이다. 학습자는 책, 신문, 잡지, 텔레비전, 라디오, 인터넷 등 다양한 매체의 자료가 가진 특성과 목적에 따라 적절한 전략을 활용하여 매체가 전달하는 내용을 파악한다."]},{"교":"영어","c":"12심영02-01","과":"심화 영어","학":"고2~3","영":"표현","p":"사실적 정보를 기술하거나 설명한다."},{"교":"영어","c":"12심영02-02","과":"심화 영어","학":"고2~3","영":"표현","p":"다양한 장르의 글을 읽고 자신의 감상이나 느낌을 표현한다.","h":["이 성취기준은 다양한 장르의 글을 읽고 자신의 감상, 느낌, 생각 등을 적절한 어휘와 언어 형식을 사용하여 말이나 글로 표현하는 것이다. 학습자는 인상적인 내용 또는 기억에 남는 장면이나 사건에 대해 근거를 들어 자신의 감상, 느낌, 생각 등을 말이나 글로 표현한다."]},{"교":"영어","c":"12심영02-03","과":"심화 영어","학":"고2~3","영":"표현","p":"상대방의 의사소통 방식을 고려하여 의견을 조정하며 토의한다.","h":["이 성취기준은 다양한 주제에 관하여 토의하면서 자신의 생각이나 의견을 상대방과 교환하고 협력적으로 의견을 조정하며 의사소통하는 것이다. 학습자는 사실적인 내용에 근거해서 말하고 수용적인 태도로 상대방의 의견을 듣고 조정하여 전달하는 능력을 기른다."]},{"교":"영어","c":"12심영02-04","과":"심화 영어","학":"고2~3","영":"표현","p":"듣거나 읽은 내용을 자신의 말이나 글로 요약한다.","h":["이 성취기준은 다양한 주제에 관해 듣거나 읽은 내용을 명료하게 요약하여 말하거나 글로 쓰는 것이다. 학습자는 말이나 글에 제시된 어휘와 언어 형식을 그대로 원용하기보다는 새로운 어휘와 언어 형식을 사용하여 요약한다."]},{"교":"영어","c":"12심영02-05","과":"심화 영어","학":"고2~3","영":"표현","p":"말이나 글의 내용을 비교⋅대조한다.","h":["이 성취기준은 대립되는 의견이나 주장이 담긴 다양한 정보를 비교⋅대조하고 그 내용을 말이나 글로 표현하는 것이다. 학습자는 상반된 의견이나 주장, 그래프나 도표 등의 정보를 파악하고 유사점과 차이점에 대해 적절한 연결어와 언어 형식을 사용하여 말과 글로 표현한다."]},{"교":"영어","c":"12심영02-06","과":"심화 영어","학":"고2~3","영":"표현","p":"다양한 매체의 정보를 재구성하여 발표한다.","h":["이 성취기준은 다양한 매체를 통해 표현된 정보를 검토하고 분석하여 상대방이 잘 이해할 수 있도록 재구성하여 말이나 글로 표현하는 것이다. 학습자는 인쇄, 영상, 온라인 매체 등을 통해 접하는 다양한 정보의 타당성, 신뢰성, 객관성 등을 비판적으로 검토하고, 목적과 맥락에 맞게 정보를 재구성하여 말이나 글로 표현함으로써 종합적인 사고력을 기른다."]},{"교":"영어","c":"12심영02-07","과":"심화 영어","학":"고2~3","영":"표현","p":"글의 내용과 형식을 점검하여 정보 윤리에 맞게 고쳐 쓴다.","h":["이 성취기준은 특정 주제에 관하여 글의 초안을 작성한 후 교사나 동료 또는 자신의 피드백을 반영하고 글의 주제와 목적을 점검하여 정보 윤리 기준에 맞게 다시 글을 고쳐 쓰는 것이다. 학습자는 추가, 삭제, 재구성 등의 고쳐 쓰기 과정을 통해 자신의 글을 점검하고 성찰함으로써 글의 완성도를 제고하고, 자기주도적 역량과 정보 윤리 소양을 함양하며 글쓰기에 대한 흥미와 자신감을 기른다."]},{"교":"영어","c":"12심영02-08","과":"심화 영어","학":"고2~3","영":"표현","p":"적절한 전략을 적용하여 다양한 언어⋅문화적 배경을 가진 영어 사용자와 공감하며 소통하는 태도를 가진다.","h":["이 성취기준은 타 문화의 의사소통 방식, 생활 양식, 사고방식의 다양성을 우리 문화와 비교⋅분석하여 이해함으로써 언어⋅문화적 배경이 다른 사람과 공감하며 소통하는 것이다. 학습자는 주어진 상황이나 목적에 맞게 말하기나 쓰기 전략을 적용하여 자신의 생각이나 주장을 말이나 글로 표현하며 상호 작용한다."]},{"교":"영어","c":"12영문01-01","과":"영미 문학 읽기","학":"고2~3","영":"","p":"다양한 장르와 주제의 문학 작품을 읽고 주요 내용을 요약한다."},{"교":"영어","c":"12영문01-02","과":"영미 문학 읽기","학":"고2~3","영":"","p":"문학 작품을 읽고 필자나 인물의 의도나 목적을 파악한다."},{"교":"영어","c":"12영문01-03","과":"영미 문학 읽기","학":"고2~3","영":"","p":"문학 작품을 읽고 자신의 느낌이나 감상을 공유하고 표현한다.","h":["이 성취기준은 작품을 읽고 작품에 대한 느낌과 생각을 발표나 토론 등을 통해 상대방과 공유하고 그 내용을 말이나 글로 표현하는 것을 의미한다. 학습자는 작품에서 감동적이거나 인상적인 내용 또는 기억에 남는 장면이나 사건 등에 대한 자신의 느낌과 생각을 표현하되, 단순히 사건이나 내용을 나열하기보다는 사건이나 내용이 왜 감동적이고 인상적인지 근거를 제시하면서 기술한다."]},{"교":"영어","c":"12영문01-04","과":"영미 문학 읽기","학":"고2~3","영":"","p":"이야기나 희곡을 읽고 작품의 구조를 분석하여 구성 요소를 설명한다.","h":["이 성취기준은 이야기(소설 등)나 희곡을 읽고 이야기 구조나 희곡의 구성 요소를 분석하고 그것을 말이나 글로 설명하는 것을 의미한다. 학습자는 이야기 구조인 배경(시간과 장소), 인물, 목적, 갈등, 결말이나 희곡의 구성 요소인 발단, 전개, 절정, 하강, 대단원의 구조를 분석하여 문학 장르별 구조로 작용하는 형식적인 틀과 구성 요소 간의 유기적 관계를 파악함으로써, 작품 전체의 내용을 이해하고 문학 감상과 비평의 기초를 다진다."]},{"교":"영어","c":"12영문01-05","과":"영미 문학 읽기","학":"고2~3","영":"","p":"시를 읽고 운율, 이미지, 은유, 상징 등의 문학적 비유 표현과 의미를 파악하고, 창의적인 말이나 글의 형태로 표현한다.","h":["이 성취기준은 시(동요, 동시 등)에 나타나는 시적 장치가 음악성, 회화성, 상징성, 서사성 등과 같은 시의 특성을 어떻게 구현하는지를 파악함으로써 시를 이해하고 감상하는 기초 능력을 배양하고, 이를 활용하여 특정 주제를 주어진 형태에 맞추어 창의적으로 표현하는 것을 의미한다. 학습자는 시에 나타난 운율, 이미지, 은유, 상징 등의 문학적 표현을 이해하고 그것을 활용하여 주어진 형태에 따라 자신의 생각이나 감정을 표현하는 간단한 형태시 등을 작성해 봄으로써 종합적인 영어 능력을 배양한다."]},{"교":"영어","c":"12영문01-06","과":"영미 문학 읽기","학":"고2~3","영":"","p":"다양한 매체를 활용하여 문학 작품의 내용을 다양한 관점으로 분석⋅비평한다.","h":["이 성취기준은 작품 해석과 관련된 자료를 다양한 매체를 통해 수집, 분석, 종합하여 새로운 관점에서 작품을 비판적으로 이해하고 표현하는 능력을 기르는 것을 의미한다. 학습자는 작품에 대한 해석을 기존의 비평이나 해석에 의존하지 않고, 작품의 주인공을 다른 등장인물로 대체하여 읽는 등의 방법을 통해 자신의 생각이나 감상을 바탕으로 매체를 활용하고 다양한 자료를 분석⋅종합하여 독창적인 비평문을 작성하거나 발표한다."]},{"교":"영어","c":"12영문01-07","과":"영미 문학 읽기","학":"고2~3","영":"","p":"문학 작품을 읽고 우리 문화와 타 문화의 생활 양식, 사고방식, 의사소통 방식의 차이와 다양성에 대해 비교⋅분석한다.","h":["이 성취기준은 문화의 한 형태로서 문학 작품에 나타난 타 문화의 생활 양식, 사고방식, 의사소통 방식을 우리 문화와의 비교를 통해 이해하고 문화 간 차이와 다양성을 비교⋅분석하는 능력을 기르는 것을 의미한다. 이를 통해 학습자는 타 문화에 대한 포용적인 태도를 기르고 세계시민으로서의 소양을 함양한다."]},{"교":"영어","c":"12영문01-08","과":"영미 문학 읽기","학":"고2~3","영":"","p":"문학 작품을 읽고 표현이나 주제의 예술적 가치에 대한 심미적인 태도를 기른다.","h":["이 성취기준은 문학 작품을 하나의 예술 작품으로 이해하고 감상하는 심미적 태도를 기르는 것을 의미한다. 학습자는 문학 작품에 나타난 심미적 표현이나 주제의 의미를 이해하고 감상하는 심미적인 경험을 통해 사회⋅문화적 감수성을 기르며 삶의 의미와 가치를 발견하고 함께 공유한다."]},{"교":"영어","c":"12심독01-01","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 분야의 기초 학문 주제에 관한 글을 읽고 주요 내용을 파악한다."},{"교":"영어","c":"12심독01-02","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"이야기나 서사 및 운문을 읽고 필자나 등장인물의 심정이나 의도를 추론한다."},{"교":"영어","c":"12심독01-03","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 구성 방식을 고려하여 논리적 관계를 추론한다.","h":["이 성취기준은 글의 전개 방식이나 구조에 대한 이해를 바탕으로 사건의 순서, 전후 관계, 인과 관계를 추론하는 것이다. 학습자는 글에 사용된 정의, 비교와 대조, 원인과 결과 등의 기술 방식 및 지시어, 연결어, 대용어 등을 분석하며 글에 대한 사실적, 추론적, 종합적 사고 능력을 기른다."]},{"교":"영어","c":"12심독01-04","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"글의 맥락과 배경지식을 활용하여 함축적 의미를 추론한다."},{"교":"영어","c":"12심독01-05","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 문학 작품을 읽고 문학적 표현과 의미를 파악한다.","h":["이 성취기준은 문학 작품에 나타난 운율, 이미지, 은유, 상징 등의 예와 그 의미를 파악하는 것이다. 학습자는 문학 작품에 나타난 다양한 문학적 표현의 의미를 파악하는 능력을 기름으로써 다양한 언어 표현 방식을 이해하고 심미적인 감수성을 함양한다."]},{"교":"영어","c":"12심독01-06","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 유형의 글의 구조와 형식을 비교⋅분석한다.","h":["이 성취기준은 이야기나 서사 및 운문, 정보 전달⋅교환을 목적으로 하는 글, 의견 전달⋅교환이나 주장을 목적으로 하는 글 등 다양한 목적이 있는 여러 유형의 글의 전개 방식을 비교하며 글의 구조 및 형식에 대한 이해를 제고하는 것이다. 학습자는 다양한 형식의 글을 비교하며 읽으면서 글의 목적에 따른 글의 구조나 형식의 연관성을 인식하고 분석하는 능력을 기른다."]},{"교":"영어","c":"12심독01-07","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"다양한 매체의 글의 내용 타당성을 평가하며 비판적으로 읽는다.","h":["이 성취기준은 다양한 매체를 통해 접하게 되는 글의 타당성, 신뢰성, 객관성 등을 판단하며 글을 비판적인 시각으로 읽는 것이다. 학습자는 글에 나타난 사실과 의견을 구분하고 필자의 가치관과 태도를 분석⋅평가함으로써 다양한 관점으로 글을 해석할 수 있는 비판적인 독해 능력을 기른다."]},{"교":"영어","c":"12심독01-08","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"우리 문화 및 타 문화의 생활 양식, 사고방식, 의사소통 방식에 관한 글을 읽고 문화 간 차이에 대해 포용적인 태도를 갖춘다.","h":["이 성취기준은 글에 나타난 타 문화의 생활 양식, 사고방식, 의사소통 방식을 우리 문화와 비교하여 이해함으로써 문화 간 차이에 대한 포용적 태도를 기르는 것이다. 학습자는 다양한 문화에 대한 글을 접하고 문화의 다양성에 대한 인식을 높이며 다름을 존중하는 세계시민으로서의 소양을 배양한다."]},{"교":"영어","c":"12심독01-09","과":"심화 영어 독해와 작문","학":"고2~3","영":"독해","p":"적절한 읽기 전략을 적용하여 스스로 읽기 과정을 점검하며 읽는다.","h":["이 성취기준은 글의 유형과 글을 읽는 목적에 따라 적절한 읽기 전략을 적용하여 읽기를 효율적으로 수행하고 있는지를 자기주도적으로 점검함으로써 학습자의 상위 인지 능력을 함양하기 위한 것이다. 학습자는 읽기 전략을 계획, 실행, 관찰, 성찰하는 과정을 반복함으로써 능숙한 독자가 되기 위한 전략을 내재화한다."]},{"교":"영어","c":"12심독02-01","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 분야의 기초 학문 주제에 관하여 사실적 정보를 기술하거나 설명하는 글을 쓴다.","h":["이 성취기준은 특정 주제에 관한 경험이나 사건을 기술하거나, 시각 자료(그림, 사진, 도표 등) 또는 일이나 과업의 수행 방법이나 절차 등과 같은 사실적 정보를 구체적이고 논리적으로 설명하는 글을 쓰는 것이다. 학습자는 독자가 정보를 정확하고 분명하게 이해할 수 있도록 다양하고 풍부한 어휘와 적절한 연결어, 지칭어 등을 효과적으로 활용하여 글의 목적과 맥락에 맞게 글을 쓴다."]},{"교":"영어","c":"12심독02-02","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"이야기나 서사 및 운문에 대해 자신의 감상이나 느낌을 표현하는 글을 쓴다."},{"교":"영어","c":"12심독02-03","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 주제에 관하여 상대방을 설득하는 글을 쓴다."},{"교":"영어","c":"12심독02-04","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 기초 학문 분야의 주제에 관하여 듣거나 읽고 주요 정보를 요약한다."},{"교":"영어","c":"12심독02-05","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"우리 문화 및 타 문화의 생활 양식, 사고방식, 의사소통 방식에 관한 글을 읽고 문화 간 차이에 대해 비교⋅대조하는 글을 쓴다.","h":["이 성취기준은 타 문화의 생활 양식, 사고방식, 의사소통 방식과 우리 문화를 비교하여 그 차이와 다양성을 비교⋅대조하는 글을 쓰는 것이다. 학습자는 우리 문화와 타 문화의 유사점, 공통점, 차이점에 대해 적절한 어휘와 연결어, 지시어 등을 활용해 비교⋅대조하는 글을 쓴다."]},{"교":"영어","c":"12심독02-06","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 매체 정보를 분석⋅종합⋅비평하여 재구성한다.","h":["이 성취기준은 다양한 매체를 통해 듣거나 읽은 정보를 면밀하게 검토하고 분석하여 그 내용을 독자가 잘 이해할 수 있도록 적절한 전략을 통해 재구성하여 글을 쓰는 것이다. 학습자는 인쇄, 영상, 온라인 매체를 통해 접하는 다양한 정보의 타당성과 신뢰성을 검토하고, 목적과 맥락에 맞게 정보를 체계적으로 재구성하는 글쓰기를 통해 종합적인 사고력을 기른다."]},{"교":"영어","c":"12심독02-07","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"사회적으로 이슈가 되는 주제에 관하여 정보 윤리를 준수하며 비판적이고 독창적인 글을 쓴다.","h":["이 성취기준은 다양한 매체의 정보를 수집, 분석, 종합하여 새로운 관점을 독창적으로 표현하는 창의적인 글을 쓰는 것이다. 학습자는 매체를 활용하여 다양한 자료를 분석하고 종합하여 그것을 논리적으로 일관성 있게 표현하는 글쓰기를 통해 비판적 사고력과 창의성을 함양하고, 정보 소통 윤리 및 쓰기 예절에 맞게 글을 쓰며 상호 배려하고 존중하는 태도를 배양한다."]},{"교":"영어","c":"12심독02-08","과":"심화 영어 독해와 작문","학":"고2~3","영":"작문","p":"다양한 분야의 주제에 관하여 적절한 쓰기 전략을 적용하여 글을 점검하고 고쳐 쓴다.","h":["이 성취기준은 초안을 쓴 후 교사나 동료, 스스로의 점검을 통해 얻은 피드백을 적절하게 반영하여
