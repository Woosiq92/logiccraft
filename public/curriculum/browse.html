의 관계","p":"일상에서 발생하는 부도덕한 행동의 여러 원인을 분석하고, 도덕적 인격이 갖추어야 할 특성들을 파악하여 이를 내면화하는 의지를 기른다.","h":["이 성취기준의 취지는 일상의 부도덕한 행동들이 옳고 그름을 분별하지 못하는 무지뿐만 아니라 자기정당화 기제를 포함한 도덕 심리학적 원인에서 비롯될 수 있음을 파악하고, 이러한 부도덕한 행동의 원인을 극복한 훌륭한 인격자의 도덕적 특성들을 탐구함으로써 도덕적 인격이 갖춰야 할 도덕성의 구성요소를 내면화하는 의지를 기르는 것이다."]},{"교":"도덕","c":"9도01-03","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다."},{"교":"도덕","c":"9도01-04","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"옳고 그름을 분별할 수 있는 도덕적 기준을 탐구하고, 도덕적 상상력을 바탕으로 일상의 도덕 문제들에 도덕적 추론을 적용할 수 있다.","h":["이 성취기준의 취지는 동양과 서양의 주요한 규범윤리 이론들을 탐구하고, 일상의 도덕적 문제 상황에서 상대방의 감정에 공감하면서 다양한 대안을 탐색하는 도덕적 상상력과 도덕원리와 법칙에 근거하여 도덕 판단을 도출하는 도덕적 추론능력을 기르는 것이다."]},{"교":"도덕","c":"9도01-05","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"삶의 유한함에 관한 성찰을 통해 생명의 소중함과 의미 있는 삶의 중요성을 인식하고, 자신의 미래 모습을 상상하며 삶을 계획하고 이를 실천하는 의지를 기른다."},{"교":"도덕","c":"9도01-06","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"내면에 대한 성찰을 통해 심리적 고통과 불안, 우울감 등의 원인을 찾고, 마음의 평온을 얻을 수 있는 방안들을 다각적으로 모색하여 실천할 수 있다.","h":["이 성취기준의 취지는 학생들이 경험하는 정신적 혼란과 심리적 스트레스의 다양한 원인을 파악하고, 이를 극복하는 데 도움이 되는 방법들을 익힘으로써 자기 관리 및 조절 능력과 회복탄력성을 기르고 진정한 마음의 평화를 얻는 것이다."]},{"교":"도덕","c":"9도01-07","과":"도덕","학":"중1~3","영":"자신과의 관계","p":"삶에서 직업이 갖는 의미와 가치를 파악하며, 사례 탐구를 통해 직업적 양심과 직업윤리의 필요성을 정당화할 수 있다.","h":["이 성취기준의 취지는 학생들이 직업의 가치를 개인적, 사회적 측면에서 탐색하고, 직업적 양심과 직업윤리의 중요성을 파악함으로써 자신이 희망하는 진로와 직업 세계의 직업윤리를 구성하는 것이다."]},{"교":"도덕","c":"9도02-01","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"정서적, 배려적 공동체로서 가정의 특성과 도덕적 기능을 파악하고, 가정에서 발생하는 갈등을 공감적인 소통과 민주적인 과정을 통해 해소하는 의지를 기른다."},{"교":"도덕","c":"9도02-02","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"친구의 의미와 가치를 삶의 맥락 속에서 탐구하고, 서로를 인격적으로 존중하는 친구 관계를 상상하며 이를 실현하는 의지를 기른다."},{"교":"도덕","c":"9도02-03","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"가상공간과 현실 세계에 대한 비교⋅분석을 바탕으로 가상공간에서 발생하는 도덕 문제들의 원인과 해결 방안을 제안하고, 타인을 존중하며 가상공간을 활용하는 태도를 함양한다.","h":["이 성취기준의 취지는 학생들이 삶에서 접하는 다양한 유형의 가상공간이 지니는 특성들을 현실 세계와 비교하여 분석하고, 이를 바탕으로 가상공간에서 일어나는 도덕적 문제의 원인과 해결 방안을 탐구하도록 하는 것이다. 이를 통해 일상화된 가상공간을 올바로 활용할 수 있는 디지털 문해력의 함양을 지향하는 것이다."]},{"교":"도덕","c":"9도02-04","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"인간을 관계적 존재로 해석할 수 있는 이유에 근거하여 타인과의 관계에서 필요한 가치⋅덕목을 탐구하고, 타인의 생각과 감정에 공감하는 태도를 기른다.","h":["이 성취기준의 취지는 학생들이 인간을 관계적 존재로 보는 동양과 서양의 윤리적 관점에 근거하여 자신이 맺고 있는 다양한 관계에서 필요한 도덕적 가치와 덕목들을 탐구하고, 그러한 가치와 덕목들에 근거하여 자신의 삶을 성찰하도록 하는 것이다. 이를 통해 타인의 생각과 감정을 공유하며 협력할 수 있는 공감 능력의 함양을 지향하는 것이다."]},{"교":"도덕","c":"9도02-05","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"다양한 갈등 상황을 평화적으로 해결할 수 있는 방안을 모색하고, 폭력의 유형과 원인, 결과에 대한 분석을 바탕으로 일상의 폭력 상황에 대한 대처 능력을 기른다."},{"교":"도덕","c":"9도02-06","과":"도덕","학":"중1~3","영":"타인과의 관계","p":"청소년기의 바람직한 성윤리를 탐구하여 내면화하고, 사회⋅문화적 차원에서 성의 의미를 파악하여 성에 대한 편견의 문제점을 분석하고 이를 바로잡는 의지를 기른다."},{"교":"도덕","c":"9도03-01","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"인권을 존중해야 하는 도덕적 이유를 정당화하고, 인권 침해 사례에 대한 탐구를 통해 그 원인과 해결 방안을 도출함으로써 인권 감수성을 기른다."},{"교":"도덕","c":"9도03-02","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"외집단에 대한 편견을 비판적으로 분석하고, 타문화⋅타종교⋅타인종을 존중해야 하는 이유에 근거하여 차이와 다양성에 대한 열린 마음을 기른다.","h":["이 성취기준의 취지는 학생들이 다양한 사례를 통해 외집단에 대한 편견을 분석함으로써 암묵적인 내집단 편향을 비판적으로 인식하고, 우리 사회가 다문화사회로 진입하고 있다는 점을 바탕으로 다문화 가족, 이주 노동자, 난민 등과 관련하여 우리 사회가 직면한 문제들을 탐구함으로써 타인종, 타문화, 타종교를 인정하고 존중하며 그들을 환대하는 태도를 기르는 것이다."]},{"교":"도덕","c":"9도03-03","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"북한에 대한 이해를 바탕으로 분단의 문제점을 분석하고, 도덕적 가치에 기초하여 통일의 의미를 재구성함으로써 바람직한 남북관계 및 통일의 방향을 제안할 수 있다."},{"교":"도덕","c":"9도03-04","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"정의로운 사회를 상상해보고, 이를 실현할 수 있는 정의의 원칙과 제도에 대한 다양한 의견들을 민주적인 방식으로 종합할 수 있다."},{"교":"도덕","c":"9도03-05","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"국가와 시민 사이에서 발생하는 윤리적 쟁점들을 탐구하고, 국가와 시민 사이의 바람직한 관계에 기초하여 국가와 시민의 역할을 재구성할 수 있다."},{"교":"도덕","c":"9도03-06","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"인류의 고통에 공감하며 지구적 차원의 다양한 도덕 문제들을 탐구하고, 해결 방안을 모색하여 실천하는 자세를 갖는다."},{"교":"도덕","c":"9도03-07","과":"도덕","학":"중1~3","영":"사회⋅공동체와의 관계","p":"현대 과학기술과 관련된 윤리적 쟁점의 분석을 통해 과학기술의 유용성과 한계를 인식하고, 과학기술의 바람직한 활용에 관한 관심과 책임 의식을 기른다.","h":["이 성취기준의 취지는 학생들이 인공지능, 유전자 변형, 생명공학을 활용한 인간 향상, 빅데이터 등 현대 과학기술의 발전으로 인해 새롭게 등장하는 윤리적 쟁점을 예측하고, 이에 대한 해결책을 찾는 탐구와 토론을 수행함으로써 과학기술의 윤리적 사용을 위해 갖추어야 할 바람직한 태도와 윤리적 책임감을 함양하는 것이다."]},{"교":"도덕","c":"9도04-01","과":"도덕","학":"중1~3","영":"자연과의 관계","p":"인간 이외의 생명체를 도덕적으로 고려해야 하는 이유를 정당화하고, 생명을 가진 존재들이 겪는 고통에 공감하며 생명을 소중히 여기는 태도를 기른다.","h":["이 성취기준의 취지는 학생들이 가정에서 동물을 돌보거나 식물을 가꾸어 본 경험을 바탕으로 인간 이외의 생명체를 그 자체로 존중해야 하는 도덕적 이유를 추론해보고, 인간 이외의 생명체들이 겪는 고통과 위험에 민감하게 반응하며 생명을 소중히 여기는 태도를 기르는 것이다."]},{"교":"도덕","c":"9도04-02","과":"도덕","학":"중1~3","영":"자연과의 관계","p":"자연에 대한 동양과 서양의 주요 입장들을 토대로 인간과 자연의 바람직한 관계를 도출하고, 환경 위기에 대한 윤리적 책임을 구체화하여 실천할 수 있다."},{"교":"도덕","c":"12현윤01-01","과":"현대사회와 윤리","학":"고2~3","영":"현대 생활과 윤리","p":"윤리학의 성격과 특징을 바탕으로 윤리적 존재로서의 인간 본성을 이해하고, 현대사회의 다양한 윤리 문제를 탐구 및 토론할 수 있다."},{"교":"도덕","c":"12현윤01-02","과":"현대사회와 윤리","학":"고2~3","영":"현대 생활과 윤리","p":"동양 및 서양의 윤리사상, 사회사상의 접근들을 비교 분석하고, 이를 현대사회의 다양한 윤리 문제와 쟁점에 적용하여 윤리적 해결 방안을 도출할 수 있다.","h":["이 성취기준의 취지는 학생들에게 현대 생활에서 발생하는 문제와 쟁점에 적용할 수 있는 윤리적 탐구의 밑바탕을 마련하도록 하는 것이다. 이를 위해 동양 윤리, 서양 윤리, 사회사상을 비교 분석하도록 한다. 또한 현대과학의 발전에 따른 도덕과학적 접근을 비판적으로 탐구하여 인간의 도덕성에 대한 이해의 폭을 넓히도록 한다."]},{"교":"도덕","c":"12현윤02-01","과":"현대사회와 윤리","학":"고2~3","영":"생명윤리와 생태윤리","p":"삶과 죽음을 동⋅서양 윤리의 입장에서 성찰하고, 현대사회에서 발생하는 생명윤리 문제를 다양한 윤리적 관점에서 설명할 수 있다.","h":["이 성취기준의 취지는 삶과 죽음, 생명과 관련된 윤리문제에 대해 동⋅서양의 다양한 윤리 이론을 학습하고 적용하여 자신의 관점을 정립하고, 관련 윤리 문제를 비판적으로 성찰하여 올바른 윤리관을 형성하는 것이다. 학생들은 학습 과정에서 삶과 죽음에 대한 다양한 윤리 문제를 인식하고, 이에 대한 여러 윤리적 입장을 비교 분석하여, 인공임신중절⋅자살⋅안락사⋅뇌사⋅유전자 복제 및 치료의 과정에서 발생하는 윤리 문제를 자신이 채택한 윤리적 관점으로 설명할 수 있어야 한다."]},{"교":"도덕","c":"12현윤02-02","과":"현대사회와 윤리","학":"고2~3","영":"생명윤리와 생태윤리","p":"사랑과 성에 관한 다양한 입장과 성차별의 윤리적 문제를 이해하고, 현대사회의 결혼 및 가족 문제를 윤리적 관점에서 탐구할 수 있다."},{"교":"도덕","c":"12현윤02-03","과":"현대사회와 윤리","학":"고2~3","영":"생명윤리와 생태윤리","p":"자연을 바라보는 동⋅서양의 관점을 비교⋅설명할 수 있으며 오늘날 환경 문제의 사례와 심각성을 조사하고, 이에 대한 윤리적 해결 방안을 제시할 수 있다."},{"교":"도덕","c":"12현윤03-01","과":"현대사회와 윤리","학":"고2~3","영":"과학과 디지털 학습 환경 윤리","p":"과학기술 연구에 대한 다양한 관점을 조사하여 비교⋅설명할 수 있으며 이를 과학기술의 사회적 책임 문제에 적용하여 비판 또는 정당화할 수 있다."},{"교":"도덕","c":"12현윤03-02","과":"현대사회와 윤리","학":"고2~3","영":"과학과 디지털 학습 환경 윤리","p":"정보통신 기술과 뉴미디어의 발달에 따른 윤리 문제들을 제시할 수 있으며 이에 대한 해결 방안을 정보윤리와 미디어 윤리의 관점에서 제시할 수 있다."},{"교":"도덕","c":"12현윤03-03","과":"현대사회와 윤리","학":"고2~3","영":"과학과 디지털 학습 환경 윤리","p":"윤리적인 인공지능을 위하여 인간과 인공지능의 관계를 설명하고, 인공지능으로 인해 발생하는 윤리 문제의 해결 방안을 인공지능 윤리의 관점에서 제시할 수 있다.","h":["이 성취기준의 취지는 윤리적인 인공지능의 개발과 활용을 위하여 인간과 인공지능의 관계에 대한 다양한 입장을 이해하고 국내외에서 발표된 인공지능 윤리 가이드라인에서 강조되는 책임성, 투명성, 편향성 등의 문제를 해결할 수 있는 윤리적 실천 방안을 탐구하도록 하는 것이다. 학생들은 인공지능기술의 발달이 초래할 수 있는 윤리 문제들을 제시하고, 그러한 문제를 해결하기 위한 방안을 인공지능 윤리의 관점에서 제시할 수 있어야 한다."]},{"교":"도덕","c":"12현윤04-01","과":"현대사회와 윤리","학":"고2~3","영":"민주시민과 윤리","p":"직업의 의의와 다양한 직업군에 따른 직업윤리를 제시할 수 있으며 공동체 발전을 위한 청렴한 삶과 노동의 가치에 대한 사회적 존중의 필요성을 설명할 수 있다."},{"교":"도덕","c":"12현윤04-02","과":"현대사회와 윤리","학":"고2~3","영":"민주시민과 윤리","p":"개인선과 공동선의 조화가 필요한 이유를 설명할 수 있으며, 시민의 정치참여 필요성과 시민불복종의 조건 및 정당성을 제시할 수 있다.","h":["이 성취기준의 취지는 학생들이 민주시민이 갖추어야 할 바람직한 시민성을 학습하여 자유주의적 관점에서 강조되는 개인의 행복이나 자아실현과 같은 개인선과 공동체주의적 관점에서 강조되는 공동체를 위한 선인 공동선의 조화가 중요함을 인식하도록 하는 것이다. 또한 민주주의의 발전을 위해 시민의 정치참여가 필요하며, 부당한 국가권력의 지배에 항거하는 시민불복종의 조건과 정당성을 학습하여 성숙한 시민의식을 마련하는 데 있다."]},{"교":"도덕","c":"12현윤04-03","과":"현대사회와 윤리","학":"고2~3","영":"민주시민과 윤리","p":"공정한 분배를 이루기 위한 정책을 분배 정의 이론을 통해 비판 또는 정당화할 수 있으며, 사형 제도와 형벌을 교정적 정의의 관점에서 비판 또는 정당화할 수 있다."},{"교":"도덕","c":"12현윤05-01","과":"현대사회와 윤리","학":"고2~3","영":"문화와 경제생활의 윤리","p":"미적 가치와 윤리적 가치를 예술과 도덕의 관계 차원에서 설명할 수 있으며 현대의 대중문화의 순기능과 역기능을 윤리적 관점에서 이해하고 성찰할 수 있다."},{"교":"도덕","c":"12현윤05-02","과":"현대사회와 윤리","학":"고2~3","영":"문화와 경제생활의 윤리","p":"의식주 생활과 관련된 윤리 문제와 경제생활에서 발생하는 도덕적 선과 이윤 추구 사이의 갈등 및 소비문화의 문제점을 윤리적 관점에서 비판할 수 있다.","h":["이 성취기준의 취지는 첫째, 의식주 생활과 관련된 다양한 사상적 입장을 이해하여 삶에서 의식주가 갖는 의미를 주체적으로 성찰하는 데 있다. 둘째, 도덕적 선과 이윤 추구 사이의 딜레마나 쟁점을 이해하고 건전한 경제생활의 토대가 되는 사회적 자본의 중요성을 탐구하는 것이다. 셋째, 현실 및 가상 간에서 과시 소비나 기호 소비 등으로 인해 발생할 수 있는 현대 소비문화의 문제점을 윤리적 관점에서 탐구하고 비판하는 것이다."]},{"교":"도덕","c":"12현윤05-03","과":"현대사회와 윤리","학":"고2~3","영":"문화와 경제생활의 윤리","p":"다문화 이론을 통해 문화의 다양성을 존중해야 할 필요성을 인식하고 종교 갈등, 이주민 차별 등과 같은 다문화 관련 문제의 해결 방안을 제시할 수 있다."},{"교":"도덕","c":"12현윤06-01","과":"현대사회와 윤리","학":"고2~3","영":"평화와 공존의 윤리","p":"다양한 사회적 갈등의 양상을 제시하고 동⋅서양의 윤리 이론을 바탕으로 사회통합을 위한 방안을 제안할 수 있으며, 바람직한 소통과 담론을 실천할 수 있다."},{"교":"도덕","c":"12현윤06-02","과":"현대사회와 윤리","학":"고2~3","영":"평화와 공존의 윤리","p":"한반도의 통일과 평화에 관한 쟁점을 객관적으로 이해하고, 보편적인 윤리적 가치를 바탕으로 남북한의 화해를 위한 개인적⋅국가적 노력을 구체적으로 제시할 수 있다."},{"교":"도덕","c":"12현윤06-03","과":"현대사회와 윤리","학":"고2~3","영":"평화와 공존의 윤리","p":"국제 사회의 윤리 문제를 국제 정의의 관점에서 비판적으로 설명하고, 국제 사회에 대한 책임과 기여를 윤리적 관점에서 정당화하고 실천 방안을 제시할 수 있다.","h":["이 성취기준의 취지는 국제 사회에서 발생하는 분쟁, 난민, 빈곤 등의 문제에 국제 정의의 관점을 적용하여 비판적으로 설명할 수 있도록 하는 것이다. 특히 해외 원조와 같은 국제 사회에 대한 책임과 기여 문제를 만민법, 세계시민주의 등의 입장에서 탐구하고 윤리적인 실천 방안을 제시하는 것이다."]},{"교":"도덕","c":"12윤사01-01","과":"윤리와 사상","학":"고2~3","영":"동양 윤리사상","p":"공자사상에 바탕하여 맹자와 순자, 주희와 왕수인의 인성론을 비교하고, 인간 본성의 입장에 따른 윤리적 삶의 목표 및 방법론의 차이와 그 의의를 파악할 수 있다.","h":["이 성취기준의 취지는 공자를 계승한 맹자와 순자, 주희와 왕수인의 윤리사상을 탐구함으로써, 성선설과 성악설, 성즉리와 심즉리가 대립된 주장처럼 보이지만 이들 주장 모두 인간 본성에 대한 이해를 바탕으로 도덕법칙의 근거와 도덕적 완성을 위한 방법론을 정립하고자 하는 동일한 문제의식에서 제시된 것임을 이해하게 하는 데 있다. 이를 통해 양자택일적 사고방식을 지양하고, 자기 입장과 다른 사상에 대해서 보다 열린 태도를 지니며 융합적인 사고 능력을 발휘할 수 있도록 한다."]},{"교":"도덕","c":"12윤사01-02","과":"윤리와 사상","학":"고2~3","영":"동양 윤리사상","p":"노자의 유무상생⋅무위자연 사상과 장자의 소요유⋅제물론의 의의를 이해하고, 서로 다른 것들 간의 어울림을 통한 진정한 평화에 대해 성찰할 수 있다."},{"교":"도덕","c":"12윤사01-03","과":"윤리와 사상","학":"고2~3","영":"동양 윤리사상","p":"불교의 사성제와 자비를 이해하고, 괴로움을 극복하는 방법을 실천할 수 있다."},{"교":"도덕","c":"12윤사02-01","과":"윤리와 사상","학":"고2~3","영":"한국 윤리사상","p":"원효의 화쟁사상, 의천과 지눌의 선⋅교 통합 사상이 불교의 대립을 어떻게 화해시켰는지 탐구하고, 한국불교의 특성과 통합정신의 중요성을 파악할 수 있다.","h":["이 성취기준의 취지는 원효의 화쟁사상과 의천과 지눌의 선⋅교 통합 사상의 주요 내용과 특징을 탐구하여 한국 불교의 회통적이고 통합적인 성격을 인식함으로써, 우리 민족의 정신적 주요 특성을 파악하는 데 있다. 한국불교의 특성을 지식으로 이해하는 데 머물지 않고 한국 교의 개방적이고 포용적인 성격을 우리 민족의 정신적 특성과 관련하여 탐구하고, 이를 통해 다름과 차이의 조화가 오늘날 다원주의적 사회에서 지니는 의의를 성찰할 수 있도록 한다."]},{"교":"도덕","c":"12윤사02-02","과":"윤리와 사상","학":"고2~3","영":"한국 윤리사상","p":"도덕 감정의 발현 과정에 대한 퇴계와 율곡의 주장을 그 이유와 함께 비교⋅고찰하고, 일상의 감정을 도덕적으로 조절하는 방법을 제시할 수 있다."},{"교":"도덕","c":"12윤사02-03","과":"윤리와 사상","학":"고2~3","영":"한국 윤리사상","p":"남명과 하곡, 다산의 사상을 통해 앎과 함의 관계에 대하여 성찰하고, 윤리적 실천 방안을 제안하여 실행할 수 있다."},{"교":"도덕","c":"12윤사03-01","과":"윤리와 사상","학":"고2~3","영":"서양 윤리사상","p":"서양 윤리사상의 출발점에서 나타난 보편윤리, 영혼의 조화, 성품의 탁월성의 특징을 파악하고, 덕과 행복의 관계에 대하여 성찰할 수 있다."},{"교":"도덕","c":"12윤사03-02","과":"윤리와 사상","학":"고2~3","영":"서양 윤리사상","p":"행복 추구에 대한 쾌락주의와 금욕주의의 입장을 비교하여 고찰하고, 진정한 행복을 위한 윤리적 실천 방법을 제시할 수 있다."},{"교":"도덕","c":"12윤사03-03","과":"윤리와 사상","학":"고2~3","영":"서양 윤리사상","p":"그리스도교의 사랑의 윤리로서의 특징을 파악하고, 자연법 윤리 및 프로테스탄티즘 윤리에 나타난 신앙과 윤리의 관계를 성찰할 수 있다."},{"교":"도덕","c":"12윤사03-04","과":"윤리와 사상","학":"고2~3","영":"서양 윤리사상","p":"옳고 그름의 기준에 대한 의무론과 결과론을 비교⋅분석하고, 옳고 그름에 대한 윤리적 관점을 정당화할 수 있다."},{"교":"도덕","c":"12윤사03-05","과":"윤리와 사상","학":"고2~3","영":"서양 윤리사상","p":"실존주의와 실용주의, 도덕의 기원과 판단에 관한 과학적 탐구를 비판적으로 평가하고, 책임⋅배려 윤리에 대한 이해를 바탕으로 윤리적 삶의 의미와 지향을 설정할 수 있다.","h":["이 성취기준의 취지는 윤리적 삶에 대한 인간의 오랜 지적 여정을 이해함으로써 윤리적 삶의 의미와 지향에 대하여 성찰하도록 하는 데 있다. 또한 이 성취기준은 서양 윤리사상을 관통하고 있는 핵심 물음이자 주제라 할 수 있는 ‘좋은 삶과 옳은 행위에 대한 탐구’가 현대의 윤리에서 어떻게 전개되어왔는가를 이해하도록 한다는 점에서 서양 윤리사상 영역의 종합이자 마무리로서 의미가 있다. 이를 위해 현대적 윤리 논의로서 실존주의와 실용주의, 도덕성과 윤리 문제에 대한 과학적 접근(예를 들어, 진화심리학이나 신경윤리학)의 가능성과 한계를 살펴본 후, 책임⋅배려윤리에 대한 이해를 바탕으로 윤리적 삶에 대해 성찰하도록 한다."]},{"교":"도덕","c":"12윤사04-01","과":"윤리와 사상","학":"고2~3","영":"사회사상","p":"동⋅서양의 다양한 국가관을 비교⋅고찰하고, 오늘날의 관점에서 국가의 역할과 정당성에 대한 체계적인 시각을 형성할 수 있다."},{"교":"도덕","c":"12윤사04-02","과":"윤리와 사상","학":"고2~3","영":"사회사상","p":"시민의 자유와 권리, 공적 삶과 정치참여에 대한 자유주의와 공화주의의 관점을 비교⋅고찰하고, 시민과 공동체의 바람직한 관계를 모색할 수 있다."},{"교":"도덕","c":"12윤사04-03","과":"윤리와 사상","학":"고2~3","영":"사회사상","p":"근대 대의민주주의의 대안으로 등장한 참여민주주의와 심의민주주의의 장단점을 분석하고, 민주주의의 이상을 구현하기 위한 실천 방법을 제시할 수 있다.","h":["이 성취기준의 취지는 민주주의의 이상을 구현하기 위해 대의제의 한계를 보완하고 시민의 참여와 심의를 실현하는 방법을 탐구하도록 하는 데 있다. 이를 위해 참여가 사익 추구 수단으로 오용되지 않고, 심의가 정보 불균형으로 왜곡되지 않도록 하는 방안을 생각해보도록 한다. 이를 통해 시민의 도덕성과 정보의 균형에 기초한 참여와 심의의 중요성을 인식하고 시민으로서의 실천 의지를 형성하도록 한다."]},{"교":"도덕","c":"12윤사04-04","과":"윤리와 사상","학":"고2~3","영":"사회사상","p":"자본주의의 현실적 기여와 한계에 대해 조사⋅분석하고, 동⋅서양의 사회사상적 측면에서 자본주의의 개선 방향에 관해 탐구할 수 있다."},{"교":"도덕","c":"12인윤01-01","과":"인문학과 윤리","학":"고2~3","영":"성찰 대상으로서 나","p":"내 몸과 마음의 관계를 탐구하고, 심신의 통합성을 자각하여 도덕적 주체로서 자신을 이해하고 존중할 수 있다.","h":["이 성취기준에서는 󰡔격몽요결󰡕을 중심으로 하되 󰡔코스모스󰡕를 연계함으로써, 학생들이 자신의 몸과 마음의 관계를 탐구하여 심신이 유기적으로 통합되어 있음을 알 수 있도록 한다. 몸과 마음의 습관을 돌아봄으로써 도덕적 주체인 나에 대해 구체적으로 알아갈 수 있다. 이 성취기준은 자신과의 건강한 관계 맺기 및 도덕적 사고력과 판단력을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤01-02","과":"인문학과 윤리","학":"고2~3","영":"성찰 대상으로서 나","p":"삶의 주체인 나에 대한 성찰을 바탕으로 고통과 쾌락의 근원 및 양상을 탐구하여, 고통과 쾌락에 지혜롭게 대처하는 자세를 갖출 수 있다.","h":["이 성취기준에서는 󰡔쾌락󰡕을 중심으로 하되 󰡔숫타니파타󰡕를 연계함으로써, 학생들이 자신의 내면을 들여다보고 성찰하여 스스로를 이해하고 존중하는 도덕적 주체로서 살아갈 수 있도록 한다. 고통과 쾌락의 근원 및 양상을 탐구함으로써, 자신과 타인의 내면에 대해 보다 깊이 있게 이해할 수 있다. 이 성취기준은 자신과의 건강한 관계 맺기 및 올바른 자기 인식과 주도성을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤02-01","과":"인문학과 윤리","학":"고2~3","영":"타인과 관계 맺기","p":"관계 속에서 살아가는 나에 대한 성찰을 통해 상호성을 만끽하는 삶을 모색하고 실천할 수 있다.","h":["이 성취기준에서는 󰡔금강경󰡕을 중심으로 하되 󰡔정의론󰡕을 연계함으로써, 학생들이 다양한 관계 속에서 상호의존적인 삶을 살아가는 자신(나)을 성찰할 수 있도록 한다. 관계 맺기가 왜 어려운지 고민하고, 관계 속에서 살아가는 나에 대한 성찰 및 다양한 관계 맺기를 통해 펼쳐지는 삶의 양상들을 탐구할 수 있다. 이 성취기준은 도덕적 주체로서의 자기인식 및 타인과 관계 맺기 역량을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤02-02","과":"인문학과 윤리","학":"고2~3","영":"타인과 관계 맺기","p":"우정과 사랑의 의미를 탐구하고, 행복한 삶의 기반인 진정한 우정과 참된 사랑의 관계를 형성하기 위해 노력할 수 있다.","h":["이 성취기준에서는 󰡔논어󰡕를 중심으로 하되 󰡔니코마코스 윤리학󰡕을 연계함으로써, 학생들이 청소년기에 큰 영향을 주는 진정한 우정과 참된 사랑을 경험하고 내면화할 수 있도록 한다. 의미 있는 타자인 친구 및 인간관계의 근본이 되는 참된 사랑의 의미에 대해 탐구하여, 바람직하고 행복한 관계망을 형성하는 실천 방법을 제시할 수 있다. 이 성취기준은 도덕적 감성 및 더불어 살아가는 능력을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤03-01","과":"인문학과 윤리","학":"고2~3","영":"자유와 평등","p":"동⋅서양에서 바라보는 자유와 평등의 의미와 근거를 알고, 자유롭고 평등한 사람의 모습을 탐구하여 책임 있는 삶의 자세를 추구할 수 있다.","h":["이 성취기준에서는 󰡔장자󰡕를 중심으로 하되 󰡔윤리형이상학 정초󰡕를 연계함으로써, 학생들이 인간은 자유롭고 평등하다는 근거를 밝히고 자유와 평등이 구현된 삶의 모습을 구체적으로 탐구하여, 자신과 타인을 존중하는 마음을 내면화할 수 있도록 한다. 자유인이 갖추어야 할 책임 있는 자세는 상호주관적인 자유를 추구하는 것임을 알고, 이를 실천하는 방법을 모색할 수 있다. 이 성취기준은 성찰적 사고와 비판적 사고를 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤03-02","과":"인문학과 윤리","학":"고2~3","영":"자유와 평등","p":"불평등이 발생하는 원인 및 실질적 기회균등을 구현하기 위한 조건을 탐구하여, 자유롭고 평등한 삶을 위한 정의의 원칙을 도출할 수 있다.","h":["이 성취기준에서는 󰡔정의론󰡕*을 중심으로 하되 󰡔순자󰡕를 연계함으로써, 학생들이 불평등의 발생 원인과 문제점을 탐구하여 실질적 기회균등이 보장되는 정의로운 사회를 만들어갈 수 있도록 한다. 능력에 따른 분배와 다양한 기회균등의 양상을 분석하는 과정에서, 학생들은 정의에 대한 균형 있는 관점을 갖추고 자유와 평등이 실질적으로 보장되는 조건을 제시할 수 있다. 이 성취기준은 더불어 살아가는 능력을 기르는 데 초점을 둔다. ＊은 다영역 고전 표시(이하 동일)"]},{"교":"도덕","c":"12인윤04-01","과":"인문학과 윤리","학":"고2~3","영":"다양성과 포용성","p":"서로 다른 의견들이 발생하고 충돌하는 양상과 이유를 파악하고, 민주적인 방식으로 다양한 의견을 포용하는 방법과 절차를 모색하여 실천할 수 있다.","h":["이 성취기준에서는 󰡔자유론󰡕을 중심으로 하되 󰡔논어󰡕*를 연계함으로써, 학생들이 민주주의 사회에서 서로 다른 의견들이 발생하고 충돌하는 양상과 이유를 탐구하고, 다양한 의견을 포용하는 방법과 절차를 모색할 수 있도록 한다. 의견의 불일치는 다양성을 만들어내는 원천이 될 수 있음을 알고, 민주적이며 합리적인 의사소통의 방법과 절차를 배우고 실천할 수 있다. 이 성취기준은 포용성과 협력적 의사소통 능력을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤04-02","과":"인문학과 윤리","학":"고2~3","영":"다양성과 포용성","p":"가상세계와 현실세계의 같고 다른 점이 무엇인지 탐구하고, 가상세계에서도 자신과 타인을 존중하는 자세를 갖출 수 있다.","h":["이 성취기준에서는 󰡔스노 크래시󰡕를 중심으로 하되 󰡔장자󰡕*를 연계함으로써, 학생들이 가상세계와 현실세계의 삶이 서로 영향을 주고받음을 인식하고, 가상세계에서도 자신과 타인을 존중하는 태도를 내면화할 수 있도록 한다. 가상세계와 현실세계는 경계가 모호하지만 긴밀히 연결되어 있음을 이해하고, 통합적 관점으로 자아를 바라볼 수 있다. 이 성취기준은 성찰적 사고와 디지털 시민성을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤05-01","과":"인문학과 윤리","학":"고2~3","영":"공존과 지속가능성","p":"자아실현과 직업생활의 상호성을 이해하고, 삶의 방식으로서 소유와 존재의 의미를 탐구하여 나와 타인의 이익을 조화롭게 추구하는 삶의 태도를 함양할 수 있다.","h":["이 성취기준에서는 󰡔목민심서󰡕를 중심으로 하되 󰡔우리는 여전히 삶을 사랑하는가󰡕를 연계함으로써, 학생들이 물질주의와 고립된 개인주의라는 삶의 태도에 대해 성찰하여 바람직한 삶의 자세를 모색할 수 있도록 한다. 삶의 방식으로서 소유와 존재의 의미를 이해하여, 자아실현과 직업생활의 관계 및 나와 타인의 이익 고려 문제에 대해 탐구할 수 있다. 이 성취기준은 타인과 조화로운 관계 맺기 및 실존적인 삶의 자세를 갖도록 하는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤05-02","과":"인문학과 윤리","학":"고2~3","영":"공존과 지속가능성","p":"기후위기 문제를 비판적으로 인식하고, 지속가능한 삶을 위해 인간과 자연에 대한 이분법적 관점을 넘어선 상생의 원칙들을 수립하여 일상에서 실천할 수 있다.","h":["이 성취기준에서는 󰡔침묵의 봄󰡕을 중심으로 하되 󰡔노자󰡕를 연계함으로써, 학생들이 기후위기와 생태계 파괴를 절박한 윤리적 문제로 인식하여 지속가능한 삶을 위한 실천 방안을 탐구할 수 있도록 한다. 비판적 성찰 과정을 통해 기후위기 문제의 원인을 파악하고, 친환경적인 삶의 자세를 일상에서 내면화하는 노력을 할 수  있다. 이 성취기준은 도덕적 공동체 역량 및 도덕적 앎을 행동으로 옮길 수 있는 실천 동기를 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤06-01","과":"인문학과 윤리","학":"고2~3","영":"삶의 의미에 대한 물음","p":"인간의 불완전성에 대한 성찰을 바탕으로 불안한 현대사회를 살아가는 데 있어 종교의 역할과 가치를 탐구하여, 종교에 대한 바람직한 관점을 정립할 수 있다.","h":["이 성취기준에서는 󰡔신약󰡕⋅󰡔꾸란󰡕을 중심으로 하되 󰡔세계윤리 구상󰡕 및 󰡔성과 속󰡕을 연계함으로써, 학생들이 불안한 현대인들의 삶에서 종교의 역할과 가치를 탐구하여 종교에 대한 올바른 관점과 태도를 정립할 수 있도록 한다. 인간의 불완전성에 대한 자각을 토대로 현대사회의 불안 요인을 분석하고, 종교가 불완전성과 불안을 극복하는 대안으로 기능할 수 있는가에 관해 비판적으로 탐구할 수 있다. 이 성취기준은 비판적 성찰 및 다른 종교에 대한 포용성을 기르는 데 초점을 둔다."]},{"교":"도덕","c":"12인윤06-02","과":"인문학과 윤리","학":"고2~3","영":"삶의 의미에 대한 물음","p":"인생의 유한성을 자각하고, 자아에 대한 성찰 및 다양한 가치 탐색을 통하여 내 삶의 의미를 묻고 답을 찾아가는 도덕적 주체로서 살아갈 수 있다.","h":["이 성취기준에서는 󰡔수심결󰡕을 중심으로 하되 󰡔실존주의는 휴머니즘이다󰡕를 연계함으로써, 학생들이 인문학적 소양의 함양에 있어 삶의 유한성에 대한 자각이 중요함을 인식하고, 인생 전체가 지향하는 가치와 목적에 대해 탐색하여 삶의 의미를 찾는 방법을 탐구할 수 있도록 한다. 학생들은 ‘유한한 시간 속에서 나는 어떤 삶을 살 수 있을까?’라고 스스로 묻고, 그 해답을 발견하기 위해 고민할 수 있다. 이 성취기준은 학생들이 도덕적 탐구와 윤리적 성찰을 지속적으로 실천하는 도덕적 주체로서 삶을 살아가도록 하는 데 초점을 둔다."]},{"교":"도덕","c":"12윤탐01-01","과":"윤리문제 탐구","학":"고2~3","영":"윤리문제 탐구의 이해","p":"삶에서 경험하는 문제를 사실문제와 윤리문제로 구분할 수 있고, 윤리문제에 대한 규범적 가치 판단의 기준이 다양함을 이해할 수 있다."},{"교":"도덕","c":"12윤탐01-02","과":"윤리문제 탐구","학":"고2~3","영":"윤리문제 탐구의 이해","p":"윤리문제 탐구의 의미를 파악하고, 윤리문제 탐구의 다양한 방법들을 이해할 수 있다.","h":["이 성취기준의 취지는 윤리문제를 탐구하는 것의 의미를 이해하고 윤리문제를 탐구하는 다양한 방법들을 익히는 데 있다. 윤리문제 탐구는 윤리문제에 대한 도덕적 추론과 판단, 정서적 공감과 내면화, 실천적 요소 등을 포함하며, 윤리문제 탐구 방법에는 가치갈등, 가치분석, 콜버그 딜레마 토론, 도덕이야기, 역할놀이 등이 있다."]},{"교":"도덕","c":"12윤탐02-01","과":"윤리문제 탐구","학":"고2~3","영":"시민의 삶과 윤리적 탐구","p":"행복의 의미와 행복에 대한 뇌과학의 연구 성과를 조사하고, 윤리적 삶과 행복의 관계를 탐구할 수 있다.","h":["이 성취기준의 취지는 윤리적 삶과 행복한 삶의 지향점이 일치한다는 사실을 깨닫는 데 있다. 인간의 행복에 대한 최근 뇌과학에서의 연구 성과를 조사하고, 행복의 의미와 조건들을 분석하며 진정한 행복을 위해 요구되는 윤리적 가치와 태도의 소중함을 깨닫는 데 중점을 둔다."]},{"교":"도덕","c":"12윤탐02-02","과":"윤리문제 탐구","학":"고2~3","영":"시민의 삶과 윤리적 탐구","p":"사생활 존중과 공익 사이의 갈등 사례를 조사하고, 이를 해결할 수 있는 방안을 제시할 수 있다."},{"교":"도덕","c":"12윤탐02-03","과":"윤리문제 탐구","학":"고2~3","영":"시민의 삶과 윤리적 탐구","p":"사회적 차별 표현 사례를 조사하고, 이를 바라보는 다양한 관점을 이해하여 윤리적 해결 방안을 제시할 수 있다.","h":["이 성취기준의 취지는 사회에 만연한 사회적 차별과 증오 표현의 문제를 인격권 존중과 표현의 자유 보장이라는 관점에서 탐구하여 해결 방안을 모색하는 데 있다. 사회적 차별 표현의 사례를 조사하고, 사회적 차별 표현 문제를 바라보는 다양한 관점을 이해하여 공동체 구성원의 존엄성을 보장하는 해결 방안을 찾는 데 중점을 둔다."]},{"교":"도덕","c":"12윤탐02-04","과":"윤리문제 탐구","학":"고2~3","영":"시민의 삶과 윤리적 탐구","p":"배타적 민족주의의 확산과 난민 문제를 탐구하고, 이를 해결할 수 있는 방안을 제시할 수 있다."},{"교":"도덕","c":"12윤탐03-01","과":"윤리문제 탐구","학":"고2~3","영":"인공지능 시대의 삶과 윤리적 탐구","p":"메타버스의 특징을 윤리적 관점에서 탐색하고, 메타버스에서 발생할 수 있는 윤리문제의 해결 방안을 제시할 수 있다."},{"교":"도덕","c":"12윤탐03-02","과":"윤리문제 탐구","학":"고2~3","영":"인공지능 시대의 삶과 윤리적 탐구","p":"빅데이터와 알고리즘의 편향성으로 인한 윤리문제를 인식하고 사회적 책임과 공정성의 관점에서 해결 방안을 탐구할 수 있다."},{"교":"도덕","c":"12윤탐03-03","과":"윤리문제 탐구","학":"고2~3","영":"인공지능 시대의 삶과 윤리적 탐구","p":"인공지능 활용 시 발생할 수 있는 윤리적 딜레마에 대해 토의하고, 인공지능의 바람직한 활용 방안을 제시할 수 있다.","h":["이 성취기준의 취지는 인공지능 기술이 다양한 분야에 광범위하게 적용되면서 발생할 수 있는 윤리적 딜레마에 대해 토의하여 올바른 활용 방안을 제시하는 데 있다. 교육, 법률, 의료 등에서 인공지능 기술이 활용되면서 발생할 수 있는 다양한 문제 사례를 조사⋅분석해서 인공지능 기술의 바람직한 활용 방안을 마련하고 실천하는 데 중점을 둔다."]},{"교":"도덕","c":"12윤탐04-01","과":"윤리문제 탐구","학":"고2~3","영":"생태적 삶과 윤리적 탐구","p":"반려동물과 관련한 윤리문제, 동물 복지를 둘러싼 논쟁 등을 윤리적 관점에서 탐구하여 생명에 대한 감수성을 길러 책임 있게 행동할 수 있다."},{"교":"도덕","c":"12윤탐04-02","과":"윤리문제 탐구","학":"고2~3","영":"생태적 삶과 윤리적 탐구","p":"기후위기를 인류의 책임이라는 측면에서 분석하고, 에너지 전환과 탄소 중립을 둘러싼 다양한 입장에 대해 토론하여 기후위기 극복 방안을 제시할 수 있다.","h":["이 성취기준의 취지는 기후변화를 지속가능한 삶의 관점에서 인식하고 기후위기 극복 방안을 토의하여 실천하는 데 있다. 기후변화의 의미와 특징, 기후위기와 인류의 책임, 기후변화가 생태계에 미치는 영향 등을 과학적이고 윤리적인 관점에서 다각적으로 탐구하여 탄소 중립을 위한 에너지 전환 노력의 의미를 이해하고 실천하도록 하는 데 중점을 둔다."]},{"교":"도덕","c":"12윤탐05-01","과":"윤리문제 탐구","학":"고2~3","영":"윤리문제 탐구의 적용","p":"자신이 희망하는 진로에서 발생할 수 있는 윤리문제를 선정하고 탐구 계획을 수립할 수 있다.","h":["이 성취기준의 취지는 학습자 스스로가 자신의 진로와 관련된 윤리문제를 선정하고 다양한 윤리문제 탐구 방법을 활용해 자기주도적으로 탐구 계획을 수립하도록 하는 데 있다. 윤리문제를 선정할 때에는 사실관계의 분석뿐만 아니라 문제에 내포된 규범적 요소들을 분석하고, 탐구 계획을 수립할 때부터 해결 방안의 실현 가능성 여부를 고려하도록 한다."]},{"교":"도덕","c":"12윤탐05-02","과":"윤리문제 탐구","학":"고2~3","영":"윤리문제 탐구의 적용","p":"수립한 탐구 계획에 따라 윤리문제를 탐구하고 그 결과를 정리하여 발표할 수 있다."},{"교":"사회","c":"4사01-01","과":"사회","학":"초3~4","영":"우리가 사는 곳","p":"주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다.","h":["은 학생들의 생활이 이루어지는 주변 여러 장소에서의 경험과 느낌을 글, 그림, 심상지도 등의 다양한 방식으로 표현하고, 이를 통해 사람마다 장소감의 차이가 나타날 수 있음을 이해하도록 설정한 것이다. 장소감이란 장소에 대한 인지, 감정, 태도, 행동을 포괄하는 것으로 개인이나 집단이 장소에 부여하는 의미나 관심을 뜻한다. 장소 경험을 공유하는 과정에서 장소감의 차이를 이해하고 서로 존중하며, 주변의 장소를 알아가면서 이에 대한 관심을 심화시키는 데 초점을 맞춘다."]},{"교":"사회","c":"4사01-02","과":"사회","학":"초3~4","영":"우리가 사는 곳","p":"주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐색한다.","h":["는 학생들이 생활하는 데 편익을 제공하는 주요 장소 및 시설이나 기관을 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 찾아보도록 설정한 것이다. 특히, 우리가 사는 곳의 놀이⋅여가, 안전, 교육⋅문화, 건강⋅의료 등과 관련 있는 장소를 조사하여 좋은 점, 불편한 점 등을 확인하고, 학생들의 관점에서 살기 좋은 곳의 조건을 생각하면서 우리가 사는 곳에 관심을 가지도록 하는 데 중점을 둔다."]},{"교":"사회","c":"4사02-01","과":"사회","학":"초3~4","영":"일상에서 만나는 과거","p":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다.","h":["은 가정, 학교 등 학생 주변의 사례를 활용하여 역사의 시간 개념을 이해하도록 설정한 것이다. 역사에서 자주 사용하는 시간 표현 용어, 시간의 흐름 속에서 어떤 사건의 시간상 위치를 파악하는 등 역사의 시간 개념을 이해한다.","은 시간을 표현하는 용어, 사건의 시간적 위치, 과거와 현재의 거리감 등을 통해 역사의 시간 개념을 이해하고 시간 감각을 키우는 데 중점을 둔다."]},{"교":"사회","c":"4사02-02","과":"사회","학":"초3~4","영":"일상에서 만나는 과거","p":"오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.","h":["는 주변의 오래된 물건이나 자료 등이 과거 모습을 알려주는 증거 역할을 한다는 것을 이해하도록 설정한 것이다. 학생의 애장품을 비롯해 생활 주변에서 볼 수 있는 오래된 물건이나 자료(신문 기사, 편지, 일기, 노래 가사, 사진 등), 주변 사람들의 증언 등을 활용한다.","는 오래된 물건과 자료가 과거를 알려주는 증거임을 이해하고, 이를 통해 역사가 증거를 바탕으로 구성된다는 것을 파악하는 데 중점을 둔다."]},{"교":"사회","c":"4사02-03","과":"사회","학":"초3~4","영":"일상에서 만나는 과거","p":"지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.","h":["은 지역 사람들의 달라진 생활 모습을 탐구하며 역사의 변화와 지속을 이해하도록 설정한 것이다. 지역의 유래와 관련된 이야기, 지역의 변화를 알려주는 사진이나 영상 등 역사 자료를 활용하여 (변형되어, 혹은 그대로) 이어져 내려온 것, 사라진 것을 찾아 지역 사람들의 생활이 어떻게 달라졌는지 살펴본다."]},{"교":"사회","c":"4사03-01","과":"사회","학":"초3~4","영":"사회 변화와 다양한 문화","p":"최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다.","h":["은 사례를 통해 저출산, 고령화, 지능정보화 등 최근 사회 변화가 가져온 현상과 특징을 파악하고, 그로 인해 우리의 생활 모습이 어떻게 변화되는지 분석하도록 설정한 것이다. 이를 통하여 사회 변화에 대응할 수 있는 역량을 기르는 데 초점을 맞추도록 한다."]},{"교":"사회","c":"4사03-02","과":"사회","학":"초3~4","영":"사회 변화와 다양한 문화","p":"우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다.","h":["는 외국인 이주민의 증가, 1인 가구와 비혼, 반려동물 양육 등 다양한 문화가 확산⋅공유되면서 나타나는 긍정적 효과와 사회문제를 사례 또는 통계 자료를 통해 파악하도록 설정한 것이다. 이를 바탕으로 나와 다른 사람들의 삶의 방식이나 문화를 존중하는 태도를 함양하는 데 초점을 맞춘다."]},{"교":"사회","c":"4사04-01","과":"사회","학":"초3~4","영":"옛날과 오늘날의 생활 모습","p":"옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다.","h":["은 옛날의 다양한 풍습을 살펴보며 당시 사람들의 생활을 이해하고, 오늘날과 비교하여 변화상을 파악하도록 설정한 것이다. 놀이, 세시 풍속 등 여러 풍습을 통해 변화상을 알아보고 풍습 속에 담긴 옛날 사람들의 생활과 생각을 이해한다."]},{"교":"사회","c":"4사04-02","과":"사회","학":"초3~4","영":"옛날과 오늘날의 생활 모습","p":"옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다.","h":["는 교통로 및 교통수단의 변화와 달라진 사람들의 생활 모습과의 관계를 이해하도록 설정한 것이다. 시대에 따른 교통의 변화가 사람과 물자의 이동 및 생활 전반에 어떤 변화를 일으켰는지 살펴본다. 그리고 교통 발달에 따른 생활공간의 확대를 고려하여 변화를 설명한다."]},{"교":"사회","c":"4사04-03","과":"사회","학":"초3~4","영":"옛날과 오늘날의 생활 모습","p":"옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다.","h":["은 시대에 따른 통신수단의 변화 과정을 파악하고 이를 통해 달라진 사람들의 생활 모습을 파악하도록 설정한 것이다. 정보 교류와 의사소통 방식의 변화를 파악하여 통신 발달에 따른 공간적 변화를 탐색한다."]},{"교":"사회","c":"4사05-01","과":"사회","학":"초3~4","영":"지도로 만나는 우리 지역","p":"우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다.","h":["은 우리 지역을 표현한 다양한 종류의 지도를 탐색하고, 우리 지역의 지도를 활용하여 방위, 기호와 범례, 축척, 높낮이 표현 방식 등 지도 제작에 필요한 요소를 파악하도록 설정한 것이다. 여기서는 지도의 요소를 이해하여 일상생활에서 지도를 활용하는 데 초점을 맞춘다.","과 [4사05-02]에서의 우리 지역은 행정구역상 시⋅군⋅구 단위의 범위를 의미한다. [4사05-02]에서 우리 지역의 위치를 파악할 때는 시⋅도 단위의 행정구역 범위에서 위치를 찾아보고, 우리 지역과 연접한 지역(시⋅군⋅구)도 확인할 수 있다. 또한 전국 시⋅도 단위의 행정구역을 파악함으로써 [4사07-02]의 지역 간 교류 학습에서 다른 지역의 위치를 파악하는 데 도움이 되도록 한다."]},{"교":"사회","c":"4사05-02","과":"사회","학":"초3~4","영":"지도로 만나는 우리 지역","p":"지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다.","h":["는 행정구역을 나타낸 지도에서 지역의 위치를 파악하고, 지역의 지리 정보를 바탕으로 지역의 특징을 탐구하도록 설정한 것이다. 우리나라 지도에서 시⋅도 단위의 행정구역을 파악하면서 우리 지역(시⋅군⋅구)의 위치를 확인하고, 지역의 지리 정보(위치, 면적, 인구, 지형, 기온, 강수량 등)를 다른 지역과 비교하여 지역이 지닌 특징을 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"4사06-01","과":"사회","학":"초3~4","영":"우리 지역의 문화유산","p":"지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.","h":["은 문화유산에 관한 기본 지식 및 가치를 지역의 문화유산을 통해 이해하도록 설정한 것이다. 지역 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 이를 토대로 옛날 사람들의 생활 모습을 추론하며 과거와 현재를 이어주는 귀중한 자료로서 문화유산의 가치를 파악한다."]},{"교":"사회","c":"4사06-02","과":"사회","학":"초3~4","영":"우리 지역의 문화유산","p":"지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.","h":["는 지역에 있는 박물관, 기념관, 유적지 등을 방문하여 지역의 역사를 이해하기 위해 설정한 것이다. 박물관, 기념관, 유적지 등을 온오프라인으로 방문하여 학생이 주도적으로 지역의 역사에 관한 지식을 습득하고 해석하며 표현한다. 그리고 지역의 역사를 보존하고 실천하는 태도를 기른다."]},{"교":"사회","c":"4사07-01","과":"사회","학":"초3~4","영":"경제활동과 지역 간 교류","p":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.","h":["은 자원의 희소성 개념을 이해하고, 이를 바탕으로 경제활동에서 합리적 선택의 방법을 파악하도록 설정한 것이다. 여기서는 경제활동에서 선택의 문제가 발생하는 이유와 합리적 선택의 중요성을 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"4사07-02","과":"사회","학":"초3~4","영":"경제활동과 지역 간 교류","p":"생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호의존 관계를 맺고 있음을 탐색한다.","h":["는 생산과 소비의 개념을 이해하고, 한 지역의 생산과 소비 활동이 다른 지역과 상호의존 관계에 있음을 이해하도록 설정한 것이다. 여기서는 지역에서 이루어지는 생산과 소비 활동의 사례를 통하여 한 지역의 경제활동이 다른 지역과 상호 의존 관계에 있다는 사실을 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"4사08-01","과":"사회","학":"초3~4","영":"민주주의와 자치","p":"학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.","h":["은 학교 자치 사례를 통해 민주주의의 의미를 이해하고, 이를 바탕으로 학교생활에서 학교 자치를 실천할 수 있도록 설정한 것이다. 여기서는 학생이 학교 자치를 통해 민주주의를 실천하고 참여할 수 있는 능력을 기르는 데 초점을 맞춘다."]},{"교":"사회","c":"4사08-02","과":"사회","학":"초3~4","영":"민주주의와 자치","p":"지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.","h":["는 민주주의의 의미에 기초하여 마을이나 지역에서 이루어지는 주민 자치와 참여의 중요성을 파악하도록 설정한 것이다. 여기서는 마을이나 지역사회에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 이해하고 지역사회의 문제 해결에 관심을 갖고 참여하는 태도를 기르는 것에 초점을 맞춘다."]},{"교":"사회","c":"4사09-01","과":"사회","학":"초3~4","영":"지역문제를 해결하고 지역을 알리는 노력","p":"생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.","h":["은 각 지역에서 발생하는 문제를 민주적 방식으로 해결하는 과정과 방법을 습득하도록 설정한 것이다. 지리적 문제, 환경 문제, 사회적 문제, 역사적 문제 등 다양한 문제를 찾아서 토론을 통해 합리적으로 해결하는 방법과 능력을 배우는 데 초점을 맞춘다."]},{"교":"사회","c":"4사09-02","과":"사회","학":"초3~4","영":"지역문제를 해결하고 지역을 알리는 노력","p":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.","h":["는 지역의 자연환경, 역사, 문화, 생산물 등을 알리기 위한 여러 활동을 조사하면서 지역을 이해하도록 설정한 것이다. 여기서는 지역의 자연환경, 역사, 문화, 생산물 등을 살펴보고, 지역에 관심을 가지며, 지역사회에 참여하는 태도를 기르는 데 주안점을 둔다."]},{"교":"사회","c":"4사10-01","과":"사회","학":"초3~4","영":"다양한 환경과 삶의 모습","p":"여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.","h":["은 우리 지역과 다른 자연환경 및 인문환경이 나타나는 곳을 살펴보고, 환경의 이용과 개발로 변화한 모습을 탐구하도록 설정한 것이다. 여기서는 다양한 환경 특성을 파악하고, 개발로 인해 나타난 긍정적, 부정적 변화 모습을 균형 잡힌 관점으로 파악하는 데 중점을 둔다."]},{"교":"사회","c":"4사10-02","과":"사회","학":"초3~4","영":"다양한 환경과 삶의 모습","p":"사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.","h":["는 우리나라 여러 도시의 특징을 탐구하면서 도시에서 나타나는 삶의 모습을 종합적으로 이해하도록 설정한 것이다. 사례에서 도시의 경관, 인구, 교통, 산업, 생활방식의 특징을 이해하고 도시 생활의 좋은 점과 문제들을 파악하는 데 중점을 둔다."]},{"교":"사회","c":"6사01-01","과":"사회","학":"초5~6","영":"우리나라 국토 여행","p":"우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.","h":["은 우리나라 주요 산지, 하천, 해안 지형의 위치를 지도에서 확인하고 그 분포 특징을 파악하도록 설정한 것이다. 이를 바탕으로 국토 환경에 대한 기초적인 지식을 기르는 데 중점을 둔다."]},{"교":"사회","c":"6사01-02","과":"사회","학":"초5~6","영":"우리나라 국토 여행","p":"독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.","h":["는 독도의 위치, 지형, 기후, 동식물 등의 지리적 특성을 파악하고 독도에 대한 역사 기록을 탐구하여 영토 주권 의식을 기르도록 설정한 것이다. 이를 바탕으로 영토로서 독도의 가치를 인식하고 위상을 확인하는 데 주안점을 둔다."]},{"교":"사회","c":"6사02-01","과":"사회","학":"초5~6","영":"우리나라 지리 탐구","p":"우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다.","h":["은 기후 그래프를 비롯해 디지털 영상 자료와 지도, 통계 자료, 사진 등 다양한 시각 자료를 활용하여 우리나라의 계절별 기후 특징을 기온, 강수, 바람의 측면에서 탐구하도록 설정한 것이다. 또한 기후변화로 자연재해가 심화하고 있음을 파악하고 기후 행동 등에 참여하는 태도를 갖는 데 주안점을 둔다."]},{"교":"사회","c":"6사02-02","과":"사회","학":"초5~6","영":"우리나라 지리 탐구","p":"우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다.","h":["는 우리나라의 인구 분포 특징을 수도권 인구 집중과 관련한 자료를 중심으로 탐구하면서 인구 집중의 원인, 문제, 그리고 이를 해결하려는 노력을 알아보도록 설정한 것이다. 이를 통해 인구 분포의 불균형과 인구 문제의 심각성을 이해하여 국토 균형 발전의 중요성을 인식하고 해결 방안을 탐색하는 데 주안점을 둔다."]},{"교":"사회","c":"6사03-01","과":"사회","학":"초5~6","영":"법과 인권의 보장","p":"일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.","h":["은 우리 생활에 영향을 미치는 법의 의미와 역할을 일상 사례를 통해 이해하고, 헌법에 규정된 인권을 보장하는 다양한 사례를 조사하도록 설정한 것이다. 이를 통해 준법 태도와 인권 의식을 기르는 데 초점을 맞춘다."]},{"교":"사회","c":"6사03-02","과":"사회","학":"초5~6","영":"법과 인권의 보장","p":"일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.","h":["는 일상생활에서 발생하는 인권 침해 문제의 해결 방안을 제시할 수 있는 능력을 기르도록 설정한 것이다. 인권 문제 해결과 관련된 토론 및 문제 해결의 과정을 통해 인권 보호 활동에 참여하는 능력과 태도를 함양하는 데 중점을 둔다."]},{"교":"사회","c":"6사04-01","과":"사회","학":"초5~6","영":"유적과 유물로 살펴본 옛 사람들의 생활","p":"선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활을 추론한다.","h":["은 선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활 모습을 추론하도록 설정한 것이다. 당시 사람들의 생활을 추론하는 데 적절한 유적과 유물 등을 선정하여 탐구 과정을 경험하도록 한다."]},{"교":"사회","c":"6사04-02","과":"사회","학":"초5~6","영":"유적과 유물로 살펴본 옛 사람들의 생활","p":"역사 기록이나 유적과 유물에 나타난 고대 사람들의 생각과 생활을 추론한다.","h":["는 고대의 역사 기록이나 유적과 유물을 활용하여 당시 사람들의 생각이나 생활 모습을 추론하기 위해 설정한 것이다. 󰡔삼국사기󰡕, 󰡔삼국유사󰡕 등 역사 기록이나 삼국⋅가야⋅통일신라⋅발해 사람들의 생각과 생활 모습이 드러난 유적과 유물을 탐구하여 고대 사회의 여러 면모를 알아본다."]},{"교":"사회","c":"6사04-03","과":"사회","학":"초5~6","영":"유적과 유물로 살펴본 옛 사람들의 생활","p":"다양한 역사 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 추론한다.","h":["은 유적과 유물, 역사 기록 등 여러 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 탐구하도록 설정한 것이다. 종교, 성별, 신분, 교류 등과 관련된 내용 중에서 고려 시대 사회 모습과 사람들의 생활을 보여주는 주제를 선택하여 살펴본다."]},{"교":"사회","c":"6사05-01","과":"사회","학":"초5~6","영":"달라지는 시대, 변화하는 생활 모습","p":"조선 시대 사람들의 생각과 생활에 유교 문화가 미친 영향을 파악한다.","h":["은 유교 문화가 정착되는 과정에서 조선 시대 사람들의 생각과 생활이 어떻게 달라졌는지를 여러 분야에서 파악하도록 설정한 것이다. 유교 문화가 조선 사회에 미친 영향을 다양한 사례를 중심으로 탐구하는 데 초점을 둔다.","은 조선 전기부터 조선 후기까지 유교 문화가 조선 사회에 미친 영향을 파악하는 데 중점을 둔다."]},{"교":"사회","c":"6사05-02","과":"사회","학":"초5~6","영":"달라지는 시대, 변화하는 생활 모습","p":"조선 후기 사회⋅문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 사람들의 생활을 이해한다.","h":["는 조선 후기 사회⋅문화적 변화 양상과 개항 이후 근대 문물 수용으로 달라진 생활 모습을 이해하도록 설정한 것이다. 조선 후기 새로운 문화 주체로 등장한 사람들의 활동을 살펴보고 개항 이후 근대 문물의 수용, 변형 등을 파악한다."]},{"교":"사회","c":"6사06-01","과":"사회","학":"초5~6","영":"식민 통치와 저항, 전쟁이 바꾼 사회와 생활","p":"일제의 식민 통치와 이에 대한 저항이 사회와 생활에 미친 영향을 이해한다.","h":["은 일제 식민 통치와 국권 회복을 위한 저항으로 달라진 사회와 식민 통치하에 사람들의 생활 모습을 알아보도록 설정한 것이다. 3⋅1 운동 등 일제에 대한 저항을 알아보고, 이로 인해 달라진 사회 변화와 사람들의 생활을 사례를 중심으로 살펴본다."]},{"교":"사회","c":"6사06-02","과":"사회","학":"초5~6","영":"식민 통치와 저항, 전쟁이 바꾼 사회와 생활","p":"8⋅15 광복과 6⋅25 전쟁이 사회와 생활에 미친 영향을 파악한다.","h":["는 8⋅15 광복과 6⋅25 전쟁이 사회와 사람들의 생활에 가져온 변화를 살펴보도록 설정한 것이다. 8⋅15 광복과 6⋅25 전쟁을 알아보고, 성별, 연령, 계층 등 사람들의 생활과 사회 전반에 미친 영향을 구체적 사례로 파악한 후 오늘날까지 영향을 미치고 있음을 이해한다."]},{"교":"사회","c":"6사07-01","과":"사회","학":"초5~6","영":"평화 통일을 위한 노력, 민주화와 산업화","p":"분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다.","h":["은 분단으로 나타난 문제점과 평화 통일을 위한 과제를 탐색하도록 설정한 것이다. 분단이 사회와 사람들의 생활에 미친 영향을 알아보고, 분단과 관련된 장소를 평화의 장소로 만들려는 사람들의 노력을 살펴본다. 그리고 평화 통일의 필요성을 인식하고 이를 위해 우리가 할 수 있는 일을 탐색한다."]},{"교":"사회","c":"6사07-02","과":"사회","학":"초5~6","영":"평화 통일을 위한 노력, 민주화와 산업화","p":"민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다.","h":["는 민주화, 산업화가 사람들의 생활과 어떤 관계가 있는지 알아보도록 설정한 것이다. 사회적인 강압이나 통제에서 벗어나기 위해 노력한 다양한 분야 사람들의 모습과 산업화로 달라진 사람들의 생활을 여러 사례를 중심으로 이해한다."]},{"교":"사회","c":"6사08-01","과":"사회","학":"초5~6","영":"민주주의와 시민 참여","p":"민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다.","h":["은 민주주의에서 시민의 주권 행사의 한 방법으로써 선거의 역할과 중요성을 파악하도록 설정한 것이다. 이를 바탕으로 선거에 주체적으로 참여하는 태도를 형성하는 데 중점을 둔다."]},{"교":"사회","c":"6사08-02","과":"사회","학":"초5~6","영":"민주주의와 시민 참여","p":"민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립하는 이유를 탐색한다.","h":["는 우리나라 민주주의에서 국회, 행정부, 법원이 하는 일을 이해하도록 설정한 것이다. 이를 바탕으로 시민의 자유와 권리 보장 측면에서 권력 분립의 이유를 파악하는 데 중점을 둔다."]},{"교":"사회","c":"6사08-03","과":"사회","학":"초5~6","영":"민주주의와 시민 참여","p":"민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다.","h":["은 민주주의에서 신문, 방송, 사회 관계망 서비스(SNS) 같은 미디어가 하는 역할을 파악하고, 미디어가 제공한 거짓 또는 왜곡된 정보와 내용 등을 찾아 비판적으로 분석하고 평가하도록 설정한 것이다. 이런 비판적 분석을 통해 미디어를 올바르게 이용하는 능력을 함양하는 데 초점을 맞춘다."]},{"교":"사회","c":"6사09-01","과":"사회","학":"초5~6","영":"지구, 대륙 그리고 국가들","p":"세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.","h":["은 지구본, 세계지도뿐만 아니라 디지털 공간 영상 정보 등 다양한 공간 자료의 특성을 이해하고 이를 활용하여 세계에 대한 기초적인 지리 정보를 획득하려고 설정한 것이다. 여기서는 경⋅위도의 의미를 이해하고, 이를 활용하여 위치를 표현하는 방법을 익히도록 한다."]},{"교":"사회","c":"6사09-02","과":"사회","학":"초5~6","영":"지구, 대륙 그리고 국가들","p":"세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.","h":["는 위치가 갖는 중요성을 인식하여 지구본과 세계지도에서 세계의 대륙 및 대양의 위치를 파악하도록 설정한 것이다. 세계 여러 국가의 위치와 영토의 형상 등 기초적인 지리 정보를 획득하는 데 주안점을 둔다."]},{"교":"사회","c":"6사10-01","과":"사회","학":"초5~6","영":"세계의 자연환경","p":"세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다.","h":["은 세계적으로 유명한 산지, 하천, 해안 지역 등의 경관 특징과 그곳에서 살아가는 사람들의 생활 모습에서 세계 여러 지역의 다양성을 이해하도록 설정한 것이다. 여기서는 우리와 다른 지역의 생활 모습에 관심을 갖는 데 주안점을 둔다."]},{"교":"사회","c":"6사10-02","과":"사회","학":"초5~6","영":"세계의 자연환경","p":"세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다.","h":["는 기온 및 강수량을 나타낸 기후 그래프, 지도, 사진 자료 등을 활용하여 세계 주요 기후의 분포를 파악하도록 설정한 것이다. 여기서는 기후와 인간 생활을 관련지어 이해하는 데 중점을 둔다."]},{"교":"사회","c":"6사11-01","과":"사회","학":"초5~6","영":"시장경제와 국가 간 거래","p":"시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다.","h":["은 시장경제의 특징에 대한 이해를 바탕으로 가계와 기업의 역할 및 상호 의존 관계를 파악하고, 근로자의 권리와 기업의 자유로운 경제활동 및 사회적 책임을 탐색하도록 설정한 것이다. 이를 바탕으로 근로자의 권리를 보호하고 기업이 자유로운 경제활동과 이윤을 추구하면서 사회적 책임을 이행하는 것의 중요성을 인식하는 데 초점을 맞춘다."]},{"교":"사회","c":"6사11-02","과":"사회","학":"초5~6","영":"시장경제와 국가 간 거래","p":"경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다.","h":["는 우리나라의 경제성장이 우리 생활에 미친 긍정적⋅부정적 영향을 통계 자료를 통해 파악하고 빠른 경제성장으로 발생한 문제의 해결 방안을 찾도록 설정한 것이다. 또한, 토론을 통해 빠른 경제성장으로 발생하는 문제를 합리적으로 해결하는 방안을 찾는 데 중점을 둔다."]},{"교":"사회","c":"6사11-03","과":"사회","학":"초5~6","영":"시장경제와 국가 간 거래","p":"사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다.","h":["은 학생이 접할 수 있는 수입⋅수출 상품의 사례에서 무역의 의미와 중요성을 파악하고 세계 여러 나라 간 무역이 발생하는 이유를 탐구하도록 설정한 것이다. 이를 바탕으로 오늘날 여러 나라가 무역을 통해 경쟁 및 상호 의존 관계에 있음을 파악하는 데 중점을 둔다."]},{"교":"사회","c":"6사12-01","과":"사회","학":"초5~6","영":"지구촌 사람들","p":"세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다.","h":["은 세계의 인구 분포를 파악하고, 인구수 및 인구 밀도의 특징이 두드러진 국가를 탐구하도록 설정한 것이다. 여기서는 지구촌 시대의 세계 여러 지역에 대한 기본적인 지리 정보를 습득하는 데 초점을 맞춘다."]},{"교":"사회","c":"6사12-02","과":"사회","학":"초5~6","영":"지구촌 사람들","p":"지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색한다.","h":["는 지구촌의 평화와 발전을 위협하는 문제를 파악하고 이를 해결하려는 방안을 탐색하며, 지속가능한 지구촌을 건설하는 데 관심을 가지도록 설정한 것이다. 세계에 대한 올바른 이해를 바탕으로 세계시민으로서 지녀야 할 관점과 태도를 함양하는 데 주안점을 둔다."]},{"교":"사회","c":"9사(지리)01-01","과":"사회(지리 영역)","학":"중1~3","영":"세계화 시대, 지리의 힘","p":"세계 여러 지역의 특성을 해당 지역의 위치와 자연⋅인문환경을 고려하여 추론한다.","h":["은 세계 대지형이나 기후 지역 등 대표적인 사례 지역들을 통해 절대적, 상대적 위치에 따라 나타나는 자연환경적 특성 및 이로 인한 인문환경적 특성을 고려하여 세계 여러 지역의 특성을 추론할 수 있도록 설정된 것이다. 이를 통해 ‘모자이크로서의 세계’에 대한 이해를 바탕으로 세계 여러 지역의 차이와 다양성을 인식하는 데 중점을 둔다. 다양한 지역의 사례를 통해 세계시민으로서 지역의 다양성에 대한 인식과 열린 태도의 중요성을 파악한다."]},{"교":"사회","c":"9사(지리)01-02","과":"사회(지리 영역)","학":"중1~3","영":"세계화 시대, 지리의 힘","p":"다양한 스케일에서 지역이 서로 연계되어 있음을 공간적 상호 작용의 사례를 통해 파악한다.","h":["는 국지적 수준에서부터 전 지구적 수준에 이르기까지 다양한 공간 스케일에서 지역이 서로 연결되어 있음을 공간적 상호 작용의 사례를 통하여 파악할 수 있도록 설정된 것이다. 이를 통해 ‘네트워크로서의 세계’에 대한 이해를 바탕으로 세계 여러 지역의 상호연계성과 상호의존성을 인식하는 데 중점을 둔다. 한 지역을 이해하기 위해서는 다른 지역과의 접근성과 관계성, 네트워크상의 위치성이나 연결성, 기능에 대한 이해가 필요하며, 세계화 시대에 지역에 대한 이러한 지리 인식이 왜 중요한지 다양한 사례를 통해 파악하도록 한다."]},{"교":"사회","c":"9사(지리)01-03","과":"사회(지리 영역)","학":"중1~3","영":"세계화 시대, 지리의 힘","p":"세계의 변화가 지역에 영향을 미치고 지역의 변화가 세계에 영향을 미치는 사례를 조사한다.","h":["은 문화 및 경제의 세계화로 인해 세계가 등질화된 모습을 보이며 통합적으로 바뀌는 한편, 지역의 자율성이 강화되고 지역의 변화가 세계에 미치는 영향도 커지고 있음을 사례 조사를 통해 파악할 수 있도록 설정된 것이다. 이를 통해 세계 여러 지역의 역동성을 인식하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)02-01","과":"사회(지리 영역)","학":"중1~3","영":"아시아","p":"다양한 지리 정보와 매체를 활용하여 아시아의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","h":["은 다양한 지리 정보 및 매체에 표현된 아시아(동아시아⋅동남아시아⋅남부아시아⋅서남아시아⋅중앙아시아)의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)02-02","과":"사회(지리 영역)","학":"중1~3","영":"아시아","p":"종교와 관련된 아시아의 다양한 문화경관과 생활양식을 파악하고, 세계시민으로서 문화 다양성에 대한 이해와 수용성을 높인다.","h":["에서는 종교(불교, 힌두교, 이슬람교, 크리스트교 등)와 관련된 아시아의 다양한 문화경관 및 생활양식을 구체적인 사례를 통해 파악한다. 또한 다양한 종교의 공존과 갈등을 이해함으로써 문화 다양성의 중요성을 인식하고 다양한 문화를 존중하고 수용할 줄 아는 세계시민의 자질을 기르는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)02-03","과":"사회(지리 영역)","학":"중1~3","영":"아시아","p":"아시아의 인구 특징을 파악하고 지역별 인구 구조 변화를 비교하여 지역 발전의 가능성 및 변화 모습을 추론한다.","h":["은 인구 지표(총 인구수, 연령별 인구수, 이민자 수 등)를 통하여 아시아 지역의 인구 특징(저출산⋅고령화, 인구 증가 등)을 파악할 수 있는 기회를 제공한다. 또한 각 지역의 인구 구조를 비교해 봄으로써 지역의 성장 잠재력을 인식하고 앞으로의 변화 모습을 추론해 보는 기회를 제공한다."]},{"교":"사회","c":"9사(지리)02-04","과":"사회(지리 영역)","학":"중1~3","영":"아시아","p":"글로컬 관점에서 아시아의 산업 특징과 변화를 파악하고, 이것이 우리나라 산업에 미치는 영향을 탐색한다.","h":["는 지역적, 국가적, 세계적 스케일의 상호 작용 측면에서 아시아의 산업 특징(천연자원 생산, 노동 집약적인 제조업, 고부가가치의 첨단⋅문화 산업 등) 및 변화를 파악하고, 이러한 변화가 우리나라의 산업에 미치는 영향을 다각도로 탐색할 수 있도록 초점을 둔다."]},{"교":"사회","c":"9사(지리)03-01","과":"사회(지리 영역)","학":"중1~3","영":"유럽","p":"다양한 지리 정보와 매체를 활용하여 유럽의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","h":["은 다양한 지리 정보 및 매체에 표현된 유럽의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)03-02","과":"사회(지리 영역)","학":"중1~3","영":"유럽","p":"다양한 유형의 유럽 도시를 탐색하고, 기후위기에 대응하여 지속가능한 도시를 만들기 위한 노력을 조사한다.","h":["는 다양한 기능과 특징을 가진 유럽의 도시를 살펴봄으로써 생활공간으로서 도시의 다양성과 역동성을 인식한다. 특히 탄소중립 등 기후위기에 대처하는 유럽의 친환경 정책이 지속가능한 삶을 위해 생활공간과 일상생활을 어떠한 방식으로 변화시키고 있는지 관심을 가지게 함으로써 기후위기에 대응하는 방법에 대한 사고의 폭을 넓히기 위해 설정된 것이다."]},{"교":"사회","c":"9사(지리)03-03","과":"사회(지리 영역)","학":"중1~3","영":"유럽","p":"지역 간 역학관계에 따른 유럽의 통합과 분리의 움직임이 유럽연합의 변화와 주민 생활에 미치는 영향을 탐색한다.","h":["은 유럽연합을 통해 유럽의 국가들이 정치⋅경제적으로 하나의 유럽으로 통합되는 흐름 속에서 고유한 문화권을 중심으로 하는 지역⋅국가의 분리 움직임이 유럽연합 및 주민 생활에 미치는 영향을 탐색하기 위하여 설정된 것이다."]},{"교":"사회","c":"9사(지리)04-01","과":"사회(지리 영역)","학":"중1~3","영":"아프리카","p":"다양한 지리 정보와 매체를 활용하여 아프리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","h":["은 다양한 지리 정보 및 매체에 표현된 아프리카의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)04-02","과":"사회(지리 영역)","학":"중1~3","영":"아프리카","p":"아프리카의 지리적 특성에 기반한 다양한 문화와 지역 잠재력을 탐구하고, 아프리카에 대한 자신의 인식을 성찰한다.","h":["는 아프리카의 다양한 문화 및 지역의 잠재력을 탐구하는 활동을 통하여 아프리카에 대한 지금까지의 인식을 스스로 생각해 볼 수 있는 기회를 제공하는 데 초점을 둔다."]},{"교":"사회","c":"9사(지리)04-03","과":"사회(지리 영역)","학":"중1~3","영":"아프리카","p":"지속가능한 발전을 위한 아프리카 각 지역의 노력과 세계 다양한 주체들의 협력 사례를 조사하고, 세계시민으로서 우리가 참여할 수 있는 방안을 모색한다.","h":["은 지속가능한 발전을 위한 아프리카의 주체적 노력 및 협력 사례를 조사함으로써 아프리카를 교류와 협력의 동반자로 인식하고, 더 공정하고 지속가능한 세계를 만드는 과정에 동참하는 태도를 기르도록 설정되었다."]},{"교":"사회","c":"9사(지리)05-01","과":"사회(지리 영역)","학":"중1~3","영":"아메리카","p":"다양한 지리 정보와 매체를 활용하여 아메리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","h":["은 다양한 지리 정보 및 매체에 표현된 아메리카의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)05-02","과":"사회(지리 영역)","학":"중1~3","영":"아메리카","p":"다양한 민족(인종)으로 구성된 아메리카의 인구 특징을 살펴보고, 사례를 들어 아메리카의 문화 혼종성을 설명한다.","h":["는 민족(인종)의 관점에서 아메리카의 인구 구성 특징을 알아보고, 아메리카 국가들의 문화적 특징을 다양한 문화와 시간들의 공존과 교차의 결과로 이해할 수 있도록 설정된 것이다."]},{"교":"사회","c":"9사(지리)05-03","과":"사회(지리 영역)","학":"중1~3","영":"아메리카","p":"초국적 기업의 글로벌 생산체제에 대한 이해를 바탕으로, 초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유, 그에 따른 해당 지역의 변화를 분석한다.","h":["은 아메리카 지역을 사례로 초국적 기업의 생산체제가 지역에 미치는 영향을 분석하기 위해 설정된 것이다. 초국적 기업의 입지 및 해외 이전에 따른 지역의 변화를 분석함으로써 ‘어디에?’, ‘그곳에 왜?’라는 지리적 질문을 제기하고 해결하는 사고 과정을 유도한다."]},{"교":"사회","c":"9사(지리)06-01","과":"사회(지리 영역)","학":"중1~3","영":"오세아니아와 극지방","p":"다양한 지리 정보와 매체를 활용하여 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악하고, 자원 수출을 중심으로 세계 다른 지역과의 상호연계성을 탐색한다.","h":["은 다양한 지리 정보 및 매체에 표현된 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악할 수 있도록 설정되었으며, 오세아니아와 세계 다른 지역 간의 연계 및 공간적 상호 작용을 자원 수출의 측면에서 탐구하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)06-02","과":"사회(지리 영역)","학":"중1~3","영":"오세아니아와 극지방","p":"태평양 지역이 겪고 있는 환경 문제를 조사하고 그 해결에 참여할 수 있는 방안을 제안한다.","h":["는 태평양 지역이 겪고 있는 환경 문제(해양 쓰레기, 해수면 상승 등)를 조사함으로써 우리의 삶이 다른 지역의 삶에 영향을 미칠 수 있음을 인식하고 지구적 관점에서 행동할 수 있는 세계시민의 자질을 기르는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)06-03","과":"사회(지리 영역)","학":"중1~3","영":"오세아니아와 극지방","p":"극지방의 지리적 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다.","h":["은 극지방의 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴봄으로써 지역의 지리적 이슈를 여러 측면에서 평가하고 논리적으로 자신의 의견을 정리하여 소통할 수 있는 능력을 기르는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)07-01","과":"사회(지리 영역)","학":"중1~3","영":"대한민국, 우리가 살아가는 곳","p":"우리 국토의 위치와 영역에 대한 이해를 바탕으로 세계 속에서 우리나라의 위치를 지정학, 지경학적 측면에서 탐색한다.","h":["은 우리 국토의 위치와 영역에 대한 기본적 지식과 개념 이해를 바탕으로 국토의 공간적 범위를 명확하게 인지하도록 하는 데 초점을 둔다. 그리고 우리나라의 위치를 다른 국가와의 관계 속에서 바라본 지정학적 위치뿐만 아니라 글로벌 경제 속에서 바라본 지경학적 위치 측면에서 조망할 기회를 제공한다."]},{"교":"사회","c":"9사(지리)07-02","과":"사회(지리 영역)","학":"중1~3","영":"대한민국, 우리가 살아가는 곳","p":"우리나라 행정구역과 주요 도시의 위치를 파악하고, 자신이 살고 있는 곳의 장소성과 장소감을 표현한다.","h":["는 우리나라를 구성하는 지역의 절대적 위치 및 상대적 위치를 파악하기 위한 공간의 인식 틀로서 다양한 수준의 행정구역을 파악할 수 있도록 설정하였다. 많은 사람이 모여 살고 다양한 기능이 집중하는 생활공간으로서 우리나라 주요 도시의 위치를 파악하도록 한다. 자신이 살고 있는 장소에 관심을 갖고 장소가 지니는 의미와 특성을 살펴보는 과정에서 장소감과 장소애를 가질 수 있도록 하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)07-03","과":"사회(지리 영역)","학":"중1~3","영":"대한민국, 우리가 살아가는 곳","p":"다양한 지리 정보와 매체를 활용하여 우리 지역의 문제를 선정하고 지리적으로 시각화한다.","h":["은 우리가 살고 있는 지역의 지리적 문제를 발견하고 발견한 문제의 내용을 효과적으로 시각화할 수 있는 매체를 사용하여 지리적으로 표현해 봄으로써, 지리적 시각화 방법을 학습하고 우리 지역에 대한 관심을 높일 수 있는 경험을 제공한다."]},{"교":"사회","c":"9사(지리)08-01","과":"사회(지리 영역)","학":"중1~3","영":"우리나라의 자연환경과 인간 생활","p":"우리나라 주요 산지⋅하천⋅해안 지형의 위치와 특성을 파악하고, 매력적인 지형 경관을 탐색하여 우리 국토의 아름다움을 느낀다.","h":["은 우리나라 주요 산지⋅하천⋅해안 지형의 위치와 특성을 파악함으로써 우리나라의 지역 구분과 주민 생활에 영향을 주는 주요 지형에 대한 기초적인 지식을 갖추는 데 중점을 둔다. 우리나라의 매력적인 지형 경관을 다양한 매체를 통해 탐색함으로써, 우리 국토에 대한 호기심과 아름다움을 느끼고 이를 소중하게 여기는 태도를 가지도록 한다."]},{"교":"사회","c":"9사(지리)08-02","과":"사회(지리 영역)","학":"중1~3","영":"우리나라의 자연환경과 인간 생활","p":"우리나라의 계절별, 지역별 기후 특성 및 변화 양상을 파악하고, 기후변화에 대한 지역별 대응 노력을 조사한다.","h":["는 우리나라의 기후 특성을 다양한 기후 요소를 통해 계절별, 지역별로 파악함으로써 주민 생활의 모습을 이해하기 위한 기초적인 지식을 갖추는 데 초점을 둔다. 또한 최근 전 세계적인 기후변화가 우리나라 각 지역 주민들의 일상에 영향을 주고 있음을 파악하고, 우리나라의 기후변화 양상 및 지역별 대응 노력을 다양한 매체를 통해 조사하도록 한다."]},{"교":"사회","c":"9사(지리)08-03","과":"사회(지리 영역)","학":"중1~3","영":"우리나라의 자연환경과 인간 생활","p":"우리나라 자연재해의 지리적 특성과 피해 최소화를 위한 노력을 파악하고, 일상생활 속 다양한 상황에서 자연재해 발생 시 자신의 대처 방안을 탐색한다.","h":["은 우리나라에서 빈번하게 발생하는 자연재해의 지리적 특성을 파악하고, 자연재해의 피해를 최소화하기 위한 노력뿐만 아니라 일상생활 속에서 발생할 수 있는 다양한 자연재해 상황에서 학생 자신이 안전하게 대처할 수 있도록 하는 데 초점을 맞춘다."]},{"교":"사회","c":"9사(지리)09-01","과":"사회(지리 영역)","학":"중1~3","영":"중부 지역","p":"다양한 지리 정보와 매체를 활용하여 중부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다.","h":["은 중부 지역의 지리적 특성 및 매력이 드러나는 여행 장소를 선정하고, 이를 바탕으로 중부 지역의 매력적인 자연환경 및 문화에 대한 이해와 관심을 높이도록 설정되었다."]},{"교":"사회","c":"9사(지리)09-02","과":"사회(지리 영역)","학":"중1~3","영":"중부 지역","p":"수도권의 공간 구조를 파악하고, 인구⋅문화⋅경제적 측면을 중심으로 수도권의 변화 양상을 탐색한다.","h":["는 수도권 공간 구조의 특성 및 변화 양상을 인구⋅문화⋅경제적 측면에서 종합적으로 탐색하는 데 중점을 두었다."]},{"교":"사회","c":"9사(지리)09-03","과":"사회(지리 영역)","학":"중1~3","영":"중부 지역","p":"강원⋅충청 지역의 변화를 교통 발달과 수도권과의 관계를 중심으로 파악하고, 강원⋅충청 지역의 산업 변화와 지역경제 활성화를 위한 노력을 조사한다.","h":["은 장소 간 연계를 강화시켜주는 교통의 발달 및 공간적 상호 작용의 측면에서 강원⋅충청 지역의 변화를 파악하도록 하였다. 또한 산업 변화와 지역 경제 활성화 측면에서 해당 지역의 노력을 이해하는 데 중점을 두었다."]},{"교":"사회","c":"9사(지리)09-04","과":"사회(지리 영역)","학":"중1~3","영":"중부 지역","p":"수도권과 비수도권 간의 지역 불균형 실태를 지도로 표현하고, 지역 불균형을 완화하기 위한 방안들을 제안한다.","h":["다양한 시사 문제와 지리 정보를 기반으로 수도권과 비수도권 간의 지역 불균형 문제를 다양한 형태의 지도로 표현하고, 학습자가 지역 불균형 문제를 완화하기 위한 방안을 제안할 수 있는 기회를 제공하는 데 초점을 맞추었다."]},{"교":"사회","c":"9사(지리)10-01","과":"사회(지리 영역)","학":"중1~3","영":"남부 지역","p":"다양한 지리 정보와 매체를 활용하여 남부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다.","h":["은 남부 지역의 지리적 특성 및 매력이 드러나는 여행 장소를 선정하고, 이를 바탕으로 남부 지역의 매력적인 자연환경 및 문화에 대한 이해와 관심을 높이도록 설정되었다."]},{"교":"사회","c":"9사(지리)10-02","과":"사회(지리 영역)","학":"중1~3","영":"남부 지역","p":"글로벌 경제와 우리나라 산업에서 영⋅호남 공업 지역의 위상을 파악하고, 영⋅호남 지역의 산업 변화와 당면 과제를 조사한다.","h":["는 영⋅호남 공업 지역이 글로벌 경제와 우리나라 산업에서 차지하는 위상 및 영향력을 다양한 매체 및 자료를 활용하여 파악하고, 글로벌 경제의 흐름에 대응하여 경쟁력을 갖추기 위한 영⋅호남 지역의 산업 구조(농업, 공업, 서비스업 등)의 변화 모습과 앞으로의 당면 과제를 조사할 수 있도록 의도하였다."]},{"교":"사회","c":"9사(지리)10-03","과":"사회(지리 영역)","학":"중1~3","영":"남부 지역","p":"제주도의 지역 변화와 이를 둘러싼 다양한 가치를 살펴보고 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다.","h":["은 독특하고 아름다운 자연환경과 문화로 세계적인 관광지로 성장한 제주도의 최근 변화 모습을 탐색하도록 의도하였다. 관광 산업, 지구 온난화 등으로 인해 변화하고 있는 제주도 지역의 모습을 다양한 매체 및 자료를 활용하여 파악하고, 이를 둘러싼 다양한 가치를 살펴본 후 자신과 상대방의 의견을 비판적으로 검토할 수 있는 기회를 제공하는 데 중점을 두었다."]},{"교":"사회","c":"9사(지리)11-01","과":"사회(지리 영역)","학":"중1~3","영":"북부 지역","p":"다양한 지리 정보와 매체를 활용하여 북한의 자연환경과 인문환경의 특징을 탐색한다.","h":["은 국토의 한 부분을 이루는 북한 지역의 자연 및 인문 지리적 특성을 다양한 지리 정보와 매체를 활용하여 파악함으로써 북한 지역의 주민 생활 모습을 탐색할 수 있도록 의도하였다."]},{"교":"사회","c":"9사(지리)11-02","과":"사회(지리 영역)","학":"중1~3","영":"북부 지역","p":"분단이 우리의 일상생활에 미친 영향을 살펴보고, 분리와 연결의 공간으로서 접경지역의 다양한 모습을 세계 여러 지역의 사례를 통해 비교한다.","h":["는 분단이 우리의 일상생활에 미친 영향을 살펴보는 과정을 통해 자신의 삶과 연계하여 평화 감수성을 함양할 수 있도록 의도하였다. 또한 분리 또는 연결의 공간으로서 접경지역의 특성이 지역마다 다양하게 나타나며, 특히 국가 간의 지정학적, 지경학적 측면의 역동적 관계에 따라 접경지역이 단절의 공간에서 개방의 공간으로 또는 그 반대로 바뀔 수 있다는 것을 우리나라와 세계 여러 지역의 사례를 통해 비교해 봄으로써 한반도 접경지역에 대해 상상하고 의미를 재구성해 보도록 설정된 것이다."]},{"교":"사회","c":"9사(지리)11-03","과":"사회(지리 영역)","학":"중1~3","영":"북부 지역","p":"세계시민의 관점에서 한반도 평화의 중요성을 논의하고, 한반도 평화와 통일 환경 속에서 우리의 삶과 국토의 미래를 구상한다.","h":["은 한반도, 동아시아, 글로벌 스케일에서 한반도 평화의 중요성을 다각적으로 논의하고, 평화 감수성을 기반으로 남북 갈등을 평화적으로 해결하기 위한 태도를 기를 수 있도록 설정된 것이다. 나아가 지리적 상상력을 바탕으로 미래 통일 환경 속에서 펼쳐질 우리 삶의 변화와 국토의 모습을 구체적으로 그려볼 수 있도록 의도하였다."]},{"교":"사회","c":"9사(지리)12-01","과":"사회(지리 영역)","학":"중1~3","영":"지속가능한 세계와 글로컬 시민","p":"우리나라 주요 식량 자원 및 에너지 자원의 소비 현황과 수입국 현황을 분석하여 이와 관련된 문제를 파악하고, 자원의 지속가능한 확보 방안을 모색한다.","h":["은 지구적 차원에서 생산 및 소비되는 식량 자원, 에너지 자원의 소비 현황과 주요 수입국 현황을 다양한 매체 및 자료를 기반으로 분석하도록 설정된 것이다. 이를 통해 자원의 생산과 이동이 우리의 삶과 다른 지역 주민의 삶이 긴밀하게 연결되어 있음을 인식할 수 있도록 의도하였다. 국가적 관점에서뿐만 아니라 전 지구적 관점에서 경제와 환경이 균형 있게 성장하는 포괄적이고 총체적인 방향으로 지속가능한 자원 개발 및 확보가 이루어져야 한다는 것에 초점을 두고 지속가능한 자원 확보 방안을 모색하는 데 중점을 둔다."]},{"교":"사회","c":"9사(지리)12-02","과":"사회(지리 영역)","학":"중1~3","영":"지속가능한 세계와 글로컬 시민","p":"지역 개발과 환경 보존을 둘러싼 글로컬 환경 이슈에 관심을 가지고 자신의 웰빙 및 공동체의 지속가능한 발전을 위해 참여하고 실천한다.","h":["는 다양한 스케일에서 일어나는 글로컬 환경 이슈에 학생들이 관심을 가지도록 하고, 환경과 인간의 공존을 추구하며 자신과 타인 및 지구촌 구성원 전체의 웰빙을 기반으로 한 지속가능한 발전을 위해 참여하고 실천하는 기회를 제공하는 데 초점을 둔다."]},{"교":"사회","c":"9사(지리)12-03","과":"사회(지리 영역)","학":"중1~3","영":"지속가능한 세계와 글로컬 시민","p":"더 나은 지역을 만들어 가는 사람들의 노력을 국내외 사례를 통해 살펴보고, 자신이 사는 지역의 문제를 해결하기 위한 방안을 모색하고 이를 실천한다.","h":["은 더 나은 지역을 만드는 사람들의 노력을 알아보고, [9사(지리)07-03]에서 발견한 우리 지역의 문제를 해결하기 위한 방안을 모색하고 실천하도록 설정된 것이다."]},{"교":"사회","c":"9사(일사)01-01","과":"사회(일반사회 영역)","학":"중1~3","영":"인간과 사회생활","p":"사회화의 의미를 일상생활의 사례를 들어 설명하고, 사회화 과정에서 형성되는 자아 정체성에 대해 성찰한다.","h":["에서는 자신의 경험과 일상생활의 사례를 바탕으로 사회화의 의미에 대해 학습한다. 사회화 과정에서 자신의 정체성이 어떻게 형성되는지 살펴보고, 다른 사람들이나 미디어 속 콘텐츠 등이 자신의 정체성에 어떤 영향을 주었는지에 대해 반성적으로 인식한다."]},{"교":"사회","c":"9사(일사)01-02","과":"사회(일반사회 영역)","학":"중1~3","영":"인간과 사회생활","p":"사회적 지위와 역할의 의미를 설명하고, 일상생활에서 나타나는 역할 갈등 사례와 대응 방안을 탐색한다.","h":["에서는 사회적 지위와 역할에 대한 이해를 바탕으로 일상생활에서 나타나는 역할 갈등 사례를 살펴보고, 일상생활에서 직면하는 구체적인 역할 갈등에 대응하는 실천 능력을 기른다."]},{"교":"사회","c":"9사(일사)01-03","과":"사회(일반사회 영역)","학":"중1~3","영":"인간과 사회생활","p":"우리 사회에 나타나는 다양한 갈등과 차별의 사례를 조사하고, 이에 대처하는 시민의 자질에 대해 토의한다.","h":["에서는 성별, 지역, 계층 등의 다양한 기준에 따라 구분되는 집단들의 내⋅외부에서 발생하는 갈등과 편견 및 차별 사례들을 조사한다. 갈등은 이익과 가치의 차이에 따라 발생할 수 있는 자연스러운 현상이지만 편견 및 차별은 적극적으로 개선해야 할 문제임을 인식한다."]},{"교":"사회","c":"9사(일사)02-01","과":"사회(일반사회 영역)","학":"중1~3","영":"다양한 문화의 이해","p":"일상생활에서 접하는 문화의 사례를 탐색하고, 이를 바탕으로 문화의 의미와 특징을 도출한다.","h":["에서는 우리 주변에서 익숙하게 접할 수 있는 의식주 등의 문화 사례들을 찾아보고 문화의 의미와 특징을 귀납적으로 도출한다. 이를 통해 문화가 우리의 일상과 밀접하게 관련된다는 사실을 인식한다."]},{"교":"사회","c":"9사(일사)02-02","과":"사회(일반사회 영역)","학":"중1~3","영":"다양한 문화의 이해","p":"우리 주변에서 활용되는 미디어들을 탐색하고, 미디어를 통해 경험하는 다양한 문화와 정보들을 비판적으로 검토한다.","h":["에서는 자신이 활용하고 있는 다양한 미디어들을 찾아보고, 그러한 미디어를 통해 경험하는 다양한 문화 사례와 정보들을 비판적으로 살펴본다. 이를 통해 구체적인 맥락에서 미디어의 사례들을 확인하고, 미디어를 통해 접하는 정보를 분석⋅평가하는 미디어 리터러시를 기른다."]},{"교":"사회","c":"9사(일사)02-03","과":"사회(일반사회 영역)","학":"중1~3","영":"다양한 문화의 이해","p":"여러 집단에서 나타나는 다양한 문화 사례들을 조사하고, 문화를 이해하는 바람직한 태도에 대하여 토의한다.","h":["에서는 우리나라의 다문화적 상황, 여러 민족과 국가의 다양한 문화 사례들에 대한 경험을 토대로 구체적인 맥락에서 자문화 중심주의, 문화 사대주의, 문화 상대주의 등의 문화 이해 태도를 학습한다. 특히 다양한 문화 사례 중 자신에게 익숙하지 않은 문화 사례들을 조사하고, 실천적인 맥락에서 이를 어떻게 이해할 것인가에 대해 토의한다."]},{"교":"사회","c":"9사(일사)03-01","과":"사회(일반사회 영역)","학":"중1~3","영":"민주주의와 시민","p":"공동체 생활에 필요한 정치의 역할을 탐색하고, 다양한 정치 사례를 통해 민주주의의 의미와 필요성을 도출한다.","h":["에서는 학교, 지역사회, 국가 공동체 등 다양한 집단에서 이루어지는 정치의 사례들을 조사한다. 이를 통해 정치는 집단 의사 결정과 권력 행사를 통해 공동체 문제를 해결하는 것임을 인식하고 민주주의의 의미와 필요성에 대해 논의한다."]},{"교":"사회","c":"9사(일사)03-02","과":"사회(일반사회 영역)","학":"중1~3","영":"민주주의와 시민","p":"민주주의의 발전 과정을 검토하고, 이를 토대로 민주주의의 이념과 기본 원리를 도출한다.","h":["에서는 민주주의의 발전 과정을 국내외 사례를 통해 살펴보고, 민주주의의 이념과 기본 원리가 민주주의의 발전 과정에서 형성된 것임을 이해한다. 그리고 오늘날의 민주주의가 인간의 존엄성, 자유, 평등이라는 민주주의 이념을 실현하는 방향으로 전개되고 있음을 확인하고, 이러한 이념을 구현하기 위해 민주주의의 기본 원리가 필요하다는 것을 인식한다."]},{"교":"사회","c":"9사(일사)03-03","과":"사회(일반사회 영역)","학":"중1~3","영":"민주주의와 시민","p":"현대 민주주의의 특징과 과제를 검토하고, 우리나라 민주주의의 발전을 위한 제도적 방안과 시민의 역할에 대해 토의한다.","h":["에서는 현대 민주주의의 특징과 과제를 간접 민주주의(대의제)와 직접 민주주의 측면에서 찾아보면서, 대의제의 의의와 한계, 시민의 정치적 무관심 등에 대해 살펴본다. 이를 토대로 민주주의 발전을 위해 도입할 수 있는 제도와 강조되어야 할 시민의 역할에 대해 논의한다."]},{"교":"사회","c":"9사(일사)04-01","과":"사회(일반사회 영역)","학":"중1~3","영":"정치과정과 시민 참여","p":"선거의 기능과 기본 원칙을 검토하고, 선거 과정에서 유권자와 정당이 수행하는 활동을 조사한다.","h":["에서는 민주주의 제도 운영의 관점에서 선거의 기능과 기본 원칙을 살펴보고, 선거 과정에서 유권자와 정당이 어떤 활동을 수행하는지를 국내 사례를 중심으로 살펴본다."]},{"교":"사회","c":"9사(일사)04-02","과":"사회(일반사회 영역)","학":"중1~3","영":"정치과정과 시민 참여","p":"정치활동에 참여하는 다양한 정치 주체의 역할을 탐색하고, 정치과정의 의미를 설명한다.","h":["에서는 우리나라 정치 현실에서 나타나는 여러 정치 주체들의 실제 활동 사례들을 찾아보고, 이를 통해 정치 주체의 역할과 정치과정의 의미를 이해한다."]},{"교":"사회","c":"9사(일사)04-03","과":"사회(일반사회 영역)","학":"중1~3","영":"정치과정과 시민 참여","p":"민주주의의 발전을 위한 지방 자치의 중요성을 설명하고, 지역사회의 문제를 해결하기 위한 시민 참여 활동을 계획한다.","h":["에서는 민주주의 발전에서 지방 자치가 지닌 의의를 살펴보고, 자신이 거주하는 지역사회의 문제를 해결하기 위한 시민 참여 활동을 구체적으로 계획하여 실천한다. 이 과정에서 시민 참여의 다양한 방법과 사례를 찾아보고 시민 참여 활동의 의의를 깨닫는다."]},{"교":"사회","c":"9사(일사)05-01","과":"사회(일반사회 영역)","학":"중1~3","영":"일상생활과 법","p":"법의 의미와 특징을 설명하고, 일상생활에서 접하는 법의 사례를 통해 법의 목적을 도출한다.","h":["에서는 우리 주변에서 찾아볼 수 있는 법들을 살펴보면서 법의 의미와 특징에 대해 논의한다. 그리고 자신이 일상생활에서 경험한 법의 사례들을 살펴보면서 법의 목적이 정의 실현에 있음을 추론한다."]},{"교":"사회","c":"9사(일사)05-02","과":"사회(일반사회 영역)","학":"중1~3","영":"일상생활과 법","p":"우리의 일상을 규율하는 다양한 법을 탐색하고, 국내외 사례를 통해 사회법이 필요한 이유에 대해 토의한다.","h":["에서는 우리 생활과 관련된 다양한 법들(예: 헌법, 민법, 형법)을 찾아보고, 국내외 사례를 통해 사회법이 도입된 배경과 필요성에 대해 논의한다."]},{"교":"사회","c":"9사(일사)05-03","과":"사회(일반사회 영역)","학":"중1~3","영":"일상생활과 법","p":"재판의 의미와 종류를 설명하고, 공정한 재판의 중요성에 대해 토의한다.","h":["일상생활이나 미디어에서 접한 재판의 사례들을 통해 재판의 종류를 민사재판과 형사재판으로 구분하고, 재판 사례를 토대로 공정한 재판의 의미와 중요성에 대해 논의한다. 이 과정에서 공정한 재판이 이루어지기 위해 필요한 요건들에 대해 살펴본다."]},{"교":"사회","c":"9사(일사)06-01","과":"사회(일반사회 영역)","학":"중1~3","영":"인권과 기본권","p":"일상생활에서 인권이 침해되는 사례를 조사하고, 우리 헌법에 보장된 기본권의 종류를 탐색한다.","h":["에서는 인권 침해 사례들을 인권 감수성의 관점에서 살펴보고, 이러한 사례에서 침해된 기본권의 종류를 헌법에서 찾아본다. 이 과정에서 인권이 헌법을 통해서 기본권으로 보장된다는 사실을 인식하고 기본권의 종류를 학습하여 일상생활 속에서 자신이 보장받아야 할 기본권 관련 조항을 구체적으로 이해한다."]},{"교":"사회","c":"9사(일사)06-02","과":"사회(일반사회 영역)","학":"중1~3","영":"인권과 기본권","p":"기본권 제한의 요건과 한계가 헌법에 명시된 이유를 토의하고, 기본권 침해 시 구제 방법을 조사한다.","h":["에서는 기본권 제한의 요건과 한계, 기본권 침해 구제에 대해 살펴보면서, 우리 헌법과 국가기관 활동에 나타나는 인권 및 기본권 보장의 정신을 인식하고, 시민들이 기본권 침해를 구제받기 위해 요청할 수 있는 방법들을 살펴본다."]},{"교":"사회","c":"9사(일사)06-03","과":"사회(일반사회 영역)","학":"중1~3","영":"인권과 기본권","p":"근로자에게 보장되는 권리를 조사하고, 이러한 권리의 침해에 대처하는 국가와 시민의 노력에 대해 토의한다.","h":["에서는 근로자의 권리가 우리 헌법에 보장된 기본권임을 이해하고, 근로자의 권리(노동권) 침해에 대응하는 제도 개선 활동, 개인의 권리 구제 방법 모색 등 국가와 시민의 노력에 대해 논의한다."]},{"교":"사회","c":"9사(일사)07-01","과":"사회(일반사회 영역)","학":"중1~3","영":"헌법과 국가기관","p":"우리나라의 정부 형태를 설명하고, 대통령과 행정부의 역할을 탐색한다.","h":["에서는 우리나라의 정부 형태가 의원내각제를 가미한 대통령제라는 사실을 이해하고, 대통령과 행정부가 담당하는 역할에 대해 찾아본다."]},{"교":"사회","c":"9사(일사)07-02","과":"사회(일반사회 영역)","학":"중1~3","영":"헌법과 국가기관","p":"국회에서 법률이 만들어지는 사례를 탐색하고, 입법기관으로서 국회의 역할을 조사한다.","h":["에서는 법률이 만들어지는 과정을 구체적인 사례를 통해 살펴보고, 국회의 역할을 입법 기능을 중심으로 살펴보면서 재정, 일반 국정에 관한 기능에 대해서도 찾아본다."]},{"교":"사회","c":"9사(일사)07-03","과":"사회(일반사회 영역)","학":"중1~3","영":"헌법과 국가기관","p":"사법기관으로서 법원의 역할을 검토하고, 헌법재판소의 성격에 대해 토의한다.","h":["에서는 법원의 구체적인 활동을 통해 법원의 역할을 살펴보고, 헌법재판소의 실제 활동 사례를 통해 헌법재판소가 지닌 헌법 수호 기관이자 기본권 보장 기관으로서의 성격에 대해 논의한다."]},{"교":"사회","c":"9사(일사)08-01","과":"사회(일반사회 영역)","학":"중1~3","영":"경제생활과 선택","p":"경제생활에서 합리적 선택의 필요성에 대해 검토하고, 비용과 편익을 고려한 합리적 선택 방안을 탐색한다.","h":["에서는 자원의 희소성, 비용과 편익 개념에 대한 이해를 토대로 가계와 기업의 입장에서 합리적 선택이 필요한 이유를 살펴보고, 일상생활에서 경험할 수 있는 선택 상황에서 비용(기회비용)과 편익을 고려한 합리적 선택 방안을 모색한다."]},{"교":"사회","c":"9사(일사)08-02","과":"사회(일반사회 영역)","학":"중1~3","영":"경제생활과 선택","p":"일생 동안 이루어지는 경제생활을 분석하고, 안정적인 금융 생활을 위한 자산 및 신용 관리 방안을 계획한다."},{"교":"사회","c":"9사(일사)08-03","과":"사회(일반사회 영역)","학":"중1~3","영":"경제생활과 선택","p":"시장경제에서 기업의 역할과 사회적 책임을 설명하고, 우리 사회에 필요한 기업가 정신에 대해 토의한다."},{"교":"사회","c":"9사(일사)09-01","과":"사회(일반사회 영역)","학":"중1~3","영":"시장과 가격","p":"일상생활에서 접하는 다양한 시장의 사례를 조사하고, 이를 토대로 시장의 의미와 필요성을 설명한다.","h":["에서는 자신이 경험한 시장의 모습과 사례들을 열거하면서 다양한 사례들이 지닌 공통점을 추출하여 시장의 의미를 살펴본다. 이를 통해 시장의 의미와 역할을 재화와 서비스의 거래에 관한 행위가 이루어지는 측면에서 이해한다."]},{"교":"사회","c":"9사(일사)09-02","과":"사회(일반사회 영역)","학":"중1~3","영":"시장과 가격","p":"수요 법칙과 공급 법칙을 사례를 통해 도출하고, 이를 토대로 시장 가격이 결정되는 원리를 설명한다.","h":["에서는 구체적인 사례와 자료를 활용하여 가격과 수요량, 가격과 공급량의 관계를 파악하고 수요와 공급 법칙을 통해 시장 가격이 결정되는 원리를 이해한다."]},{"교":"사회","c":"9사(일사)09-03","과":"사회(일반사회 영역)","학":"중1~3","영":"시장과 가격","p":"시장경제에서 수요와 공급을 변화시키는 요인을 조사하고, 시장 가격의 변동에 대응하는 방안을 계획한다.","h":["에서는 시장경제에서 수요와 공급에 영향을 미치는 여러 요인들을 살펴보고 이러한 요인들이 시장 가격을 어떻게 변화시키는지를 이해한다. 이를 토대로 시장 가격의 변동에 대한 수요자와 공급자의 적절한 대응 방안을 구체적인 사례를 통해 고민한다."]},{"교":"사회","c":"9사(일사)10-01","과":"사회(일반사회 영역)","학":"중1~3","영":"우리나라 경제와 세계화","p":"우리나라의 경제 성장 전후 모습을 검토하고, 국내 총생산의 증가가 우리 생활에 미치는 영향에 대해 토의한다.","h":["에서는 우리나라 경제가 성장하기 이전과 이후의 모습을 비교하면서 국내 총생산 증가로 인해 달라진 생활 모습에 대해 논의한다. 이를 통해 국내 총생산이 한 국가의 경제활동 규모를 나타내는 대표적인 지표임을 확인하고, 그 의의와 한계에 대해 살펴본다."]},{"교":"사회","c":"9사(일사)10-02","과":"사회(일반사회 영역)","학":"중1~3","영":"우리나라 경제와 세계화","p":"물가 변동과 실업의 사례를 탐색하고 물가 변동과 실업이 우리 생활에 미치는 영향을 제시한다.","h":["에서는 물가 변동과 실업의 구체적인 사례를 찾아보고, 물가 변동과 실업이 우리 생활에 미치는 영향을 통계 자료 등을 통해 설명한다."]},{"교":"사회","c":"9사(일사)10-03","과":"사회(일반사회 영역)","학":"중1~3","영":"우리나라 경제와 세계화","p":"세계화 시대에 국제 거래가 이루어지는 사례를 탐색하고, 환율 변동이 우리 생활에 미치는 영향을 조사한다.","h":["에서는 최근 세계화 흐름 속에서 재화, 서비스, 자본, 노동 등 국제 거래가 이루어지는 사례를 찾아보고, 환율 변동이 우리 생활에 미치는 영향을 구체적인 사례를 통해 논의한다."]},{"교":"사회","c":"9사(일사)11-01","과":"사회(일반사회 영역)","학":"중1~3","영":"국제 사회와 한반도","p":"국제 사회를 구성하는 여러 행위 주체의 활동을 조사하고, 이를 토대로 국제 사회의 특징을 도출한다."},{"교":"사회","c":"9사(일사)11-02","과":"사회(일반사회 영역)","학":"중1~3","영":"국제 사회와 한반도","p":"국제 사회의 다양한 분쟁에 대해 조사하고, 지역, 국가, 세계의 시민으로서 우리의 역할에 대해 토의한다.","h":["에서는 최근에 발생한 국제 사회의 여러 분쟁을 미디어 등을 활용해서 찾아보고, 국제 사회의 평화와 공존을 위해서 다중적인 시민에게 요구되는 역할에 대해 논의한다."]},{"교":"사회","c":"9사(일사)11-03","과":"사회(일반사회 영역)","학":"중1~3","영":"국제 사회와 한반도","p":"우리나라가 직면하고 있는 국제 문제에 대해 조사하고, 이러한 문제에 대응하기 위한 방안에 대해 토론한다.","h":["에서는 우리나라가 직면한 국제 문제를 안보 문제, 경제 문제 등을 중심으로 살펴보고, 이를 해결하기 위한 정부, 기업, 시민사회의 대응 방안에 대해 토론한다. 특히 정부의 외교 정책에 대해 토론하는 과정에서 논쟁 문제 해결에 필요한 시민의 자질을 기른다."]},{"교":"사회","c":"9사(일사)12-01","과":"사회(일반사회 영역)","학":"중1~3","영":"사회 변동과 사회문제","p":"오늘날 우리 사회가 겪는 사회 변동에 대해 조사하고, 이러한 사회 변동이 우리 생활에 미치는 영향을 분석한다.","h":["에서는 최근 중요한 사회 변동 양상인 세계화, 다문화적 변화, 지식정보⋅서비스 사회로의 변화, 저출산⋅고령화, 과학기술 발전으로 인한 사회 변화 등을 사례를 통해 살펴보고, 이러한 변화가 우리 생활에 미치는 영향을 구체적인 사례를 수집하여 분석한다."]},{"교":"사회","c":"9사(일사)12-02","과":"사회(일반사회 영역)","학":"중1~3","영":"사회 변동과 사회문제","p":"오늘날의 주요한 사회문제를 조사하고, 이러한 사회문제가 우리 생활에 미치는 영향에 대해 토의한다.","h":["에서는 최근에 우리가 겪고 있는 사회 불평등 문제, 노동 문제, 인구 문제, 기후위기 문제, 팬데믹으로 인한 문제 등을 살펴보고, 이러한 사회문제가 우리 생활에 미치는 영향에 대해 논의한다."]},{"교":"사회","c":"9사(일사)12-03","과":"사회(일반사회 영역)","학":"중1~3","영":"사회 변동과 사회문제","p":"사회 변동과 사회문제에 대응하는 국내외의 사례들을 검토하고, 시민으로서 지녀야 할 태도와 실천 방안에 대해 토의한다.","h":["에서는 국내외에서 최근 사회 변동과 사회문제에 어떻게 대처하고 있는지를 찾아본다. 이를 토대로 사회 변동과 사회문제에 대응하는 데 필요한 시민의 자세에 대해 살펴보고 이를 일상생활에서 실천하는 방안에 대해 논의한다."]},{"교":"사회","c":"9역01-01","과":"역사","학":"중1~3","영":"역사 학습의 기초","p":"역사와 역사 탐구의 의미를 파악하고, 역사 학습의 목적을 다각도로 탐색한다.","h":["역사의 의미를 ‘과거의 사실’이나 ‘기록된 과거’에 한정하지 않고, 학습자가 일상에서 접하는 역사의 활용 사례를 포함하여 탐구하고, 학습자의 삶의 맥락에서 역사 학습을 의미화하는 데 초점을 둔다."]},{"교":"사회","c":"9역01-02","과":"역사","학":"중1~3","영":"역사 학습의 기초","p":"다양한 자료와 사례를 통해 역사 탐구 방법을 익힌다.","h":["역사를 탐구하는 과정과 방법을 기초적 수준에서 이해하기 위해 설정하였다. 문자, 비문자 자료 등 역사 자료의 종류와 특징을 이해하고, 자료에 대한 분석⋅해석을 토대로 논쟁을 경험하도록 한다."]},{"교":"사회","c":"9역02-01","과":"역사","학":"중1~3","영":"문명의 발생과 고대 세계의 형성","p":"선사 문화 및 문명의 형성을 이해하고, 각 문명의 특징을 비교한다."},{"교":"사회","c":"9역02-02","과":"역사","학":"중1~3","영":"문명의 발생과 고대 세계의 형성","p":"서아시아⋅지중해 세계에서 등장한 여러 정치체를 비교하고 종교 및 문화를 탐구한다.","h":["페르시아와 그리스, 로마 등 다양한 정치체(폴리스, 제국, 왕국 등)를 통치 체제(민주정, 공화정, 제정) 상의 다양성에 따라 비교하면서 각각의 특징을 파악한다."]},{"교":"사회","c":"9역02-03","과":"역사","학":"중1~3","영":"문명의 발생과 고대 세계의 형성","p":"중국과 인도의 정치적 변화와 종교⋅사상 성립의 관계를 이해하고, 유라시아의 상호 교류를 탐색한다."},{"교":"사회","c":"9역03-01","과":"역사","학":"중1~3","영":"세계 종교의 확산과 지역 문화의 발전","p":"수⋅당 시기 동아시아 국제 질서의 특징을 이해하고, 동아시아 문화를 탐구한다."},{"교":"사회","c":"9역03-02","과":"역사","학":"중1~3","영":"세계 종교의 확산과 지역 문화의 발전","p":"인도, 서아시아, 지중해에서 진행된 정치적 변동 과정과 각 종교의 특징 및 영향을 파악한다.","h":["유라시아 각지의 정치⋅종교적 변동을 사산 왕조 페르시아 및 굽타 왕조의 등장, 서로마 제국의 소멸과 비잔티움 제국의 발전, 이슬람 세계의 성장을 중심으로 파악한다."]},{"교":"사회","c":"9역03-03","과":"역사","학":"중1~3","영":"세계 종교의 확산과 지역 문화의 발전","p":"크리스트교 세계의 정치와 종교의 상관성을 이해하고, 이슬람 세계와 크리스트교 세계의 충돌 및 교류의 결과를 탐구한다.","h":["9세기 이후 서유럽 세계의 권력 세분화와 교황권의 성장을 연관 지어 이해하고 지중해 지역에서 이루어진 크리스트교 세계와 이슬람 세계 간의 충돌과 교류를 탐구한다."]},{"교":"사회","c":"9역04-01","과":"역사","학":"중1~3","영":"지역 세계의 교류와 변화","p":"송과 몽골 제국 시기 유라시아⋅인도양 교역권의 성장을 경제⋅문화 자료를 통해 탐구한다."},{"교":"사회","c":"9역04-02","과":"역사","학":"중1~3","영":"지역 세계의 교류와 변화","p":"명⋅청, 에도 막부, 무굴 제국의 정치⋅사회 변화를 비교한다.","h":["아시아 국가들이 고유한 방식으로 정치⋅사회적 발전을 이루었음을 파악하기 위해 설정하였다. 명⋅청, 에도 막부, 무굴 제국의 통치 체제 정비, 산업 및 문화의 발전에 초점을 맞춘다."]},{"교":"사회","c":"9역04-03","과":"역사","학":"중1~3","영":"지역 세계의 교류와 변화","p":"오스만 제국의 성장과 유럽 사회의 근대적 변화를 조사한다.","h":["서아시아에서 지중해에 걸친 오스만 제국의 성장과 통합 정책을 탐구하고, 신항로 개척 및 세계 교역망 확립이 초래한 결과를 유럽뿐 아니라 유럽 이외 지역의 관점에서 종합적으로 이해한다. 또한 종교개혁 이후 등장한 재정⋅군사 국가의 특징을 파악한다."]},{"교":"사회","c":"9역05-01","과":"역사","학":"중1~3","영":"제국주의와 국민 국가 건설 운동","p":"시민 혁명을 국민 국가 형성과 연결하여 파악하고, 역사적 의의와 한계를 탐구한다.","h":["미국 혁명과 프랑스 혁명 과정에서 인권과 민주주의에 입각한 새로운 정치 체제의 확립 시도가 이루어졌음을 이해하고, 혁명이 아이티 등 라틴 아메리카의 여러 나라에 끼친 영향을 파악한다. 이후 인권과 참정권의 실질적인 확대를 위해 서양 각국에서 전개된 여러 정치적 움직임을 파악하고, 이 과정에서 나타난 다양한 국민 국가 건설 노력을 비교한다."]},{"교":"사회","c":"9역05-02","과":"역사","학":"중1~3","영":"제국주의와 국민 국가 건설 운동","p":"서양의 산업화와 제국주의 정책을 이해하고, 사회와 생태환경에 미친 영향을 분석한다.","h":["산업화를 기술적⋅경제적 발전과 풍요의 관점뿐 아니라 자본주의의 등장, 국민 국가의 형성과 맞물려 제국주의적 팽창과 침략으로 연결되는 과정으로 이해하고, 그 영향을 국가적⋅세계적 차원 및 생태환경적 관점에서 파악한다."]},{"교":"사회","c":"9역05-03","과":"역사","학":"중1~3","영":"제국주의와 국민 국가 건설 운동","p":"제국주의 열강의 침략에 대한 아시아의 대응 및 국민 국가 건설 노력을 이해하고, 그 성과와 한계를 평가한다.","h":["청, 무굴 제국, 오스만 제국, 일본 등에서 전개된 반제국주의 운동, 국민 국가 건설 운동의 특징을 비교하는 데 주안점을 둔다."]},{"교":"사회","c":"9역06-01","과":"역사","학":"중1~3","영":"세계 대전과 사회 변동","p":"20세기 전반 세계 질서의 변화를 두 차례의 세계 대전을 중심으로 파악한다.","h":["두 차례의 세계 대전을 파악하는 데 있어 서양 열강 간 경쟁과 대립, 러시아 혁명과 서유럽 각국의 민주주의 확대, 세계 대공황의 충격과 전체주의(파시즘, 나치즘, 군국주의)의 등장을 중점적으로 이해하도록 한다."]},{"교":"사회","c":"9역06-02","과":"역사","학":"중1~3","영":"세계 대전과 사회 변동","p":"세계 대전 중의 전쟁 범죄를 탐구하고, 인권 회복과 평화 실현을 위한 노력을 조사한다."},{"교":"사회","c":"9역06-03","과":"역사","학":"중1~3","영":"세계 대전과 사회 변동","p":"아시아⋅아프리카 지역의 민족 운동을 이해하고, 그 특징을 비교한다.","h":["두 차례 세계 대전 전후의 민족 운동을 민족주의, 사회주의의 세계적 확산과 관련하여 파악하는 데에 중점을 둔다."]},{"교":"사회","c":"9역07-01","과":"역사","학":"중1~3","영":"현대 세계의 전개와 과제","p":"냉전의 전개와 제3 세계 등장의 상관관계를 이해하고, 냉전 이후 국제 질서의 변화를 분석한다."},{"교":"사회","c":"9역07-02","과":"역사","학":"중1~3","영":"현대 세계의 전개와 과제","p":"20세기 후반 민주주의와 인권의 신장을 위한 노력에 관심을 갖는다.","h":["20세기 후반에 전개된 반전 평화 운동, 민권 운동, 여성 운동, 환경 운동 등의 의미를 학습자 삶과의 연계성을 고려하여 파악하고, 제기되는 과제의 해결 방안을 모색한다."]},{"교":"사회","c":"9역07-03","과":"역사","학":"중1~3","영":"현대 세계의 전개와 과제","p":"오늘날 세계화의 양상을 조사하고, 성과와 과제를 탐구한다.","h":["20세기 후반 사회주의 진영이 붕괴된 이후, 세계화의 확산으로 인해 나타난 변화를 고찰하기 위해 설정하였다. 오늘날 세계화의 성과와 과제를 살피고, 문제 해결에 동참하는 자세를 갖는 데에 초점을 맞춘다."]},{"교":"사회","c":"9역08-01","과":"역사","학":"중1~3","영":"국가의 형성과 발전","p":"고조선과 여러 나라의 형성 과정 및 사회 모습을 탐구한다.","h":["고조선의 성장과 멸망을 동아시아의 국제 관계 속에서 이해한다. 당시 사람들의 생활 모습이 담긴 자료를 분석하면서 고조선 멸망 전후에 등장한 여러 나라의 특징을 파악하는 데 초점을 둔다."]},{"교":"사회","c":"9역08-02","과":"역사","학":"중1~3","영":"국가의 형성과 발전","p":"삼국과 가야의 성장 과정을 파악한다."},{"교":"사회","c":"9역08-03","과":"역사","학":"중1~3","영":"국가의 형성과 발전","p":"삼국과 가야가 남긴 문화의 특징을 분석한다."},{"교":"사회","c":"9역09-01","과":"역사","학":"중1~3","영":"통일신라와 발해","p":"삼국 통일의 과정을 동아시아 국제 정세의 맥락에서 이해하고, 통일신라와 발해 성립의 역사적 의의를 추론한다.","h":["삼국 통일의 과정을 동아시아의 국제 정세 속에서 파악하기 위해 설정하였다. 당시 국제 정세를 삼국 및 발해, 당과 일본뿐 아니라 거란, 말갈, 돌궐, 토번 등 다양한 세력과의 관계 속에서 이해하며, 통일신라와 발해 성립의 의미를 추론한다."]},{"교":"사회","c":"9역09-02","과":"역사","학":"중1~3","영":"통일신라와 발해","p":"통일신라와 발해의 국가 체제 정비와 변동을 분석한다."},{"교":"사회","c":"9역09-03","과":"역사","학":"중1~3","영":"통일신라와 발해","p":"통일신라와 발해 문화의 특징을 파악한다.","h":["통일신라와 발해의 문화가 동아시아의 다양한 문화와의 상호 작용을 통해 형성되었음을 파악한다. 삼국의 문화를 바탕으로 한 통일신라 문화의 특징을 동아시아 문화의 관점에서 파악하고, 발해의 문화는 고구려, 당, 말갈 등의 문화가 어우러져 형성되었음을 이해한다."]},{"교":"사회","c":"9역10-01","과":"역사","학":"중1~3","영":"고려의 성립과 변천","p":"후삼국 통일과 체제 정비 과정을 통해 고려 성립의 역사적 의미를 탐색한다."},{"교":"사회","c":"9역10-02","과":"역사","학":"중1~3","영":"고려의 성립과 변천","p":"고려의 정치적 변동을 파악하고 주변국과의 관계를 이해한다."},{"교":"사회","c":"9역10-03","과":"역사","학":"중1~3","영":"고려의 성립과 변천","p":"원 간섭기 고려 사회에 나타난 변화를 파악하고 개혁의 영향을 탐구한다."},{"교":"사회","c":"9역10-04","과":"역사","학":"중1~3","영":"고려의 성립과 변천","p":"고려의 문화유산과 대외 교류의 사례를 조사하여 그 특징을 파악한다.","h":["다양한 자료를 활용하여 고려의 문화가 가진 특징을 파악하고, 고려 시대 사람들의 삶을 종합적으로 이해한다. 송, 원을 비롯한 주변 세력과의 경제⋅문화적 대외 교류가 문화의 형성에 미친 영향을 파악한다."]},{"교":"사회","c":"9역11-01","과":"역사","학":"중1~3","영":"조선의 성립과 발전","p":"조선 성립의 의의를 통치 체제의 특징을 통해 파악한다."},{"교":"사회","c":"9역11-02","과":"역사","학":"중1~3","영":"조선의 성립과 발전","p":"사림 세력의 성장이 성리학적 질서 확산에 끼친 영향을 추론한다."},{"교":"사회","c":"9역11-03","과":"역사","학":"중1~3","영":"조선의 성립과 발전","p":"왜란과 호란의 성격을 동아시아 국제 정세 속에서 분석한다.","h":["왜란과 호란을 동아시아 역사의 맥락 속에서 파악하도록 설정하였다. 명⋅청 교체, 에도 막부의 성립 등과의 관련성에 초점을 맞춘다."]},{"교":"사회","c":"9역12-01","과":"역사","학":"중1~3","영":"조선 사회의 변동","p":"왜란과 호란 이후 체제 재정비의 노력과 정치 변동의 모습을 파악한다."},{"교":"사회","c":"9역12-02","과":"역사","학":"중1~3","영":"조선 사회의 변동","p":"조선 후기 문화에서 나타난 변화를 분석한다."},{"교":"사회","c":"9역12-03","과":"역사","학":"중1~3","영":"조선 사회의 변동","p":"조선 후기 사회적 모순에 대한 여러 세력의 대응을 탐구한다.","h":["조선 후기 변동에 따른 사회적 모순을 살펴보고 이에 대한 여러 세력의 대응을 파악하도록 설정하였다. 세도정치의 폐단, 삼정의 문란 등으로 인한 농민 봉기, 흥선 대원군의 정책 등을 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"9역13-01","과":"역사","학":"중1~3","영":"근⋅현대 사회로의 전환","p":"개항 이후 근대 국가를 건설하기 위한 노력을 파악한다."},{"교":"사회","c":"9역13-02","과":"역사","학":"중1~3","영":"근⋅현대 사회로의 전환","p":"국권 피탈 이후 전개된 민족 운동을 세계사적 관점에서 이해한다."},{"교":"사회","c":"9역13-03","과":"역사","학":"중1~3","영":"근⋅현대 사회로의 전환","p":"한국의 민주화 과정에서 나타난 성과와 과제를 탐구한다.","h":["정치적⋅경제적⋅사회적 민주화 양상을 포함하여 다양한 주체들의 노력으로 이루어진 사회 전반의 자유민주적 기본질서 정착과정과 과제를 탐구하는 데 초점을 둔다."]},{"교":"사회","c":"9역13-04","과":"역사","학":"중1~3","영":"근⋅현대 사회로의 전환","p":"지속가능한 사회를 위한 과제를 역사적 맥락에서 탐구하고, 과제 해결에 참여하는 자세를 갖는다.","h":["한국의 통일 문제를 비롯하여 현대 세계가 겪고 있는 평화와 민주주의의 위기, 생태환경 위기, 전염병의 확산 등을 자신의 문제로 인식하는 태도를 길러 주기 위해 설정하였다. 현대 사회 문제의 원인과 해결 방안을 역사적 맥락에서 탐색하여 지속가능한 사회의 실현에 참여하는 태도의 함양에 초점을 둔다."]},{"교":"사회","c":"10한사1-01-01","과":"한국사1","학":"고1","영":"근대 이전 한국사의 이해","p":"고대 국가의 형성과 성장 과정을 파악한다.","h":["고조선을 비롯한 여러 고대 국가의 성립과 발전을 파악하기 위해 설정하였다. 아울러 한반도와 그 주변 지역의 선사 문화를 유적·유물을 통해 이해하고, 고대 국가 형성과 성장의 의미 및 특성을 파악하는데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-01-02","과":"한국사1","학":"고1","영":"근대 이전 한국사의 이해","p":"고려의 통치 체제와 지배 세력의 변화를 이해한다.","h":["고려의 후삼국 통일과 통치 체제의 정비 과정에 대해 알고, 고려 성립의 역사적 의미를 파악하기 위해 설정하였다. 아울러 지배 세력의 변화를 시기별로 이해하여 고려 정치사의 흐름을 맥락적으로 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-01-03","과":"한국사1","학":"고1","영":"근대 이전 한국사의 이해","p":"조선의 성립과 정치 운영의 변화를 파악한다.","h":["조선의 성립과 유교적 통치 체제의 정비, 정치 운영의 변화를 이해하기 위해 설정하였다. 아울러 왜란과 호란의 전개 과정 및 역사적 의미를 파악한다."]},{"교":"사회","c":"10한사1-01-04","과":"한국사1","학":"고1","영":"근대 이전 한국사의 이해","p":"조선 후기에 등장한 새로운 변화 양상을 이해한다.","h":["조선 후기 여러 분야에서 나타난 변화를 파악하기 위해 설정하였다. 흥선 대원군 집권기까지 조선 후기에 나타난 새로운 변화의 양상에 초점을 맞춘다."]},{"교":"사회","c":"10한사1-02-01","과":"한국사1","학":"고1","영":"근대 이전 한국사의 탐구","p":"근대 이전 국제 관계와 대외 교류의 시대적 특징을 비교한다.","h":["근대 이전 국제 관계의 변화 양상과 대외 교류의 시대별 특징을 파악하기 위해 설정하였다. 근대 이전 시기 시대별로 다양한 형태의 외교적 갈등과 대립, 대외 교류 등이 이루어졌음을 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-02-02","과":"한국사1","학":"고1","영":"근대 이전 한국사의 탐구","p":"근대 이전의 수취 체제 변화를 농업 중심의 경제생활과 관련하여 탐구한다.","h":["근대 이전 수취 체제의 변화를 농업 중심의 경제생활과 연관하여 이해하기 위해 설정하였다. 각 국가의 수취 제도의 운영과 그것이 사람들의 삶에 미친 영향을 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-02-03","과":"한국사1","학":"고1","영":"근대 이전 한국사의 탐구","p":"근대 이전 사회 구조를 신분제를 중심으로 분석한다.","h":["근대 이전의 사회가 신분제에 기반하여 운영되었음을 파악하기 위해 설정하였다. 골품제, 양천제 등 신분제의 특징을 이해하고 신분제에 기반한 사회 구조를 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-02-04","과":"한국사1","학":"고1","영":"근대 이전 한국사의 탐구","p":"근대 이전의 사상과 문화를 국제 교류와 관련하여 탐구한다.","h":["근대 이전 시기의 사상과 문화가 지닌 특징을 탐구하기 위해 설정하였다. 불교와 유교를 중심으로 사상과 문화의 성격을 국제적인 문화 교류의 관점에서 탐구하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-02-05","과":"한국사1","학":"고1","영":"근대 이전 한국사의 탐구","p":"근대 이전 한국사 주제를 설정하여 탐구하고, 그 결과를 다양한 방법으로 표현한다.","h":["근대 이전 한국사에 대한 이해를 바탕으로 쟁점적 주제를 선정하여 탐구하기 위해 설정하였다. 근대 이전 한국사를 둘러싸고 제기되는 역사 문제 등에 대해 질문을 구성하고 탐구하여 이를 표현하는 데 초점을 둔다."]},{"교":"사회","c":"10한사1-03-01","과":"한국사1","학":"고1","영":"근대 국가 수립의 노력","p":"조선의 개항을 국제 질서의 변동과 연관하여 분석한다."},{"교":"사회","c":"10한사1-03-02","과":"한국사1","학":"고1","영":"근대 국가 수립의 노력","p":"여러 세력이 추진한 근대 국가 수립의 다양한 노력을 이해한다.","h":["근대 사회로의 전환을 둘러싼 여러 세력의 대응을 이해하기 위해 설정하였다. 근대 국가 수립 과정에서 일어난 정치 변동과 열강의 침략에 맞서 주권을 수호하고자 한 각계각층의 노력을 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-03-03","과":"한국사1","학":"고1","영":"근대 국가 수립의 노력","p":"개항 이후 사회⋅경제 변화를 파악하고, 서구 문물의 도입이 문화에 미친 영향을 탐구한다.","h":["개항 이후 나타난 사회⋅경제적 변동과 이에 대한 대응으로 일어난 사회⋅경제적 개혁 운동의 양상을 파악하고, 서구 문물의 도입으로 인한 문화 변동을 탐구하기 위해 설정하였다. 사회 개혁 운동 및 경제 주권 수호 운동의 특징과 흐름을 분석하고, 서구 문물의 수용 과정에서 나타난 문화 변동을 탐구하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사1-03-04","과":"한국사1","학":"고1","영":"근대 국가 수립의 노력","p":"일제의 국권 침탈 과정을 조사하고, 이에 맞선 국권 수호 운동의 흐름을 파악한다."},{"교":"사회","c":"10한사2-01-01","과":"한국사2","학":"고1","영":"일제 식민 통치와 민족운동","p":"일제의 식민 통치 정책을 제국주의 질서의 변동과 연관하여 이해한다."},{"교":"사회","c":"10한사2-01-02","과":"한국사2","학":"고1","영":"일제 식민 통치와 민족운동","p":"일제의 식민 통치가 초래한 경제 구조의 변화와 그것이 경제생활에 미친 영향을 분석한다.","h":["일제의 식민 통치로 인해 식민지 경제 구조가 형성되는 과정을 살펴보고 그 변화가 사람들의 생활에 미친 경제적 영향을 분석하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사2-01-03","과":"한국사2","학":"고1","영":"일제 식민 통치와 민족운동","p":"국내외에서 전개된 민족 운동의 흐름을 이해한다."},{"교":"사회","c":"10한사2-01-04","과":"한국사2","학":"고1","영":"일제 식민 통치와 민족운동","p":"일제의 식민 통치로 인한 사회 및 문화의 변화와 대중운동의 양상을 파악한다.","h":["일제의 식민 통치하에서 일어난 사회 및 문화 변동의 양상을 파악하고, 여러 분야에서 일어난 대중운동의 양상을 이해하기 위해 설정하였다. 일제강점기 사회 및 문화 변화를 일상생활의 변동과 연관 지어 파악하고 대중운동의 양상을 운동 주체별로 파악하는 데 초점을 둔다."]},{"교":"사회","c":"10한사2-01-05","과":"한국사2","학":"고1","영":"일제 식민 통치와 민족운동","p":"일제의 침략 전쟁에 맞서 전개된 독립 국가 건설 운동의 양상을 분석한다."},{"교":"사회","c":"10한사2-02-01","과":"한국사2","학":"고1","영":"대한민국의 발전","p":"냉전 체제가 한반도 정세에 미친 영향을 파악하고, 자유민주주의에 기초한 대한민국 정부 수립 과정을 탐색한다."},{"교":"사회","c":"10한사2-02-02","과":"한국사2","학":"고1","영":"대한민국의 발전","p":"6⋅25 전쟁과 분단의 고착화 과정을 국내외의 정세 변화와 연관하여 이해한다."},{"교":"사회","c":"10한사2-02-03","과":"한국사2","학":"고1","영":"대한민국의 발전","p":"4⋅19 혁명에서 6월 민주 항쟁에 이르는 민주화 과정을 탐구한다.","h":["4⋅19 혁명에서 6월 민주 항쟁에 이르는 과정을 독재 정치에 대응한 국민적 저항과 관련된 민주주의의 시련과 발전이라는 관점에서 분석하도록 설정하였다. 다양한 주체들이 전개한 민주화의 노력을 이해하고 그것의 성과와 과제를 분석하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사2-02-04","과":"한국사2","학":"고1","영":"대한민국의 발전","p":"산업화의 성과를 파악하고, 그것이 사회 및 환경에 미친 영향을 인식한다.","h":["산업화에 기반한 경제 성장과 그것이 사회 및 생태환경 등에 미친 영향을 파악하기 위해 설정하였다. 경제 성장을 위한 노력과 이에 따른 사회 문제와 환경 문제 등을 해결하기 위한 방안을 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"10한사2-02-05","과":"한국사2","학":"고1","영":"대한민국의 발전","p":"사회⋅경제의 변화에 따른 문화 변동과 일상생활의 변화 사례를 조사한다."},{"교":"사회","c":"10한사2-03-01","과":"한국사2","학":"고1","영":"오늘날의 대한민국","p":"6월 민주 항쟁 이후 각 분야에서 전개된 민주화의 과정을 탐구한다.","h":["6월 민주 항쟁 이후 각 분야에서 전개된 민주화에 기반해 자유민주적 기본질서에 입각한 평화적 정권 교체가 정착되고 시민운동이 성장하는 과정에 초점을 맞춘다."]},{"교":"사회","c":"10한사2-03-02","과":"한국사2","학":"고1","영":"오늘날의 대한민국","p":"외환 위기의 극복 과정을 이해하고, 사회와 문화의 변동을 파악한다."},{"교":"사회","c":"10한사2-03-03","과":"한국사2","학":"고1","영":"오늘날의 대한민국","p":"한반도 분단과 동아시아의 갈등을 극복하고 평화를 실현하기 위한 방안을 모색한다.","h":["한반도의 분단을 극복하고 동아시아 국가 간의 갈등을 해결하기 위한 노력을 파악하기 위해 설정하였다. 한반도 분단을 극복하기 위한 노력과 동아시아 영토 문제 및 역사 갈등 등을 파악하고 평화적인 해결 방안을 탐구하는 데 초점을 맞춘다."]},{"교":"사회","c":"10통사1-01-01","과":"통합사회1","학":"고1","영":"통합적 관점","p":"인간, 사회, 환경을 바라보는 시간적, 공간적, 사회적, 윤리적 관점의 의미와 특징을 사례를 통해 파악한다.","h":["에서는 인간과 세상을 이해하기 위해 역사적 배경과 시대적 맥락에 초점을 두는 시간적 관점, 장소와 지역 및 공간적 상호 작용에 중점을 두는 공간적 관점, 사회 구조 및 제도의 영향력에 초점을 두는 사회적 관점, 도덕적 가치와 규범을 고려하는 윤리적 관점 등을 다룬다."]},{"교":"사회","c":"10통사1-01-02","과":"통합사회1","학":"고1","영":"통합적 관점","p":"인간, 사회, 환경의 탐구에 통합적 관점이 요청되는 이유를 도출하고 이를 탐구에 적용한다.","h":["에서는 현대 사회의 불확실하고 복잡한 사회현상에 대처하기 위해 시간적, 공간적, 사회적, 윤리적 측면을 함께 고려하는 통합적 관점의 중요성을 이해하고, 구체적인 사례를 중심으로 이를 탐구하게 한다."]},{"교":"사회","c":"10통사1-02-01","과":"통합사회1","학":"고1","영":"인간, 사회, 환경과 행복","p":"시대와 지역에 따라 다르게 나타나는 행복의 기준을 사례를 통해 비교하여 평가하고, 삶의 목적으로서 행복의 의미를 성찰한다.","h":["에서는 시대적 상황과 지역적 여건 등에 따른 행복의 기준을 탐구하고, 이를 비교⋅평가함으로써 행복의 진정한 의미를 성찰할 수 있도록 한다."]},{"교":"사회","c":"10통사1-02-02","과":"통합사회1","학":"고1","영":"인간, 사회, 환경과 행복","p":"행복한 삶을 실현하기 위한 조건으로 질 높은 정주 환경의 조성, 경제적 안정, 민주주의 발전 및 도덕적 실천의 필요성에 관해 탐구한다.","h":["에서는 인간다운 삶을 누릴 수 있는 정주 환경의 조성과 삶의 질을 유지하기 위한 경제적 안정, 시민의 참여가 활성화되는 민주주의의 실현, 도덕적으로 행위하고 성찰하는 삶 등 행복한 삶을 실현하기 위한 조건들을 균형 있게 다루도록 한다."]},{"교":"사회","c":"10통사1-03-01","과":"통합사회1","학":"고1","영":"자연환경과 인간","p":"자연환경이 인간의 생활에 미치는 영향에 관한 과거와 현재의 사례를 조사하여 분석하고, 안전하고 쾌적한 환경에서 살아가는 것이 시민의 권리임을 주장한다.","h":["에서는 기후와 지형 등 자연환경에 따른 생활양식의 차이를 다루고, 자연환경의 변화로 인해 인간의 삶이 달라진 사례를 조사하여 원인 및 영향을 파악한다. 이를 토대로 안전하고 쾌적한 환경에서 살아가는 것이 시민에게 보장된 권리임을 인식하고, 실생활에서 실천할 수 있도록 한다."]},{"교":"사회","c":"10통사1-03-02","과":"통합사회1","학":"고1","영":"자연환경과 인간","p":"자연에 대한 인간의 다양한 관점을 사례를 통해 비교하고, 인간과 자연의 바람직한 관계를 제안한다.","h":["에서는 인간 중심주의와 생태 중심주의를 중심으로 자연에 대한 인간의 관점을 다루되, 구체적인 사례를 통해 두 관점을 비교하도록 한다. 이를 토대로 생태계 위기를 초래한 인간 사회의 모습을 성찰하고, 인간과 자연의 공존을 위한 노력에 대해 살펴보도록 한다."]},{"교":"사회","c":"10통사1-03-03","과":"통합사회1","학":"고1","영":"자연환경과 인간","p":"환경 문제 해결을 위한 정부, 시민사회, 기업 등의 다양한 노력을 조사하고, 생태시민으로서 실천 방안을 모색한다.","h":["에서는 국내외적으로 발생하는 환경 문제 해결을 위한 정부의 제도적 노력이나 시민단체들의 활동, 기업의 환경친화적 활동 등 다양한 실제 사례들을 조사하고, 생태전환적 사고를 바탕으로 다양한 환경 문제 해결에 연대하고 실천할 수 있는 생태시민의 자질을 함양하도록 한다."]},{"교":"사회","c":"10통사1-04-01","과":"통합사회1","학":"고1","영":"문화와 다양성","p":"자연환경과 인문환경의 영향을 받아 형성된 다양한 문화권의 특징과 삶의 방식을 탐구한다.","h":["에서 문화권의 형성에 영향을 주는 요인으로 자연환경은 기후와 지형을, 인문환경은 종교와 산업에 초점을 두어 다룬다. 그리고 자연환경과 인문환경의 영향을 받아 형성된 다양한 문화권의 특징과 삶의 방식은 비교 문화의 관점에서 고찰하도록 한다."]},{"교":"사회","c":"10통사1-04-02","과":"통합사회1","학":"고1","영":"문화와 다양성","p":"문화 변동의 다양한 양상을 이해하고, 현대 사회에서 전통문화가 지니는 의의를 탐색한다.","h":["에서는 문화 병존, 문화 융합, 문화 동화 등 문화 변동의 다양한 양상을 구체적인 사례를 통해 다루도록 하며, 현대 사회에서 전통문화에 대한 성찰을 토대로, 전통문화를 창조적으로 계승⋅발전시키기 위한 방안에 대해서도 언급한다."]},{"교":"사회","c":"10통사1-04-03","과":"통합사회1","학":"고1","영":"문화와 다양성","p":"문화적 차이에 대한 상대주의적 태도의 필요성을 이해하고, 보편 윤리의 차원에서 자문화와 타문화를 평가한다.","h":["에서는 지역에 따라 문화적 차이가 나타나는 맥락을 파악하게 함으로써 문화 상대주의의 필요성을 인식할 수 있도록 한다. 또한 문화 상대주의가 극단적으로 흐르지 않도록 보편 윤리 차원에서 자문화와 타문화를 평가하도록 한다."]},{"교":"사회","c":"10통사1-04-04","과":"통합사회1","학":"고1","영":"문화와 다양성","p":"다문화 사회의 현황을 조사하고, 문화적 다양성을 존중하는 태도를 바탕으로 갈등 해결 방안을 모색한다.","h":["에서는 현재 우리 사회에서 전개되고 있는 다문화 사회의 현황을 토대로 다문화 사회가 지니는 다양한 양상을 조명하도록 하며, 문화적 다양성 존중과 관련지어 갈등 해결 방안을 모색하도록 한다."]},{"교":"사회","c":"10통사1-05-01","과":"통합사회1","학":"고1","영":"생활공간과 사회","p":"산업화, 도시화로 인해 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다.","h":["에서는 산업화와 도시화로 인해 나타난 생활공간의 변화 양상으로는 거주 공간, 생태환경 등의 변화를 다루며, 생활양식의 변화 양상은 도시성의 확산, 직업의 분화, 개인주의 가치관의 확산 등에 초점을 둔다. 그리고 산업화와 도시화로 인한 문제 해결 방안은 지역적 및 국가적 차원에서 모색하도록 한다."]},{"교":"사회","c":"10통사1-05-02","과":"통합사회1","학":"고1","영":"생활공간과 사회","p":"교통⋅통신 및 과학기술의 발달과 함께 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다.","h":["에서는 교통 통신의 발달과 정보화 및 제4차 산업 혁명을 통해 나타나는 생활 공간의 확대, 생태환경의 변화, 생활양식의 변화를 중심으로 다룬다. 그리고 이러한 변화가 초래할 수 있는 지역 격차 및 정보 격차, 생태환경의 교란, 전염병의 확산, 노동시장의 양극화 등 새로운 사회문제들을 파악하고 이에 대한 해결 방안을 모색하도록 한다."]},{"교":"사회","c":"10통사1-05-03","과":"통합사회1","학":"고1","영":"생활공간과 사회","p":"자신이 거주하는 지역을 사례로 공간 변화가 초래한 양상 및 문제점을 탐구하고, 공동체의 구성원으로서 지역사회의 변화를 위한 방안을 모색하고 이를 실천한다.","h":["에서는 자신이 거주하는 지역의 토지 이용, 산업 구조, 직업, 인구, 인간관계, 생태환경, 주민의 가치관 변화 등을 중심으로 공간 변화가 초래한 양상을 탐구하도록 한다. 이 과정에서 공동체의 구성원으로서 지역이 당면한 문제를 인식하고 지역의 지속가능성을 고려하여 해결 방안을 모색하고 이를 실천하도록 한다."]},{"교":"사회","c":"10통사2-01-01","과":"통합사회2","학":"고1","영":"인권보장과 헌법","p":"근대 시민 혁명 등을 통해 확립되어 온 인권의 의미와 변화 양상을 이해하고, 현대 사회에서 주거, 안전, 환경, 문화 등 다양한 영역으로 인권이 확장되고 있는 사례를 조사한다.","h":["에서는 인권의 의미가 역사 속에서 확장되어 온 과정과 그 결과로 변화된 것이 무엇인지 탐색하도록 한다. 그리고 현대 사회에서 주거, 안전, 환경, 문화 등의 영역에서 나타난 인권 확장의 대표적 사례들을 다루도록 한다."]},{"교":"사회","c":"10통사2-01-02","과":"통합사회2","학":"고1","영":"인권보장과 헌법","p":"인간 존엄성 실현과 인권 보장을 위한 헌법의 역할을 파악하고, 시민의 권익을 보호하기 위한 다양한 시민 참여의 방안을 탐구하고 이를 실천한다.","h":["에서는 인권과 헌법의 관계, 인권 보장을 위해 헌법에 규정된 제도적 장치 등을 다루도록 한다. 시민의 권익 보호를 위해 시민불복종을 비롯한 시민 참여의 다양한 방안을 찾아보고, 일상생활 속에서 이를 실천할 수 있도록 한다."]},{"교":"사회","c":"10통사2-01-03","과":"통합사회2","학":"고1","영":"인권보장과 헌법","p":"사회적 소수자 차별, 청소년의 노동권 등 국내 인권 문제와 인권지수를 통해 확인할 수 있는 세계 인권 문제의 양상을 조사하고, 이에 대한 해결 방안을 모색한다.","h":["에서는 성별, 연령, 인종, 국적, 장애 등을 이유로 차별 받는 사회 구성원 등을 사회적 소수자로 다룰 수 있으며, 청소년 노동권의 경우 청소년들이 노동을 하면서 작성하는 근로계약서 내용 등을 중심으로 관련 법규 및 침해 사례 등을 다룰 수 있다. 세계 인권 문제는 국제기구나 비정부 기구 등에서 발표하는 인권지수를 활용하여 세계 각 지역에서 나타나는 인권 문제의 양상과 해결 방안을 다루도록 한다."]},{"교":"사회","c":"10통사2-02-01","과":"통합사회2","학":"고1","영":"사회정의와 불평등","p":"정의의 의미와 정의가 요구되는 이유를 파악하고, 다양한 사례를 통해 정의의 실질적 기준을 탐구한다.","h":["에서는 분배적 정의와 교정적 정의 등 정의의 다양한 의미를 분석하여, 우리 사회에 정의가 요청되는 이유를 파악한다. 특히 분배적 정의의 실질적 기준으로서 업적, 능력, 필요 등을 사회의 다양한 영역이나 분야의 사례에 적용함으로써 그 장단점을 다루도록 한다."]},{"교":"사회","c":"10통사2-02-02","과":"통합사회2","학":"고1","영":"사회정의와 불평등","p":"개인과 공동체의 관계를 기준으로 다양한 정의관을 비교하고, 이를 구체적인 사례에 적용하여 설명한다.","h":["에서는 자유주의적 정의관과 공동체주의적 정의관을 바탕으로 개인의 권리와 공동체에 대한 의무, 사익과 공익(공동선) 등의 문제를 다루되, 두 정의관에 기초하여 다양한 지역별 현안, 제도나 정책 등을 평가하도록 한다."]},{"교":"사회","c":"10통사2-02-03","과":"통합사회2","학":"고1","영":"사회정의와 불평등","p":"사회 및 공간 불평등 현상의 사례를 조사하고, 정의로운 사회를 만들기 위한 다양한 제도와 시민으로서의 실천 방안을 제안한다.","h":["에서는 사회 계층의 양극화, 공간 불평등, 사회적 약자에 대한 차별 등의 사례를 조사하여 원인을 분석하고, 이를 해결하기 위한 사회 복지 제도, 지역 격차 완화 정책, 적극적 평등 실현 조치 등과 같은 제도적 방안과 함께 개인이 시민으로서 실천할 수 있는 구체적인 방안을 다루도록 한다."]},{"교":"사회","c":"10통사2-03-01","과":"통합사회2","학":"고1","영":"시장경제와 지속가능발전","p":"자본주의의 역사적 전개 과정과 그 특징을 조사하고, 시장과 정부의 관계를 중심으로 다양한 삶의 방식을 비교 평가한다.","h":["에서는 자본주의의 역사적 전개 과정과 그 특징을 역사적 사건이나 사상가들의 주장을 통해 다루도록 하되, 그 과정에서 나타난 시장과 정부의 관계를 중심으로 한 다양한 삶의 방식, 특히 시장경제 체제와 계획경제 체제가 인간의 삶에 어떠한 영향을 미쳤는지를 학생들이 비교 평가하도록 한다."]},{"교":"사회","c":"10통사2-03-02","과":"통합사회2","학":"고1","영":"시장경제와 지속가능발전","p":"합리적 선택의 의미와 그 한계를 파악하고, 지속가능발전을 위해 요청되는 정부, 기업가, 노동자, 소비자의 바람직한 역할과 책임에 관해 탐구한다.","h":["에서는 합리적 선택의 의미와 합리적 선택의 한계로 인해 나타나는 시장 실패를 다루도록 하며, 지속가능발전을 위해 요청되는 경제 주체들의 역할과 책임과 관련해서는 정부의 역할, 기업가 정신, 기업의 사회적 책임, 노동자의 권익, 윤리적 소비 등에 대해서도 언급한다."]},{"교":"사회","c":"10통사2-03-03","과":"통합사회2","학":"고1","영":"시장경제와 지속가능발전","p":"금융 자산의 특징과 자산 관리의 원칙을 토대로 금융 생활을 설계하고, 경제적, 사회적 환경의 변화가 금융과 관련한 의사 결정에 미치는 영향을 탐구한다.","h":["에서는 금융 자산으로 예금, 채권, 주식 등을, 자산 관리의 원칙으로 수익성, 유동성, 안전성 등을 다루며, 이를 토대로 자신의 미래와 연관지어 금융 생활을 설계하도록 한다. 그리고 개인의 금융 의사 결정 과정에서 국내외 정치, 경제 상황 등과 관련 있는 거시적 변화 요인들이 영향을 미친다는 점을 이해하도록 한다."]},{"교":"사회","c":"10통사2-03-04","과":"통합사회2","학":"고1","영":"시장경제와 지속가능발전","p":"자원, 노동, 자본의 지역 분포에 따른 국제 분업과 무역의 필요성을 이해하고, 지속가능발전에 기여하는 국제무역의 방안을 탐색한다.","h":["에서는 자원, 노동, 자본 등의 지역적 분포의 차이 및 이에 따른 생산비의 차이로 국제 분업 및 무역이 발생하고 있음을 언급하도록 한다. 그리고 지속가능발전과 관련지어 오늘날 국제무역의 흐름을 평가하고, 이를 토대로 국제무역이 나아갈 방향을 다루도록 한다."]},{"교":"사회","c":"10통사2-04-01","과":"통합사회2","학":"고1","영":"세계화와 평화","p":"세계화의 다양한 양상을 살펴보고, 세계화 시대의 문제점과 그에 대한 해결 방안을 제안한다.","h":["에서는 세계화와 지역화의 관계 파악, 세계도시의 형성과 다국적 기업의 등장에 따른 공간적⋅경제적 변화 등을 통해 세계화의 양상을 알아본다. 문화의 획일화와 소멸, 빈부 격차의 심화, 보편 윤리와 특수 윤리 간 갈등 등 세계화가 초래할 수 있는 문제점에 대한 해결 방안을 제안하도록 한다."]},{"교":"사회","c":"10통사2-04-02","과":"통합사회2","학":"고1","영":"세계화와 평화","p":"평화의 관점에서 국제 사회의 갈등과 협력의 사례를 조사하고, 세계 평화를 위한 행위 주체의 바람직한 역할을 탐색한다.","h":["에서는 소극적 평화와 적극적 평화의 개념을 통해 평화의 소중함을 다루고, 평화의 관점에서 지구촌 곳곳의 갈등과 협력 사례를 조사하여 국가, 국제기구, 비정부 기구 등 행위 주체의 역할을 파악하도록 한다. 그리고 평화를 지속하기 위해 지구 공동체 일원으로서 갖추어야 할 세계시민의 역할을 탐색하도록 한다."]},{"교":"사회","c":"10통사2-04-03","과":"통합사회2","학":"고1","영":"세계화와 평화","p":"남북 분단과 동아시아의 역사 갈등 상황을 분석하고, 이를 토대로 우리나라가 세계 평화에 기여할 수 있는 방안을 제안한다.","h":["에서는 남북 분단의 배경과 평화통일을 향한 노력, 동아시아의 역사 갈등 상황에 대한 분석과 그 해결 방안을 다룬다. 아울러 우리나라의 국제적 위상, 역사적 상황, 지정학적 위치 등을 고려하여 세계의 평화에 기여할 수 있는 방안을 제안하도록 한다."]},{"교":"사회","c":"10통사2-05-01","과":"통합사회2","학":"고1","영":"미래와 지속가능한 삶","p":"세계의 인구 분포와 구조 등에 대한 이해를 토대로 현재와 미래의 인구 문제 양상을 파악하고, 그 해결 방안을 제안한다.","h":["에서는 세계의 인구 분포와 구조, 인구 이동에 대한 자료를 분석하고, 저출생⋅고령화, 인구 과잉 등 지역별로 다양한 인구 문제가 나타나게 된 배경과 문제점을 파악하도록 한다. 그리고 우리 사회 또는 지역이 당면한 인구 문제를 고려하여 미래 세대의 지속가능한 삶을 위한 다양한 해결 방안을 살펴보도록 한다."]},{"교":"사회","c":"10통사2-05-02","과":"통합사회2","학":"고1","영":"미래와 지속가능한 삶","p":"지구적 차원에서 에너지 자원의 분포와 소비 실태를 파악하고, 기후변화에 대한 대응과 지속가능한 발전을 위한 제도적 방안과 개인적 노력을 탐구한다.","h":["에서는 화석에너지 자원 중심의 지구적 소비 실태를 비판적으로 이해하고 이에 대한 문제점 개선 방안을 탐색하도록 한다. 석유, 석탄, 천연가스 등의 자원 분포 및 소비 현황을 파악하고, 이로 인한 기후변화에 적극적인 대응이 필요함을 인식하도록 한다. 특히 경제, 환경, 사회적 측면을 고려하여 지속가능한 발전을 위한 제도적 방안과 개인적 노력을 다루도록 한다."]},{"교":"사회","c":"10통사2-05-03","과":"통합사회2","학":"고1","영":"미래와 지속가능한 삶","p":"미래 사회의 모습을 다양한 측면에서 예측하고, 이를 바탕으로 세계시민으로서 자신의 미래 삶의 방향을 설정한다.","h":["에서는 정치적, 경제적 문제에 따른 국가 간 협력과 갈등, 과학기술의 발전에 따른 공간과 삶의 변화, 생태환경의 변화 등 다양한 측면에서 미래 사회의 변화 양상을 예측하도록 한다. 이를 바탕으로 자신이 지역, 국가, 지구촌과 상호 연결된 세계시민이라는 점과 관련지어 자신의 미래 삶의 방향을 설정할 수 있도록 한다."]},{"교":"사회","c":"12세지01-01","과":"세계시민과 지리","학":"고2~3","영":"세계시민, 세계화와 지역 이해","p":"세계화의 의미를 지리적 스케일에 따라 이해하고, 세계화와 지역화의 관계 속에서 세계시민의 역할을 탐색한다.","h":["은 세계화가 세계적, 국가적, 지역적 규모에서 다양한 주체의 역동적 상호 작용으로 나타나는 현상이라는 점을 이해할 수 있도록 설정된 것이다. 학습자들은 세계화에 대한 다중 스케일적 이해를 바탕으로 긴밀하게 연계된 현대 사회에서 세계시민의 역할을 탐색한다."]},{"교":"사회","c":"12세지01-02","과":"세계시민과 지리","학":"고2~3","영":"세계시민, 세계화와 지역 이해","p":"지역 통합과 분리 현상의 사례와 주요 원인을 탐구하고, 이를 바탕으로 지역 변화의 역동성을 파악한다.","h":["는 세계화의 물결 속에서 언어, 종교, 민족 등에 따라 국가가 분리되거나 경제적 이익에 따라 경제 블록이 생겨나는 것처럼 지역이 사회적으로 구성되는 역동적 실체로 작동한다는 점을 파악하도록 설정된 것이다. 지역의 역동성에 대한 이해가 세계를 통찰력 있게 탐구하는 관점과 도구가 될 수 있다는 점을 인식할 수 있도록 한다."]},{"교":"사회","c":"12세지01-03","과":"세계시민과 지리","학":"고2~3","영":"세계시민, 세계화와 지역 이해","p":"지리정보기술이 세계시민의 삶과 연계되는 다양한 모습을 이해하고, 지리적 문제 해결 및 의사 결정에 활용되는 사례를 조사한다.","h":["에서는 디지털 전환 시대에 지리정보기술이 세계시민의 일상생활 속 여러 분야에서 활용되는 모습을 알아보고, 인류 공동의 문제 해결이나 공간적 의사 결정 과정에 지리정보기술이 어떻게 기능할 수 있는지를 다양한 사례를 통해 탐구한다."]},{"교":"사회","c":"12세지02-01","과":"세계시민과 지리","학":"고2~3","영":"모자이크 세계, 세계의 다양한 자연환경과 문화","p":"세계의 다양한 기후에 대한 이해를 바탕으로 기후를 활용하거나 극복한 사례를 찾아 인간 생활과의 관계를 탐색한다.","h":["은 기후에 따라 특징적으로 나타나는 인간 생활의 모습을 살펴보고, 인간이 상호 작용하면서 적응하거나 극복해야 하는 기후 환경의 의미를 이해할 수 있도록 설정된 것이다. 기후와 인간 생활의 관계를 살펴볼 수 있는 다양한 사례를 조사하고 탐색한다."]},{"교":"사회","c":"12세지02-02","과":"세계시민과 지리","학":"고2~3","영":"모자이크 세계, 세계의 다양한 자연환경과 문화","p":"세계 주요 지형과 인간 생활의 상관성을 파악하고, 지형의 개발과 보존을 둘러싼 갈등 사례를 통해 지속가능한 이용 방안을 토론한다.","h":["는 지형과 인간 생활이 밀접하게 연계된다는 점을 이해하고, 지형 활용을 둘러싼 입장의 차이를 파악할 수 있도록 설정된 것이다. 주요 대지형이 인간의 삶에 영향을 미치는 양상에 주목하고, 세계적인 관광자원으로서 지형을 활용하는 방식을 두고 발생하는 갈등 사례를 탐구한다."]},{"교":"사회","c":"12세지02-03","과":"세계시민과 지리","학":"고2~3","영":"모자이크 세계, 세계의 다양한 자연환경과 문화","p":"세계 주요 종교의 특징 및 종교 경관의 의미를 이해하고, 각 종교가 인간 생활에 미치는 영향을 탐구한다.","h":["은 세계 각 지역의 문화와 경관에 많은 영향을 미치는 주요 종교의 특징과 종교 경관에 담긴 의미를 이해하기 위해 설정된 것이다. 특히, 각 종교가 인간 생활과 연계되는 방식에 주목하는 학습이 이루어질 수 있도록 한다."]},{"교":"사회","c":"12세지02-04","과":"세계시민과 지리","학":"고2~3","영":"모자이크 세계, 세계의 다양한 자연환경과 문화","p":"세계의 다양한 음식과 축제를 지리적으로 설명하고, 문화 다양성을 보존하기 위한 방법을 모색한다.","h":["에서는 세계의 음식과 축제를 자연 및 인문환경과 연계하여 설명하고, 세계화의 영향 속에서 각 지역이 고유한 문화와 세계화의 요소를 융합하여 음식과 축제 문화의 다양성을 보존하는 모습을 살펴본다."]},{"교":"사회","c":"12세지03-01","과":"세계시민과 지리","학":"고2~3","영":"네트워크 세계, 세계의 인구와 경제 공간","p":"세계 인구 분포 및 구조를 통해 세계 인구 문제를 이해하고, 국제적 이주가 인구 유출 지역과 유입 지역에 미치는 영향을 탐구한다.","h":["은 세계 인구의 지역적 분포를 탐색하고 지역별 인구 구조의 차이를 파악하여, 이로 인해 발생하는 인구 문제를 이해할 수 있도록 설정되었다. 나아가 국제 이주의 유형을 살펴보고, 국제 이주가 유출 지역 및 유입 지역에 미치는 사회⋅경제적 영향을 탐구한다."]},{"교":"사회","c":"12세지03-02","과":"세계시민과 지리","학":"고2~3","영":"네트워크 세계, 세계의 인구와 경제 공간","p":"주요 식량 자원의 생산과 소비 양상을 통해 세계 식량 문제가 발생하는 구조적 원인을 파악하고, 식량의 안정적인 생산과 공급을 위한 각국의 대응 전략을 비교⋅분석한다.","h":["는 식량 자원의 주요 생산지와 소비지가 다르다는 사실을 파악하고, 주요 곡물 기업의 생산 및 유통 시장 독점 현상을 통해 식량 문제의 구조적 원인을 설명할 수 있도록 설정된 것이다. 학습자들은 세계 식량 문제에 대한 인식을 바탕으로 안정적인 식량의 생산과 공급을 위한 각국의 다양한 정책을 비교⋅분석한다."]},{"교":"사회","c":"12세지03-03","과":"세계시민과 지리","학":"고2~3","영":"네트워크 세계, 세계의 인구와 경제 공간","p":"초국적 기업을 중심으로 한 글로벌 경제 체제의 형성 과정을 탐색하고, 글로벌 경제에서의 공간적 불균등을 해소하기 위한 국제적 협력과 개인적 실천 방안에 대해 조사한다.","h":["에서는 초국적 기업의 분포, 글로컬 가치 사슬 개념을 통해 네트워크화된 현대 사회에서 초국적 기업이 글로벌 경제 체제 형성에 미치는 영향을 탐색하고, 세계화에 따른 경제 공간의 불균등 현상을 이해한다. 이를 바탕으로 글로벌 경제 체제의 구조적 불균등을 해소하기 위한 국제적 협력과 윤리적 소비와 같은 개인적 실천 방안에 대해 조사한다."]},{"교":"사회","c":"12세지04-01","과":"세계시민과 지리","학":"고2~3","영":"지속가능한 세계, 세계의 환경 문제와 평화","p":"세계 주요 에너지 자원의 생산과 소비 현황을 조사하고, 다양한 친환경 에너지원의 특징에 대한 이해를 바탕으로 지속가능한 에너지 생산 방안을 제시한다.","h":["에서는 주요 에너지원의 생산과 소비 현황을 조사하여 세계의 에너지 공급 및 소비 체계를 이해한다. 또한 지속가능한 에너지 생산을 위해 친환경 에너지원의 특성을 파악하고 지속가능한 에너지 생산 전략을 도출한다."]},{"교":"사회","c":"12세지04-02","과":"세계시민과 지리","학":"고2~3","영":"지속가능한 세계, 세계의 환경 문제와 평화","p":"세계 주요 환경 문제의 유형과 실태를 설명하고, 생태전환적 삶에 비추어 현재의 생활방식을 비판적으로 점검한다.","h":["는 지역별, 지구적 환경 문제를 살펴보고, 환경 보호에 따른 개별 국가의 상이한 손익으로 인한 환경 문제 대응의 복잡성을 이해할 수 있도록 설정된 것이다. 학습자들은 생태전환적 삶을 위해 자신의 생활방식을 비판적으로 점검하는 기회를 가진다."]},{"교":"사회","c":"12세지04-03","과":"세계시민과 지리","학":"고2~3","영":"지속가능한 세계, 세계의 환경 문제와 평화","p":"다양한 지정학적 분쟁을 국제 정세의 변화와 관련지어 조사하고, 세계 평화와 정의에 기여할 수 있는 방안을 찾아 실천한다.","h":["에서는 상호 긴장이나 갈등으로 인해 발생하는 지정학적 분쟁 상황을 조사한다. 나아가 지구촌의 평화와 공존을 위한 국제 사회의 노력을 파악하고, 개인적 차원에서 기여할 수 있는 방안을 찾아 실천해 보도록 한다."]},{"교":"사회","c":"12세사01-01","과":"세계사","학":"고2~3","영":"지역 세계의 형성","p":"현생 인류의 삶과 문명의 형성을 생태환경과의 관계 속에서 파악한다.","h":["현생 인류가 생태환경과의 관계 속에서 수렵⋅채집, 농경, 목축 등 다양한 방식으로 생존을 도모하였음을 살피면서, 각각의 생활이 생태환경과 어떤 관계를 맺으며 이루어졌는지를 파악하는 데 중점을 둔다. 또한 이러한 토대 위에서 형성된 아프로유라시아⋅아메리카 지역의 고대 문명을 고고학적 자료를 중심으로 탐구하는 데 초점을 맞춘다."]},{"교":"사회","c":"12세사01-02","과":"세계사","학":"고2~3","영":"지역 세계의 형성","p":"동아시아, 인도 세계의 형성을 문화의 상호 작용과 관련지어 이해한다.","h":["동아시아 세계가 유교, 불교, 한자, 율령을 공유하고, 인도에 불교와 힌두교를 기반으로 하는 세계가 형성되며, 동아시아 세계와 인도 세계가 상호 작용하는 양상에 주목한다."]},{"교":"사회","c":"12세사01-03","과":"세계사","학":"고2~3","영":"지역 세계의 형성","p":"서아시아, 지중해, 유럽 세계의 형성과 문화적 특징을 종교의 확산과 관련지어 분석한다.","h":["서아시아, 지중해, 유럽 세계에서 발생한 다양한 고대 정치 체제의 발전과 이에 따른 인간관⋅세계관과 종교의 변화를 파악하고, 크리스트교 세계와 이슬람교 세계의 형성 및 교류⋅충돌을 통한 경제 교류와 문화적 변동을 이해하는 데 중점을 둔다."]},{"교":"사회","c":"12세사02-01","과":"세계사","학":"고2~3","영":"교역망의 확대","p":"이슬람 세계와 몽
