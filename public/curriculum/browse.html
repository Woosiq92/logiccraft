체험하며, 이를 통해 로봇 제작에 대한 흥미와 협력적 태도를 갖는다."},{"교":"실과(기술⋅가정)","c":"12로봇03-05","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"로봇공학 프로젝트 수행 과정과 결과에 대한 평가 및 개선을 통해 창의적 자신감 및 의사소통 능력을 기른다.","h":["이 성취기준은 모둠별로 제작된 로봇의 문제해결 과정을 동료들과 공유하고 제작과정과 결과를 근거로 성장 중심 평가를 실시하여 로봇공학 문제에 대한 도전 의식을 갖도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12로봇03-06","과":"로봇과 공학세계","학":"고2~3","영":"로봇공학 프로젝트","p":"제작한 로봇을 시연 및 공유하며 로봇의 활용 분야를 제안하여 로봇에 대한 긍정적 사고와 문제해결에 대한 자신감을 갖는다."},{"교":"실과(기술⋅가정)","c":"12생활01-01","과":"생활과학 탐구","학":"고2~3","영":"인간행동과 생활과학","p":"인간의 특성에 대한 긍정적 태도를 바탕으로 인간 발달에 대한 이론과 발달의 특성을 탐구한다.","h":["이 성취기준은 인간 발달 이론을 통해 인간의 전 생애에 걸친 생활주기에서 나타나는 신체적, 정신적, 사회적, 경험적 변화를 이해하며, 발달의 원리를 알고 인간 발달의 특성을 탐구하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12생활01-02","과":"생활과학 탐구","학":"고2~3","영":"인간행동과 생활과학","p":"아동기까지의 삶의 질이 전 생애에 끼치는 장기적이며 결정적인 영향을 이해하여 아동상담의 필요성과 사례를 탐구하여, 관련 분야로의 진로를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12생활01-03","과":"생활과학 탐구","학":"고2~3","영":"인간행동과 생활과학","p":"사회변화에 따라 파생된 가족생활교육 및 가족생활 복지서비스의 필요성을 이해하고, 새로운 정책을 탐구하며, 관련된 분야로의 진로를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12생활01-04","과":"생활과학 탐구","학":"고2~3","영":"인간행동과 생활과학","p":"소비문화를 선도하는 소비자가 되기 위해 현대 소비문화의 이해를 바탕으로 미래 소비 동향을 예측하여 소비 트렌드를 분석하고 제안한다.","h":["이 성취기준은 현대 소비문화의 변화를 이해하고 주체적인 소비자가 되어 소비문화를 이끌어 갈 수 있도록 빅데이터를 활용하여 소비트렌드를 분석하고 소비 동향을 예측하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12생활01-05","과":"생활과학 탐구","학":"고2~3","영":"인간행동과 생활과학","p":"소비자 심리를 이해하여 소비 행동을 예측해보며, 소비와 관련한 직업의 세계를 탐색하고 진로를 설계한다.","h":["이 성취기준은 소비와 관련된 인간의 사고 과정과 행동을 이해하고 소비활동이 어떻게 인간에게 영향을 주는지 파악하도록 한다. 이러한 과정에서 소비와 관련한 다양한 직업을 탐색해 보도록 한다."]},{"교":"실과(기술⋅가정)","c":"12생활02-01","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"생활습관병의 원인을 분석하고, 올바른 관리법을 익혀 건강한 삶을 위한 실천 방안을 탐색하고 관련 분야로의 진로를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12생활02-02","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"식품 가공의 원리를 이해하고 올바른 정보 분별 능력을 길러 가공식품을 건강하고 안전하게 이용하는 방안을 탐색하며, 관련된 분야의 진로를 탐색한다.","h":["이 성취기준은 산업의 발전에 따라 가공식품이 발달하면서 식품 가공에 사용하는 식품 원료의 특성과 식품의 가공⋅조리⋅저장⋅부패 등 식품 이용 과정의 과학적 원리를 이해하고 식생활에 적용할 수 있는 능력을 기를 수 있도록 하며, 식생활과 관련된 다양한 산업에서 진로를 탐색할 수 있다."]},{"교":"실과(기술⋅가정)","c":"12생활02-03","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"올바른 식재료를 선택하고 조리 과정 중에 일어나는 성분 등의 변화를 이해하여 과학적 원리를 적용한 음식을 만든다."},{"교":"실과(기술⋅가정)","c":"12생활02-04","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"패션디자인의 기본 개념과 유행하는 스타일을 파악하여 패션 산업의 동향을 탐색하며, 관련된 분야의 진로를 탐색한다.","h":["이 성취기준은 뉴미디어, 인공지능 등을 포함한 디지털 기술의 발달로 인한 패션산업의 변화를 이해하고, 패션 상품의 기획, 생산, 구매, 관리, 사용, 폐기와 관련된 다양한 직업을 탐색하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12생활02-05","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"패션디자인과 머천다이징에 대한 이해를 바탕으로 패션상품을 기획하고 디자인을 하며 하나의 브랜드를 기획한다."},{"교":"실과(기술⋅가정)","c":"12생활02-06","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"정치⋅경제, 사회⋅문화의 변화에 따른 주거 트렌드를 탐구하고 인간다운 주거환경을 실현할 수 있는 주거복지 정책을 제안한다.","h":["이 성취기준은 집은 팔기(buying)위한 것이 아니라 살기(living)위한 공간임을 이해하고, 재산 가치로서의 환금성으로만이 아니라 주거의 본질적인 의미에 대한 고민을 하도록 한다. 특히, 주거 취약 계층에 대한 주거 문제를 인식하고 이를 해결하기 위한 주거복지정책을 제안한다."]},{"교":"실과(기술⋅가정)","c":"12생활02-07","과":"생활과학 탐구","학":"고2~3","영":"생활환경과 생활과학","p":"주거공간을 구성하고 있는 요소와 원리를 이해하여 라이프 스타일에 적합한 생활 공간을 기획하며, 관련된 분야의 진로를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12생활03-01","과":"생활과학 탐구","학":"고2~3","영":"생활과학과 진로","p":"생활과학 분야와 관련된 사회적 변화와 산업 추세를 분석하여 생할과학 분야의 다양한 진로를 탐색하고 요구하는 능력을 길러 체계적으로 진로를 설계한다.","h":["이 성취기준은 디지털 및 AI 중심의 사회적 변화에 따라 나타나는 인간의 삶과 의식주 생활 및 소비생활의 변화를 인식하여 변화된 요구를 분석하며, 관련된 생활과학 분야(의, 식, 주, 아동, 가족, 소비계열 등)의 접근을 사고하도록 하여 흥미를 가지고 생활과학 및 생활과학 관련의 여러 분야(심리상담 및 복지 분야, 보건 및 간호⋅의료계열 분야 등)의 진로를 탐색할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12생활03-02","과":"생활과학 탐구","학":"고2~3","영":"생활과학과 진로","p":"현재와 미래의 인간 삶의 기본이 되는 의식주 및 소비생활에 관련된 요구를 분석하여 체인지 메이커의 역할을 수행하며 창업의 아이디어를 제안한다.","h":["이 성취기준은 변화를 이끄는 사람으로서 역할을 수행하기 위해 주체적인 태도로 현재와 미래의 인간 삶의 기본이 되는 의식주 생활 및 소비생활과 관련된 요구를 분석하여 이를 반영한 생활과학 관련의 창업 아이디어를 제안하도록 한다. 취미나 관심 분야와 창의적인 아이디어를 결합하여 새로운 아이디어 제품을 제안할 수도 있고, 일상생활의 문제점을 해결하는 아이디어를 제안할 수도 있다. 이러한 활동으로 도전정신과 주체적인 삶의 태도를 기를 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12창공01-01","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"공학의 의미와 특성을 이해하고, 공학적 산출물에 대한 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12창공01-02","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"공학의 발달이 인류 문명에 미친 영향을 파악하고, 인류가 공존할 수 있는 지속가능한 미래공학을 전망한다."},{"교":"실과(기술⋅가정)","c":"12창공01-03","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"창의 공학 설계를 통한 문제해결 과정을 이해하고, 창의적인 해결방안에 대한 가치를 인식한다."},{"교":"실과(기술⋅가정)","c":"12창공01-04","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"공학에서의 창의성 개념을 이해하고, 창의적 사고 기법과 창의 공학 설계 사례를 탐구하여 창의 공학 설계에 대한 흥미와 관심을 가진다.","h":["이 성취기준은 다양한 분야에서 창의 공학 설계를 통하여 문제를 해결한 사례를 찾아 탐구하여 창의 공학 설계의 중요성을 인식하기 위해 설정하였다. 아울러 창의적 사고 기법을 적용하는 과정에서 기능적인 학습이 아닌 창의성의 증진에 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12창공01-05","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"창의 공학 설계 과정에서의 팀워크와 의사소통의 중요성을 인식하고, 팀워크와 의사소통의 기본 역량을 탐구하고 팀 구성원으로서의 협력적 태도를 가진다."},{"교":"실과(기술⋅가정)","c":"12창공01-06","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계의 이해","p":"창의 공학 설계를 통한 다양한 산출물을 비교, 분석하여 올바른 제품의 개발 방법에 대해 탐구한다.","h":["이 성취기준은 창의 공학 설계 과정이 적용된 기존의 산출물을 비교 분석하여 특징 및 장단점을 분석하여 창의 공학 설계의 필요성을 인식하기 위하여 설정한 것이다. 또한 제품을 개발하는 과정에서 중요하게 고려해야 할 요소를 비교⋅분석하기 위한 일정한 기준을 개발하여 적용할 수 있도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12창공02-01","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"공학적 문제해결에 필요한 팀 구성 방법과 구성원 간의 바람직한 협업 및 역할을 이해하고 공학적 문제해결 상황에 적합한 팀을 구성한다."},{"교":"실과(기술⋅가정)","c":"12창공02-02","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"창의 공학 설계 프로젝트를 통해 융합적인 성격의 공학 문제 상황을 탐구하고 해결하는 과정에서 창의 공학 설계의 융합적 특성을 이해하며, 창의성과 자신감, 공학에 대한 긍정적인 태도와 가치를 가진다.","h":["이 성취기준은 생활 속의 공학적 문제를 해결하기 위하여 적용된 창의 공학 설계의 사례와 그 결과에 대해 탐구하고 평가하여 과정의 중요성을 인식하며, 융합적 문제 또는 지속가능한 발전의 문제를 다루어 창의적이고 융합적 사고를 활용한 공학적 활동이 다방면에서 흥미롭게 활용될 수 있도록 유도한다."]},{"교":"실과(기술⋅가정)","c":"12창공02-03","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"공학적 문제의 정의를 위해 사용자의 조사, 관찰, 체험 등의 사용자 공감 방법을 적용하여 사용자 요구 분석을 통해 문제를 정의한다.","h":["이 성취기준은 공학적 문제 정의 과정에서는 사용자와의 면담, 관찰, 문제 상황 체험 등으로 사용자가 요구하는 것에 대한 정확한 분석 과정을 거쳐 문제를 정확하게 정의할 수 있도록 유도한다."]},{"교":"실과(기술⋅가정)","c":"12창공02-04","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"공학적 문제 해결 방안 탐색을 위해 확산적 사고 기법을 활용하여 다양한 해결책을 창출하고 범주화한다."},{"교":"실과(기술⋅가정)","c":"12창공02-05","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"수렴적 사고 기법을 적용하며 탐색 된 해결책들을 평가하여 최적의 대안을 선정하여 합리적인 해결책을 선정한다."},{"교":"실과(기술⋅가정)","c":"12창공02-06","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"공학적 문제 해결 방안을 탐색하거나 선정 시 아이디어를 시각화하여 의사소통 한다."},{"교":"실과(기술⋅가정)","c":"12창공02-07","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"선정된 아이디어를 디지털 기반의 설계 도구를 이용하여 설계도를 그린다.","h":["이 성취기준은 디지털 기반의 설계 도구를 활용하여 선정된 아이디어를 시각화하는 과정에서 정보 전달 측면을 중심으로 도면의 중요성을 인식하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12창공02-08","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"시제품 제작에 적합한 재료를 이해하고, 시제품 제작을 위해 재료의 특성을 비교 분석한다.","h":["이 성취기준은 재료의 특성을 이해하고 창의 공학 설계의 과정에서 문제를 해결하기 위한 산출물에 적합한 재료를 선택할 수 있는 소양의 기르기 위하여 설정하였으며 학습자가 중심이 되어 문제 상황을 이해하고, 다양한 재료 중 문제를 해결하기 위해 가장 적합한 재료를 선택하는 경험을 제공하는데 주안점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12창공02-09","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"시제품 제작을 위한 다양한 도구의 종류와 특성을 이해하고 재료에 따른 올바른 도구를 선택 및 사용한다."},{"교":"실과(기술⋅가정)","c":"12창공02-10","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"준비된 재료와 도구를 활용하여 안전하게 시제품을 제작하고, 제작 과정을 기록하고 공유한다.","h":["이 성취기준은 창의 공학 설계 과정에서 학습자의 성찰과 산출물(모형)의 제작 과정을 기록하고 공유하는 활동에 대한 가치와 중요성을 인식할 수 있도록 설정한 것으로 포트폴리오 제작을 디지털 기반으로 제작 및 활용하여 공유와 확산의 기회를 제공하여 아이디어의 발전을 유도하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12창공02-11","과":"창의 공학 설계","학":"고2~3","영":"창의 공학 설계 프로젝트","p":"창의 공학 설계의 과정과 산출물을 평가하고, 평가 결과를 바탕으로 시제품을 수정, 보완한다."},{"교":"실과(기술⋅가정)","c":"12지재01-01","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"역사적 발명 사례를 통하여 발명의 역사를 탐구하고, 지식재산의 가치와 중요성을 인식한다."},{"교":"실과(기술⋅가정)","c":"12지재01-02","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"지식재산권의 개념을 이해하고 지식재산의 종류와 특성을 비교 분석한다.","h":["이 성취기준은 지식재산권의 종류인 산업재산권(특허권, 상표권, 디자인권), 신지식재산권, 저작권에 따라 그 개념을 이해하고 각각이 갖는 특성을 사례를 통해 이해할 수 있도록 하는 데 초점을 둔다. 특히 산업재산권은 하위 권리인 특허권, 상표권, 디자인권 별로 각각이 가지는 특성과 내용을 비교하여 이해하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12지재01-03","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"신지식재산권의 종류와 특징을 이해하고, 사례를 분석한다."},{"교":"실과(기술⋅가정)","c":"12지재01-04","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"상표권, 디자인권의 등록요건을 분석하며, 저작물을 분류해보고 저작물의 성립조건을 분석한다."},{"교":"실과(기술⋅가정)","c":"12지재01-05","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"발명과 지식재산권의 관계를 파악하고, 지식재산권의 사회⋅경제⋅문화적 영향을 평가하여 지식재산권에 대한 관심과 흥미를 키운다."},{"교":"실과(기술⋅가정)","c":"12지재01-06","과":"지식 재산 일반","학":"고2~3","영":"지식재산의 이해","p":"지식재산권의 권리화 과정과 심사 제도를 분석하고, 지식재산권 분야에 대한 진로를 탐색한다.","h":["이 성취기준은 지식재산권의 권리화를 위한 법적 및 제도적 절차를 이해하여 지식재산권 확보의 전반적인 과정을 이해하고 각 과정별로 다양한 전문가의 역할을 살펴보면서 지식재산 분야의 관심과 진로를 탐색하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12지재02-01","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"지식재산권의 종류에 따른 침해와 분쟁 사례 분석을 통하여 지식재산권 보호 개념과 중요성을 이해한다."},{"교":"실과(기술⋅가정)","c":"12지재02-02","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"지식재산권 침해에 따른 적절한 대응과 예방을 위한 방안을 제시한다."},{"교":"실과(기술⋅가정)","c":"12지재02-03","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"지식재산권 보호 제도를 탐구하고 지식재산권 보호와 활용의 윤리적 실천 방안을 탐색한다.","h":["이 성취기준은 지식재산의 보호를 위한 제도적 장치를 법률적 측면에서 경영적 측면으로 확대한 것으로 영업비밀 유출 및 부정 경쟁 행위 등으로 인한 문제를 제도적 및 윤리적 측면에서 논의하고 실천 방안을 다루도록 한다."]},{"교":"실과(기술⋅가정)","c":"12지재02-04","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"지식재산권의 가치를 활용한 기술 사업화 사례 탐구를 통해 지식재산 활용 방안을 제시한다.","h":["이 성취기준은 기술 평가, 기술 거래 및 이전에 대한 내용을 통하여 지식재산권을 활용하는 사례를 탐구하는 것으로 구체적인 기술 평가 및 거래, 기술 이전 등에 대한 방법을 다루는 것이 아니라 지식재산권이 가진 가치를 평가하여 사업화에 활용한 사례를 중심으로 접근하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12지재02-05","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"기술 창업을 위해 기업가에게 필요한 역량을 탐색하고 지식재산 활용을 위한 윤리적 실천 능력을 기른다.","h":["이 성취기준은 기업가정신을 다루되 지식재산권을 활용한 창업이 이루어지기 위하여 성공적 사례와 실패 사례를 비교하여 혁신과 도전의 필요성을 인식하도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12지재02-06","과":"지식 재산 일반","학":"고2~3","영":"지식재산권의 보호와 활용","p":"직무 발명 제도의 사례를 통하여 지속가능한 발명 분위기 조성을 위한 직무 발명 보상 제도의 필요성을 이해한다.","h":["이 성취기준은 개인, 기업, 사회, 국가의 다양한 측면에서 긍정적인 영향을 중심으로 직무 발명 제도가 갖는 의미를 이해하도록 하는 데 초점을 둔다."]},{"교":"실과(기술⋅가정)","c":"12지재03-01","과":"지식 재산 일반","학":"고2~3","영":"지식재산권 창출 프로젝트","p":"사용자의 요구를 경청 및 공감을 통하여 발명 문제를 발견하고 정의하며, 해결방안 탐색 및 범주화 과정을 통하여 창의성과 도전 정신을 기른다.","h":["이 성취기준은 학습자가 주도하여 발명 문제를 찾아 정의하는 과정에 초점을 둔 것으로 발명가 중심의 사고에서 벗어나 사용자의 관점으로 확대하여 문제점과 요구를 분석하는 체험을 통하여 인간을 존중하고 창의적인 해결방안을 탐색하는 능력을 기르도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12지재03-02","과":"지식 재산 일반","학":"고2~3","영":"지식재산권 창출 프로젝트","p":"지식재산권 정보를 수집하고 관련 선행 기술을 조사하여 비판적 사고와 융합적 관점에서 특허, 디자인, 상표의 권리화 가능성을 높일 수 있는 최적의 해결 방안을 선정한다."},{"교":"실과(기술⋅가정)","c":"12지재03-03","과":"지식 재산 일반","학":"고2~3","영":"지식재산권 창출 프로젝트","p":"발명 아이디어를 스케치, 모델링, 도면 작성 등을 통하여 발명 문제 해결 방안을 시각적으로 구체화한다.","h":["이 성취기준은 발명 아이디어 스케치, 모델링, 도면 작성 등의 과정에서 디지털 도구(소프트웨어)를 적극 활용하여 디지털 역량을 기르고, 발명 아이디어를 시각화한 자료를 공유하고 토의하여 협력적 의사소통이 이루어질 수 있도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12지재03-04","과":"지식 재산 일반","학":"고2~3","영":"지식재산권 창출 프로젝트","p":"특허 명세서의 구성과 작성 방법을 이해하고, 발명을 보호할 수 있도록 청구항의 범위를 설정하여 명세서를 작성한다."},{"교":"실과(기술⋅가정)","c":"12지재03-05","과":"지식 재산 일반","학":"고2~3","영":"지식재산권 창출 프로젝트","p":"특허 출원의 과정을 이해하고, 작성한 명세서를 출원 및 권리화하는 과정을 체험하며, 프로젝트를 평가하는 과정을 통해 지식재산 창업 정신을 기른다.","h":["이 성취기준은 특허 출원의 프로젝트 전 과정을 학습자가 주도하고 해결하도록 문제해결 활동과 체험이 이루어지도록 하며, 이를 통하여 지식재산 창출 능력이 요구되는 공학 및 지식재산 분야의 진로 탐색 능력을 기르도록 설정하였다."]},{"교":"실과(기술⋅가정)","c":"12아동01-01","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"자신의 현재에 이르는 성장 과정을 되돌아보며 자신과 부모와의 상호 작용을 성찰한다.","h":["이 성취기준은 자신의 현재까지의 성장 과정을 탐색하여 자신이 어떤 사람인지 살피고, 부모의 신념이나 가치관이 자신의 성장에 어떠한 영향을 미치는가를 인식하여 현재 자신에 이르기까지의 성장 과정을 객관적으로 수용하고 부모와의 상호 작용이 미치는 영향, 부모 역할에 대한 긍정적 인식, 자신이 어떤 유형의 부모가 될 것인지를 예측하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동01-02","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"성숙한 사랑의 의미와 친밀한 관계 형성이 가지는 심리적 의의를 추론하여, 상호 존중의 태도를 바탕으로 한 이성 관계를 형성하는 방안을 제안한다.","h":["이 성취기준은 사랑의 이론을 적용한 다양한 사례 분석을 통해 성숙한 사랑의 의미를 추론하고, 이를 바탕으로 성인기의 발달과업인 친밀한 관계 형성이 가지는 심리적 행복의 다양한 측면을 탐색하도록 하며 자신과 상대방의 차이와 다양성을 인정하고 상호 존중하는 성숙한 관계형성의 방안을 탐구하여 제안하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동01-03","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"배우자 선택과 관련한 나와 사회의 고정 관념을 비판적으로 성찰하여 배우자 선택 기준을 제안하고 가족 형성의 개인적⋅사회적 의의를 탐색한다.","h":["이 성취기준은 이상적인 배우자상에 대한 개인적, 사회적 고정 관념을 성찰하고 행복한 가정생활(가사, 돌봄, 양육, 경제 활동 등)을 위해 고려해야 할 양성 평등한 배우자 선택 기준을 모색하여 제안하도록 한다. 이를 바탕으로 나와 상대방 모두를 존중하는 배우자를 선택하고 가정을 형성하는 것이 가정 안에 속한 개인적 삶의 만족으로 이어지고 안정적인 사회 유지의 기반이 되는 것과 같이 큰 의미가 있는 일임을 이해하도록 하여, 가족이 가진 개인적 의의를 넘어선 사회적 의의를 탐색하도록 한다. 이와 더불어 특정한 가족의 모습으로 한정하지 않고 다양한 가족의 모습을 탐색하여 타인의 선택을 존중하는 태도를 함양한다."]},{"교":"실과(기술⋅가정)","c":"12아동01-04","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"현대 사회의 결혼과 가족에 대한 변화된 인식을 반영하여 부모됨의 의미를 추론하고 건강한 부모됨의 중요성을 인식한다.","h":["이 성취기준은 현대 사회는 결혼과 가족 형성에서 선택이 강조되고 개인적 삶의 성취와 가족 구성원으로서 삶에서 추구하는 바가 상충한다는 인식이 확산되고 있어 이과 관련하여 부모됨의 의미를 비판적으로 추론하고 건강한 부모됨이 가지는 고유한 의미의 중요성을 인식하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동01-05","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"임신과 출산의 과정이 부모 공동의 책임임을 인식하여 부부가 함께 준비하고 맞이하는 건강한 임신과 출산의 과정을 설계한다.","h":["이 성취기준은 저출생⋅고령사회에서 임신과 출산에 대한 가치관의 변화와 결혼과 출산에 대한 청소년의 생각을 반영한 개인적⋅사회적 의미를 이해하고, 임신과 출산의 과정이 부모 중 어느 한 명의 일이 아님을 전제로 계획에서부터 실천의 과정 모두 부모가 함께 참여하는 공동의 책임임을 인식하여 함께 준비하고 양성평등을 실천하는 건강한 임신과 출산의 과정을 설계한다."]},{"교":"실과(기술⋅가정)","c":"12아동01-06","과":"아동발달과 부모","학":"고2~3","영":"부모됨의 준비","p":"부부간의 성숙한 관계 지속을 방해하는 요인을 탐색해 보고 개인적 요구 및 부모로서의 삶의 균형의 맥락을 파악하고 실현을 위한 조건 및 방안 탐색하여 제안한다.","h":["이 성취기준은 가정생활을 유지하는 과정에서 개인의 역할로서 개인적 욕구 및 사회적 요구를 추구하는 것과 부모의 역할로서 자녀 및 배우자의 요구를 수용하는 것이 상충되면서 발생하는 부부 간의 성숙한 관계 지속을 방해하는 요인을 사례 등을 통해 구체적으로 탐색해 보도록 한다. 실제 또는 가상의 사례 분석 등을 통해 삶의 균형에 있어서 갈등이 나타나는 맥락을 파악한 후, 갈등을 해소하고 균형을 실현하기 위한 조건과 방안을 다양하게 탐색하고 그중에서 최선의 대안을 선정하여 제안한다."]},{"교":"실과(기술⋅가정)","c":"12아동02-01","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"부모상에 대한 사회의 고정 관념을 성찰하고 책임 있는 부모로서의 역량을 키우는 방안을 탐색하며 자녀의 발달 단계별 부모의 역할을 추론한다."},{"교":"실과(기술⋅가정)","c":"12아동02-02","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"부모가 자녀를 대하는 양육 태도가 자녀에게 미치는 영향을 인식하고 양육 태도를 비교 분석하여 바람직한 양육 태도를 선택한다."},{"교":"실과(기술⋅가정)","c":"12아동02-03","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"발달의 개념 및 원리와 단계, 발달 영역 등 아동 발달의 기초를 인식하고 아동 돌봄의 각 단계에 적용하여 발달 특성을 분석한다."},{"교":"실과(기술⋅가정)","c":"12아동02-04","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"각기 다른 발달 이론의 아동 발달을 바라보는 관점을 파악하고 아동의 발달적 요구에 적용하여 다각적으로 분석한다.","h":["이 성취기준은 아동발달의 이론에 해당하는 정신분석 이론, 행동주의 이론, 인지발달 이론, 인본주의 이론, 생태학적 이론 등의 아동 발달을 바라보는 다양한 관점의 이론에 대하여 학습하고 이를 아동의 단계별 발달 특성에 적용하여 아동의 발달적 요구를 다각적으로 분석한다."]},{"교":"실과(기술⋅가정)","c":"12아동02-05","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"신생아기와 영아기의 발달 특성을 파악하여 발달 단계에 적절한 돌봄 방법을 탐색하고 제안한다.","h":[", [12아동02-06] 이 성취기준은 신생아기, 영아기, 유아기, 아동기의 발달 특징을 이해하고 이에 따른 자녀 돌보기의 방법과 가사 분담 방식을 익혀 양성이 평등한 부모가 되는 데 필요한 역량을 추론하고 부모의 역할 수행을 긍정적으로 바라보도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동02-06","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"유아기, 아동기의 발달 특성을 인식하고 각각의 발달 단계에 따른 요구를 존중하는 돌보기 방법을 탐색하여 선택하고 제안한다."},{"교":"실과(기술⋅가정)","c":"12아동02-07","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"자녀의 발달적 요구와 부모 개인의 요구가 충돌하는 배경과 맥락을 이해하고 자녀의 요구와 부모 개인의 요구 간 균형을 추구하는 방안을 제안한다.","h":["이 성취기준은 자녀를 양육하는 부모에게는 자녀의 발달을 지원하는 부모로서의 역할 수행 요구와 부모가 아닌 개인 생활의 요구를 탐색하고, 자녀의 요구와 부모 개인의 요구가 충돌할 때 정답이 존재하는 것이 아니라는 인식을 전제로 개인과 가족으로서 삶의 가치와 균형을 추구하는 선택을 하도록 다양한 방안을 제안하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동02-08","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"아동의 안전한 돌봄 환경을 조성해야 하는 부모의 권리 및 의무를 인식하고 아동 학대 예방 및 아동 안전 확보 방안을 탐색한다.","h":["이 성취기준은 아동에게 안전한 환경을 조성하고 제공하는 것은 부모의 권리이자 의무이므로 아동방임 및 유기, 학대 예방을 위한 지식과 기술, 사회적 지원 방안을 익혀 아동학대 예방 및 아동 안전 확보 방안을 탐색하고 실천하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12아동02-09","과":"아동발달과 부모","학":"고2~3","영":"아동발달과 돌봄","p":"아동의 건강한 성장을 지원하는 사회적 부모로서의 역할 수행의 의미를 인식하고 지역사회 돌봄 방안 및 부모 지원 정책을 탐색하여 사회적 돌봄 방안을 제안한다.","h":["이 성취기준은 아동의 건강한 성장을 위해서는 가족과 사회가 함께 지원하는 것이 필요함을 인식하도록 하고 사회적 부모로서 이웃의 아동의 건강한 양육에 관심을 가지고 가족 외 돌봄에 해당하는 지역사회 돌봄 방안과 부모 지원 정책을 탐색하여 사회적 돌봄 방안을 아이디어 수준에서 제안한다."]},{"교":"실과(기술⋅가정)","c":"12자립01-01","과":"생애 설계와 자립","학":"고2~3","영":"사회⋅정서적 자립","p":"타인과 적절한 관계 맺기를 위해서는 자아 확립은 물론 관계에서의 경계 세우기가 중요하며, 개별성과 관계성의 균형을 이루기 위한 방안을 탐색하는 것이 필요하다.","h":["이 성취기준은 자신의 자아를 건강하게 확립하기 위해 타인과 적절한 정서적 거리두기를 바탕으로 개인 영역의 상호 존중을 통한 적절한 관계 맺기의 의미를 이해하도록 한다. 또한 이 과정에서 자신의 개별성과 타인과의 관계성 간의 균형을 이뤄 성숙하고 균형적인 자아를 확립할 수 있도록 한다. 최근 급격히 늘어난 사회 관계망에서의 다양한 관계 맺기의 이슈를 탐색하고 그 문제점 및 해결 방안을 탐구하도록 지도한다."]},{"교":"실과(기술⋅가정)","c":"12자립01-02","과":"생애 설계와 자립","학":"고2~3","영":"사회⋅정서적 자립","p":"존중하는 만남과 이별의 과정에서 자신과 타인을 보호하는 방안을 제안하고, 다양한 정서적 지지 기반을 형성하여 정신적 건강을 유지하는 방안을 탐색한다.","h":["이 성취기준은 사회인으로서 맺게 되는 다양한 관계와의 만남에서 자기 개방과 원만한 관계 맺기의 중요성을 인식한다. 청년 시기에 정서적 지지가 취약할 경우 발생할 수 있는 어려움을 탐색해 보고 존중하는 만남과 이별의 의미를 되새겨볼 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립01-03","과":"생애 설계와 자립","학":"고2~3","영":"사회⋅정서적 자립","p":"일상에서 경험하는 다양한 상실과 비탄의 상황에 대처할 수 있는 마음 챙김 방안을 탐색한다.","h":["이 성취기준은 일상적 삶 속에서 청년 후기부터는 조부모님이나 부모님의 연로로 인해 발생하는 여러 가지 상실의 상황으로 심리적 어려움을 경험할 수 있다. 또한 진학이나 취업 등으로 기존에 맺어왔던 다양한 관계의 단절을 경험할 뿐 아니라 반려동물과의 이별 등 다양한 상실의 상황을 겪을 수 있으므로 이에 대한 다양한 사례를 탐색하고 대처할 수 있는 방안을 탐구하여 제안하도록 지도한다."]},{"교":"실과(기술⋅가정)","c":"12자립01-04","과":"생애 설계와 자립","학":"고2~3","영":"사회⋅정서적 자립","p":"일상생활에서 성인지 감수성을 높여 상호존중의 성문화를 실천한다.","h":["이 성취기준은 성별 간의 불균형에 대한 이해와 지식을 갖춰 일상생활에서 성차별적 요소를 감지하는 민감성을 높여 서로를 배려하는 방안을 탐색해 보고 일상생활에서 이를 실천할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립01-05","과":"생애 설계와 자립","학":"고2~3","영":"사회⋅정서적 자립","p":"사회구성원으로서의 자립적 삶의 태도를 갖기 위해 대인 관계와 관련한 개인적⋅사회적 이슈의 배경과 맥락을 파악하고 비판적으로 성찰한다.","h":["이 성취기준은 대인 관계와 관련된 이슈 중 성적인 측면에서 발생할 수 있는 관계 폭력, 상호책임의 피임방법 등에 관한 개인적⋅사회적 이슈를 탐색한다. 이때 이러한 주제에 대한 개인적⋅사회적 배경과 맥락을 파악하고 문제를 해결하는 과정에서 역할 기대를 고려하여 그 방안을 탐색한다."]},{"교":"실과(기술⋅가정)","c":"12자립02-01","과":"생애 설계와 자립","학":"고2~3","영":"경제적 자립","p":"경제적 자립을 위해 목표를 설정하고 다양한 수입 창출 방법을 비교 분석하여 자신의 생활양식에 맞는 방안을 설계한다.","h":["이 성취기준은 경제활동을 할 때 필요한 서류 및 세금 관련 정보(건강진단결과서, 근로계약서, 4대 보험, 종합소득세 등)를 탐색하고 자신의 상황에 맞는 다양한 수입 창출 방안(취직, 아르바이트, 창업 등)을 고려하여 이를 선택할 수 있는 역량을 함양하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립02-02","과":"생애 설계와 자립","학":"고2~3","영":"경제적 자립","p":"균형을 중시하는 태도를 바탕으로 금융자산을 형성하고 이를 거래하는 방안을 탐색한다.","h":["이 성취기준은 금융자산을 형성하고 이를 거래하는 다양한 방법(은행거래, 보험, 신용카드, 주식, 청년우대 금융 상품 등)을 탐색하고 자신의 수입과 지출을 예상하여 자산 형성 방안을 탐구하도록 한다.","이 성취기준은 안전한 주거 독립을 위해 주거의 형태, 최저 주거 기준, 청년 공공 임대 주택의 종류, 집을 구하는 방법, 선택할 때 필요한 법적 정보, 점검해야 하는 내⋅외부 상태와 주변 환경 요소 등 주거 선택과 관련된 정보를 탐색한다. 실제적인 선택보다 선택을 위한 체크리스트, 주거 선택 설계도, 맵 등을 작성해보도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립02-03","과":"생애 설계와 자립","학":"고2~3","영":"경제적 자립","p":"가정생활 자원의 나눔과 공유의 가치 실천을 위해 제한된 가정생활 자원을 최대한 활용할 수 있는 협력적 소비의 방안을 탐색한다.","h":["이 성취기준은 사용하지 않는 것을 서로 빌려주거나 거래하는 것뿐 아니라 공동체와 함께 생산물을 생산하여 공유하는 등의 다양한 협력적 소비 방안을 탐색한다. 이러한 협력적 소비 방안이 자신의 행동에 미치는 영향을 성찰하며, 이를 자신의 삶에서 실천하여 지속가능한 발전에 기여하는 태도를 기를 수 있도록 한다.","이 성취기준은 자신의 개성과 생활양식, 가치관 등을 반영한 주거 공간을 다양한 앱과 모형 등으로 구상해본다. 또한 안정적인 생활을 위해 공과금 납부 방법, 집의 간단한 유지 보수 방법 등을 조사하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립02-04","과":"생애 설계와 자립","학":"고2~3","영":"경제적 자립","p":"청년기 신용관리의 중요성을 이해하고 금융과 관련된 이슈를 비판적으로 분석하여 미래의 금융 생활을 설계한다.","h":["이 성취기준은 신용관리의 중요성을 인식하고 신용관리 방안을 탐색하여 청년 시기부터 안정적인 금융 생활의 역량을 기르도록 한다. 또한 금융 관련 문제에 대한 개인적⋅사회적 배경과 맥락을 파악하여 대출사기, 보이스피싱, 개인 간 거래 등 금융사기 피해 사례를 탐색한다. 또한 이러한 문제를 예방하는 방안과 과소비와 충동 소비, 명품족 등 무분별한 소비문화에 대한 주제를 탐색하도록 한다.","이 성취기준은 국가가 운영하는 주거복지포털 마이홈 및 각 지자체에서 운영하는 청년 자립 지원 누리집, 청년 자립을 지원하는 ‘자립 ON’앱 등을 활용하여 자립 시 필요한 정보를 적극적으로 탐색하도록 한다.","이 성취기준은 남에게 과시하는 것을 중요시하는 삶의 태도로 인해 발생할 수 있는 문제를 파악해보고, 자신과 타인의 삶을 비교하기보다 자신만의 삶의 소중함을 바탕으로 진정한 행복을 추구하는 나다운 삶이 어떤 모습인지 생각해보는 기회를 갖고 이를 설계하도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립03-01","과":"생애 설계와 자립","학":"고2~3","영":"일상생활 자립","p":"자신만의 인생 음식을 만들 수 있는 능력을 기르고, 건강을 유지하는 1인 식사의 선택 방안을 탐색하여 실천한다.","h":["이 성취기준은 타인과 공유할 수 있는 자신만의 특별한 음식이나 자신에게 의미 있는 음식을 선정하여 이를 조리할 수 있다. 또한 1인 가구의 다양한 식사 선택 방안(집밥, 배달 음식, 포장 음식, 가공식품, 밀키트 등)의 장⋅단점을 분석하여 건강 관리(체중 관리, 대사증후군 예방 등)을 위한 식사를 선택할 수 있도록 한다."]},{"교":"실과(기술⋅가정)","c":"12자립03-02","과":"생애 설계와 자립","학":"고2~3","영":"일상생활 자립","p":"독립생활의 기초가 되는 안전한 주거를 선택할 때 필요한 정보와 고려해야 할 조건을 분석하여 선택한다."},{"교":"실과(기술⋅가정)","c":"12자립03-03","과":"생애 설계와 자립","학":"고2~3","영":"일상생활 자립","p":"자신의 생활공간에 대한 가치를 반영한 공간을 구상하고 관리하는 방안을 탐색한다."},{"교":"실과(기술⋅가정)","c":"12자립03-04","과":"생애 설계와 자립","학":"고2~3","영":"일상생활 자립","p":"청년자립을 돕고 건강한 일상생활을 유지할 수 있는 다양한 복지 서비스 정보를 탐색한다."},{"교":"실과(기술⋅가정)","c":"12자립03-05","과":"생애 설계와 자립","학":"고2~3","영":"일상생활 자립","p":"행복을 추구하기 위해 나만의 삶의 가치를 반영한 독립적 생활을 설계한다."},{"교":"정보","c":"9정01-01","과":"정보","학":"중1~3","영":"컴퓨팅 시스템","p":"컴퓨팅 시스템의 구성요소와 동작 원리를 이해하고, 운영 체제의 기능을 분석한다.","h":["컴퓨팅 시스템은 컴퓨터라는 특정한 기기에서 더욱 큰 범위의 시스템으로 확장되었음을 인식하고, 현실 세계에서 볼 수 있는 다양한 컴퓨팅 시스템이 문제를 해결하는 방식을 설명할 수 있어야 한다. 컴퓨팅 시스템이 올바르게 동작하기 위해 운영 체제라는 특수한 형태의 소프트웨어가 필요함을 이해하고, 운영 체제가 컴퓨팅 시스템을 효율적으로 활용하기 위해 수행하는 작업을 설명할 수 있어야 한다."]},{"교":"정보","c":"9정01-02","과":"정보","학":"중1~3","영":"컴퓨팅 시스템","p":"피지컬 컴퓨팅의 개념을 이해하고, 생활 속에서 적용된 사례 조사를 통해 컴퓨팅 시스템의 필요성과 가치를 판단한다.","h":["다양한 구성요소가 컴퓨팅 시스템에서 고유한 역할을 담당하고 있음을 이해하고, 목적에 맞는 물리적인 장치와 소프트웨어를 결합하여 피지컬 컴퓨팅 시스템을 구현하는 과정을 통해 사회의 다양한 영역에서 피지컬 컴퓨팅 시스템이 유용하게 사용될 수 있음을 판단할 수 있어야 한다."]},{"교":"정보","c":"9정01-03","과":"정보","학":"중1~3","영":"컴퓨팅 시스템","p":"문제 해결 목적에 맞는 피지컬 컴퓨팅 구성요소를 선택하여 시스템을 구상한다."},{"교":"정보","c":"9정02-01","과":"정보","학":"중1~3","영":"데이터","p":"실생활의 데이터가 디지털 형태로 변환되어 활용되는 긍정적 가치를 탐색하고, 다양한 데이터를 디지털 형태로 표현한다.","h":["디지털 형태의 데이터가 갖는 특징과 장점을 탐색하고, 문자, 이미지, 소리, 동영상 등의 데이터를 컴퓨팅 시스템에서 표현하기 위해 사용하는 기법을 활용하여 실제로 데이터를 디지털 형태로 표현할 수 있어야 한다."]},{"교":"정보","c":"9정02-02","과":"정보","학":"중1~3","영":"데이터","p":"문제 해결에 적합한 데이터를 수집하고, 목적에 맞게 구분하여 관리한다.","h":["여러 가지 문제 상황을 해결하는 데 활용 가능한 데이터를 다양한 방식으로 수집하고 분류하여 활용도를 높일 수 있어야 한다. 데이터의 종류, 데이터의 의미, 공통점 등 데이터가 가지고 있는 의미나 형식에 따라 데이터를 구분하여 저장하고 활용할 수 있어야 한다."]},{"교":"정보","c":"9정02-03","과":"정보","학":"중1~3","영":"데이터","p":"실생활의 데이터를 표, 다이어그램 등 다양한 형태로 구조화한다."},{"교":"정보","c":"9정02-04","과":"정보","학":"중1~3","영":"데이터","p":"사례를 중심으로 데이터 간의 관계를 파악하고, 데이터에 기반하여 의미를 해석한다.","h":["수집, 관리하는 데이터를 분석하기 용이한 형태로 나타내고, 이를 소프트웨어나 프로그래밍으로 분석하여 얻은 결과의 가치를 인식하고, 데이터를 기반으로 자신의 주장을 논리적으로 설명할 수 있어야 한다."]},{"교":"정보","c":"9정02-05","과":"정보","학":"중1~3","영":"데이터","p":"여러 학문 분야의 사례를 중심으로 데이터를 수집⋅분석하여 융합적으로 문제를 해결한다."},{"교":"정보","c":"9정03-01","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"문제의 상태를 정의하고 수행 가능한 형태로 구조화한다."},{"교":"정보","c":"9정03-02","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"문제 해결을 위한 추상화의 중요성을 이해하고, 핵심요소를 중심으로 알고리즘을 표현한다."},{"교":"정보","c":"9정03-03","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"알고리즘의 중요성을 이해하고, 문제를 해결하는 다양한 알고리즘을 비교⋅분석한다.","h":["문제를 해결하는 알고리즘은 여러 가지 방식으로 나타날 수 있으나 정보 과목에서 추구하는 목표는 문제를 효과적이고 효율적으로 해결하는 알고리즘임을 인식하고, 하나의 문제를 해결하는 여러 알고리즘에 어떠한 장단점이 존재하는지를 비교⋅분석하여 논리적으로 설명할 수 있어야 한다."]},{"교":"정보","c":"9정03-04","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"사례를 중심으로 문제 해결에 적합한 전략을 선택하여 알고리즘을 설계한다.","h":["문제를 해결하기 위해 정보 분야에서 활용하는 문제 해결 전략을 이해하고, 문제 해결 과정에 적절한 전략을 활용하여 문제를 해결할 수 있어야 한다."]},{"교":"정보","c":"9정03-05","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"데이터를 순차적으로 저장할 수 있는 구조를 활용하여 문제 해결 프로그램을 작성한다.","h":["입력된 데이터를 처리하여 결과 데이터를 도출하는 형태로 프로그램이 제작된다는 개념을 이해하고, 배열이나 리스트 등 데이터를 순차적으로 저장할 수 있는 구조를 활용하여 많은 양의 데이터를 효과적으로 처리할 수 있어야 한다."]},{"교":"정보","c":"9정03-06","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"논리 연산과 중첩 제어 구조를 활용하여 문제를 해결하는 프로그램을 작성한다."},{"교":"정보","c":"9정03-07","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"프로그램 작성에서 함수를 활용하고, 프로그램 수행 결과를 디버거로 분석하여 오류를 수정한다."},{"교":"정보","c":"9정03-08","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"실생활의 문제를 탐색하여 발견하고, 프로그래밍을 통해 해결한다."},{"교":"정보","c":"9정03-09","과":"정보","학":"중1~3","영":"알고리즘과 프로그래밍","p":"다양한 학문 분야의 문제 해결을 위해 협력하여 소프트웨어를 개발한다."},{"교":"정보","c":"9정04-01","과":"정보","학":"중1~3","영":"인공지능","p":"인공지능의 개념과 특성을 설명하고 인공지능 소프트웨어를 구별한다.","h":["인공지능의 기초적인 개념을 이해하고 모델, 학습, 데이터 등 인공지능 시스템이 구성되는 원리와 문제를 해결하는 과정에 대해 설명할 수 있어야 한다. 이러한 이해를 기반으로 소프트웨어가 문제를 해결할 때 인공지능 시스템을 사용하는 부분을 구체적인 방식으로 설명할 수 있어야 한다."]},{"교":"정보","c":"9정04-02","과":"정보","학":"중1~3","영":"인공지능","p":"인공지능 학습에서 데이터의 중요성을 이해하고, 학습에 필요한 데이터를 수집하여 분류한다."},{"교":"정보","c":"9정04-03","과":"정보","학":"중1~3","영":"인공지능","p":"다양한 데이터를 활용하여 인공지능 시스템을 구성하고 적용한다.","h":["이미지, 소리, 글자 등의 데이터를 활용하여 인공지능 시스템을 학습시키고 학습한 시스템을 활용하여 문제를 해결하는 과정을 수행할 수 있어야 한다."]},{"교":"정보","c":"9정04-04","과":"정보","학":"중1~3","영":"인공지능","p":"인공지능 시스템으로 해결 가능한 문제를 발견하고, 문제 해결에 적합한 인공지능 시스템을 적용한다."},{"교":"정보","c":"9정04-05","과":"정보","학":"중1~3","영":"인공지능","p":"인공지능 학습에 필요한 데이터의 수집과 활용에서 발생하는 윤리적인 문제의 해결 방안을 구상한다.","h":["인공지능 학습에 필요한 데이터의 수집과 활용에서 나타날 수 있는 여러 가지 현실적인 문제들에 대해 법적, 사회적, 윤리적으로 타당성을 가지는 해결 방안을 제시할 수 있어야 한다. 하나의 문제를 바라보는 여러 측면에 대해 고려하고 각각의 해결 방안이 가지는 장단점을 정리한 후 결론을 도출하는 과정을 경험하면서 인공지능의 사회적 역할과 가치를 판단할 수 있어야 한다."]},{"교":"정보","c":"9정05-01","과":"정보","학":"중1~3","영":"디지털 문화","p":"디지털 사회의 특성을 탐구하고, 사회 변화에 따른 직업의 변화를 탐구한다."},{"교":"정보","c":"9정05-02","과":"정보","학":"중1~3","영":"디지털 문화","p":"디지털 사회의 구성원으로서 편리하고 안전한 생활을 위한 규칙에 대해 민주적으로 논의하고 실천 방안을 수립한다.","h":["디지털 사회를 안전하고 편리하게 살아가는 데 필요한 정보 윤리, 사이버 폭력 및 범죄 예방에 대한 기본적인 소양을 갖추고 스마트폰 중독, 인터넷 중독, 게임 과몰입 등의 구체적인 사례를 분석할 수 있어야 한다. 분석 내용을 기반으로 개인과 사회가 각각 수행해야 하는 실천 방안을 도출하여 자신의 삶에 적용하려는 태도를 갖출 수 있어야 한다."]},{"교":"정보","c":"9정05-03","과":"정보","학":"중1~3","영":"디지털 문화","p":"사례를 중심으로 디지털 공간에서 함께 살아가기 위해 개인 정보 및 권리와 저작권을 보호하는 실천 방법을 탐구한다."},{"교":"정보","c":"12정01-01","과":"정보","학":"고2~3","영":"컴퓨팅 시스템","p":"유무선 네트워크의 특성을 이해하고, 컴퓨팅 시스템 간 공유, 협력, 소통을 위한 네트워크 환경을 구성한다.","h":["네트워크의 개념과 구성요소, 유⋅무선 통신의 특성 등을 구체적인 예를 들어 설명하고, 다양한 컴퓨팅 시스템 및 사물인터넷 장치에서 활용 가능한 유⋅무선 네트워크 환경을 구성할 수 있어야 한다."]},{"교":"정보","c":"12정01-02","과":"정보","학":"고2~3","영":"컴퓨팅 시스템","p":"사물인터넷의 구성과 동작 원리를 분석하고, 사물인터넷 기술로 인한 개인의 삶과 사회의 변화를 예측한다."},{"교":"정보","c":"12정01-03","과":"정보","학":"고2~3","영":"컴퓨팅 시스템","p":"문제 해결에 적합한 피지컬 컴퓨팅 시스템 장치를 선택하여 사물인터넷 시스템을 설계한다."},{"교":"정보","c":"12정02-01","과":"정보","학":"고2~3","영":"데이터","p":"디지털 데이터 압축의 개념과 필요성을 이해하고, 압축의 효율성을 분석하여 평가한다.","h":["문자, 이미지, 소리 데이터 등의 기본적인 압축 원리를 이해하고 간단한 데이터에 압축 기법을 적용하여 원본 데이터와 품질 및 용량 분석, 압축 방법 간의 효율성을 비교⋅분석할 수 있어야 한다."]},{"교":"정보","c":"12정02-02","과":"정보","학":"고2~3","영":"데이터","p":"암호화의 개념을 이해하고, 암호화를 활용하여 데이터를 안전하게 관리하는 사례를 비교⋅분석한다.","h":["비교적 간단한 치환형, 전치형 등의 암호 기법을 활용하여 암호화, 복호화의 과정을 이해하고, 데이터 암호화를 활용하는 사례 분석을 통해 개인과 사회를 보호하기 위한 수단으로 암호화의 중요성과 필요성을 설명할 수 있어야 한다."]},{"교":"정보","c":"12정02-03","과":"정보","학":"고2~3","영":"데이터","p":"빅데이터의 개념과 특징에 대한 이해를 바탕으로, 문제 해결에 적합한 데이터를 수집한다."},{"교":"정보","c":"12정02-04","과":"정보","학":"고2~3","영":"데이터","p":"빅데이터 분석 도구를 활용하여 데이터를 시각화하고 그 의미와 가치를 해석한다."},{"교":"정보","c":"12정03-01","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"복잡한 문제를 해결 가능한 작은 문제로 분해하고 모델링한다.","h":["복잡한 문제를 분석하는 단계에서 좀 더 작은 문제로 분해하는 과정을 수행하며, 해결하기 용이하도록 단순화나 구조화하는 모델링 단계를 수행할 수 있어야 한다. 작은 문제의 해결 결과를 종합하는 과정에서 작은 문제를 모두 수행했을 때 전체 문제 해결이 원활하게 이루어지는지, 오류가 없는지를 확인할 수 있어야 한다."]},{"교":"정보","c":"12정03-02","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"데이터를 정렬하는 다양한 알고리즘의 특징과 효율을 비교⋅분석한다.","h":[", [12정03-03] 여러 가지 정렬, 탐색 알고리즘을 적용하여 실생활의 간단한 데이터의 정렬, 탐색 문제를 해결할 수 있어야 한다. 정렬, 탐색 알고리즘의 수행 과정을 분석해보고 문제에 따라 알고리즘의 효율성이 다를 수 있음을 설명할 수 있어야 한다."]},{"교":"정보","c":"12정03-03","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"데이터를 탐색하는 다양한 알고리즘의 특징과 효율을 비교⋅분석한다."},{"교":"정보","c":"12정03-04","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"자료형의 종류와 특성을 알고, 적합한 자료형을 선택하여 프로그램을 작성한다."},{"교":"정보","c":"12정03-05","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"표준입출력과 파일입출력을 활용한 프로그램을 작성한다."},{"교":"정보","c":"12정03-06","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"다차원 데이터 구조를 활용한 프로그램을 작성한다."},{"교":"정보","c":"12정03-07","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"다양한 제어 구조를 복합적으로 활용한 프로그램을 작성한다."},{"교":"정보","c":"12정03-08","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"객체를 구현하는 클래스와 인스턴스를 활용하여 프로그램을 작성한다.","h":["실생활의 사례를 활용하여 객체 지향의 기본 개념을 이해하고 필요성을 설명할 수 있어야 한다. 클래스와 객체를 생성하고 문제 해결을 위한 프로그램 구현에 활용할 수 있어야 한다."]},{"교":"정보","c":"12정03-09","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"실생활 및 다양한 학문 분야의 문제 해결을 위한 프로그램을 협력적으로 설계⋅구현한다."},{"교":"정보","c":"12정03-10","과":"정보","학":"고2~3","영":"알고리즘과 프로그래밍","p":"문제 해결을 위한 프로그램의 성능을 평가하고 공유한다."},{"교":"정보","c":"12정04-01","과":"정보","학":"고2~3","영":"인공지능","p":"지능 에이전트의 개념과 특성을 이해하고, 인간과 인공지능의 관계를 분석한다.","h":["에이전트와 지능 에이전트를 인식, 학습, 추론, 행동 등 인공지능 관점에서 구분하고, 인공지능 발전 현황에 비추어 인간과 인공지능의 역할에 대해 탐색할 수 있어야 한다."]},{"교":"정보","c":"12정04-02","과":"정보","학":"고2~3","영":"인공지능","p":"기계학습의 개념을 이해하고, 지도학습과 비지도학습의 차이를 비교⋅분석한다."},{"교":"정보","c":"12정04-03","과":"정보","학":"고2~3","영":"인공지능","p":"기계학습을 활용하여 해결할 수 있는 문제와 그렇지 않은 문제를 구분하고, 사회문제 해결에 기계학습을 적용한다.","h":["회귀, 분류, 군집 등 기계학습 유형을 이해하고, 이를 통해 해결할 수 있는 실생활 및 사회문제를 선별하여 해결책을 적용할 수 있어야 한다."]},{"교":"정보","c":"12정05-01","과":"정보","학":"고2~3","영":"디지털 문화","p":"디지털 기술이 사회에 미치는 영향력을 분석하고 발전 방향을 예측하여 진로를 설계한다."},{"교":"정보","c":"12정05-02","과":"정보","학":"고2~3","영":"디지털 문화","p":"보호해야 할 정보와 공유해야 할 정보를 구분하고, 올바른 정보 보호 방법을 실천한다.","h":["정보 보호와 정보공개의 가치와 영향력을 인식할 수 있어야 하며, 자신뿐만 아니라 타인의 정보 역시 중요함을 이해하고, 개인 정보 보호, 오⋅남용 방지 대책 등 실사례를 탐색하며 개인 정보를 포함하여 정보 보호 방법을 실천할 수 있어야 한다."]},{"교":"정보","c":"12정05-03","과":"정보","학":"고2~3","영":"디지털 문화","p":"정보보안의 필요성을 이해하고, 보안 기술을 활용하여 디지털 윤리를 실천한다."},{"교":"정보","c":"12인기01-01","과":"인공지능 기초","학":"고2~3","영":"인공지능의 이해","p":"인공지능의 지능적 판단에 대한 이해를 바탕으로 인공지능을 활용한 실생활 및 다양한 학문 분야의 문제 해결 사례를 비교⋅분석한다.","h":["인공지능의 개념과 특성을 이해하고, 튜링 테스트를 통해 인공지능의 지능적 판단에 대해 고찰하며, 인공지능이 활용된 최신 사례를 분석하여 인공지능의 활용 범위와 중요성을 설명할 수 있어야 한다."]},{"교":"정보","c":"12인기01-02","과":"인공지능 기초","학":"고2~3","영":"인공지능의 이해","p":"인공지능에서 탐색의 중요성을 이해하고 문제 해결을 위한 탐색 과정을 설계한다."},{"교":"정보","c":"12인기01-03","과":"인공지능 기초","학":"고2~3","영":"인공지능의 이해","p":"맹목적 탐색과 정보 이용 탐색의 차이를 중심으로 지능적 탐색의 원리를 파악한다."},{"교":"정보","c":"12인기01-04","과":"인공지능 기초","학":"고2~3","영":"인공지능의 이해","p":"지능적 탐색이 필요한 문제를 찾아보고 문제 해결을 위해 정보 이용 탐색 알고리즘을 적용한다.","h":["지능적 탐색을 적용할 수 있는 퍼즐이나 길찾기 문제를 탐색하고, 최상 우선, A* 등의 정보 이용 탐색 방법을 적용한 인공지능 프로그램을 개발할 수 있어야 한다."]},{"교":"정보","c":"12인기01-05","과":"인공지능 기초","학":"고2~3","영":"인공지능의 이해","p":"규칙과 사실을 활용하여 지식을 표현하고, 새로운 지식을 추론하여 생성한다."},{"교":"정보","c":"12인기02-01","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"기계학습을 적용할 문제를 정의하고, 문제 해결에 필요한 데이터를 선정하여 수집한다.","h":["전통적 프로그래밍과 대비되는 기계학습의 특성을 이해하여 기계학습 기반의 인공지능을 적용할 문제를 판단하고, 문제 해결에 적합한 데이터를 수집할 수 있어야 한다. 이 과정에서 나타날 수 있는 데이터의 편향이 인공지능의 학습에 영향을 미칠 수 있음을 고려하여 데이터의 수집과 활용에 공정성을 추구할 수 있어야 한다."]},{"교":"정보","c":"12인기02-02","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"수집한 데이터를 가공하여 핵심 속성을 추출한다.","h":["기계학습에 사용할 데이터를 수집한 후, 결측치와 이상치의 유무를 파악하고 문제 해결에 필요한 속성이 무엇인지 선별한 다음 문제 해결에 적합한 형태로 전처리할 수 있어야 한다."]},{"교":"정보","c":"12인기02-03","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"문제 해결에 적합한 기계학습의 유형과 알고리즘을 선정한다.","h":["기계학습의 유형을 지도학습과 비지도학습, 강화학습 등으로 구분하고, 해결해야 하는 문제의 특성을 고려하여 문제 해결에 적합한 유형을 선정할 수 있어야 한다. 또한, 분류, 예측, 군집 등에 활용하는 기계학습 알고리즘을 이해하여 문제 해결에 적합한 알고리즘을 선정할 수 있어야 한다."]},{"교":"정보","c":"12인기02-04","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"훈련 데이터를 이용하여 학습을 진행하고, 테스트 데이터를 사용하여 성능을 평가한다."},{"교":"정보","c":"12인기02-05","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"인공신경망과 딥러닝의 특성에 대한 이해를 바탕으로 활용 분야를 탐색한다."},{"교":"정보","c":"12인기02-06","과":"인공지능 기초","학":"고2~3","영":"인공지능과 학습","p":"딥러닝을 활용하여 실생활 및 다양한 학문 분야의 문제를 해결하고, 성능을 평가한다.","h":["딥러닝을 기반으로 하는 컴퓨터 비전, 음성 인식, 자연어처리 기술을 구현하는 방식을 이용하고, 적합한 딥러닝 기술을 활용하여 실생활 및 다양한 학문 분야의 문제를 해결할 수 있어야 한다. 문제 해결에 있어 딥러닝을 활용해 문제를 해결하는 경우와 다른 방법으로 문제를 해결한 경우의 차이점을 설명할 수 있어야 한다."]},{"교":"정보","c":"12인기03-01","과":"인공지능 기초","학":"고2~3","영":"인공지능의 사회적 영향","p":"인공지능의 발전으로 인한 사회 변화를 살펴보고, 인공지능으로 해결할 수 있는 사회적 문제를 분석한다."},{"교":"정보","c":"12인기03-02","과":"인공지능 기초","학":"고2~3","영":"인공지능의 사회적 영향","p":"인공지능에 의해 변화하는 인간의 삶과 직업의 양상에 대해 이해하고 진로를 탐색한다."},{"교":"정보","c":"12인기03-03","과":"인공지능 기초","학":"고2~3","영":"인공지능의 사회적 영향","p":"인공지능에 대한 비판적 자세를 바탕으로 인공지능과 인간의 공존 방안을 도출한다.","h":["인공지능에 대한 일방적인 수용 또는 거부보다는, 비판적인 자세를 바탕으로 인간과 공존해야 하는 존재로서 인공지능의 역할을 제시할 수 있어야 한다. 인공지능을 대하는 인간의 태도에 대한 윤리적 고찰을 통해 바람직한 공존 방식을 규정할 수 있어야 한다."]},{"교":"정보","c":"12인기03-04","과":"인공지능 기초","학":"고2~3","영":"인공지능의 사회적 영향","p":"인공지능의 활용사례와 윤리적 딜레마 상황을 인공지능 윤리 관점에서 분석한다.","h":["인간의 편향성에 대한 이해를 바탕으로, 알고리즘과 데이터의 편향성으로 인해 인공지능이 사회에 끼치는 영향을 이해하고 인공지능으로 인한 딜레마 상황에서 윤리적인 판단과 선택을 할 수 있어야 한다. 현재까지 정의되어진 인공지능 윤리(지침)와 관련하여 인공지능 개발자, 사용자, 운영⋅관리자 관점을 살펴보고, 인공지능 기술 활용으로 발생 가능한 윤리적 쟁점에 대하여 사회적 책임과 공정성의 가치를 판단할 수 있어야 한다."]},{"교":"정보","c":"12인기04-01","과":"인공지능 기초","학":"고2~3","영":"인공지능 프로젝트","p":"지속가능발전목표를 해결하기 위해 인공지능을 적용할 수 있는 방안을 탐색하고, 인공지능 프로젝트 활동에 적합한 주제를 도출한다.","h":["지속가능발전목표는 2015년 유엔 총회에서 결의한 것으로 총 17개의 주요 목표와 169개의 세부 목표로 구성되어 있다는 것을 이해하고, 17개의 주요 목표를 통해 현재 인류가 직면하고 있는 위기가 무엇인지 인식할 수 있어야 한다. 인공지능을 활용하여 달성할 수 있는 목표에는 어떤 것이 있는지를 살펴보고 인공지능 프로젝트 활동에 적합한 주제를 도출할 수 있어야 한다."]},{"교":"정보","c":"12인기04-02","과":"인공지능 기초","학":"고2~3","영":"인공지능 프로젝트","p":"인공지능 문제 해결 과정에 기반하여 프로젝트 수행 계획을 구안한다.","h":["문제 정의, 문제 해결에 적합한 데이터 수집 및 전처리, 기계학습 유형과 알고리즘 선정, 기계학습을 통한 모델 생성, 성능 평가 및 수정 등의 인공지능 문제 해결 과정에 따라 프로젝트 수행 계획을 구안할 수 있어야 한다."]},{"교":"정보","c":"12인기04-03","과":"인공지능 기초","학":"고2~3","영":"인공지능 프로젝트","p":"인공지능 프로젝트를 수행하는 과정에서 협력적인 문제 해결 자세를 바탕으로 인공지능 소프트웨어를 개발한다."},{"교":"정보","c":"12인기04-04","과":"인공지능 기초","학":"고2~3","영":"인공지능 프로젝트","p":"인공지능의 사회적 영향을 고려하여 인공지능 소프트웨어를 개발하고, 평가 결과를 반영하여 성능을 개선한다."},{"교":"정보","c":"12데과01-01","과":"데이터 과학","학":"고2~3","영":"데이터 과학의 이해","p":"데이터 과학의 개념을 이해하고, 문제 해결 사례를 데이터 기반 의사 결정 상황에 적용한다."},{"교":"정보","c":"12데과01-02","과":"데이터 과학","학":"고2~3","영":"데이터 과학의 이해","p":"정형 데이터와 비정형 데이터를 구분하고, 데이터 속성에서 데이터의 잠재적 가치를 파악한다.","h":["데이터의 형태를 바탕으로 정형 데이터와 비정형 데이터를 구분하고, 정형 데이터에서 데이터 속성별 의미와 속성 간 관계를 파악하여 수집된 데이터가 분석 대상으로서 가치가 있는지 판단할 수 있어야 한다."]},{"교":"정보","c":"12데과01-03","과":"데이터 과학","학":"고2~3","영":"데이터 과학의 이해","p":"데이터셋의 집합인 데이터베이스를 이해하고, 서로 다른 데이터셋의 데이터를 분석이 가능한 형태로 통합하는 것의 의미를 파악한다.","h":["서로 다른 데이터셋 간 공통된 속성을 기준으로 데이터를 통합할 수 있음을 이해하고, 데이터셋 간의 관계를 바탕으로 데이터베이스의 개념을 설명할 수 있어야 한다. 대규모의 데이터를 여러 사람이 공유하기 위해서는 체계적인 시스템이 필요하다는 점을 바탕으로 데이터베이스의 필요성을 설명할 수 있어야 한다."]},{"교":"정보","c":"12데과01-04","과":"데이터 과학","학":"고2~3","영":"데이터 과학의 이해","p":"데이터로 인한 사회 변화를 인식하고, 진로 및 직업과 관련한 데이터 기반 문제 해결 사례를 분석한다."},{"교":"정보","c":"12데과02-01","과":"데이터 과학","학":"고2~3","영":"데이터 준비와 분석","p":"데이터를 편향되지 않도록 수집하고, 수집된 데이터의 특성을 분석한다.","h":["데이터의 선택과 수집된 데이터를 활용하는 과정에서 발생할 수 있는 편향성을 최소화하고, 수집된 데이터의 출처, 규모, 데이터 속성별 자료형, 간단한 통계적 특성 등 데이터의 특성을 분석하고 파악할 수 있어야 한다."]},{"교":"정보","c":"12데과02-02","과":"데이터 과학","학":"고2~3","영":"데이터 준비와 분석","p":"이상치와 결측치 탐색 및 정규화를 통해 전처리하여 오류 가능성을 최소화하고, 데이터 분석을 위해 시각화한다."},{"교":"정보","c":"12데과02-03","과":"데이터 과학","학":"고2~3","영":"데이터 준비와 분석","p":"데이터를 분석하기 위해 데이터 속성 간의 관계를 파악하고 통합한다."},{"교":"정보","c":"12데과02-04","과":"데이터 과학","학":"고2~3","영":"데이터 준비와 분석","p":"동일한 데이터를 서로 다른 분석 방법을 적용하여 분석 결과를 비교한다.","h":["동일한 데이터에 서로 다른 분석 방법을 적용하는 경우 분석 결과가 달라질 수 있음을 이해하고, 분석 방법과 연관지어 서로 다른 결과가 나온 이유를 분석하고 비교할 수 있어야 한다."]},{"교":"정보","c":"12데과03-01","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"데이터 모델 개념을 이해하고 데이터 분석에 활용할 수 있는 도구를 탐색한다."},{"교":"정보","c":"12데과03-02","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"동일한 데이터를 통계적 회귀모델과 기계학습을 통한 회귀모델로 분석하여 결과 해석 내용을 비교한다."},{"교":"정보","c":"12데과03-03","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"데이터의 속성에 대한 유사성을 측정하고 분석하여 군집을 형성하고, 군집 분석 결과의 의미를 해석한다.","h":["데이터의 속성을 바탕으로 유사도가 높은 데이터끼리 묶어 다수의 군집으로 나누고 군집 내 유사성과 군집 간 상이성을 설명할 수 있어야 한다."]},{"교":"정보","c":"12데과03-04","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"데이터 간의 관계를 분석하고 상호 연관성을 파악하여 결과의 의미를 해석한다.","h":["장바구니 분석의 사례를 통해 연관 분석의 원리를 이해하고, 데이터 속성 간 지지도, 신뢰도, 향상도를 측정하며 데이터 속성 간 연관 규칙을 찾아낼 수 있어야 한다."]},{"교":"정보","c":"12데과03-05","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"데이터 분석 방법에 따른 데이터 모델의 분석 결과를 비교하고 평가한다.","h":["데이터 특성과 분석 목적에 적합한 평가 방법(예측률, 정확도 등)을 선정하고, 이를 바탕으로 데이터 분석 결과를 해석하고 그 의미를 판단할 수 있어야 한다."]},{"교":"정보","c":"12데과03-06","과":"데이터 과학","학":"고2~3","영":"데이터 모델링과 평가","p":"다양한 분석 방법을 비교하고 평가하여 분석 목적에 가장 적합한 분석 방법을 적용한다."},{"교":"정보","c":"12데과04-01","과":"데이터 과학","학":"고2~3","영":"데이터 과학 프로젝트","p":"분야별 데이터 과학의 적용 사례를 조사하여 분석하고, 데이터로 해결 가능한 주제를 찾아 적합성을 판단한다."},{"교":"정보","c":"12데과04-02","과":"데이터 과학","학":"고2~3","영":"데이터 과학 프로젝트","p":"수집된 데이터를 탐색적으로 분석하여 데이터 속 의미를 파악하고, 문제 해결을 위한 창의적인 방법을 구상한다."},{"교":"정보","c":"12데과04-03","과":"데이터 과학","학":"고2~3","영":"데이터 과학 프로젝트","p":"데이터 분석을 진행할 때, 2개 이상의 방법을 사용하여 분석하고 결과를 비교한다.","h":["동일한 데이터를 기반으로 서로 다른 데이터 전처리, 데이터 분석 방법을 적용한 결과를 비교하여 가장 적절한 데이터 모델링 방법을 설계할 수 있어야 한다."]},{"교":"정보","c":"12데과04-04","과":"데이터 과학","학":"고2~3","영":"데이터 과학 프로젝트","p":"복잡하고 어려운 문제라도 끝까지 해결하기 위한 자세를 갖추고 분석하여, 분석 결과에 대한 의미를 해석한다."},{"교":"정보","c":"12데과04-05","과":"데이터 과학","학":"고2~3","영":"데이터 과학 프로젝트","p":"분석을 위한 목적부터 데이터 수집 및 분석에 이르는 전 과정을 성찰하고, 사회적 영향을 고려하여 분석 결과의 활용방안을 탐색한다.","h":["데이터 분석을 통한 문제 해결 과정에서 파생되는 사회적인 영향, 윤리적인 문제를 성찰하고 데이터 모델을 수정한 후, 문제 해결 결과를 일반화하고 공유할 수 있어야 한다."]},{"교":"정보","c":"12소생01-01","과":"소프트웨어와 생활","학":"고2~3","영":"세상을 변화시키는 소프트웨어","p":"소프트웨어가 세상을 변화시킨 사례를 탐색하고 소프트웨어가 사회 변화에 미치는 영향을 분석한다."},{"교":"정보","c":"12소생01-02","과":"소프트웨어와 생활","학":"고2~3","영":"세상을 변화시키는 소프트웨어","p":"실세계의 문제와 현상을 소프트웨어의 관점으로 바라보고 소프트웨어 발전에 따른 미래 사회의 변화를 예측한다.","h":["세상의 문제와 현상에 대한 구체적 사례와 특징을 소프트웨어 기술을 도입하기 전과 후로 구분하여 분석하고 이를 바탕으로 사회 변화의 흐름을 파악할 수 있어야 한다."]},{"교":"정보","c":"12소생01-03","과":"소프트웨어와 생활","학":"고2~3","영":"세상을 변화시키는 소프트웨어","p":"소프트웨어 융합을 통한 문제 해결 사례를 바탕으로, 다양한 학문 분야에서 소프트웨어와의 융합을 통해 문제를 해결하는 방법을 비교⋅분석한다.","h":["인문, 사회, 과학, 예술 등 다양한 학문 분야에서 소프트웨어와 융합으로 문제가 해결되거나 발전한 구체적인 사례를 탐색하여 소프트웨어와의 융합을 통한 문제 해결이 가지는 장점을 설명할 수 있어야 한다."]},{"교":"정보","c":"12소생02-01","과":"소프트웨어와 생활","학":"고2~3","영":"창작을 지원하는 소프트웨어","p":"피지컬 컴퓨팅 도구로 구현된 작품의 구성 및 작동 원리를 분석한다.","h":["피지컬 컴퓨팅 도구로 구현된 작품 또는 장치를 분석하여 센서나 액추에이터의 기능과 역할을 설명하고, 센서나 액추에이터를 다양한 용도로 유연하게 활용할 수 있음을 인식할 수 있어야 한다."]},{"교":"정보","c":"12소생02-02","과":"소프트웨어와 생활","학":"고2~3","영":"창작을 지원하는 소프트웨어","p":"소프트웨어를 통해 아이디어를 표현하는 데 필요한 센서와 액추에이터를 선택하여 피지컬 컴퓨팅 시스템을 구성한다."},{"교":"정보","c":"12소생02-03","과":"소프트웨어와 생활","학":"고2~3","영":"창작을 지원하는 소프트웨어","p":"피지컬 컴퓨팅을 통해 미디어 아트 작품을 창작하고, 창작에 활용된 소프트웨어의 가치를 파악한다."},{"교":"정보","c":"12소생02-04","과":"소프트웨어와 생활","학":"고2~3","영":"창작을 지원하는 소프트웨어","p":"웨어러블 장치 작품을 창작하고 공유하는 과정을 통해 소프트웨어의 가치를 확산한다."},{"교":"정보","c":"12소생03-01","과":"소프트웨어와 생활","학":"고2~3","영":"현상을 분석하는 소프트웨어","p":"사회 현상을 분석할 수 있는 데이터의 중요성과 가치를 인식하고, 데이터를 탐색하여 활용 방안을 구상한다.","h":["데이터를 활용하는 다양한 사회 현상을 탐색하여 데이터 분석의 필요성을 인식할 수 있어야 한다. 공공 및 민간 데이터 제공 플랫폼을 통해 문제 해결에 필요한 데이터를 탐색하고, 탐색한 데이터의 활용 방안을 파악할 수 있어야 한다."]},{"교":"정보","c":"12소생03-02","과":"소프트웨어와 생활","학":"고2~3","영":"현상을 분석하는 소프트웨어","p":"데이터 유형에 따라 적합한 방법으로 데이터를 수집하고, 목적에 맞게 처리하고 관리한다.","h":["수집 의도에 맞는 데이터 유형(정형데이터, 비정형데이터 등)에 따라 알맞은 데이터 수집 방법이나 도구를 선택하고, 수집한 데이터에서 필요한 부분과 필요하지 않은 부분을 구분하여 데이터를 정제하고 저장할 수 있어야 한다."]},{"교":"정보","c":"12소생03-03","과":"소프트웨어와 생활","학":"고2~3","영":"현상을 분석하는 소프트웨어","p":"데이터를 분석하고 시각화하여 다양한 사회 현상의 의미를 해석한다."},{"교":"정보","c":"12소생03-04","과":"소프트웨어와 생활","학":"고2~3","영":"현상을 분석하는 소프트웨어","p":"데이터의 사회적 가치에 대한 이해를 토대로 데이터를 분석하고 의미를 파악한 후, 결과를 윤리적으로 활용한다."},{"교":"정보","c":"12소생04-01","과":"소프트웨어와 생활","학":"고2~3","영":"모의 실험하는 소프트웨어","p":"시뮬레이션 프로그램의 개념과 구성요소를 이해하고 가치를 파악한다.","h":["시뮬레이션 프로그램 제작을 위해 화면 구성, 구현 기능 등의 요소를 파악하고 시뮬레이션의 실제적 활용을 통해 시뮬레이션의 필요성과 역할을 인식할 수 있어야 한다."]},{"교":"정보","c":"12소생04-02","과":"소프트웨어와 생활","학":"고2~3","영":"모의 실험하는 소프트웨어","p":"다양한 시뮬레이션 프로그램의 활용 분야를 탐색하고 활용 방안을 구상한다.","h":["예측, 실험, 게임 등 다양한 분야에서 시뮬레이션 프로그램이 활용된 목적과 방법을 바탕으로 구현하려는 시뮬레이션의 화면 및 기능을 계획할 수 있어야 한다."]},{"교":"정보","c":"12소생04-03","과":"소프트웨어와 생활","학":"고2~3","영":"모의 실험하는 소프트웨어","p":"시뮬레이션 프로그램 구성 방법에 따라 복잡한 문제나 현상의 원리를 시뮬레이션 모델로 표현한다."},{"교":"정보","c":"12소생04-04","과":"소프트웨어와 생활","학":"고2~3","영":"모의 실험하는 소프트웨어","p":"소프트웨어를 적극적으로 활용하여 시뮬레이션 모델을 구현한다."},{"교":"정보","c":"12소생05-01","과":"소프트웨어와 생활","학":"고2~3","영":"가치를 창출하는 소프트웨어","p":"소프트웨어 스타트업의 개념을 이해하고 새로운 가치를 창출하는 소프트웨어 스타트업 사례를 분석한다.","h":["창업과 스타트업의 차이를 파악하고 소프트웨어 스타트업의 성공 사례와 실패 사례를 바탕으로 스타트업 프로젝트 기획 방법, 스타트업 운영 시 고려 사항 등을 분석할 수 있어야 한다."]},{"교":"정보","c":"12소생05-02","과":"소프트웨어와 생활","학":"고2~3","영":"가치를 창출하는 소프트웨어","p":"소프트웨어 스타트업 프로젝트의 수행 과정을 이해하고, 사용자 요구를 분석하여 소프트웨어 스타트업 아이디어를 구안한다.","h":["사용자 요구 분석을 통한 주제 선정, 해결 아이디어 구안, 소프트웨어 설계 및 제작, 소프트웨어 평가의 절차로 수행되는 소프트웨어 스타트업 프로젝트의 수행 과정을 이해하고 적용할 수 있어야 한다."]},{"교":"정보","c":"12소생05-03","과":"소프트웨어와 생활","학":"고2~3","영":"가치를 창출하는 소프트웨어","p":"스타트업 프로젝트에 적합한 소프트웨어를 협력적으로 설계하고 구현한다."},{"교":"정보","c":"12소생05-04","과":"소프트웨어와 생활","학":"고2~3","영":"가치를 창출하는 소프트웨어","p":"개발한 소프트웨어의 가치를 사회적, 기능적, 윤리적 관점에서 평가한다."},{"교":"체육","c":"4체01-01","과":"체육","학":"초3~4","영":"운동","p":"운동과 체력의 의미를 이해하고 관계를 파악한다.","h":["은 운동이 신체 변화와 체력 증진에 미치는 영향을 이해하기 위해 설정하였다. 운동과 체력의 의미를 이해하고 운동 전후의 신체 및 체력의 변화와 특성을 파악하여 운동의 중요성을 인식하도록 한다."]},{"교":"체육","c":"4체01-02","과":"체육","학":"초3~4","영":"운동","p":"기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.","h":["는 체력 증진을 위한 기본 운동 방법과 절차를 체험하며 자신의 신체 특성과 체력 수준에 맞게 운동하기 위해 설정하였다. 준비 운동, 본 운동, 정리 운동의 단계별 목적과 주안점을 파악하면서 운동 방법과 절차를 익히고, 자신의 신체 특성과 체력 수준에 적합한 운동을 선택하여 안전하게 시도하도록 한다."]},{"교":"체육","c":"4체01-03","과":"체육","학":"초3~4","영":"운동","p":"운동과 건강의 의미를 이해하고 관계를 파악한다.","h":["은 운동과 건강의 관계를 이해하기 위해 설정하였다. 건강의 의미와 운동이 건강을 유지, 증진하는 데 미치는 영향을 탐색하고 운동의 필요성을 파악하도록 한다."]},{"교":"체육","c":"4체01-04","과":"체육","학":"초3~4","영":"운동","p":"건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.","h":["는 건강을 유지하는 바른 생활 습관을 이해하고 일상생활에서 적극적으로 실천하는 습관을 기르기 위해 설정하였다. 건강한 생활 습관이 신체적 건강뿐만 아니라 정신적, 사회적 건강에도 영향을 미친다는 점을 이해하고, 건강 증진을 위한 생활 태도와 행동을 가정, 학교, 지역사회에서 규칙적으로 실천하도록 한다."]},{"교":"체육","c":"4체01-05","과":"체육","학":"초3~4","영":"운동","p":"자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다.","h":["는 기본 체력운동을 통해 자신에게 적합한 운동 계획을 세우고 실천하기 위해 설정하였다. 체격, 체형, 체력 등 개인마다 다른 신체 특성을 긍정적으로 인식하고 자신의 신체 특성에 맞는 운동을 안전하고 효과적으로 수행하도록 한다."]},{"교":"체육","c":"4체01-06","과":"체육","학":"초3~4","영":"운동","p":"운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","h":["은 운동을 통한 건강한 생활 습관 형성의 의지를 기르기 위해 설정하였다. 자신의 운동 및 생활 습관을 점검해 보고, 건강 유지, 증진의 저해 요인을 삼가며, 적절한 운동과 바람직한 생활 태도에 관심을 갖고 적극적으로 실천할 수 있는 의지를 갖도록 한다."]},{"교":"체육","c":"4체02-01","과":"체육","학":"초3~4","영":"스포츠","p":"스포츠의 의미와 유형을 파악한다.","h":["은 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 일정한 규칙과 방법에 따라 경기 기술을 수행하고 환경과의 상호작용을 통해 발달한 스포츠의 개념과 기술형, 전략형, 생태형 스포츠의 유형별 특성을 이해하도록 한다."]},{"교":"체육","c":"4체02-02","과":"체육","학":"초3~4","영":"스포츠","p":"기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","h":["는 기본 움직임 기술의 의미, 종류(이동 움직임, 비이동 움직임, 조작 움직임)와 특성을 파악하기 위해 설정하였다. 기본 움직임 기술의 종류를 다양하게 탐색하면서 스포츠 활동에 기초가 되는 기본 움직임 기술의 특성과 스포츠 활동 수행과의 관계를 파악하도록 한다."]},{"교":"체육","c":"4체02-03","과":"체육","학":"초3~4","영":"스포츠","p":"움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다.","h":["은 움직임 요소의 의미를 이해하고, 기본 움직임 기술을 다양한 상황에서 시도하기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 단계적으로 익히고, 움직임 요소(신체, 노력, 공간, 관계)에 변화를 주어 안전하고 효과적으로 기본 움직임 기술을 수행하도록 한다."]},{"교":"체육","c":"4체02-04","과":"체육","학":"초3~4","영":"스포츠","p":"기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다.","h":["는 기본 움직임 기술을 연결하여 다양하고 복합적인 움직임 기술을 수행하기 위해 설정하였다. 움직임 기술의 종류별(이동 움직임 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 움직임 기술의 치기와 이동 움직임 기술의 달리기의 연결 등)에 기본 움직임을 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 익히고, 간단한 게임 상황에서 시도하도록 한다."]},{"교":"체육","c":"4체02-05","과":"체육","학":"초3~4","영":"스포츠","p":"기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","h":["는 기술형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술의 수월성을 겨루는 기술형 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)을 익히고, 간단한 게임 상황에서 시도하도록 한다."]},{"교":"체육","c":"4체02-06","과":"체육","학":"초3~4","영":"스포츠","p":"전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","h":["은 전략형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술과 전략에 따라 승패가 결정되는 전략형 스포츠 활동의 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(공던지기와 잡기, 공몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)을 익히고, 기본적인 전략을 세워 간단한 게임 상황에서 시도하도록 한다."]},{"교":"체육","c":"4체02-07","과":"체육","학":"초3~4","영":"스포츠","p":"생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","h":["은 생태형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 생활 주변과 자연환경에서 이루어지는 다양한 생태형 스포츠 활동과 관련된 움직임 기술의 수행 방법(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)을 익히고, 간단한 활동 상황에서 안전하게 시도하도록 한다."]},{"교":"체육","c":"4체02-08","과":"체육","학":"초3~4","영":"스포츠","p":"움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다.","h":["은 기본 움직임 기술의 지속적인 시도를 통해 움직임 기술 수행에 대한 자신감을 기르기 위해 설정하였다. 기본 움직임 기술을 체계적으로 숙달하고, 간단한 규칙을 적용한 활동 상황에서 적극적으로 시도하며 움직임 기술 수행에 대한 자신감을 갖도록 한다."]},{"교":"체육","c":"4체02-09","과":"체육","학":"초3~4","영":"스포츠","p":"게임 활동에 최선을 다하고 규칙을 지킨다.","h":["는 게임 활동을 수행하며 정해진 규칙을 지키고 최선을 다하는 태도를 기르기 위해 설정하였다. 다양한 유형의 스포츠 활동에 임하는 마음가짐, 구성원에 대한 태도, 규칙 준수의 필요성, 최선의 가치 등을 실제 활동 과정에서 느끼고 실천하도록 한다."]},{"교":"체육","c":"4체02-10","과":"체육","학":"초3~4","영":"스포츠","p":"다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여한다.","h":["은 스포츠 활동을 즐길 수 있는 환경에 개방적인 태도를 갖고 적극적이고 안전하게 활동하는 태도를 기르기 위해 설정하였다. 가정, 학교, 지역사회 체육 시설, 자연환경 등 다양하고 도전적인 스포츠 환경을 적극적으로 수용하고 활용하되, 안전 수칙을 숙지하여 안전사고를 예방하는 태도를 실천하도록 한다."]},{"교":"체육","c":"4체03-01","과":"체육","학":"초3~4","영":"표현","p":"표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다.","h":["은 표현 활동의 의미, 표현 활동과 기본 움직임 기술과의 관계를 이해하기 위해 설정하였다. 표현 활동에서의 움직임 기술과 운동 및 스포츠 영역에서의 움직임 기술의 차이를 이해함으로써 표현 활동에서 움직임 기술의 창의적이고 심미적인 특성을 이해하도록 한다."]},{"교":"체육","c":"4체03-02","과":"체육","학":"초3~4","영":"표현","p":"움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다.","h":["는 움직임 요소에 따른 다양한 기본 움직임 기술을 학습함으로써 표현 활동의 기본 수행 능력을 기르기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 체험하되 신체, 노력, 공간, 관계 등 움직임 요소의 변화에 따라 기본 움직임 기술을 창의적이고 심미적으로 표현하도록 한다."]},{"교":"체육","c":"4체03-03","과":"체육","학":"초3~4","영":"표현","p":"기본 움직임 기술을 활용하여 사물이나 자연을 모방하여 표현한다.","h":["은 기본 움직임 기술을 활용한 모방 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 사물, 인물, 자연 현상 등의 모양과 움직임을 모방하여 표현하는 방법을 탐색하고 그 특징을 살려 표현하도록 한다."]},{"교":"체육","c":"4체03-04","과":"체육","학":"초3~4","영":"표현","p":"기본 움직임 기술을 활용하여 느낌이나 생각을 표현한다.","h":["는 기본 움직임 기술을 활용한 추상 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 느낌과 생각 등을 동작으로 표현하는 방법을 탐색하고 창의적으로 표현하도록 한다."]},{"교":"체육","c":"4체03-05","과":"체육","학":"초3~4","영":"표현","p":"기본 움직임 기술을 리듬에 맞춰 표현한다.","h":["는 기본 움직임 기술을 활용한 리듬 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 박자, 강약, 빠르기, 패턴에 맞춰 표현하는 방법을 탐색하고 리듬감을 살려 표현하도록 한다."]},{"교":"체육","c":"4체03-06","과":"체육","학":"초3~4","영":"표현","p":"기본 움직임 기술을 도구를 활용하여 표현한다.","h":["은 기본 움직임 기술을 활용한 도구 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 줄, 공, 천, 훌라후프 등 도구의 특성을 활용한 표현 방법을 탐색하고 도구의 조작과 움직임을 연결하여 표현하도록 한다."]},{"교":"체육","c":"4체03-07","과":"체육","학":"초3~4","영":"표현","p":"움직임의 심미적 표현에 대한 호기심과 감수성을 나타낸다.","h":["은 움직임을 심미적으로 표현하는 것에 대한 호기심과 감수성을 갖도록 설정하였다. 기본 움직임 기술을 아름답게 표현하며 움직임을 심미적으로 표현하는 다양한 자극에 관심을 갖고 운동이나 스포츠 기술과는 다른 감성을 느낄 수 있도록 한다."]},{"교":"체육","c":"6체01-01","과":"체육","학":"초5~6","영":"운동","p":"건강 체력과 운동 체력의 의미와 요소를 파악하고 다양한 운동 방법을 탐색한다.","h":["은 3, 4학년군에서 학습한 기본 운동 방법을 체력 요소별로 구분하여 이해하고 체력 요소별로 다양한 운동 방법을 탐색하기 위해 설정하였다. 체력을 건강 체력과 운동 체력으로 구분하고, 유형별 체력 요소를 이해하며, 학습자 스스로 자신의 수준에 적합한 체력 요소별 운동 방법을 찾도록 한다."]},{"교":"체육","c":"6체01-02","과":"체육","학":"초5~6","영":"운동","p":"건강 체력과 운동 체력을 측정하고 자신의 체력 수준에 맞는 운동을 시도한다.","h":["는 자신의 건강 체력과 운동 체력 수준을 파악하여 체력을 증진할 수 있는 다양한 운동 방법을 선택하고 실천하기 위해 설정하였다. 자신의 우수한 체력과 부족한 체력이 무엇인지를 파악하고, 특히 부족한 체력을 기르기 위해 체력 수준에 적합한 운동 방법을 탐색하여 꾸준하게 실천하도록 한다."]},{"교":"체육","c":"6체01-03","과":"체육","학":"초5~6","영":"운동","p":"성장 발달의 의미와 특성을 이해하고 운동과의 관계를 파악한다.","h":["은 자신의 성장 발달을 이해하고, 운동이 성장 발달에 미치는 긍정적인 영향을 이해하기 위해 설정하였다. 성장에 따른 신체적, 정서적 변화, 특히 제2차 성징에 대한 이해를 바탕으로 자신의 성장 발달 양상을 긍정적으로 파악하고, 사춘기에 운동이 신체적, 정서적, 사회적 성장 발달에 바람직한 영향을 미친다는 점을 이해하도록 한다."]},{"교":"체육","c":"6체01-04","과":"체육","학":"초5~6","영":"운동","p":"운동 및 생활 속 위험 상황, 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 예방 및 대처 방법을 익혀 안전하게 활동한다.","h":["는 운동과 일상생활에서 발생할 수 있는 다양한 안전사고의 유형과 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 침착하게 대처하기 위해 설정하였다. 운동 시설이나 용⋅기구, 지상⋅수상⋅빙상 등의 다양한 운동 환경에서 발생할 수 있는 안전사고, 건강한 성장 발달에 부정적인 생활 습관(흡연, 음주, 약물 오⋅남용 등), 안전을 위협하는 생활 및 자연 환경을 탐색하며 건강하고 안전한 생활 습관을 실천하도록 한다."]},{"교":"체육","c":"6체01-05","과":"체육","학":"초5~6","영":"운동","p":"체력 운동을 끈기 있게 규칙적으로 수행한다.","h":["는 체력 증진에 필요한 끈기와 근면성을 기르기 위해 설정하였다. 단기간에 증진되기 어려운 체력 운동의 특성상, 학습자가 운동 과정에서 쉽게 포기하지 않도록 체력 증진을 저해하는 개인적, 환경적 조건을 탐색하고 극복하면서 체력 운동을 규칙적으로 수행하도록 한다."]},{"교":"체육","c":"6체01-06","과":"체육","학":"초5~6","영":"운동","p":"성장과 발달 과정에서 나타나는 신체적, 정서적, 사회적 특성과 차이를 공감하고 위험 상황에 침착하게 대처한다.","h":["은 성장과 발달 과정에서 개인별 차이를 공감하며, 안전을 위협하는 위험 상황에 대처하기 위해 설정하였다. 자신의 신체적, 정서적, 사회적 건강 특성이 다른 사람과 어떤 차이가 있고, 그러한 차이를 공감하는 것이 자신과 공동체에 어떤 영향을 미치는지를 실제 사례를 통해 이해하도록 한다."]},{"교":"체육","c":"6체02-01","과":"체육","학":"초5~6","영":"스포츠","p":"기술형 스포츠의 의미와 유형을 파악한다.","h":["은 기술형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 기술의 수월성을 추구하는 기술형 스포츠의 의미를 이해하고 다양한 환경(지상, 수상, 빙상 등)에서의 움직임 기록 향상을 위한 기록형, 일련의 절차와 방법이 정해진 움직임을 정확하게 수행하는 동작형, 상대방의 신체적 기량과 겨루는 투기형으로 구분하여 유형별 움직임의 세부 특성을 파악하도록 한다."]},{"교":"체육","c":"6체02-02","과":"체육","학":"초5~6","영":"스포츠","p":"기술형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","h":["는 기록형, 동작형, 투기형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 속도와 거리, 정확성에 도전하는 기록형 스포츠의 기본 기능(도움닫기 하여 멀리뛰기, 목표물에 정확히 던지기 등), 절차와 방법이 정해진 움직임을 수행하는 동작형 스포츠의 기본 기능(손 짚고 옆돌기, 다리 벌려 뛰어넘기 등), 상대방과 신체적 기술을 겨루는 투기형 스포츠의 기본 기능(발차기, 다리 걸기 등)을 게임 상황에 맞게 효율적으로 수행하도록 한다."]},{"교":"체육","c":"6체02-03","과":"체육","학":"초5~6","영":"스포츠","p":"기술형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","h":["은 기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 기록형, 동작형, 투기형 스포츠를 변형한 게임 활동의 경기 방법을 이해하고, 기록 측정과 분석, 동작 수행의 점검과 분석, 자신과 상대의 기량 확인과 분석 등 기술형 스포츠의 기본 전략을 파악하고 수행하도록 한다."]},{"교":"체육","c":"6체02-04","과":"체육","학":"초5~6","영":"스포츠","p":"전략형 스포츠의 의미와 유형을 파악한다.","h":["는 전략형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 움직임 기능 수행 능력과 전략에 따라 승패가 결정되는 전략형 스포츠의 의미를 이해하고 스포츠의 유형을 상대 영역으로 이동하여 정해진 지점으로 공을 보내 득점하는 영역형, 동일 공간에서 공격과 수비를 번갈아 하며 정해진 구역을 돌아 점수를 얻는 필드형, 네트 너머에 있는 상대 영역에 공을 보내 넘기지 못하게 하여 득점하는 네트형으로 구분하여 각각의 세부 특성을 파악하도록 한다."]},{"교":"체육","c":"6체02-05","과":"체육","학":"초5~6","영":"스포츠","p":"전략형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","h":["는 영역형, 필드형, 네트형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 패스, 드리블, 슛 등과 같은 영역형 스포츠의 기본 기능, 포구, 송구, 타격, 주루 등과 같은 필드형 스포츠의 기본 기능, 서브, 리시브, 토스, 스트로크(스매싱) 등과 같은 네트형 스포츠의 기본 기능을 변형게임이나 뉴스포츠 수준의 게임 상황에 맞게 효율적으로 수행하도록 한다."]},{"교":"체육","c":"6체02-06","과":"체육","학":"초5~6","영":"스포츠","p":"전략형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","h":["은 영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 영역형, 필드형, 네트형 스포츠를 변형한 게임이나 뉴스포츠와 같은 게임 활동에 참여하며 경기 방법을 파악하고, 공간 만들기, 공간 차단하기, 골 넣기와 막기, 빈 곳으로 공 치기, 구역과 역할 나누어 수비하기, 빈 곳으로 공 넘기기, 유기적으로 역할 분담하기 등 전략형 스포츠의 기본 전략을 파악하고 수행하도록 한다."]},{"교":"체육","c":"6체02-07","과":"체육","학":"초5~6","영":"스포츠","p":"생태형 스포츠의 의미와 유형을 파악한다.","h":["은 생태형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 다양한 환경 맥락에 따라 활동 특성이 나타나는 생태형 스포츠의 의미에 관한 이해를 바탕으로 생활 주변의 환경을 이용하여 활동하는 생활환경형, 자연환경과 상호작용하며 활동하는 자연환경형으로 구분하여 유형별 세부 특성을 파악하도록 한다."]},{"교":"체육","c":"6체02-08","과":"체육","학":"초5~6","영":"스포츠","p":"생태형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","h":["은 생활환경형, 자연환경형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 주변 생활환경에서 할 수 있는 골프형 게임, 디스크형 게임, 자전거 타기, 롤러스케이팅, 클라이밍 활동, 민속놀이 등과 자연환경에서 체험할 수 있는 등산 활동, 캠핑 활동, 수상 활동, 설상 활동 등 생태형 스포츠의 기본 기능을 익혀 주변의 다양한 활동 상황에 맞게 환경친화적으로 수행하도록 한다."]},{"교":"체육","c":"6체02-09","과":"체육","학":"초5~6","영":"스포츠","p":"생태형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","h":["는 생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 생활환경형, 자연환경형 스포츠를 변형한 게임이나 뉴스포츠 수준의 활동에 참여하며 활동 방법을 파악하고 스포츠 환경에 적합한 활동의 선정과 장비 사용, 안전하고 환경친화적인 활동과 정리 등 생태형 스포츠의 기본 활동 방법과 전략을 파악하고 수행하도록 한다."]},{"교":"체육","c":"6체02-10","과":"체육","학":"초5~6","영":"스포츠","p":"스포츠 활동에 참여하며 목표를 달성하기 위한 의지를 실천하고 상대의 기술을 인정한다.","h":["은 스포츠 활동에 참여하며 목표 달성을 위한 의지와 상대 기술을 인정하는 태도를 기르기 위해 설정하였다. 스스로 목표를 설정하고 책임감 있게 꾸준히 실천하도록 하며, 함께 참여하는 상대 팀과 구성원의 우수한 기술을 인정하고 배우는 태도를 실천하도록 한다."]},{"교":"체육","c":"6체02-11","과":"체육","학":"초5~6","영":"스포츠","p":"스포츠 활동에 참여하며 팀원과 협력하고 구성원을 배려한다.","h":["은 스포츠에 참여하며 팀원과 협력하고 구성원을 배려하는 태도를 기르기 위해 설정하였다. 민주적인 의사결정을 통해 역할을 분담하고 전략을 수립하는 등 팀원과의 협력을 강조하며, 기능 수행에 어려움을 겪는 학습자를 도와주고 배려함으로써 팀의 활동 성과를 공유하도록 한다."]},{"교":"체육","c":"6체02-12","과":"체육","학":"초5~6","영":"스포츠","p":"스포츠 활동에 참여하며 환경을 아끼고 감사하는 태도를 실천한다.","h":["는 스포츠 활동 환경을 아끼고 감사하는 태도를 기르기 위해 설정하였다. 주변의 다양한 스포츠 시설 및 용⋅기구 현황을 탐색하고 이를 적극적으로 활용하면서 학교 및 지역사회가 제공하는 스포츠 복지의 중요성을 이해하도록 한다. 또한 스포츠 환경을 아끼고 보존함으로써 지속해서 혜택을 누릴 수 있다는 점에 감사함을 느낄 수 있도록 한다."]},{"교":"체육","c":"6체03-01","과":"체육","학":"초5~6","영":"표현","p":"표현 활동의 의미와 유형을 파악한다.","h":["은 표현 활동 의미와 유형을 이해하기 위해 설정하였다. 스포츠에서 신체 움직임의 심미성을 다루는 스포츠 표현, 민족의 고유한 전통을 신체 움직임으로 표현한 전통 표현, 자유로운 형식으로 움직임을 표현하는 현대 표현의 유형별로 다양한 작품을 직⋅간접적으로 체험함으로써 기본 동작과 구성 방법의 공통점과 차이점을 중심으로 특징을 파악하도록 한다."]},{"교":"체육","c":"6체03-02","과":"체육","학":"초5~6","영":"표현","p":"스포츠 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","h":["는 스포츠 표현의 기본 움직임 기술과 응용 동작을 탐색하고 심미적으로 표현하기 위해 설정하였다. 신체활동의 예술적 아름다움을 추구하는 스포츠 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 심미적으로 표현하도록 한다."]},{"교":"체육","c":"6체03-03","과":"체육","학":"초5~6","영":"표현","p":"스포츠 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","h":["은 스포츠 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 스포츠 표현에 적합한 움직임 기술의 응용 동작을 창의적으로 구성하고, 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작의 심미성을 감상하도록 한다."]},{"교":"체육","c":"6체03-04","과":"체육","학":"초5~6","영":"표현","p":"전통 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","h":["는 우리나라와 세계 여러 민족과 지역에서 전해 내려오는 전통 표현에서 기본 움직임 기술을 응용한 동작의 문화적 특징을 파악하고 그 특성을 살려 표현하기 위해 설정하였다. 전통 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 문화적 특색이 드러나게 표현하도록 한다."]},{"교":"체육","c":"6체03-05","과":"체육","학":"초5~6","영":"표현","p":"전통 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","h":["는 전통 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 다양한 전통 표현에 담긴 역사와 특성을 이해하고 전통 표현의 움직임 기술 응용 동작을 문화적 특성에 따라 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작이 갖는 전통적 의미를 감상하도록 한다."]},{"교":"체육","c":"6체03-06","과":"체육","학":"초5~6","영":"표현","p":"현대 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","h":["은 현대 표현에서 기본 움직임 기술을 응용한 동작의 자유로움이 갖는 특징을 파악하고 창의적으로 표현하기 위해 설정하였다. 기본 동작에 적합한 움직임 기술 응용 동작을 기존의 표현 방법이나 틀에 얽매이지 않고 자유롭고 창의적으로 표현하도록 한다."]},{"교":"체육","c":"6체03-07","과":"체육","학":"초5~6","영":"표현","p":"현대 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","h":["은 현대 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 현대 표현에 적합한 움직임 기술의 응용 동작을 표현의 주제와 자유로운 흐름을 고려하여 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도를 현대 사회의 문화적 특징과 비교하며 감상하도록 한다."]},{"교":"체육","c":"6체03-08","과":"체육","학":"초5~6","영":"표현","p":"다양한 표현 활동 유형을 수용하고, 움직임 표현의 아름다움을 추구한다.","h":["은 다양한 표현 활동 유형을 긍정적으로 수용하고 움직임 표현의 아름다움을 추구하도록 설정하였다. 다양한 표현 유형에 담긴 의미와 표현 특성을 직⋅간접적으로 탐색하며 표현 문화에 대한 이해의 폭을 확장하고 움직임 표현의 아름다움을 추구하도록 한다."]},{"교":"체육","c":"9체01-01","과":"체육","학":"중1~3","영":"운동","p":"체력 증진의 의미를 이해하고 원리를 분석한다.","h":["은 체력 증진의 의미와 원리를 이해함으로써 효과적으로 체력 운동을 계획하기 위해 설정하였다. 체력 증진에 작용하는 과부하의 원리, 개별성의 원리, 점진성의 원리 등의 개념을 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-02","과":"체육","학":"중1~3","영":"운동","p":"자신의 체력 수준에 맞는 체력 증진 운동을 실천한다.","h":["는 체력 증진 원리에 따라 체력 요소별 운동 방법을 자신의 체력 수준에 적합하게 실천하기 위해 설정하였다. 체력 요소별로 심화된 수준의 체력 운동 방법을 이해하고 실천하도록 한다."]},{"교":"체육","c":"9체01-03","과":"체육","학":"중1~3","영":"운동","p":"체력 관리의 의미를 이해하고 원리를 분석한다.","h":["은 체력 관리의 의미와 원리를 이해함으로써 효과적으로 자신의 체력 관리 방법을 계획하기 위해 설정하였다. 일상생활에서 체력을 유지하거나 증진하는데 필요한 주 단위의 유산소성 운동, 유연성 운동, 근력 및 근지구력 운동, 좌식 생활 최소화 등 체력 관리의 기본 원리를 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-04","과":"체육","학":"중1~3","영":"운동","p":"자신의 체력을 진단하고 적합한 체력 관리 방법을 실천한다.","h":["는 일상생활에서 체력 관리 원리에 따라 체력 운동을 실천하기 위해 설정하였다. 일상생활에서 스스로 체력을 진단한 후 계획, 실행, 평가의 절차에 따라 체력 관리에 필요한 운동을 습관화하도록 한다."]},{"교":"체육","c":"9체01-05","과":"체육","학":"중1~3","영":"운동","p":"운동 처방의 의미를 이해하고 원리를 분석한다.","h":["는 운동 처방의 의미와 구성 요소를 이해함으로써 체력 증진 목표와 수준에 따라 맞춤형 운동 처방을 계획하기 위해 설정하였다. 운동 빈도, 운동 강도, 운동 시간, 운동 형태 등의 요소를 이해하고 각 요소가 운동 처방에 어떻게 활용되는지를 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-06","과":"체육","학":"중1~3","영":"운동","p":"자신의 신체 조건이나 체력에 맞게 운동 처방 계획을 수립하고 안전하게 실천한다.","h":["은 운동 처방 원리에 따라 자신의 신체 조건이나 체력에 맞는 맞춤형 운동 처방을 실천하기 위해 설정하였다. 자신의 체격과 체력 발달 수준 검사, 운동 처방 목적 등을 고려하여 내용 설계, 실행, 평가 단계에 맞춰 운동 처방 프로그램을 안전하게 실천하도록 한다."]},{"교":"체육","c":"9체01-07","과":"체육","학":"중1~3","영":"운동","p":"신체 건강의 의미를 이해하고 신체 건강 활동의 종류와 특성을 분석한다.","h":["은 신체 건강을 유지하기 위한 활동을 이해함으로써 신체적으로 건강한 생활을 계획하기 위해 설정하였다. 운동 습관, 식이 관리, 약물과 기호품 관리, 질병 예방 등 신체 건강에 영향을 미치는 다양한 활동과 실천 방법, 효과 등을 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-08","과":"체육","학":"중1~3","영":"운동","p":"자신에게 적합한 신체 건강 활동 방법을 실천한다.","h":["은 자신에게 필요한 신체 건강 활동을 실천하기 위해 설정하였다. 걷기, 스트레칭 등의 운동, 바른 자세, 올바른 식생활 및 기호품 관리, 약물 오남용 예방, 질병 예방 활동 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다."]},{"교":"체육","c":"9체01-09","과":"체육","학":"중1~3","영":"운동","p":"정신 건강의 의미를 이해하고 정신 건강 활동의 종류와 특성을 분석한다.","h":["는 정신 건강을 유지하기 위한 활동을 이해함으로써 정서적, 심리적으로 건강한 생활을 계획하기 위해 설정하였다. 스트레스 및 감정 조절 등 정신 건강에 영향을 미치는 다양한 활동과 실천 방법 및 효과 등을 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-10","과":"체육","학":"중1~3","영":"운동","p":"자신에게 적합한 정신 건강 활동 방법을 실천한다.","h":["은 자신에게 필요한 정신 건강 활동을 실천하기 위해 설정하였다. 호흡법, 근육 이완법, 요가, 필라테스 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다."]},{"교":"체육","c":"9체01-11","과":"체육","학":"중1~3","영":"운동","p":"사회적 건강의 의미를 이해하고 사회적 건강을 위한 활동의 종류와 특성을 분석한다.","h":["은 사회적 건강을 유지하기 위한 활동을 이해함으로써 사회 구성원으로서 건강하고 안전한 생활을 계획하기 위해 설정하였다. 양성평등 및 성 건강, 생활 안전 등 가정, 학교, 지역사회 공동체에서 자신과 타인, 집단의 건강한 생활에 필요한 방법을 이해하고 분석하도록 한다."]},{"교":"체육","c":"9체01-12","과":"체육","학":"중1~3","영":"운동","p":"사회적으로 적합한 건강 활동 방법을 실천한다.","h":["는 사회 구성원에게 필요한 건강 활동을 실천하기 위해 설정하였다. 양성평등 및 성 건강 관련 활동, 생활 안전 활동, 재난⋅재해 예방 및 대처 활동, 응급처치 활동 등을 일상생활에서 지속해서 실천하며 긍정적인 사회적 관계를 형성해 나가도록 한다."]},{"교":"체육","c":"9체01-13","과":"체육","학":"중1~3","영":"운동","p":"체력 운동을 하며 실천 의지와 인내심을 보이고 자기 주도적으로 문제를 해결한다.","h":["은 체력 운동을 지속해서 실천하기 위해 설정하였다. 체력 운동 과정에서 발생할 수 있는 시간적, 공간적 제약과 개인의 의지 등의 문제를 이겨내고 목표와 활동 방법을 주어진 환경에 맞게 수정하여 자기 주도적으로 활동을 지속하도록 한다."]},{"교":"체육","c":"9체01-14","과":"체육","학":"중1~3","영":"운동","p":"건강 활동을 자율적으로 실천하며 자신과 공동체에 대한 안전을 추구한다.","h":["는 건강 활동을 자율적으로 실천하는 능력을 기르기 위해 설정하였다. 자신의 건강뿐만 아니라 타인과의 관계, 사회 전체의 건강한 환경 조성을 위한 바람직한 태도를 실천하도록 한다. 개인의 자율성과 주도성을 바탕으로 공동체의 건강을 위해 타인과 함께 건강하고 안전한 환경을 조성하는 일에 적극적으로 참여하도록 한다."]},{"교":"체육","c":"9체02-01","과":"체육","학":"중1~3","영":"스포츠","p":"동작형 스포츠의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체02-02","과":"체육","학":"중1~3","영":"스포츠","p":"동작형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다."},{"교":"체육","c":"9체02-03","과":"체육","학":"중1~3","영":"스포츠","p":"동작형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","h":["은 동작형 스포츠의 경기 방법을 이해하고, 자신과 팀의 경기 능력, 시설 및 용⋅기구 등을 파악하여 경기 상황에 맞게 경기 전략을 활용하기 위해 설정하였다. 동작형 스포츠 경기를 수행하며 동작의 완성도에 중점을 두고, 경기 과정에서 공중 동작, 착지 중 낙상 등 운동으로 인한 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다."]},{"교":"체육","c":"9체02-04","과":"체육","학":"중1~3","영":"스포츠","p":"기록형 스포츠의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체02-05","과":"체육", 9체02-16","과":"체육","학":"중1~3","영":"스포츠","p":"네트형 스포츠의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체02-17","과":"체육","학":"중1~3","영":"스포츠","p":"네트형 스포츠의 수행 원리를 적용하여 경기 기능을 수행하고 향상한다."},{"교":"체육","c":"9체02-18","과":"체육","학":"중1~3","영":"스포츠","p":"네트형 스포츠의 경기 방법을 이해하고 경기 전략을 활용하며 안전하게 경기한다.","h":["은 네트형 스포츠의 경기 방법을 이해하고, 단식과 복식, 공격 및 수비 전환 시기 등의 경기 전략을 상황에 맞게 선택하여, 경기 상황에서 상대가 공을 받아넘기지 못하는 경기 전략을 활용하기 위해 설정하였다. 네트형 스포츠 경기를 수행하며 팀원과 호흡하여 공격과 수비를 빠르게 전환하는 데 중점을 두며, 경기 과정에서 구성원이나 용⋅기구와의 충돌, 점프와 착지 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다."]},{"교":"체육","c":"9체02-19","과":"체육","학":"중1~3","영":"스포츠","p":"생활환경형 스포츠의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체02-20","과":"체육","학":"중1~3","영":"스포츠","p":"생활환경형 스포츠의 수행 원리를 적용하여 기능을 수행하고 향상한다."},{"교":"체육","c":"9체02-21","과":"체육","학":"중1~3","영":"스포츠","p":"생활환경형 스포츠의 활동 방법을 이해하고 활동 전략을 활용하며 안전하게 경기한다.","h":["은 생활환경형 스포츠의 활동 방법을 이해하고 활동 상황에서 생활환경 조건을 고려한 활동 전략을 활용하기 위해 설정하였다. 가정, 집 주변, 지역사회 등의 생활환경에서 활동하며 공간, 시설 등의 환경 조건을 파악하는 데 중점을 둔다. 생활환경형 스포츠 실천 과정에서 물리적 환경에 대한 부적응, 환경의 불안정성 등으로 인한 운동 손상 없이 안전하게 활동하며 사고 발생 시 신속하게 대처하도록 한다."]},{"교":"체육","c":"9체02-22","과":"체육","학":"중1~3","영":"스포츠","p":"자연환경형 스포츠의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체02-23","과":"체육","학":"중1~3","영":"스포츠","p":"자연환경형 스포츠의 수행 원리를 적용하여 기능을 수행하고 향상한다."},{"교":"체육","c":"9체02-24","과":"체육","학":"중1~3","영":"스포츠","p":"자연환경형 스포츠의 활동 방법을 이해하고 활동 전략을 활용하며 안전하게 경기한다.","h":["는 자연환경형 스포츠의 활동 방법을 이해하고 활동 상황에서 자연환경과 생태 문화를 고려한 활동 전략을 활용하기 위해 설정하였다. 산, 강이나 바다, 하늘 등의 자연환경에서 활동하며 날씨, 장비 등의 환경 조건을 파악하는 데 중점을 둔다. 자연환경형 스포츠 실천 과정에서 기후나 자연환경의 변화, 용⋅기구의 불안정성 등으로 인한 운동 손상 없이 안전하게 활동하며 사고 발생 시 신속하게 대처하도록 한다."]},{"교":"체육","c":"9체02-25","과":"체육","학":"중1~3","영":"스포츠","p":"스포츠의 연습과 경기 과정에서 인내심을 발휘하여 적극적으로 도전한다.","h":["는 스포츠의 연습 및 경기 과정의 어려움을 극복함으로써 스포츠에 대한 도전 정신을 기르기 위해 설정하였다. 스포츠 유형별 기능의 연습 및 활동 과정에서 자신 혹은 공동으로 설정한 목표를 달성하기 위해 자기 주도적으로 참여하고 인내하며 한계를 극복하도록 한다."]},{"교":"체육","c":"9체02-26","과":"체육","학":"중1~3","영":"스포츠","p":"스포츠의 연습과 경기 과정에서 구성원 간에 서로 신뢰하며 팀 목표를 달성하기 위해 노력하고 경기 예절을 갖추며 정정당당하게 참여한다.","h":["은 스포츠의 연습 및 경기 과정에서 서로 믿고 정정당당하게 최선을 다하며 도전적인 태도를 기르기 위해 설정하였다. 구성원을 존중하고 팀의 공동 목표를 위해 끝까지 노력하며, 경기에 대한 열정을 갖고 상대와 심판, 관중 앞에서 공정하고 품위 있게 경기하도록 한다."]},{"교":"체육","c":"9체02-27","과":"체육","학":"중1~3","영":"스포츠","p":"스포츠 환경에 대한 친화적 태도와 지속가능한 스포츠 환경을 만들기 위한 공동체 의식을 발휘한다.","h":["은 스포츠 환경에 대한 생태전환적 태도를 기르기 위해 설정하였다. 스포츠의 연습 및 활동 과정에서 여러 환경 문제를 인식하고 구성원과 함께 개선하려는 공동체 의식을 보이며, 스포츠 환경에 대한 친화적인 태도로 활동하도록 한다."]},{"교":"체육","c":"9체03-01","과":"체육","학":"중1~3","영":"표현","p":"스포츠 표현의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체03-02","과":"체육","학":"중1~3","영":"표현","p":"스포츠 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","h":["스포츠 표현의 원리를 적용하여 역동적이고 아름답게 동작을 표현하고 향상하도록 한다."]},{"교":"체육","c":"9체03-03","과":"체육","학":"중1~3","영":"표현","p":"스포츠 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","h":["은 스포츠 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해 설정하였다. 심미적 표현을 강조하는 스포츠 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다."]},{"교":"체육","c":"9체03-04","과":"체육","학":"중1~3","영":"표현","p":"전통 표현의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체03-05","과":"체육","학":"중1~3","영":"표현","p":"전통 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","h":["는 전통 표현의 원리를 적용하여 동작을 표현하기 위해 설정하였다. 전통 표현의 원리를 적용하여 자연스럽고 아름답게 동작을 표현하고 향상하도록 한다."]},{"교":"체육","c":"9체03-06","과":"체육","학":"중1~3","영":"표현","p":"전통 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","h":["은 전통 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해 설정하였다. 전형적 표현을 강조하는 전통 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다."]},{"교":"체육","c":"9체03-07","과":"체육","학":"중1~3","영":"표현","p":"현대 표현의 역사와 특성을 탐색하고 비교한다."},{"교":"체육","c":"9체03-08","과":"체육","학":"중1~3","영":"표현","p":"현대 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","h":["은 현대 표현의 원리를 적용하여 동작을 표현하기 위해 설정하였다. 현대 표현의 원리를 적용하여 자유롭고 아름답게 동작을 표현하고 향상하도록 한다."]},{"교":"체육","c":"9체03-09","과":"체육","학":"중1~3","영":"표현","p":"현대 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","h":["는 현대 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해 설정하였다. 창조적 표현을 강조하는 현대 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다."]},{"교":"체육","c":"9체03-10","과":"체육","학":"중1~3","영":"표현","p":"움직임을 표현하고 창작하는 과정에서 독창적이고 개방적인 태도를 갖고 표현 활동 작품을 공감하고 비평한다.","h":["은 표현의 동작 수행, 창작, 감상의 전 과정을 통해 창의성과 비판적 능력을 기르기 위해 설정하였다. 동작 수행 및 창작 과정에서 독창성을 추구하고, 다양한 표현 문화를 수용하여, 작품 감상을 통해 예술적 표현에 대해 공감하고 비판적으로 바라보려는 태도를 함양하도록 한다."]},{"교":"체육","c":"12체육1-01-01","과":"체육1","학":"고2~3","영":"건강 관리","p":"신체활동이 건강에 영향을 미치는 기전과 효과를 탐구한다.","h":["은 신체활동이 신체에 긍정적인 변화를 미치는 과정과 원리를 과학적으로 이해하여 신체활동의 필요성을 인식하고, 자기 주도적 건강 관리에 필요한 신체활동을 구안하기 위해 설정하였다. 이를 위해 신체활동이 건강에 영향을 미치는 기전과 효과를 사회과학적, 자연과학적 측면에서 구체적으로 이해하도록 한다."]},{"교":"체육","c":"12체육1-01-02","과":"체육1","학":"고2~3","영":"건강 관리","p":"생애주기별 건강 관리 방법에 따라 건강을 체계적으로 관리하여 자아 존중감을 높인다.","h":["는 생애주기별 건강의 중요성을 이해하고 특히 청소년기 건강 관리에 필요한 다양한 지식을 습득하여 건강을 체계적으로 관리하기 위해 설정하였다. 이를 위해 청소년기에 필요한 질병 예방, 영양 균형, 약물 오남용 및 음주, 흡연 예방, 운동 등 건강 결정 요인과 신체활동을 폭넓게 이해하고 실천함으로써 자아 존중감을 갖도록 한다."]},{"교":"체육","c":"12체육1-01-03","과":"체육1","학":"고2~3","영":"건강 관리","p":"건강 관리 측면에서 고려해야 할 다양한 안전 요소를 이해하고, 안전사고에 적절하게 대처한다.","h":["질병 예방, 영양 균형, 약물 오남용 및 음주, 흡연 예방, 운동 등 건강 관리 활동과 생활 안전 방법을 구체적인 사례를 통해 이해하고, 안전사고 유형에 따른 안전사고 대처요령을 습득하도록 한다."]},{"교":"체육","c":"12체육1-02-01","과":"체육1","학":"고2~3","영":"전략형 스포츠","p":"전략형 스포츠 문화의 개념과 특성을 탐색한다.","h":["은 다양한 유형의 전략형 스포츠를 탐색하는 과정을 통해 전략형 스포츠 문화의 보편성과 특수성을 이해하기 위해 설정하였다. 이를 위해 물질문화(시설, 장비 등), 제도문화(규범, 기술체계 등), 관념문화(목표, 가치 등) 등 스포츠 경기 문화 측면에서 영역형, 필드형, 네트형 스포츠 문화를 비교⋅분석하도록 한다."]},{"교":"체육","c":"12체육1-02-02","과":"체육1","학":"고2~3","영":"전략형 스포츠","p":"전략형 스포츠의 경기 기능을 과학적 원리에 따라 분석하고, 적극적으로 개선한다.","h":["패스, 드리블, 슛 등 전략형 스포츠 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하고 이러한 원리를 바탕으로 경기 기능을 개선하도록 한다."]},{"교":"체육","c":"12체육1-02-03","과":"체육1","학":"고2~3","영":"전략형 스포츠","p":"전략형 스포츠의 경기 방법 및 전략을 이해하고, 경기 상황에 맞게 응용한다.","h":["은 전략형 스포츠의 경기 방법과 전략이 어떠한 맥락에서 형성되고 만들어졌는지 탐구하여 전략형 스포츠를 깊이 있게 이해하고 경기 상황에 적절하게 적용하기 위해 설정하였다. 이를 위해 영역형, 필드형, 네트형 스포츠 경기에서 직면하게 되는 다양한 문제 상황의 해결을 위한 경기 기능의 활용, 공을 가지고 있는 경우와 그렇지 않은 경우의 움직임, 공격과 수비 상황에서의 전략적 움직임 등을 이해하고 경기에 응용하도록 한다."]},{"교":"체육","c":"12체육1-03-01","과":"체육1","학":"고2~3","영":"생태형 스포츠","p":"생태형 스포츠 문화의 개념과 특성을 탐색하고, 스포츠 환경에 대한 생태 감수성을 실천한다.","h":["은 다양한 유형의 생태형 스포츠를 탐색하는 과정을 통해 생태형 스포츠 문화의 보편성과 특수성을 이해하고, 생태형 스포츠의 사회적 가치를 공유하며 실천하기 위해 설정하였다. 이를 위해 물질문화(시설, 장비 등), 제도문화(규범, 기술체계 등), 관념문화(목표, 가치 등) 등 스포츠 경기 문화 측면에서 생활환경형, 자연환경형 스포츠 문화를 비교⋅분석하고, 생태형 스포츠 경기에 참여하는 과정에서 자기 주변의 생태적 상황, 변화 및 그 의미를 민감하게 포착하고 이해하며 생태환경의 소중함을 알고 더불어 살아가는 태도를 실천하도록 한다."]},{"교":"체육","c":"12체육1-03-02","과":"체육1","학":"고2~3","영":"생태형 스포츠","p":"생태형 스포츠의 경기 기능을 과학적 원리에 따라 분석하고, 적극적으로 개선한다.","h":["생태형 스포츠 경기 기능 수행에 작용하는 사회과학적 원리, 자연과학적 원리를 이해하고 이러한 원리를 바탕으로 경기 기능을 개선하도록 한다."]},{"교":"체육","c":"12체육1-03-03","과":"체육1","학":"고2~3","영":"생태형 스포츠","p":"생태형 스포츠의 경기 방법 및 전략을 이해하고, 경기 상황에 맞게 응용한다.","h":["은 생태형 스포츠의 경기 방법과 전략이 어떠한 맥락에서 형성되고 만들어졌는지 탐구하여 생태형 스포츠를 깊이 있게 이해하고 경기 상황에 적절하게 적용하기 위해 설정하였다. 이를 위해 생활환경형, 자연환경형 스포츠 경기에서 직면하게 되는 다양한 문제 상황의 해결을 위한 경기 기능의 활용, 경기 상황에 따른 전략적 움직임, 경기 결과에 영향을 미치는 환경 조건 등을 이해하고 경기에 응용하도록 한다."]},{"교":"체육","c":"12체육2-01-01","과":"체육2","학":"고2~3","영":"체력 증진","p":"체력 증진을 위한 과학적 원리와 특성을 이해하고, 체력 증진 운동에 적용한다.","h":["은 체력 증진 운동에 적용되는 원리들이 어떠한 과학적 지식을 바탕으로 구성된 것인지 이해하여 자기 주도적 체력 관리에 필요한 체력 증진 운동을 구안하기 위해 설정하였다. 이를 위해 과부하의 원리, 점진성의 원리, 개별성의 원리, 특수성의 원리, 전면성의 원리, 반복성의 원리 등 체력 증진 원리에 적용되는 사회과학적, 자연과학적 원리를 이해하고 체력 증진 운동에 활용하도록 한다."]},{"교":"체육","c":"12체육2-01-02","과":"체육2","학":"고2~3","영":"체력 증진","p":"체력을 과학적으로 분석하고, 종합적 관리 방법에 따라 체력을 증진한다.","h":["는 자신의 체력 수준을 과학적 방법을 통해 평가하여 그에 따른 종합적 관리 방법을 구안하고 실천하기 위해 설정하였다. 이를 위해 심폐지구력, 근력, 유연성, 신체 구성, 순발력, 민첩성, 평형성 등 다양한 체력 요소의 과학적 측정과 분석 방법, 맞춤형 운동 처방, 식단, 생활 습관 등 체력을 종합적으로 관리하는 방법을 이해하고 체계적으로 실천하도록 한다."]},{"교":"체육","c":"12체육2-01-03","과":"체육2","학":"고2~3","영":"체력 증진","p":"체력 증진 운동에서 안전의 중요성을 이해하고 체력 증진 운동 시 발생할 수 있는 신체 위기 상황에 침착하게 대처한다.","h":["체력 증진 운동 시 발생할 수 있는 심정지, 골절, 근육과 건 좌상, 염좌, 타박상 등 신체 위기 상황에 적절하게 대처하는 방법을 이해하고 실제 위기 상황에 침착하게 대처하도록 한다."]},{"교":"체육","c":"12체육2-02-01","과":"체육2","학":"고2~3","영":"기술형 스포츠","p":"기술형 스포츠 문화의 개념과 특성을 탐색하고, 지속적인 경기 참여를 통해 신체적 자기효능감을 높인다.","h":["은 다양한 유형의 기술형 스포츠를 탐색하는 과정을 통해 기술형 스포츠 문화의 보편성과 특수성을 이해하고, 기술형 스포츠의 가치를 실천하기 위해 설정하였다. 이를 위해 물질문화(시설, 장비 등), 제도문화(규범, 기술체계 등), 관념문화(목표, 가치 등) 등 스포츠 경기 문화 측면에서 동작형, 기록형, 투기형 스포츠 문화를 비교⋅분석하고, 기술형 스포츠 경기에 참여하는 과정에서 자신의 신체 능력 수준에 대한 기대와 신념을 높이도록 한다."]},{"교":"체육","c":"12체육2-02-02","과":"체육2","학":"고2~3","영":"기술형 스포츠","p":"기술형 스포츠의 경기 기능을 과학적 원리에 따라 분석한다.","h":["중심 이동, 도약, 회전 등 기술형 스포츠 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하고 이러한 원리를 바탕으로 경기 기능을 개선하도록 한다."]},{"교":"체육","c":"12체육2-02-03","과":"체육2","학":"고2~3","영":"기술형 스포츠","p":"기술형 스포츠의 경기 방법 및 전략을 이해하고 경기 상황에 맞게 응용한다.","h":["은 기술형 스포츠의 경기 방법과 전략이 어떠한 맥락에서 형성되고 만들어졌는지 탐구하여 기술형 스포츠를 깊이 있게 이해하고 경기 상황에 적절하게 적용하기 위해 설정하였다. 이를 위해 자신의 기능 수준과 동작형, 기록형, 투기형 스포츠 경기에서 직면하게 되는 다양한 문제 상황의 해결을 위한 경기 기능의 활용, 경기 상황에 따른 전략적 움직임 등을 이해하고 경기에 응용하도록 한다."]},{"교":"체육","c":"12체육2-03-01","과":"체육2","학":"고2~3","영":"표현 활동","p":"표현 활동 문화의 유형, 개념, 특성을 이해하고, 다양한 표현 활동 문화를 탐색한다.","h":["은 표현 활동의 문화를 포괄적으로 탐색하기 위해 설정하였다. 표현 활동 문화의 유형인 수행 문화, 공연 문화, 감상 문화의 개념과 특성을 이해하고, 표현 활동 문화의 유형별 공통점과 차이점을 발견하도록 한다."]},{"교":"체육","c":"12체육2-03-02","과":"체육2","학":"고2~3","영":"표현 활동","p":"표현 활동의 미적 원리를 이해하고, 표현 동작을 심층적으로 분석하여 창의적으로 동작을 수행한다.","h":["는 표현 활동의 동작 및 미적 원리에 대한 이해를 바탕으로 동작을 분석하고 수행하기 위해 설정하였다. 동작 특성, 표현 특성 등의 표현 방법을 바탕으로 표현 동작의 수행을 심층적으로 분석하고, 통일미, 변화미, 조화미, 역동미 등의 미적 요소와 원리를 이해하고 이를 바탕으로 표현 동작을 심층적으로 분석하여 더욱 아름답고 창의적으로 동작을 수행하도록 한다."]},{"교":"체육","c":"12체육2-03-03","과":"체육2","학":"고2~3","영":"표현 활동","p":"표현 주제에 맞게 창의적으로 작품을 창작하고 감상⋅비평함으로써 심미적 안목을 갖는다.","h":["은 표현 활동에 대한 깊이 있는 체험을 통해 작품을 창작하고 비평하기 위해 설정하였다. 개인 혹은 모둠이 관심사를 반영하여 설정한 주제에 맞게 창의적으로 동작을 만들고 구성하며, 자신 혹은 타인의 작품을 감상하고 비평하는 과정에서 아름다움을 발견하고 분별할 수 있는 식견을 갖도록 한다."]},{"교":"체육","c":"12운건01-01","과":"운동과 건강","학":"고2~3","영":"건강 운동","p":"운동이 신체적, 정신적 질환 예방과 사회적 건강에 미치는 효과를 파악하고, 운동의 목적과 자신의 수준에 적합한 건강 운동을 계획한다.","h":["은 건강에서 운동이 갖는 의미와 운동의 필요성을 명확하게 이해하고, 자기 주도적 건강 관리에 필요한 운동을 계획하기 위해 설정하였다. 운동이 건강에 미치는 효과를 뇌혈관질환, 심장질환, 대사질환, 불안증, 스트레스 등 다양한 질환의 예방과 건강한 인간관계 및 사회적 안녕 측면에서 구체적으로 이해하도록 한다."]},{"교":"체육","c":"12운건01-02","과":"운동과 건강","학":"고2~3","영":"건강 운동","p":"일일, 주간, 월간 건강 운동 프로그램을 계획하고 자기 주도적으로 실천하여 건강을 관리하고, 건강 관련 분야 진로를 설계한다.","h":["는 운동 목표에 따라 과학적 원리를 적용하여 운동 프로그램을 구안하여 실천하고, 건강 관련 분야 진로를 설계하기 위해 설정하였다. 자신의 수준에 맞게 운동 종류, 운동 강도, 운동 빈도, 운동 시간 등을 결정하여 하루, 일주일, 한 달 단위의 구체적인 운동 계획을 수립하여 실천하고, 건강 관련 분야 진로 정보를 수집하여 분석하며, 자기 적성에 맞는 진로 계획을 수립하여 건강 관련 분야 진로에서 요구되는 조건이나 자격을 갖출 수 있도록 진로를 설계하고 준비하도록 한다."]},{"교":"체육","c":"12운건01-03","과":"운동과 건강","학":"고2~3","영":"건강 운동","p":"기술형 스포츠를 이용한 건강 관리 방법을 탐색하고, 일상에서 실천하며 생활화한다."},{"교":"체육","c":"12운건01-04","과":"운동과 건강","학":"고2~3","영":"건강 운동","p":"표현 활동을 이용한 건강 관리 방법을 탐색하고, 일상에서 실천하며 생활화한다."},{"교":"체육","c":"12운건02-01","과":"운동과 건강","학":"고2~3","영":"체력 운동","p":"운동 처방에 따른 트레이닝의 종류와 방법을 이해하여 체력 증진을 위한 트레이닝 프로그램을 계획하고 체력 운동에 적용하며 자기 주도적으로 체력을 관리한다.","h":["은 운동 처방에서 트레이닝의 효과와 중요성을 이해하고 관련 지식을 습득하여 자기 주도적으로 체력을 관리하기 위해 설정하였다. 인터벌 트레이닝, 서킷 트레이닝, 웨이트 트레이닝, 아이소메트릭 트레이닝, 스트레칭 등 체력 요소별 트레이닝 방법과 운동 목적에 따라 다양한 트레이닝 방법을 혼합하는 트레이닝 프로그램 구성 방법을 이해하고 이를 바탕으로 트레이닝 프로그램을 계획하고 체력 운동에 적용하여 체력을 관리하도록 한다."]},{"교":"체육","c":"12운건02-02","과":"운동과 건강","학":"고2~3","영":"체력 운동","p":"운동 손상의 원인과 기전을 이해하고, 적절한 응급처치와 재활 운동을 통해 운동 손상을 관리한다.","h":["는 운동 과정에서 발생할 수 있는 운동 손상에 대한 이해를 바탕으로 안전하게 운동하기 위해 설정하였다. 체력 증진 트레이닝 과정에서 발생할 수 있는 외상성 부상과 과사용 부상의 원인과 발생 기전을 이해하고, 상해의 종류에 따른 적절한 응급처치 방법과 재활 운동 방법을 통해 운동 손상을 관리하도록 한다."]},{"교":"체육","c":"12스문01-01","과":"스포츠 문화","학":"고2~3","영":"스포츠 인문 문화","p":"스포츠 인문 문화의 개념 및 특성을 이해하고, 스포츠 대회에 다양한 방식으로 참여한다.","h":["은 스포츠 경기에 직접 참여하는 방식과 다양한 인문 문화의 서사적 접근을 통한 간접 참여 방식의 중요성과 가치를 인식하기 위해 설정하였다. 스포츠를 매개로 하는 다양한 인문 문화(시, 소설, 수필, 희곡, 영화, 음악, 미술, 건축, 종교, 역사, 철학 등)에 대해 이해하고 창작⋅비평하며, 스포츠 경기를 수행하도록 한다."]},{"교":"체육","c":"12스문01-02","과":"스포츠 문화","학":"고2~3","영":"스포츠 인문 문화","p":"스포츠의 역사와 철학을 탐구하고, 스포츠의 문화를 비판적으로 분석한다.","h":["는 스포츠의 역사와 철학의 탐구과정에서 올바른 스포츠 역사의식과 스포츠의 가치를 인식하는 능력을 기르기 위해 설정하였다. 스포츠의 역사(유래, 변천, 경기 유형, 인물, 기록, 사건 등)와 스포츠 철학(스포츠 윤리, 스포츠의 관례⋅의식 등)에 대해 깊이 있게 탐구하고, 스포츠 역사와 철학에 관련된 문화에 대한 가치 판단을 통해 스포츠 현상의 긍정적인 측면과 부정적인 측면을 이해하도록 한다."]},{"교":"체육","c":"12스문01-03","과":"스포츠 문화","학":"고2~3","영":"스포츠 인문 문화","p":"스포츠를 주제로 한 다양한 문학과 예술을 비교⋅분석하고, 스포츠 인문 문화 분야 진로를 설계한다.","h":["은 스포츠와 관련된 문학과 예술 분야에 대한 가치를 인식하고 스포츠 문화를 향유하며, 스포츠 인문 문화 분야 진로를 설계하기 위해 설정하였다. 스포츠 경험으로 창출된 시, 소설, 희곡, 수필 등과 같은 스포츠 문학과 음악, 연극, 영화, 회화, 조각 등과 같은 스포츠 예술 분야의 공통점과 차이점, 유사점을 발견하고, 서사적 형태의 스포츠 문학과 예술 고유의 가치를 명확하게 인식하도록 한다. 또한 스포츠 인문 문화 분야 진로 정보를 수집하여 분석하고, 자기 적성에 맞는 진로 계획을 수립하여 스포츠 인문 문화 분야 진로에서 요구되는 조건이나 자격을 갖출 수 있도록 진로를 설계하고 준비하도록 한다."]},{"교":"체육","c":"12스문02-01","과":"스포츠 문화","학":"고2~3","영":"스포츠 경기 문화","p":"스포츠 경기 문화의 개념 및 특성을 이해하고, 스포츠 대회에 다양한 역할로 참여한다.","h":["은 스포츠 경기 문화의 개념과 특성을 이해함으로써 경기 참여 이외의 다양한 역할로 스포츠 대회에 참가하는 것의 중요성을 인식하기 위해 설정하였다. 운동 기능이 발전하여 성립한 스포츠 경기 문화(장비, 기술체계, 규범, 사상과 이념, 제도와 조직 등)에 대해 이해하고, 형식을 갖춘 스포츠 대회에 적극적으로 참가하는 태도와 스포츠 경기를 수행하도록 한다."]},{"교":"체육","c":"12스문02-02","과":"스포츠 문화","학":"고2~3","영":"스포츠 경기 문화","p":"스포츠 경기 문화의 구성 체계 및 방법에 따라 스포츠 대회를 기획하고 운영하며, 스포츠 경기 문화 분야 진로를 설계한다.","h":["는 스포츠 경기 문화의 구성체계를 적합하게 반영하여 스포츠 대회를 기획하고 운영하며, 스포츠 경기 문화 분야 진로를 설계하기 위해 설정하였다. 물질문화(장비, 경기 용구 등), 제도문화(규범, 기술체계 등), 관념문화(목표, 가치 등)로 이루어진 스포츠 경기 문화의 구성체계를 이해하고, 제도와 조직(경기 구성원의 역할, 경기 절차, 운영 방법, 경기 단체 등)을 갖춘 스포츠 대회를 기획하고 운영한다. 또한 스포츠 경기 문화 분야에 관한 진로 정보를 수집하여 분석하고, 자기 적성에 맞는 진로 계획을 수립하여 스포츠 경기 문화 분야 진로에서 요구되는 조건이나 자격을 갖출 수 있도록 진로를 설계하고 준비하도록 한다."]},{"교":"체육","c":"12스문02-03","과":"스포츠 문화","학":"고2~3","영":"스포츠 경기 문화","p":"스포츠 경기 문화의 가치를 이해하고, 스포츠 경기 문화를 다양한 분야와 접목한다.","h":["은 스포츠 경기 문화가 타 분야와 융합하여 새로운 스포츠 문화를 창출할 수 있음을 인식하도록 설정하였다. 스포츠 경기 문화는 스포츠 참여의 다양성, 지역 및 국가적 스포츠 문화의 발전, 나아가 인종⋅언어⋅국경을 초월한 보편적 가치를 지니고 있음을 이해하고, 미래 스포츠 문화의 발전을 위해 스포츠 경기 문화를 인문, 사회, 과학 등 다양한 분야와 접목하는 확산적 사고를 갖도록 한다."]},{"교":"체육","c":"12스과01-01","과":"스포츠 과학","학":"고2~3","영":"스포츠와 사회과학","p":"스포츠와 사회과학의 관계를 이해하고, 스포츠 현상을 분석한 심리⋅사회학적 이론을 탐구하며, 스포츠 사회과학 분야 진로를 설계한다.","h":["은 심리학, 사회학 등 사회과학과 스포츠의 관계를 탐색함으로써 스포츠 사회과학의 기능과 역할의 중요성을 이해하고, 스포츠 사회과학 분야 진로를 설계하도록 설정하였다. 심리적 요인이 스포츠 행동에 미치는 영향, 스포츠 현상과 사회학적 이론 및 방법의 관계 등 다양한 측면을 탐구하며, 스포츠 사회과학 분야 진로 정보를 분석하고 자기 적성에 맞는 진로 계획을 수립하여 스포츠 사회과학 분야 진로에서 요구되는 조건이나 자격을 갖출 수 있도록 진로를 설계하고 준비하도록 한다."]},{"교":"체육","c":"12스과01-02","과":"스포츠 과학","학":"고2~3","영":"스포츠와 사회과학","p":"스포츠 경기 활동에 참여하며, 심리⋅사회학적 이론의 적용 가능성을 탐색하고 경기 상황에 적용한다.","h":["는 실제 스포츠 참여 과정에서 나타나는 심리⋅사회학적 현상과 원리를 발견하고, 이를 스포츠 수행 능력 향상에 적용하기 위해 설정하였다. 다양한 유형의 스포츠 경기 참여 과정에서 심리학적 요인(성격, 불안, 동기, 귀인이론, 목표 설정, 주의집중, 사회적 태만, 리더십, 응집력, 심상 훈련, 슬럼프 등)과 사회학적 현상(스포츠와 정치, 경제, 교육, 미디어, 계층, 사회문제 등)을 탐색하고 스포츠 경기 상황에 적합하게 적용하도록 한다."]},{"교":"체육","c":"12스과01-03","과":"스포츠 과학","학":"고2~3","영":"스포츠와 사회과학","p":"스포츠와 심리⋅사회학적 이론을 융합하는 태도와 과학적 안목을 발휘한다.","h":["은 스포츠 참여자 개인의 심리적 특성(유전적, 상황적, 집단적 특성, 운동 기능 학습 등)과 사회적 측면(정치, 경제, 교육, 미디어, 계층, 사회문제와 스포츠의 관계 등)을 객관적으로 분석하고, 스포츠와 사회과학과의 관계를 융합하는 태도와 스포츠에 대한 과학적 안목을 넓히도록 한다."]},{"교":"체육","c":"12스과02-01","과":"스포츠 과학","학":"고2~3","영":"스포츠와 자연과학","p":"스포츠와 자연과학의 관계를 이해하고, 스포츠 현상을 분석한 생리⋅역학적 이론을 탐구하며, 스포츠 자연과학 분야의 진로를 설계한다.","h":["은 자연과학과 스포츠의 관계를 이해함으로써 스포츠 자연과학의 기능과 역할의 중요성을 이해하고, 스포츠 자연과학 분야 진로를 설계하기 위해 설정하였다. 생리학, 물리학 등 자연과학과 스포츠의 관계를 이해하고, 스포츠 활동으로 나타나는 인체의 기능적 변화에 대한 법칙, 스포츠 활동 중 인체에 작용하는 여러 가지 힘과 관련된 법칙을 다양한 사례 중심으로 분석하며, 스포츠 자연과학 분야 진로 정보를 분석하고, 자기 적성에 맞는 진로 계획을 수립하여 스포츠 자연과학 분야 진로에서 요구되는 조건이나 자격을 갖출 수 있도록 진로를 설계하고 준비하도록 한다."]},{"교":"체육","c":"12스과02-02","과":"스포츠 과학","학":"고2~3","영":"스포츠와 자연과학","p":"스포츠 경기 활동에 참여하여 생리⋅역학적 이론의 적용 가능성을 탐색하고 경기 상황에 적용한다.","h":["는 스포츠 참여 과정에서 나타나는 생리⋅역학적 현상과 원리를 발견하고, 이를 스포츠 수행 능력 향상에 적용하기 위해 설정하였다. 다양한 유형의 스포츠 경기 참여 과정에서 생리학적 변화(스포츠를 통한 근육, 신경, 호흡, 순환계, 에너지대사 등)와 역학적 원리(인체에 작용하는 힘, 운동의 법칙, 운동에너지, 지레의 작용, 무게중심 등)를 탐색하고 스포츠 경기 상황에 적합하게 적용하도록 한다."]},{"교":"체육","c":"12스과02-03","과":"스포츠 과학","학":"고2~3","영":"스포츠와 자연과학","p":"스포츠와 생리⋅역학적 이론을 융합하는 태도와 과학적 안목을 발휘한다.","h":["은 스포츠를 통한 신체의 생리학적 변화(근육, 신경, 호흡, 순환계, 에너지대사 등)와 스포츠를 수행할 때 작용하는 역학적 측면(힘의 개념, 힘의 작용, 힘의 종류, 운동의 법칙, 운동의 형태, 운동에너지, 인체 움직임의 물리적 관계 등)을 객관적으로 분석하고, 스포츠와 자연과학과의 관계를 융합하는 태도와 스포츠에 대한 과학적 안목을 넓히도록 한다."]},{"교":"체육","c":"12스생1-01-01","과":"스포츠 생활1","학":"고2~3","영":"영역형 스포츠","p":"영역형 스포츠의 문화를 이해하고 존중하며, 스포츠퍼슨십을 실천한다.","h":["축구, 농구, 핸드볼 등 영역형 스포츠를 경기 문화와 축제 문화 측면에서 깊이 있게 이해하고, 이를 바탕으로 영역형 스포츠 경기에 공정하게 임하고 상대와 심판, 관중을 향해 예의를 갖추며 승패를 떠나 결과에 승복하는 태도를 실천하도록 한다."]},{"교":"체육","c":"12스생1-01-02","과":"스포츠 생활1","학":"고2~3","영":"영역형 스포츠","p":"영역형 스포츠에 필요한 체력을 강화하고, 경기 기능을 과학적으로 분석하여 발전시켜 다른 기능에 전이한다.","h":["영역형 스포츠에 필요한 체력을 강화하고, 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하며 이러한 원리를 바탕으로 경기 기능을 발전시켜 다른 기능의 학습에 긍정적인 영향을 미치도록 한다."]},{"교":"체육","c":"12스생1-01-03","과":"스포츠 생활1","학":"고2~3","영":"영역형 스포츠","p":"영역형 스포츠의 경기 수행 능력을 고도화하여 스포츠 수행에 대한 유능감을 높이고, 경기 전략을 창의적으로 발전시킨다.","h":["은 경기 기능의 숙달, 과학적 원리의 적용, 경기 전략의 이해를 통해 경기 수행 능력을 고도화하고 영역형 스포츠 수행에 대한 유능감을 높여 영역형 스포츠를 생활화하기 위해 설정하였다. 영역형 스포츠 경기에서 직면하게 되는 다양한 문제 상황을 해결하기 위한 경기 기능의 활용, 공을 소유하고 있는 경우와 그렇지 않은 경우의 움직임, 공격과 수비 상황에서의 전략적 움직임 등을 이해하여 경기 수행 능력을 고도화하고, 이를 바탕으로 창의적인 경기 전략을 활용하여 경기를 수행하도록 한다."]},{"교":"체육","c":"12스생1-02-01","과":"스포츠 생활1","학":"고2~3","영":"생활⋅자연환경형 스포츠","p":"생활⋅자연환경형 스포츠의 문화를 이해하고 존중하며, 환경친화적 태도를 실천한다.","h":["생활⋅자연환경형 스포츠를 경기 문화와 축제 문화 측면에서 깊이 있게 이해하고, 이를 바탕으로 생활⋅자연환경형 스포츠 경기에 참여하는 과정에서 자신의 활동이 주변 환경에 미치는 영향을 생각하고, 환경을 오염시키지 않고 환경과 어울려 활동하는 태도를 실천하도록 한다."]},{"교":"체육","c":"12스생1-02-02","과":"스포츠 생활1","학":"고2~3","영":"생활⋅자연환경형 스포츠","p":"생활⋅자연환경형 스포츠에 필요한 체력을 강화하고, 경기 기능을 과학적으로 분석하여 발전시켜 다른 기능에 전이한다.","h":["생활⋅자연환경형 스포츠에 필요한 체력을 강화하고, 생활⋅자연환경형 스포츠 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하며 이러한 원리를 바탕으로 경기 기능을 개선하도록 한다."]},{"교":"체육","c":"12스생1-02-03","과":"스포츠 생활1","학":"고2~3","영":"생활⋅자연환경형 스포츠","p":"생활⋅자연환경형 스포츠의 경기 수행 능력을 고도화하여 스포츠 수행에 대한 유능감을 높이고, 경기 전략을 창의적으로 발전시킨다.","h":["은 경기 기능의 숙달, 과학적 원리의 적용, 경기 전략의 이해 등을 통해 경기 수행 능력을 고도화하고 생활⋅자연환경형 스포츠 수행에 대한 유능감을 높여 생활⋅자연환경형 스포츠를 생활화하기 위해 설정하였다. 생활⋅자연환경형 스포츠 경기에서 직면하게 되는 다양한 문제 상황을 해결하기 위한 경기 기능의 활용, 상황에 따른 전략적 움직임, 경기 결과에 영향을 미치는 환경 조건을 이해하여 경기 수행 능력을 고도화하고, 이를 바탕으로 창의적인 경기 전략을 활용하여 경기를 수행하도록 한다."]},{"교":"체육","c":"12스생2-01-01","과":"스포츠 생활2","학":"고2~3","영":"네트형 스포츠","p":"네트형 스포츠의 문화를 이해하고 존중하며, 스포츠퍼슨십을 실천한다.","h":["네트형 스포츠를 경기 문화와 축제 문화 측면에서 깊이 있게 이해하고, 이를 바탕으로 네트형 스포츠 경기에 공정하게 임하고 상대와 심판, 관중을 향해 예의를 갖추며 승패를 떠나 결과에 승복하는 태도를 실천하도록 한다."]},{"교":"체육","c":"12스생2-01-02","과":"스포츠 생활2","학":"고2~3","영":"네트형 스포츠","p":"네트형 스포츠에 필요한 체력을 강화하고, 경기 기능을 과학적으로 분석하여 발전시켜 다른 기능에 전이한다.","h":["네트형 스포츠에 필요한 체력을 강화하고, 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하며 이러한 원리를 바탕으로 경기 기능을 발전시켜 다른 기능의 학습에 긍정적인 영향을 미치도록 한다."]},{"교":"체육","c":"12스생2-01-03","과":"스포츠 생활2","학":"고2~3","영":"네트형 스포츠","p":"네트형 스포츠의 경기 수행 능력을 고도화하여 스포츠 수행에 대한 유능감을 높이고, 경기 전략을 창의적으로 발전시킨다.","h":["은 경기 기능의 숙달, 과학적 원리의 적용, 경기 전략의 이해를 통해 경기 수행 능력을 고도화하고 네트형 스포츠 수행에 대한 유능감을 높여 네트형 스포츠를 생활화하기 위해 설정하였다. 배구, 탁구, 배드민턴 등 네트형 스포츠 경기에서 직면하게 되는 다양한 문제 상황을 해결하기 위한 경기 기능의 활용, 공을 직접 처리하는 경우와 그렇지 않은 경우의 움직임, 공격과 수비 상황에서의 전략적 움직임 등을 이해하여 경기 수행 능력을 고도화하고, 이를 바탕으로 창의적인 경기 전략을 활용하여 경기를 수행하도록 한다."]},{"교":"체육","c":"12스생2-02-01","과":"스포츠 생활2","학":"고2~3","영":"필드형 스포츠","p":"필드형 스포츠의 문화를 이해하고 존중하며, 스포츠퍼슨십을 실천한다.","h":["필드형 스포츠를 경기 문화와 축제 문화 측면에서 깊이 있게 이해하고, 이를 바탕으로 필드형 스포츠 경기에 공정하게 임하고 상대와 심판, 관중을 향해 예의를 갖추며 승패를 떠나 결과에 승복하는 태도를 실천하도록 한다."]},{"교":"체육","c":"12스생2-02-02","과":"스포츠 생활2","학":"고2~3","영":"필드형 스포츠","p":"필드형 스포츠에 필요한 체력을 강화하고, 경기 기능을 과학적으로 분석하여 발전시켜 다른 기능에 전이한다.","h":["필드형 스포츠에 필요한 체력을 강화하고, 경기 기능 수행에 작용하는 사회과학적, 자연과학적 원리를 이해하며 이러한 원리를 바탕으로 경기 기능을 발전시켜 다른 기능의 학습에 긍정적인 영향을 미치도록 한다."]},{"교":"체육","c":"12스생2-02-03","과":"스포츠 생활2","학":"고2~3","영":"필드형 스포츠","p":"필드형 스포츠의 경기 수행 능력을 고도화하여 스포츠 수행에 대한 유능감을 높이고, 경기 전략을 창의적으로 발전시킨다.","h":["은 경기 기능의 숙달, 과학적 원리의 적용, 경기 전략의 이해를 통해 경기 수행 능력을 고도화하고 필드형 스포츠 수행에 대한 유능감을 높여 필드형 스포츠를 생활화하기 위해 설정하였다. 필드형 스포츠 경기에서 직면하게 되는 다양한 문제 상황의 해결을 위한 경기 기능의 활용, 공을 직접 처리하는 경우와 그렇지 않은 경우의 움직임, 공격과 수비 상황에서의 전략적 움직임 등을 이해하여 경기 수행 능력을 고도화하고, 이를 바탕으로 창의적인 경기 전략을 활용하여 경기를 수행하도록 한다."]},{"교":"음악","c":"4음01-01","과":"음악","학":"초3~4","영":"연주","p":"바른 자세와 주법을 익혀 노래 부르거나 악기로 연주한다."},{"교":"음악","c":"4음01-02","과":"음악","학":"초3~4","영":"연주","p":"기초적인 음악 요소를 살려 노래 부르거나 악기로 연주하고 느낌을 이야기한다.","h":["이 성취기준은 노래나 악기 연주를 통해 기초적인 음악 요소를 표현하도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 익혀 다양한 악곡을 연주하고, 이를 통해 알게 된 점이나 느낌 등을 이야기해 봄으로써 음악 개념과 활동을 의미 있게 연결 짓도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음01-03","과":"음악","학":"초3~4","영":"연주","p":"노래와 악기 연주에 어울리는 신체표현이나 놀이를 하며 음악을 즐긴다.","h":["이 성취기준은 다양한 노래나 악기 연주의 특성을 탐색하고 관련지어 자유롭게 신체나 놀이로 표현하도록 하기 위해 설정하였다. 학습자의 발달 단계에 적합한 흥미로운 신체표현을 통해 음악을 즐기고, 음악을 활용하여 전통과 현대의 다양한 놀이를 하도록 함으로써 노래, 연주 등의 음악 활동이 음악 외의 여러 활동과 연결되도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음01-04","과":"음악","학":"초3~4","영":"연주","p":"생활 속에서 음악을 경험하며 연주에 관심을 가지고 참여한다.","h":["이 성취기준은 음악 수업을 통해 학습한 다양한 음악 경험을 생활 속으로 확장하도록 하기 위해 설정하였다. 혼자 또는 여럿이 함께한 노래 및 악기 연주 경험을 바탕으로 가정, 학교 등 주변 생활 속에서 음악을 활용할 수 있는 방법에 대해 살펴보고, 실제 생활에서 간단한 연주 활동에 스스로 관심을 가지고 참여하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음02-01","과":"음악","학":"초3~4","영":"감상","p":"음악을 듣고 기초적인 음악 요소를 탐색하며 반응한다.","h":["이 성취기준은 감상곡에 포함된 기초적인 음악 요소를 청각적으로 인식하도록 하기 위해 설정하였다. 음악을 들으며 기초적인 수준의 음악 요소를 탐색해 보고, 노래, 악기, 신체, 언어, 그림 등 다양한 방법으로 자신의 반응을 자유롭게 표현하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음02-02","과":"음악","학":"초3~4","영":"감상","p":"다양한 음악을 듣고 음악적 특징을 발견한다.","h":["이 성취기준은 음악의 종류나 주제 등에 따른 음악의 전반적 특징을 발견하며 감상하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악을 감상하며 음악적 특징을 발표하고 공유하는 활동을 통해 다양한 주제가 감상곡에서 어떤 음악적 특징으로 나타나는지 살펴 청각적 인식과 음악적 이해를 연결 짓도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음02-03","과":"음악","학":"초3~4","영":"감상","p":"다양한 종류의 음악을 듣고 음악의 분위기를 묘사하거나 쓰임을 이야기한다.","h":["이 성취기준은 다양한 분위기와 쓰임을 가진 음악을 듣고 경험하도록 함으로써 음악을 활용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 악곡과 관련된 느낌과 감정, 분위기나 장면 등을 떠올려 보고, 이를 노래, 악기 연주, 신체표현, 그림, 영상, 글쓰기 등의 방법으로 묘사해 본다. 나아가 놀이, 의식, 노동 등 생활 속에서 다양하게 쓰이는 음악에 관해 이야기해 보며 음악 감상을 통한 경험을 확장하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음02-04","과":"음악","학":"초3~4","영":"감상","p":"생활 속에서 음악을 들으며 느낌과 호기심을 갖고 즐긴다.","h":["이 성취기준은 일상생활 속에서 호기심을 가지고 다양한 음악을 들으며 친숙함을 느끼도록 하기 위해 설정하였다. 국악, 서양음악, 세계음악, 대중매체에서 접하는 음악 등을 열린 마음으로 수용하고 즐김으로써 음악 감상을 생활화하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음02-05","과":"음악","학":"초3~4","영":"감상","p":"우리 지역의 음악 문화유산을 찾아 듣고 국악을 즐기는 태도를 갖는다.","h":["이 성취기준은 지역에 전승되어 오는 음악 문화유산에 관심을 갖고 찾아 들으며, 생활 속에서 국악을 즐기는 태도를 가질 수 있도록 하기 위해 설정하였다. 타 교과의 지역 학습과 연계하여 지역의 음악 문화유산을 통해 자신이 속한 지역 문화에 대한 이해를 높이고, 지역에 전승되어 오는 음악 문화유산에 호기심을 가지게 함으로써 생활 속에서 국악을 즐기는 태도를 함양하는 데 중점을 둔다."]},{"교":"음악","c":"4음03-01","과":"음악","학":"초3~4","영":"창작","p":"느낌과 상상을 즉흥적으로 표현하며 음악에 대한 흥미를 갖는다.","h":["이 성취기준은 주변 경험과 관련된 느낌이나 상상한 바를 음악으로 나타냄으로써 음악적 상상력을 기르도록 하기 위하여 설정하였다. 자신의 느낌이나 상상을 일정한 틀이나 형식에 얽매이지 않고 목소리, 악기, 신체, 물체 등을 활용하여 즉흥적인 소리나 음악으로 표현하는 활동을 하며 자신과 다른 사람의 자유로운 표현을 즐기고 음악에 관한 흥미를 갖도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음03-02","과":"음악","학":"초3~4","영":"창작","p":"악곡의 일부를 바꾸어 표현하고 간단한 악보로 나타낸다.","h":["이 성취기준은 노랫말 등 악곡의 일부를 바꾸어 표현하고 음악을 기록하는 다양한 방법에 대해 기초적인 수준에서 이해하도록 하기 위해 설정하였다. 음⋅음표, 그림, 기호, 숫자, 문자 등을 활용하여 악보로 나타내고 창작과 공유의 즐거움을 경험하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음03-03","과":"음악","학":"초3~4","영":"창작","p":"기초적인 음악 요소를 활용하여 소리나 음악으로 표현한다.","h":["이 성취기준은 음악 요소에 관한 이해를 바탕으로 소리나 음악을 창작하는 기초적인 능력을 기르도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 활용하여 짧고 간단한 소리나 음악으로 자유롭게 표현하며 음악 요소에 따른 음악적 효과와 특징을 스스로 인식하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"4음03-04","과":"음악","학":"초3~4","영":"창작","p":"생활 주변의 소리나 장면을 모방하며 음악의 새로움을 즐기는 태도를 갖는다.","h":["이 성취기준은 생활 주변의 소리에 민감하게 반응하고 새로운 음악을 만들어가며 즐길 수 있도록 하기 위해 설정하였다. 일상에서 경험할 수 있는 다양한 소리나 장면을 음악의 관점에서 탐색해 보고 이를 모방하여 노래, 악기 연주, 신체표현 등의 다양한 방법으로 나타내도록 한다. 학습자마다 산출해낸 다양한 결과물을 서로 공유하며 새로운 표현과 그 가능성을 즐기도록 하는 데 중점을 둔다."]},{"교":"음악","c":"6음01-01","과":"음악","학":"초5~6","영":"연주","p":"바른 주법과 표현 기법을 익혀 노래나 악기로 느낌을 담아 연주한다."},{"교":"음악","c":"6음01-02","과":"음악","학":"초5~6","영":"연주","p":"음악 요소를 살려 노래나 악기로 발표하고 과정을 돌아본다.","h":["이 성취기준은 악곡에 드러난 음악의 다양한 요소를 익혀 노래나 악기 연주로 표현하는 기회를 가지도록 하기 위해 설정하였다. 여러 음악 요소에 대한 이해를 바탕으로 노래나 악기 연주로 발표하고, 자신의 발표 과정을 스스로 돌아보면서 서로 평하는 데 중점을 둔다."]},{"교":"음악","c":"6음01-03","과":"음악","학":"초5~6","영":"연주","p":"소리의 어울림을 생각하며 다양한 방법으로 함께 표현한다.","h":["이 성취기준은 함께하는 연주 활동을 통해 다양한 소리의 어울림을 경험하고 음악 표현의 재미를 느낄 수 있도록 하기 위해 설정하였다. 목소리, 악기, 신체, 물체, 매체 등을 활용한 다양한 소리와 그 어울림의 특징을 탐구하고, 이를 표현하기 위한 여러 방법을 탐색하도록 한다. 이 과정에서 다른 사람과 함께 활동함으로써 공동체 속에서 음악으로 소통하는 즐거움을 경험하도록 하는 데 중점을 둔다."]},{"교":"음악","c":"6음01-04","과":"음악","학":"초5~6","영":"연주","p":"간단한 형태의 연주를 준비하여 생활 속 음악 활동에 참여한다.","h":["이 성취기준은 학생들이 노래와 악기 연주 기능을 발휘하여 생활 속에서 음악 활동을 실천하는 태도를 기르도록 하기 위해 설정하였다. 가정 및 학교의 행사나 지역 축제 등 생활 속에서 음악이 필요한 상황을 생각하여 적절한 음악을 선택하고 학생들의 수준에 맞는 간단한 형태로 혼자 또는 여럿이 연주를 준비하도록 한다. 연주를 위한 준비 과정과 발표에 참여함으로써 음악을 생활화하며 자기주도적으로 즐기는 태도를 기르도록 하는 데 중점을 둔다."]
