수1-02-11","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차부등식과 이차함수를 연결하여 그 관계를 설명하고, 이차부등식과 연립이차부등식을 풀 수 있다."},{"교":"수학","c":"10공수1-03-01","과":"공통수학1","학":"고1","영":"경우의 수","p":"합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."},{"교":"수학","c":"10공수1-03-02","과":"공통수학1","학":"고1","영":"경우의 수","p":"순열의 개념을 이해하고, 순열의 수를 구하는 방법을 설명할 수 있다."},{"교":"수학","c":"10공수1-03-03","과":"공통수학1","학":"고1","영":"경우의 수","p":"조합의 개념을 이해하고, 조합의 수를 구하는 방법을 설명할 수 있다."},{"교":"수학","c":"10공수1-04-01","과":"공통수학1","학":"고1","영":"행렬","p":"행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."},{"교":"수학","c":"10공수1-04-02","과":"공통수학1","학":"고1","영":"행렬","p":"행렬의 연산을 수행하고, 관련된 문제를 해결할 수 있다.","h":["행렬의 연산에서는 행렬의 덧셈, 뺄셈, 실수배 및 곱셈을 다루고, 행과 열의 수가 각각 2를 넘지 않는 범위에서 행렬의 곱셈을 할 수 있게 한다."]},{"교":"수학","c":"10공수2-01-01","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"선분의 내분을 이해하고, 내분점의 좌표를 계산할 수 있다.","h":["선분의 내분을 도입하기 전에 두 점 사이의 거리를 구하는 방법을 다루고, 내분은 수직선 위에서, 좌표평면 위에서 구할 수 있도록 점차 확장하여 다룬다."]},{"교":"수학","c":"10공수2-01-02","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"두 직선의 평행 조건과 수직 조건을 탐구하고 이해한다."},{"교":"수학","c":"10공수2-01-03","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"점과 직선 사이의 거리를 구하고, 관련된 문제를 해결할 수 있다."},{"교":"수학","c":"10공수2-01-04","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"원의 방정식을 구하고, 그래프를 그릴 수 있다."},{"교":"수학","c":"10공수2-01-05","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"좌표평면에서 원과 직선의 위치 관계를 판단하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"10공수2-01-06","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"평행이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."},{"교":"수학","c":"10공수2-01-07","과":"공통수학2","학":"고1","영":"도형의 방정식","p":"원점, $x$축, $y$축, 직선 $y=x$에 대한 대칭이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."},{"교":"수학","c":"10공수2-02-01","과":"공통수학2","학":"고1","영":"집합과 명제","p":"집합의 개념을 이해하고, 집합을 표현할 수 있다."},{"교":"수학","c":"10공수2-02-02","과":"공통수학2","학":"고1","영":"집합과 명제","p":"두 집합 사이의 포함관계를 판단할 수 있다."},{"교":"수학","c":"10공수2-02-03","과":"공통수학2","학":"고1","영":"집합과 명제","p":"집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다.","h":["집합의 연산은 합집합, 교집합, 여집합, 차집합을 다루고, 집합의 연산에 관한 교환법칙, 결합법칙, 분배법칙, 드모르간의 법칙은 벤 다이어그램으로 확인하는 정도로 간단히 다룬다."]},{"교":"수학","c":"10공수2-02-04","과":"공통수학2","학":"고1","영":"집합과 명제","p":"명제와 조건의 뜻을 알고, ‘모든’, ‘어떤’을 포함한 명제를 이해하고 설명할 수 있다.","h":["명제와 조건의 뜻은 수학적인 문장을 이해하는 수준에서 간단히 다룬다. ‘모든’, ‘어떤’을 포함한 명제는 구체적인 상황을 이용하여 도입한다."]},{"교":"수학","c":"10공수2-02-05","과":"공통수학2","학":"고1","영":"집합과 명제","p":"명제의 역과 대우를 이해하고 설명할 수 있다."},{"교":"수학","c":"10공수2-02-06","과":"공통수학2","학":"고1","영":"집합과 명제","p":"충분조건과 필요조건을 이해하고 판단할 수 있다."},{"교":"수학","c":"10공수2-02-07","과":"공통수학2","학":"고1","영":"집합과 명제","p":"대우를 이용한 증명법과 귀류법을 이해하고 관련된 명제를 증명할 수 있다.","h":["대우를 이용한 증명법과 귀류법을 이용한 명제의 증명은 간단한 것만 다룬다."]},{"교":"수학","c":"10공수2-02-08","과":"공통수학2","학":"고1","영":"집합과 명제","p":"절대부등식의 뜻을 알고, 간단한 절대부등식을 증명할 수 있다."},{"교":"수학","c":"10공수2-03-01","과":"공통수학2","학":"고1","영":"함수와 그래프","p":"함수의 개념을 설명하고, 그 그래프를 이해한다.","h":["함수의 개념은 중학교에서 학습한 내용을 확장하여 주어진 두 집합 사이의 대응 관계로 이해하게 한다."]},{"교":"수학","c":"10공수2-03-02","과":"공통수학2","학":"고1","영":"함수와 그래프","p":"함수의 합성을 설명하고, 합성함수를 구할 수 있다."},{"교":"수학","c":"10공수2-03-03","과":"공통수학2","학":"고1","영":"함수와 그래프","p":"역함수의 개념을 설명하고, 역함수를 구할 수 있다."},{"교":"수학","c":"10공수2-03-04","과":"공통수학2","학":"고1","영":"함수와 그래프","p":"유리함수 $y= {ax+b} over {cx+d}$의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.","h":["유리식은 유리함수의 의미를 이해할 수 있을 정도로 간단히 다루고, 유리함수는 $y= {ax+b} over {cx+d}$의 기본적인 형태를 중심으로 간단한 문제만 다룬다."]},{"교":"수학","c":"10공수2-03-05","과":"공통수학2","학":"고1","영":"함수와 그래프","p":"무리함수 $y= sqrt {ax+b} +c$의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.","h":["무리식은 무리함수의 의미를 이해할 수 있을 정도로 간단히 다루고, 무리함수는 $y= sqrt {ax+b~} +c`$의 기본적인 형태를 중심으로 간단한 문제만 다룬다."]},{"교":"수학","c":"10기수1-01-01","과":"기본수학1","학":"고1","영":"다항식","p":"다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다.","h":["다항식의 덧셈과 뺄셈은 일차식의 덧셈과 뺄셈으로부터 시작하여, 이차식, 삼차식 등으로 점진적으로 제시하되, 그 계산 원리를 이해하게 하고 간단한 다항식의 덧셈과 뺄셈을 다룬다."]},{"교":"수학","c":"10기수1-01-02","과":"기본수학1","학":"고1","영":"다항식","p":"다항식의 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다.","h":["다항식의 곱셈은 중학교에서 다루는 (단항식)×(다항식)의 원리를 이해하고 계산하는 것으로부터 분배법칙을 이용하여 (1차 다항식)×(2차 이하의 다항식)을 하는 정도로 간단히 다룬다. 다항식의 나눗셈은 중학교에서 다루는 (다항식)÷(단항식)의 원리를 이해하고, (3차 이하의 다항식)÷(1차 다항식)을 하는 정도로 그 몫이 다항식이 되는 경우만 다룬다."]},{"교":"수학","c":"10기수1-01-03","과":"기본수학1","학":"고1","영":"다항식","p":"인수분해 공식을 이용하여 다항식의 인수분해를 할 수 있다.","h":["다항식의 인수분해는 다음의 인수분해 공식을 이용하는 간단한 수준으로 다룬다.  $ma+mb=m(a+b)$ $a ^{2} +2ab+b ^{2} =(a+b) ^{2}$ $a ^{2} -2ab+b ^{2} =(a-b) ^{2}$ $a ^{2} -b ^{2} =(a+b)(a-b)$ $x ^{2} +(a+b)x+ab=(x+a)(x+b)$ $acx ^{2} +(ad+bc)x+bd=(ax+b)(cx+d)$ $a^3 + 3a^2 b + 3 a b^2 + b^3 = (a + b )^3$ $a^3 - 3a^2 b + 3 a b^2 - b^3 = (a - b )^3$ $a^3 + b^3 = ( a + b ) ( a^2 - ab + b^2 )$ $a^3 - b^3 = ( a - b ) ( a^2 + ab + b^2 )$"]},{"교":"수학","c":"10기수1-02-01","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"간단한 이차방정식을 풀 수 있다.","h":["이차방정식은 인수분해, 제곱근, 근의 공식을 이용하는 간단한 경우만을 다루되, 그 해가 실근인 것만 다룬다."]},{"교":"수학","c":"10기수1-02-02","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"이차방정식에서 판별식을 이해하고, 근의 존재성을 판단할 수 있다.","h":["이차방정식에서 판별식의 부호가 음수일 경우에는 근이 존재하지 않음을 이해하게 한다."]},{"교":"수학","c":"10기수1-02-03","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"이차함수의 뜻을 알고, 이차함수의 그래프의 성질을 설명할 수 있다."},{"교":"수학","c":"10기수1-02-04","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"이차방정식과 이차함수를 연결하여 그 관계를 이해한다."},{"교":"수학","c":"10기수1-02-05","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"이차함수의 최대, 최소를 이해하고, 간단한 문제를 해결할 수 있다.","h":["이차함수의 최대, 최소는 실수 전체의 범위뿐만 아니라 제한된 범위에서의 최댓값과 최솟값을 구할 수 있게 한다."]},{"교":"수학","c":"10기수1-02-06","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"부등식의 성질을 설명하고, 일차부등식을 풀 수 있다."},{"교":"수학","c":"10기수1-02-07","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"미지수가 1개인 연립일차부등식을 풀 수 있다."},{"교":"수학","c":"10기수1-02-08","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"절댓값을 포함한 간단한 일차부등식을 풀 수 있다.","h":["한 개의 절댓값을 포함한 일차부등식만 다룬다."]},{"교":"수학","c":"10기수1-02-09","과":"기본수학1","학":"고1","영":"방정식과 부등식","p":"이차부등식과 이차함수를 연결하여 그 관계를 이해하고, 간단한 이차부등식을 풀 수 있다."},{"교":"수학","c":"10기수1-03-01","과":"기본수학1","학":"고1","영":"경우의 수","p":"합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다.","h":["합의 법칙과 곱의 법칙은 각각 두 사건에 대해서만 다루며, 특히 합의 법칙과 관련하여 두 사건이 동시에 일어나지 않는 경우만 다룬다."]},{"교":"수학","c":"10기수1-03-02","과":"기본수학1","학":"고1","영":"경우의 수","p":"순열의 개념을 이해하고, 순열의 수를 구할 수 있다."},{"교":"수학","c":"10기수1-03-03","과":"기본수학1","학":"고1","영":"경우의 수","p":"조합의 개념을 이해하고, 조합의 수를 구할 수 있다."},{"교":"수학","c":"10기수1-04-01","과":"기본수학1","학":"고1","영":"행렬","p":"행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."},{"교":"수학","c":"10기수1-04-02","과":"기본수학1","학":"고1","영":"행렬","p":"행렬의 연산을 수행하고, 간단한 문제를 해결할 수 있다.","h":["행렬의 연산에서는 행렬의 덧셈, 뺄셈, 실수배 및 곱셈을 다루고, 행과 열의 수가 각각 2를 넘지 않는 범위에서 행렬의 곱셈을 할 수 있게 한다."]},{"교":"수학","c":"10기수2-01-01","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"두 점 사이의 거리를 계산할 수 있다."},{"교":"수학","c":"10기수2-01-02","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"직선의 방정식을 구하고, 그래프를 그릴 수 있다."},{"교":"수학","c":"10기수2-01-03","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"두 직선의 평행 조건과 수직 조건을 이해하고, 관련된 문제를 해결할 수 있다."},{"교":"수학","c":"10기수2-01-04","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"원의 방정식을 구하고, 그래프를 그릴 수 있다."},{"교":"수학","c":"10기수2-01-05","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"좌표평면에서 원과 직선의 위치 관계를 판단할 수 있다."},{"교":"수학","c":"10기수2-01-06","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"평행이동을 이해하고, 실생활과 연결할 수 있다."},{"교":"수학","c":"10기수2-01-07","과":"기본수학2","학":"고1","영":"도형의 방정식","p":"원점, $x$축, $y$축, 직선 $y=x$에 대한 대칭이동을 이해하고, 실생활과 연결할 수 있다."},{"교":"수학","c":"10기수2-02-01","과":"기본수학2","학":"고1","영":"집합과 명제","p":"집합의 개념을 이해하고, 집합을 표현할 수 있다."},{"교":"수학","c":"10기수2-02-02","과":"기본수학2","학":"고1","영":"집합과 명제","p":"두 집합 사이의 포함관계를 판단할 수 있다."},{"교":"수학","c":"10기수2-02-03","과":"기본수학2","학":"고1","영":"집합과 명제","p":"두 집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다.","h":["집합의 연산은 두 집합의 합집합, 교집합, 여집합, 차집합의 개념을 다루고, 집합의 연산에 관한 교환법칙, 결합법칙, 분배법칙, 드모르간의 법칙은 다루지 않는다."]},{"교":"수학","c":"10기수2-02-04","과":"기본수학2","학":"고1","영":"집합과 명제","p":"명제와 조건의 뜻을 알고, 이를 설명할 수 있다.","h":["명제와 조건의 뜻은 수학적인 문장을 이해하는 수준에서 간단히 다룬다."]},{"교":"수학","c":"10기수2-02-05","과":"기본수학2","학":"고1","영":"집합과 명제","p":"명제의 역과 대우를 이해하고 설명할 수 있다.","h":["간단한 예를 통해 명제의 역, 대우를 이해할 수 있게 한다."]},{"교":"수학","c":"10기수2-03-01","과":"기본수학2","학":"고1","영":"함수와 그래프","p":"함수의 개념을 설명하고, 그 그래프를 이해한다.","h":["함수의 개념은 중학교에서 학습한 내용을 확장하여 주어진 두 집합 사이의 대응 관계로 이해하게 한다."]},{"교":"수학","c":"10기수2-03-02","과":"기본수학2","학":"고1","영":"함수와 그래프","p":"함수의 합성을 이해하고, 합성함수를 구할 수 있다."},{"교":"수학","c":"10기수2-03-03","과":"기본수학2","학":"고1","영":"함수와 그래프","p":"역함수의 개념을 이해하고, 역함수를 구할 수 있다."},{"교":"수학","c":"10기수2-03-04","과":"기본수학2","학":"고1","영":"함수와 그래프","p":"유리함수 $y=` {k} over {x}$의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.","h":["유리식은 유리함수의 의미를 이해할 수 있을 정도로 간단히 다루고, 유리함수는 $y= {k} over {x}$ 형태만 다룬다."]},{"교":"수학","c":"10기수2-03-05","과":"기본수학2","학":"고1","영":"함수와 그래프","p":"무리함수 $y= sqrt {kx}$의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.","h":["무리식은 무리함수의 의미를 이해할 수 있을 정도로 간단히 다루고, 무리함수는 $y= sqrt {kx}$ 형태만 다룬다."]},{"교":"수학","c":"12대수01-01","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"거듭제곱과 거듭제곱근의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다."},{"교":"수학","c":"12대수01-02","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"지수가 유리수, 실수까지 확장될 수 있음을 이해하고, 이를 설명할 수 있다.","h":["지수가 유리수 및 실수인 경우는 밑이 양수인 조건이 필요함을 이해하게 한다. 지수가 실수인 경우는 직관적으로 다룬다."]},{"교":"수학","c":"12대수01-03","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"지수법칙을 이해하고, 이를 이용하여 식을 간단히 나타낼 수 있다."},{"교":"수학","c":"12대수01-04","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"로그의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다.","h":["로그의 성질은 지수의 성질과 관련지어 이해하게 한다."]},{"교":"수학","c":"12대수01-05","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"상용로그를 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."},{"교":"수학","c":"12대수01-06","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"지수함수와 로그함수의 뜻을 알고, 이를 설명할 수 있다."},{"교":"수학","c":"12대수01-07","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"지수함수와 로그함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다.","h":["지수함수와 로그함수는 역함수 관계임을 그래프를 통해 확인하게 한다."]},{"교":"수학","c":"12대수01-08","과":"대수","학":"고2~3","영":"지수함수와 로그함수","p":"지수함수, 로그함수를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12대수02-01","과":"대수","학":"고2~3","영":"삼각함수","p":"일반각과 호도법의 뜻을 알고, 그 관계를 설명할 수 있다."},{"교":"수학","c":"12대수02-02","과":"대수","학":"고2~3","영":"삼각함수","p":"삼각함수의 개념을 이해하여 사인함수, 코사인함수, 탄젠트함수의 그래프를 그리고, 그 성질을 설명할 수 있다.","h":["삼각함수의 개념은 중학교에서 학습한 삼각비와 연계하여 이해하게 하며, 삼각함수의 성질은 삼각함수의 그래프의 성질을 이해하는 데 필요한 정도로 간단히 다룬다."]},{"교":"수학","c":"12대수02-03","과":"대수","학":"고2~3","영":"삼각함수","p":"사인법칙과 코사인법칙을 이해하고, 실생활 문제를 해결할 수 있다.","h":["사인법칙과 코사인법칙을 이용하여 삼각형의 각의 크기와 변의 길이 사이의 관계를 이해하고 삼각형의 넓이를 다양한 방법으로 구할 수 있게 한다."]},{"교":"수학","c":"12대수03-01","과":"대수","학":"고2~3","영":"수열","p":"수열의 뜻을 설명할 수 있다."},{"교":"수학","c":"12대수03-02","과":"대수","학":"고2~3","영":"수열","p":"등차수열의 뜻을 알고, 일반항, 첫째항부터 제$n$항까지의 합을 구할 수 있다."},{"교":"수학","c":"12대수03-03","과":"대수","학":"고2~3","영":"수열","p":"등비수열의 뜻을 알고, 일반항, 첫째항부터 제$n$항까지의 합을 구할 수 있다."},{"교":"수학","c":"12대수03-04","과":"대수","학":"고2~3","영":"수열","p":"$SMALLSUM$의 뜻과 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12대수03-05","과":"대수","학":"고2~3","영":"수열","p":"여러 가지 수열의 첫째항부터 제$n$항까지의 합을 구하는 방법을 설명할 수 있다.","h":["여러 가지 수열의 합에서는 자연수의 거듭제곱의 합 $sum _{k=1} ^{n} k$, $sum _{k=1} ^{n} k ^{2}$, $sum _{k=1} ^{n} `k ^{3} `$과 수열의 합이 간단한 것만 다룬다."]},{"교":"수학","c":"12대수03-06","과":"대수","학":"고2~3","영":"수열","p":"수열의 귀납적 정의를 설명할 수 있다."},{"교":"수학","c":"12대수03-07","과":"대수","학":"고2~3","영":"수열","p":"수학적 귀납법의 원리를 이해하고, 이를 이용하여 명제를 증명할 수 있다.","h":["수학적 귀납법을 이용한 증명은 원리를 이해할 수 있는 정도로 간단히 다룬다."]},{"교":"수학","c":"12미적Ⅰ-01-01","과":"미적분Ⅰ","학":"고2~3","영":"함수의 극한과 연속","p":"함수의 극한의 뜻을 알고, 이를 설명할 수 있다."},{"교":"수학","c":"12미적Ⅰ-01-02","과":"미적분Ⅰ","학":"고2~3","영":"함수의 극한과 연속","p":"함수의 극한에 대한 성질을 이해하고, 함수의 극한값을 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-01-03","과":"미적분Ⅰ","학":"고2~3","영":"함수의 극한과 연속","p":"함수의 연속을 극한으로 탐구하고 이해한다."},{"교":"수학","c":"12미적Ⅰ-01-04","과":"미적분Ⅰ","학":"고2~3","영":"함수의 극한과 연속","p":"연속함수의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다.","h":["연속함수의 성질을 이용하여 함수의 최대⋅최소 정리, 사잇값 정리 등을 이해하게 한다."]},{"교":"수학","c":"12미적Ⅰ-02-01","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"미분계수를 이해하고, 이를 구할 수 있다.","h":["미분계수의 뜻을 알고, 그 기하학적 의미를 이해하게 한다."]},{"교":"수학","c":"12미적Ⅰ-02-02","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수의 미분가능성과 연속성의 관계를 설명하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-03","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수 $y=x^n$($n$은 양의 정수)의 도함수를 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-04","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수의 실수배, 합, 차, 곱의 미분법을 알고, 다항함수의 도함수를 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-05","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"미분계수와 접선의 기울기의 관계를 이해하고, 접선의 방정식을 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-06","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수에 대한 평균값 정리를 설명하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-07","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수의 증가와 감소, 극대와 극소를 판정하고 설명할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-08","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"함수의 그래프의 개형을 그릴 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-09","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"방정식과 부등식에 대한 문제를 해결할 수 있다."},{"교":"수학","c":"12미적Ⅰ-02-10","과":"미적분Ⅰ","학":"고2~3","영":"미분","p":"미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다.","h":["속도와 가속도에 대한 문제는 직선 운동에 한하여 다룬다."]},{"교":"수학","c":"12미적Ⅰ-03-01","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"부정적분의 뜻을 알고, 이를 설명할 수 있다."},{"교":"수학","c":"12미적Ⅰ-03-02","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"함수의 실수배, 합, 차의 부정적분을 알고, 다항함수의 부정적분을 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-03-03","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"정적분의 개념을 탐구하고, 그 성질을 이해한다.","h":["닫힌구간 $left[ a,``b right]`$에서 연속함수 $f(x)`$의 함숫값이 음이 아닌 경우 함수  $f(x)`$의 그래프와 $x`$축으로 둘러싸인 도형의 넓이를 $f(x)`$의 $a`$에서 $b`$까지의 정적분이라 하고, 이를 일반적인 연속함수에 대한 정적분의 정의로 확장한다."]},{"교":"수학","c":"12미적Ⅰ-03-04","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"부정적분과 정적분의 관계를 이해하고, 다항함수의 정적분을 구할 수 있다."},{"교":"수학","c":"12미적Ⅰ-03-05","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."},{"교":"수학","c":"12미적Ⅰ-03-06","과":"미적분Ⅰ","학":"고2~3","영":"적분","p":"적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다.","h":["위치, 속도, 거리 등에 대한 문제는 직선 운동에 한하여 다룬다."]},{"교":"수학","c":"12확통01-01","과":"확률과 통계","학":"고2~3","영":"경우의 수","p":"중복순열, 같은 것이 있는 순열을 이해하고, 그 순열의 수를 구하는 방법을 설명할 수 있다.","h":["중복순열, 같은 것이 있는 순열 등을 이해하는 과정에서 필요한 경우, <공통수학1>의 경우의 수와 연계되는 내용은 간단히 다룰 수 있다."]},{"교":"수학","c":"12확통01-02","과":"확률과 통계","학":"고2~3","영":"경우의 수","p":"중복조합을 이해하고, 중복조합의 수를 구하는 방법을 설명할 수 있다.","h":["중복조합을 이해하는 과정에서 필요한 경우, <공통수학1>의 경우의 수와 연계되는 내용은 간단히 다룰 수 있다."]},{"교":"수학","c":"12확통01-03","과":"확률과 통계","학":"고2~3","영":"경우의 수","p":"이항정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12확통02-01","과":"확률과 통계","학":"고2~3","영":"확률","p":"확률의 개념을 이해하고 기본 성질을 설명할 수 있다.","h":["확률 개념을 도입할 때 수학적 확률과 통계적 확률을 사용하며, 중학교에서 학습한 확률과 연계되는 내용은 필요한 경우에만 간단히 다룬다."]},{"교":"수학","c":"12확통02-02","과":"확률과 통계","학":"고2~3","영":"확률","p":"확률의 덧셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12확통02-03","과":"확률과 통계","학":"고2~3","영":"확률","p":"여사건의 확률을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12확통02-04","과":"확률과 통계","학":"고2~3","영":"확률","p":"조건부확률을 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."},{"교":"수학","c":"12확통02-05","과":"확률과 통계","학":"고2~3","영":"확률","p":"사건의 독립과 종속을 이해하고, 이를 판단할 수 있다."},{"교":"수학","c":"12확통02-06","과":"확률과 통계","학":"고2~3","영":"확률","p":"확률의 곱셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12확통03-01","과":"확률과 통계","학":"고2~3","영":"통계","p":"확률변수와 확률분포의 뜻을 설명할 수 있다."},{"교":"수학","c":"12확통03-02","과":"확률과 통계","학":"고2~3","영":"통계","p":"이산확률변수의 기댓값(평균)과 표준편차를 구할 수 있다."},{"교":"수학","c":"12확통03-03","과":"확률과 통계","학":"고2~3","영":"통계","p":"이항분포의 뜻과 성질을 이해하고, 평균과 표준편차를 구할 수 있다."},{"교":"수학","c":"12확통03-04","과":"확률과 통계","학":"고2~3","영":"통계","p":"정규분포의 뜻과 성질을 이해하고, 이항분포와의 관계를 설명할 수 있다."},{"교":"수학","c":"12확통03-05","과":"확률과 통계","학":"고2~3","영":"통계","p":"모집단과 표본의 뜻을 알고, 표본추출의 방법을 설명할 수 있다.","h":["표본추출이 모집단의 성질을 예측하는 기본조건임을 이해하게 한다. 표본의 추출방법을 임의추출로 제한하고 구체적인 예로 간단히 다룬다."]},{"교":"수학","c":"12확통03-06","과":"확률과 통계","학":"고2~3","영":"통계","p":"표본평균과 모평균, 표본비율과 모비율의 관계를 이해하고 설명할 수 있다.","h":["표본평균 및 표본비율은 추출한 표본에 따라 다른 값을 가질 수 있는 확률변수임을 알게 하고, 모평균 및 모비율의 추정에 관한 수학적 원리를 이해하게 한다. 모평균 추정은 모집단의 분포가 정규분포인 경우만 다루고, 모비율의 추정은 표본의 크기가 큰 경우만 다룬다."]},{"교":"수학","c":"12확통03-07","과":"확률과 통계","학":"고2~3","영":"통계","p":"공학 도구를 이용하여 모평균 및 모비율을 추정하고 그 결과를 해석할 수 있다.","h":["공학 도구를 이용하여 실생활 자료에서 모평균 또는 모비율을 추정하고, 그 결과를 해석하는 과정을 통해 유용성을 인식할 수 있다."]},{"교":"수학","c":"12미적Ⅱ-01-01","과":"미적분Ⅱ","학":"고2~3","영":"수열의 극한","p":"수열의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."},{"교":"수학","c":"12미적Ⅱ-01-02","과":"미적분Ⅱ","학":"고2~3","영":"수열의 극한","p":"수열의 극한에 대한 성질을 이해하고, 이를 활용하여 극한값을 구하는 방법을 설명할 수 있다."},{"교":"수학","c":"12미적Ⅱ-01-03","과":"미적분Ⅱ","학":"고2~3","영":"수열의 극한","p":"등비수열의 수렴, 발산을 판정하고, 수렴하는 경우 그 극한값을 구할 수 있다."},{"교":"수학","c":"12미적Ⅱ-01-04","과":"미적분Ⅱ","학":"고2~3","영":"수열의 극한","p":"급수의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."},{"교":"수학","c":"12미적Ⅱ-01-05","과":"미적분Ⅱ","학":"고2~3","영":"수열의 극한","p":"등비급수의 합을 구하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-01","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"지수함수와 로그함수의 극한을 구하고 미분할 수 있다.","h":["지수함수와 로그함수의 극한은 지수함수 $e ^{x}$와 로그함수 $lnx$의 도함수를 구하는 데 필요한 정도로 간단히 다룬다."]},{"교":"수학","c":"12미적Ⅱ-02-02","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"삼각함수의 덧셈정리를 설명하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-03","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"삼각함수의 극한을 구하고, 사인함수와 코사인함수를 미분할 수 있다.","h":["삼각함수의 극한은 삼각함수 $sinx$, $cosx`$의 도함수를 구하는 데 필요한 정도로 간단히 다룬다."]},{"교":"수학","c":"12미적Ⅱ-02-04","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"함수의 몫을 미분할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-05","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"합성함수를 미분할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-06","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"매개변수로 나타낸 함수를 미분할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-07","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"음함수와 역함수를 미분할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-08","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"다양한 곡선의 접선의 방정식을 구할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-09","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"함수의 그래프의 개형을 그릴 수 있다.","h":["위로 볼록, 아래로 볼록과 변곡점을 설명하기 위해 이계도함수의 기하적 의미를 다룬다."]},{"교":"수학","c":"12미적Ⅱ-02-10","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"방정식과 부등식에 대한 문제를 해결할 수 있다."},{"교":"수학","c":"12미적Ⅱ-02-11","과":"미적분Ⅱ","학":"고2~3","영":"미분법","p":"미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-01","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"$y=x ^{n} `$($n`$은 실수), 지수함수, 삼각함수의 부정적분과 정적분을 구할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-02","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"치환적분법을 이해하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-03","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"부분적분법을 이해하고, 이를 활용할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-04","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"정적분과 급수의 합 사이의 관계를 탐구하고 이해한다."},{"교":"수학","c":"12미적Ⅱ-03-05","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-06","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"입체도형의 부피에 대한 문제를 해결할 수 있다."},{"교":"수학","c":"12미적Ⅱ-03-07","과":"미적분Ⅱ","학":"고2~3","영":"적분법","p":"적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"교":"수학","c":"12기하01-01","과":"기하","학":"고2~3","영":"이차곡선","p":"포물선의 뜻을 알고, 포물선을 방정식으로 표현할 수 있다."},{"교":"수학","c":"12기하01-02","과":"기하","학":"고2~3","영":"이차곡선","p":"타원의 뜻을 알고, 타원을 방정식으로 표현할 수 있다."},{"교":"수학","c":"12기하01-03","과":"기하","학":"고2~3","영":"이차곡선","p":"쌍곡선의 뜻을 알고, 쌍곡선을 방정식으로 표현할 수 있다."},{"교":"수학","c":"12기하01-04","과":"기하","학":"고2~3","영":"이차곡선","p":"이차곡선의 접선의 방정식을 구할 수 있다.","h":["이차곡선의 접선의 방정식은 이차방정식의 판별식을 이용하여 구하게 한다."]},{"교":"수학","c":"12기하02-01","과":"기하","학":"고2~3","영":"공간도형과 공간좌표","p":"직선과 직선, 직선과 평면, 평면과 평면의 위치 관계에 대한 간단한 증명을 할 수 있다."},{"교":"수학","c":"12기하02-02","과":"기하","학":"고2~3","영":"공간도형과 공간좌표","p":"삼수선 정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"12기하02-03","과":"기하","학":"고2~3","영":"공간도형과 공간좌표","p":"도형의 정사영의 뜻을 알고, 도형과 정사영의 관계를 탐구할 수 있다."},{"교":"수학","c":"12기하02-04","과":"기하","학":"고2~3","영":"공간도형과 공간좌표","p":"좌표공간에서 두 점 사이의 거리와 선분의 내분점의 좌표를 구할 수 있다.","h":["좌표공간에서 점의 좌표를 구하는 원리를 이해하고, 두 점 사이의 거리와 내분점의 좌표가 구성되는 원리를 좌표공간으로 확장하게 한다. 평면에서 공간으로 차원을 확장하는 것에 대해 흥미를 갖게 한다."]},{"교":"수학","c":"12기하02-05","과":"기하","학":"고2~3","영":"공간도형과 공간좌표","p":"구를 방정식으로 표현할 수 있다."},{"교":"수학","c":"12기하03-01","과":"기하","학":"고2~3","영":"벡터","p":"벡터의 뜻을 알고, 벡터의 덧셈, 뺄셈, 실수배를 할 수 있다."},{"교":"수학","c":"12기하03-02","과":"기하","학":"고2~3","영":"벡터","p":"위치벡터의 뜻을 알고, 벡터와 좌표를 대응시켜 표현할 수 있다.","h":["벡터를 표현하고 탐구하는 방법에는 화살표를 이용한 기하적 방법과 좌표를 이용한 대수적 방법이 있음을 인식하게 한다."]},{"교":"수학","c":"12기하03-03","과":"기하","학":"고2~3","영":"벡터","p":"내적의 뜻을 알고, 두 벡터의 내적을 구할 수 있다."},{"교":"수학","c":"12기하03-04","과":"기하","학":"고2~3","영":"벡터","p":"벡터를 이용하여 직선의 방정식을 구할 수 있다.","h":["좌표평면과 좌표공간에서 직선을 벡터를 이용한 방정식으로 간결하게 표현할 수 있음을 알게 한다."]},{"교":"수학","c":"12기하03-05","과":"기하","학":"고2~3","영":"벡터","p":"좌표공간에서 벡터를 이용하여 평면의 방정식과 구의 방정식을 구할 수 있다.","h":["좌표공간에서 평면과 구를 벡터를 이용한 방정식으로 간결하게 표현할 수 있음을 알게 한다."]},{"교":"수학","c":"12경수01-01","과":"경제 수학","학":"고2~3","영":"수와 경제","p":"통계 자료를 활용하여 경제지표의 의미를 이해하고, 경제지표의 변화를 설명할 수 있다.","h":["경제지표는 실생활 속에서 흔히 접할 수 있는 자료에 대하여 조건과 상황을 단순화하여 다룬다. 경제지표의 변화를 수학 용어, 기호, 수식, 표, 그래프 등을 사용하여 설명함으로써 수학적 표현의 편리함을 인식하게 한다."]},{"교":"수학","c":"12경수01-02","과":"경제 수학","학":"고2~3","영":"수와 경제","p":"환율과 관련된 실생활 문제를 해결할 수 있다."},{"교":"수학","c":"12경수01-03","과":"경제 수학","학":"고2~3","영":"수와 경제","p":"세금과 관련된 실생활 문제를 해결할 수 있다."},{"교":"수학","c":"12경수01-04","과":"경제 수학","학":"고2~3","영":"수와 경제","p":"단리와 복리를 이용하여 이자와 원리합계를 구하고, 미래에 받을 금액의 현재가치를 구할 수 있다.","h":["동일한 상황에서 단리와 복리를 적용할 때 이자와 원리합계가 어떻게 달라지는지 확인하게 한다. 또한 동일한 금액이라도 받거나 지급하는 시점이 현재인 경우와 미래인 경우 그 가치가 다를 수 있음을 이해하게 한다."]},{"교":"수학","c":"12경수01-05","과":"경제 수학","학":"고2~3","영":"수와 경제","p":"연금의 뜻을 알고, 연금의 현재가치를 구할 수 있다.","h":["미래의 각 시점마다 동일하게 받게 되는 금액의 현재가치가 등비수열로 표현되고 이들의 총합인 연금의 현재가치가 등비수열의 합이나 등비급수로 계산될 수 있음을 다룬다."]},{"교":"수학","c":"12경수02-01","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"여러 가지 경제 현상을 함수로 나타낼 수 있다."},{"교":"수학","c":"12경수02-02","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"함수와 그래프를 활용하여 수요곡선과 공급곡선의 의미를 탐구하고 이해한다."},{"교":"수학","c":"12경수02-03","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"효용의 의미를 이해하고, 효용을 함수와 그래프로 나타낼 수 있다."},{"교":"수학","c":"12경수02-04","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"수요와 공급의 상호 작용에 의해 균형가격이 결정되는 경제 현상을 설명할 수 있다."},{"교":"수학","c":"12경수02-05","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"세금과 소득의 변화가 균형가격에 미치는 영향을 탐구하고 이해한다.","h":["세금과 소득의 변화에 따른 균형가격의 변화는 그래프의 평행이동을 이용하여 분석하게 한다."]},{"교":"수학","c":"12경수02-06","과":"경제 수학","학":"고2~3","영":"함수와 경제","p":"부등식의 영역의 개념을 이해하고, 이를 활용하여 경제 현상의 문제를 해결할 수 있다.","h":["부등식의 영역에서 $(x+y)(x-y)>0$과 같이 다항식의 곱으로 표현된 것은 다루지 않는다. 부등식의 영역과 관련하여 최대, 최소를 구할 때, 경제 관련 함수는 일차식만 다룬다."]},{"교":"수학","c":"12경수03-01","과":"경제 수학","학":"고2~3","영":"행렬과 경제","p":"여러 가지 경제 현상을 행렬로 나타내고, 연산할 수 있다.","h":["경제지표나 통계 자료 등을 활용하여 여러 가지 경제 현상을 $m TIMES n$행렬로 표현하고 행렬의 덧셈, 뺄셈, 실수배, 곱셈을 수행하여 경제 현상 속에서 행렬의 연산이 의미하는 바를 이해하게 한다."]},{"교":"수학","c":"12경수03-02","과":"경제 수학","학":"고2~3","영":"행렬과 경제","p":"역행렬의 뜻을 알고, $2 TIMES 2$ 행렬의 역행렬을 구할 수 있다."},{"교":"수학","c":"12경수03-03","과":"경제 수학","학":"고2~3","영":"행렬과 경제","p":"행렬의 연산과 역행렬을 활용하여 경제 현상의 문제를 해결할 수 있다."},{"교":"수학","c":"12경수04-01","과":"경제 수학","학":"고2~3","영":"미분과 경제","p":"미분의 개념을 이해하고 경제 현상을 나타내는 함수를 미분할 수 있다.","h":["함수의 극한 개념과 극한값에 관한 성질은 직관적 수준으로 다룬다. 미분계수는 접선의 기울기로 도입하고 함수의 미분가능성은 다루지 않는다."]},{"교":"수학","c":"12경수04-02","과":"경제 수학","학":"고2~3","영":"미분과 경제","p":"미분을 이용하여 그래프의 개형을 탐구하고 해석할 수 있다."},{"교":"수학","c":"12경수04-03","과":"경제 수학","학":"고2~3","영":"미분과 경제","p":"미분을 활용하여 탄력성의 의미를 탐구하고 이해한다."},{"교":"수학","c":"12경수04-04","과":"경제 수학","학":"고2~3","영":"미분과 경제","p":"미분을 활용하여 경제 현상의 최적화 문제를 해결할 수 있다.","h":["여러 독립변수들의 관계로 표현되는 함수는 특정 변수들을 고정하여 일변수함수로 바꾸어 다룬다. 효용함수를 이용한 소비자의 의사 결정, 생산함수를 이용한 생산자의 의사 결정 등과 같은 문제를 다룸으로써 경제 주체로서 합리적으로 의사 결정하는 태도를 갖게 하여 민주 시민으로서의 소양을 함양하게 한다."]},{"교":"수학","c":"12인수01-01","과":"인공지능 수학","학":"고2~3","영":"인공지능과 빅데이터","p":"인공지능의 개념을 이해하고 학습 방식을 수학적으로 해석할 수 있다.","h":["기계학습에서 지도학습, 비지도학습, 강화학습의 특성을 소개하고, 딥러닝에서 퍼셉트론의 가중치와 활성화함수의 의미를 이해하게 한다."]},{"교":"수학","c":"12인수01-02","과":"인공지능 수학","학":"고2~3","영":"인공지능과 빅데이터","p":"인공지능에서 수학을 활용한 역사적 사례를 탐구하고 설명할 수 있다.","h":["논리합(OR), 논리곱(AND), 배타적논리합(XOR)과 같은 논리 연산을 진리표를 사용하여 소개하고, 다층퍼셉트론으로 배타적논리합(XOR) 문제를 해결하는 과정을 이해하게 한다. 실생활 예제를 활용하여 전문가시스템의 규칙 기반 표현 방법과 추론 과정을 설명하게 한다."]},{"교":"수학","c":"12인수01-03","과":"인공지능 수학","학":"고2~3","영":"인공지능과 빅데이터","p":"빅데이터의 개념과 특성을 알고 인공지능에서 빅데이터를 활용한 사례를 찾을 수 있다.","h":["빅데이터의 수집 및 분석과정과 이를 인공지능에서 활용한 사례를 소개하고, 데이터 활용에서 발생할 수 있는 편향성을 고려하여 공정성을 추구할 수 있게 한다."]},{"교":"수학","c":"12인수02-01","과":"인공지능 수학","학":"고2~3","영":"텍스트 데이터 처리","p":"집합과 벡터를 이용하여 텍스트 데이터를 목적에 맞게 표현할 수 있다.","h":["실생활의 텍스트 데이터에서 불용어를 제거하여 단어 집합을 만들고, 이를 벡터를 이용하여 표현하게 한다."]},{"교":"수학","c":"12인수02-02","과":"인공지능 수학","학":"고2~3","영":"텍스트 데이터 처리","p":"빈도수 벡터를 이용하여 텍스트 데이터를 요약하고 유용한 정보를 추출할 수 있다.","h":["빈도수 기반의 단어가방(Bag of Words)모형을 활용하여 텍스트 데이터를 요약하게 한다. 또한 TF-IDF(Term Frequency - Inverse Document Frequency) 등을 사용하여 텍스트에서 유용한 정보를 추출하게 한다. 역문서빈도(IDF)는 문서빈도(DF)의 역수로 표현하게 한다."]},{"교":"수학","c":"12인수02-03","과":"인공지능 수학","학":"고2~3","영":"텍스트 데이터 처리","p":"인공지능이 텍스트를 특성에 따라 분석하는 수학적 방법을 설명할 수 있다.","h":["영화 리뷰, 기사 등 다양한 텍스트 데이터의 감성 정보를 분석하고, 텍스트들 사이의 유사한 정도를 분석하게 한다. 이때 유클리드 유사도, 코사인 유사도, 자카드 유사도 등을 다룰 수 있다. 코사인 유사도에서 내적과 관련된 용어 및 기호는 사용하지 않는다."]},{"교":"수학","c":"12인수03-01","과":"인공지능 수학","학":"고2~3","영":"이미지 데이터 처리","p":"행렬을 이용하여 이미지 데이터를 목적에 맞게 표현할 수 있다.","h":["이미지 데이터의 각 픽셀 위치와 색상 정보(RGB)를 행렬을 이용하여 표현하게 한다."]},{"교":"수학","c":"12인수03-02","과":"인공지능 수학","학":"고2~3","영":"이미지 데이터 처리","p":"행렬의 연산을 이용하여 이미지 데이터를 다양하게 변환할 수 있다.","h":["이미지의 구도, 색상, 휘도, 밝기, 선명도 등을 행렬의 연산을 활용하여 다양하게 변환하게 한다. 이때 회전변환은 다루지 않는다."]},{"교":"수학","c":"12인수03-03","과":"인공지능 수학","학":"고2~3","영":"이미지 데이터 처리","p":"인공지능이 이미지를 자동으로 분류하는 수학적 방법을 설명할 수 있다.","h":["개와 고양이의 사진을 구별하거나 손글씨를 인식하는 문제 등을 다룬다. 행렬의 유사도를 위해 해밍 거리(Hamming distance) 등을 사용하게 한다."]},{"교":"수학","c":"12인수04-01","과":"인공지능 수학","학":"고2~3","영":"예측과 최적화","p":"데이터를 분석하여 사건이 일어날 확률을 구하고 이를 예측에 이용할 수 있다.","h":["확률의 계산은 상대도수를 활용하게 하며, 조건부확률의 용어와 기호는 다루지 않는다."]},{"교":"수학","c":"12인수04-02","과":"인공지능 수학","학":"고2~3","영":"예측과 최적화","p":"공학 도구를 사용하여 데이터의 경향성을 추세선으로 나타내고 이를 예측에 이용할 수 있다.","h":["다양한 추세선의 비교를 통해 최적화된 추세선의 필요성을 인식하게 한다."]},{"교":"수학","c":"12인수04-03","과":"인공지능 수학","학":"고2~3","영":"예측과 최적화","p":"손실함수를 이해하고 최적화된 추세선을 찾을 수 있다.","h":["$y=ax$ 형태의 추세선에 대하여 일변수함수로 정의된 손실함수만을 다룬다."]},{"교":"수학","c":"12인수04-04","과":"인공지능 수학","학":"고2~3","영":"예측과 최적화","p":"경사하강법을 이해하고 최적화된 예측을 위한 인공지능의 학습 방법을 설명할 수 있다.","h":["경사하강법을 다룰 때, 함수의 극한 개념과 미분계수는 직관적으로 이해하게 한다. 손실함수의 최솟값을 구하는 과정에서 경사하강법의 유용성을 인식하게 한다."]},{"교":"수학","c":"12인수05-01","과":"인공지능 수학","학":"고2~3","영":"인공지능과 수학 탐구","p":"수학적 원리를 이용하여 인공지능이 실생활 문제를 합리적으로 해결하는 사례를 찾을 수 있다.","h":["실생활 데이터의 경향성을 바탕으로 최적화된 예측을 통한 합리적 의사 결정 사례를 찾게 한다. 비합리적 의사 결정 사례를 통해 의사 결정의 윤리성을 판단해 보게 하여 민주 시민으로서의 소양을 함양하게 한다."]},{"교":"수학","c":"12인수05-02","과":"인공지능 수학","학":"고2~3","영":"인공지능과 수학 탐구","p":"인공지능과 관련된 수학 주제를 선정하여 탐구할 수 있다.","h":["인공지능에서 사용되는 다양한 수학적 아이디어를 탐색하고, 이를 활용한 탐구 학습 및 프로젝트 학습을 수행하게 하여 수학적 원리에 대한 흥미를 갖게 한다."]},{"교":"수학","c":"12직수01-01","과":"직무 수학","학":"고2~3","영":"수와 연산","p":"직무 상황에서 수 개념과 사칙연산의 문제를 해결하고 그 유용성을 인식할 수 있다.","h":["업무 비용 계산, 예산안 작성, 업무 수행 경비 작성 등과 같은 직무 상황에서 직무를 효과적으로 수행하기 위해 수 개념과 사칙연산을 활용하여 문제를 해결하게 한다. 이 과정에서 다양한 문제해결 방법을 탐색하게 한다."]},{"교":"수학","c":"12직수01-02","과":"직무 수학","학":"고2~3","영":"수와 연산","p":"큰 수를 어림하여 문제를 해결하고, 어림값을 이용하여 수의 크기를 비교할 수 있다.","h":["재무 관리 상황에서 수익, 금액, 가격, 비용 등을 사용할 때 요구되는 큰 수를 어림하여 문제를 해결하게 하고, 올림, 버림, 반올림을 이용한 어림값을 구하여 수의 크기를 파악하게 한다."]},{"교":"수학","c":"12직수01-03","과":"직무 수학","학":"고2~3","영":"수와 연산","p":"시간, 길이, 무게, 들이의 표준 단위를 알고, 단위를 환산할 수 있다.","h":["시간(초, 분, 시), 길이(mm, cm, m, km), 무게(g, kg, t), 들이(mL, L)의 표준 단위와 그 관계를 이해하여 단위 환산을 계산하는 것에 중점을 두게 한다. 직무에서 사용하는 국제단위계가 아닌 인치(in), 피트(ft), 파운드(lb), 온스(oz) 등과 같은 단위를 인식하고 단위 사이의 변환표를 이용하여 계산하게 한다. 또한 국가 간 시차를 이해하여 적용하게 한다."]},{"교":"수학","c":"12직수02-01","과":"직무 수학","학":"고2~3","영":"변화와 관계","p":"비의 개념을 직무 상황에 연결하여 적용할 수 있다.","h":["두 양을 비교할 때 한 양을 기준으로 다른 양이 몇 배가 되는지를 나타내는 비의 개념을 직무 상황에서 파악하게 한다. 단위가격, 단가, 통화의 환율 계산 등과 같은 직무 상황에서 비례식을 적용하여 문제를 해결하게 한다."]},{"교":"수학","c":"12직수02-02","과":"직무 수학","학":"고2~3","영":"변화와 관계","p":"비율을 백분율로 표현할 수 있고 직무 상황에 연결하여 적용할 수 있다.","h":["직무 상황에서 주어진 자료를 파악하여 기준량, 비교하는 양을 찾아 비율을 구하고, 이를 백분율로 표현하게 한다. 손익률, 인상률, 할인율 등을 구하는 상황에서 비율과 백분율을 계산하고 적용하게 한다."]},{"교":"수학","c":"12직수02-03","과":"직무 수학","학":"고2~3","영":"변화와 관계","p":"두 양 사이의 대응 관계를 나타낸 표에서 규칙을 찾아 설명할 수 있다.","h":["직무 상황에서 요구되는 수수료, 보험료, 위약금, 운임 등을 나타내는 요율표를 분석하여 두 양 사이의 대응 관계를 파악하고 설명하게 한다."]},{"교":"수학","c":"12직수02-04","과":"직무 수학","학":"고2~3","영":"변화와 관계","p":"증가와 감소, 주기적 변화 등의 관계를 나타내는 그래프를 설명할 수 있다.","h":["직무 상황에서 요구되는 월, 분기, 연도별 매출액, 판매량, 수출입량 등을 나타내는 그래프를 분석하여 설명하게 한다. 그 결과를 근거로 미래 상황을 예측하여 합리적인 의사 결정을 하게 한다."]},{"교":"수학","c":"12직수02-05","과":"직무 수학","학":"고2~3","영":"변화와 관계","p":"일차방정식 또는 일차부등식을 활용하여 직무 상황의 문제를 해결할 수 있다.","h":["직무 상황에서 요구되는 최저비용, 잉여상품 최소화, 가격 비교 등과 같은 문제를 일차방정식 또는 일차부등식을 활용하여 해결하는 것에 중점을 두고, 이를 근거로 주어진 직무 상황에 합리적인 의사 결정을 하게 한다."]},{"교":"수학","c":"12직수03-01","과":"직무 수학","학":"고2~3","영":"도형과 측정","p":"입체도형의 겨냥도와 전개도를 그릴 수 있고, 겨냥도와 전개도를 이용하여 입체도형의 모양을 만들 수 있다.","h":["직무에서 다루는 상품, 물품 등의 모양을 파악하여 겨냥도와 전개도를 그리게 한다. 또한 겨냥도와 전개도를 이용하여 상품, 물품 등의 모양을 추측하게 한다."]},{"교":"수학","c":"12직수03-02","과":"직무 수학","학":"고2~3","영":"도형과 측정","p":"입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 판별할 수 있다.","h":["직무에서 물품 배치, 좌석 배치, 무대 진열 등에 의해 구성된 공간을 여러 방향에서 살펴본 모양을 설명하고 평면적 표현으로 시각화할 수 있게 한다. 조립도, 설계도를 이용하여 완성된 물품을 추측하고, 안내도, 배치도, 약도 등을 이해하여 경로나 위치 등을 설명하게 한다."]},{"교":"수학","c":"12직수03-03","과":"직무 수학","학":"고2~3","영":"도형과 측정","p":"도형의 이동, 합동과 닮음을 직무 상황에 연결하여 문제를 해결할 수 있다.","h":["평행이동, 대칭이동, 회전이동 등과 같은 도형의 이동 후의 모양을 추측하거나 패턴을 찾아 설명하고 이를 이용하여 디자인 설계에 활용하게 한다. 상품 디자인이나 제품 설계 등과 같은 직무 상황에서 도형의 합동을 활용하게 하고, 그림의 확대 및 축소, 지도의 축척 등을 파악하기 위하여 도형의 닮음을 활용하게 한다."]},{"교":"수학","c":"12직수03-04","과":"직무 수학","학":"고2~3","영":"도형과 측정","p":"직무 상황에서 나타나는 평면도형의 둘레와 넓이를 구할 수 있다.","h":["평면도형의 둘레와 넓이를 계산하게 하고, 이를 이용하여 상품, 물품 등의 단면의 둘레나 넓이를 구하게 한다."]},{"교":"수학","c":"12직수03-05","과":"직무 수학","학":"고2~3","영":"도형과 측정","p":"직무 상황에서 나타나는 입체도형의 겉넓이와 부피를 구할 수 있다.","h":["입체도형의 겉넓이와 부피를 계산하게 하고, 이를 이용하여 택배 상자, 다양한 모양의 포장 상자 등 상품이나 물품의 겉넓이와 부피를 구하게 한다."]},{"교":"수학","c":"12직수04-01","과":"직무 수학","학":"고2~3","영":"자료와 가능성","p":"직무 상황에서 경우의 수를 구할 수 있다.","h":["조건에 따른 상품 구성, 물품 배열, 좌석 배치 등과 같은 직무 상황에서의 경우의 수를 구하게 한다."]},{"교":"수학","c":"12직수04-02","과":"직무 수학","학":"고2~3","영":"자료와 가능성","p":"어떤 현상이 나타날 가능성을 수치화하여 설명할 수 있다.","h":["직무 상황에서 나타나는 가능성을 인식하게 하고, 자료를 근거로 취소 가능성, 인상 가능성 등과 같이 가능성을 수치화하여 설명하게 한다."]},{"교":"수학","c":"12직수04-03","과":"직무 수학","학":"고2~3","영":"자료와 가능성","p":"직무 상황의 자료를 목적에 맞게 표와 그래프로 정리할 수 있다.","h":["2개 이상의 표를 직무 목적에 적합한 하나의 표로 정리하여 표현하게 한다. 표를 그래프로 표현할 수 있으며, 2가지 이상의 그래프를 직무 목적에 적합한 하나의 그래프로 표현하게 한다. 직무 상황의 자료를 표나 그래프로 표현함으로써 이에 대한 흥미를 갖게 한다."]},{"교":"수학","c":"12직수04-04","과":"직무 수학","학":"고2~3","영":"자료와 가능성","p":"직무 상황의 다양한 표와 그래프를 해석할 수 있다.","h":["직무 상황에서 제시되는 명렬표, 수와 비율이 나타난 표 등을 해석하여 설명하게 한다. 주어진 표를 해석하여 틀린 곳을 찾아 바로 잡을 수 있게 한다. 직무 상황에서 제시되는 다양한 그래프를 해석하여 설명하게 한다. 표와 그래프를 분석하고 해석하여 미래의 상황을 예측하게 한다."]},{"교":"수학","c":"12직수04-05","과":"직무 수학","학":"고2~3","영":"자료와 가능성","p":"다양한 자료의 특성을 파악하여, 직무 목적에 적합한 표나 그래프로 나타내고 합리적인 의사 결정을 할 수 있다.","h":["직무 상황에서 요구되는 다양한 자료의 특성을 파악하고, 그 목적에 적합한 표로 나타내거나 그래프로 표현하게 한다. 표현된 표나 그래프를 근거로 상황을 판단하여 합리적으로 의사 결정하게 함으로써 민주 시민으로서의 소양을 함양하게 한다."]},{"교":"수학","c":"12수문01-01","과":"수학과 문화","학":"고2~3","영":"예술과 수학","p":"음악과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다.","h":["피타고라스 음계를 분석해 보며 악기와 화음과 관련된 수학적 원리를 조사하고, 이를 활용하여 음악을 창작하거나 악기를 만드는 등 관련 활동을 수행하게 한다."]},{"교":"수학","c":"12수문01-02","과":"수학과 문화","학":"고2~3","영":"예술과 수학","p":"미술과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다.","h":["원근법, 황금비, 쪽매맞춤 등을 사용한 미술이나 사진 작품과 관련된 기하학적 원리를 조사하고, 이를 활용하여 작품 제작이나 사진 촬영 등 관련 활동을 수행하게 한다."]},{"교":"수학","c":"12수문01-03","과":"수학과 문화","학":"고2~3","영":"예술과 수학","p":"문학과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다.","h":["수학과 관련된 다양한 문학 작품을 찾아 그 속에 포함된 수학적 내용을 조사하고, 이를 활용하여 수학 시나 수학 소설을 창작하는 등 관련 활동을 수행하게 한다."]},{"교":"수학","c":"12수문01-04","과":"수학과 문화","학":"고2~3","영":"예술과 수학","p":"영화와 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다.","h":["수학과 관련된 다양한 영화를 찾아 그 속에 포함된 수학적 내용을 조사하고, 이를 활용하여 영상물 제작 등 관련 활동을 수행하게 한다."]},{"교":"수학","c":"12수문02-01","과":"수학과 문화","학":"고2~3","영":"생활과 수학","p":"스포츠와 관련된 수학적 내용을 조사하여 그 유용성을 인식할 수 있다.","h":["야구, 양궁 등 스포츠 속에 활용된 수학적 원리에 대해 알아보게 한다. 체조, 빙상 경기 등의 점수 산출 방식에 대해 알아보고 스포츠의 공정성을 추구하기 위한 수학의 역할과 유용성을 인식하게 한다. 각종 스포츠와 체력 관리에 활용된 수학적 원리에 대해 조사하고 건강한 삶과 연계하여 이를 실천하게 할 수 있도록 한다."]},{"교":"수학","c":"12수문02-02","과":"수학과 문화","학":"고2~3","영":"생활과 수학","p":"게임과 관련된 수학적 내용을 조사하고 관련 활동을 수행할 수 있다.","h":["게임 속 수학이나 수학 게임 등의 사례를 찾아 관련된 수학적 원리를 조사하고, 게임 전략을 수학적으로 수립하거나 자신만의 수학 게임을 만드는 등 관련 활동을 수행하게 한다."]},{"교":"수학","c":"12수문02-03","과":"수학과 문화","학":"고2~3","영":"생활과 수학","p":"디지털 기술에 활용된 수학적 내용을 조사하여 설명할 수 있다.","h":["디지털 기술에 활용되는 여러 암호 방식이나 보안 체계, 바코드나 QR코드, 컴퓨터 그래픽 등의 다양한 공학 속 수학적 원리를 찾아 조사하고 설명하게 한다."]},{"교":"수학","c":"12수문02-04","과":"수학과 문화","학":"고2~3","영":"생활과 수학","p":"투표와 관련된 수학적 내용을 조사하고 이를 활용하여 합리적 의사 결정을 위한 방법을 제안할 수 있다.","h":["투표에 활용되는 수학적 원리에 대해 알아보고, 이를 활용해 공정한 투표가 이루어지도록 하는 수학적 결정 방법을 제안하는 내용을 작성, 발표하는 등의 활동을 수행하고 합리적으로 의사 결정하게 함으로써 민주 시민으로서의 소양을 함양하게 한다."]},{"교":"수학","c":"12수문03-01","과":"수학과 문화","학":"고2~3","영":"사회와 수학","p":"민속 수학과 건축 양식 속에 나타난 수학적 원리에 대해 탐구하고 문화 다양성을 이해한다.","h":["마야 달력, 십간십이지 등과 같은 고유한 민속 수학이나 석굴암이나 판테온 등과 같은 각 나라의 건축물에서 찾아볼 수 있는 수학적 원리를 조사하게 한다. 이와 같은 활동을 통해 문화 다양성을 이해하게 한다."]},{"교":"수학","c":"12수문03-02","과":"수학과 문화","학":"고2~3","영":"사회와 수학","p":"점자표에 사용된 수학적 원리에 대해 탐구하고 이를 활용하여 산출물을 설계할 수 있다.","h":["점자표나 시각장애인용 시계 등에 활용되는 진법을 알아보고, 이를 활용하여 산출물을 만드는 활동을 통해 사회적 소수자를 배려하는 공동체 의식을 함양하게 한다."]},{"교":"수학","c":"12수문03-03","과":"수학과 문화","학":"고2~3","영":"사회와 수학","p":"대중매체로부터 얻은 데이터를 정리, 분석하여 그 의미와 가치를 해석할 수 있다.","h":["워드클라우드 등의 방법을 사용하여 인쇄, 영상, 음성 매체 및 사회 관계망 서비스(SNS) 등의 대중매체로부터 얻은 데이터를 정리, 분석하여 대중문화의 여러 측면에 대해 해석하게 한다."]},{"교":"수학","c":"12수문03-04","과":"수학과 문화","학":"고2~3","영":"사회와 수학","p":"가치소비를 위한 의사 결정 방법을 탐구하고 실천 방법을 제시할 수 있다.","h":["가치소비의 의미를 이해하고 서로의 생각을 공유하게 한다. 산업 쓰레기, 공정 무역 등과 같은 녹색소비, 자신의 취향에 따라 가치를 부여하는 가치소비를 위한 수학적 의사 결정 방법을 모색하고 이를 통해 생태전환을 실천하게 한다."]},{"교":"수학","c":"12수문04-01","과":"수학과 문화","학":"고2~3","영":"환경과 수학","p":"식생활과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안할 수 있다.","h":["오염된 식재료, 식단의 불균형, 식품 첨가제, 식량 부족 등 식생활 문제와 관련된 자료를 수집하여 수학적으로 분석하고 이를 개선할 수 있는 방법을 제안하게 한다."]},{"교":"수학","c":"12수문04-02","과":"수학과 문화","학":"고2~3","영":"환경과 수학","p":"대기 오염과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안할 수 있다.","h":["탄소 발자국, 지구 온난화 등 대기 오염과 관련된 자료를 수집하여 수학적으로 분석하고 이를 개선할 수 있는 방법을 제안하게 한다."]},{"교":"수학","c":"12수문04-03","과":"수학과 문화","학":"고2~3","영":"환경과 수학","p":"사막화 현상과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안할 수 있다.","h":["삼림 파괴, 황사 등 사막화 현상과 관련된 자료를 수집하고 수학적으로 분석하고 이를 개선할 수 있는 방법을 제안하게 한다."]},{"교":"수학","c":"12수문04-04","과":"수학과 문화","학":"고2~3","영":"환경과 수학","p":"생물 다양성과 생명권 관련 자료를 수학적으로 분석하고 이를 통해 생태 감수성을 함양할 수 있다.","h":["동⋅식물 보호종의 포획 및 밀거래, 동물 학대 등 생물 다양성과 생명권 관련 자료를 수집하여 수학적으로 분석하고 실태 개선 방법을 제안함으로써 생태 감수성을 함양하게 한다."]},{"교":"수학","c":"12실통01-01","과":"실용 통계","학":"고2~3","영":"통계와 통계적 문제","p":"통계와 통계적 방법의 유용성과 필요성을 인식할 수 있다.","h":["실생활에서 통계가 활용되고 있는 사례를 국가통계포털 등을 이용하여 찾아보게 한다."]},{"교":"수학","c":"12실통01-02","과":"실용 통계","학":"고2~3","영":"통계와 통계적 문제","p":"통계적 문제해결 과정을 이해하고 각 단계의 역할을 설명할 수 있다.","h":["다양한 사례를 통해 불확실한 현상에서 나타나는 변이성을 이해하고 통계적으로 해결 가능한 문제를 파악하게 한다."]},{"교":"수학","c":"12실통01-03","과":"실용 통계","학":"고2~3","영":"통계와 통계적 문제","p":"모집단과 표본의 뜻을 알고, 표본추출의 방법을 이해하여 문제 상황에 맞는 방법을 선택할 수 있다.","h":["통계 조사 방법이 전수 조사와 표본 조사로 구분되는 것을 알고, 상황과 목적에 따라 통계 조사 방법을 선택하게 한다. 대표적인 확률추출 방법에 단순임의추출, 층화임의추출, 계통추출 등이 있다는 것을 알고, 사례를 통해 각각의 추출 방법을 이해하게 한다."]},{"교":"수학","c":"12실통02-01","과":"실용 통계","학":"고2~3","영":"자료의 수집과 정리","p":"자료의 종류를 알고 설명할 수 있다.","h":["자료는 특성에 따라 범주형 자료와 수치형 자료로 구분할 수 있게 한다. 자료의 특성은 척도에 따라 수로 표현될 수 있음을 이해하고 명목척도, 순서척도, 구간척도, 비율척도 등을 구분하게 한다."]},{"교":"수학","c":"12실통02-02","과":"실용 통계","학":"고2~3","영":"자료의 수집과 정리","p":"자료의 수집 방법을 이해하고 문제 상황에 맞는 자료 수집 방법을 선택할 수 있다.","h":["자료를 수집하는 방법에는 실험이나 관찰, 측정, 설문조사, 인터뷰, 2차 자료 수집 등 다양한 방법이 있으며, 자료 수집 방법을 결정하기 위해서 조사 대상, 목적, 기간, 탐구 문제 등을 고려할 수 있음을 이해하게 한다."]},{"교":"수학","c":"12실통02-03","과":"실용 통계","학":"고2~3","영":"자료의 수집과 정리","p":"그래프의 종류를 알고 자료의 특성을 나타내는 적절한 그래프를 그릴 수 있다.","h":["자료의 특성과 탐구 목적에 맞는 적절한 그래프를 선택하고, 공학 도구를 이용하여 그래프를 표현하게 할 수 있다. 실생활 자료를 다양한 그래프로 표현함으로써 이에 대한 흥미를 갖게 한다."]},{"교":"수학","c":"12실통02-04","과":"실용 통계","학":"고2~3","영":"자료의 수집과 정리","p":"대푯값과 산포도의 종류를 알고 자료의 특성을 나타내는 값으로 요약할 수 있다.","h":["자료의 특성과 탐구 목적에 맞는 적절한 대푯값과 산포도를 선택하고, 이를 공학 도구를 이용하여 구할 수 있게 한다."]},{"교":"수학","c":"12실통03-01","과":"실용 통계","학":"고2~3","영":"자료의 분석","p":"정규분포와 t분포를 공학 도구를 이용하여 탐구할 수 있다.","h":["공학 도구를 이용하여 정규분포와 t분포 곡선의 형태나 성질을 이해하게 한다."]},{"교":"수학","c":"12실통03-02","과":"실용 통계","학":"고2~3","영":"자료의 분석","p":"실생활에서 공학 도구를 이용하여 모평균을 추정할 수 있다.","h":["공학 도구를 이용하여 모평균을 추정하고 추정 결과를 해석하게 한다."]},{"교":"수학","c":"12실통03-03","과":"실용 통계","학":"고2~3","영":"자료의 분석","p":"실생활에서 공학 도구를 이용하여 모비율을 추정할 수 있다.","h":["공학 도구를 이용하여 모비율을 추정하고 추정 결과를 해석하게 한다."]},{"교":"수학","c":"12실통03-04","과":"실용 통계","학":"고2~3","영":"자료의 분석","p":"가설검정을 이해하고, 실생활에서 공학 도구를 이용하여 가설을 검정할 수 있다.","h":["대립가설, 귀무가설을 설정하고 적절한 가설검정 방법을 선택한 후, 공학 도구를 이용하여 가설을 검정하고 그 결과를 해석하게 한다."]},{"교":"수학","c":"12실통04-01","과":"실용 통계","학":"고2~3","영":"통계적 탐구","p":"실생활에서 통계적 탐구 과정에 따라 문제를 해결하고 합리적인 의사 결정을 할 수 있다.","h":["자신의 흥미, 관심, 진로에 맞는 탐구 주제를 선정하여 표본 조사를 설계하고, 자료를 수집하게 한다. 수집한 자료를 정리하고 분석하여 문제에 대한 결론을 도출하게 한다."]},{"교":"수학","c":"12실통04-02","과":"실용 통계","학":"고2~3","영":"통계적 탐구","p":"통계적 탐구 과정과 그 결과를 비판적으로 성찰할 수 있다.","h":["통계적 탐구 과정과 결과를 산출물로 만들어 친구들에게 설명하고 상호 작용하는 과정을 통해 비판적으로 성찰할 수 있게 한다."]},{"교":"수학","c":"12수과01-01","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 이해","p":"수학과제 탐구의 의미와 필요성을 설명할 수 있다.","h":["수학의 개념, 원리, 법칙을 여러 분야와 연결하여 관심 있는 수학 주제에 대해 심층적으로 탐구하는 수학과제 탐구의 의미와 필요성을 다양한 탐구 유형과 사례를 통해 이해하고 설명할 수 있게 한다."]},{"교":"수학","c":"12수과01-02","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 이해","p":"올바른 연구 윤리를 이해하고, 탐구의 전 과정에서 이를 준수한다.","h":["탐구의 계획, 수행, 보고 등과 같은 전 과정에서 책임 있는 태도로 바람직하고 건전한 연구를 추진하기 위해 지켜야 할 윤리적 원칙을 여러 가지 표절과 조작의 사례를 통해 이해하고 토의⋅토론 등의 상호 작용을 통해 올바른 연구 윤리의 중요성을 인식하게 한다. 인터넷이나 서적의 자료, 다른 사람의 아이디어 등을 참고할 때는 참고문헌 표기법을 익혀 정확한 출처를 표시하도록 한다. 탐구의 전 과정 및 방법에 있어서 모든 생명의 가치를 존중하고 존엄성을 훼손하지 않도록 생명윤리를 준수하고 안전을 위해 노력해야 함을 인식하고 전 과정에서 이를 준수하며 실천하여 민주 시민으로서의 소양을 함양하게 한다."]},{"교":"수학","c":"12수과02-01","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 방법과 절차","p":"문헌 조사를 통해 탐구하는 방법과 절차를 이해하고 설명할 수 있다.","h":["탐구 주제와 관련된 선행 연구를 찾기 위해 연구 논문, 각종 보고서, 서적, 영상 자료 등을 검색하는 방법을 이해하고, 찾은 선행 연구를 정리하게 한다. 탐구 문제를 해결하기 위해 기존의 문헌 자료를 검토하는 탐구 방법 및 절차를 이해하고, 문서를 찾아 체계적으로 정리하여 결론을 내리는 방법을 이해하여 체득하게 한다."]},{"교":"수학","c":"12수과02-02","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 방법과 절차","p":"사례 조사를 통해 탐구하는 방법과 절차를 이해하고 설명할 수 있다.","h":["탐구 문제의 해결을 위해 현재의 사태를 파악하여 사실대로 기술하는 사례조사에 대해 이해하고 질문지법과 통계 자료 활용 등의 탐구 방법 및 절차를 이해하게 한다. 적합한 질문을 만드는 법과 적절한 자료를 수집하기 위한 정보 검색에 대해 충분히 이해하고 자료를 허위로 만들거나 수집된 자료를 임의로 조작하지 않게 한다."]},{"교":"수학","c":"12수과02-03","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 방법과 절차","p":"수학 실험을 통해 탐구하는 방법과 절차를 이해하고 설명할 수 있다.","h":["수학 실험은 논리적 추론을 통해 수학 내용 자체를 탐구하거나 자연 또는 사회 현상을 수학적으로 탐구하는 방법임을 이해하게 한다. 실생활 문제 상황을 수학 문제로 변환한 다음 수학 문제를 해결하고 그 결과를 해석하여 다시 문제 상황을 해결할 수 있는 수학적 모델링 과정을 이해하게 한다."]},{"교":"수학","c":"12수과02-04","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 방법과 절차","p":"개발 연구를 통해 탐구하는 방법과 절차를 이해하고 설명할 수 있다.","h":["개발 연구는 수학을 이용하여 주제를 설정한 후 주제에 맞게 산출물을 설계하여 개발하는 방법임을 이해하게 한다. 개발 연구 주제로 퍼즐이나 보드게임 만들기, 확률을 이용한 게임 설계하기, 공학 도구를 이용한 그림 그리기, 수학을 이용한 창의적 물건 발명 등을 다룰 수 있다."]},{"교":"수학","c":"12수과03-01","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 실행 및 평가","p":"여러 가지 현상에서 수학 탐구 주제를 선정하고 탐구 계획을 수립할 수 있다.","h":["수학 탐구 주제는 학생의 흥미와 관심, 학교 실정 등에 맞게 학생이 스스로 선택하게 할 수 있다. 탐구 주제를 바탕으로 탐구 문제를 선정할 때는 탐구의 초점이 명확하고 탐구할 가치가 있는지, 학생이 주어진 시간 내에 탐구할 수 있는지 등을 고려하게 한다. 다양한 탐구 방법 중 탐구 문제를 해결하는 데 적절한 방법을 선정하여 탐구 계획을 수립하게 한다."]},{"교":"수학","c":"12수과03-02","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 실행 및 평가","p":"적절한 탐구 방법과 절차에 따라 탐구를 수행할 수 있다.","h":["과제 탐구는 주제의 성격이나 학생의 필요와 요구에 따라 개인 또는 집단으로 수행하고, 협력적으로 과제를 탐구할 때는 균형 있는 역할 분담을 통해 책임감 있게 탐구하게 한다. 탐구 수행 과정은 끈기를 갖고 시행착오를 반복하여 도전하며 결과를 도출하거나 설계를 수정하는 과정을 거치며 탐구 주제와 관련한 함의를 도출하는 단계임을 이해하게 한다. 탐구가 진행되는 과정이 공유될 수 있도록 중간 점검을 실시하여 보완하고 수정하게 한다."]},{"교":"수학","c":"12수과03-03","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 실행 및 평가","p":"탐구 결과를 정리하여 산출물을 만들고 발표할 수 있다.","h":["탐구 문제에 대한 유의미한 결론을 도출하여 탐구 결과를 정리한다. 탐구 과정 및 결과에 대해 한계점을 분석하고 자료와 정보에 기반하여 합리적인 의사 결정을 하게 한다. 탐구 산출물 제작 및 발표는 수학 소논문, STEAM형 산출물, 포스터, 보고서, 수학 잡지, 수학 소설, 수학 만화, 수학 신문 등의 여러 유형에서 학생의 흥미와 관심, 학교의 실정에 맞게 선택하여 정확한 수학적 표현을 사용하여 수행하게 한다."]},{"교":"수학","c":"12수과03-04","과":"수학과제 탐구","학":"고2~3","영":"과제 탐구의 실행 및 평가","p":"탐구 과정과 결과를 반성하고 평가할 수 있다.","h":["탐구 결과를 발표한 후에는 동료 평가, 자기 평가 등을 통해 학생이 스스로 수학 주제 탐구의 전 과정을 성찰하게 하고, 탐구 과정 및 산출물을 통해 수학의 유용성을 인식하게 한다."]},{"교":"과학","c":"4과01-01","과":"과학","학":"초3~4","영":"힘과 우리 생활","p":"일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다.","h":["무거운 물체를 밀고 당길 때와 가벼운 물체를 밀고 당길 때 드는 힘의 크기를 느끼는 데 중점을 둔다."]},{"교":"과학","c":"4과01-02","과":"과학","학":"초3~4","영":"힘과 우리 생활","p":"수평잡기 활동을 통해 물체의 무게를 비교할 수 있다."},{"교":"과학","c":"4과01-03","과":"과학","학":"초3~4","영":"힘과 우리 생활","p":"무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다.","h":["무게와 질량을 구분하지 않으며 무게를 비교하는 단위로 g, ㎏을 사용한다."]},{"교":"과학","c":"4과01-04","과":"과학","학":"초3~4","영":"힘과 우리 생활","p":"지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다.","h":["지레, 빗면과 같은 간단한 도구를 이용할 때 힘의 크기가 달라진다는 점을 관찰하는 데 중점을 두며, 도구의 원리나 구조적 특성을 다루지 않는다."]},{"교":"과학","c":"4과02-01","과":"과학","학":"초3~4","영":"동물의 생활","p":"여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.","h":["동물의 형태적 특징을 찾고 그 특징에 따라 분류 기준을 정하여 분류하는 활동을 하도록 하며 생물학적 분류 체계는 다루지 않는다."]},{"교":"과학","c":"4과02-02","과":"과학","학":"초3~4","영":"동물의 생활","p":"다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","h":["서식지에 따른 동물의 생김새와 생활 방식의 다양성을 다루고, 적응 개념은 다루지 않는다."]},{"교":"과학","c":"4과02-03","과":"과학","학":"초3~4","영":"동물의 생활","p":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"4과03-01","과":"과학","학":"초3~4","영":"식물의 생활","p":"여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.","h":["여러 가지 식물의 잎을 채집해 생김새 등과 같은 외형적 특징에 따라 기준을 세워 분류하는 활동을 하며 생물학적 분류 체계는 다루지 않는다."]},{"교":"과학","c":"4과03-02","과":"과학","학":"초3~4","영":"식물의 생활","p":"다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","h":["서식지에 따른 식물의 생김새와 생활 방식의 다양성을 다루고, 적응 개념은 다루지 않는다."]},{"교":"과학","c":"4과03-03","과":"과학","학":"초3~4","영":"식물의 생활","p":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"4과04-01","과":"과학","학":"초3~4","영":"생물의 한살이","p":"동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다."},{"교":"과학","c":"4과04-02","과":"과학","학":"초3~4","영":"생물의 한살이","p":"식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다.","h":["씨가 싹트는데 필요한 조건은 물과 온도로 한정하고, 식물이 자라는데 필요한 조건은 물과 햇빛으로 제한한다."]},{"교":"과학","c":"4과04-03","과":"과학","학":"초3~4","영":"생물의 한살이","p":"생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다.","h":["한살이의 유형을 이해하는 생물의 범위는 동물과 식물에 한정하여 다루고, 식물의 한살이 유형은 한해살이와 여러해살이로 구분하여 이해하도록 한다."]},{"교":"과학","c":"4과05-01","과":"과학","학":"초3~4","영":"물체와 물질","p":"물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다.","h":["나무, 철, 유리, 플라스틱 등 학생들이 일상생활에서 쉽게 접할 수 있는 물질의 다양한 성질을 관찰하고 비교하는 활동에 중점을 두고, 이를 바탕으로 여러 가지 물체를 물질의 종류에 따라 분류하도록 한다."]},{"교":"과학","c":"4과05-02","과":"과학","학":"초3~4","영":"물체와 물질","p":"물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다.","h":["물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하고 비교하는 활동에 중점을 두고, 한 가지 물질이 여러 가지 상태로 존재한다는 것은 다루지 않는다."]},{"교":"과학","c":"4과05-03","과":"과학","학":"초3~4","영":"물체와 물질","p":"다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다."},{"교":"과학","c":"4과06-01","과":"과학","학":"초3~4","영":"지구와 바다","p":"지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다."},{"교":"과학","c":"4과06-02","과":"과학","학":"초3~4","영":"지구와 바다","p":"바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.","h":["바닷물의 침식, 운반, 퇴적 작용에 대해서는 다루지 않는다."]},{"교":"과학","c":"4과06-03","과":"과학","학":"초3~4","영":"지구와 바다","p":"밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다.","h":["밀물과 썰물은 바닷물의 높이 변화를 다루는 수준이며, 조석 용어와 원인에 대해서는 다루지 않는다."]},{"교":"과학","c":"4과07-01","과":"과학","학":"초3~4","영":"소리의 성질","p":"여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다."},{"교":"과학","c":"4과07-02","과":"과학","학":"초3~4","영":"소리의 성질","p":"큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다."},{"교":"과학","c":"4과07-03","과":"과학","학":"초3~4","영":"소리의 성질","p":"여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다.","h":["소리가 여러 가지 물질을 통해 전달되는 현상을 관찰하는 데 중점을 두며, 소리 전달의 과학적 원리는 다루지 않도록 한다."]},{"교":"과학","c":"4과08-01","과":"과학","학":"초3~4","영":"감염병과 건강한 생활","p":"생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다.","h":["질병은 예방접종이나 범유행 상황 등 학생이 경험하거나 인지할 수 있는 생활 속 질병을 다룬다."]},{"교":"과학","c":"4과08-02","과":"과학","학":"초3~4","영":"감염병과 건강한 생활","p":"감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다.","h":["감염 과정은 생활 습관과 관련지을 수 있는 접촉 감염, 비말 감염, 공기 감염, 수인 감염, 타액 감염 등의 사례로 한정하여 다루며, 감염병의 특성과 면역 반응을 구체적으로 다루지 않는다."]},{"교":"과학","c":"4과08-03","과":"과학","학":"초3~4","영":"감염병과 건강한 생활","p":"건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다."},{"교":"과학","c":"4과09-01","과":"과학","학":"초3~4","영":"자석의 이용","p":"자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다."},{"교":"과학","c":"4과09-02","과":"과학","학":"초3~4","영":"자석의 이용","p":"자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다."},{"교":"과학","c":"4과09-03","과":"과학","학":"초3~4","영":"자석의 이용","p":"자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다."},{"교":"과학","c":"4과10-01","과":"과학","학":"초3~4","영":"물의 상태 변화","p":"물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다.","h":["물의 상태 변화는 관찰 가능한 현상 수준에서만 다루고, 물의 상태가 변하는 까닭은 다루지 않는다."]},{"교":"과학","c":"4과10-02","과":"과학","학":"초3~4","영":"물의 상태 변화","p":"물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다.","h":["물이 얼 때와 얼음이 녹을 때의 부피 변화는 물기둥의 높이 변화로 관찰하도록 한다. 물의 증발과 끓음을 비교할 때는 물이 수증기로 상태가 변하는 현상이라는 공통점에 중점을 둔다."]},{"교":"과학","c":"4과10-03","과":"과학","학":"초3~4","영":"물의 상태 변화","p":"물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다."},{"교":"과학","c":"4과11-01","과":"과학","학":"초3~4","영":"땅의 변화","p":"흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다.","h":["강 주변 지형은 흐르는 물에 의한 침식, 운반, 퇴적 작용을 중심으로 다룬다."]},{"교":"과학","c":"4과11-02","과":"과학","학":"초3~4","영":"땅의 변화","p":"화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다.","h":["화산 활동과 화산 분출물을 중심으로 학습한다."]},{"교":"과학","c":"4과11-03","과":"과학","학":"초3~4","영":"땅의 변화","p":"화성암을 관찰하고 분류할 수 있다.","h":["화성암은 현무암과 화강암만 다룬다."]},{"교":"과학","c":"4과11-04","과":"과학","학":"초3~4","영":"땅의 변화","p":"화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다.","h":["화산 활동의 피해와 이로운 점을 함께 다루며, 지진 발생 원인은 다루지 않는다."]},{"교":"과학","c":"4과12-01","과":"과학","학":"초3~4","영":"다양한 생물과 우리 생활","p":"균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다."},{"교":"과학","c":"4과12-02","과":"과학","학":"초3~4","영":"다양한 생물과 우리 생활","p":"균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다."},{"교":"과학","c":"4과12-03","과":"과학","학":"초3~4","영":"다양한 생물과 우리 생활","p":"우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다.","h":["우리 생활에 생명과학이 이용되는 사례는 균류, 원생생물, 세균을 중심으로 학생들이 생활 속에서 경험하고 인지할 수 있는 수준으로 다룬다."]},{"교":"과학","c":"4과13-01","과":"과학","학":"초3~4","영":"밤하늘 관찰","p":"달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다.","h":["달의 위상변화 원인을 다루지 않고, 달의 모양이 주기적으로 바뀌는 현상을 관찰하여 확인하는 데 초점을 둔다."]},{"교":"과학","c":"4과13-02","과":"과학","학":"초3~4","영":"밤하늘 관찰","p":"태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.","h":["태양계를 구성하는 행성들의 표면적인 특징 위주로 조사하고, 태양과 행성의 실제 크기나 태양에서 행성까지의 실제 거리, 행성의 질량, 자전 속도, 대기 성분 등과 같은 구체적인 물리량은 다루지 않는다."]},{"교":"과학","c":"4과13-03","과":"과학","학":"초3~4","영":"밤하늘 관찰","p":"별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다.","h":["별의 정의는 행성과 비교하여 스스로 빛을 내는 천체라는 수준에서만 다룬다. 별자리는 학생들이 쉽게 관찰할 수 있는 북극성 주변의 별자리를 다루며, 계절별 별자리와 관련짓지 않는다."]},{"교":"과학","c":"4과14-01","과":"과학","학":"초3~4","영":"생물과 환경","p":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.","h":["숲, 바다, 강 등 다양한 생태계를 다루고, 각 생태계에서 생물 요소와 비생물 요소를 분류할 수 있게 한다."]},{"교":"과학","c":"4과14-02","과":"과학","학":"초3~4","영":"생물과 환경","p":"생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.","h":["생태계에서 다양한 먹이 관계를 알아보고 먹이 관계가 복잡할수록 생물이 생존하는 데 유리함을 이해하게 한다."]},{"교":"과학","c":"4과14-03","과":"과학","학":"초3~4","영":"생물과 환경","p":"인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다.","h":["대기오염, 수질오염, 토양오염 등의 환경오염에 관한 사례를 중심으로 다루고, 생태계 보전을 위해 우리가 해야 할 일을 조사하여 실천함으로써 생태계 보전에 대한 의식을 가지게 한다."]},{"교":"과학","c":"4과15-01","과":"과학","학":"초3~4","영":"여러 가지 기체","p":"실험을 통해 기체가 무게가 있음을 설명할 수 있다.","h":["부피가 같은 용기에 공기를 1기압으로 담은 상태와 이 상태에서 공기를 넣거나 뺀 상태의 무게를 비교하는 실험을 바탕으로 기체가 무게가 있음을 설명한다."]},{"교":"과학","c":"4과15-02","과":"과학","학":"초3~4","영":"여러 가지 기체","p":"온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.","h":["온도를 높일 때와 낮출 때 공기의 부피 변화, 압력을 높일 때와 낮출 때 공기의 부피 변화를 관찰하도록 한다. 온도나 압력에 따라 기체의 부피가 어떻게 변하는지를 정성적으로 이해하도록 하고, 입자 모형으로 기체의 부피가 변하는 까닭은 설명하지 않는다."]},{"교":"과학","c":"4과15-03","과":"과학","학":"초3~4","영":"여러 가지 기체","p":"일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다."},{"교":"과학","c":"4과15-04","과":"과학","학":"초3~4","영":"여러 가지 기체","p":"기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다."},{"교":"과학","c":"4과16-01","과":"과학","학":"초3~4","영":"기후변화와 우리 생활","p":"기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.","h":["기후변화의 과학적 원인은 다루지 않으며 기온, 강수량 등 기후요소가 평년값에 비해 현저히 높거나 낮은 사례(가뭄, 폭설, 폭염, 한파, 홍수 등)를 탐구하도록 한다."]},{"교":"과학","c":"4과16-02","과":"과학","학":"초3~4","영":"기후변화와 우리 생활","p":"기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.","h":["인간의 삶에 부정적인 영향을 미치는 기후변화 현상의 사례를 모형이나 실험 활동을 통해 알아보고, 이에 기반하여 기후변화로 인한 인간의 피해를 예측하고 설명할 수 있도록 한다."]},{"교":"과학","c":"4과16-03","과":"과학","학":"초3~4","영":"기후변화와 우리 생활","p":"기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다."},{"교":"과학","c":"6과01-01","과":"과학","학":"초5~6","영":"지층과 화석","p":"지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.","h":["지층의 두께나 색 등을 다루고, 지층이 휘어지거나 끊어진 모습을 소개하되 생성 원리는 다루지 않는다."]},{"교":"과학","c":"6과01-02","과":"과학","학":"초5~6","영":"지층과 화석","p":"지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.","h":["퇴적암은 이암, 사암, 역암만 다룬다."]},{"교":"과학","c":"6과01-03","과":"과학","학":"초5~6","영":"지층과 화석","p":"화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다.","h":["화석 표본은 동물과 식물의 특징이 분명하게 드러나는 것을 사용한다."]},{"교":"과학","c":"6과02-01","과":"과학","학":"초5~6","영":"빛의 성질","p":"물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다."},{"교":"과학","c":"6과02-02","과":"과학","학":"초5~6","영":"빛의 성질","p":"빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.","h":["빛이 직진, 반사, 굴절하는 성질은 햇빛이나 레이저 광선의 진행으로 나타나는 현상을 관찰하여 알 수 있도록 하되, 반사와 굴절의 법칙은 다루지 않는다. 또, 볼록렌즈와 물체 사이의 거리, 볼록렌즈와 눈 사이의 거리에 따른 물체의 모습 차이는 다루지 않는다."]},{"교":"과학","c":"6과02-03","과":"과학","학":"초5~6","영":"빛의 성질","p":"거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다."},{"교":"과학","c":"6과03-01","과":"과학","학":"초5~6","영":"용해와 용액","p":"용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.","h":["용질, 용매, 용액, 용해의 개념을 다루되, 입자 모형으로 용해 현상을 설명하거나 용해 현상이 일어나는 과학적 이유나 원리를 설명하지 않는다. 용해 전과 후의 무게를 비교하여 용해 과정에서 물질이 사라지지 않음을 이해하도록 한다."]},{"교":"과학","c":"6과03-02","과":"과학","학":"초5~6","영":"용해와 용액","p":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.","h":["진하기가 다른 두 용액에서 같은 물체의 뜨는 정도가 다름을 이용하여 용액의 상대적인 진하기를 비교하도록 한다."]},{"교":"과학","c":"6과03-03","과":"과학","학":"초5~6","영":"용해와 용액","p":"일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다."},{"교":"과학","c":"6과04-01","과":"과학","학":"초5~6","영":"우리 몸의 구조와 기능","p":"뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.","h":["중학교와 고등학교 과정에서는 뼈와 근육에 대해서 학습하지 않으므로, 뼈와 근육의 구조와 기능을 기초적으로 이해하는 데 중점을 둔다."]},{"교":"과학","c":"6과04-02","과":"과학","학":"초5~6","영":"우리 몸의 구조와 기능","p":"소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.","h":["우리 몸의 각 기관은 종류, 위치, 생김새, 기능을 중심으로 탐구한다."]},{"교":"과학","c":"6과04-03","과":"과학","학":"초5~6","영":"우리 몸의 구조와 기능","p":"우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다.","h":["질병은 소화, 순환, 호흡, 배설 기관과 관련된 것으로 조사하고 건강을 유지하기 위한 생활 방식은 각 질병의 예방법을 중심으로 다룬다."]},{"교":"과학","c":"6과05-01","과":"과학","학":"초5~6","영":"혼합물의 분리","p":"알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.","h":["혼합물의 의미를 학습한 뒤 혼합물의 분리 실험을 진행하도록 한다. 혼합물은 두 가지 이상의 물질이 성질이 변하지 않고 섞여 있는 상태라는 수준에서 다룬다. 골고루 섞이지 않는 액체 혼합물 분리에서 액체가 골고루 섞이지 않는 까닭은 다루지 않는다."]},{"교":"과학","c":"6과05-02","과":"과학","학":"초5~6","영":"혼합물의 분리","p":"물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다."},{"교":"과학","c":"6과05-03","과":"과학","학":"초5~6","영":"혼합물의 분리","p":"지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다."},{"교":"과학","c":"6과06-01","과":"과학","학":"초5~6","영":"날씨와 우리 생활","p":"기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.","h":["기상 요소는 기온, 바람, 습도, 구름의 양, 강수량을 중심으로 다루고, 기상 자료에서 규칙성을 파악하도록 한다."]},{"교":"과학","c":"6과06-02","과":"과학","학":"초5~6","영":"날씨와 우리 생활","p":"이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다.","h":["구름에서 비와 눈이 내리는 과정을 다루지 않고 현상을 중심으로 다루며, 단열 팽창과 관련된 구름의 생성 과정은 다루지 않는다."]},{"교":"과학","c":"6과06-03","과":"과학","학":"초5~6","영":"날씨와 우리 생활","p":"고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.","h":["고기압과 저기압의 날씨와 고기압에서 저기압으로 부는 바람의 방향을 이해하는 수준에서 현상 중심으로 다룬다."]},{"교":"과학","c":"6과07-01","과":"과학","학":"초5~6","영":"열과 우리 생활","p":"물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다."},{"교":"과학","c":"6과07-02","과":"과학","학":"초5~6","영":"열과 우리 생활","p":"온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다.","h":["온도가 다른 두 물체를 접촉하는 탐구에서는 두 물체의 온도 변화를 측정하는 데 중점을 두고, 물체의 온도가 변하는 원인이 온도가 높은 물체에서 온도가 낮은 물체로 열이 이동하기 때문이라는 사실을 추리하도록 한다. 단, 열평형이라는 용어는 사용하지 않는다."]},{"교":"과학","c":"6과07-03","과":"과학","학":"초5~6","영":"열과 우리 생활","p":"주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.","h":["전도, 대류, 복사는 고체, 액체, 기체에서의 열의 이동과, 빛에 의한 열 이동 현상을 관찰하는 데 중점을 두고 다룬다."]},{"교":"과학","c":"6과07-04","과":"과학","학":"초5~6","영":"열과 우리 생활","p":"일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다."},{"교":"과학","c":"6과08-01","과":"과학","학":"초5~6","영":"자원과 에너지","p":"우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다."},{"교":"과학","c":"6과08-02","과":"과학","학":"초5~6","영":"자원과 에너지","p":"재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.","h":["재생에너지는 태양 에너지, 풍력, 수력, 해양 에너지, 지열 에너지, 바이오 에너지 등을 의미한다."]},{"교":"과학","c":"6과08-03","과":"과학","학":"초5~6","영":"자원과 에너지","p":"자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다.","h":["효율적인 자원의 이용 방법에서 물 자원과 산림 자원, 광물 자원을 종합적으로 다루며, 학생들이 배운 내용을 바탕으로 생활 속에서 자원의 소중함을 느끼고, 효율적인 이용 방법을 공유하고 실천할 수 있도록 한다."]},{"교":"과학","c":"6과09-01","과":"과학","학":"초5~6","영":"산과 염기","p":"여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.","h":["리트머스 시험지, 페놀프탈레인 용액, 붉은 양배추 용액 등과 같은 지시약의 색깔 변화를 이용하여 여러 가지 용액을 산성 용액과 염기성 용액으로 분류하도록 한다."]},{"교":"과학","c":"6과09-02","과":"과학","학":"초5~6","영":"산과 염기","p":"산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.","h":["산성 용액은 탄산 칼슘과 반응하고 염기성 용액은 단백질과 반응하는 성질을 중심으로 다룬다. 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화에서 지시약이 들어 있는 용액의 색깔이 변하는 현상을 관찰하는 수준에서만 다루고 중성, pH, 중화 개념은 다루지 않는다."]},{"교":"과학","c":"6과09-03","과":"과학","학":"초5~6","영":"산과 염기","p":"우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다."},{"교":"과학","c":"6과09-04","과":"과학","학":"초5~6","영":"산과 염기","p":"산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다."},{"교":"과학","c":"6과10-01","과":"과학","학":"초5~6","영":"물체의 운동","p":"운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.","h":["시간에 따라 위치가 변하는 다양한 운동을 다루면서 처음 위치와 나중 위치를 간단한 좌표 평면 위에 표현하되 두 위치 사이의 거리는 구하지 않는다."]},{"교":"과학","c":"6과10-02","과":"과학","학":"초5~6","영":"물체의 운동","p":"물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.","h":["물체의 속력을 구할 때 물체가 한 길을 따라 한 방향으로 운동하는 경우만 다루며, 속력의 단위 변환에 중점을 두지 않는다."]},{"교":"과학","c":"6과10-03","과":"과학","학":"초5~6","영":"물체의 운동","p":"속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다."},{"교":"과학","c":"6과11-01","과":"과학","학":"초5~6","영":"식물의 구조와 기능","p":"생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.","h":["세포 관찰은 식물 세포로 하고, 세포의 구조는 핵, 세포막, 세포벽을 용어 수준에서 다룬다."]},{"교":"과학","c":"6과11-02","과":"과학","학":"초5~6","영":"식물의 구조와 기능","p":"식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.","h":["식물의 기관에서 물과 양분의 이동을 탐구하면서 식물의 기관이 서로 연결되어 있음을 다룬다."]},{"교":"과학","c":"6과11-03","과":"과학","학":"초5~6","영":"식물의 구조와 기능","p":"여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.","h":["학생들이 관심 있는 식물의 구조와 기능을 관찰하거나 조사하고 이를 설명하는 자료를 만들어 발표하고 공유하게 한다."]},{"교":"과학","c":"6과12-01","과":"과학","학":"초5~6","영":"지구의 운동","p":"하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.","h":["남쪽 하늘을 바라보는 관측자 관점에서 태양과 별의 위치가 달라지는 현상을 중심으로 다룬다."]},{"교":"과학","c":"6과12-02","과":"과학","학":"초5~6","영":"지구의 운동","p":"지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.","h":["지구의 자전에서는 지구가 자전축이 기울어진 채 하루에 한 바퀴 도는 것을 중심으로 다룬다."]},{"교":"과학","c":"6과12-03","과":"과학","학":"초5~6","영":"지구의 운동","p":"지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.","h":["별자리 명칭보다는 계절에 따라 보이는 별자리와 별자리의 위치가 달라지는 까닭을 이해하는 데 초점을 둔다."]},{"교":"과학","c":"6과13-01","과":"과학","학":"초5~6","영":"계절의 변화","p":"태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다."},{"교":"과학","c":"6과13-02","과":"과학","학":"초5~6","영":"계절의 변화","p":"계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다."},{"교":"과학","c":"6과13-03","과":"과학","학":"초5~6","영":"계절의 변화","p":"계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.","h":["지구 자전축이 기울어진 채 공전하기 때문에 계절에 따라 태양의 남중 고도가 달라져 지표가 받는 태양 에너지의 차이로 계절의 변화가 생김을 이해하게 한다."]},{"교":"과학","c":"6과14-01","과":"과학","학":"초5~6","영":"물질의 연소","p":"물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.","h":["서로 다른 물질을 섞었을 때 물질의 성질이 달라지는 변화를 활용한 재미있고 간단한 실험을 실시한다. 물질을 섞은 후 물질의 성질이 달라지는 까닭은 다루지 않으며, 물리 변화나 화학 변화 용어를 도입하지 않는다."]},{"교":"과학","c":"6과14-02","과":"과학","학":"초5~6","영":"물질의 연소","p":"물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.","h":["양초, 알코올, 나무 등과 같은 물질의 연소를 중심으로 다룬다."]},{"교":"과학","c":"6과14-03","과":"과학","학":"초5~6","영":"물질의 연소","p":"연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.","h":["물이나 이산화 탄소와 같은 연소 생성물은 염화 코발트 종이나 석회수 등을 이용한 실험으로 확인하고, 그을음은 연소 생성물로 다루지 않는다."]},{"교":"과학","c":"6과14-04","과":"과학","학":"초5~6","영":"물질의 연소","p":"연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.","h":["생태계의 피해 사례는 연소 생성물 중 이산화 탄소로 인한 피해 사례를 중심으로 조사한다."]},{"교":"과학","c":"6과15-01","과":"과학","학":"초5~6","영":"전기의 이용","p":"전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다."},{"교":"과학","c":"6과15-02","과":"과학","학":"초5~6","영":"전기의 이용","p":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.","h":["전구의 직렬연결과 병렬연결은 다루지 않고, 전지의 연결은 직렬연결만 다룬다."]},{"교":"과학","c":"6과15-03","과":"과학","학":"초5~6","영":"전기의 이용","p":"전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.","h":["전자석은 전지를 이용하여 제작하고, 전지의 수에 따라 전자석의 세기가 달라지는 현상, 전지의 연결 방향에 따라 전자석의 극이 달라지는 현상을 관찰하여 영구 자석과의 차이를 비교하도록 하되, 전류에 의한 자기장 개념은 도입하지 않는다."]},{"교":"과학","c":"6과15-04","과":"과학","학":"초5~6","영":"전기의 이용","p":"전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다."},{"교":"과학","c":"6과16-01","과":"과학","학":"초5~6","영":"과학과 나의 진로","p":"미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.","h":["단순한 상상이 아니라 현재의 다양한 정보를 기반으로 미래 사회의 문제를 예상해보도록 한다."]},{"교":"과학","c":"6과16-02","과":"과학","학":"초5~6","영":"과학과 나의 진로","p":"다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.","h":["과학자와 관련된 직업을 다루는 것이 아니라 학생이 희망하는 다양한 직업을 기준으로 하여 해당 직업과 관련된 과학적 요소를 찾도록 한다."]},{"교":"과학","c":"9과01-01","과":"과학","학":"중1~3","영":"과학과 인류의 지속가능한 삶","p":"과학적 탐구 방법을 이해하고, 일상생활의 문제에 대한 과학적 해결 방안을 제안할 수 있다.","h":["간단한 탐구 실험을 제시하여 탐구 절차 및 방법을 익히도록 하며, 학생이 스스로 발견한 문제를 일정 기간 동안 지속적으로 탐구하여 해결해 보는 기회를 제공할 수 있다."]},{"교":"과학","c":"9과01-02","과":"과학","학":"중1~3","영":"과학과 인류의 지속가능한 삶","p":"과학의 발전이 인류 문명에 미친 영향을 이해하고, 인공지능 등 첨단 과학기술이 가져올 미래 사회의 변화를 조사하여 발표할 수 있다.","h":["과학적 탐구 방법을 통해 얻은 과학 지식과 방법이 인류 문명과 문화 발달에 미친 영향을 중심으로 학습하고, 원리보다는 활용 측면에서 첨단 과학기술 사례를 함께 다룬다."]},{"교":"과학","c":"9과01-03","과":"과학","학":"중1~3","영":"과학과 인류의 지속가능한 삶","p":"인류의 지속가능한 삶을 위한 과학기술의 중요성과 역할에 대해 토의하고, 개인과 사회 차원의 활동 방안을 찾아 실천할 수 있다."},{"교":"과학","c":"9과02-01","과":"과학","학":"중1~3","영":"생물의 구성과 다양성","p":"세포는 생명 활동이 일어나는 기본 단위임을 이해하고, 세포의 구조와 기능의 관계를 추론할 수 있다.","h":["세포의 구조는 세포벽, 세포막, 핵, 엽록체, 미토콘드리아를, 세포의 특징으로는 생명 활동을 유추할 수 있는 세포(적혈구, 신경세포, 상피세포 등)를 다룬다."]},{"교":"과학","c":"9과02-02","과":"과학","학":"중1~3","영":"생물의 구성과 다양성","p":"생물의 유기적 구성 단계를 이해하고, 동물과 식물을 비교하여 분석할 수 있다."},{"교":"과학","c":"9과02-03","과":"과학","학":"중1~3","영":"생물의 구성과 다양성","p":"생물다양성을 이해하고, 변이와 생물다양성의 관계를 추론할 수 있다."},{"교":"과학","c":"9과02-04","과":"과학","학":"중1~3","영":"생물의 구성과 다양성","p":"종의 개념과 분류 체계를 이해하고, 생물을 계 수준에서 분류할 수 있다.","h":["종은 생물학적 종 개념만을, 생물 분류 체계는 5계만을 다루도록 한다."]},{"교":"과학","c":"9과02-05","과":"과학","학":"중1~3","영":"생물의 구성과 다양성","p":"생물다양성 보전의 필요성을 이해하고, 생물다양성 유지를 위한 방안을 조사하고 실천할 수 있다."},{"교":"과학","c":"9과03-01","과":"과학","학":"중1~3","영":"열","p":"온도와 열평형 과정을 물질을 구성하는 입자들의 배치나 움직임 등으로 설명할 수 있다.","h":["온도가 다른 두 물체가 열평형에 도달하는 과정을 시간-온도 그래프 등을 활용하여 설명할 수 있도록 한다."]},{"교":"과학","c":"9과03-02","과":"과학","학":"중1~3","영":"열","p":"열은 전도, 대류, 복사로 전달됨을 알고, 열전달 과정을 모형 등을 사용하여 다양하게 표현할 수 있다.","h":["열의 이동 방식을 주변 도구나 신체를 이용하여 비유적으로 다양하게 표현하고, 그 차이를 설명할 수 있도록 한다."]},{"교":"과학","c":"9과03-03","과":"과학","학":"중1~3","영":"열","p":"물질에 따라 비열과 열팽창 정도가 다름을 알고, 이러한 성질이 일상생활에서 유용하게 활용됨을 인식할 수 있다."},{"교":"과학","c":"9과04-01","과":"과학","학":"중1~3","영":"물질의 상태 변화","p":"확산 및 증발 현상을 관찰하여 물질을 구성하는 입자가 운동하고 있음을 추론할 수 있다."},{"교":"과학","c":"9과04-02","과":"과학","학":"중1~3","영":"물질의 상태 변화","p":"물질의 세 가지 상태의 특징을 설명하고, 이를 입자 모형으로 표현할 수 있다.","h":["물질의 상태를 나타내는 입자 모형은 입자 사이의 상대적 거리, 입자 배열의 불규칙한 정도, 입자의 운동성 등을 비교한 내용을 포함한다."]},{"교":"과학","c":"9과04-03","과":"과학","학":"중1~3","영":"물질의 상태 변화","p":"여러 가지 물질의 상태 변화를 관찰하고, 이를 입자 모형으로 설명할 수 있다.","h":["여러 가지 물질의 상태 변화를 관찰하여 융해, 응고, 기화, 액화, 승화를 구분하고, 물질의 상태가 변할 때 부피는 변하고 질량과 물질의 성질은 변하지 않는 이유를 입자 모형으로 설명한다."]},{"교":"과학","c":"9과04-04","과":"과학","학":"중1~3","영":"물질의 상태 변화","p":"물질의 상태 변화와 열에너지 출입 관계를 이해하고, 이를 실생활에 적용하여 과학의 유용성을 인식할 수 있다.","h":["물질의 상태 변화 시 온도가 일정한 이유를 상태 변화 과정에서 출입하는 열에너지와 관련지어 설명한다."]},{"교":"과학","c":"9과05-01","과":"과학","학":"중1~3","영":"힘의 작용","p":"물체에 작용하는 힘을 화살표를 이용하여 나타내고, 힘의 평형을 이루는 조건을 설명할 수 있다.","h":["힘의 정의를 알고 힘을 크기와 방향으로 나타낼 수 있도록 하며, 나란한 힘의 합력만을 다루도록 한다."]},{"교":"과학","c":"9과05-02","과":"과학","학":"중1~3","영":"힘의 작용","p":"중력, 탄성력, 마찰력, 부력을 이해하고, 각 힘의 특징을 크기와 방향으로 설명할 수 있다.","h":["중력을 지도할 때, 질량과 무게를 구별하도록 한다."]},{"교":"과학","c":"9과05-03","과":"과학","학":"중1~3","영":"힘의 작용","p":"알짜힘이 0이 아닐 때 물체의 운동 상태가 변함을 알고, 그 예를 조사하여 분류할 수 있다.","h":["물체가 힘을 받았을 때 물체의 운동을 속력이 변하거나 운동 방향이 바뀌거나 두 가지가 모두 변하는 사례로 분류하도록 한다."]},{"교":"과학","c":"9과05-04","과":"과학","학":"중1~3","영":"힘의 작용","p":"다양한 사례에서 작용하는 힘과 힘의 평형 관계를 설명하고, 일상생활에서 힘의 특징을 이용한 기구나 장치를 설계할 수 있다.","h":["바닥에 놓인 물체에 작용하는 힘을 설명할 때, 중력과 함께 바닥이 물체를 떠받치는 힘을 도입한다."]},{"교":"과학","c":"9과06-01","과":"과학","학":"중1~3","영":"기체의 성질","p":"압력의 의미를 알고, 기체의 압력을 입자의 운동으로 설명할 수 있다.","h":["압력의 의미는 일상생활에서 경험할 수 있는 예시로 설명하고, 기체의 압력은 일정한 면적에 입자의 충돌로 가해지는 힘의 수준에서 다룬다."]},{"교":"과학","c":"9과06-02","과":"과학","학":"중1~3","영":"기체의 성질","p":"기체의 압력과 부피 관계를 실험 결과로부터 알아내고, 이를 입자 모형으로 해석할 수 있다."},{"교":"과학","c":"9과06-03","과":"과학","학":"중1~3","영":"기체의 성질","p":"기체의 온도와 부피 관계를 실험 결과로부터 알아내고, 이를 입자 모형으로 해석할 수 있다."},{"교":"과학","c":"9과07-01","과":"과학","학":"중1~3","영":"태양계","p":"태양계를 구성하는 천체의 특징을 알고, 행성을 목성형 행성과 지구형 행성으로 구분할 수 있다.","h":["태양계를 구성하는 천체인 태양, 행성, 왜소행성, 소행성, 위성, 혜성을 개괄적으로 학습하며, 자세한 특징은 다루지 않는다."]},{"교":"과학","c":"9과07-02","과":"과학","학":"중1~3","영":"태양계","p":"태양의 표면과 대기에서 일어나는 현상을 알고, 태양의 활동이 지구에 미치는 영향을 추론할 수 있다."},{"교":"과학","c":"9과07-03","과":"과학","학":"중1~3","영":"태양계","p":"지구 자전에 의한 천체의 겉보기 운동과 지구 공전에 의한 별자리 변화를 이해하고, 밤하늘 천체에 호기심을 가진다.","h":["관측자의 위치(고위도, 저위도, 중위도)에 따른 일주운동은 다루지 않는다. 지구의 자전과 공전을 우주에서 바라보는 관점으로 설명한다."]},{"교":"과학","c":"9과07-04","과":"과학","학":"중1~3","영":"태양계","p":"달을 관측하여 달의 위상변화 원리를 이해하고, 일식과 월식을 설명할 수 있다."},{"교":"과학","c":"9과08-01","과":"과학","학":"중1~3","영":"물질의 특성","p":"물질의 특성의 의미를 알고, 실험을 통해 밀도, 용해도, 녹는점, 끓는점 등을 설명할 수 있다.","h":["물질의 특성은 특정한 조건에서 항상 일정한 값을 가지며 물질의 양에 따라 달라지지 않는 것으로 물질을 구분하는 중요한 정보가 됨을 이해하고, 그 사례로 밀도, 용해도, 녹는점, 끓는점 등이 있음을 다룬다."]},{"교":"과학","c":"9과08-02","과":"과학","학":"중1~3","영":"물질의 특성","p":"물질의 특성을 근거로 우리 주변의 물질을 순물질과 혼합물로 분류할 수 있다."},{"교":"과학","c":"9과08-03","과":"과학","학":"중1~3","영":"물질의 특성","p":"물질의 특성을 이용하여 혼합물이 분리되는 원리를 이해하고, 이를 이용한 사례를 주변에서 찾을 수 있다."},{"교":"과학","c":"9과09-01","과":"과학","학":"중1~3","영":"지권의 변화","p":"지구계의 구성 요소를 알고, 지권의 층상 구조와 그 특징을 조사⋅발표할 수 있다.","h":["지구계의 구성 요소 및 지권을 구성하는 각 층의 명칭과 상태만 다루며, 지구 내부구조 탐사에서 지진파의 특성은 다루지 않는다."]},{"교":"과학","c":"9과09-02","과":"과학","학":"중1~3","영":"지권의 변화","p":"조암 광물의 주요 특성을 관찰하고, 암석과 광물의 활용 방안 및 자원으로서 가치에 대해 조사할 수 있다.","h":["광물의 특성은 색, 조흔색, 굳기, 염산 반응, 자성만 다루고, 굳기는 방해석과 석영 정도만 비교하여 제시한다."]},{"교":"과학","c":"9과09-03","과":"과학","학":"중1~3","영":"지권의 변화","p":"지각을 이루는 암석을 생성 과정에 따라 분류하고, 암석의 순환 과정을 설명할 수 있다.","h":["지각에 분포하는 다양한 암석 중, 화성암은 현무암, 유문암, 화강암, 반려암을, 퇴적암은 이암, 사암, 역암, 석회암을, 변성암은 편암, 편마암, 대리암, 규암만을 대표적으로 다룬다."]},{"교":"과학","c":"9과09-04","과":"과학","학":"중1~3","영":"지권의 변화","p":"풍화 과정을 이해하고, 토양 생성 과정을 풍화 작용의 예로 설명할 수 있다."},{"교":"과학","c":"9과09-05","과":"과학","학":"중1~3","영":"지권의 변화","p":"대륙이동설을 이해하고, 지진과 화산이 발생하는 지역의 분포를 판의 경계와 관련지어 설명할 수 있다.","h":["화산대와 지진대의 분포가 판의 경계와 일치한다는 정도만 다루고, 판의 경계에서 나타나는 다양한 지질학적 특성은 고등학교 ‘지구과학’에서 다룬다."]},{"교":"과학","c":"9과10-01","과":"과학","학":"중1~3","영":"빛과 파동","p":"빛의 반사와 굴절의 원리를 이해하고, 물체를 보는 과정을 빛의 경로를 이용하여 표현할 수 있다.","h":["실험을 통해 빛의 반사, 굴절의 특징을 확인하고, 굴절 법칙은 정량적으로 다루지 않는다."]},{"교":"과학","c":"9과10-02","과":"과학","학":"중1~3","영":"빛과 파동","p":"평면거울에서 상이 생기는 원리를 설명하고, 일상생활에서 사용되는 거울과 렌즈의 종류를 분류하고 상의 특징을 비교할 수 있다.","h":["상이 생기는 원리는 평면거울에 의한 상만을 빛의 반사 법칙을 적용하여 이해하도록 한다. 다양한 거울과 렌즈에 의해 생기는 상의 위치나 크기를 정량적으로 계산하거나 실상과 허상을 구분하는 활동은 하지 않고, 정성적인 특징을 다양한 예를 통해 비교하도록 한다."]},{"교":"과학","c":"9과10-03","과":"과학","학":"중1~3","영":"빛과 파동","p":"물체의 색을 빛의 반사와 관련지어 설명하고, 영상 장치에서 빛의 합성을 이용하여 다양한 색이 표현되는 원리를 이해할 수 있다."},{"교":"과학","c":"9과10-04","과":"과학","학":"중1~3","영":"빛과 파동","p":"파동의 발생과 전달 과정을 이해하고, 소리의 특성을 진폭, 진동수, 파형 등의 과학적 용어로 표현할 수 있다.","h":["소리는 파동의 일종으로 매질을 통해 전달됨을 설명하고, 다양한 소리의 파형을 비교하여 파동의 진폭, 진동수, 파장의 개념을 설명하도록 한다. 종파와 횡파를 구분하여 설명하지는 않는다."]},{"교":"과학","c":"9과11-01","과":"과학","학":"중1~3","영":"물질의 구성","p":"원소와 화합물의 정의를 알고, 원소와 화합물을 화학식으로 표현할 수 있다."},{"교":"과학","c":"9과11-02","과":"과학","학":"중1~3","영":"물질의 구성","p":"원소를 구성하는 입자인 원자는 양성자, 중성자, 전자로 구성되며, 양성자의 수에 따라 원소의 종류가 달라짐을 입자 모형을 활용하여 설명할 수 있다.","h":["질량수나 동위 원소는 다루지 않는다."]},{"교":"과학","c":"9과11-03","과":"과학","학":"중1~3","영":"물질의 구성","p":"원소는 양성자의 수에 따라 주기율표에 배치됨을 알고, 주기율표에서 성질이 유사한 원소를 찾을 수 있다.","h":["동족 원소의 유사성은 1족 원소의 물과의 반응성, 18족 원소의 안정성 등 비슷한 성질을 지닌 원소들이 있음을 탐구를 통해 추론하고, 각 반응에 관한 구체적 설명이나 원리 및 원소의 주기성은 다루지 않는다."]},{"교":"과학","c":"9과11-04","과":"과학","학":"중1~3","영":"물질의 구성","p":"물질을 이루는 입자는 원자, 분자, 이온 등으로 존재할 수 있음을 알고, 이온은 전하를 띠고 있음을 설명할 수 있다.","h":["이온의 경우 원자가 전기적으로 중성임을 토대로 전자를 잃으면 양이온이 되고, 전자를 얻으면 음이온이 된다는 수준에서 다룬다."]},{"교":"과학","c":"9과12-01","과":"과학","학":"중1~3","영":"식물과 에너지","p":"광합성 과정을 이해하고, 환경 요인과 광합성의 관계를 탐구하는 실험을 설계할 수 있다."},{"교":"과학","c":"9과12-02","과":"과학","학":"중1~3","영":"식물과 에너지","p":"식물의 호흡과 광합성의 관계를 이해하고, 호흡과 광합성 과정에서 출입하는 에너지와 물질의 변화를 분석할 수 있다."},{"교":"과학","c":"9과12-03","과":"과학","학":"중1~3","영":"식물과 에너지","p":"광합성 산물의 저장과 이용 과정을 이해하고, 모형으로 설명할 수 있다.","h":["광합성 결과 만들어진 산물은 생명 활동에 필요한 에너지원임을 강조하여 다룬다."]},{"교":"과학","c":"9과13-01","과":"과학","학":"중1~3","영":"동물과 에너지","p":"소화계의 구조와 기능을 이해하고, 소화 과정을 소화 효소의 작용과 관련지어 추론할 수 있다.","h":["소화 기관에서 일어나는 소화 과정은 아밀레이스, 펩신, 트립신, 라이페이스 등 대표적인 몇 가지 소화 효소 중심으로 간단하게 언급한다."]},{"교":"과학","c":"9과13-02","과":"과학","학":"중1~3","영":"동물과 에너지","p":"순환계의 구조와 기능을 이해하고, 혈액의 순환 경로를 종합하여 발표할 수 있다."},{"교":"과학","c":"9과13-03","과":"과학","학":"중1~3","영":"동물과 에너지","p":"호흡계의 구조와 기능을 이해하고, 호흡 운동의 원리를 나타내는 모형을 만들 수 있다."},{"교":"과학","c":"9과13-04","과":"과학","학":"중1~3","영":"동물과 에너지","p":"배설계의 구조와 기능을 이해하고, 노폐물이 배설되는 과정을 모식도로 표현할 수 있다."},{"교":"과학","c":"9과13-05","과":"과학","학":"중1~3","영":"동물과 에너지","p":"동물이 세포호흡을 통해 에너지를 얻는 과정을 소화, 순환, 호흡, 배설과 관련지어 통합적으로 설명할 수 있다.","h":["각 기관계의 구조와 기능에 대한 자세한 언급보다는 에너지를 얻기 위한 통합적 관계에 중점을 두고 다룬다."]},{"교":"과학","c":"9과14-01","과":"과학","학":"중1~3","영":"전기와 자기","p":"마찰 전기, 정전기 유도 현상을 관찰하고, 이를 전기력과 원자 모형을 이용하여 설명할 수 있다."},{"교":"과학","c":"9과14-02","과":"과학","학":"중1~3","영":"전기와 자기","p":"전기 회로에서 전류를 모형으로 설명하고, 실험을 통해 저항, 전류, 전압 사이의 관계를 이끌어낼 수 있다.","h":["일상생활에 활용되는 다양한 물질의 저항이 다름을 도체와 부도체의 예를 들어 설명하고, 반도체를 소개한다."]},{"교":"과학","c":"9과14-03","과":"과학","학":"중1~3","영":"전기와 자기","p":"저항의 직렬연결과 병렬연결의 특징을 비교하고, 일상생활에서 전기 에너지가 다양한 형태의 에너지로 전환됨을 소비 전력과 관련지어 설명할 수 있다.","h":["저항의 연결에 따른 합성 저항의 정량적인 계산과 혼합 연결은 다루지 않는다. 소비 전력은 정량적인 계산보다는 에너지 전환 관점에서 다루도록 하고, 효율적인 전기 사용의 중요성을 인식하도록 한다."]},{"교":"과학","c":"9과14-04","과":"과학","학":"중1~3","영":"전기와 자기","p":"자기장 안에 놓인 전류가 흐르는 코일이 받는 힘의 특성을 추리하고, 전동기 등 일상생활에서 활용한 예를 찾을 수 있다.","h":["코일을 이용하여 전류의 세기와 방향에 따른 자기장의 세기와 방향을 정성적으로 확인하고, 전류가 흐르는 코일과 자석의 상호작용 관점에서 전동기의 원리를 이해하도록 한다."]},{"교":"과학","c":"9과15-01","과":"과학","학":"중1~3","영":"별과 우주","p":"연주시차를 이용하여 별까지의 거리를 구할 수 있고, 별의 등급과 밝기의 관계 및 표면 온도와 색의 관계를 설명할 수 있다.","h":["별까지의 거리를 구하는 방법은 수식을 도입하지 않으며, 연주시차와 겉보기 등급과 절대등급의 개념을 중심으로 다룬다. 별의 표면 온도는 별의 색을 이용하여 비교하는 수준으로만 다룬다."]},{"교":"과학","c":"9과15-02","과":"과학","학":"중1~3","영":"별과 우주","p":"우리은하의 구조와 크기를 이해하고, 성운과 성단의 특징을 비교할 수 있다."},{"교":"과학","c":"9과15-03","과":"과학","학":"중1~3","영":"별과 우주","p":"모형을 이용하여 우주가 팽창하고 있음을 설명할 수 있다.","h":["우주 팽창과 관련된 심화 내용(적색 편이, 허블 법칙, 가속 팽창 등)은 다루지 않는다."]},{"교":"과학","c":"9과15-04","과":"과학","학":"중1~3","영":"별과 우주","p":"우주탐사의 의의와 인류에게 미치는 영향을 조사하여 과학의 유용성을 인식할 수 있다."},{"교":"과학","c":"9과16-01","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"물리 변화와 화학 변화의 의미를 알고, 화학 변화에서 새로운 물질이 생성됨을 관찰할 수 있다."},{"교":"과학","c":"9과16-02","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"간단한 화학 반응을 화학 반응식으로 표현하고, 화학 반응식에서 계수의 비를 입자 수의 비로 해석할 수 있다."},{"교":"과학","c":"9과16-03","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"화학 반응에서 질량이 보존됨을 실험을 통해 추론할 수 있다.","h":["화학 반응이 일어날 때 물질을 구성하는 원자의 배열만 변하고, 원자의 종류와 수는 변하지 않음을 강조하여 설명한다."]},{"교":"과학","c":"9과16-04","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"화합물을 구성하는 성분 원소의 질량비가 일정함을 실험 자료를 해석하여 설명할 수 있다."},{"교":"과학","c":"9과16-05","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"기체 반응에서 기체 부피 사이의 비가 일정함을 실험 자료를 해석하여 설명할 수 있다."},{"교":"과학","c":"9과16-06","과":"과학","학":"중1~3","영":"화학 반응의 규칙성","p":"화학 반응에서 열에너지가 출입함을 알고, 생활 속 사례를 조사하여 발표할 수 있다."},{"교":"과학","c":"9과17-01","과":"과학","학":"중1~3","영":"날씨와 기후변화","p":"지구 대기권을 4개 권역으로 구분하며, 온실효과와 지구온난화를 복사 평형의 관점으로 설명할 수 있다."},{"교":"과학","c":"9과17-02","과":"과학","학":"중1~3","영":"날씨와 기후변화","p":"대기 대순환에서 위도별 바람의 특성을 파악하고, 대기 대순환의 역할을 설명할 수 있다.","h":["위도별로 지상에서 부는 바람은 북반구를 기준으로 설명하고, 대기 대순환 설명 시 전향력이나 지구가 자전하지 않을 경우는 다루지 않는다."]},{"교":"과학","c":"9과17-03","과":"과학","학":"중1~3","영":"날씨와 기후변화","p":"상대습도, 단열 팽창 및 응결 현상의 관계를 이해하고, 구름의 생성과 강수 과정을 설명할 수 있다.","h":["대기 중의 수증기량과 이슬점, 포화 수증기압, 상대습도 등의 관계를 파악하고, 구름의 생성은 모형실험으로 다룬다. 강수 과정은 빙정설과 병합설에 대해 정성적으로 간단하게 설명한다."]},{"교":"과학","c":"9과17-04","과":"과학","학":"중1~3","영":"날씨와 기후변화","p":"기압, 기단, 전선의 개념을 이해하고, 일기도에서 저기압과 고기압의 분포에 따른 날씨를 해석할 수 있다.","h":["기압의 개념과 크기 및 지표면의 차등 가열에 따른 온도 차이로 인해 기압의 변화가 생겨서 바람이 분다는 것을 다룬다. 등압선 그리기, 일기 예보의 과정, 일기도 작성은 다루지 않는다."]},{"교":"과학","c":"9과18-01","과":"과학","학":"중1~3","영":"수권과 해수의 순환","p":"수권에서 해수, 담수, 빙하의 분포와 활용 사례를 조사하고, 자원으로서 물의 가치에 대해 토론할 수 있다.","h":["자원으로서의 물의 가치에서는 지하수의 가치와 활용 방안, 지속가능한 수자원 활용 방안 조사⋅실천 등을 포함하여 다룬다."]},{"교":"과학","c":"9과18-02","과":"과학","학":"중1~3","영":"수권과 해수의 순환","p":"해수의 수온과 염분의 분포 및 변화를 해석하여 해수의 특성을 설명할 수 있다.","h":["위도에 따른 해수의 연직 수온 분포 차이보다는 우리나라 주변 해역의 계절별 연직 수온 분포를 위주로 다룬다."]},{"교":"과학","c":"9과18-03","과":"과학","학":"중1~3","영":"수권과 해수의 순환","p":"대기 대순환과 해양 표층 순환과의 관계를 이해하고, 기후변화에 영향을 미치는 해류의 역할을 설명할 수 있다.","h":["해류가 전 지구적인 에너지 재분배를 통하여 기후변화에 미치는 영향을 이해하게 하고, 북태평양의 아열대 순환을 구성하는 해류만을 다룬다."]},{"교":"과학","c":"9과19-01","과":"과학","학":"중1~3","영":"운동과 에너지","p":"직선상에서 움직이는 물체의 운동을 그래프로 나타내고 해석할 수 있다.","h":["물체의 직선 운동에서 등속 운동과 속력이 일정하게 증가하거나 감소하는 운동을 다루며, 속력이 변하는 경우에는 시간-속력 그래프를 그려서 운동을 분석한다."]},{"교":"과학","c":"9과19-02","과":"과학","학":"중1~3","영":"운동과 에너지","p":"자유 낙하하는 물체의 운동에서 시간에 따른 속력의 변화가 일정함을 분석할 수 있다.","h":["자유 낙하하는 물체의 운동에서 물체의 종류나 질량에 상관없이 단위 시간당 속력 변화량이 9.8m/s로 일정함을 자료를 분석하여 이끌어내도록 한다."]},{"교":"과학","c":"9과19-03","과":"과학","학":"중1~3","영":"운동과 에너지","p":"일의 정의를 알고, 자유 낙하하는 물체의 운동에서 중력이 한 일을 위치 에너지와 운동 에너지로 표현할 수 있다.","h":["중력이 한 일은 운동 에너지, 중력에 대해서 한 일은 위치 에너지로 전환됨을 확인한다."]},{"교":"과학","c":"9과19-04","과":"과학","학":"중1~3","영":"운동과 에너지","p":"물체의 운동에서 역학적 에너지의 전환과 보존을 이해하고, 이를 활용하여 일상생활 속 물체의 운동을 예측할 수 있다.","h":["단진자나 자유 낙하하는 물체 등의 사례에서 역학적 에너지 보존 법칙을 이용해 물체의 운동 상태를 예측할 수 있음을 설명한다."]},{"교":"과학","c":"9과20-01","과":"과학","학":"중1~3","영":"자극과 반응","p":"감각기관의 구조와 기능을 이해하고, 실험을 통해 자극이 뇌로 전달되는 과정을 추론할 수 있다.","h":["감각 기관의 구조는 간단히 언급하고, 자극이 감각 기관에서 뇌로 전달되는 과정을 중점적으로 설명한다."]},{"교":"과학","c":"9과20-02","과":"과학","학":"중1~3","영":"자극과 반응","p":"뉴런과 신경계의 구조와 기능을 이해하고, 자극에서 반응이 일어나기까지의 과정을 모형으로 설명할 수 있다."},{"교":"과학","c":"9과20-03","과":"과학","학":"중1~3","영":"자극과 반응","p":"우리 몸의 기능 조절에 호르몬이 관여함을 알고, 관련 자료를 조사하여 발표할 수 있다.","h":["호르몬의 종류는 성장호르몬, 인슐린, 글루카곤, 티록신 정도만 언급하고, 신경계와 호르몬의 작용으로 몸을 최적의 상태로 유지함을 강조하여 설명한다."]},{"교":"과학","c":"9과21-01","과":"과학","학":"중1~3","영":"생식과 유전","p":"개체의 생장에 세포분열이 필요한 이유를 세포의 표면적과 부피의 관계로 추론할 수 있다."},{"교":"과학","c":"9과21-02","과":"과학","학":"중1~3","영":"생식과 유전","p":"염색체와 유전자의 관계를 이해하고, 체세포분열과 생식세포 형성과정의 특징을 염색체 행동을 중심으로 해석할 수 있다.","h":["체세포분열과 생식 세포 형성 과정은 염색체의 행동을 중심으로 간단하게 다루며, 분열 과정의 단순한 암기보다 분열의 생물학적 의미를 이해하는 데 중점을 둔다."]},{"교":"과학","c":"9과21-03","과":"과학","학":"중1~3","영":"생식과 유전","p":"수정란으로부터 개체가 발생하는 과정을 모형으로 표현할 수 있다.","h":["발생 과정은 수정란의 초기 발생에서 난할만을 간단하게 다룬다."]},{"교":"과학","c":"9과21-04","과":"과학","학":"중1~3","영":"생식과 유전","p":"멘델 유전 실험의 의의와 원리를 이해하고, 멘델 유전 원리가 적용되는 유전 현상을 조사하여 협력적으로 소통할 수 있다."},{"교":"과학","c":"9과21-05","과":"과학","학":"중1~3","영":"생식과 유전","p":"사람의 유전 형질과 유전 연구 방법을 알고, 가계도를 분석하여 사람의 유전 현상을 설명할 수 있다."},{"교":"과학","c":"9과22-01","과":"과학","학":"중1~3","영":"재해⋅재난과 안전","p":"재해⋅재난 사례와 관련된 자료를 조사하고, 그 발생 원인과 피해에 대해 과학적으로 분석할 수 있다.","h":["재해⋅재난에 대한 사례 조사는 감염병 질병 확산, 화학물질 유출, 운송 수단 사고, 지진, 화산, 기상재해 등에서 선택하여 다룬다."]},{"교":"과학","c":"9과22-02","과":"과학","학":"중1~3","영":"재해⋅재난과 안전","p":"과학적 원리를 이용하여 재해⋅재난에 대한 대비 및 대처 방안을 세울 수 있다.","h":["재해⋅재난의 피해를 줄이기 위한 방안을 논의할 때는 사후 대처뿐만 아니라 사전 예방 및 대비를 다룬다."]},{"교":"과학","c":"9과23-01","과":"과학","학":"중1~3","영":"과학과 나의 미래","p":"과학과 관련된 직업의 종류와 하는 일을 조사하고, 과학기술의 발달로 생기는 미래 사회의 직업 변화를 예상할 수 있다."},{"교":"과학","c":"9과23-02","과":"과학","학":"중1~3","영":"과학과 나의 미래","p":"자신의 진로와 관련 있는 과학 분야를 조사하고, 진로 선택을 위하여 필요한 과학 학습을 계획할 수 있다.","h":["과학과 직접적으로 관련된 직업에서 과학의 역할 뿐만 아니라 기술, 공학, 사회, 예술, 문학 분야 등의 직업에서 필요한 과학 학문을 조사하여, 과학의 중요성과 유용성을 깨닫고 과학 학습 계획을 세우도록 한다."]},{"교":"과학","c":"10통과1-01-01","과":"통합과학1","학":"고1","영":"과학의 기초","p":"자연을 시간과 공간에서 기술할 수 있음을 알고, 길이와 시간 측정의 현대적 방법과 다양한 규모의 측정 사례를 조사할 수 있다.","h":["원자와 우주를 시간과 공간 차원에서 비교하면서 규모(scale)의 의미와 필요성을 소개하고, 시간과 공간을 측정하려는 과학자들의 노력이 인간의 경험 범위를 얼마나 확장했는지를 설명한다."]},{"교":"과학","c":"10통과1-01-02","과":"통합과학1","학":"고1","영":"과학의 기초","p":"과학 탐구에서 중요한 기본량의 의미를 알고, 자연 현상을 기술하는 데 단위가 가지는 의미와 적용사례를 설명할 수 있다.","h":["과학의 기본량으로 시간, 길이, 질량, 전류, 온도 등 초⋅중학교 과학 교과에서 이미 학습한 내용을 중심으로 다루며, 부피, 속력, 농도 등과 같은 초⋅중⋅고등학교 과학 교과의 주요 과학 개념들이 이러한 기본량으로부터 도출됨을 설명한다."]},{"교":"과학","c":"10통과1-01-03","과":"통합과학1","학":"고1","영":"과학의 기초","p":"과학 탐구에서 측정과 어림의 의미를 알고, 일상생활의 여러 가지 상황에서 측정 표준의 유용성과 필요성을 논증할 수 있다."},{"교":"과학","c":"10통과1-01-04","과":"통합과학1","학":"고1","영":"과학의 기초","p":"자연에서 일어나는 다양한 변화를 측정⋅분석하여 정보를 산출함을 알고, 이러한 정보를 디지털로 변환하는 기술을 정보 통신에 활용하여 현대 문명에 미친 영향을 인식한다.","h":["인간을 둘러싼 자연계의 변화가 전달될 때 신호가 되고, 이를 측정하여 분석할 때 정보가 됨을 다룬다. 센서를 통해 아날로그 형태의 다양한 신호가 전기 신호로 바뀌어 디지털 정보가 됨을 소개하며, 센서의 작동 원리는 다루지 않는다."]},{"교":"과학","c":"10통과1-02-01","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"천체에서 방출되는 빛의 스펙트럼을 분석하여 우주 초기에 형성된 원소와 천체의 구성 물질을 추론할 수 있다.","h":["분광기를 활용하여 수소의 선스펙트럼을 관찰하고 이를 우주 전역의 선스펙트럼을 관찰한 결과 자료와 비교함으로써 우주 진화 초기에 만들어진 수소와 헬륨이 현재 우주의 주요 구성 원소임을 파악하게 한다."]},{"교":"과학","c":"10통과1-02-02","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"우주 초기의 원소들로부터 태양계의 재료이면서 생명체를 구성하는 원소들이 형성되는 과정을 통해 지구와 생명의 역사가 우주 역사의 일부분임을 해석할 수 있다.","h":["별의 진화 과정에서 별 내부의 핵융합을 통해 탄소, 질소, 산소가 생성되는 것을 정성적으로 다루고, 초신성 폭발의 결과로 철보다 무거운 원소가 만들어짐을 다룬다."]},{"교":"과학","c":"10통과1-02-03","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"세상을 구성하는 원소들의 성질이 주기성을 나타내는 현상을 통해 자연의 규칙성을 도출하고, 지구와 생명체를 구성하는 주요 원소들이 결합을 형성하는 이유를 해석할 수 있다.","h":["주기율표의 1족과 17족 원소를 통해 동족 원소는 유사한 화학적 성질을 가진다는 것을 다룬다. 주요 원소들이 화학 결합을 형성하는 이유를 전자껍질 모형을 이용한 전자배치를 통해 안정성을 지닌 원소와 비교하여 설명한다."]},{"교":"과학","c":"10통과1-02-04","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"인류의 생존에 필수적인 물, 산소, 소금 등이 만들어지는 결합의 차이를 이해하고 각 물질의 성질과 관련지어 설명할 수 있다.","h":["각 화학 결합으로 나타나는 성질은 전기 전도성에 한정하여 다룬다."]},{"교":"과학","c":"10통과1-02-05","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"지각과 생명체를 구성하는 물질들이 기본 단위체의 결합을 통해서 형성된다는 것을 규산염 광물, 단백질과 핵산의 예를 통해 설명할 수 있다.","h":["지각을 구성하는 규산염 광물은 Si–O 사면체를 기본 골격으로 하여 다양한 광물들이 만들어짐을 다루되, 구체적인 구조식이나 화학식은 다루지 않는다. 일정한 구조를 가진 기본 단위체들의 다양한 배열을 통해 여러 가지 구조와 기능을 갖는 생명체의 주요 구성 물질이 생성될 수 있음을 단백질과 핵산을 중심으로 학습하고, 기본 단위체를 비롯한 단백질과 핵산의 구체적인 구조식이나 화학식은 다루지 않는다."]},{"교":"과학","c":"10통과1-02-06","과":"통합과학1","학":"고1","영":"물질과 규칙성","p":"지구를 구성하는 물질을 전기적 성질에 따라 구분할 수 있고, 물질의 전기적 성질을 응용하여 일상생활과 첨단기술에서 다양한 소재로 활용됨을 인식한다.","h":["지구를 구성하는 여러 물질을 원자 내 자유전자의 이동에 따라 도체, 부도체, 반도체로 구분할 수 있고, 특히 규산염 광물이 반도체 소자의 재료가 되어 현대 사회에서 매우 유용하게 활용됨을 소개한다. 이때 반도체의 원리는 불순물을 추가함에 따라 전기적 성질을 제어하기 쉽다는 수준으로 소개하고 접합 원리는 다루지 않는다."]},{"교":"과학","c":"10통과1-03-01","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"지구시스템은 태양계라는 시스템의 구성요소임을 알고, 지구시스템을 구성하는 권역들 간의 물질 순환과 에너지 흐름의 결과로 나타나는 현상을 논증할 수 있다."},{"교":"과학","c":"10통과1-03-02","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"지권의 변화를 판구조론 관점에서 해석하고, 에너지 흐름의 결과로 발생하는 지권의 변화가 지구시스템에 미치는 영향을 추론할 수 있다."},{"교":"과학","c":"10통과1-03-03","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"중력의 작용으로 인한 지구 표면과 지구 주위의 다양한 운동을 설명할 수 있다.","h":["지구 표면을 향해 낙하하거나 지구 주위를 공전하는 원운동은 모두 중력에 의한 지구 중심 방향의 가속도 운동임을 설명한다."]},{"교":"과학","c":"10통과1-03-04","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"상호작용이 없을 때 물체가 가속되지 않음을 알고, 충격량과 운동량의 관계를 충돌 관련 안전장치와 스포츠에 적용할 수 있다.","h":["일상생활의 역학 시스템에서 물체의 관성 및 충돌에 의한 안전사고 예방을 위한 대비책 및 장치를 고안할 때 관성 법칙과 충격량을 활용하게 한다."]},{"교":"과학","c":"10통과1-03-05","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"생명 시스템을 유지하기 위해서 다양한 화학 반응과 물질 출입이 필요함을 이해하고, 일상생활에서 활용되는 화학 반응 사례를 조사하여 발표할 수 있다.","h":["생명 시스템의 기본 단위인 세포에서 일어나는 화학 반응에 효소가 필요하고, 세포막을 통한 선택적 투과를 통해 물질 출입이 일어남을 학습한다."]},{"교":"과학","c":"10통과1-03-06","과":"통합과학1","학":"고1","영":"시스템과 상호작용","p":"생명 시스템의 유지에 필요한 세포 내 정보의 흐름을 유전자로부터 단백질이 만들어지는 과정을 중심으로 설명할 수 있다.","h":["전사와 번역을 통해 유전물질로부터 단백질이 만들어지는 과정에 대해 학습하고, 생명 시스템의 유지를 위한 세포 내 정보의 흐름이 체계적으로 구성되어 있음을 이해한다."]},{"교":"과학","c":"10통과2-01-01","과":"통합과학2","학":"고1","영":"변화와 다양성","p":"지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다."},{"교":"과학","c":"10통과2-01-02","과":"통합과학2","학":"고1","영":"변화와 다양성","p":"변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다양성이 형성되었음을 추론할 수 있다.","h":["변이의 발생과 자연선택 과정에 대한 모의실험을 수행하고 다윈의 자연선택설을 중심으로 생물의 진화를 학습한다. 생물다양성을 유전적 다양성, 종 다양성, 생태계 다양성으로 설명하고, 생물다양성을 보전하기 위한 구체적인 사례와 실천 방안을 탐색한다."]},{"교":"과학","c":"10통과2-01-03","과":"통합과학2","학":"고1","영":"변화와 다양성","p":"자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성으로 분석할 수 있다.","h":["산화⋅환원 반응을 산소와 전자의 이동으로 설명하되, 산화수는 다루지 않는다."]},{"교":"과학","c":"10통과2-01-04","과":"통합과학2","학":"고1","영":"변화와 다양성","p":"대표적인 산⋅염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다.","h":["산⋅염기 정의는 아레니우스 정의만 다루고, 중화 반응 과정에서의 변화는 용액의 온도 변화와 지시약의 색 변화만을 다룬다."]},{"교":"과학","c":"10통과2-01-05","과":"통합과학2","학":"고1","영":"변화와 다양성","p":"생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생활에 어떻게 이용되는지 토의할 수 있다.","h":["화학 반응의 열 출입에서 열화학 반응식, 엔탈피를 다루지 않는다."]},{"교":"과학","c":"10통과2-02-01","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"생태계 구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다.","h":["생태계 구성요소들이 서로 영향을 주고받음을 생물과 환경 사이의 상호 관계를 중심으로 학습한다."]},{"교":"과학","c":"10통과2-02-02","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다."},{"교":"과학","c":"10통과2-02-03","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다."},{"교":"과학","c":"10통과2-02-04","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"태양에서 수소 핵융합 반응을 통해 질량 일부가 에너지로 바뀌고, 그중 일부가 지구에서 에너지 흐름을 일으키며 다양한 에너지로 전환되는 과정을 추론할 수 있다.","h":["태양에서 수소가 헬륨으로 핵융합하는 과정에서 질량이 줄어서 태양 에너지가 생성됨을 정성적으로만 다룬다."]},{"교":"과학","c":"10통과2-02-05","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사⋅발표할 수 있다.","h":["코일을 통과하는 자기장의 세기가 변할 때 유도되는 전류를 관찰하여 전자기 유도 현상을 정성적으로 이해하고, 이를 이용한 간이 발전기를 만들어 발전소에서 전기 에너지를 만드는 방법을 설명한다."]},{"교":"과학","c":"10통과2-02-06","과":"통합과학2","학":"고1","영":"환경과 에너지","p":"에너지 효율의 의미와 중요성을 이해하고, 지속가능한 발전과 지구 환경 문제 해결에 신재생 에너지 기술을 활용하는 방안을 탐색할 수 있다.","h":["에너지가 다양한 형태로 존재하고, 에너지가 다른 형태로 전환되는 과정에서 에너지의 총량이 보존됨을 일상생활의 사례 중심으로 설명한다. 에너지가 사용되는 과정에서 열이 발생하며 특히 화석 연료의 사용 과정에서 버려지는 열에너지로 인해 에너지 이용의 효율이 낮아진다는 것을 설명한다."]},{"교":"과학","c":"10통과2-03-01","과":"통합과학2","학":"고1","영":"과학과 미래 사회","p":"감염병의 진단, 추적 등을 사례로 과학의 유용성을 설명하고, 미래 사회 문제 해결에서 과학의 필요성에 대해 논증할 수 있다."},{"교":"과학","c":"10통과2-03-02","과":"통합과학2","학":"고1","영":"과학과 미래 사회","p":"빅데이터를 과학기술사회에서 사용하고 있는 사례를 조사하고, 빅데이터 활용의 장점과 문제점을 추론할 수 있다.","h":["과학 실험, 기상 관측, 유전체 분석, 신약 개발 등과 같은 분야에서 많은 정보를 디지털 형태로 전환하여 대량의 데이터를 축적할 수 있게 되면서, 일상생활의 다양한 분야에서 폭넓게 활용할 수 있음을 소개한다."]},{"교":"과학","c":"10통과2-03-03","과":"통합과학2","학":"고1","영":"과학과 미래 사회","p":"인공지능 로봇, 사물인터넷 등과 같이 과학기술의 발전을 인간 삶과 환경 개선에 활용하는 사례를 찾고, 이러한 과학기술의 발전이 미래 사회에 미치는 유용성과 한계를 예측할 수 있다."},{"교":"과학","c":"10통과2-03-04","과":"통합과학2","학":"고1","영":"과학과 미래 사회","p":"과학기술의 발전 과정에서 발생할 수 있는 과학 관련 사회적 쟁점(SSI)과 과학기술 이용에서 과학 윤리의 중요성에 대해 논증할 수 있다."},{"교":"과학","c":"10과탐1-01-01","과":"과학탐구실험1","학":"고1","영":"과학의 본성과 역사 속의 과학 탐구","p":"과학사에서 패러다임의 전환을 가져온 결정적 실험을 따라 해보고, 과학의 발전 과정에 관해 설명할 수 있다.","h":["과학사에서 패러다임의 전환을 가져온 대표적 사례로 갈릴레이가 수행했던 다양한 형태의 실험을 ‘통합과학1’과 ‘통합과학2'에서 다룬 탐구 활동 및 주제와 관련지어 수행해본다."]},{"교":"과학","c":"10과탐1-01-02","과":"과학탐구실험1","학":"고1","영":"과학의 본성과 역사 속의 과학 탐구","p":"과학사의 다양한 사례들로부터 과학의 본성을 추론할 수 있다.","h":["과학자들의 꾸준한 노력과 함께 과학자의 우연한 발견 등을 통한 과학 지식 도출과 과학 지식의 잠정성 등 다양한 사례를 통해 과학의 본성을 체험할 기회를 제공하고, 우리 선조들의 과학 기술 발전의 사례도 찾아본다."]},{"교":"과학","c":"10과탐1-02-01","과":"과학탐구실험1","학":"고1","영":"과학 탐구의 과정과 절차","p":"직접적인 관찰을 통한 탐구를 수행하고, 귀납적 탐구 방법을 설명할 수 있다."},{"교":"과학","c":"10과탐1-02-02","과":"과학탐구실험1","학":"고1","영":"과학 탐구의 과정과 절차","p":"가설 설정을 포함한 과학사의 대표적인 탐구실험을 수행하고, 연역적 탐구 방법의 특징을 예증할 수 있다.","h":["‘과학탐구실험1’에서 제시한 탐구 활동과 연계하여 귀납적 탐구 및 연역적 탐구를 학생들이 직접 수행함으로써 과학 지식의 변천 과정을 체험하게 한다."]},{"교":"과학","c":"10과탐1-02-03","과":"과학탐구실험1","학":"고1","영":"과학 탐구의 과정과 절차","p":"탐구 수행에서 얻은 정성적 혹은 정량적 데이터를 분석하고 그 결과를 다양하게 표상하고 소통할 수 있다."},{"교":"과학","c":"10과탐1-02-04","과":"과학탐구실험1","학":"고1","영":"과학 탐구의 과정과 절차","p":"흥미와 호기심을 갖고 과학 탐구에 참여하고, 분야 간 협동 연구 등을 통해 협력적 탐구 활동을 수행하며, 도출한 결과를 증거에 근거하여 해석하고 평가할 수 있다."},{"교":"과학","c":"10과탐2-01-01","과":"과학탐구실험2","학":"고1","영":"생활 속의 과학 탐구","p":"영화, 건축, 요리, 스포츠, 미디어 등 생활 속의 과학 원리를 실험 등을 통해 탐구하고, 과학 원리를 활용한 놀이 체험을 통해 과학의 즐거움과 유용성을 느낄 수 있다.","h":["과학이 적용된 생활 제품, 영화, 건축, 요리, 스포츠, 미디어, 놀이 체험 등의 다양한 분야에서 몇 가지 사례를 중심으로 과학적 원리, 유용성과 가치, 즐거움 등을 깨달을 수 있는 탐구와 실험 활동을 진행한다."]},{"교":"과학","c":"10과탐2-01-02","과":"과학탐구실험2","학":"고1","영":"생활 속의 과학 탐구","p":"사회적 이슈나 생활 속에서 과학 탐구 문제를 발견하고, 이를 해결하기 위한 과학 탐구 활동을 계획하고 수행할 수 있다.","h":["‘통합과학1’과 ‘통합과학2'에 제시된 일상생활과 관련된 탐구 주제 및 활동을 중심으로 사회적 현상과 이슈에서
