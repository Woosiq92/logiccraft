다시 글을 쓰는 과정을 통해 글의 완결성을 높이는 것이다. 학습자는 추가, 삭제, 재구성 등과 같은 고쳐 쓰기 과정을 통해 자신의 글을 점검⋅성찰하는 자기주도적 역량과 함께 글쓰기에 대한 흥미와 자신감을 높인다."]},{"교":"영어","c":"12실영01-01","과":"실생활 영어 회화","학":"고2~3","영":"","p":"실생활에 관한 말이나 대화를 듣고 핵심 정보를 파악한다."},{"교":"영어","c":"12실영01-02","과":"실생활 영어 회화","학":"고2~3","영":"","p":"실생활에 관한 말이나 대화를 듣고 화자의 의도나 목적을 추론한다."},{"교":"영어","c":"12실영01-03","과":"실생활 영어 회화","학":"고2~3","영":"","p":"자신이나 주변 사람 또는 사물을 자신감 있게 소개한다.","h":["이 성취기준은 학습자가 스스로에 대해서뿐만 아니라 주변 사람이나 사물에 대해 자신감 있게 소개하는 것이다. 실생활에서 자신과 주변 사람, 사물을 자신 있고 분명한 목소리로 소개하는 능력을 기르는 것을 의미한다."]},{"교":"영어","c":"12실영01-04","과":"실생활 영어 회화","학":"고2~3","영":"","p":"존중과 배려의 자세로 상대방의 말을 경청하고 자신의 의견이나 감정을 표현한다.","h":["이 성취기준은 실생활에서 일어나는 일이나 사건에 대해 상대방의 생각과 감정을 존중하고 배려하여 상대방의 말을 경청하고 학습자가 생각하거나 느끼는 바를 표현하는 것이다. 이는 실생활에서 겪는 다양한 일에 대해 비언어적 의사소통 방식(얼굴 표정, 몸동작, 시선 교환 등)을 적절하게 사용하여 상대방의 감정에 대한 이해와 공감을 표시하며 자신의 생각이나 감정을 전달하는 능력을 기르는 것이다. 특히, 언어⋅문화적 배경이 다른 사람과 의사소통할 때 타 문화를 포용하고 존중하는 자세로 경청함으로써 협력적 소통 역량을 기르도록 하는 것이 중요하다."]},{"교":"영어","c":"12실영01-05","과":"실생활 영어 회화","학":"고2~3","영":"","p":"실생활에 관한 경험이나 사건 또는 간단한 시각 자료를 묘사한다.","h":["이 성취기준은 학습자가 실생활과 관련하여 듣거나 읽은 자료, 간단한 시각 자료(그림, 사진 등)와 같은 사실적 정보를 자신의 발음, 속도, 어휘, 문장 구조 등을 조정하여 구체적으로 묘사하는 것이다. 묘사하는 과정에서 청자의 이해 여부를 점검하는 질문을 사용하여 학습자는 원하는 정보를 전달하는 능력을 기르게 된다. 또한 응집성과 일관성 있는 담화를 구성하기 위해 적절한 담화 표지(연결어, 대명사 등)를 사용한다."]},{"교":"영어","c":"12실영01-06","과":"실생활 영어 회화","학":"고2~3","영":"","p":"실생활에 필요한 일의 방법이나 절차를 설명한다.","h":["이 성취기준은 일이나 과업의 수행 방법, 절차 등과 같은 사실적 정보를 자신의 발음, 속도, 어휘, 문장 구조 등을 조정하여 청자가 이해할 수 있도록 구체적으로 설명하는 것이다. 설명하는 과정에서 청자에게 이해 여부를 점검하는 질문(예: Do you understand what I’m saying?; Are you with me? 등)을 함으로써 의미 교섭 과정에 참여하여 방법이나 절차를 정확하게 설명하게 한다."]},{"교":"영어","c":"12실영01-07","과":"실생활 영어 회화","학":"고2~3","영":"","p":"실생활에서 상황이나 목적에 맞게 대화를 이어 간다.","h":["이 성취기준은 화자가 실생활에서 일어나는 여러 가지 대화 상황에서 다양한 목적(인사, 소개하기, 요청하기, 제안하기 등)에 맞게 대화를 이어 가는 것이다. 학습자로 하여금 대화를 시작하고(예: Excuse me, By the way 등), 상대의 반응에 적절하게 반응하며(예: I see, Okay 등), 대화를 종결하기 위한 적절한 표현(예: I’m sorry but I’ve got to go now. 등)을 사용하여 대화에 참여하도록 한다."]},{"교":"영어","c":"12실영01-08","과":"실생활 영어 회화","학":"고2~3","영":"","p":"의사소통 상황이나 목적에 맞게 언어적⋅비언어적 표현을 사용하여 반응한다.","h":["이 성취기준은 학습자가 의사소통 상황이나 목적에 맞게 언어적⋅비언어적 표현(얼굴 표정, 몸동작, 시선 교환 등)을 사용하여 반응하는 것이다. 학습자가 청자의 말이나 대화의 내용과 의도를 파악하여 언어적 또는 비언어적 표현을 사용하여 적절하게 말하거나 행동할 수 있도록 한다."]},{"교":"영어","c":"12실영01-09","과":"실생활 영어 회화","학":"고2~3","영":"","p":"의사소통 상황이나 목적에 맞게 적절한 전략을 적용하여 대화에 참여한다."},{"교":"영어","c":"12미영01-01","과":"미디어 영어","학":"고2~3","영":"","p":"영어 검색 엔진을 활용하여 필요한 정보를 찾아낸다.","h":["이 성취기준은 학습자가 영어로 표현된 많은 정보 중에서 필요한 정보를 찾아내기 위해 적절한 검색어를 생각해 내고 글로벌 검색 엔진을 활용하여 검색하는 것이다. 예를 들어 브레인스토밍 활동 시 핵심이 되는 영어 핵심어를 추출하여 정보를 검색하고 필요한 자료를 찾아 체계적으로 정리하는 활동을 할 수 있다."]},{"교":"영어","c":"12미영01-02","과":"미디어 영어","학":"고2~3","영":"","p":"다양한 주제에 대한 창의적 문제 해결을 위해 미디어를 활용하여 협업한다.","h":["이 성취기준은 학습자가 영어로 표현된 미디어상의 다양한 주제에 대해 네트워크로 연결된 PC나 태블릿 PC 또는 스마트폰에서 다양한 미디어를 활용하여 창의적 문제 해결을 위해 구성원이 공동으로 작업하는 것이다. 학습자가 공동 작업을 할 수 있는 원격 플랫폼이나 원격 도구를 제공하는 온라인 협업 도구를 이용해 서로 협력하여 주어진 과제나 문제를 창의적으로 해결하는 것을 의미한다."]},{"교":"영어","c":"12미영01-03","과":"미디어 영어","학":"고2~3","영":"","p":"미디어 정보에서 핵심어를 추출하여 내용을 요약하거나 재구성한다.","h":["이 성취기준은 학습자가 다양한 미디어에서 영어로 표현된 주제에 대해 자신의 생각을 요약하여 쓰거나 미디어에서 영어로 표현된 정보를 수집하고 분석하여 이를 창의적으로 재구성하는 것이다. 예를 들어 미디어의 특성을 반영한 다양한 영어 표현을 익히고 자신의 목적에 따라 적합한 어휘, 표현, 문장 구조 등을 활용하여 미디어에 나타난 정보에서 핵심어를 추출하고, 그 내용을 요약⋅재구성하여 문자 언어나 음성 언어로 표현하는 것을 의미한다."]},{"교":"영어","c":"12미영01-04","과":"미디어 영어","학":"고2~3","영":"","p":"미디어 정보를 비판적 태도로 검색, 선정, 비교 및 분석한다.","h":["이 성취기준은 학습자가 다양한 미디어를 활용하여 미디어에서 다루는 다양한 주제나 소재 및 상황이나 맥락을 경험하고 이에 관해 상대방과 자신의 생각을 나누며 관련 정보를 검색, 선정, 비교, 분석하는 것이다. 예를 들어 책, 신문, 잡지, 방송, 인터넷, 영화, 팝송, 인터넷, 소셜 미디어, 원격 플랫폼, 동영상 플랫폼, 게임과 웹툰, 가상⋅증강⋅혼합 현실 미디어 등 다양한 미디어 속 정보를 목적에 맞게 효과적으로 검색하거나 핵심 정보를 선정하여 그 내용을 비교하거나 비판적으로 분석한다."]},{"교":"영어","c":"12미영01-05","과":"미디어 영어","학":"고2~3","영":"","p":"목적이나 대상에 적합한 미디어를 활용하여 의견이나 정보를 공유한다.","h":["이 성취기준은 학습자가 목적이나 대상에 적합한 미디어를 선정하고 이를 활용하여 자신의 의견이나 정보를 정보 윤리에 맞게 공유하는 것이다. 예를 들어 영어 댓글 또는 사회 관계망 서비스(SNS) 프로필 등의 짧은 영어 문장 작성하기, 자신의 의견을 짧은 동영상으로 만들어 소셜 미디어에 게시하고 이에 대한 반응을 확인하며 서로 소통하기 등의 활동이 있다."]},{"교":"영어","c":"12미영01-06","과":"미디어 영어","학":"고2~3","영":"","p":"미디어 정보를 융합하고 적절한 도구를 활용하여 콘텐츠를 제작한다.","h":["이 성취기준은 학습자가 미디어에 대한 이해를 바탕으로 다양한 미디어 정보를 융합하고 미디어의 특성에 적절한 도구를 활용하여 콘텐츠를 만드는 것이다. 예를 들어 시, 팝송, 감상문, 광고문, 포스터, 인포그래픽, 온라인 게시물, 뉴스레터, 차트, 독서 활동 스토리, 메타버스 콘텐츠 등을 제작하는 활동이 있다."]},{"교":"영어","c":"12미영01-07","과":"미디어 영어","학":"고2~3","영":"","p":"미디어에서 접하는 다양한 시청각 단서를 이해하거나 적절하게 표현한다.","h":["이 성취기준은 학습자가 미디어에서 접하는 다양한 시청각 단서를 이해하고 이를 적절한 방식으로 표현하는 것이다. 예를 들어 텍스트 이외의 다양한 표현 방식(이미지, 색, 소리, 디자인, 하이퍼텍스트, 애니메이션, 이모티콘, 움직임 등)을 포함한 시청각 요소를 통해 표현에 대한 설득력을 증진하도록 하는 것을 의미한다."]},{"교":"영어","c":"12미영01-08","과":"미디어 영어","학":"고2~3","영":"","p":"미디어에 제시된 작품을 감상하고 다양한 관점에서 평가한다.","h":["이 성취기준은 학습자가 미디어에 제시된 여러 작품을 감상하고 자신의 관점이나 작품 속 등장인물의 관점 등 다양한 시각으로 작품에 대해 평가하는 것이다. 특히, 서로 다른 입장이 드러나 있는 설득을 위한 글이나 영상, 광고문, 편지, 개인 블로그, 온라인 콘텐츠, 메타버스상의 전시회나 박람회 등 여러 유형의 작품을 감상하고 평가할 때는 각각의 관점과 입장을 고려한다."]},{"교":"영어","c":"12미영01-09","과":"미디어 영어","학":"고2~3","영":"","p":"미디어 정보를 창의적⋅비판적으로 처리하기 위해 정보의 출처를 확인하고 정보 보안을 준수한다.","h":["이 성취기준은 학습자가 다양한 미디어에서 다루는 정보 내용이 사실인지 의견인지를 판단하고, 의도는 무엇인지, 감정이나 생각은 어떻게 변화하는지 등을 이해하는 것이다. 그리고 그 출처를 확인하여 내용을 비판적으로 판단하고 정보 윤리와 정보 보안을 준수하여 표현하거나 정보를 처리하는 것이다."]},{"교":"영어","c":"12미영01-10","과":"미디어 영어","학":"고2~3","영":"","p":"오류 수정을 위해 디지털 도구를 적절히 활용한다.","h":["이 성취기준은 학습자가 글이나 발표 원고를 작성하고 디지털 도구를 활용하여 오류를 수정하는 것이다. 글을 쓰거나 말로 표현할 때, 디지털 도구를 활용하여 자신이 전달하고자 하는 바를 정확하게 표현하는 것이 포함된다."]},{"교":"영어","c":"12세영01-01","과":"세계 문화와 영어","학":"고2~3","영":"","p":"적절한 전략을 사용하여 다양한 장르와 매체의 문화 정보나 문화적 산물의 핵심 내용을 파악한다."},{"교":"영어","c":"12세영01-02","과":"세계 문화와 영어","학":"고2~3","영":"","p":"문화 관련 주요 개념을 적용하여 문화 현상을 분석하고 새로운 관점으로 설명한다.","h":["이 성취기준은 다양한 문화 현상을 이해하고 관점을 형성하는 데 필요한 문화 관련 주요 개념을 학습한 후 주어진 문화 현상이 나타난 맥락과 배경에 대한 이해를 바탕으로 해당 현상의 의미를 상세히 설명하거나 자신의 삶에 적용하는 것을 의미한다. 문화 관련 주요 내용으로 문화의 정의, 문화의 속성(변동성, 보편성, 특수성 등), 문화를 이해하는 태도(문화 상대주의, 자문화 중심주의, 문화 사대주의), 문화 정체성(개인주의, 집단주의), 문화 다양성, 문화 다원주의, 문화 고정 관념 등이 있다. 학습자는 수업의 주제나 내용과 관련된 주요 개념을 학습하여 다양한 문화 현상에 대한 지식과 관점을 형성하고 이를 바탕으로 다양한 시각에서 문화 현상을 이해할 수 있다."]},{"교":"영어","c":"12세영01-03","과":"세계 문화와 영어","학":"고2~3","영":"","p":"타 문화 및 언어에 대한 존중을 바탕으로 문화 정보를 수용하고 자신의 의견을 표현한다.","h":["이 성취기준은 자신의 언어⋅문화적 배경에서 비롯된 고정 관념에서 탈피하여 타 문화와 언어를 있는 그대로 인정하는 자세로 구두, 문자, 영상 등 다양한 문화 정보의 핵심 내용을 이해하고 다양한 방식으로 표현하는 것을 의미한다. 문화 간에 우열이 존재하지 않으며 모든 문화는 서로 다른 자연환경, 역사적 배경, 사회적 상황과 필요에 따라 형성된 것이므로 각자 그 나름대로의 고유한 가치가 있다는 문화 상대주의적인 태도를 통해 글로벌 다문화 시대에 필요한 갈등 해소와 공존의 자세를 기른다."]},{"교":"영어","c":"12세영01-04","과":"세계 문화와 영어","학":"고2~3","영":"","p":"문화 현상이나 문화적 산물을 비교⋅대조하여 문화의 보편성과 특수성을 파악한다.","h":["이 성취기준은 다양한 문화에서 나타나는 여러 유형의 생활 양식, 사고방식, 의사소통 방식 등에 관한 정보를 이해하고 이들을 비교⋅대조해 봄으로써 여러 문화 사이의 공통점과 차이점을 파악하여 문화의 보편성과 특수성을 파악하는 것이다. 어느 사회에나 특정 문화 요소가 공통으로 존재하는 동시에 나름의 독특한 생활 양식이 존재한다는 문화의 보편성과 특수성에 대한 이해를 통해, 우리 문화는 물론 다른 문화를 더욱 깊이 이해하고 존중하게 된다."]},{"교":"영어","c":"12세영01-05","과":"세계 문화와 영어","학":"고2~3","영":"","p":"문화적 산물이나 문화 현상에 내재된 문화적 전제, 관점 또는 가치관을 추론한다.","h":["이 성취기준은 문화적 산물이나 현상에 숨어 있는 특정 문화권의 구성원이 공유하는 전제나 관점 또는 가치관을 추론하는 것을 의미한다. 해당 문화권 구성원의 사고방식이나 행동 양식에 결정적인 영향을 미치는 문화적 전제나 관점, 가치관을 파악하여 특정한 문화적 행동과 현상의 원인을 파악하고 그 구성원을 이해하려는 자세를 기른다."]},{"교":"영어","c":"12세영01-06","과":"세계 문화와 영어","학":"고2~3","영":"","p":"다른 문화권의 관습, 규범, 가치, 사고방식, 행동 양식 또는 의사소통 방식을 이해하고 자신의 문화 인식 및 관점을 비판적으로 성찰한다.","h":["이 성취기준은 세계 문화에 관한 다양한 주제의 정보를 통해 타 문화에 대한 고정 관념이나 편견, 오해 등에 대한 자신의 문화 인식과 관점을 비판적으로 성찰하는 것을 의미한다. 자신이 속한 문화에서는 지극히 정상적으로 여겨지는 행동이나 사고방식이 다른 문화에서는 다르게 인식되거나 해석될 수 있다는 자각을 통해 자문화 중심주의에서 벗어나 세계시민의 관점을 획득하게 된다."]},{"교":"영어","c":"12세영01-07","과":"세계 문화와 영어","학":"고2~3","영":"","p":"자발적⋅지속적 관심과 흥미를 가지고 다양한 문화적 산물을 감상하고 표현한다.","h":["이 성취기준은 인쇄물, 방송 및 온라인 콘텐츠, 유⋅무형의 문화유산 등 다양한 형태의 문화적 산물을 감상한 뒤 감상의 동기, 감동적이거나 인상적인 내용 또는 기억에 남는 부분에 대한 자신의 느낌과 생각을 여러 방식으로 표현하는 것을 의미한다. 학습자는 문화적 산물을 감상하며 실제로 사용되는 영어를 경험하고 관련 문화의 사고방식, 행동 양식, 역사적 사실이나 인물 등에 관한 배경지식을 형성하게 된다. 감상의 표현에는 감상문, 토의, 발표 등 기존의 말하기나 쓰기뿐만 아니라 그림, 역할극, 마임, 온라인 매체를 활용한 창의적 활동 등이 포함된다."]},{"교":"영어","c":"12세영01-08","과":"세계 문화와 영어","학":"고2~3","영":"","p":"세계 영어에 대한 이해를 바탕으로 적절한 전략과 태도를 갖추어 의사소통에 참여한다.","h":["이 성취기준은 국제 공용어로서 영어의 위상과 세계 영어의 개념 및 취지에 대한 이해를 바탕으로 의사소통의 상황과 목적, 대상에 맞는 전략, 태도, 격식을 갖추어 다양한 온오프라인 대화나 글쓰기에 참여하는 것을 의미한다. 국제적 소통에서 가장 널리 사용되는 영어의 다양성에 대한 지식과 이해를 갖추고, 차별이나 편견을 내포하는 표현을 배제하고 포용적인 언어를 사용하려는 노력을 통해 글로벌 다문화 시대가 요구하는 의사소통 능력을 기른다."]},{"교":"영어","c":"12세영01-09","과":"세계 문화와 영어","학":"고2~3","영":"","p":"다양한 장르와 매체에서 검색⋅수집한 문화 정보를 요약하거나 목적에 맞게 재구성한다."},{"교":"영어","c":"12세영01-10","과":"세계 문화와 영어","학":"고2~3","영":"","p":"정보 윤리를 준수하여 다양한 목적의 문화 콘텐츠를 제작하여 공유한다.","h":["이 성취기준은 전달하고자 하는 내용에 대한 책임감을 가지고 정보의 정확성, 타당성, 시의성 등을 평가하고 이를 재구성하여 다양한 내용과 형태의 문화 콘텐츠를 제작한 뒤 효과적인 방법과 매체로 공유하는 것을 의미한다. 문화 콘텐츠로는 문화 비교 보고서, 감상문, 조사 발표, 문화 기행, 문화적 산물을 소개하는 영상, 카드 뉴스, 인포그래픽, 온오프라인 포스터 등 다양한 형태가 가능하다."]}],"고시":{"국어":"교육부 고시 제2022-33호 [별책 5] 국어과 교육과정","도덕":"교육부 고시 제2022-33호 [별책 6] 도덕과 교육과정","사회":"교육부 고시 제2022-33호 [별책 7] 사회과 교육과정","수학":"교육부 고시 제2022-33호 [별책 8] 수학과 교육과정","과학":"교육부 고시 제2022-33호 [별책 9] 과학과 교육과정","실과(기술⋅가정)":"교육부 고시 제2022-33호 [별책 10] 실과(기술⋅가정)/정보과 교육과정","정보":"교육부 고시 제2022-33호 [별책 10] 실과(기술⋅가정)/정보과 교육과정","체육":"교육부 고시 제2022-33호 [별책 11] 체육과 교육과정","음악":"교육부 고시 제2022-33호 [별책 12] 음악과 교육과정","미술":"교육부 고시 제2022-33호 [별책 13] 미술과 교육과정","영어":"교육부 고시 제2022-33호 [별책 14] 영어과 교육과정"},"교과순":["국어","도덕","사회","수학","과학","실과(기술⋅가정)","정보","체육","음악","미술","영어"],"학년순":["초1~2","초3~4","초5~6","중1~3","고1","고2~3"]};
const CAP = 200;

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hi(s, q) {
  const t = esc(s);
  if (!q) return t;
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>');
}

// 지표 — 데이터에서 센다
const 과목수 = new Set(D.항목.map(x => x.교 + '·' + x.과)).size;
const 해설수 = D.항목.reduce((n, x) => n + (x.h ? x.h.length : 0), 0);
[[D.항목.length, '성취기준'], [D.교과순.length, '교과'], [과목수, '과목'], [해설수, '성취기준 해설']]
  .forEach(([n, l]) => {
    const c = el('div', 'card');
    c.appendChild(el('div', 'n', n.toLocaleString()));
    c.appendChild(el('div', 'l', l));
    document.getElementById('cards').appendChild(c);
  });

const qi = document.getElementById('q');
const si = document.getElementById('subj');
const gi = document.getElementById('grade');
si.appendChild(new Option('교과 전체', ''));
D.교과순.forEach(s => si.appendChild(new Option(s, s)));
gi.appendChild(new Option('학년군 전체', ''));
D.학년순.forEach(g => gi.appendChild(new Option(g, g)));

function draw() {
  const q = qi.value.trim();
  const s = si.value, g = gi.value;
  const lq = q.toLowerCase();
  const hits = D.항목.filter(x =>
    (!s || x.교 === s) && (!g || x.학 === g) &&
    (!q || x.c.toLowerCase().includes(lq) || x.p.toLowerCase().includes(lq)
        || (x.h && x.h.some(t => t.toLowerCase().includes(lq))))
  );

  document.getElementById('count').textContent =
    hits.length ? `${hits.length.toLocaleString()}건` : '';

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!hits.length) {
    list.appendChild(el('div', 'empty', '찾는 성취기준이 없다. 코드 앞자리만 넣어도 된다 — 6수03, 9과, 12정.'));
    return;
  }
  hits.slice(0, CAP).forEach(x => {
    const box = el('div', 'hit');
    const m = el('div', 'meta');
    m.appendChild(el('span', null, '<code>' + hi(x.c, q) + '</code>'));
    m.appendChild(el('span', null, esc(x.과)));
    m.appendChild(el('span', null, esc(x.학)));
    if (x.영) m.appendChild(el('span', null, esc(x.영)));
    box.appendChild(m);
    box.appendChild(el('div', 'stmt', hi(x.p, q)));
    if (x.h) {
      const d = el('details');
      d.appendChild(el('summary', null,
        x.h.length > 1 ? `성취기준 해설 ${x.h.length}건` : '성취기준 해설'));
      x.h.forEach(t => d.appendChild(el('div', 'expl', hi(t, q))));
      box.appendChild(d);
    }
    box.appendChild(el('div', 'src', esc(D.고시[x.교] || '')));
    list.appendChild(box);
  });
  if (hits.length > CAP) {
    list.appendChild(el('div', 'more',
      `${hits.length.toLocaleString()}건 중 ${CAP}건만 그렸다. 검색어나 교과를 좁히면 나머지가 보인다.`));
  }
}

[qi, si, gi].forEach(n => n.addEventListener('input', draw));
draw();
</script>
</body>
</html>
