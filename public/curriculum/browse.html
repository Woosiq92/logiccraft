골 제국의 팽창에 따른 교류 양상을 파악한다."},{"교":"사회","c":"12세사02-02","과":"세계사","학":"고2~3","영":"교역망의 확대","p":"유럽의 신항로 개척과 재정⋅군사 국가의 성립이 가져온 변화를 분석한다.","h":["신항로 개척 이후의 교역망 확대 및 식민지 건설을 중상주의와 연결하여 이해하고, 이와 더불어 유럽의 재정⋅군사 국가 간 견제와 균형의 상황이 전개되었다는 점을 고려한다. 또한 재정⋅군사 국가의 지리적 확장이 유럽, 식민지에 가져온 변화를 다양한 측면에서 분석하고 파악하는 데 중점을 둔다."]},{"교":"사회","c":"12세사02-03","과":"세계사","학":"고2~3","영":"교역망의 확대","p":"세계적 상품 교역이 가져온 사회적⋅경제적 변화를 이해한다.","h":["유라시아 대륙, 인도양, 대서양, 태평양을 통해 유통된 향신료, 차, 도자기, 면직물, 은, 설탕 등의 상품 교역과 노예 무역이 가져온 변화를 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"12세사03-01","과":"세계사","학":"고2~3","영":"국민 국가의 형성","p":"청, 무굴 제국, 오스만 제국의 통치 정책과 사회, 문화의 변화를 이해한다.","h":["중국, 인도, 서아시아 지역에서 서구와는 다른 정치, 경제 모델이 발전하고 있었음을 이해한다. 청, 무굴 제국, 오스만 제국이 여러 민족, 문화를 통합하는 방식과 농업, 상업, 수공업 등 경제가 성장하는 양상에 초점을 맞춘다."]},{"교":"사회","c":"12세사03-02","과":"세계사","학":"고2~3","영":"국민 국가의 형성","p":"미국 혁명, 프랑스 혁명을 시민 사회 형성과 관련지어 파악한다.","h":["18세기 말 인간의 권리에 대한 자각, 계몽사상의 영향과 함께 진행된 미국 혁명과 프랑스 혁명의 성과와 한계를 살펴본다. 또한 참정권 제한에 대해 보편적 인권을 확보하려는 노력이 19세기 유럽과 아메리카의 시민 사회 형성과 다양한 정치⋅사회적 운동으로 발전해 나갔다는 점에 초점을 맞춘다."]},{"교":"사회","c":"12세사03-03","과":"세계사","학":"고2~3","영":"국민 국가의 형성","p":"제1⋅2차 산업 혁명이 가져온 사회, 경제, 생태환경의 변화를 분석한다.","h":["제1⋅2차 산업 혁명이 초래한 경제적 변동과 산업 자본주의의 발전, 그리고 이에 따라 나타난 사회 문제와 생태환경 문제를 파악하며, 이를 바탕으로 서양 열강의 제국주의 정책을 이해하는 데 중점을 둔다."]},{"교":"사회","c":"12세사03-04","과":"세계사","학":"고2~3","영":"국민 국가의 형성","p":"아시아와 아프리카 지역에서 전개된 국민 국가 건설 운동의 양상과 성격을 비교한다."},{"교":"사회","c":"12세사04-01","과":"세계사","학":"고2~3","영":"현대 세계의 과제","p":"제1⋅2차 세계 대전을 인권, 과학 기술 문제와 관련지어 파악한다.","h":["두 차례 세계 대전이 총력전의 성격을 지녔음을 이해한다. 대량 살상과 인권 침해 사례를 조사하고, 전쟁의 참상을 과학 기술과 관련지어 살펴보는 데 초점을 맞춘다."]},{"교":"사회","c":"12세사04-02","과":"세계사","학":"고2~3","영":"현대 세계의 과제","p":"냉전의 전개 양상에 따라 나타난 사회, 문화의 변화를 분석한다.","h":["냉전 질서 속에서 전개된 갈등의 대표적인 사례를 조사하고, 냉전의 대결 구도 속에서 나타난 사회적⋅문화적 변화를 탐구하는 데 초점을 맞춘다."]},{"교":"사회","c":"12세사04-03","과":"세계사","학":"고2~3","영":"현대 세계의 과제","p":"현대 세계의 과제를 해결하기 위해 인류가 기울여온 노력을 탐구한다.","h":["민주주의, 평화, 경제적 불평등, 생태환경 등 현대 세계의 과제에 대한 인류의 노력을 학습자가 스스로 탐구해볼 수 있도록 설정하였다. 세계사에서 학습한 내용을 토대로 현대 문제를 탐색하고 해결 방안을 도출하는 데 초점을 맞춘다."]},{"교":"사회","c":"12사문01-01","과":"사회와 문화","학":"고2~3","영":"사회현상의 이해와 탐구","p":"사회현상의 탐구를 위해 사회현상의 특징에 대한 이해와 사회학적 상상력이 필요함을 인식하고, 사회현상에 대한 다양한 관점을 비교한다.","h":["은 자연현상과 사회현상의 특징을 비교하고, 사회학적 상상력에 기초하여 사회현상이 개인을 넘어서는 사회적 관계 및 맥락 속에서 발생하여 개인의 삶에 영향을 미친다는 점을 인식하며, 이를 바탕으로 동일한 사회현상을 다양한 관점에서 이해할 수 있음을 파악하기 위한 것이다. 이를 위해 사회현상을 이해하는 관점으로 기능론, 갈등론, 상징적 상호 작용론을 다룰 수 있다."]},{"교":"사회","c":"12사문01-02","과":"사회와 문화","학":"고2~3","영":"사회현상의 이해와 탐구","p":"사회현상에 대한 양적 연구 방법과 질적 연구 방법의 특징 및 연구 절차를 비교하고, 각 연구 방법을 활용한 연구 사례를 분석한다."},{"교":"사회","c":"12사문01-03","과":"사회와 문화","학":"고2~3","영":"사회현상의 이해와 탐구","p":"사회현상에 대한 다양한 자료 수집 방법의 특징을 비교하고, 각 자료 수집 방법을 활용한 연구 사례를 분석한다."},{"교":"사회","c":"12사문01-04","과":"사회와 문화","학":"고2~3","영":"사회현상의 이해와 탐구","p":"사회현상의 탐구에서 발생하는 연구자의 가치 개입 및 연구 윤리 관련 쟁점을 토론하고, 연구 윤리를 준수하며 사회현상에 대한 탐구를 수행한다.","h":["는 사회현상의 탐구 과정에서 발생하는 연구자의 가치 개입 및 가치 중립, 연구 윤리에 관한 쟁점을 살펴보고, 이를 고려하여 학생들이 사회현상에 대한 연구 주제를 선정하고 실제로 탐구를 계획⋅수행하는 것을 목적으로 한다."]},{"교":"사회","c":"12사문02-01","과":"사회와 문화","학":"고2~3","영":"사회 구조와 사회 변동","p":"사회 구조와 개인의 관계에 대한 이해를 바탕으로 개인의 사회화 과정, 사회화 기관 및 유형을 설명하고, 사회화에 대한 서로 다른 이론적 관점을 비교한다."},{"교":"사회","c":"12사문02-02","과":"사회와 문화","학":"고2~3","영":"사회 구조와 사회 변동","p":"사회 집단 및 사회 조직의 유형과 변화 양상에 대한 이해를 바탕으로 사회 집단 및 사회 조직이 개인의 사회생활과 사회적 관계에 미치는 영향을 설명한다.","h":["는 다양한 사회 집단 및 사회 조직의 특징을 살펴보고, 현대 사회에서 나타나고 있는 사회 집단 및 사회 조직의 변화 요인 및 양상을 분석함으로써 사회 집단 및 사회 조직과 개인의 관계를 이해하기 위한 것이다. 이를 위해 사회 집단 및 사회 조직을 분류하는 데 중점을 두기보다는 다양한 사회 집단 및 사회 조직이 복합적으로 개인의 삶에 영향을 미치고 있으며, 현대 사회에서 사회 집단과 조직의 성격이 변화하고 있음을 이해하는 데 초점을 맞춘다."]},{"교":"사회","c":"12사문02-03","과":"사회와 문화","학":"고2~3","영":"사회 구조와 사회 변동","p":"일탈 행동의 발생 요인이나 특성을 설명하는 다양한 일탈 이론을 비교하고, 일탈 행동에 대한 사회 통제의 유형과 사회 통제의 필요성 및 문제점을 분석한다.","h":["은 다양한 이론을 통해 일탈 행동의 원인과 해결 방안을 살펴보고, 다양한 사회 통제 유형에 대한 이해를 바탕으로 일탈 행동에 대한 사회 통제의 필요성과 문제점을 비판적으로 분석하기 위한 것이다. 이를 위해 일탈 이론으로는 아노미 이론, 차별 교제 이론, 낙인 이론, 비판 범죄학 이론 등을, 사회 통제 유형으로는 내적 통제와 외적 통제, 공식적 통제와 비공식적 통제를 다룰 수 있다."]},{"교":"사회","c":"12사문02-04","과":"사회와 문화","학":"고2~3","영":"사회 구조와 사회 변동","p":"사회 변동이 다양한 요인의 복합적인 상호 작용의 산물이라는 점을 설명하고, 현대 사회의 변동 과정에서 나타나는 다양한 사회 운동의 유형과 특징을 탐구한다.","h":["는 현대 사회의 다양한 변동 양상을 통해 사회 변동이 여러 요인들의 복합적인 상호 작용의 산물임을 이해하고, 현대 사회의 변동 과정에서 중요한 역할을 하는 사회 운동의 유형과 특징을 실제 사례를 통해 탐구하기 위한 것이다. 이를 위해 현대 사회의 변동 양상으로 정보 사회로의 이행, 세계화, 저출산 및 고령화로 인한 인구 구조의 변화 등을 다룰 수 있다."]},{"교":"사회","c":"12사문03-01","과":"사회와 문화","학":"고2~3","영":"일상 문화와 문화 변동","p":"대중문화에 대한 다양한 관점을 비교하고, 일상적으로 접하는 사례를 중심으로 대중문화가 개인과 사회에 미치는 영향을 토의한다.","h":["은 대중문화에 대한 다양한 관점을 비교하여 대중문화에 대한 균형 있는 이해를 도모하고, 이를 바탕으로 일상적으로 접하는 다양한 대중문화가 우리의 삶과 사회에 미치는 영향을 능동적으로 탐구하기 위한 것이다. 이를 위해 대중문화에 대한 관점으로 리비스주의, 문화 산업론, 문화주의, 취향 문화론 등을 다룰 수 있다."]},{"교":"사회","c":"12사문03-02","과":"사회와 문화","학":"고2~3","영":"일상 문화와 문화 변동","p":"미디어의 효과에 대한 이해를 바탕으로 미디어가 생산하는 메시지를 비판적으로 분석하고 대안적 메시지 생산에 능동적으로 참여한다.","h":["는 미디어의 효과를 다양한 이론을 통해 살펴본 후, 이를 바탕으로 미디어가 생산하는 메시지의 내용, 의도, 영향 등을 비판적으로 분석하고 기존의 미디어가 생산한 메시지의 문제점을 해결할 수 있는 대안적 메시지 생산 능력을 키우기 위한 것이다. 이를 위해 미디어의 효과에 관한 이론으로 침묵의 나선 이론, 문화 배양 이론, 프레이밍 이론, 의제 설정 이론 등을 다룰 수 있다."]},{"교":"사회","c":"12사문03-03","과":"사회와 문화","학":"고2~3","영":"일상 문화와 문화 변동","p":"하위문화와 주류 문화의 관계에 대한 이해를 바탕으로 다문화 사회의 이주민 문화에 대한 서로 다른 관점을 비교하고, 이주민 문화가 갖는 의의에 기초하여 문화 다양성을 증진하기 위한 방안을 제시한다.","h":["은 주류 문화와의 관련성을 바탕으로 하위문화의 특징과 다양한 사례를 이해하고, 하위문화의 한 사례로서 다문화 사회의 이주민 문화에 대한 서로 다른 관점을 비교하여 문화 다양성 증진 방안을 모색하기 위한 것이다. 이를 위해 대항 문화, 지역 문화, 세대 문화, 이주민 문화 등을 통해 하위문화의 특징과 사례를 살펴보고, 이주민 문화에 대한 서로 다른 관점으로 동화주의와 다문화주의를 비교할 수 있다."]},{"교":"사회","c":"12사문03-04","과":"사회와 문화","학":"고2~3","영":"일상 문화와 문화 변동","p":"문화 변동의 다양한 요인과 양상, 문화 변동 과정에서 발생하는 문제점을 이해하고, 문화의 세계화로 인해 나타나는 쟁점에 대해 탐구한다."},{"교":"사회","c":"12사문04-01","과":"사회와 문화","학":"고2~3","영":"사회 불평등과 사회 복지","p":"사회 불평등 현상을 이해하는 서로 다른 관점을 비교하고, 사회 이동과 사회 계층 구조의 유형 및 특징을 분석한다."},{"교":"사회","c":"12사문04-02","과":"사회와 문화","학":"고2~3","영":"사회 불평등과 사회 복지","p":"현대 사회에서 나타나는 다양한 사회 불평등 양상을 분석하고, 차별받는 사람들의 입장에 대한 공감을 바탕으로 다양한 불평등 현상에 대한 해결 방안을 모색한다.","h":["는 현대 사회에서 나타나는 다양한 사회 불평등 양상의 원인과 실태를 분석하고, 해결 방안을 모색하기 위한 것이다. 이를 위해 사회 불평등 양상으로 빈곤, 성 불평등, 사회적 소수자 차별 문제 등을 다룰 수 있다."]},{"교":"사회","c":"12사문04-03","과":"사회와 문화","학":"고2~3","영":"사회 불평등과 사회 복지","p":"복지 국가의 발전 과정에 대한 이해를 바탕으로 사회 복지 제도의 유형과 특징을 비교하고, 현대 사회에서 나타나고 있는 사회 복지를 둘러싼 쟁점을 토론한다.","h":["은 사회 복지 제도의 유형과 특징, 최근의 변화 양상을 우리나라의 사회 복지 제도를 통해 이해하고, 이를 바탕으로 현대 사회에서 나타나고 있는 사회 복지를 둘러싼 쟁점을 토론함으로써 사회 복지의 발전 방안을 모색하기 위한 것이다. 이를 위해 우리나라의 사회 복지 제도로서 사회 보험, 공공 부조, 사회 서비스를 비교하고, 생산적 복지 이념의 도입으로 인한 변화를 분석할 필요가 있다. 또한 현대 사회에서 나타나고 있는 사회 복지에 관한 쟁점으로 보편적 복지와 선별적 복지를 둘러싼 쟁점, 아동 복지나 노인 복지를 둘러싼 쟁점 등을 다룰 수 있다."]},{"교":"사회","c":"12한탐01-01","과":"한국지리 탐구","학":"고2~3","영":"공간정보와 지리 탐구","p":"다양한 현상에 대해 지리적 관점으로 질문을 던지고, 질문에 답을 하기 위한 탐구 계획을 수립한다.","h":["은 일상적으로 경험하는 현상들에 대해 지리적 질문을 던지고, 이러한 질문에 답하기 위해 어떤 근거가 필요하며 나아가 근거를 어떻게 수집할 수 있는지 파악하는 일련의 질문 던지기와 탐구 계획 세우기의 과정을 숙달하기 위해 설정되었다. 학생들은 탐구하려는 현상에 대해 ‘그 현상은 어디인가?’ ‘왜 거기일까?’ ‘그 현상은 어떻게 변화해 왔는가?’ ‘그 현상으로 어떤 영향이 있을까?’ ‘나는 그 현상에 대해 어떻게 생각하는가?’와 같은 질문을 던질 수 있다. 또한, 교사는 학생의 탐구 계획 수립을 지원하기 위해 ‘그 질문에 답하기 위해 어떤 근거가 필요할까?’ ‘그 근거는 어디서, 어떻게 구할 수 있을까?’ ‘주어진 시간 내에 수집이 가능할까?’ ‘근거를 확보한다면 어떻게 정리하고, 표현할 수 있을까?’와 같은 질문을 던질 수 있다."]},{"교":"사회","c":"12한탐01-02","과":"한국지리 탐구","학":"고2~3","영":"공간정보와 지리 탐구","p":"야외조사 및 지리정보기술을 활용한 데이터 수집방법을 연습하고, 탐구 질문에 맞춰 데이터를 수집, 분석, 시각화한다.","h":["는 지리탐구 계획에 맞춰 직접 데이터를 수집, 분석, 시각화해 보는 것이 목적이다. 학생들의 원활한 데이터 수집을 지원하기 위해 양적 연구방법과 질적 연구방법의 차이를 설명하고, 통계 자료나 데이터베이스, 야외조사 방법이나 지리정보기술의 활용 방법을 안내한다. [12한탐01-02]는 지리탐구를 수행하기에 적합한 다른 성취기준과 통합하여 운영할 수 있다."]},{"교":"사회","c":"12한탐02-01","과":"한국지리 탐구","학":"고2~3","영":"생활 속 지리 탐구","p":"식품의 생산, 유통, 소비과정을 조사함으로써 음식을 통한 생산자와 소비자, 상품, 장소의 연결성을 이해하고, 상품사슬을 조직하는 윤리적인 방식의 가능성과 한계를 파악한다.","h":["은 음식이라는 일상적인 소재를 통해 나와 지역, 세계와의 연결성을 이해하고, 나아가 자신의 소비가 생산과정과 생산지의 윤리적, 생태적 변화에 미치는 영향을 탐색하기 위해 설정되었다. 이를 위해 자신이 소비하는 식품을 선정하여 생산지의 위치와 자연환경, 생산에 참여하는 사람들과 생산방식, 유통 경로와 운송수단, 소비 장소와 소비문화를 조사한다. 이 과정에서 학생들이 상품의 소비자일 뿐만 아니라 지역과 공동체를 변화시킬 수 있는 주체임을 인식할 수 있도록 한다."]},{"교":"사회","c":"12한탐02-02","과":"한국지리 탐구","학":"고2~3","영":"생활 속 지리 탐구","p":"핫 플레이스의 특징, 생성과정, 정체성 이슈를 조사하고, 지역 자원을 활용한 관광 활성화 방안을 제안한다.","h":["는 장소도 다른 상품과 마찬가지로 광고나 미디어를 통해 알려지고 소비될 뿐만 아니라 사람들의 기대에 맞춰 재창조되기도 한다. 사람들이 많이 찾는 핫 플레이스를 소재로 매력적인 장소가 어떻게 만들어지고 선택되며 소비되는지, 매력적인 장소를 만들기 위해 지역에서는 어떤 전략을 활용하고 노력을 하는지, 이 과정에서 미디어의 역할은 무엇인지를 종합적으로 이해하는 것이 목적이다. 자신이 거주하는 지역에 대한 온오프라인의 다양한 관광 관련 데이터를 조사하고, 이를 토대로 스토리텔링과 장소 마케팅 전략을 시도하며, 관광지로서의 장⋅단점, 잠재성을 평가한다."]},{"교":"사회","c":"12한탐02-03","과":"한국지리 탐구","학":"고2~3","영":"생활 속 지리 탐구","p":"모빌리티와 모바일, 빅 데이터, 플랫폼의 결합이 시⋅공간 활용에 미치는 영향을 설명하고, 모빌리티 공유서비스가 일상생활에 미친 영향과 문제점을 조사해 대안을 제시한다.","h":["은 모빌리티를 소재로 4차 산업혁명 기술이 개인의 이동성과 시⋅공간 활용, 지역의 교통 및 환경문제 등에 미치는 영향을 조사하기 위해 설정되었다. 이를 위해 모빌리티 공유서비스(예: 공유 자전거, 공유 자동차), 무인 자동차, 개인화된 모빌리티 등 최근 모빌리티의 변화와 이러한 변화를 가능하게 하는 인공지능, 자율주행, 빅 데이터 분석 등 4차 산업혁명 기술을 연결지어 이해한다."]},{"교":"사회","c":"12한탐03-01","과":"한국지리 탐구","학":"고2~3","영":"국토의 변화와 균형 발전 탐구","p":"통계 자료를 활용해 우리나라 인구 및 가구구조의 변화를 시각화 및 분석하고, 저출생, 고령화, 다문화 가구의 증가에 대응하기 위한 방안을 모색한다.","h":["은 통계 자료를 통해 우리나라의 인구 및 가구구조에서 나타나고 있는 주요한 변화들을 확인 및 분석하고, 이를 토대로 미래 사회의 변화를 예측하며, 국가 수준의 대응 노력을 평가하는 것이 목적이다. 특히, 저출생, 고령화, 1인 가구, 다문화 가구 증가의 원인과 배경에 대해 생각해 보고, 자신이 생각하는 대응 방안을 정부의 정책과 비교해볼 수 있도록 한다."]},{"교":"사회","c":"12한탐03-02","과":"한국지리 탐구","학":"고2~3","영":"국토의 변화와 균형 발전 탐구","p":"식생활 변화 및 세계화에 따른 우리나라 농업의 변화를 이해하고, 지속가능한 농업과 농촌을 위한 정책을 제안한다.","h":["는 식생활 변화와 농산물 수입 등 세계화에 따른 우리나라 농업의 변화에 대한 조사 결과를 바탕으로 농업 및 농촌이 당면한 과제를 농업생산성, 농산물 가격, 식량안보, 농지정책, 농촌인력 등의 측면에서 이해하고, 해결책을 모색하는 것이 목적이다."]},{"교":"사회","c":"12한탐03-03","과":"한국지리 탐구","학":"고2~3","영":"국토의 변화와 균형 발전 탐구","p":"산업구조의 전환이 지역 경제에 미치는 영향을 이해하고, 이를 바탕으로 최근 급속하게 성장한 지역과 위기의 징후가 나타나는 지역의 성격과 특징을 비교한다.","h":["은 산업구조의 변화 과정에서 특정 지역의 경제가 성장하고 쇠퇴할 수 있음을 사례 지역을 통해 파악하고, 현재 우리나라의 기술변화 및 산업구조 전환에 대한 이해를 바탕으로 성장하고 있는 지역과 위기에 처한 지역을 비교하기 위해 설정되었다."]},{"교":"사회","c":"12한탐03-04","과":"한국지리 탐구","학":"고2~3","영":"국토의 변화와 균형 발전 탐구","p":"수도권 집중에 따른 지방소멸과 국토 불균등 발전 문제에 대한 인식을 바탕으로 국가 및 지역 수준의 국토균형발전 방안을 제안하고 실현 가능성을 평가한다.","h":["는 도시의 인구 규모 변화 분석을 통해 국토 공간의 불균등 성장으로 수도권 집중과 공간적 확산, 지방 소멸이 나타남을 이해하고, 국토의 균형발전을 위한 국가 및 지역 수준의 정책을 제안 및 평가하기 위해 설정되었다."]},{"교":"사회","c":"12한탐04-01","과":"한국지리 탐구","학":"고2~3","영":"환경과 지속가능성 탐구","p":"세계유산으로 등재된 한반도 자연경관의 가치를 탁월성과 보편성의 측면에서 설명하고, 이를 토대로 등재 가능한 자연경관을 추천한다.","h":["은 세계 자연유산으로 등재된 제주 화산섬 및 용암동굴 그리고 서남해안의 갯벌을 중심으로 보존 가치가 높은 자연경관의 특징을 파악하고, 이를 바탕으로 남북한의 지형경관 중 추천할만한 사례를 찾아 자신의 의견을 설득력 있게 제시하기 위해 설정되었다."]},{"교":"사회","c":"12한탐04-02","과":"한국지리 탐구","학":"고2~3","영":"환경과 지속가능성 탐구","p":"도시화, 농업, 관광지 개발로 인한 산지, 하천, 해안지역의 변화를 조사하고, 환경과 개발에 대한 관점이 자연환경의 복원 및 지속가능한 활용에 미치는 영향을 파악한다.","h":["는 개발로 인한 지표면의 변화를 산지, 하천, 해안지역을 사례를 통해 조사하고, 환경에 대한 관점이 하천 및 해안지역의 개발, 보전⋅복원 방식의 선택 및 지속가능성에 미치는 영향을 조사하기 위해 설정되었다. 산지, 하천, 해안지역의 변화는 항공사진 분석 및 야외조사 등의 방법으로 파악한다. 사례를 통해 자연환경의 지속가능한 활용의 의미를 이해하며, 자연환경의 복원에 있어서 기술(공학)을 강조하는 방식과 자연 기반 해법 등을 비교한다."]},{"교":"사회","c":"12한탐04-03","과":"한국지리 탐구","학":"고2~3","영":"환경과 지속가능성 탐구","p":"우리나라 및 우리 지역에서 주로 발생하는 자연재해의 유형과 특징을 분석하고, 이를 토대로 자연재해의 경감 대책을 조사하고 평가한다.","h":["은 우리나라 및 지역에서 주로 발생하는 자연재해의 유형과 특징을 조사하고, 대책을 평가하는 것이 목적이다. 학생들은 자연현상과 자연재해를 구분하고, 인간의 대응 측면에서 위험과 취약성의 개념을 통해 자연재해를 이해하며, 국가 및 지역 수준의 재해별 대응 방안을 찾아 평가할 수 있도록 한다."]},{"교":"사회","c":"12한탐04-04","과":"한국지리 탐구","학":"고2~3","영":"환경과 지속가능성 탐구","p":"우리나라의 에너지원별 발전에 관한 주요 쟁점을 조사하고, 탄소중립 달성을 위한 에너지 정책을 제안한다.","h":["는 우리나라의 안정적인 에너지 공급과 탄소중립을 위한 에너지 정책을 제안하는 것이 목적이다. 이를 위해 석탄, 천연가스, 원자력, 재생에너지 등 에너지원별 발전 현황을 발전 단가, 탄소배출, 에너지 자립의 측면에서 평가하고, 산업, 건물, 수송(교통) 부문이 탄소배출에서 차지하는 비중을 조사한다. 또한, 발전 유형별 입지 특성, 전력 생산지와 소비지의 불일치에서 발생하는 형평성 문제 등 에너지 정책의 지리적 쟁점에 대해 토론한다."]},{"교":"사회","c":"12한탐05-01","과":"한국지리 탐구","학":"고2~3","영":"동아시아 갈등과 공존 탐구","p":"북한의 지리적 특징과 당면과제에 대한 이해를 바탕으로 남북협력의 가능성을 모색한다.","h":["은 우리나라 정부 및 국제기구, 인터넷 지도 서비스 등에서 제공하는 통계 자료, 사진, 항공사진, 위성영상을 활용하여 북한의 지리적 특징과 지속가능발전 상황을 파악하고, 이를 바탕으로 남북 간 협력방안을 모색하는 것이 목표이다. 이를 위해 북한의 인구와 도시 분포, 경제구조와 같은 기본적인 정보에서부터, 농업과 식량 자급, 지속가능한 에너지 접근성, 자연재해와 산림관리, 교역상대국과 교역품 유형 등의 정보를 활용하여 북한 지역의 특징과 당면과제를 이해하고, 남북이 협력할 수 있는 분야와 방식을 고민한다."]},{"교":"사회","c":"12한탐05-02","과":"한국지리 탐구","학":"고2~3","영":"동아시아 갈등과 공존 탐구","p":"한반도를 둘러싼 국가 간 경계와 접경지역을 분석하고, 동아시아 지역의 발전과 평화⋅공존을 위한 지정학적 전략을 토론한다.","h":["는 한반도 및 주변 국가 간 경계와 접경지역에 대한 이해를 바탕으로 동아시아의 갈등과 협력의 가능성을 이해하기 위해 설정되었다. 다양한 사례의 분석을 통해 국가 간 경계의 성격은 인접한 두 지역 간 관계에 따라 변화할 수 있다는 것을 이해하고, 이를 토대로 새롭게 발생하는 동아시아 지역의 지정학적 이슈를 해석하며, 이 지역의 발전과 평화⋅공존을 위한 우리나라의 역할에 대해 토론한다."]},{"교":"사회","c":"12도탐01-01","과":"도시의 미래 탐구","학":"고2~3","영":"삶의 공간, 도시","p":"도시의 의미를 이해하고, 도시의 특성이 도시적 생활양식에 미치는 영향을 일상 공간을 사례로 탐구한다.","h":["에서는 도시의 의미를 주관적, 객관적 측면에서 복합적으로 다루도록 한다. 도시의 주관적 의미에서는 장소감을 중심으로 자신과 도시를 연결 지을 수 있도록 하고, 도시의 객관적 의미는 인구, 기능적 영향력 범위 등을 중심으로 살펴볼 수 있다. 또한 규모, 밀도, 인구의 이질성과 같은 속성이 익명성, 자유로움, 개방성, 혼종성 등 오늘날 삶의 방식을 규정하는 생활양식으로서의 도시성(urbanism)에 영향을 미치고 있음을 파악하도록 한다."]},{"교":"사회","c":"12도탐01-02","과":"도시의 미래 탐구","학":"고2~3","영":"삶의 공간, 도시","p":"도시의 발달과정에 대한 이해를 바탕으로 하여 다양한 유형의 도시를 비교하고, 내가 사는 도시의 발달과정을 탐구한다.","h":["에서는 도시의 발달과정을 역사적, 공간적으로 조망하며 다양한 유형의 도시를 비교한다. 현대 도시의 경우, 후기 산업 도시뿐만 아니라 사회주의 국가와 개발도상국 등의 도시를 소개할 수 있다. 이를 통해 자신이 생각하는 도시와 도시적 생활양식은 유일한 것이 아니고 변화할 수 있으며, 우리가 도시를 어떻게 만들어 가느냐에 따라 살기 좋은 도시가 될 수도, 쇠퇴하는 도시가 될 수도 있음을 이해하는데 주안점을 둔다. 이를 바탕으로 하여 자신이 살고 있거나 자신이 사는 지역 인근 도시의 발달과정을 탐구한다."]},{"교":"사회","c":"12도탐01-03","과":"도시의 미래 탐구","학":"고2~3","영":"삶의 공간, 도시","p":"살기 좋은 도시에 대한 다양한 관점을 비교하고, 살기 좋은 도시의 사례와 특징을 조사한다.","h":["은 과목 전체를 아우르는 탐구 주제인 ‘살기 좋은 도시 만들기’에 대한 도입의 역할을 한다. 우선 거주 적합성을 중심으로 거주지를 선택하고 결정하는 데 영향을 주는 요인들을 살펴볼 수 있다. 다음으로 미디어 등을 활용하여 살기 좋은 도시를 바라보는 다양한 관점을 비교하고 그 사례와 특징을 조사한다."]},{"교":"사회","c":"12도탐02-01","과":"도시의 미래 탐구","학":"고2~3","영":"변화하는 도시","p":"도시 간의 상호 작용과 교류에 의해 형성되는 도시 체계를 이해하고, 도시 공간 구조는 고정되지 않고 지속해서 재구성됨을 인식한다.","h":["에서는 세계 도시 계층 체계를 중심으로 세계화 시대의 도시 간 상호 작용과 연계를 이해한다. 도시 공간 구조에 관해서는 전통적인 도시이론을 상세히 다루는 것을 지양하며, 도시 공간 구조가 고정되지 않고 경제적, 사회적, 문화적 요인 등에 의해 변화하고 재구성됨을 여러 대도시의 사례를 통해 이해할 수 있다."]},{"교":"사회","c":"12도탐02-02","과":"도시의 미래 탐구","학":"고2~3","영":"변화하는 도시","p":"문화 자산을 활용한 도시 브랜딩과 건축이 도시의 경관과 도시에 대한 인식 변화에 미친 영향을 탐구한다.","h":["에서는 역사, 예술, 건축, 축제, 생활양식 등의 문화 자산을 활용한 도시 브랜딩(도시 마케팅, 도시 브랜드화)의 사례를 통해 문화가 도시의 성장과 변화의 원동력이 될 수 있음을 이해한다. 특히, 도시 브랜딩에서는 문화 콘텐츠, 마케팅 분야에 대한 진로 탐색, 건축에서는 유명 건축가와 도시 계획가 등의 사례를 소개함으로써 건축 및 도시 계획 분야로의 진로 탐색 기회가 될 수 있도록 한다."]},{"교":"사회","c":"12도탐02-03","과":"도시의 미래 탐구","학":"고2~3","영":"변화하는 도시","p":"서비스업의 성장과 소비주의 심화가 도시 경제와 도시의 경관, 생활양식 변화에 미친 영향을 분석한다.","h":["에서는 도시가 어떻게 소비의 중심지가 되는지에 초점을 두고 음식, 패션 등과 같이 일상에서 친숙하고 필수적인 상품들을 소비하는 과정을 사례로, 대량 생산의 확대와 생활 수준의 향상에 따라 서비스업이 분화하고 소비주의가 심화하는 과정을 이해할 수 있다. 또한, 전자상거래, 복합쇼핑몰, 플랫폼 경제의 발달 등과 같은 소비 패턴 변화로 인해 나타나는 도시의 경관과 생활양식의 변화를 탐구하도록 한다."]},{"교":"사회","c":"12도탐02-04","과":"도시의 미래 탐구","학":"고2~3","영":"변화하는 도시","p":"첨단 산업과 모빌리티의 발달이 도시의 성장과 쇠퇴에 미치는 영향을 조사하고, 정보통신기술의 발달로 출현하고 있는 스마트 도시를 사례로 살고 싶은 도시의 미래 모습을 예측한다.","h":["에서는 세계 여러 도시의 사례를 바탕으로 하여 첨단 산업과 모빌리티의 발달로 인한 도시의 변화를 도시의 경관, 거주 및 생태환경, 생활양식 등을 중심으로 다룬다. 동시에 이로 인한 전통적 산업 도시의 쇠퇴 사례도 소개할 수 있다. 특히, 스마트 도시에서는 도시의 기반 시설 건설과 유지에 필요한 최신의 기술이 총 망라되므로 도시 계획 및 다양한 공학 분야로의 진로 탐색 기회가 될 수 있도록 한다."]},{"교":"사회","c":"12도탐03-01","과":"도시의 미래 탐구","학":"고2~3","영":"도시 문제와 공간 정의","p":"도시의 환경 문제와 재난은 자연적 요인과 사회적 요인이 복합적으로 작용하여 발생하고 있음을 사례를 통해 파악하고, 이를 공간 정의의 관점에서 분석하여 해결 방안을 탐색한다.","h":["에서는 환경 문제와 재난의 종류와 원인을 병렬적으로 나열하는 것을 지양하며, 공간 정의를 함께 고려할 수 있도록 해야 한다. 환경 문제와 재난이 도시 내 특정 지역이나 계층, 집단에 집중되어 발생하지는 않는지 파악하고 이러한 문제가 발생하는 원인과 해결 방안을 탐색한다. 이를 통해 도시의 자연환경과 사회시스템에 대해 복합적으로 이해할 수 있으므로 도시행정 및 도시 계획, 사회복지, 환경공학, 토목공학 등 다양한 분야로의 진로 탐색 기회가 될 수 있도록 한다."]},{"교":"사회","c":"12도탐03-02","과":"도시의 미래 탐구","학":"고2~3","영":"도시 문제와 공간 정의","p":"부동산에 대한 인식 변화와 도시의 주거 문제 심화 사례를 조사하고, 이를 공간 정의의 관점에서 분석하여 해결 방안을 탐색한다.","h":["에서는 부동산이 사회문제로 대두하게 된 과정과 원인을 우리나라의 대표적인 주거 형태인 아파트를 사례로 탐구하고, 세계 여러 도시와의 비교를 통해 부동산의 개념을 올바르게 이해할 수 있도록 한다. 도시의 주거 문제 심화 사례로는 청년 주거 문제, 부동산 소유 집중과 투기, 도시 재생과 젠트리피케이션의 부정적 효과, 빗장 도시(gated community)의 확산 등을 다룰 수 있다."]},{"교":"사회","c":"12도탐03-03","과":"도시의 미래 탐구","학":"고2~3","영":"도시 문제와 공간 정의","p":"국제 이주에 따라 도시의 인구 구성과 공간 구조가 변화하여 발생하는 문제를 조사하고, 도시 구성원들의 다양성과 차이를 존중하고 공존하는 방안을 모색한다.","h":["에서는 국제 이주에 초점을 두어 다문화 측면에서 도시의 인구 구성과 공간 구조 변화를 탐구한다. 특히, 자신이 살고 있거나 자신이 사는 지역 인근 도시의 인구 구성과 공간 구조 및 경관 변화에 대한 조사를 통해 도시 공간의 문화적 다양성과 변화를 이해하고 존중하는 태도를 기를 수 있다."]},{"교":"사회","c":"12도탐04-01","과":"도시의 미래 탐구","학":"고2~3","영":"도시의 미래","p":"지속가능성과 회복력이 높은 도시가 되기 위한 요건에 대해 토의하고 이와 관련한 도시 계획 및 도시 혁신 사례를 탐구한다.","h":["에서는 도시가 인간과 비인간이 공존하고 상호 작용하는 공간이라는 인식에서 더 나아가 도시의 지속가능성을 사회적, 경제적 측면까지 폭넓게 고려하여 토의하는데 주안점을 둔다. 이를 위해 도시 속 동물, 생태 지향적 건축, 에너지 전환, 쓰레기 처리, 재난과 위험 관리, 사회적 약자 보호, 모빌리티와 이동권, 도시 기반 시설 등과 관련한 다양한 사례를 탐구함과 동시에 진로 탐색의 기회가 될 수 있도록 한다."]},{"교":"사회","c":"12도탐04-02","과":"도시의 미래 탐구","학":"고2~3","영":"도시의 미래","p":"도시의 공공성을 높이기 위한 도시 정치의 중요성을 이해하고, 도시를 만들어가는 주체로서 시민이 가져야 할 바람직한 태도를 함양하여 도시 정치에 적극적으로 참여한다.","h":["에서는 도시에 대한 권리를 중심으로 도시의 공공성을 이해한다. 한정된 자원을 둘러싼 도시 구성원 간 갈등과 경쟁을 해결하기 위한 도시 정치의 필요성을 교통⋅편의 시설의 입지 등을 사례로 탐구할 수 있다. 시민이 능동적으로 참여하여 도시의 공공성을 높이는 사례로 도시 커먼즈(urban commons) 운동, 마을(도시) 공동체, 공유 경제 등을 다룰 수 있다."]},{"교":"사회","c":"12동역01-01","과":"동아시아 역사 기행","학":"고2~3","영":"동아시아로 떠나는 역사 기행","p":"역사 기행을 통한 탐구의 방법을 이해하고, 동아시아의 범위와 특징을 파악한다.","h":["역사 탐구의 방식으로서 역사 기행의 의미를 이해하고, 현재 한국의 지정학적 위치와 정치⋅경제적 상황을 바탕으로 동아시아의 범위를 파악함으로써 동아시아 역사에 대한 이해와 흥미를 높이기 위해 설정하였다. 동아시아의 지역 범주는 지역 연관성에 따라 동북아시아와 동남아시아로 구성한다."]},{"교":"사회","c":"12동역01-02","과":"동아시아 역사 기행","학":"고2~3","영":"동아시아로 떠나는 역사 기행","p":"생태환경을 바탕으로 형성된 유목 세계, 농경 세계, 해양 세계의 삶을 이해한다.","h":["동아시아 지역의 생태환경을 살펴봄으로써 인간의 삶과 역사가 인간의 행위뿐만 아니라 자연과의 관계 속에서 만들어진다는 것을 인식하기 위해 설정하였다. 동아시아 유목 세계, 농경 세계, 해양 세계의 특징을 생업, 음식, 주거 등 생활 문화를 중심으로 다룬다."]},{"교":"사회","c":"12동역02-01","과":"동아시아 역사 기행","학":"고2~3","영":"교류와 갈등의 현장에서 만난 역사","p":"동아시아의 지역 간 교류를 보여주는 문화유산을 탐구한다.","h":["동아시아의 유목 세계, 농경 세계, 해양 세계가 상호 교류 관계를 맺는 모습을 파악하기 위해 설정하였다. 선사 시대부터 기원 전후에 걸쳐 지역 간 교류를 보여주는 대표적인 유적과 문화유산의 사례를 중심으로 다룬다."]},{"교":"사회","c":"12동역02-02","과":"동아시아 역사 기행","학":"고2~3","영":"교류와 갈등의 현장에서 만난 역사","p":"종교와 사상을 중심으로 동아시아 각 지역 간 교류 양상을 파악한다."},{"교":"사회","c":"12동역02-03","과":"동아시아 역사 기행","학":"고2~3","영":"교류와 갈등의 현장에서 만난 역사","p":"몽골의 팽창 및 17세기 전후 동아시아 전쟁이 초래한 변화를 이해한다.","h":["전쟁과 세력 팽창이 동아시아 각국에 정치⋅사회⋅문화적 변화를 초래하였다는 점을 이해하기 위해 설정하였다. 몽골의 팽창은 13~14세기를 다루며 각 지역에서 형성된 교역망이 연결되며 동서 교역이 확대되었다는 점에 초점을 맞춘다. 17세기 전후 동아시아 전쟁으로는 임진, 병자 전쟁을 중점적으로 다룬다."]},{"교":"사회","c":"12동역02-04","과":"동아시아 역사 기행","학":"고2~3","영":"교류와 갈등의 현장에서 만난 역사","p":"이슬람과 유럽 세력의 참여를 통해 확대된 동아시아 교류의 모습을 탐구한다.","h":["주요 교역 물자를 매개로 교류 확대의 양상을 파악하도록 하고, 결제 수단으로 은이 활용되었음에 주목한다. 동아시아 각 지역에 확대된 불교 및 힌두교 문화와 이슬람교의 영향을 이해하고 교역을 매개로 활동한 중국인과 인도인의 모습을 이들의 거점이 된 주요 도시들을 활용하여 파악한다. 또한 유럽과의 교역 확대가 동남아시아 지역에 항시(港市)의 발달을 촉진했음을 이해한다."]},{"교":"사회","c":"12동역03-01","과":"동아시아 역사 기행","학":"고2~3","영":"침략과 저항의 현장에서 만난 역사","p":"동아시아 지역에서 전개된 제국주의 열강의 침략 전쟁을 탐구한다.","h":["19세기부터 아시아⋅태평양 전쟁 발발 이전까지 제국주의 열강의 침략 전쟁을 조명하기 위해 설정하였다. 침략 과정에서 체결된 여러 불평등 조약의 내용을 토대로 제국주의 침략의 성격을 파악하고, 전적지 및 침략 전쟁이 남긴 문화유산을 통해 전쟁을 이해한다."]},{"교":"사회","c":"12동역03-02","과":"동아시아 역사 기행","학":"고2~3","영":"침략과 저항의 현장에서 만난 역사","p":"아시아⋅태평양 전쟁과 이에 대한 저항과 연대의 움직임을 파악한다.","h":["아시아⋅태평양 전쟁의 발생 배경과 전쟁의 양상을 살펴봄으로써, 전쟁이 동아시아 지역에 끼친 영향과 이 전쟁에 맞서 국경을 초월하여 활동한 반제⋅반전의 움직임을 탐구하기 위해 설정하였다."]},{"교":"사회","c":"12동역03-03","과":"동아시아 역사 기행","학":"고2~3","영":"침략과 저항의 현장에서 만난 역사","p":"제국주의 열강의 침략과 전쟁이 지역 생활과 생태환경에 끼친 영향을 탐구한다.","h":["제국주의 열강의 침략과 전쟁 및 식민 지배가 동아시아 생태환경에 크게 영향을 미쳤으며 이것이 오늘날까지도 지속되고 있음을 인식하기 위해 설정하였다. 농업과 공업 분야의 개발로 나타난 생태환경의 변화가 인간과 자연에 미친 영향을 살펴보는 데 초점을 둔다. 또한 지역과 지역 간의 이동이 활발해짐에 따라 전염병이 광범위하게 전파된 측면도 다룰 수 있다."]},{"교":"사회","c":"12동역04-01","과":"동아시아 역사 기행","학":"고2~3","영":"평화와 공존의 현장에서 만난 역사","p":"냉전 시기 동아시아 지역에서 전개된 전쟁을 탐구하고, 각국의 정치⋅사회적 변화를 파악한다.","h":["냉전 시기 동아시아 각 지역에서 전개된 국제전, 국지전의 양상을 살펴보고, 이 시기 동아시아 각국의 정치⋅사회적 변화를 조망하기 위해 설정하였다. 전쟁 발발의 배경과 전쟁이 동아시아 지역에 초래한 영향, 민중이 겪은 고통, 이산의 아픔 등을 파악하는 데 주안점을 둔다. 정치⋅사회적 변화로는 동아시아 각국의 민주화 운동 사례를 학습할 수 있다."]},{"교":"사회","c":"12동역04-02","과":"동아시아 역사 기행","학":"고2~3","영":"평화와 공존의 현장에서 만난 역사","p":"경제 및 대중문화 교류가 확대되는 모습을 이해하고, 다문화 사회의 현실을 파악하여 공존을 위한 노력을 모색한다."},{"교":"사회","c":"12동역04-03","과":"동아시아 역사 기행","학":"고2~3","영":"평화와 공존의 현장에서 만난 역사","p":"동아시아의 역사 및 영토 갈등과 새롭게 대두되는 문제를 파악하고 해결하려는 자세를 갖는다.","h":["동아시아의 역사 및 영토 갈등, 기후⋅환경 문제의 해결을 모색하기 위해 설정하였다. 이러한 갈등과 문제를 역사적 맥락에서 이해하고, 국경을 초월한 연대가 필요함을 강조한다. 동아시아 공존과 평화, 환경 문제 해결을 위한 청소년의 역할을 모색하면서 자신의 진로 탐색에 활용할 수 있다."]},{"교":"사회","c":"12정치01-01","과":"정치","학":"고2~3","영":"시민 생활과 정치","p":"정치의 의미와 공동체 유지 발전에 정치가 필요한 이유를 이해하고, 일상생활에서 나타나는 정치의 사례를 찾아 분석한다."},{"교":"사회","c":"12정치01-02","과":"정치","학":"고2~3","영":"시민 생활과 정치","p":"민주주의 이념을 이해하고, 이를 구현하기 위한 다양한 민주주의의 모델을 탐색한다."},{"교":"사회","c":"12정치01-03","과":"정치","학":"고2~3","영":"시민 생활과 정치","p":"민주 정치의 역사적 발전 과정을 이해하고, 현대 민주 정치의 다양한 사상적 배경을 비교⋅분석한다.","h":["은 민주 정치의 발전 과정에 대한 이해를 바탕으로 민주 정치의 사상적 배경을 탐구하기 위해 설정하였다. 여기에서는 민주 정치의 역사적 발전 과정을 고대, 근대 시민혁명 시기, 시민혁명 이후, 현대로 구분하여 살펴보고 그 과정에서 나타난 사회계약설, 자유주의와 공동체주의 등의 사상이 어떤 의미를 갖는지에 대한 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치01-04","과":"정치","학":"고2~3","영":"시민 생활과 정치","p":"민주주의를 실현하기 위한 원리를 탐색하고, 이러한 원리를 일상생활에 적용한다.","h":["는 민주주의 실현을 위한 원리 이해를 바탕으로, 이러한 원리를 일상생활의 사례에 적용하도록 설정하였다. 특히 민주주의를 실현하기 위한 원리로 다수결의 원칙, 소수 의견 존중, 대화와 타협, 숙의와 토론 등에 대해 알아보고 이를 일상생활의 사례에 적용하는 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치02-01","과":"정치","학":"고2~3","영":"정치과정과 참여","p":"민주 국가의 정치과정을 분석하고, 시민이 정치과정에 참여해야 하는 이유를 탐색한다."},{"교":"사회","c":"12정치02-02","과":"정치","학":"고2~3","영":"정치과정과 참여","p":"민주 정치에서 정당의 의미와 역할을 탐구하고, 다양한 정치 참여의 방법을 비교, 분석한다.","h":["는 민주 정치에서 정당이 차지하는 의미를 이해하고 다양한 정치 참여의 방법을 비교, 분석하도록 설정하였다. 특히 정당, 이익집단, 시민단체, 언론 등 정치 참여 주체들의 기능과 역할을 이해하고, 우리가 일상생활에서 실천할 수 있는 시민 참여의 구체적인 방법을 탐색하는 데 초점을 맞춘다."]},{"교":"사회","c":"12정치02-03","과":"정치","학":"고2~3","영":"정치과정과 참여","p":"대의제에서 선거의 중요성과 선거 제도의 다양한 유형을 이해하고, 우리나라 선거 제도의 특징과 문제점을 분석한다."},{"교":"사회","c":"12정치02-04","과":"정치","학":"고2~3","영":"정치과정과 참여","p":"미디어를 통한 정치 참여 방법의 특징과 문제점을 분석하고, 유권자이자 피선거권자로서 미디어를 비판적으로 활용하는 태도를 지닌다.","h":["는 정치 참여의 방법 중 미디어를 통한 참여의 중요성을 인식하고 미디어를 비판적으로 활용하는 태도를 지니도록 설정하였다. 특히, 청소년이 선거권과 피선거권을 가진 시민으로서 투표에 참여하기 위해 다양한 미디어를 비판적으로 활용하는 데 초점을 맞춘다."]},{"교":"사회","c":"12정치03-01","과":"정치","학":"고2~3","영":"민주 국가의 정부 형태","p":"정치권력의 의미와 특징을 이해하고, 근대 이후 국가 권력이 형성되는 원리를 이해한다."},{"교":"사회","c":"12정치03-02","과":"정치","학":"고2~3","영":"민주 국가의 정부 형태","p":"민주 국가의 정부 형태인 대통령제와 의원 내각제의 특징을 비교하여 이해하고, 우리나라 정부 형태의 특징을 헌법을 통해 분석한다.","h":["는 민주 국가의 정부 형태가 크게 두 원형을 중심으로 구분된다는 점을 바탕으로 우리나라의 정부 형태를 구분하고 헌법에서 이를 확인하기 위해 설정하였다. 특히 민주 국가의 정부 형태를 영국과 미국 등 전형적인 사례를 통해 파악하고, 우리나라의 정부 형태가 갖는 특징을 비교하여 분석하는 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치03-03","과":"정치","학":"고2~3","영":"민주 국가의 정부 형태","p":"입법부, 행정부, 사법부의 역할을 이해하고, 이들 간의 상호 관계를 권력 분립의 원리에 기초하여 분석한다.","h":["은 우리나라 국가 권력 기관의 역할에 대한 이해를 바탕으로 권력이 어떻게 분립하여 행사되는지 알아보기 위해 설정하였다. 특히 우리나라의 국회, 대통령과 행정부, 법원과 헌법재판소 등 국가 권력 기관의 기본적인 역할과 이들의 상호 관계를 권력 분립의 원리에 따라 이해할 수 있는 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치03-04","과":"정치","학":"고2~3","영":"민주 국가의 정부 형태","p":"중앙 정부와의 관계 속에서 지방 자치의 의의를 이해하고, 우리나라 지방 자치의 현실과 과제를 탐구한다."},{"교":"사회","c":"12정치04-01","과":"정치","학":"고2~3","영":"국제 사회와 정치","p":"국제 사회의 특징과 변화 과정을 이해하고 국제 정치를 바라보는 관점을 비교하여 분석한다.","h":["은 국제 사회의 특징에 대한 이해를 바탕으로 국제 정치를 바라보는 관점을 비교, 분석하도록 설정하였다. 특히 현실주의와 자유주의를 중심으로 국제 정치를 바라보는 관점에 대한 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치04-02","과":"정치","학":"고2~3","영":"국제 사회와 정치","p":"다양한 국제 문제의 원인을 분석하고, 이를 해결하기 위해 국가를 비롯한 여러 주체가 수행하는 활동을 분석한다.","h":["는 오늘날 국제 사회에 존재하는 다양한 국제 문제를 인식하고 이를 해결하는 주체들의 활동을 분석하도록 설정하였다. 특히 국가, 국제연합이나 국제 사법 재판소 등과 같은 국제기구, 비정부기구 등을 중심으로 국제 문제를 해결하는 활동을 탐색하고 비교하는 학습에 초점을 맞춘다."]},{"교":"사회","c":"12정치04-03","과":"정치","학":"고2~3","영":"국제 사회와 정치","p":"우리나라를 둘러싼 국제 관계를 이해하고, 외교적 관점에서 한반도를 둘러싼 국제 질서를 분석한다."},{"교":"사회","c":"12정치04-04","과":"정치","학":"고2~3","영":"국제 사회와 정치","p":"국제 사회에서 발생하는 다양한 갈등의 원인을 분석하고 세계시민으로서 갈등을 해결하는 자세를 갖는다."},{"교":"사회","c":"12법사01-01","과":"법과 사회","학":"고2~3","영":"개인 생활과 법","p":"가족관계와 관련된 기본적인 내용인 혼인, 출생, 상속 등을 이해하고, 이를 일상생활의 사례에 적용한다.","h":["에서는 우리 삶의 기초인 가족관계(부부, 부모와 자녀 등)를 이해한다. 두 사람의 자유로운 의사에 따른 혼인과 부부 관계, 출산⋅입양으로 형성되는 부모와 자녀 관계(친자 관계, 친권)에 초점을 맞춘다."]},{"교":"사회","c":"12법사01-02","과":"법과 사회","학":"고2~3","영":"개인 생활과 법","p":"채권 관계와 관련된 기본적인 내용인 계약, 불법행위 등과 사적 자치를 이해하고, 이를 일상생활의 사례에 적용한다.","h":["에서는 채권 관계를 다룬다. 물건의 자유로운 교환을 가능하게 하는 계약 관계를 통해 채권의 기능과 개인과 개인의 법(률)관계에 적용되는 대원칙인 사적 자치의 원칙을 이해한다. 그리고 타인에게 위법행위를 한 자와 이로 인하여 손해를 입은 자 사이에 이해를 조정하는 불법행위와 손해배상을 이해하고 일상생활에서 일어나는 사례에 이를 적용하여 해결한다."]},{"교":"사회","c":"12법사01-03","과":"법과 사회","학":"고2~3","영":"개인 생활과 법","p":"물권 관계와 관련된 기본적인 내용인 부동산⋅동산에 관한 권리의 기능과 특징, 권리와 의무로 구성되는 법(률)관계를 이해하고, 이를 일상생활의 사례에 적용하여 법적 문제를 해결한다.","h":["에서는 물권 관계를 다룬다. 우리 삶에 필요한 물건을 스스로 지배하고 이용할 수 있는 물권 중 소유권, 임차권, 저당권 등을 중심으로 법(률)관계가 권리와 의무로 구성된다는 것을 이해하고 일상생활에서 일어나는 사례에 이를 적용하여 법적 문제를 해결한다. 재산권 존중의 원칙이 물권 영역을 지배하는 원칙임을 이해한다."]},{"교":"사회","c":"12법사02-01","과":"법과 사회","학":"고2~3","영":"국가 생활과 법","p":"민주주의와 법치주의의 발전 과정을 이해하고, 우리나라 권력 분립의 원리를 탐구한다.","h":["에서는 민주주의와 법치주의의 발전 과정에 대한 분석을 토대로 민주주의와 법치주의의 관계를 이해한다. 권력 분립의 원리가 민주주의와 법치주의를 실현하기 위하여 헌법이 채택한 세부 원리 중 하나임을 이해하고 우리나라 헌법에서 입법부, 행정부, 사법부의 권한을 중심으로 어떻게 구현되어 있는지에 대해 탐구한다."]},{"교":"사회","c":"12법사02-02","과":"법과 사회","학":"고2~3","영":"국가 생활과 법","p":"우리나라 헌법의 기본 원리와 기본권 내용을 이해하고, 기본권 제한의 요건과 한계를 탐구한다.","h":["에서는 현대 국가에서 민주주의와 법치주의가 헌법을 통해 구현된다는 점과 우리나라의 헌법에서 나타난 기본 원리가 무엇인지 이해한다. 우리나라 헌법이 어떤 기본권을 보장하고 어떤 경우에 기본권이 제한될 수 있는지에 대해 분석하고, 기본권 제한의 사례를 통하여 요건과 한계를 탐구한다."]},{"교":"사회","c":"12법사02-03","과":"법과 사회","학":"고2~3","영":"국가 생활과 법","p":"형법의 의의와 기능을 죄형 법정주의를 중심으로 이해하고, 범죄의 성립 요건과 형벌의 종류, 형사 절차를 탐구한다.","h":["에서는 죄형 법정주의를 중심으로 형법의 의의, 범죄의 의미와 형벌의 종류를 이해하고, 형사 절차에서 인권보장을 위해 마련된 원리와 제도를 이해한다. 인권보장을 위해 법치주의가 형사 절차에서 어떻게 구현되어 있는지에 초점을 맞추어 탐구한다."]},{"교":"사회","c":"12법사02-04","과":"법과 사회","학":"고2~3","영":"국가 생활과 법","p":"법원과 헌법재판소의 법적 문제 해결 과정을 탐구하고, 사법의 의미와 한계를 인식하여 입법론적 해결이 필요한 경우를 탐구한다.","h":["에서는 우리나라의 국가기관 중 사법기관인 법원과 헌법재판소가 어떤 역할을 하는지 이해하고 이 과정에서 입법⋅행정과 구분되는 사법(司法)의 특성을 이해한다. 법원과 헌법재판소가 어떤 과정을 거쳐 법적 문제를 해결하는지 탐구하면서 사법의 의미와 한계를 인식하고 어떤 경우에 입법론적 해결 방법이 필요한지 탐구하고 이를 통해 문제를 해결한다."]},{"교":"사회","c":"12법사03-01","과":"법과 사회","학":"고2~3","영":"사회생활과 법","p":"법으로 보장되는 근로자의 권리를 이해하고, 이를 일상생활의 사례에 적용한다.","h":["에서는 노동법을 통해 보호되는 근로자의 권리에 대한 이해를 바탕으로 직장생활에서 발생하는 다양한 법적 문제를 탐구한다. 이때 청소년(연소자)이 근로 계약을 맺었을 때 법적으로 어떤 권리가 있고 어떤 보호를 받을 수 있는지에 대해서 초점을 맞추어 탐구한다."]},{"교":"사회","c":"12법사03-02","과":"법과 사회","학":"고2~3","영":"사회생활과 법","p":"인간다운 생활을 보장하려는 사회보장과 경쟁 및 소비자를 보호하기 위한 법적 근거를 탐구하고, 구체적인 사례에서 공공 쟁점을 찾아 토론한다.","h":["에서는 경제생활에서 발생하는 사회문제를 해결하기 위한 사회보장, 소비자 보호, 독과점 규제 등 다양한 경제 관련 제도를 법적 관점에서 살펴본다. 이와 관련하여 법적 근거를 탐구하고, 이와 관련된 사례에서 쟁점을 도출하여 토론한다."]},{"교":"사회","c":"12법사03-03","과":"법과 사회","학":"고2~3","영":"사회생활과 법","p":"현대적 법(률)관계의 특징과 지적 재산권의 의미를 이해하고, 이와 관련된 일상생활에서의 사례를 찾아보고 관련 쟁점을 토론한다.","h":["에서는 지능정보사회에서 인터넷 서비스 제공자를 매개로 한 현대적 법(률)관계의 특징을 살펴본다. 현대적 법(률)관계에서 발생하는 인터넷 서비스 제공자의 책임, 플랫폼 노동의 보호, 지적 재산의 보호와 그 한계와 같은 법적 문제에 초점을 맞춘다."]},{"교":"사회","c":"12법사04-01","과":"법과 사회","학":"고2~3","영":"학교생활과 법","p":"학생과 청소년이 누릴 수 있는 권리와 의무를 이해하고, 이를 학교와 일상생활의 사례에 적용한다.","h":["에서는 학생과 청소년으로서 갖는 권리와 의무, 이를 구현하기 위한 국가와 학교의 권한과 의무를 살펴본다. 성년인 시민과 비교하여 학생과 청소년이 왜 특별한 보호와 제한을 받는지 학습하고, 그러한 특별한 보호와 제한이 적절한지 비판적으로 탐구한다."]},{"교":"사회","c":"12법사04-02","과":"법과 사회","학":"고2~3","영":"학교생활과 법","p":"학교폭력의 해결 과정을 살펴보며, 학교생활에서 발생하였거나 발생할 수 있는 법적 문제를 발견하고 그 해결 방안을 탐구한다.","h":["에서는 법, 교육, 윤리 등 다양한 문제를 해결하는 데 동원되는 다양한 해결 수단을 파악하고, 그 중 법적 해결 방안이 가지는 특징을 이해한다. 학교폭력을 해결하기 위한 민법, 형법, 행정법적인 노력을 탐구하고 그것이 가지는 효과와 한계를 학습한다. 학교 규칙 개정, 휴대전화 사용, 교권 침해 등 학교생활에서 발생할 수 있는 다양한 법적 문제를 발견하고 이를 법적으로 해결하는 방안을 사례를 중심으로 탐구한다."]},{"교":"사회","c":"12법사04-03","과":"법과 사회","학":"고2~3","영":"학교생활과 법","p":"법적 문제를 해결하는데 필요한 법, 조약, 판례, 입법자료 등을 찾아보고, 민주시민으로서 나와 사회가 당면한 사회적 논의에 참여하는 태도를 가진다.","h":["에서는 사회생활에서 발생하는 다양한 문제를 법적 관점에서 해결하는 데 필요한 법, 조약, 판례, 입법자료를 찾고, 이에 근거해 당면한 사회문제를 법해석과 입법을 통해서 해결하기 위한 사회적 논의에 참여한다. 사회문제를 해결하는데 법이 가지는 유용성과 그 한계를 인식하면서 사회적 논의에 참여함으로써 균형 잡힌 대안을 제시할 수 있는 시민의 역량을 가진다."]},{"교":"사회","c":"12경제01-01","과":"경제","학":"고2~3","영":"경제학과 경제 문제","p":"인간 생활에서 자원의 희소성으로 인해 발생하는 경제 문제의 중요성을 인식하고, 경제학의 분석 대상과 성격을 이해한다.","h":["은 자원의 희소성에 의해 경제 문제가 발생한다는 것을 파악하고, 이를 바탕으로 경제학은 다양한 경제적 선택행위를 분석 대상으로 삼고 있음을 이해하기 위해 설정된 것이다."]},{"교":"사회","c":"12경제01-02","과":"경제","학":"고2~3","영":"경제학과 경제 문제","p":"경제 문제를 해결하는 다양한 방식의 장단점을 비교하고, 시장경제의 기본 원리와 이를 뒷받침하는 제도를 파악한다.","h":["는 기본적인 경제 문제를 해결하는 방식으로써 전통 경제, 계획경제, 시장경제의 특징과 장점 및 한계점을 비교하고, 시장경제는 경제 주체의 자유와 경쟁을 바탕으로 가격 기구를 통해 경제 문제를 해결하려고 한다는 점에 초점을 맞춘다."]},{"교":"사회","c":"12경제01-03","과":"경제","학":"고2~3","영":"경제학과 경제 문제","p":"인간은 경제적 유인에 반응함을 인식하고, 편익과 비용을 고려하여 합리적으로 선택하는 능력과 한계 분석을 이용한 의사 결정 능력을 계발한다.","h":["에서는 편익과 비용의 차이인 순편익을 가장 크게 하는 것이 합리적 선택임을 인식하고 이때 한계 편익과 한계 비용이 일치하게 됨을 파악할 수 있도록 설정된 것이다. 또한 긍정적 유인과 부정적 유인의 다양한 사례를 탐구할 수 있도록 한다."]},{"교":"사회","c":"12경제02-01","과":"경제","학":"고2~3","영":"미시 경제","p":"수요와 공급에 의한 시장 균형의 결정과 변동 원리를 파악하고, 이를 다양한 시장에 적용한다.","h":["은 수요와 공급을 통한 시장 균형 가격 및 거래량의 결정과 변동 원리를 이해할 수 있도록 설정된 것이다. 이를 바탕으로 상품 시장뿐 아니라 노동 시장, 금융 시장 등 다양한 시장에 적용하는 학습이 이루어질 수 있도록 한다."]},{"교":"사회","c":"12경제02-02","과":"경제","학":"고2~3","영":"미시 경제","p":"정부를 비롯한 공공 부문의 경제적 역할을 이해하고, 조세, 공공재 등과 같이 시장의 자원 배분에 개입하는 사례를 탐구한다.","h":[", [12경제02-03]에서는 시장 기능뿐 아니라 정부를 비롯한 공공 부문의 활동에 대해 파악할 수 있도록 설정된 것이다. 특히 정부의 주요 활동에 대해서는 조세 부과, 소득 재분배, 공공재 생산, 경쟁 제한 규제 및 공정 거래 확립 등을 중심으로 다룬다. 또한 시장 실패와 정부 실패 및 그에 따른 대책에 대해서도 균형 있게 탐구할 수 있도록 한다."]},{"교":"사회","c":"12경제02-03","과":"경제","학":"고2~3","영":"미시 경제","p":"시장 기능과 공공 부문의 활동을 비교하고, 자원 배분의 효율성과 형평성에 미치는 영향을 평가한다."},{"교":"사회","c":"12경제03-01","과":"경제","학":"고2~3","영":"거시 경제","p":"여러 가지 거시 경제 변수를 탐색하고, 국가 경제 전반의 활동 수준을 파악한다.","h":["은 거시 경제 변수에 대한 이해를 바탕으로 국가 경제의 활동 수준을 파악할 수 있도록 설정된 것이다. 다양한 거시 경제 변수 중 국내 총생산, 물가 상승률, 실업률을 중심으로 개념과 활용 사례 등을 통한 학습이 이루어질 수 있도록 한다."]},{"교":"사회","c":"12경제03-02","과":"경제","학":"고2~3","영":"거시 경제","p":"경제 성장의 의미와 요인을 이해하고, 한국 경제의 변화와 경제적 성과를 균형 있는 시각에서 평가한다."},{"교":"사회","c":"12경제03-03","과":"경제","학":"고2~3","영":"거시 경제","p":"경기 변동의 의미와 요인을 이해하고, 경기 안정화 방안으로 재정 정책과 통화 정책을 분석한다.","h":["은 경기 변동에 대처하기 위한 재정 정책과 통화 정책의 기본 원리를 이해하기 위해 설정된 것이다. 경제 안정화 정책의 원리와 경제적 효과를 체계적으로 분석함과 동시에 정책을 둘러싼 찬반 논쟁도 균형 있게 다루어질 수 있도록 한다."]},{"교":"사회","c":"12경제04-01","과":"경제","학":"고2~3","영":"국제 경제","p":"개방된 국제 사회에서 국제 거래를 파악하고, 국가 간 상호 의존성이 증대하고 있음을 이해한다.","h":[", [12경제04-02]는 재화, 서비스, 생산요소 등의 국가 간 거래의 필요성을 인식하고 비교 우위에 따른 특화와 교역의 이득을 중점적으로 분석하기 위해 설정된 것이다. 비교 우위와 특화의 원리가 개인뿐 아니라 국가 간 교역을 설명하는 데 적용될 수 있음을 학습한다. 또한 무역 정책과 관련해서는 자유 무역과 보호 무역의 논리를 균형 있게 다루도록 한다."]},{"교":"사회","c":"12경제04-02","과":"경제","학":"고2~3","영":"국제 경제","p":"비교 우위에 따른 특화와 교역을 중심으로 무역 원리를 이해하고, 자유 무역과 보호 무역 정책의 경제적 효과를 설명한다."},{"교":"사회","c":"12경제04-03","과":"경제","학":"고2~3","영":"국제 경제","p":"외환 시장에서 환율의 결정 원리를 이해하고, 환율 변동이 국가 경제와 개인의 경제생활에 미치는 영향을 탐구한다.","h":["은 환율의 결정 원리에 대한 이해를 바탕으로 환율 변동이 국가 경제와 개인의 경제생활에 미치는 영향을 연결하여 분석하기 위해 설정된 것이다. 다만, 국제 수지는 환율 변동이 국가 경제에 미치는 영향을 파악하는 데 한하여 학습하도록 한다."]},{"교":"사회","c":"12국관01-01","과":"국제관계의 이해","학":"고2~3","영":"국제 관계의 특징","p":"근대 이후 국제 관계의 형성과 변화 과정을 파악한다.","h":["은 근대 국민 국가가 형성된 역사적 배경을 이해하고, 특히 20세기 두 차례 세계 대전 이후 형성된 오늘날 국제 관계의 특징을 파악하는 것에 초점을 맞춘다."]},{"교":"사회","c":"12국관01-02","과":"국제관계의 이해","학":"고2~3","영":"국제 관계의 특징","p":"국제 사회를 이해하는 주요 관점인 현실주의와 자유주의를 중심으로 구체적인 국제 관계의 사례를 분석하고, 대안적 관점들을 탐색한다.","h":["는 국제 사회를 이해하는 현실주의와 자유주의의 기본 전제를 이해하고, 구체적인 사례를 통해 두 관점이 국가 간 갈등과 평화에 접근하는 차이점을 비교하는 데 초점을 맞춘다. 그리고 구성주의 등 대안적 관점들이 국제 관계를 어떻게 이해하는지 그 특징을 파악한다."]},{"교":"사회","c":"12국관01-03","과":"국제관계의 이해","학":"고2~3","영":"국제 관계의 특징","p":"국제 문제를 해결하기 위한 다양한 행위 주체의 활동을 탐색하고, 그 성과와 문제점에 대하여 토론한다.","h":["은 국제 문제에 대해 개인, 다국적 기업, 국가, 국제기구 등 개별 행위 주체가 실천할 수 있는 행동이나 취할 수 있는 태도를 분석하는 데 초점을 맞춘다. 이때 행위 주체에 따른 장점과 한계를 비교하고, 서로 다른 입장을 가질 수 있는 가치 갈등 상황을 분석한다."]},{"교":"사회","c":"12국관02-01","과":"국제관계의 이해","학":"고2~3","영":"균형 발전과 상생","p":"국가 간 불평등의 원인을 파악하고, 이러한 불평등이 야기하는 갈등 상황을 분석한다.","h":["은 국가 간 경제 발전의 차이와 부의 편중 문제가 발생한 원인을 분석하고, 선진국과 개발도상국 간의 갈등 양상을 사례를 통해 탐색하는 데 초점을 맞춘다."]},{"교":"사회","c":"12국관02-02","과":"국제관계의 이해","학":"고2~3","영":"균형 발전과 상생","p":"공정 무역과 공적 개발 원조 등 국제 사회의 상생을 위한 노력을 조사하고, 다양한 행위 주체의 협력 방안을 탐색한다.","h":["는 국가 간 불균형 발전이 초래한 문제를 해결하기 위한 개인, 국가, 국제기구 등의 노력을 공정 무역, 공적 개발 원조 등 구체적인 방법을 중심으로 파악하기 위해 설정하였다."]},{"교":"사회","c":"12국관02-03","과":"국제관계의 이해","학":"고2~3","영":"균형 발전과 상생","p":"국제 사회에서 우리나라의 위상을 파악하고, 국제 사회의 불평등 문제를 해결하기 위한 우리나라의 역할을 토론한다.","h":["은 해방 이후 최빈국에서 오늘날 선진국으로 성장한 우리나라의 발전 과정을 개괄하고, 국제 사회의 공동 번영을 위해 우리나라가 담당해야 할 역할에 초점을 맞춘다."]},{"교":"사회","c":"12국관03-01","과":"국제관계의 이해","학":"고2~3","영":"평화와 안전의 보장","p":"인류가 직면한 평화와 안전의 상황을 다각적으로 조사한다.","h":["은 전쟁과 테러, 팬데믹 등 현대 인류의 삶을 위협하는 물리적, 환경적, 문화적 요인들을 탐색하는 데 초점을 맞춘다."]},{"교":"사회","c":"12국관03-02","과":"국제관계의 이해","학":"고2~3","영":"평화와 안전의 보장","p":"개인, 국가, 국제 사회의 평화와 안전을 위협하는 요인을 정치, 경제, 사회, 문화의 다양한 영역에 걸쳐 파악하고, 이를 해결하기 위한 실천 방안을 탐색한다.","h":["는 다양한 영역에서 개인과 국가, 국제 사회의 평화와 안전을 위협하는 폭력에 대해 토론하고, 이러한 폭력을 제거하여 적극적 평화를 달성하기 위한 세계시민으로서의 역할을 모색하기 위해 설정하였다."]},{"교":"사회","c":"12국관03-03","과":"국제관계의 이해","학":"고2~3","영":"평화와 안전의 보장","p":"역동적인 국제 관계 속에서 우리나라가 당면한 평화와 안전의 문제를 파악하고, 평화와 안전을 도모할 수 있는 구체적인 방안에 대하여 토론한다.","h":["은 분단과 군사적 대립이라는 위기로부터 한반도의 평화와 안전을 증진하는 방안을 토론하기 위해 설정된 것으로, 북한은 물론 주변국과의 이해관계도 함께 고려하는 데 초점을 맞춘다."]},{"교":"사회","c":"12국관04-01","과":"국제관계의 이해","학":"고2~3","영":"국제 분쟁의 해결","p":"국제 분쟁을 해결하기 위한 외교와 국제법의 필요성과 기능을 탐색한다.","h":["은 국제 분쟁을 해결하기 위한 방안을 탐색하고, 분쟁 해결 수단으로서 외교와 국제법의 기능을 사례를 통해 분석하기 위해 설정하였다."]},{"교":"사회","c":"12국관04-02","과":"국제관계의 이해","학":"고2~3","영":"국제 분쟁의 해결","p":"국제법의 특징과 법원(法源)을 조사하고, 국제 사법 재판소의 역할과 한계를 파악한다.","h":["는 조약, 국제 관습법 등 다양한 국제법의 법원(法源)을 조사하고, 국제 분쟁에 대한 사법적 판단을 담당하는 국제 사법 재판소의 역할과 한계를 실제 사례를 통해 파악하는 데 초점을 맞춘다."]},{"교":"사회","c":"12국관04-03","과":"국제관계의 이해","학":"고2~3","영":"국제 분쟁의 해결","p":"국제 사회에서 다양한 지역 통합이 이루어지는 현상과 그 이유를 확인하고, 지역 기구의 구성원으로서 우리나라의 역할을 토론한다.","h":["은 유럽연합(EU), 북미자유무역협정(NAFTA), 동남아시아국가연합(ASEAN) 등 다양한 지역 기구들이 만들어지는 이유를 탐색하고, 우리나라가 안보, 경제, 환경 등 다양한 분야에서 지역 기구와 조약에 가입하고 있는 이유와 역할을 파악하기 위해 설정하였다."]},{"교":"사회","c":"12여지01-01","과":"여행지리","학":"고2~3","영":"행복하고 안전한 여행","p":"다양한 여행 사례와 자신의 여행 경험을 통해 여행의 의미를 파악하고 여행이 삶과 세계 인식에 미치는 영향을 토의한다.","h":["는 책이나 대중매체에 나타난 여행 사례와 학습자 자신의 구체적인 여행 경험에 대해 토의하면서 여행의 의미를 살펴보기 위해 설정된 것이다. 여행이 개인, 사회, 시대에 따라 다양한 의미를 갖는다는 것을 확인하고 여행을 왜, 어떻게 하는지 생각해보는 기회를 통해 개인의 행복, 만족감, 자신에게 의미 있는 장소를 찾아가는 과정에 초점을 두도록 한다."]},{"교":"사회","c":"12여지01-02","과":"여행지리","학":"고2~3","영":"행복하고 안전한 여행","p":"모빌리티의 변화와 발전에 따라 여행자의 이동, 위치, 장소가 어떻게 연결되고 관계를 맺는지 살펴보고, 다양한 지도 및 지리정보기술을 활용하여 안전한 여행 계획을 수립한다.","h":["는 기존의 시⋅공간 압축을 지향하는 교통수단과 차별화되는 모빌리티의 의미를 이해하고, 공항, 버스정류장, 항구, 퍼스널 모빌리티, 여행자의 몸 등 여행자의 경험으로서의 역동적인 장소는 물론이고 다양한 정주와 이동의 관계도 여행의 일부임을 인식하기 위해 설정된 것이다. 안전한 여행을 위한 여행 계획 수립과 여행 준비에 필요한 지식, 기능, 가치 및 태도를 갖출 수 있도록 다양한 여행 자료와 지도 및 지리정보기술을 활용하여 학습자 스스로 여행지, 일정, 경로, 방식 등에 대한 정보를 수집⋅정리⋅조직한다. 여행 계획을 세우는 과정에서 [12여지04-02]의 ‘자신만의 여행 포트폴리오 만들기’ 활동을 염두에 두고 성취기준을 통합하여 운영할 수 있다."]},{"교":"사회","c":"12여지02-01","과":"여행지리","학":"고2~3","영":"문화와 자연을 찾아가는 여행","p":"인간의 정주공간으로서의 도시를 새로운 관점에서 낯설게 바라보고, 여행지로서의 향유 가능성을 탐색한다.","h":["은 일상적이고 평범한 삶의 장소로서의 도시를 여행지로 바라보고 다양하게 재현된 도시 공간을 낯선 여행지로 향유할 수 있는 여행자로서의 관점과 연결하여 이해하기 위해 설정된 것이다. [12여지02-01]은 자신이 동경하는 도시를 여행지로 다양하게 해석하고 조망할 수 있는 지리적 시각과 함께 여행지로서의 도시 특징을 다양한 감각을 통해 경험할 수 있는 탐구가 이루어질 수 있도록 한다."]},{"교":"사회","c":"12여지02-02","과":"여행지리","학":"고2~3","영":"문화와 자연을 찾아가는 여행","p":"다양한 문화 경관의 형성 배경과 의미를 이해하고, 감정이입과 공감의 자세로 여행지 주민을 배려하고 존중한다.","h":["는 여행지의 문화경관이 지니는 형성 배경과 의미에 대한 탐구를 통해 여행지와 여행지 주민에 대한 정서적 공감과 실천적 태도를 함양하기 위해 설정된 것이다. 여기서는 신문화지리학 관점에서 여행지의 외관, 매력뿐만 아니라 문화경관을 둘러싼 다양한 지리적 의미와 상징체계를 종교, 건축, 예술, 축제, 음식 등의 주제를 통해 학습하는 데에 초점을 둔다."]},{"교":"사회","c":"12여지02-03","과":"여행지리","학":"고2~3","영":"문화와 자연을 찾아가는 여행","p":"여행지의 기후 및 기후변화가 여행자와 여행지 주민에게 미치는 영향과 그 차이를 비교하고, 지리적 상상력을 동원한 간접여행을 통해 기후경관을 체험한다.","h":["은 여행지의 기후 특성과 변화하는 기후환경을 이해하고 이를 바탕으로 여행자 및 여행지 주민에게 각각 미치는 영향을 실제 사례를 통해 비교할 수 있도록 설정된 것이다. 여기서는 기후구분의 세부적 기준에 대한 학습보다는 여행지에 미치는 기후의 영향, 기후변화와 여행의 관계, 여행지의 기후를 경험하는 여행자와 여행지 주민의 모습 등 여행하는 과정에서 경험할 수 있는 기후의 특성에 초점을 둔다."]},{"교":"사회","c":"12여지02-04","과":"여행지리","학":"고2~3","영":"문화와 자연을 찾아가는 여행","p":"지형 경관이 지닌 자연적 가치, 심미적인 조화, 인간과의 상호 작용과 같은 지오사이트의 선정기준을 조사하고, 지오투어리즘 프로그램을 제안한다.","h":["는 여행지로서 지형 경관이 지니는 매력을 다양한 기준을 통해 살펴보고 지형 여행지의 선정기준을 수립하기 위한 자연적 가치, 심미적인 조화, 인간과의 상호 작용 등을 탐구하도록 설정된 것이다. 여기서는 학생들이 스스로 지오사이트를 선정해 보고, 그 지형 여행지의 매력을 소개하는 지오투어리즘 프로그램을 개발하는 데 중점을 둔다."]},{"교":"사회","c":"12여지03-01","과":"여행지리","학":"고2~3","영":"성찰과 공존을 위한 여행","p":"인류의 물질적, 정신적 발전 과정을 성찰할 수 있는 산업유산 및 기념물을 조사하고 여행지의 가치를 평가한다.","h":["은 여행의 목적지를 선정하는 기준이 시대와 지역에 따라 변화하고 있음을 이해하고, 산업유산 및 기념물 여행을 통해 여행지를 둘러싼 다양한 가치를 평가하기 위해 설정된 것이다. 산업유산 여행은 산업화 이후 근대 산업유산에 한정하지 않고, 농어촌 경관, 농어업 생태보전, 전통 농어법 등 농어업⋅농어촌 유산을 포함하도록 한다."]},{"교":"사회","c":"12여지03-02","과":"여행지리","학":"고2~3","영":"성찰과 공존을 위한 여행","p":"평화, 전쟁, 재난의 상징이 새겨진 지역에 대한 직간접적인 여행을 체험하고 이를 바탕으로 인권, 정의, 인류의 공존을 둘러싼 구조적 문제를 비판적으로 탐구한다.","h":["는 전쟁 및 분쟁, 학살 등의 비극적 역사 현장과 빈곤, 환경문제 등으로 고통받는 참상을 통해 평화와 공존의 가치를 내면화하기 위해 설정된 것이다. 여기서는 다크투어리즘, 평화여행 등을 중심으로 역사의 반성과 교훈을 직간접적으로 체험하고 인류의 더 나은 미래를 위한 성찰에 초점을 둔다."]},{"교":"사회","c":"12여지03-03","과":"여행지리","학":"고2~3","영":"성찰과 공존을 위한 여행","p":"문화 창조, 첨단 기술과 같은 새로움을 지향하는 지역의 사례를 조사하고, 내가 살고 있는 지역의 로컬 큐레이터로서 다양한 여행 콘텐츠의 발굴과 모니터링을 통해 지역의 의미와 가치를 탐색한다.","h":["은 창조적 가치, 첨단 기술, 지역 혁신 등을 통해 인류의 현재를 이끌어가는 세계의 다양한 지역을 여행지로 살펴봄으로써 지역의 소중함을 일깨우기 위해 설정된 것이다. 여기서는 다채로운 지역 여행 콘텐츠와 스토리텔링 방법을 발굴하고, 내가 살고 있는 지역을 참신한 여행지로 소개하는 데에 중점을 둔다."]},{"교":"사회","c":"12여지03-04","과":"여행지리","학":"고2~3","영":"성찰과 공존을 위한 여행","p":"공정여행을 통해 여행지를 둘러싼 다양한 문제를 탐색하고, 여행자인 나와 여행지 주민인 그들이 연결된다는 점에서 공존의 의미와 생태 감수성에 대해 성찰한다.","h":["는 개발과 보전 등 여행지를 둘러싼 가치 갈등과 해결 과정을 파악하고, 이를 통해 책임 있는 여행의 필요성을 이해하기 위해 설정된 것이다. 여기서는 공정 여행 등 다양한 대안 여행의 출현 맥락과 특성을 이해함으로써 여행자와 여행지 및 여행지 주민 간의 공존을 위해 지속가능한 실천방향을 모색한다."]},{"교":"사회","c":"12여지04-01","과":"여행지리","학":"고2~3","영":"미래 사회와 여행","p":"미디어와 여행의 상호관계를 통해 여행의 변화양상을 조사하고 미래 사회의 여행자와 여행의 모습을 예측한다.","h":["은 정보통신기술 및 사회 관계망 서비스(SNS)의 발달로 인해 변화되는 여행의 양상을 이해하고 이를 바탕으로 미래 사회의 여행자와 여행의 변화된 모습을 예측할 수 있도록 설정된 것이다. 여기서는 여행 산업의 변화 과정, 포스트 코로나 시대의 여행 트렌드, 가상여행, 우주여행, 인공지능 여행 등의 미래 여행, 여행을 통한 진로 탐색 등에 초점을 둔다."]},{"교":"사회","c":"12여지04-02","과":"여행지리","학":"고2~3","영":"미래 사회와 여행","p":"여행이 주는 가치의 재발견을 통해 자신만의 여행 포트폴리오를 구성하고 나의 삶을 변화시키는 일상 속의 다양한 여행을 실천한다.","h":["는 여행의 계획 및 준비, 실행, 정리 및 성찰, 다음 여행의 준비 등 일련의 과정을 통해 발견되는 여행의 가치를 이해하고 각자의 진로를 탐색하여 ‘자신만의 여행 포트폴리오 만들기’를 수행하도록 설정된 것이다. 여기서는 여행의 계획, 여행 자료 정리, 여행의 성찰, 진로 계획 및 탐색 등에 초점을 둔다. 더불어 골목여행, 도보여행, 등산여행 등 일상 속에서 체험할 수 있는 주제를 제공할 수 있도록 한다."]},{"교":"사회","c":"12역현01-01","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"현대 세계와 역사 탐구","p":"현대 세계를 전후 체제 형성의 역사를 중심으로 파악한다.","h":["현대 세계는 지역 세계가 확장된 결과 지구가 하나의 긴밀한 연결망으로 이루어진 세계를 뜻한다. 현대 세계는 시기를 제1⋅2차 세계 대전 이후로 설정하였으나 탐구 주제에 따라 이전 시기와의 연관성을 고려하여 유연하게 소급하여 다룰 수 있다."]},{"교":"사회","c":"12역현01-02","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"현대 세계와 역사 탐구","p":"학습자가 생각하는 현대 세계의 과제를 선정⋅조사하고 그 특징을 분석한다.","h":["현대 세계의 과제를 선정하고 조사하여 쟁점별로 발표하는 활동에 중점을 둔다. 이 과정에서 현대 세계를 바라보는 나와 타인의 인식 차이를 확인하고, 자신의 관점을 상대화할 수 있다."]},{"교":"사회","c":"12역현02-01","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"냉전과 열전","p":"제2차 세계 대전 이후 인권⋅평화를 위한 국제 사회의 노력과 한계를 파악한다.","h":["제2차 세계 대전이 끝난 이후 홀로코스트를 비롯한 전쟁 범죄의 문제가 제기되는 등 평화와 인권이 중요한 의제로 등장했음에 주목한다. 국제 사회는 평화와 인권을 위해 국제 연합을 창설하고 세계 인권 선언 등 국제 규범과 규약을 마련하였으나 냉전의 전개 속에서 그 시도가 한계에 부딪혔음에 주목한다."]},{"교":"사회","c":"12역현02-02","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"냉전과 열전","p":"냉전 시기 열전의 전개 양상을 찾아보고, 전쟁 당사국의 전쟁 경험을 비교한다.","h":["6⋅25 전쟁과 베트남 전쟁을 중심으로 냉전 시기 전개된 열전의 양상과 특징을 파악한다. 전쟁에 개입한 여러 당사국의 이해관계 및 행위 주체의 경험과 삶을 드러내며, 전쟁의 참상을 청소년과 여성 등의 시선에서 접근한다."]},{"교":"사회","c":"12역현02-03","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"냉전과 열전","p":"세계 여러 지역의 전쟁 관련 기념 시설이 제시하는 기억 방식을 조사하여 분석한다.","h":["전쟁 관련 조형물 및 기념관을 조사하여 전쟁을 기억하는 방식의 차이를 파악하는 데 초점을 둔다. 국가별로 정부가 설립한 전쟁 기념관의 공식 기억과 집단⋅개인의 기억 차이를 비교하거나, 피난과 학살 등 특정 주제를 중심으로 전쟁을 기억하는 방식에 주목한다. 학습자 스스로 온오프라인의 다양한 기념관을 방문하는 활동을 전개할 수 있다."]},{"교":"사회","c":"12역현03-01","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"성장의 풍요와 생태환경","p":"세계 경제의 성장과 기술 혁신의 변화 양상을 조사한다.","h":["1950년대 이후 세계 경제 규모가 비약적으로 커지면서 인구가 폭발적으로 늘어나고 인류의 생활 방식이 크게 변화하였음에 주목한다. 과학기술 발전으로 경제 성장이 가속화하였다는 점에 중점을 둔다."]},{"교":"사회","c":"12역현03-02","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"성장의 풍요와 생태환경","p":"대중 소비 사회의 형성과 생태환경의 문제 및 극복 노력을 사례 중심으로 탐구한다.","h":["전 지구적 차원의 대량 생산 체제가 마련되고 대중 소비 사회가 본격화되면서 생태환경의 문제가 심화되었음에 초점을 맞춘다. 생태환경의 문제는 대륙별⋅지역별로 편차가 있음에 유의하며 문제 해결을 위한 국제적 연대 활동이 활발하게 이루어진 사례를 중심으로 살핀다."]},{"교":"사회","c":"12역현03-03","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"성장의 풍요와 생태환경","p":"기후변화와 관련된 협약 및 보고서를 조사하고, 그 의미를 추론한다.","h":["국제 사회 기후변화 협약의 변화 과정을 파악하고 이에 영향을 미친 기후변화 평가 보고서도 함께 조사한다. 기후변화 협약과 보고서의 내용을 바탕으로 기후변화의 심각성을 깨닫고 대안을 모색 한다."]},{"교":"사회","c":"12역현04-01","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"분쟁과 갈등, 화해의 역사","p":"국제 분쟁 및 무력 갈등의 원인과 전개 양상을 사례 중심으로 파악한다.","h":["국제 분쟁 및 무력 갈등의 사례를 선정하고 분쟁의 발생 원인을 역사적 맥락에서 탐구하는 데 초점을 맞춘다. 국제 분쟁은 민족, 종족, 종교, 영토 문제 등 다양한 요인이 복합적으로 작용했음에 유의한다."]},{"교":"사회","c":"12역현04-02","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"분쟁과 갈등, 화해의 역사","p":"탈냉전 이후 ‘제3 세계’ 국가의 권위주의 체제 변동에 따른 갈등 양상과 특징을 조사한다.","h":["권위주의 체제를 유지하던 ‘제3 세계’ 국가가 탈냉전 이후 시장 개방과 민주화의 요구 등으로 체제 변동을 경험하며 새로운 갈등을 겪었음에 주목한다. 갈등 전개의 원인을 파악할 때 역사적으로 식민주의 문제와 연관된 사례가 많았음에 유의한다."]},{"교":"사회","c":"12역현04-03","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"분쟁과 갈등, 화해의 역사","p":"국내외 분쟁과 갈등을 해결하기 위한 역사 정책 사례를 탐구한다.","h":["탈냉전 이후 분쟁과 갈등을 조정하고 평화를 만들기 위한 역사 정책의 사례를 국가, 지역, 세계적 차원에서 찾아보고, 역사 정책의 실행 과정과 결과를 비교할 수 있도록 한다."]},{"교":"사회","c":"12역현05-01","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"도전받는 현대 세계","p":"경제의 세계화 이후 사회⋅경제적 변화를 국가, 지역, 세계적 차원에서 파악한다.","h":["경제의 세계화 이후 자본과 상품의 이동이 활발해지고 교류 및 이주가 활발해지면서 나타난 변화의 양상을 파악하며, 남북문제 등 불평등의 심화에 초점을 맞춘다."]},{"교":"사회","c":"12역현05-02","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"도전받는 현대 세계","p":"다문화 사회의 갈등 문제를 역사적으로 파악하고, 이를 해결하기 위해 노력한 사례를 조사한다.","h":["민족, 종족, 젠더, 종교, 이념 등의 차이를 근거로 차별과 혐오가 사회 문제로 부각되는 배경 및 과정에 초점을 맞춘다. 경제와 안전, 정체성 등을 이유로 다문화 사회의 포용 정책에 반대하는 주장이 존재하는 상황에서 시민 사회 및 국제기구의 역할에 주목한다."]},{"교":"사회","c":"12역현05-03","과":"역사로 탐구하는 현대 세계","학":"고2~3","영":"도전받는 현대 세계","p":"문화 다양성 관련 국제 규범의 형성 과정을 살펴보고, 그 의미와 한계를 탐구한다.","h":["문화 다양성을 존중하기 위한 국제 규범을 선정하여 탐구하고, 국제 규범의 가치를 이해하는 한편 규범의 등장 과정에서 제기된 논쟁과 갈등에 초점을 맞춘다."]},{"교":"사회","c":"12사탐01-01","과":"사회문제 탐구","학":"고2~3","영":"사회문제의 이해와 탐구","p":"사회문제의 의미와 특징을 이해하고, 사회문제를 바라보는 주요 관점을 비교한다."},{"교":"사회","c":"12사탐01-02","과":"사회문제 탐구","학":"고2~3","영":"사회문제의 이해와 탐구","p":"사회문제에 대한 과학적 탐구의 필요성을 설명하고, 사회문제 탐구를 위한 연구 방법과 다양한 자료 수집 방법의 특징을 비교한다.","h":["는 사회문제의 해결을 위해서는 과학적 탐구가 필요하다는 점을 이해하고, 사회과학에서 활용하는 연구 방법과 자료 수집 방법을 적용하여 사회문제 탐구를 위한 절차와 방법을 설계할 수 있도록 설정된 것이다. 양적 연구 방법과 질적 연구 방법의 특징과 절차를 살펴보고, 다양한 자료 수집 방법(문헌 연구법, 질문지법, 실험법, 참여 관찰법, 면접법 등)의 유형 및 특징을 비교함으로써 사회문제 탐구의 과정에 적용할 수 있도록 한다."]},{"교":"사회","c":"12사탐01-03","과":"사회문제 탐구","학":"고2~3","영":"사회문제의 이해와 탐구","p":"다양한 자료 수집 방법을 적용한 실제 사례를 활용하여 수집된 자료를 분석하고 해석하는 방법을 설명한다.","h":["은 다양한 자료 수집 방법을 적용하여 사회문제를 탐구한 실제 사례를 통해 자료 분석 및 해석 능력, 추론 능력, 결론 도출 능력 등을 함양할 수 있도록 설정된 것이다. 각 자료수집 방법을 적용한 실제 사례를 토대로 통계 자료 및 질적 자료의 기초적인 분석과 해석 등을 다루어 자료 수집 및 분석 방법을 실제 사회문제 탐구 과정에서 어떻게 적용할 수 있는지를 파악하도록 한다."]},{"교":"사회","c":"12사탐01-04","과":"사회문제 탐구","학":"고2~3","영":"사회문제의 이해와 탐구","p":"사회문제의 탐구 과정에서 요구되는 연구 윤리를 설명하고, 연구 윤리를 준수하며 사회문제를 탐구하는 태도를 가진다."},{"교":"사회","c":"12사탐02-01","과":"사회문제 탐구","학":"고2~3","영":"일상생활과 사회문제","p":"일상생활에서 나타나는 성 불평등 문제의 실태를 조사하고, 원인과 해결 방안을 제시한다.","h":["은 일상생활에서 나타나는 다양한 성 불평등 문제의 실태를 조사하고, 성 불평등 문제를 바라보는 다양한 관점을 종합적으로 고려하여 성 불평등 현상이 발생하는 원인과 해결 방안을 탐구하기 위해 설정된 것이다. 가족 내 성 불평등 문제, 노동시장에서의 성차별 등 다양한 생활 영역에서의 성 불평등 양상과 문제점을 파악하고 해결 방안을 모색하도록 한다."]},{"교":"사회","c":"12사탐02-02","과":"사회문제 탐구","학":"고2~3","영":"일상생활과 사회문제","p":"청소년의 미디어 이용 과정에서 나타나는 문제를 조사하고, 원인과 해결 방안을 제시한다.","h":["는 청소년의 일상에서 미디어가 차지하는 비중이 매우 큰 현실에서 미디어와 관련된 사회문제의 원인과 해결 방안을 학습자 스스로 탐구하도록 설정된 것이다. 미디어의 기능을 이해하고, 미디어 이용 과정에서 나타나는 대표적인 사회문제(예: 허위정보, 미디어 공간에서의 사회적 약자에 대한 편견이나 차별, 정보 여과 현상, 지식 재산권 침해 등)를 탐구함으로써 학생들이 자신의 미디어 이용 실태를 성찰하고 문제를 인식하여 능동적으로 해결할 수 있도록 한다."]},{"교":"사회","c":"12사탐03-01","과":"사회문제 탐구","학":"고2~3","영":"변화하는 세계와 사회문제","p":"저출산⋅고령화로 인해 발생하는 다양한 사회문제의 실태를 조사하고, 해결 방안을 제시한다.","h":["은 주요 선진국과 우리나라의 인구 구조에서 나타나고 있는 저출산⋅고령화 현상을 파악하고, 저출산⋅고령화로 인해 발생하는 사회문제의 해결 방안을 다양한 측면에서 모색하기 위해 설정된 것이다. 출생과 사망의 사회적 의의 등 사회현상으로서 인구 문제에 대한 기본적인 이해를 토대로 다양한 통계 및 시사 자료의 분석에 초점을 맞추어 저출산⋅고령화의 원인과 그로 인한 문제점을 파악하고 해결 방안을 제시할 수 있도록 한다."]},{"교":"사회","c":"12사탐03-02","과":"사회문제 탐구","학":"고2~3","영":"변화하는 세계와 사회문제","p":"인공지능 발전 과정에서 나타날 수 있는 다양한 사회문제를 탐색하고, 대응 방안을 제시한다.","h":["는 인공지능의 발전에 따라 나타날 수 있는 여러 사회문제를 예측하고, 이에 대응하는 방안을 다양한 측면에서 모색하기 위해 설정된 것이다. 인공지능의 발전 과정에서 나타날 수 있는 사회문제(예: 노동시장 변화로 인한 사회 양극화 문제, 인공지능의 편향성과 오류 문제, 개인의 사생활과 자율성 침해 문제 등)를 자유롭게 예측하고 창의적인 대응 방안을 모색하도록 한다."]},{"교":"사회","c":"12사탐04-01","과":"사회문제 탐구","학":"고2~3","영":"사회문제 사례 연구","p":"일상생활에서 경험하는 사회문제 중 하나를 선정하여 해당 문제에 대한 다양한 관점을 비교하고, 이를 바탕으로 문제 해결을 위한 탐구 계획을 수립한다.","h":["~[12사탐04-04]는 지금까지 학습한 다양한 사회문제 탐구 경험을 토대로 학습자가 직접 사회문제를 선정하고, 탐구 계획을 수립하여 해결 방안을 도출하는 과정을 보고서로 작성하여 발표하기 위해 설정된 것이다. 이를 통해 사회문제에 관심을 갖고, 문제 해결을 위해 적극적으로 참여하는 태도를 가질 수 있도록 한다."]},{"교":"사회","c":"12사탐04-02","과":"사회문제 탐구","학":"고2~3","영":"사회문제 사례 연구","p":"탐구 계획에 적합한 자료 수집 방법을 적용하여 자신이 선정한 사회문제에 관한 자료를 수집한다."},{"교":"사회","c":"12사탐04-03","과":"사회문제 탐구","학":"고2~3","영":"사회문제 사례 연구","p":"수집한 자료에 대한 분석과 해석을 토대로 사회문제에 대한 해결 방안을 제시한다."},{"교":"사회","c":"12사탐04-04","과":"사회문제 탐구","학":"고2~3","영":"사회문제 사례 연구","p":"자신의 사회문제 탐구 과정과 결과를 연구 보고서로 작성하여 발표하고, 사회문제 해결을 위한 참여는 사회 구성원으로서의 권리이자 의무라는 점을 인식하며 해결 방안을 적극적으로 실천한다."},{"교":"사회","c":"12금융01-01","과":"금융과 경제생활","학":"고2~3","영":"행복하고 안전한 금융 생활","p":"행복하고 안전한 금융 생활에 필요한 금융 정보를 탐색하고 평가하며, 단기와 장기의 관점을 고려하여 합리적인 금융 의사 결정을 한다.","h":["에서는 자원의 희소성과 선택의 문제를 이해하고, 다양한 경로를 통해 합리적인 금융 의사 결정에 필요한 정보를 수집하고 평가해 본다. 단기와 장기의 관점에 따라 금융 의사 결정이 달라질 수 있음을 파악하고, 자신의 재무적 특성과 비재무적 특성 및 거시적 요인(금리, 환율, 물가 상승률 등)을 고려한 금융 의사 결정이 필요함을 이해한다."]},{"교":"사회","c":"12금융01-02","과":"금융과 경제생활","학":"고2~3","영":"행복하고 안전한 금융 생활","p":"디지털 금융 환경에서 나타난 금융 서비스의 변화된 특징을 이해하고 디지털 금융 서비스를 효과적으로 이용한다.","h":["에서는 금융 환경 변화의 흐름을 파악하고 디지털 금융 환경에서 이용 가능한 금융 서비스를 탐색한다. 인터넷 뱅킹이나 모바일 뱅킹, 간편 결제 서비스, 전자화폐 등 학생들이 실생활에서 쉽게 접할 수 있는 금융 서비스의 이용 방법과 주의사항을 학습하여 디지털 금융 서비스를 효과적으로 활용할 수 있는 역량을 기르는 데 중점을 둔다."]},{"교":"사회","c":"12금융01-03","과":"금융과 경제생활","학":"고2~3","영":"행복하고 안전한 금융 생활","p":"안전한 금융 거래를 위한 계약(약관)의 중요성을 인식하고, 금융 사기 예방과 피해 구제를 위해 마련된 주요 금융 소비자 보호 제도를 탐구한다.","h":["에서는 계약(약관) 내용을 제대로 확인하고 신중한 금융 거래를 실천할 필요가 있음을 이해한다. 피싱, 스미싱, 파밍, 해킹과 같은 금융 사기 피해를 예방하고, 금융 소비자 보호 제도를 탐색하여 금융 사기 피해 발생 시 대처 역량을 기르는 데 중점을 둔다."]},{"교":"사회","c":"12금융02-01","과":"금융과 경제생활","학":"고2~3","영":"수입과 지출","p":"소득이 수입의 주요 원천임을 이해하고 소득에 영향을 미치는 다양한 요인을 탐구한다.","h":["에서는 직업과 교육 수준, 기술, 사회적 기여도, 인지도, 보유 자산 등 소득에 영향을 미치는 다양한 요인을 탐구하고 각 요인들이 미치는 영향을 소득의 종류(근로 소득, 사업 소득, 재산 소득 등)와 연관지어 파악한다. 또한 총소득과 처분 가능 소득을 구분하고 세금이나 사회 보험료, 대출 이자와 같은 고정적인 지출이 처분 가능 소득에 영향을 미치는 요인임을 이해한다."]},{"교":"사회","c":"12금융02-02","과":"금융과 경제생활","학":"고2~3","영":"수입과 지출","p":"소비 지출과 비소비 지출을 구분하고 지출에 영향을 미치는 요인을 파악하여 합리적인 소비를 실천한다.","h":["에서는 지출의 유형을 재화나 서비스를 구매하기 위한 소비 지출과 세금, 사회 보험료, 대출 이자와 같이 의무적으로 지불해야 하는 비소비 지출로 구분하여 학습한다. 지불수단(예: 현금, 카드, 전자화폐 등) 및 지불방법(예: 일시불, 할부 등)의 장⋅단점을 비교하여 자신에게 적합한 지불수단과 방법을 활용하며, 주어진 예산 제약 내에서 비용과 편익을 고려하여 만족을 극대화하는 합리적 소비 습관을 기르는 데 중점을 둔다."]},{"교":"사회","c":"12금융02-03","과":"금융과 경제생활","학":"고2~3","영":"수입과 지출","p":"예산의 의미와 예산 관리 방법을 이해하고 자신의 금융 생활에서 예산을 수립⋅점검⋅평가한다.","h":["에서는 생애 주기에 따른 기대 수입과 항목별 지출 계획을 구체적으로 예상해 보고, 소득, 저축과 투자, 고정지출과 변동지출 등을 고려하여 예산 관리 계획을 수립해 본다. 우선순위와 현실성 등을 고려하여 수립한 예산을 점검⋅평가하며 건전한 예산 관리를 실천하는 태도를 기르는 데 중점을 둔다."]},{"교":"사회","c":"12금융03-01","과":"금융과 경제생활","학":"고2~3","영":"저축과 투자","p":"저축의 경제적 의의와 다양한 저축 상품의 특징을 이해하고 저축에 영향을 미치는 요인을 탐구한다.","h":["에서는 소비와 저축의 관계를 이해하고 저축의 경제적 의의를 개인적 측면과 사회적 측면에서 살펴본다. 예금, 적금, 주택종합청약저축 등 다양한 종류의 저축 상품을 비교하며 각 상품의 특징을 탐색하고 이자, 세금, 물가 등 저축에 영향을 주는 요인을 고려하여 저축에 대한 의사 결정을 내려야 함을 이해한다."]},{"교":"사회","c":"12금융03-02","과":"금융과 경제생활","학":"고2~3","영":"저축과 투자","p":"기본적인 금융 투자 상품의 종류와 특징을 이해하고 투자에 영향을 미치는 요인을 탐구한다.","h":["에서는 주식, 채권, 펀드 등 다양한 금융 투자 상품의 특징을 비교하고, 금리, 인플레이션, 환율과 같은 거시 경제 지표와 국내외 경제 이슈, 투자 정보 등 투자에 영향을 미치는 여러 요인을 탐색한다. 또한 다양한 경로로 얻게 되는 투자 정보 중 신뢰할 수 있는 정보를 선별하는 것의 중요성을 인식하도록 한다."]},{"교":"사회","c":"12금융03-03","과":"금융과 경제생활","학":"고2~3","영":"저축과 투자","p":"저축과 투자의 장단점을 고려하여 자기 책임의 원칙에 따라 저축과 투자를 결정하며, 활용할 수 있는 예금자 보호 제도와 투자자 보호 제도를 탐색한다.","h":["에서는 저축과 투자를 결정할 때는 안전성과 수익성, 유동성을 고려해야 함을 이해하고, 불확실성과 위험에 따른 선택의 책임은 본인에게 있음을 인식하도록 한다. 금융 피해 보호를 위해 마련된 예금자 보호 제도와 투자자 보호 제도의 구체적인 내용과 활용 방법을 파악하고 이러한 제도들이 모든 금융 피해를 구제해 주는 것은 아니라는 점을 이해한다."]},{"교":"사회","c":"12금융04-01","과":"금융과 경제생활","학":"고2~3","영":"신용과 위험 관리","p":"신용 사용의 결과를 고려한 책임감 있는 신용 관리 태도를 기르고, 신용에 영향을 미치는 요인을 파악하여 자신의 신용을 효과적으로 관리하는 방법을 탐구한다.","h":["에서는 신용의 의미를 이해하고 신용을 사용할 때는 이자, 할부 수수료, 카드 연회비 등 비용이 발생함을 이해한다. 직업과 연봉, 보유 자산, 각종 공과금과 통신비 등의 납부 내역, 금융 거래 내역 등 신용에 영향을 미치는 요인을 파악하고, 신용 점수 하락을 방지하고 효과적인 신용 관리 습관을 기르는 데 중점을 둔다. 또한 신용 회복 위원회의 채무 조정 제도와 법원의 개인 회생 제도 등 신용 회복 지원 제도에 대해서도 다루어 본다."]},{"교":"사회","c":"12금융04-02","과":"금융과 경제생활","학":"고2~3","영":"신용과 위험 관리","p":"위험 관리의 필요성과 위험 관리 방법으로서 보험의 원리를 이해하고, 주요 보험 상품의 특징을 비교한다.","h":["에서는 질병, 상해, 사망, 사고, 재산 손해 등 생활 속에서 경험할 수 있는 다양한 유형의 위험을 살펴보고, 재무적⋅비재무적 비용을 고려한 위험 관리가 필요함을 이해한다. 적극적인 위험 관리 수단인 보험을 사회 보험과 민영 보험으로 구분하고, 시중에 판매되고 있는 주요 보험 상품(실손 보험, 자동차 보험, 화재 보험 등)의 보장 내용과 보장 범위, 보장 기간, 보험료 등을 구체적으로 조사해 본다."]},{"교":"사회","c":"12금융04-03","과":"금융과 경제생활","학":"고2~3","영":"신용과 위험 관리","p":"고령 사회에서 노후 설계의 필요성을 이해하고, 연금의 종류와 특징을 파악하여 안정적인 노후 대비 계획을 설계한다.","h":["에서는 기대 수명 연장을 고려하여 은퇴 후 생활에 필요한 비용을 예상해 보고 이를 충당할 수 있는 재원 마련 방안을 탐색해 본다. 노후 대비를 일찍 시작하는 것의 중요성을 이해하고, 노후 대비 방안 중 하나인 연금을 공적 연금과 퇴직 연금, 개인 연금 등으로 구분하여 비교해 본 후 연금 선택 시 고려 사항(세금, 물가, 기회비용 등)에 대해서도 다루어 본다."]},{"교":"사회","c":"12기지01-01","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"인간과 기후변화","p":"지구적 차원에서 나타나는 기후변화의 심각성을 사례를 통해 파악하고, 기후변화를 바라보는 관점의 다양성을 이해한다.","h":["은 기후변화로 인해 나타난 문제를 지구적 차원에서 살펴보고, 관련 사례를 선정하여 문제의 심각성을 파악하며, 기후변화의 영향을 다양한 관점(예: 낙관론자, 회의론자 등)에서 살펴본다. 궁극적으로 학습자가 기후변화의 심각성을 파악하고, 기후변화에 대한 관점의 다양성을 이해하는 데 중점을 둔다."]},{"교":"사회","c":"12기지01-02","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"인간과 기후변화","p":"기후변화는 자연적 요인뿐만 아니라 인간의 다양한 활동 및 산업과 관련되어 있다는 점을 이해하고, 탄소중립을 위한 사회 변화의 방향을 탐구한다.","h":["는 기후변화의 요인을 자연적 요인, 인위적 요인으로 구분하여 살펴보고 산업과 관련된 탄소배출 문제에 중점을 두면서 탄소중립 사회를 위한 사회적 과제 해결 탐구에 초점을 맞춘다. 특히, 기후변화에 영향을 주는 고탄소 배출 산업의 사례로 에너지 산업, 플라스틱 등의 석유화학 산업, 축산업 등을 활용해 볼 수 있다."]},{"교":"사회","c":"12기지02-01","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"기후정의와 지역문제","p":"세계 여러 지역에서 발생하고 있는 기후재난의 실제를 파악하고, 이를 둘러싼 쟁점을 다양한 자료를 통하여 분석한다.","h":["은 세계에서 발생하는 기후재난의 사례(산불, 가뭄, 해양 산성화, 미세먼지, 질병, 해수면 상승, 경제적 빈곤과 굶주림 등)를 활용하여 문제의 실태와 원인, 인간 생활에 미친 영향, 그리고 관련한 쟁점을 분석하는 데 중점을 둔다."]},{"교":"사회","c":"12기지02-02","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"기후정의와 지역문제","p":"기후변화의 영향은 지리적 조건 및 사회적⋅경제적 조건에 따라 차별적으로 나타나고 있음을 이해하고, 이와 관련한 쟁점과 사례를 조사한다.","h":["에서는 기후변화의 영향이 지리적 조건, 세대, 연령, 성별, 집단 등에 따라 다르게 나타남을 파악하여 글로벌 차원에서 기후변화가 미치는 차별적 영향을 이해하도록 한다. 관련 쟁점 및 사례는 지역사회를 포함하여 글로벌 차원에서 적정하게 선정할 수 있다."]},{"교":"사회","c":"12기지02-03","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"기후정의와 지역문제","p":"기후정의의 관점에서 기후변화에 따른 불평등 문제의 해결 방안을 모색하고, 기후변화에 대한 인간의 책임과 의무에 대해 성찰한다.","h":["은 기후정의의 의미와 적용의 가치를 명확하게 이해하고 기후변화의 불평등한 영향을 기후정의의 관점에서 파악하도록 한다. 그리고 공동의 책임에 대한 이해를 바탕으로 기후변화에 대한 책임과 의무의 성찰이 이루어지도록 한다."]},{"교":"사회","c":"12기지03-01","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"지속가능한 세계를 위한 생태전환","p":"기후변화 대응을 위한 국제 사회의 협력과 시민사회의 노력 사례를 조사하고 기후변화를 둘러싼 이해당사자들의 서로 다른 입장과 가치를 비교한다.","h":["는 기후변화 문제를 해결하기 위해 국제 사회의 협력 및 환경 비정부기구(NGO)의 다양한 연대와 관련한 노력을 실제 사례들을 통해 파악하고 기후변화 문제에 대한 대응에 있어 다양한 이해당사자들의 입장을 분석하고 비교하기 위해 설정한 것이다. 여기에서는 기후변화를 둘러싼 이해당사자들 특히 기후변화에 취약한 국가와 집단들의 입장 분석과 관련하여 기후정의의 관점에서 공동의 차별화된 책임에 대한 이해를 바탕으로 접근한다."]},{"교":"사회","c":"12기지03-02","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"지속가능한 세계를 위한 생태전환","p":"기후변화 문제와 관련하여 국가 차원의 대응으로서 정치, 사회, 경제 영역에서의 생태전환을 위한 실천 사례를 조사하고, 이를 분석 평가한다.","h":["는 기후변화 문제에 대응하기 위하여 국가적 차원에서 이루어지는 노력 가운데 정치, 사회, 경제 영역에서의 생태전환에 대한 이해에 기반하여 다양한 사례를 살펴보기 위해 설정된 것이다. 특히 기후변화 대응을 위한 탄소중립⋅녹색성장 등 환경 및 경제 정책과 저탄소 에너지 기반 경제 체제로의 전환, 비인간에게 권리를 부여한 환경법과 관련한 다양한 사례 등을 조사한 후 그 의의와 시사점을 도출해 보도록 하고, 그러한 사례들이 기후정의와 지속가능성의 측면에서 적절한 사례인지 분석하고 평가하도록 한다."]},{"교":"사회","c":"12기지03-03","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"지속가능한 세계를 위한 생태전환","p":"지역 공동체의 생태전환을 위한 다양한 노력 사례를 조사하고 지역의 지속가능한 사회⋅생태 체계를 탐색한다.","h":["은 지속가능한 세계를 만들기 위한 지역사회의 다양한 생태전환 노력에 대한 이해를 바탕으로 지속가능한 사회⋅생태 체계를 탐색하기 위해 설정한 것이다. 여기에서는 지역사회의 생태전환을 위한 실천 가운데 생태도시, 전환마을, 공유재 등을 통한 회복 탄력성과 지속가능성을 갖춘 지역사회로의 전환과 관련한 다양한 사례를 중심으로 지속가능한 사회의 구성요소, 원리 등에 대한 탐색과 자신이 살아가는 가정, 학교, 지역을 지속가능한 사회 생태 체계로 만들어 가기 위한 탐구 과정을 통해 깊이 있는 학습이 이루어지도록 한다."]},{"교":"사회","c":"12기지03-04","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"지속가능한 세계를 위한 생태전환","p":"기후변화에 대응하기 위한 적정기술과 순환경제의 역할의 중요성을 파악하고, 에너지 전환의 중요성에 대한 이해를 바탕으로 지속가능한 세계의 모습을 제안한다.","h":["인간과 환경이 공존할 수 있는 생산 및 소비 구조를 만드는 데 있어 적정기술과 순환경제의 의미와 중요성을 학습해 가는 과정에서 특히 지역별 사례를 조사하여 지역사회에 적용할 수 있는 방안을 모색해 보는 탐구 기회를 제공하도록 한다. 또한 지속가능한 미래를 위하여 에너지 분야에서 저탄소 전력을 공급할 수 있는 에너지 전환의 중요성을 이해하도록 한다. 이를 위하여 에너지 생산과 소비의 지역 간 불평등으로 인한 쟁점을 조사하고, 지속가능한 사회의 실현은 정의로운 에너지 전환을 위한 시민의 참여와 역량 강화를 지향하는 에너지 민주주의 실천과 밀접하게 관계되어 있다는 점에 강조점을 둔다."]},{"교":"사회","c":"12기지04-01","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"공존의 세계와 생태시민","p":"지속가능발전목표(SDGs)의 의미를 이해하고, 이의 실천과 관련한 지역 사례들을 조사하여 환경적, 경제적, 사회적 측면에서 통합적으로 분석한다.","h":["은 지속가능발전목표(SDGs)의 등장 배경 및 주요 내용을 이해하고, 지속가능발전목표 이행과 관련하여 지역사회에서 실천되는 다양한 노력 사례를 살펴본 후 이를 통합적 관점에서 분석해 보도록 한다. 여기에서는 지속가능발전목표의 지역화 사례를 통해 지속가능한 사회 체제의 요소, 조건과 원리 등을 탐구하도록 한다."]},{"교":"사회","c":"12기지04-02","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"공존의 세계와 생태시민","p":"지속가능한 세계는 개인의 일상생활 방식과 관련되어 있음을 이해하고, 다양한 소비 영역에서 요구되는 지속가능한 생활방식을 탐색하고 실천 방안을 제안한다.","h":["는 지속가능한 미래 사회의 실현은 일상생활에서 발현되는 개인의 생태적 정체성과 밀접하게 연결되어 있음을 인식하고 음식, 교통, 주거 등과 관련한 지속가능한 생활양식 사례를 조사하여 자신의 일상생활에서 실천할 수 있는 방안을 탐색해 보도록 한다. 특히 소비 영역에서의 지속가능한 생활양식 탐색은 쟁점 중심의 탐구에 초점을 두고 이루어지도록 한다."]},{"교":"사회","c":"12기지04-03","과":"기후변화와 지속가능한 세계","학":"고2~3","영":"공존의 세계와 생태시민","p":"정의, 책임 그리고 배려 등과 같은 생태시민의 덕목을 사례 탐구를 통해 이해하고, 인간 및 비인간이 함께 평화롭게 살아가는 공존의 세계를 위한 다층적 스케일에서의 실천 방안을 찾아 적극적으로 참여한다.","h":["은 자신과 지구상의 모든 존재들이 연결되어 있음을 파악하는 관계적 사고에 기반하여 발현되는 생태시민의 정의, 책임, 배려 등과 같은 덕목을 이해한다. 또한 생태시민의 덕목이 인간 및 비인간 존재들에게까지 확장되어야 할 필요성을 다양한 사례 탐구를 통해 강조하면서 깊이 있는 학습이 이루어지도록 하는데 주안점을 둔다. 공존의 세계를 만들어가기 위한 지역, 국가, 세계적 차원에서 이루어지는 실천 방안을 찾아 보고 이에 대한 적극적 참여의 중요성을 인식하도록 한다."]},{"교":"수학","c":"2수01-01","과":"수학","학":"초1~2","영":"수와 연산","p":"수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다."},{"교":"수학","c":"2수01-02","과":"수학","학":"초1~2","영":"수와 연산","p":"일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다."},{"교":"수학","c":"2수01-03","과":"수학","학":"초1~2","영":"수와 연산","p":"네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다."},{"교":"수학","c":"2수01-04","과":"수학","학":"초1~2","영":"수와 연산","p":"하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다."},{"교":"수학","c":"2수01-05","과":"수학","학":"초1~2","영":"수와 연산","p":"덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다."},{"교":"수학","c":"2수01-06","과":"수학","학":"초1~2","영":"수와 연산","p":"두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","h":["덧셈은 두 자리 수의 범위에서 다루되, 합이 세 자리 수인 경우도 포함한다."]},{"교":"수학","c":"2수01-07","과":"수학","학":"초1~2","영":"수와 연산","p":"덧셈과 뺄셈의 관계를 이해한다."},{"교":"수학","c":"2수01-08","과":"수학","학":"초1~2","영":"수와 연산","p":"두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다."},{"교":"수학","c":"2수01-09","과":"수학","학":"초1~2","영":"수와 연산","p":"□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다."},{"교":"수학","c":"2수01-10","과":"수학","학":"초1~2","영":"수와 연산","p":"곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다."},{"교":"수학","c":"2수01-11","과":"수학","학":"초1~2","영":"수와 연산","p":"곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다."},{"교":"수학","c":"2수02-01","과":"수학","학":"초1~2","영":"변화와 관계","p":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다.","h":["물체, 무늬, 수 등의 배열을 관찰하여 일정하게 반복되거나 증가하는 규칙을 찾고 말, 수, 그림, 기호, 구체물, 행동 등의 다양한 방법으로 표현하게 한다. 그리고 물체, 무늬, 수의 배열에서 다음에 올 것이나 중간에 빠진 것을 추측하게 한다."]},{"교":"수학","c":"2수02-02","과":"수학","학":"초1~2","영":"변화와 관계","p":"자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다."},{"교":"수학","c":"2수03-01","과":"수학","학":"초1~2","영":"도형과 측정","p":"교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."},{"교":"수학","c":"2수03-02","과":"수학","학":"초1~2","영":"도형과 측정","p":"쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.","h":["쌓기나무로 만든 입체도형의 모양에 대해서 ‘∼의 앞’, ‘∼의 오른쪽’, ‘∼의 위’, ‘2층’ 등을 사용하여 말하게 한다."]},{"교":"수학","c":"2수03-03","과":"수학","학":"초1~2","영":"도형과 측정","p":"교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."},{"교":"수학","c":"2수03-04","과":"수학","학":"초1~2","영":"도형과 측정","p":"삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다.","h":["삼각형, 사각형, 원은 예인 것과 예가 아닌 것을 분류하는 활동을 통하여 직관적으로 이해하게 한다. 본뜨기, 도형판을 이용한 활동 등을 통해 삼각형, 사각형, 원의 모양을 그리게 할 수 있다."]},{"교":"수학","c":"2수03-05","과":"수학","학":"초1~2","영":"도형과 측정","p":"삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다."},{"교":"수학","c":"2수03-06","과":"수학","학":"초1~2","영":"도형과 측정","p":"구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다."},{"교":"수학","c":"2수03-07","과":"수학","학":"초1~2","영":"도형과 측정","p":"시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다."},{"교":"수학","c":"2수03-08","과":"수학","학":"초1~2","영":"도형과 측정","p":"1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다."},{"교":"수학","c":"2수03-09","과":"수학","학":"초1~2","영":"도형과 측정","p":"실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다."},{"교":"수학","c":"2수03-10","과":"수학","학":"초1~2","영":"도형과 측정","p":"길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다.","h":["길이의 표준 단위를 도입하기 전에 구체물을 직접 비교해 보거나 여러 가지 임의 단위를 사용하여 구체물의 길이를 재어보는 활동을 통해 표준 단위의 필요성을 알게 한다."]},{"교":"수학","c":"2수03-11","과":"수학","학":"초1~2","영":"도형과 측정","p":"1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다."},{"교":"수학","c":"2수03-12","과":"수학","학":"초1~2","영":"도형과 측정","p":"여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다.","h":["생활 주변의 여러 가지 물건들의 길이를 어림해 보고 자로 측정하여 확인하는 활동과 주어진 길이에 해당하는 선분을 그려 보는 활동을 통해 길이에 대한 양감을 기르게 한다."]},{"교":"수학","c":"2수03-13","과":"수학","학":"초1~2","영":"도형과 측정","p":"실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다."},{"교":"수학","c":"2수04-01","과":"수학","학":"초1~2","영":"자료와 가능성","p":"여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다."},{"교":"수학","c":"2수04-02","과":"수학","학":"초1~2","영":"자료와 가능성","p":"자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다.","h":["표를 이용하여 자료의 크기를 수로 정리하면, 자료의 크기를 나타내고 비교하는 데 편리하다는 점을 통해 수학의 유용성을 인식하게 한다."]},{"교":"수학","c":"2수04-03","과":"수학","학":"초1~2","영":"자료와 가능성","p":"자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.","h":["그래프를 이용하여 자료의 크기를 시각적으로 나타내면, 자료의 크기를 한눈에 비교하는 데 편리하다는 점을 통해 수학의 유용성을 인식하게 한다."]},{"교":"수학","c":"4수01-01","과":"수학","학":"초3~4","영":"수와 연산","p":"큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다."},{"교":"수학","c":"4수01-02","과":"수학","학":"초3~4","영":"수와 연산","p":"다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다."},{"교":"수학","c":"4수01-03","과":"수학","학":"초3~4","영":"수와 연산","p":"세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","h":["덧셈은 세 자리 수의 범위에서 다루되, 합이 네 자리 수인 경우도 포함한다."]},{"교":"수학","c":"4수01-04","과":"수학","학":"초3~4","영":"수와 연산","p":"곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","h":["곱셈은 ‘(두 자리 수)×(한 자리 수)’, ‘(세 자리 수)×(한 자리 수)’, ‘(두 자리 수)×(두 자리 수)’, ‘(세 자리 수)×(두 자리 수)’를 다룬다."]},{"교":"수학","c":"4수01-05","과":"수학","학":"초3~4","영":"수와 연산","p":"나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다."},{"교":"수학","c":"4수01-06","과":"수학","학":"초3~4","영":"수와 연산","p":"나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다.","h":["나눗셈에서 ‘(두 자리 수)÷(한 자리 수)’는 나누어떨어지는 경우와 나누어떨어지지 않는 경우를 포함하여 몫과 나머지를 이해하게 한다."]},{"교":"수학","c":"4수01-07","과":"수학","학":"초3~4","영":"수와 연산","p":"나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","h":["나누는 수가 두 자리 수인 나눗셈에서는 ‘(두 자리 수)÷(두 자리 수)’, ‘(세 자리 수)÷(두 자리 수)’를 다룬다."]},{"교":"수학","c":"4수01-08","과":"수학","학":"초3~4","영":"수와 연산","p":"자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다."},{"교":"수학","c":"4수01-09","과":"수학","학":"초3~4","영":"수와 연산","p":"양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다.","h":["1보다 작은 양을 나타내는 경우를 통하여 분수의 필요성이나 그 표현의 편리함을 인식하게 할 수 있다. 양의 등분할을 통하여 분수를 도입할 때 부분과 전체를 파악하게 하고, ‘분모’, ‘분자’를 사용한다."]},{"교":"수학","c":"4수01-10","과":"수학","학":"초3~4","영":"수와 연산","p":"단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다."},{"교":"수학","c":"4수01-11","과":"수학","학":"초3~4","영":"수와 연산","p":"분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다."},{"교":"수학","c":"4수01-12","과":"수학","학":"초3~4","영":"수와 연산","p":"분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다."},{"교":"수학","c":"4수01-13","과":"수학","학":"초3~4","영":"수와 연산","p":"자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다."},{"교":"수학","c":"4수01-14","과":"수학","학":"초3~4","영":"수와 연산","p":"소수의 크기를 비교하고 그 방법을 설명할 수 있다."},{"교":"수학","c":"4수01-15","과":"수학","학":"초3~4","영":"수와 연산","p":"분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"교":"수학","c":"4수01-16","과":"수학","학":"초3~4","영":"수와 연산","p":"소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"교":"수학","c":"4수02-01","과":"수학","학":"초3~4","영":"변화와 관계","p":"다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다."},{"교":"수학","c":"4수02-02","과":"수학","학":"초3~4","영":"변화와 관계","p":"계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다.","h":["다양한 규칙을 찾을 수 있는 계산식의 배열, 수의 성질을 탐구할 수 있는 계산식의 배열을 다룬다."]},{"교":"수학","c":"4수02-03","과":"수학","학":"초3~4","영":"변화와 관계","p":"등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.","h":["등호(=)의 의미를 토대로 구체물, 그림 등을 사용하여 주어진 식이 옳은지 판단하는 활동, 크기가 같은 두 양을 찾는 활동 등을 통해 동치 관계를 이해하게 한다."]},{"교":"수학","c":"4수03-01","과":"수학","학":"초3~4","영":"도형과 측정","p":"직선, 선분, 반직선을 이해하고 구별할 수 있다."},{"교":"수학","c":"4수03-02","과":"수학","학":"초3~4","영":"도형과 측정","p":"각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다."},{"교":"수학","c":"4수03-03","과":"수학","학":"초3~4","영":"도형과 측정","p":"직선의 수직 관계와 평행 관계를 이해한다."},{"교":"수학","c":"4수03-04","과":"수학","학":"초3~4","영":"도형과 측정","p":"구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다.","h":["실생활에서 평면도형의 이동을 활용한 사례를 찾아서 이동에 따른 변화를 추론하고 위치나 방향이 어떻게 변화했는지 설명하게 한다."]},{"교":"수학","c":"4수03-05","과":"수학","학":"초3~4","영":"도형과 측정","p":"평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다.","h":["평면에서 점의 이동은 격자를 따라 위, 아래, 오른쪽, 왼쪽으로 ‘∼칸’, ‘∼cm’를 이동하는 수준에서 다룬다. 한 점의 이동에 대해 위치와 방향을 설명하는 데 초점을 두고, 꼭짓점의 이동을 이용하여 평면도형의 이동을 설명하는 활동은 다루지 않는다."]},{"교":"수학","c":"4수03-06","과":"수학","학":"초3~4","영":"도형과 측정","p":"원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다."},{"교":"수학","c":"4수03-07","과":"수학","학":"초3~4","영":"도형과 측정","p":"컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다.","h":["컴퍼스를 사용하여 다양한 크기의 원을 그리는 방법을 원의 성질과 연결하여 이해하게 한다."]},{"교":"수학","c":"4수03-08","과":"수학","학":"초3~4","영":"도형과 측정","p":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다."},{"교":"수학","c":"4수03-09","과":"수학","학":"초3~4","영":"도형과 측정","p":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각삼각형을 이해한다."},{"교":"수학","c":"4수03-10","과":"수학","학":"초3~4","영":"도형과 측정","p":"여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다."},{"교":"수학","c":"4수03-11","과":"수학","학":"초3~4","영":"도형과 측정","p":"다각형과 정다각형을 이해한다.","h":["도형판, 모양 조각 등의 교구를 이용한 구체적인 조작 활동을 통해 다각형과 정다각형을 이해하게 한다."]},{"교":"수학","c":"4수03-12","과":"수학","학":"초3~4","영":"도형과 측정","p":"주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다.","h":["다양한 교구와 공학 도구 등을 이용한 구체적인 활동을 통해 주어진 도형으로 여러 가지 모양을 다양하게 만들거나 채울 수 있다."]},{"교":"수학","c":"4수03-13","과":"수학","학":"초3~4","영":"도형과 측정","p":"1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다."},{"교":"수학","c":"4수03-14","과":"수학","학":"초3~4","영":"도형과 측정","p":"실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다."},{"교":"수학","c":"4수03-15","과":"수학","학":"초3~4","영":"도형과 측정","p":"길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."},{"교":"수학","c":"4수03-16","과":"수학","학":"초3~4","영":"도형과 측정","p":"1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다."},{"교":"수학","c":"4수03-17","과":"수학","학":"초3~4","영":"도형과 측정","p":"들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."},{"교":"수학","c":"4수03-18","과":"수학","학":"초3~4","영":"도형과 측정","p":"1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다."},{"교":"수학","c":"4수03-19","과":"수학","학":"초3~4","영":"도형과 측정","p":"실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다."},{"교":"수학","c":"4수03-20","과":"수학","학":"초3~4","영":"도형과 측정","p":"실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.","h":["초등학교에서는 무게와 질량의 개념을 엄밀하게 구분하지 않으며, 무게를 비교하고 측정하는 데에 g, kg의 단위를 사용하게 한다."]},{"교":"수학","c":"4수03-21","과":"수학","학":"초3~4","영":"도형과 측정","p":"1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다."},{"교":"수학","c":"4수03-22","과":"수학","학":"초3~4","영":"도형과 측정","p":"실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다."},{"교":"수학","c":"4수03-23","과":"수학","학":"초3~4","영":"도형과 측정","p":"실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다."},{"교":"수학","c":"4수03-24","과":"수학","학":"초3~4","영":"도형과 측정","p":"각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다."},{"교":"수학","c":"4수03-25","과":"수학","학":"초3~4","영":"도형과 측정","p":"여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다."},{"교":"수학","c":"4수04-01","과":"수학","학":"초3~4","영":"자료와 가능성","p":"자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다."},{"교":"수학","c":"4수04-02","과":"수학","학":"초3~4","영":"자료와 가능성","p":"자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다."},{"교":"수학","c":"4수04-03","과":"수학","학":"초3~4","영":"자료와 가능성","p":"탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다.","h":["여러 가지 문제를 해결하기 위해 자료를 수집, 정리하고 그래프로 나타내어 해석하는 일련의 과정을 직접 경험하게 한다. 자료의 크기를 비교할 때는 막대그래프로, 시간에 따른 변화의 경향을 알아볼 때는 꺾은선그래프로 나타내는 것이 편리함을 알고, 자료의 특성에 따라 목적에 맞는 적절한 그래프를 선택하게 한다."]},{"교":"수학","c":"6수01-01","과":"수학","학":"초5~6","영":"수와 연산","p":"덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다."},{"교":"수학","c":"6수01-02","과":"수학","학":"초5~6","영":"수와 연산","p":"실생활과 연결하여 이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 이를 활용하여 수의 범위를 나타낼 수 있다."},{"교":"수학","c":"6수01-03","과":"수학","학":"초5~6","영":"수와 연산","p":"어림값을 구하기 위한 방법으로 올림, 버림, 반올림의 의미와 필요성을 알고, 이를 실생활에 활용함으로써 수학의 유용성을 인식할 수 있다."},{"교":"수학","c":"6수01-04","과":"수학","학":"초5~6","영":"수와 연산","p":"약수, 공약수, 최대공약수를 이해하고 구할 수 있다."},{"교":"수학","c":"6수01-05","과":"수학","학":"초5~6","영":"수와 연산","p":"배수, 공배수, 최소공배수를 이해하고 구할 수 있다."},{"교":"수학","c":"6수01-06","과":"수학","학":"초5~6","영":"수와 연산","p":"크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다."},{"교":"수학","c":"6수01-07","과":"수학","학":"초5~6","영":"수와 연산","p":"분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다."},{"교":"수학","c":"6수01-08","과":"수학","학":"초5~6","영":"수와 연산","p":"분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"교":"수학","c":"6수01-09","과":"수학","학":"초5~6","영":"수와 연산","p":"분수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"교":"수학","c":"6수01-10","과":"수학","학":"초5~6","영":"수와 연산","p":"‘(자연수)÷(자연수)’에서 나눗셈의 몫을 분수로 나타낼 수 있다."},{"교":"수학","c":"6수01-11","과":"수학","학":"초5~6","영":"수와 연산","p":"분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","h":["분수의 나눗셈은 ‘(분수)÷(자연수)’, ‘(자연수)÷(분수)’, ‘(분수)÷(분수)’를 다룬다."]},{"교":"수학","c":"6수01-12","과":"수학","학":"초5~6","영":"수와 연산","p":"분수와 소수의 관계를 이해하고 크기를 비교하며 그 방법을 설명할 수 있다."},{"교":"수학","c":"6수01-13","과":"수학","학":"초5~6","영":"수와 연산","p":"소수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"교":"수학","c":"6수01-14","과":"수학","학":"초5~6","영":"수와 연산","p":"‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다."},{"교":"수학","c":"6수01-15","과":"수학","학":"초5~6","영":"수와 연산","p":"소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","h":["소수의 나눗셈은 ‘(소수)÷(자연수)’, ‘(자연수)÷(소수)’, ‘(소수)÷(소수)’를 다룬다."]},{"교":"수학","c":"6수02-01","과":"수학","학":"초5~6","영":"변화와 관계","p":"한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다."},{"교":"수학","c":"6수02-02","과":"수학","학":"초5~6","영":"변화와 관계","p":"두 양의 크기를 비교하는 상황을 통해 비의 개념을 이해하고, 두 양의 관계를 비로 나타낼 수 있다.","h":["두 양을 비교할 때는 한 양을 기준으로 다른 양이 몇 배가 되는지를 나타낼 필요성을 인식하면서 비의 개념을 이해하게 한다."]},{"교":"수학","c":"6수02-03","과":"수학","학":"초5~6","영":"변화와 관계","p":"비율을 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다."},{"교":"수학","c":"6수02-04","과":"수학","학":"초5~6","영":"변화와 관계","p":"비례식을 알고, 그 성질을 이해하며, 이를 활용하여 간단한 비례식을 풀 수 있다."},{"교":"수학","c":"6수02-05","과":"수학","학":"초5~6","영":"변화와 관계","p":"비례배분을 알고, 주어진 양을 비례배분 할 수 있다."},{"교":"수학","c":"6수03-01","과":"수학","학":"초5~6","영":"도형과 측정","p":"도형의 합동을 이해하고, 합동인 도형의 성질을 탐구하고 설명할 수 있다.","h":["합동인 두 도형에서 대응점, 대응변, 대응각을 각각 찾게 하고 대응변의 길이와 대응각의 크기를 비교하는 활동을 통해 합동인 도형의 성질을 탐구하고 설명하게 한다."]},{"교":"수학","c":"6수03-02","과":"수학","학":"초5~6","영":"도형과 측정","p":"실생활과 연결하여 선대칭도형과 점대칭도형을 이해하고 그릴 수 있다."},{"교":"수학","c":"6수03-03","과":"수학","학":"초5~6","영":"도형과 측정","p":"직육면체와 정육면체를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"교":"수학","c":"6수03-04","과":"수학","학":"초5~6","영":"도형과 측정","p":"직육면체와 정육면체의 겨냥도와 전개도를 그릴 수 있다."},{"교":"수학","c":"6수03-05","과":"수학","학":"초5~6","영":"도형과 측정","p":"각기둥과 각뿔을 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"교":"수학","c":"6수03-06","과":"수학","학":"초5~6","영":"도형과 측정","p":"각기둥의 전개도를 그릴 수 있다."},{"교":"수학","c":"6수03-07","과":"수학","학":"초5~6","영":"도형과 측정","p":"원기둥, 원뿔, 구를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"교":"수학","c":"6수03-08","과":"수학","학":"초5~6","영":"도형과 측정","p":"원기둥의 전개도를 그릴 수 있다."},{"교":"수학","c":"6수03-09","과":"수학","학":"초5~6","영":"도형과 측정","p":"쌓기나무로 만든 입체도형을 보고 사용된 쌓기나무의 개수를 구할 수 있다."},{"교":"수학","c":"6수03-10","과":"수학","학":"초5~6","영":"도형과 측정","p":"쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다.","h":["여러 가지 물체, 건축물, 예술품, 쌓기나무로 만든 입체도형 등의 위, 앞, 옆에서 본 모양을 이용해서 전체 모양을 추측하게 하고, 이에 대해 자신의 추론 과정을 설명하게 한다."]},{"교":"수학","c":"6수03-11","과":"수학","학":"초5~6","영":"도형과 측정","p":"평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다."},{"교":"수학","c":"6수03-12","과":"수학","학":"초5~6","영":"도형과 측정","p":"넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다."},{"교":"수학","c":"6수03-13","과":"수학","학":"초5~6","영":"도형과 측정","p":"직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"교":"수학","c":"6수03-14","과":"수학","학":"초5~6","영":"도형과 측정","p":"평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다."},{"교":"수학","c":"6수03-15","과":"수학","학":"초5~6","영":"도형과 측정","p":"여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여, 원주율이 일정한 값임을 알고 그 근삿값을 사용할 수 있다.","h":["여러 가지 원에서 (원주)÷(지름)의 값을 구하여 모든 원에서 원주율이 일정함을 이해하게 하고, 원주율의 근삿값으로 3.14를 사용하게 한다."]},{"교":"수학","c":"6수03-16","과":"수학","학":"초5~6","영":"도형과 측정","p":"원주와 원의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다.","h":["지름과 원주율을 이용하면 원주를 직접 측정하지 않고도 구할 수 있음을 알게 하고, 직사각형의 넓이를 구하는 방법을 이용하여 원의 넓이를 구하는 방법을 이해하게 한다."]},{"교":"수학","c":"6수03-17","과":"수학","학":"초5~6","영":"도형과 측정","p":"직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"교":"수학","c":"6수03-18","과":"수학","학":"초5~6","영":"도형과 측정","p":"부피 단위 1cm³, 1m³를 알며, 그 관계를 이해한다."},{"교":"수학","c":"6수03-19","과":"수학","학":"초5~6","영":"도형과 측정","p":"직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"교":"수학","c":"6수04-01","과":"수학","학":"초5~6","영":"자료와 가능성","p":"평균의 의미를 알고, 자료를 수집하여 평균을 구하고 해석할 수 있다.","h":["평균은 집단의 자료를 대표하는 값임을 이해하고, 여러 집단의 평균을 비교하는 활동을 통해 수학의 유용성을 인식하게 한다."]},{"교":"수학","c":"6수04-02","과":"수학","학":"초5~6","영":"자료와 가능성","p":"자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다."},{"교":"수학","c":"6수04-03","과":"수학","학":"초5~6","영":"자료와 가능성","p":"탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다.","h":["해결하고자 하는 문제를 설정하고 그에 맞는 자료를 수집, 정리하여, 막대그래프, 꺾은선그래프, 띠그래프와 원그래프 중 적절한 그래프로 나타내고 해석하는 일련의 과정을 직접 경험하게 한다."]},{"교":"수학","c":"6수04-04","과":"수학","학":"초5~6","영":"자료와 가능성","p":"사건이 일어날 가능성을 말로 표현하고 비교할 수 있다.","h":["‘확실하다’, ‘불가능하다’, ‘∼일 것 같다’, ‘∼아닐 것 같다’, ‘반반이다’ 등 일상에서 사건이 일어날 가능성을 나타내는 다양한 표현을 이해하고, 가능성의 크기를 비교하게 한다."]},{"교":"수학","c":"6수04-05","과":"수학","학":"초5~6","영":"자료와 가능성","p":"사건이 일어날 가능성을 수로 나타낼 수 있다.","h":["가능성이 직관적으로 파악되는 생활 속의 간단한 사건에 대하여 그 가능성을 0, ${1} over {2}$, 1 등과 같은 수로 표현하게 한다. 사건이 일어날 가능성과 일어나지 않을 가능성이 같은 경우에 사건이 일어날 가능성을 ${1} over {2}$로 표현할 수 있음을 이해하게 한다."]},{"교":"수학","c":"6수04-06","과":"수학","학":"초5~6","영":"자료와 가능성","p":"자료를 이용하여 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다.","h":["제비뽑기, 동전 던지기, 주사위 던지기, 회전판 돌리기 등과 같은 간단한 실험 결과를 나타낸 표나 그래프를 보고 사건이 일어날 가능성을 비교하고 대략적으로 예상하게 한다."]},{"교":"수학","c":"9수01-01","과":"수학","학":"중1~3","영":"수와 연산","p":"소인수분해의 뜻을 알고, 자연수를 소인수분해 할 수 있다."},{"교":"수학","c":"9수01-02","과":"수학","학":"중1~3","영":"수와 연산","p":"소인수분해를 이용하여 최대공약수와 최소공배수를 구할 수 있다.","h":["초등학교에서 학습한 최대공약수와 최소공배수의 개념을 바탕으로 소인수분해를 이용하여 최대공약수와 최소공배수를 구하게 한다. 최대공약수와 최소공배수는 자연수의 소인수분해를 이용하는 범위에서 다루고, 최대공약수와 최소공배수의 활용 문제는 다루지 않는다."]},{"교":"수학","c":"9수01-03","과":"수학","학":"중1~3","영":"수와 연산","p":"다양한 상황을 이용하여 음수의 필요성을 인식하고, 양수와 음수, 정수와 유리수의 개념을 이해한다."},{"교":"수학","c":"9수01-04","과":"수학","학":"중1~3","영":"수와 연산","p":"정수와 유리수의 대소 관계를 판단할 수 있다."},{"교":"수학","c":"9수01-05","과":"수학","학":"중1~3","영":"수와 연산","p":"정수와 유리수의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다.","h":["정수의 사칙계산의 원리는 여러 가지 모델을 이용하여 직관적으로 이해하게 하고, 실생활에서 사칙계산의 유용성을 인식하게 한다."]},{"교":"수학","c":"9수01-06","과":"수학","학":"중1~3","영":"수와 연산","p":"순환소수의 뜻을 알고, 유리수와 순환소수의 관계를 설명할 수 있다.","h":["순환소수를 분수로 고치는 것은 순환소수가 유리수임을 이해할 수 있는 정도로 다룬다. 유한소수를 순환소수로 나타내는 것은 다루지 않는다."]},{"교":"수학","c":"9수01-07","과":"수학","학":"중1~3","영":"수와 연산","p":"제곱근의 뜻과 성질을 알고, 제곱근의 대소 관계를 판단할 수 있다."},{"교":"수학","c":"9수01-08","과":"수학","학":"중1~3","영":"수와 연산","p":"무리수의 개념을 이해하고, 무리수의 유용성을 인식할 수 있다.","h":["실생활에서 사용되는 무리수의 예를 찾아보는 활동을 통해 무리수의 필요성과 유용성을 인식하게 한다. 실수는 유리수와 무리수로 이루어짐을 이해하게 하고, 수 체계의 논리적인 아름다움에 관심을 갖게 한다."]},{"교":"수학","c":"9수01-09","과":"수학","학":"중1~3","영":"수와 연산","p":"실수의 대소 관계를 판단하고 설명할 수 있다."},{"교":"수학","c":"9수01-10","과":"수학","학":"중1~3","영":"수와 연산","p":"근호를 포함한 식의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다."},{"교":"수학","c":"9수02-01","과":"수학","학":"중1~3","영":"변화와 관계","p":"다양한 상황을 문자를 사용한 식으로 나타내어 그 유용성을 인식하고, 식의 값을 구할 수 있다."},{"교":"수학","c":"9수02-02","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"교":"수학","c":"9수02-03","과":"수학","학":"중1~3","영":"변화와 관계","p":"방정식과 그 해의 뜻을 알고, 등식의 성질을 설명할 수 있다."},{"교":"수학","c":"9수02-04","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"9수02-05","과":"수학","학":"중1~3","영":"변화와 관계","p":"순서쌍과 좌표를 이해하고, 그 편리함을 인식할 수 있다.","h":["실생활에서 좌표가 사용되는 예를 찾아보고 이를 수직선과 좌표평면 위에 표현해 보며, 그 유용성과 편리함을 인식하게 한다."]},{"교":"수학","c":"9수02-06","과":"수학","학":"중1~3","영":"변화와 관계","p":"다양한 상황을 그래프로 나타내고, 주어진 그래프를 해석할 수 있다.","h":["다양한 상황을 그래프로 나타내어 증가와 감소, 주기적 변화 등 변화 상태를 쉽게 파악할 수 있게 한다. 주어진 그래프를 해석하여 그래프가 나타내는 상황을 설명하게 함으로써 그래프의 유용성을 인식하게 한다."]},{"교":"수학","c":"9수02-07","과":"수학","학":"중1~3","영":"변화와 관계","p":"정비례, 반비례 관계를 이해하고, 그 관계를 표, 식, 그래프로 나타낼 수 있다.","h":["속력과 거리, 속력과 시간과 같은 실생활의 예를 통해 정비례와 반비례 관계를 직관적으로 이해하게 하고, 정비례와 반비례 관계가 성립하는 실생활의 예를 찾아 설명하게 한다."]},{"교":"수학","c":"9수02-08","과":"수학","학":"중1~3","영":"변화와 관계","p":"지수법칙을 이해하고, 이를 이용하여 식을 간단히 할 수 있다.","h":["지수법칙은 지수가 자연수인 범위에서 단항식의 곱셈과 나눗셈을 하는 데 필요한 정도로 다룬다."]},{"교":"수학","c":"9수02-09","과":"수학","학":"중1~3","영":"변화와 관계","p":"다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"교":"수학","c":"9수02-10","과":"수학","학":"중1~3","영":"변화와 관계","p":"‘(단항식)×(다항식)’, ‘(다항식)÷(단항식)’과 같은 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다.","h":["다항식의 나눗셈에서는 다항식을 단항식으로 나누어 그 몫이 다항식이 되는 경우만 다룬다."]},{"교":"수학","c":"9수02-11","과":"수학","학":"중1~3","영":"변화와 관계","p":"부등식과 그 해의 뜻을 알고, 부등식의 성질을 설명할 수 있다."},{"교":"수학","c":"9수02-12","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차부등식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"9수02-13","과":"수학","학":"중1~3","영":"변화와 관계","p":"미지수가 2개인 연립일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"9수02-14","과":"수학","학":"중1~3","영":"변화와 관계","p":"함수의 개념을 이해하고, 함숫값을 구할 수 있다."},{"교":"수학","c":"9수02-15","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차함수의 개념을 이해하고, 그 그래프를 그릴 수 있다."},{"교":"수학","c":"9수02-16","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차함수의 그래프의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"9수02-17","과":"수학","학":"중1~3","영":"변화와 관계","p":"일차함수와 미지수가 2개인 일차방정식의 관계를 설명할 수 있다."},{"교":"수학","c":"9수02-18","과":"수학","학":"중1~3","영":"변화와 관계","p":"두 일차함수의 그래프와 연립일차방정식의 관계를 설명할 수 있다."},{"교":"수학","c":"9수02-19","과":"수학","학":"중1~3","영":"변화와 관계","p":"다항식의 곱셈과 인수분해를 할 수 있다.","h":["다항식의 곱셈과 다항식의 인수분해의 역관계를 이해하고, 이와 유사한 관계를 찾아보는 활동을 하게 한다. 다항식의 곱셈과 인수분해는 다음의 경우를 다룬다.  $m(a+b)`=`ma+mb$  $(a+b) ^{2} =a ^{2} +2ab+b ^{2}$  $(a-b) ^{2} =a ^{2} -2ab+b ^{2}$  $(a+b)(a-b)=a ^{2} -b ^{2}$  $(x+a)(x+b)=x ^{2} +(a+b)x+ab$  $(ax+b)(cx+d)=acx ^{2} +(ad+bc)x+bd$"]},{"교":"수학","c":"9수02-20","과":"수학","학":"중1~3","영":"변화와 관계","p":"이차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"9수02-21","과":"수학","학":"중1~3","영":"변화와 관계","p":"이차함수의 개념을 이해한다."},{"교":"수학","c":"9수02-22","과":"수학","학":"중1~3","영":"변화와 관계","p":"이차함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다.","h":["이차함수 $y=f(x)$에서 최댓값과 최솟값은 $x$의 범위가 실수 전체인 경우만 다룬다."]},{"교":"수학","c":"9수03-01","과":"수학","학":"중1~3","영":"도형과 측정","p":"점, 선, 면, 각을 이해하고, 실생활 상황과 연결하여 점, 직선, 평면의 위치 관계를 설명할 수 있다.","h":["점, 선, 면, 각과 관련된 용어는 다양한 상황에서 직관적으로 이해하게 한다."]},{"교":"수학","c":"9수03-02","과":"수학","학":"중1~3","영":"도형과 측정","p":"평행선에서 동위각과 엇각의 성질을 이해하고 설명할 수 있다."},{"교":"수학","c":"9수03-03","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각형을 작도하고, 그 과정을 설명할 수 있다.","h":["주어진 삼각형과 합동인 삼각형을 작도하는 활동을 하고, 자신의 방법을 설명하게 한다."]},{"교":"수학","c":"9수03-04","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각형의 합동 조건을 이해하고, 이를 이용하여 두 삼각형이 합동인지 판별할 수 있다."},{"교":"수학","c":"9수03-05","과":"수학","학":"중1~3","영":"도형과 측정","p":"다각형의 성질을 이해하고 설명할 수 있다.","h":["삼각형의 내각과 외각의 크기, 다각형의 내각과 외각의 크기의 합, 다각형의 대각선의 개수를 구하는 과정을 탐구하여 다각형의 성질을 추측하고 일반화할 수 있게 한다."]},{"교":"수학","c":"9수03-06","과":"수학","학":"중1~3","영":"도형과 측정","p":"부채꼴의 중심각과 호의 관계를 이해하고, 이를 이용하여 부채꼴의 호의 길이와 넓이를 구할 수 있다."},{"교":"수학","c":"9수03-07","과":"수학","학":"중1~3","영":"도형과 측정","p":"구체적인 모형이나 공학 도구를 이용하여 다면체와 회전체의 성질을 탐구하고, 이를 설명할 수 있다.","h":["구체적인 사물, 전개도, 교구, 컴퓨터 프로그램 등을 이용하여 다면체와 회전체를 관찰하고 그 성질을 탐구하게 한다. 회전체 단면의 모양은 회전체의 성질을 이해하는 데 필요한 정도로 다룬다."]},{"교":"수학","c":"9수03-08","과":"수학","학":"중1~3","영":"도형과 측정","p":"입체도형의 겉넓이와 부피를 구할 수 있다."},{"교":"수학","c":"9수03-09","과":"수학","학":"중1~3","영":"도형과 측정","p":"이등변삼각형의 성질을 이해하고 정당화할 수 있다.","h":["종이접기, 작도, 공학 도구 등을 이용하여 이등변삼각형의 성질을 추측하게 하고, 그 성질을 삼각형의 합동 조건을 이용하여 정당화할 수 있게 한다. 이때, 증명이라는 용어를 도입하고, 그 필요성을 인식하게 한다."]},{"교":"수학","c":"9수03-10","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각형의 외심과 내심의 성질을 이해하고 정당화할 수 있다."},{"교":"수학","c":"9수03-11","과":"수학","학":"중1~3","영":"도형과 측정","p":"사각형의 성질을 이해하고 정당화할 수 있다.","h":["사각형의 성질은 대각선에 관한 성질을 위주로 다룬다. 여러 가지 사각형의 성질을 통해 사각형 사이의 관계를 설명하게 한다."]},{"교":"수학","c":"9수03-12","과":"수학","학":"중1~3","영":"도형과 측정","p":"도형의 닮음의 뜻과 닮은 도형의 성질을 이해하고, 닮음비를 구할 수 있다."},{"교":"수학","c":"9수03-13","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각형의 닮음 조건을 이해하고, 이를 이용하여 두 삼각형이 닮음인지 판별할 수 있다."},{"교":"수학","c":"9수03-14","과":"수학","학":"중1~3","영":"도형과 측정","p":"평행선 사이의 선분의 길이의 비를 구할 수 있다."},{"교":"수학","c":"9수03-15","과":"수학","학":"중1~3","영":"도형과 측정","p":"피타고라스 정리를 이해하고 정당화할 수 있다.","h":["피타고라스 정리는 다양한 활동을 통하여 추측하고 정당화할 수 있게 한다. 피타고라스 정리의 역은 직관적으로 이해하게 하고, 이를 이용하여 세 변의 길이가 주어진 삼각형이 직각삼각형인지 판별하게 한다."]},{"교":"수학","c":"9수03-16","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각비의 뜻을 알고, 간단한 삼각비의 값을 구할 수 있다."},{"교":"수학","c":"9수03-17","과":"수학","학":"중1~3","영":"도형과 측정","p":"삼각비를 활용하여 여러 가지 문제를 해결할 수 있다.","h":["삼각비를 활용하여 직접 측정하기 어려운 거리나 높이 등을 구해 보는 활동을 통해 유용성을 인식하고 흥미를 느낄 수 있게 한다."]},{"교":"수학","c":"9수03-18","과":"수학","학":"중1~3","영":"도형과 측정","p":"원의 현에 관한 성질과 접선에 관한 성질을 이해하고 정당화할 수 있다."},{"교":"수학","c":"9수03-19","과":"수학","학":"중1~3","영":"도형과 측정","p":"원주각의 성질을 이해하고 정당화할 수 있다."},{"교":"수학","c":"9수04-01","과":"수학","학":"중1~3","영":"자료와 가능성","p":"중앙값, 최빈값의 뜻을 알고, 자료의 특성에 따라 적절한 대푯값을 선택하여 구할 수 있다.","h":["대푯값에는 초등학교에서 학습한 평균 이외에도 중앙값, 최빈값이 있음을 알고 그 필요성을 인식하게 한다. 자료의 특성에 따라 적절한 대푯값을 선택하여 구해 보고, 각 대푯값이 어떤 상황에서 유용하게 사용될 수 있는지 토론하게 한다."]},{"교":"수학","c":"9수04-02","과":"수학","학":"중1~3","영":"자료와 가능성","p":"자료를 줄기와 잎 그림, 도수분포표, 히스토그램, 도수분포다각형으로 나타내고 해석할 수 있다."},{"교":"수학","c":"9수04-03","과":"수학","학":"중1~3","영":"자료와 가능성","p":"상대도수를 구하고, 상대도수의 분포를 표나 그래프로 나타내고 해석할 수 있다.","h":["상대도수는 도수의 총합이 다른 두 집단의 분포를 비교하는 상황에서 간단히 다루고, 상대도수의 필요성과 유용성을 인식하게 한다."]},{"교":"수학","c":"9수04-04","과":"수학","학":"중1~3","영":"자료와 가능성","p":"통계적 탐구 문제를 설정하고, 공학 도구를 이용하여 자료를 수집하여 분석하고, 그 결과를 해석할 수 있다.","h":["다양한 맥락에서 해결하고자 하는 통계적 탐구 문제를 설정하고 적절한 계획을 세워 자료를 수집하게 한다. 수집한 자료를 자료의 특성과 목적에 맞게 표, 그래프, 수치 등으로 나타내어 분석하고, 그 결과를 탐구 문제와 연결하여 해석하게 한다. 자료를 수집하고 분석할 때는 인터넷 검색, 웹 기반 소프트웨어, 통계 프로그램 등을 활용하게 한다. 수집한 자료나 분석 결과가 적절한지 판단하여 계획을 수정하고, 통계적 근거를 바탕으로 토론하는 등 통계적 문제해결 과정에 주도적으로 참여하게 한다."]},{"교":"수학","c":"9수04-05","과":"수학","학":"중1~3","영":"자료와 가능성","p":"경우의 수를 구할 수 있다.","h":["경우의 수는 두 경우의 수를 합하거나 곱하는 경우 정도로만 다루고, 순열과 조합을 이용하면 쉽게 해결되는 등의 복잡한 경우의 수를 구하는 문제는 다루지 않는다."]},{"교":"수학","c":"9수04-06","과":"수학","학":"중1~3","영":"자료와 가능성","p":"확률의 개념과 그 기본 성질을 이해하고, 확률을 구할 수 있다.","h":["확률은 실험이나 관찰을 통해 구한 상대도수로서의 의미와 경우의 수의 비율로서의 의미를 연결하여 이해하게 한다. 경우의 수의 비율로 확률을 다룰 때, 각 경우가 발생할 가능성이 동등하다는 것을 가정한다는 점에 유의하게 한다."]},{"교":"수학","c":"9수04-07","과":"수학","학":"중1~3","영":"자료와 가능성","p":"분산과 표준편차를 구하고 자료의 분포를 설명할 수 있다."},{"교":"수학","c":"9수04-08","과":"수학","학":"중1~3","영":"자료와 가능성","p":"공학 도구를 이용하여 자료를 상자그림으로 나타내고 분포를 비교할 수 있다.","h":["상자그림을 다룰 때는 두 집단의 분포를 비교하고 해석하는 활동에 중점을 두고, 이를 통해 상자그림의 유용성을 인식하게 한다."]},{"교":"수학","c":"9수04-09","과":"수학","학":"중1~3","영":"자료와 가능성","p":"자료를 산점도로 나타내고 상관관계를 말할 수 있다.","h":["상관관계는 양의 상관관계, 음의 상관관계, 상관관계가 없는 경우로 구분하여 다룬다."]},{"교":"수학","c":"10공수1-01-01","과":"공통수학1","학":"고1","영":"다항식","p":"다항식의 사칙연산의 원리를 설명하고, 그 계산을 할 수 있다."},{"교":"수학","c":"10공수1-01-02","과":"공통수학1","학":"고1","영":"다항식","p":"항등식의 성질과 나머지정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"교":"수학","c":"10공수1-01-03","과":"공통수학1","학":"고1","영":"다항식","p":"다항식의 인수분해를 할 수 있다.","h":["다항식의 인수분해는 다음의 경우를 다룬다. $a^ 2 + b^2 + c^2 + 2 ab + 2 bc + 2ca = ( a + b + c )^2$ $a^3 + 3a^2 b + 3 a b^2 + b^3 = (a + b )^3$ $a^3 - 3a^2 b + 3 a b^2 - b^3 = (a - b )^3$ $a^3 + b^3 = ( a + b ) ( a^2 - ab + b^2 )$ $a^3 - b^3 = ( a - b ) ( a^2 + ab + b^2 )$"]},{"교":"수학","c":"10공수1-02-01","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"복소수의 뜻과 성질을 설명하고, 사칙연산을 수행할 수 있다."},{"교":"수학","c":"10공수1-02-02","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차방정식의 실근과 허근을 이해하고, 판별식을 이용하여 이차방정식의 근을 판별할 수 있다.","h":["이차방정식은 계수가 실수인 경우만 다루고, 이차방정식은 복소수 범위에서 항상 근을 갖는다는 것을 이해하게 한다."]},{"교":"수학","c":"10공수1-02-03","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차방정식의 근과 계수의 관계를 설명할 수 있다."},{"교":"수학","c":"10공수1-02-04","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차방정식과 이차함수를 연결하여 그 관계를 설명할 수 있다."},{"교":"수학","c":"10공수1-02-05","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차함수의 그래프와 직선의 위치 관계를 판단할 수 있다."},{"교":"수학","c":"10공수1-02-06","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"이차함수의 최대, 최소를 탐구하고, 이를 실생활과 연결하여 유용성을 인식할 수 있다.","h":["이차함수의 최대, 최소는 제한된 범위에서만 다룬다."]},{"교":"수학","c":"10공수1-02-07","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"간단한 삼차방정식과 사차방정식을 풀 수 있다.","h":["삼차방정식과 사차방정식은 계수가 실수인 경우만 다루고, 인수분해 공식이나 인수정리, 조립제법을 이용하여 풀 수 있는 경우만을 다룬다."]},{"교":"수학","c":"10공수1-02-08","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"미지수가 2개인 연립이차방정식을 풀 수 있다.","h":["미지수가 2개인 연립이차방정식은 일차식과 이차식이 각각 한 개씩 주어진 경우, 두 이차식 중 한 이차식이 간단히 인수분해 되는 경우만 다룬다."]},{"교":"수학","c":"10공수1-02-09","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"미지수가 1개인 연립일차부등식을 풀 수 있다."},{"교":"수학","c":"10공수1-02-10","과":"공통수학1","학":"고1","영":"방정식과 부등식","p":"절댓값을 포함한 일차부등식을 풀 수 있다."},{"교":"수학","c":"10공
