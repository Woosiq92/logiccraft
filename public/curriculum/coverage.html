<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육과정 커버리지 계기판</title>
<style>
  :root {
    --ink: #14171c; --dim: #5d6570; --line: #e3e6ea; --bg: #fbfcfd; --card: #fff;
    /* 쉼표 형태로 둔다. rgba(20 92 168, .6) 처럼 섞어 쓰면 선언이 통째로 무시되고
       배경이 안 칠해진 채 글자만 흰색이 되어 숫자가 사라진다. */
    --fill: 20, 92, 168; --warn: #b4341f; --warnbg: #fdf3f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 80px; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
  h2 { font-size: 16px; margin: 40px 0 12px; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 13.5px; margin: 0 0 26px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card {
    flex: 1 1 240px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .n { font-size: 30px; font-weight: 650; letter-spacing: -.03em; }
  .card .n small { font-size: 15px; font-weight: 400; color: var(--dim); }
  .card .l { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: #eef1f4; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: rgb(var(--fill)); }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-weight: 550; color: var(--dim); font-size: 12.5px; background: #f7f9fb; }
  th.sub, td.sub { text-align: left; font-weight: 550; color: var(--ink); position: sticky; left: 0; background: var(--card); }
  th.sub { background: #f7f9fb; }
  td.cell { cursor: pointer; font-variant-numeric: tabular-nums; }
  td.cell:hover { outline: 2px solid rgb(var(--fill)); outline-offset: -2px; }
  td.zero { color: #aab2bb; }
  td.none { color: #d3d8de; cursor: default; }
  .split { border-left: 2px solid #cfd6de; }
  /* 진한 칸에서는 글자가 흰색이 된다. 고정색을 주면 그때 대비가 무너진다 */
  .pct { font-size: 11px; color: inherit; opacity: .62; display: block; }
  #detail {
    margin-top: 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); padding: 16px 18px; display: none;
  }
  #detail.on { display: block; }
  #detail h3 { margin: 0 0 4px; font-size: 15px; }
  #detail .meta { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  ul.gaps { margin: 0; padding-left: 0; list-style: none; }
  ul.gaps li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  ul.gaps code { color: rgb(var(--fill)); font-weight: 600; font-size: 12.5px; margin-right: 8px; }
  .warn { border: 1px solid #f0d3cd; background: var(--warnbg); border-radius: 12px; padding: 16px 18px; }
  .warn h3 { margin: 0 0 6px; font-size: 14.5px; color: var(--warn); }
  .warn p, .warn li { font-size: 13.5px; }
  .rule { font-size: 13px; color: var(--dim); }
  .rule li { margin: 4px 0; }
  details { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px 16px; margin-top: 10px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 550; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
</style>
</head>

해하고, 이들 간의 상호 관계를 권력 분립의 원리에 기초하여 분석한다."}, {"code": "12정치03-04", "과목": "정치", "진술문": "중앙 정부와의 관계 속에서 지방 자치의 의의를 이해하고, 우리나라 지방 자치의 현실과 과제를 탐구한다."}, {"code": "12정치04-01", "과목": "정치", "진술문": "국제 사회의 특징과 변화 과정을 이해하고 국제 정치를 바라보는 관점을 비교하여 분석한다."}, {"code": "12정치04-02", "과목": "정치", "진술문": "다양한 국제 문제의 원인을 분석하고, 이를 해결하기 위해 국가를 비롯한 여러 주체가 수행하는 활동을 분석한다."}, {"code": "12정치04-03", "과목": "정치", "진술문": "우리나라를 둘러싼 국제 관계를 이해하고, 외교적 관점에서 한반도를 둘러싼 국제 질서를 분석한다."}, {"code": "12정치04-04", "과목": "정치", "진술문": "국제 사회에서 발생하는 다양한 갈등의 원인을 분석하고 세계시민으로서 갈등을 해결하는 자세를 갖는다."}, {"code": "12법사01-01", "과목": "법과 사회", "진술문": "가족관계와 관련된 기본적인 내용인 혼인, 출생, 상속 등을 이해하고, 이를 일상생활의 사례에 적용한다."}, {"code": "12법사01-02", "과목": "법과 사회", "진술문": "채권 관계와 관련된 기본적인 내용인 계약, 불법행위 등과 사적 자치를 이해하고, 이를 일상생활의 사례에 적용한다."}, {"code": "12법사01-03", "과목": "법과 사회", "진술문": "물권 관계와 관련된 기본적인 내용인 부동산⋅동산에 관한 권리의 기능과 특징, 권리와 의무로 구성되는 법(률)관계를 이해하고, 이를 일상생활의 사례에 적용하여 법적 문제를 해결한다."}, {"code": "12법사02-01", "과목": "법과 사회", "진술문": "민주주의와 법치주의의 발전 과정을 이해하고, 우리나라 권력 분립의 원리를 탐구한다."}, {"code": "12법사02-02", "과목": "법과 사회", "진술문": "우리나라 헌법의 기본 원리와 기본권 내용을 이해하고, 기본권 제한의 요건과 한계를 탐구한다."}, {"code": "12법사02-03", "과목": "법과 사회", "진술문": "형법의 의의와 기능을 죄형 법정주의를 중심으로 이해하고, 범죄의 성립 요건과 형벌의 종류, 형사 절차를 탐구한다."}, {"code": "12법사02-04", "과목": "법과 사회", "진술문": "법원과 헌법재판소의 법적 문제 해결 과정을 탐구하고, 사법의 의미와 한계를 인식하여 입법론적 해결이 필요한 경우를 탐구한다."}, {"code": "12법사03-01", "과목": "법과 사회", "진술문": "법으로 보장되는 근로자의 권리를 이해하고, 이를 일상생활의 사례에 적용한다."}, {"code": "12법사03-02", "과목": "법과 사회", "진술문": "인간다운 생활을 보장하려는 사회보장과 경쟁 및 소비자를 보호하기 위한 법적 근거를 탐구하고, 구체적인 사례에서 공공 쟁점을 찾아 토론한다."}, {"code": "12법사03-03", "과목": "법과 사회", "진술문": "현대적 법(률)관계의 특징과 지적 재산권의 의미를 이해하고, 이와 관련된 일상생활에서의 사례를 찾아보고 관련 쟁점을 토론한다."}, {"code": "12법사04-01", "과목": "법과 사회", "진술문": "학생과 청소년이 누릴 수 있는 권리와 의무를 이해하고, 이를 학교와 일상생활의 사례에 적용한다."}, {"code": "12법사04-02", "과목": "법과 사회", "진술문": "학교폭력의 해결 과정을 살펴보며, 학교생활에서 발생하였거나 발생할 수 있는 법적 문제를 발견하고 그 해결 방안을 탐구한다."}, {"code": "12법사04-03", "과목": "법과 사회", "진술문": "법적 문제를 해결하는데 필요한 법, 조약, 판례, 입법자료 등을 찾아보고, 민주시민으로서 나와 사회가 당면한 사회적 논의에 참여하는 태도를 가진다."}, {"code": "12경제01-01", "과목": "경제", "진술문": "인간 생활에서 자원의 희소성으로 인해 발생하는 경제 문제의 중요성을 인식하고, 경제학의 분석 대상과 성격을 이해한다."}, {"code": "12경제01-02", "과목": "경제", "진술문": "경제 문제를 해결하는 다양한 방식의 장단점을 비교하고, 시장경제의 기본 원리와 이를 뒷받침하는 제도를 파악한다."}, {"code": "12경제01-03", "과목": "경제", "진술문": "인간은 경제적 유인에 반응함을 인식하고, 편익과 비용을 고려하여 합리적으로 선택하는 능력과 한계 분석을 이용한 의사 결정 능력을 계발한다."}, {"code": "12경제02-01", "과목": "경제", "진술문": "수요와 공급에 의한 시장 균형의 결정과 변동 원리를 파악하고, 이를 다양한 시장에 적용한다."}, {"code": "12경제02-02", "과목": "경제", "진술문": "정부를 비롯한 공공 부문의 경제적 역할을 이해하고, 조세, 공공재 등과 같이 시장의 자원 배분에 개입하는 사례를 탐구한다."}, {"code": "12경제02-03", "과목": "경제", "진술문": "시장 기능과 공공 부문의 활동을 비교하고, 자원 배분의 효율성과 형평성에 미치는 영향을 평가한다."}, {"code": "12경제03-01", "과목": "경제", "진술문": "여러 가지 거시 경제 변수를 탐색하고, 국가 경제 전반의 활동 수준을 파악한다."}, {"code": "12경제03-02", "과목": "경제", "진술문": "경제 성장의 의미와 요인을 이해하고, 한국 경제의 변화와 경제적 성과를 균형 있는 시각에서 평가한다."}, {"code": "12경제03-03", "과목": "경제", "진술문": "경기 변동의 의미와 요인을 이해하고, 경기 안정화 방안으로 재정 정책과 통화 정책을 분석한다."}, {"code": "12경제04-01", "과목": "경제", "진술문": "개방된 국제 사회에서 국제 거래를 파악하고, 국가 간 상호 의존성이 증대하고 있음을 이해한다."}, {"code": "12경제04-02", "과목": "경제", "진술문": "비교 우위에 따른 특화와 교역을 중심으로 무역 원리를 이해하고, 자유 무역과 보호 무역 정책의 경제적 효과를 설명한다."}, {"code": "12경제04-03", "과목": "경제", "진술문": "외환 시장에서 환율의 결정 원리를 이해하고, 환율 변동이 국가 경제와 개인의 경제생활에 미치는 영향을 탐구한다."}, {"code": "12국관01-01", "과목": "국제관계의 이해", "진술문": "근대 이후 국제 관계의 형성과 변화 과정을 파악한다."}, {"code": "12국관01-02", "과목": "국제관계의 이해", "진술문": "국제 사회를 이해하는 주요 관점인 현실주의와 자유주의를 중심으로 구체적인 국제 관계의 사례를 분석하고, 대안적 관점들을 탐색한다."}, {"code": "12국관01-03", "과목": "국제관계의 이해", "진술문": "국제 문제를 해결하기 위한 다양한 행위 주체의 활동을 탐색하고, 그 성과와 문제점에 대하여 토론한다."}, {"code": "12국관02-01", "과목": "국제관계의 이해", "진술문": "국가 간 불평등의 원인을 파악하고, 이러한 불평등이 야기하는 갈등 상황을 분석한다."}, {"code": "12국관02-02", "과목": "국제관계의 이해", "진술문": "공정 무역과 공적 개발 원조 등 국제 사회의 상생을 위한 노력을 조사하고, 다양한 행위 주체의 협력 방안을 탐색한다."}, {"code": "12국관02-03", "과목": "국제관계의 이해", "진술문": "국제 사회에서 우리나라의 위상을 파악하고, 국제 사회의 불평등 문제를 해결하기 위한 우리나라의 역할을 토론한다."}, {"code": "12국관03-01", "과목": "국제관계의 이해", "진술문": "인류가 직면한 평화와 안전의 상황을 다각적으로 조사한다."}, {"code": "12국관03-02", "과목": "국제관계의 이해", "진술문": "개인, 국가, 국제 사회의 평화와 안전을 위협하는 요인을 정치, 경제, 사회, 문화의 다양한 영역에 걸쳐 파악하고, 이를 해결하기 위한 실천 방안을 탐색한다."}, {"code": "12국관03-03", "과목": "국제관계의 이해", "진술문": "역동적인 국제 관계 속에서 우리나라가 당면한 평화와 안전의 문제를 파악하고, 평화와 안전을 도모할 수 있는 구체적인 방안에 대하여 토론한다."}, {"code": "12국관04-01", "과목": "국제관계의 이해", "진술문": "국제 분쟁을 해결하기 위한 외교와 국제법의 필요성과 기능을 탐색한다."}, {"code": "12국관04-02", "과목": "국제관계의 이해", "진술문": "국제법의 특징과 법원(法源)을 조사하고, 국제 사법 재판소의 역할과 한계를 파악한다."}, {"code": "12국관04-03", "과목": "국제관계의 이해", "진술문": "국제 사회에서 다양한 지역 통합이 이루어지는 현상과 그 이유를 확인하고, 지역 기구의 구성원으로서 우리나라의 역할을 토론한다."}, {"code": "12여지01-01", "과목": "여행지리", "진술문": "다양한 여행 사례와 자신의 여행 경험을 통해 여행의 의미를 파악하고 여행이 삶과 세계 인식에 미치는 영향을 토의한다."}, {"code": "12여지01-02", "과목": "여행지리", "진술문": "모빌리티의 변화와 발전에 따라 여행자의 이동, 위치, 장소가 어떻게 연결되고 관계를 맺는지 살펴보고, 다양한 지도 및 지리정보기술을 활용하여 안전한 여행 계획을 수립한다."}, {"code": "12여지02-01", "과목": "여행지리", "진술문": "인간의 정주공간으로서의 도시를 새로운 관점에서 낯설게 바라보고, 여행지로서의 향유 가능성을 탐색한다."}, {"code": "12여지02-02", "과목": "여행지리", "진술문": "다양한 문화 경관의 형성 배경과 의미를 이해하고, 감정이입과 공감의 자세로 여행지 주민을 배려하고 존중한다."}, {"code": "12여지02-03", "과목": "여행지리", "진술문": "여행지의 기후 및 기후변화가 여행자와 여행지 주민에게 미치는 영향과 그 차이를 비교하고, 지리적 상상력을 동원한 간접여행을 통해 기후경관을 체험한다."}, {"code": "12여지02-04", "과목": "여행지리", "진술문": "지형 경관이 지닌 자연적 가치, 심미적인 조화, 인간과의 상호 작용과 같은 지오사이트의 선정기준을 조사하고, 지오투어리즘 프로그램을 제안한다."}, {"code": "12여지03-01", "과목": "여행지리", "진술문": "인류의 물질적, 정신적 발전 과정을 성찰할 수 있는 산업유산 및 기념물을 조사하고 여행지의 가치를 평가한다."}, {"code": "12여지03-02", "과목": "여행지리", "진술문": "평화, 전쟁, 재난의 상징이 새겨진 지역에 대한 직간접적인 여행을 체험하고 이를 바탕으로 인권, 정의, 인류의 공존을 둘러싼 구조적 문제를 비판적으로 탐구한다."}, {"code": "12여지03-03", "과목": "여행지리", "진술문": "문화 창조, 첨단 기술과 같은 새로움을 지향하는 지역의 사례를 조사하고, 내가 살고 있는 지역의 로컬 큐레이터로서 다양한 여행 콘텐츠의 발굴과 모니터링을 통해 지역의 의미와 가치를 탐색한다."}, {"code": "12여지03-04", "과목": "여행지리", "진술문": "공정여행을 통해 여행지를 둘러싼 다양한 문제를 탐색하고, 여행자인 나와 여행지 주민인 그들이 연결된다는 점에서 공존의 의미와 생태 감수성에 대해 성찰한다."}, {"code": "12여지04-01", "과목": "여행지리", "진술문": "미디어와 여행의 상호관계를 통해 여행의 변화양상을 조사하고 미래 사회의 여행자와 여행의 모습을 예측한다."}, {"code": "12여지04-02", "과목": "여행지리", "진술문": 체의 에너지띠 구조로부터 도체와 부도체의 차이를 알고, 반도체 소자의 원리를 설명할 수 있다."}, {"code": "12물리03-06", "과목": "물리학", "진술문": "모든 관성계에서 빛의 속력이 동일하다는 원리로부터 시간 팽창, 길이 수축 현상이 나타남을 알고, 이러한 지식이 사회에 미친 영향을 조사할 수 있다."}, {"code": "12화학01-01", "과목": "화학", "진술문": "화학이 현대 과학⋅기술⋅사회의 발전에 기여한 사례를 조사⋅발표하며 화학에 흥미와 호기심을 가질 수 있다."}, {"code": "12화학01-02", "과목": "화학", "진술문": "다양한 단위를 몰로 환산할 수 있음을 이해하고, 물질의 양을 몰 단위로 표현할 수 있다."}, {"code": "12화학01-03", "과목": "화학", "진술문": "여러 가지 반응을 화학 반응식으로 나타내고, 화학 반응에서 물질의 양적 관계를 설명할 수 있다."}, {"code": "12화학02-01", "과목": "화학", "진술문": "실험을 통해 화학 결합의 전기적 성질을 설명할 수 있다."}, {"code": "12화학02-02", "과목": "화학", "진술문": "전기 음성도의 주기적 변화를 이해하고, 결합한 원소들의 전기 음성도 차이와 쌍극자 모멘트를 이용하여 결합의 극성을 판단할 수 있다."}, {"code": "12화학02-03", "과목": "화학", "진술문": "원자와 분자를 루이스 전자점식으로 표현하고, 전자쌍 반발 이론을 근거로 분자의 구조를 추론하여 모형으로 나타낼 수 있다."}, {"code": "12화학02-04", "과목": "화학", "진술문": "물질의 물리적, 화학적 성질을 분자의 구조와 연관 짓고, 이에 대한 호기심을 가질 수 있다."}, {"code": "12화학03-01", "과목": "화학", "진술문": "가역 반응에서 나타나는 화학 평형 상태의 특징을 설명할 수 있다."}, {"code": "12화학03-02", "과목": "화학", "진술문": "화학 반응에서 반응물과 생성물의 농도 자료를 통해 평형 상수의 의미를 설명할 수 있다."}, {"code": "12화학03-03", "과목": "화학", "진술문": "반응 지수의 의미를 알고, 이를 평형 상수와 비교하여 반응의 진행 방향을 예측할 수 있다."}, {"code": "12화학03-04", "과목": "화학", "진술문": "농도, 압력, 온도 변화에 따른 화학 평형의 이동을 이해하고, 이를 일상생활 속 현상을 설명하는 데 적용하여 화학의 유용함을 느낄 수 있다."}, {"code": "12화학04-01", "과목": "화학", "진술문": "물의 자동 이온화와 물의 이온화 상수를 이해하고, 수소 이온의 농도를 pH로 표현할 수 있다."}, {"code": "12화학04-02", "과목": "화학", "진술문": "몰 농도의 의미를 이해하고, 원하는 몰 농도의 용액을 만들 수 있다."}, {"code": "12화학04-03", "과목": "화학", "진술문": "중화 반응을 이해하고, 중화 반응에서의 양적 관계를 설명할 수 있다."}, {"code": "12화학04-04", "과목": "화학", "진술문": "중화 적정 실험을 계획하고 수행하여 미지 시료의 농도를 찾을 수 있다."}, {"code": "12생과01-01", "과목": "생명과학", "진술문": "생물 및 생명과학의 특성을 이해하고 생명과학의 성과를 협력적으로 소통할 수 있다."}, {"code": "12생과01-02", "과목": "생명과학", "진술문": "세포에서부터 생태계까지 생명 시스템의 구성 단계의 특징을 바탕으로 체계적인 설명 자료를 만들 수 있다."}, {"code": "12생과01-03", "과목": "생명과학", "진술문": "물질대사 과정에서의 에너지 전환 과정을 바탕으로 다양한 생명 활동에서의 에너지 사용을 추론할 수 있다."}, {"code": "12생과01-04", "과목": "생명과학", "진술문": "소화, 순환, 호흡, 배설 과정이 기관계의 통합적 작용으로 나타남을 신체의 생리적 변화와 연관지어 추론할 수 있다."}, {"code": "12생과01-05", "과목": "생명과학", "진술문": "물질대사 관련 질병 조사를 위한 방법을 고안하여 수행하고 대사성 질환을 예방하기 위한 올바른 생활 습관에 대해 토의하며 협력적으로 소통할 수 있다."}, {"code": "12생과01-06", "과목": "생명과학", "진술문": "생태계의 구조를 이해하고 물질의 순환과 에너지의 흐름을 추론하여 생태계 구성 요소들의 중요성을 설명할 수 있다."}, {"code": "12생과01-07", "과목": "생명과학", "진술문": "개체군과 군집의 특성을 이해하고 이들의 상호작용의 예를 조사하여 발표할 수 있다."}, {"code": "12생과02-01", "과목": "생명과학", "진술문": "신경 세포의 구조와 기능을 이해하고, 신경 세포에서의 전도 과정을 모식도로 표현할 수 있다."}, {"code": "12생과02-02", "과목": "생명과학", "진술문": "시냅스를 통한 신경 신호의 전달 과정을 이해하고, 약물이 시냅스 전달에 영향을 미치는 사례를 조사하여 발표할 수 있다."}, {"code": "12생과02-03", "과목": "생명과학", "진술문": "사람 신경계의 구조와 기능을 이해하고 중추 신경계와 말초 신경계의 특징을 설명할 수 있다."}, {"code": "12생과02-04", "과목": "생명과학", "진술문": "내분비계와 신경계 작용 원리와 상호작용의 이해를 바탕으로 우리 몸의 항상성이 유지되는 과정을 추론할 수 있다."}, {"code": "12생과02-05", "과목": "생명과학", "진술문": "병원체의 종류와 특징을 이해하고 우리 몸의 방어 작용을 선천적 면역과 후천적 면역으로 구분하여 설명할 수 있다."}, {"code": "12생과02-06", "과목": "생명과학", "진술문": "항원 항체 반응의 특이성을 이해하고, 혈액의 응집 반응 원리를 이용하여 혈액형을 판정할 수 있다."}, {"code": "12생과02-07", "과목": "생명과학", "진술문": "백신의 종류와 작용 원리를 조사하고 질병의 예방 측면에서 백신의 필요성을 인식하여 협력적으로 소통할 수 있다."}, {"code": "12생과03-01", "과목": "생명과학", "진술문": "염색체의 구조를 이해하고, DNA, 유전자의 관계를 설명할 수 있다."}, {"code": "12생과03-02", "과목": "생명과학", "진술문": "생식세포 형성과정을 체세포분열 과정과 비교하고, 생식세포 형성의 중요성을 생명의 연속성 및 다양성과 관련지어 추론할 수 있다."}, {"code": "12생과03-03", "과목": "생명과학", "진술문": "생물 진화의 원리를 이해하고, 생물 진화 연구의 다양한 사례를 조사하여 협력적으로 소통할 수 있다."}, {"code": "12생과03-04", "과목": "생명과학", "진술문": "생물의 분류 체계를 바탕으로 각 분류군의 차이를 이해하고 생물군을 분류 체계에 따라 설명할 수 있다."}, {"code": "12생과03-05", "과목": "생명과학", "진술문": "동물과 식물 분류군의 특징을 문 수준에서 이해하고, 생물의 유연관계를 계통수로 나타낼 수 있다."}, {"code": "12지구01-01", "과목": "지구과학", "진술문": "해수의 물리적, 화학적 성질을 이해하고, 실측 자료를 활용하여 해수의 온도, 염분, 밀도, 용존 산소량 등의 분포를 분석⋅해석할 수 있다."}, {"code": "12지구01-02", "과목": "지구과학", "진술문": "심층 순환의 발생 원리와 분포를 알고, 표층 순환 및 기후변화의 관련성을 추론할 수 있다."}, {"code": "12지구01-03", "과목": "지구과학", "진술문": "중위도 저기압과 고기압이 통과할 때 날씨의 변화를 일기도, 위상 영상, 레이더 영상을 종합하여 예측할 수 있다."}, {"code": "12지구01-04", "과목": "지구과학", "진술문": "태풍의 발생, 이동, 소멸 과정 및 태풍 영향권에서 날씨를 예측하고, 뇌우, 집중호우, 폭설, 강풍, 황사 등 주요 악기상의 생성 메커니즘과 대처 방안을 제시할 수 있다."}, {"code": "12지구01-05", "과목": "지구과학", "진술문": "대기와 해양의 상호작용의 사례로서 해수의 용승과 침강, 엘니뇨-남방진동(ENSO)의 현상의 진행 과정 및 관련 현상을 설명할 수 있다."}, {"code": "12지구01-06", "과목": "지구과학", "진술문": "기후변화의 원인을 자연적 요인과 인위적 요인으로 구분하여 설명하고, 인간 활동에 의한 기후변화 문제를 과학적으로 해결하는 방법을 탐색할 수 있다."}, {"code": "12지구02-02", "과목": "지구과학", "진술문": "지질시대를 기(紀) 수준에서 구분하고, 지층과 화석을 통해 지질시대의 생물과 환경 변화를 해석할 수 있다."}, {"code": "12지구02-03", "과목": "지구과학", "진술문": "변동대에서 마그마가 생성되고, 그 조성에 따라 다양한 화성암이 생성됨을 설명할 수 있다."}, {"code": "12지구02-04", "과목": "지구과학", "진술문": "변성작용의 종류와 지각 변동에 따른 구조를 변동대와 관련지어 설명하고, 지구시스템에서 암석이 순환함을 추론할 수 있다."}, {"code": "12지구02-05", "과목": "지구과학", "진술문": "우리나라의 대표적인 지질공원의 지질학적 형성 과정을 추론하고, 지역사회와 함께하는 지질공원의 지속가능한 발전방안을 제안할 수 있다."}, {"code": "12지구03-01", "과목": "지구과학", "진술문": "태양-지구-달 시스템에서의 식 현상을 이해하고 모형을 이용하여 태양계 행성의 겉보기 운동을 설명할 수 있다."}, {"code": "12지구03-02", "과목": "지구과학", "진술문": "별의 분광형 결정 및 별의 분류 과정을 이해하고, 흑체복사 법칙을 이용하여 별의 물리량을 추론할 수 있다."}, {"code": "12지구03-03", "과목": "지구과학", "진술문": "다양한 질량을 가진 별의 진화 과정을 H-R도에 나타내고 해석할 수 있다."}, {"code": "12지구03-04", "과목": "지구과학", "진술문": "허블의 은하 분류 체계에 따른 은하의 특징을 비교하고 외부은하의 자료를 이용하여 특이 은하의 관측적 특징을 추론할 수 있다."}, {"code": "12지구03-05", "과목": "지구과학", "진술문": "허블-르메트르 법칙으로 우주의 팽창을 이해하고 우주의 진화에 대한 다양한 설명 체계의 의의를 현대 우주론의 관점에서 비교할 수 있다."}, {"code": "12역학01-01", "과목": "역학과 에너지", "진술문": "물체에 작용하는 여러 가지 힘의 합력을 구하여 물체의 운동을 정량적으로 예측할 수 있다."}, {"code": "12역학01-02", "과목": "역학과 에너지", "진술문": "뉴턴 운동 법칙을 이용하여 물체의 포물선 운동을 정량적으로 설명하고, 포물선 운동에서의 역학적 에너지를 구할 수 있다."}, {"code": "12역학01-03", "과목": "역학과 에너지", "진술문": "물체에 작용하는 힘의 방향에 따라 물체의 운동 방향이 변할 수 있음을 원운동 등 다양한 예를 들어 설명할 수 있다."}, {"code": "12역학01-04", "과목": "역학과 에너지", "진술문": "케플러 법칙으로부터 중력의 존재가 밝혀지는 과학사적 배경을 이해하고, 중력을 이용하여 인공위성과 행성의 운동을 분석하고 설명할 수 있다."}, {"code": "12역학01-05", "과목": "역학과 에너지", "진술문": "역학적 에너지 보존을 이용하여 행성에 따라 탈출 속도가 다름을 이해하고, 운동량 보존을 이용하여 우주선이 발사되어 궤도에 오르는 원리를 설명할 수 있다."}, {"code": "12역학01-06", "과목": "역학과 에너지", "진술문": "등가 원리와 시공간의 휘어짐으로 인해 블랙홀과 중력 시간 지연이 나타남을 이해하고, 일반 상대론에 흥미를 느낄 수 있다."}, {"code": "12역학02-01", "과목": "역학과 에너지", "진술문": "건축을 포함한 다양한 열에너지 관련 기술에 단열, 열팽창 등이 활용된 예를 조사함으로써 과학의 유용성에 대한 가치를 인식할 수 있다."}, {"code": "12역학02-02", "과목": "역학과 에너지", "진술문": "열에 의한 물질의 상태 변화를 이해하고, 이상 기체의 온도, 압력, 부피의 관계를 설명할 수 있다."}, {"code": "12역학02-03", "과목": "역학과 에너지", "진술문": "계에 가해진 열이 계의 내부 에너지를 변화시키거나 외부에 일을 할 수 있음을 이해하고, 일상생활 속의 예를 찾음으로써 흥미를 느낄 수 있다."}, {"code": "12역학02-04", "과목": "역학과 에너지", "진술문": "다양한 열기관에서의 순환 과정과 열효율을 설명하고, 열기관의 개발과 활용이 인류 공동체에 미친 영향을 산업발전과 환경 측면에서 평가할 수 있다."}, {"code": "12역학02-05", "과목": "역학과 에너지", "진술문": "열의 이동, 기체의 확산과 같은 비가역 현상을 엔트로피를 이용하여 설명할 수 있다."}, {"code": "12역학03-01", "과목": "역학과 에너지", "진술문": "용수철 진자를 통해 단진동을 이해하고, 가속도와 변위 사이의 관계를 설명할 수 있다."}, {"code": "12역학03-02", "과목": "역학과 에너지", "진술문": "탄성파의 진행, 투과, 반사를 이해하고, 탄성파가 활용되는 예를 찾음으로써 과학의 유용성을 인식할 수 있다."}, {"code": "12역학03-03", "과목": "역학과 에너지", "진술문": "도플러 효과를 이해하고 물체의 속도 측정 등 다양한 장치에 이용됨을 설명할 수 있다."}, {"code": "12역학03-04", "과목": "역학과 에너지", "진술문": "음향 장치 또는 실내외 공간에서의 소음 제어에 음파의 간섭이 활용됨을 이해하고, 실생활에 사용되는 사례를 조사할 수 있다."}, {"code": "12역학03-05", "과목": "역학과 에너지", "진술문": "현악기, 관악기 등에서 소리를 내는 원리를 정상파를 이용하여 설명할 수 있다."}, {"code": "12전자01-01", "과목": "전자기와 양자", "진술문": "전하 주위의 전기장을 정량적으로 구하고, 전기력선과 등전위면으로부터 전기장의 세기와 방향을 추리할 수 있다."}, {"code": "12전자01-02", "과목": "전자기와 양자", "진술문": "정전기 유도와 유전분극을 설명하고, 일상생활에서 적용되는 예를 찾을 수 있다."}, {"code": "12전자01-03", "과목": "전자기와 양자", "진술문": "자기력선을 이용하여 전류가 흐르는 도선 주위의 자기장의 세기와 방향을 추리할 수 있다."}, {"code": "12전자01-04", "과목": "전자기와 양자", "진술문": "로런츠 힘이 발생하는 조건을 알고, 로런츠 힘과 관련된 현상과 기술을 설명할 수 있다."}, {"code": "12전자01-05", "과목": "전자기와 양자", "진술문": "자기선속의 변화로 전자기 유도를 이해하고, 변압기, 인덕터 등 전자기 유도의 활용 기술을 설명할 수 있다."}, {"code": "12전자01-06", "과목": "전자기와 양자", "진술문": "저항, 축전기, 인덕터를 활용하는 장치를 찾아 에너지 관점에서 정성적으로 설명할 수 있다."}, {"code": "12전자01-07", "과목": "전자기와 양자", "진술문": "다이오드, 트랜지스터 등 반도체 소자를 활용하는 전자회로를 분석하고, 현대 문명에서 반도체의 중요성을 인식할 수 있다."}, {"code": "12전자02-01", "과목": "전자기와 양자", "진술문": "빛의 간섭과 회절을 알고, 홀로그램 등 현대의 정밀 기술에 활용되는 예를 찾을 수 있다."}, {"code": "12전자02-02", "과목": "전자기와 양자", "진술문": "렌즈와 거울을 이용한 광학 기기의 원리와 수차를 설명할 수 있다."}, {"code": "12전자02-03", "과목": "전자기와 양자", "진술문": "편광의 원리를 이해하고, 이를 활용한 디지털 정보 기술의 사례를 조사할 수 있다."}, {"code": "12전자02-04", "과목": "전자기와 양자", "진술문": "광전효과에서 빛과 물질이 상호작용하는 방식을 알고, 디지털 영상 정보, 광센서, 태양전지 등 광전효과와 관련된 다양한 기술을 조사할 수 있다."}, {"code": "12전자02-05", "과목": "전자기와 양자", "진술문": "레이저의 특징과 빛이 증폭되는 원리를 알고, 레이저가 디지털 광통신 등 여러 영역에서 활용됨을 조사하여 현대 문명에서 레이저의 중요성을 인식할 수 있다."}, {"code": "12전자03-01", "과목": "전자기와 양자", "진술문": "단일 양자 수준의 이중 슬릿 실험을 통해서 입자-파동 이중성을 확인하고, 단일 양자의 분포에 대한 실험 결과를 확률 파동의 간섭을 토대로 해석할 수 있다."}, {"code": "12전자03-02", "과목": "전자기와 양자", "진술문": "중첩과 측정을 통한 확률적 상태 변화를 이해하고, 이를 이용한 양자컴퓨터, 양자암호통신 등의 양자 기술이 일상생활과 미래 사회에 미칠 영향을 인식할 수 있다."}, {"code": "12전자03-03", "과목": "전자기와 양자", "진술문": "터널 효과를 설명하고, 관련된 현상과 기술을 조사하여 발표할 수 있다."}, {"code": "12전자03-04", "과목": "전자기와 양자", "진술문": "현대의 원자모형을 불확정성 원리와 확률을 기반으로 설명하고, 보어의 원자모형과 비교할 수 있다."}, {"code": "12전자03-05", "과목": "전자기와 양자", "진술문": "별에서 핵융합에 의해 에너지가 생성되고 빛이 방출되는 원리를 알고, 별빛의 스펙트럼에 기반하여 별의 구성 원소를 추리할 수 있다."}, {"code": "12물에01-01", "과목": "물질과 에너지", "진술문": "기체의 온도, 압력, 부피, 몰수 사이의 관계를 통합적으로 이해하고, 이상 기체 방정식을 근사적으로 활용하는 사례를 조사하여 화학의 유용함을 인식할 수 있다."}, {"code": "12물에01-02", "과목": "물질과 에너지", "진술문": "혼합 기체의 부분 압력과 몰 분율의 관계를 알고, 일상생활에서 유용하게 사용되는 혼합 기체에 호기심을 가질 수 있다."}, {"code": "12물에01-03", "과목": "물질과 에너지", "진술문": "물질이 액체로 존재할 수 있는 이유를 분자 간 상호작용으로 이해하고, 액체의 종류에 따라 끓는점이 달라짐을 설명할 수 있다."}, {"code": "12물에01-04", "과목": "물질과 에너지", "진술문": "고체를 결정과 비결정으로 구분하고, 결정성 고체를 화학 결합의 종류에 따라 분류할 수 있다."}, {"code": "12물에02-01", "과목": "물질과 에너지", "진술문": "다른 액체와 구별되는 물의 성질을 수소 결합으로 설명하고, 경이로운 물의 성질에 흥미를 느낄 수 있다."}, {"code": "12물에02-02", "과목": "물질과 에너지", "진술문": "실험 데이터를 이용하여 용액의 농도에 따른 증기압, 끓는점, 어는점의 변화를 비교하고, 일상생활에서 나타나는 사례와 연관 지어 설명할 수 있다."}, {"code": "12물에02-03", "과목": "물질과 에너지", "진술문": "용액의 농도에 따른 삼투현상을 이해하고, 일상생활에서 삼투현상이 나타나는 사례를 찾아 화학 원리가 유용하게 적용됨을 인식할 수 있다."}, {"code": "12물에03-01", "과목": "물질과 에너지", "진술문": "엔탈피의 의미를 알고, 엔탈피를 이용하여 열화학 반응식을 표현할 수 있다."}, {"code": "12물에03-02", "과목": "물질과 에너지", "진술문": "측정하기 어려운 화학 반응의 엔탈피를 헤스 법칙으로 구하여 화학 법칙의 유용성을 인식할 수 있다."}, {"code": "12물에03-03", "과목": "물질과 에너지", "진술문": "엔트로피의 의미를 이해하고, 엔탈피와 엔트로피의 변화로 화학 변화의 자발성을 설명할 수 있다."}, {"code": "12물에04-01", "과목": "물질과 에너지", "진술문": "화학 반응 속도를 반응물의 농도로 표현할 수 있음을 알고, 자료 해석을 통하여 반응 속도식을 구할 수 있다."}, {"code": "12물에04-02", "과목": "물질과 에너지", "진술문": "1차 반응의 반감기가 반응물의 농도에 의존하지 않음을 이해하고, 1차 반응의 반감기가 활용되는 사례를 조사⋅발표할 수 있다."}, {"code": "12물에04-03", "과목": "물질과 에너지", "진술문": "화학 반응에서 유효 충돌과 활성화 에너지의 의미를 알고, 화학 반응이 일어나기 위한 조건에 관심을 가질 수 있다."}, {"code": "12물에04-04", "과목": "물질과 에너지", "진술문": "농도, 온도, 촉매에 따라 반응 속도가 달라짐을 이해하고, 일상생활에서 각각의 예를 찾아 화학의 유용성을 인식할 수 있다."}, {"code": "12반응01-01", "과목": "화학 반응의 세계", "진술문": "브뢴스테드-라우리 산과 염기의 정의를 이해하고, 이에 따라 산과 염기를 구별할 수 있다."}, {"code": "12반응01-02", "과목": "화학 반응의 세계", "진술문": "이온화 상수를 이용하여 산과 염기의 상대적인 세기를 추론하고, 약산과 약염기 수용액의 pH를 구할 수 있다."}, {"code": "12반응01-03", "과목": "화학 반응의 세계", "진술문": "중화 적정 실험의 pH 변화를 데이터에 근거하여 해석할 수 있다."}, {"code": "12반응01-04", "과목": "화학 반응의 세계", "진술문": "이온화 상수를 이용하여 염의 가수 분해를 설명할 수 있다."}, {"code": "12반응01-05", "과목": "화학 반응의 세계", "진술문": "화학 평형으로 생체 내 완충 작용을 설명하고, 화학 원리의 신비로움을 느낄 수 있다."}, {"code": "12반응02-01", "과목": "화학 반응의 세계", "진술문": "전자의 이동과 산화수 변화로 산화⋅환원 반응을 이해하고, 반쪽 반응식을 활용하여 산화⋅환원 반응식을 완성할 수 있다."}, {"code": "12반응02-02", "과목": "화학 반응의 세계", "진술문": "화학 전지의 발전 과정을 조사하여 실용 전지의 구조적 공통점을 추론할 수 있다."}, {"code": "12반응02-03", "과목": "화학 반응의 세계", "진술문": "화학 전지의 원리를 산화⋅환원 반응으로 설명하고, 표준 환원 전위를 이용하여 전위차를 구할 수 있다."}, {"code": "12반응02-04", "과목": "화학 반응의 세계", "진술문": "전기 분해의 원리를 산화⋅환원 반응으로 설명하고, 산업 현장에서 활용되는 전기 분해의 예를 조사하여 발표할 수 있다."}, {"code": "12반응02-05", "과목": "화학 반응의 세계", "진술문": "생명 현상 및 화학 전지에서 이용되는 다양한 산화⋅환원 반응과 그 반응에 이용된 물질의 역할을 조사하여 화학의 신비로움을 느낄 수 있다."}, {"code": "12반응03-01", "과목": "화학 반응의 세계", "진술문": "일상생활에 유용한 탄소 화합물을 작용기에 따라 분류할 수 있다."}, {"code": "12반응03-02", "과목": "화학 반응의 세계", "진술문": "간단한 탄소 화합물의 화학 반응 예를 찾아 작용기의 변화로 설명할 수 있다."}, {"code": "12반응03-03", "과목": "화학 반응의 세계", "진술문": "단위체의 중합 반응으로 다양한 고분자가 합성되는 것을 이해하여 화학 반응의 유용성을 인식할 수 있다."}, {"code": "12반응03-04", "과목": "화학 반응의 세계", "진술문": "탄소 화합물의 반응을 통해 합성된 새로운 물질이 과학⋅기술⋅사회 발전에 끼친 영향을 조사하여 화학의 유용성을 깨달을 수 있다."}, {"code": "12세포01-01", "과목": "세포와 물질대사", "진술문": "탄수화물과 지질의 종류와 주요 기능을 이해하고 생물체에 들어있는 탄수화물과 지질을 관찰할 수 있다."}, {"code": "12세포01-02", "과목": "세포와 물질대사", "진술문": "핵산과 단백질의 기본 구조와 세포에서의 주요 기능을 조사하여 설명할 수 있다."}, {"code": "12세포01-03", "과목": "세포와 물질대사", "진술문": "동물세포와 식물세포를 구성하는 세포 소기관의 구조와 기능을 이해하고, 세포 소기관들의 유기적 관계를 추론하여 협력적으로 소통할 수 있다."}, {"code": "12세포01-04", "과목": "세포와 물질대사", "진술문": "원핵세포와 진핵세포의 공통점과 차이점을 설명할 수 있다."}, {"code": "12세포01-05", "과목": "세포와 물질대사", "진술문": "세포막의 구조와 특성을 이해하고, 세포막을 통한 물질 수송 과정을 추론할 수 있다."}, {"code": "12세포02-01", "과목": "세포와 물질대사", "진술문": "물질대사는 생명체에서 생명을 유지하기 위해 일어나는 화학 반응임을 이해하고 에너지의 출입이 동반됨을 추론할 수 있다."}, {"code": "12세포02-02", "과목": "세포와 물질대사", "진술문": "생명 활동에 필요한 에너지를 공급하는 과정에서 광합성과 세포호흡 그리고 ATP의 역할을 설명할 수 있다."}, {"code": "12세포02-03", "과목": "세포와 물질대사", "진술문": "효소의 종류와 특성을 이해하고 효소의 활성에 영향을 미치는 요인에 대한 실험을 설계하여 수행할 수 있다."}, {"code": "12세포02-04", "과목": "세포와 물질대사", "진술문": "효소의 작용 기작을 이해하고, 생명체 내에서 일어나는 효소 작용의 중요성에 대해 다양한 매체를 활용하여 협력적으로 소통할 수 있다."}, {"code": "12세포02-05", "과목": "세포와 물질대사", "진술문": "효소가 우리 생활이나 산업에 다양하게 이용되는 사례를 조사하여 발표할 수 있다."}, {"code": "12세포03-01", "과목": "세포와 물질대사", "진술문": "미토콘드리아의 구조를 이해하고 생명체 내에서의 미토콘드리아의 기능을 추론할 수 있다."}, {"code": "12세포03-02", "과목": "세포와 물질대사", "진술문": "세포호흡 과정의 단계별 특징을 다양한 매체를 활용하여 협력적으로 소통할 수 있다."}, {"code": "12세포03-03", "과목": "세포와 물질대사", "진술문": "세포호흡 과정에서의 인산화 과정을 기질 수준의 인산화와 산화적 인산화 과정으로 구분할 수 있다."}, {"code": "12세포03-04", "과목": "세포와 물질대사", "진술문": "산소호흡과 발효의 공통점과 차이점을 이해하고, 실생활에서 발효를 이용한 사례 조사 계획을 세워 조사할 수 있다."}, {"code": "12세포03-05", "과목": "세포와 물질대사", "진술문": "엽록체의 구조를 이해하고 기능과 관련지어 설명할 수 있다."}, {"code": "12세포03-06", "과목": "세포와 물질대사", "진술문": "광합성의 명반응과 탄소 고정반응을 단계별로 구분하여 특징을 이해하고 두 반응의 상호 관계를 추론할 수 있다."}, {"code": "12세포03-07", "과목": "세포와 물질대사", "진술문": "광합성과 세포호흡의 전자 전달계를 비교하여 공통점과 차이점을 다양한 매체를 활용하여 설명할 수 있다."}, {"code": "12세포03-08", "과목": "세포와 물질대사", "진술문": "광합성 관련 과학사적 연구 결과를 조사하여 시각화 자료를 창의적으로 제작하여 협력적으로 소통할 수 있다."}, {"code": "12유전01-01", "과목": "생물의 유전", "진술문": "유전 형질이 유전자를 통해 자손에게 유전됨을 이해하고, 상염색체 유전과 성염색체 유전 양상의 차이를 설명할 수 있다."}, {"code": "12유전01-02", "과목": "생물의 유전", "진술문": "사람 유전 연구 방법의 어려움을 이해하고, 사람의 유전 현상 분석을 근거로 유전 형질의 유전적 특성을 추론할 수 있다."}, {"code": "12유전01-03", "과목": "생물의 유전", "진술문": "사람의 다유전자유전에 대해 이해하고, 유전 현상의 다양성 사례를 조사하여 과학적 근거를 활용하여 협력적으로 소통할 수 있다."}, {"code": "12유전01-04", "과목": "생물의 유전", "진술문": "염색체와 유전자 이상에 대해 이해하고, 사람의 유전병을 발병 원인별 조사 계획을 세워 조사할 수 있다."}, {"code": "12유전01-05", "과목": "생물의 유전", "진술문": "DNA의 구조와 유전물질 규명 관련 과학사적 연구 결과를 설명하기 위한 발표 자료를 창의적으로 제작할 수 있다."}, {"code": "12유전01-06", "과목": "생물의 유전", "진술문": "원핵세포와 진핵세포의 유전자 구조와 유전체 구성을 이해하고, 공통점과 차이점을 비교하여 설명할 수 있다."}, {"code": "12유전01-07", "과목": "생물의 유전", "진술문": "반보존적 DNA 복제 과정을 이해하고 그 의미를 추론하여 협력적으로 소통할 수 있다."}, {"code": "12유전02-01", "과목": "생물의 유전", "진술문": "전사와 번역 과정을 거쳐 유전자가 발현되는 중심원리를 이해하고, 모형을 이용하여 유전자 발현 과정을 설명할 수 있다."}, {"code": "12유전02-02", "과목": "생물의 유전", "진술문": "유전 부호를 이해하고, 유전 부호 표를 사용하여 유전 정보를 해독할 수 있다."}, {"code": "12유전02-03", "과목": "생물의 유전", "진술문": "원핵생물과 진핵생물의 유전자 발현 조절 과정을 비교하기 위한 설명 자료를 다양한 매체를 활용하여 제작할 수 있다."}, {"code": "12유전02-04", "과목": "생물의 유전", "진술문": "생물의 발생 과정에서 세포 분화가 유전자 발현 조절 과정을 통해 일어남을 추론할 수 있다."}, {"code": "12유전02-05", "과목": "생물의 유전", "진술문": "생물의 유전자 발현 조절 및 발생에 대한 연구가 인류 복지에 기여한 사례를 조사하여 협력적으로 소통할 수 있다."}, {"code": "12유전03-01", "과목": "생물의 유전", "진술문": "생명공학기술 발달 과정에서의 주요 사건을 조사하고 다양한 매체를 활용하여 발표할 수 있다."}, {"code": "12유전03-02", "과목": "생물의 유전", "진술문": "단일클론항체, 줄기세포, 유전자 편집 기술이 난치병 치료에 활용된 사례를 조사하고, 이러한 치료법의 전망에 대해 협력적으로 소통할 수 있다."}, {"code": "12유전03-03", "과목": "생물의 유전", "진술문": "생명공학기술 관련 학문 분야를 이해하고 우리 생활과 산업에 활용 사례를 조사하여 창의적으로 설명 자료를 제작할 수 있다."}, {"code": "12유전03-04", "과목": "생물의 유전", "진술문": "유전자 변형 생물체(LMO)의 특징을 이해하고 인간과 생태계에 미치는 영향을 추론할 수 있다."}, {"code": "12유전03-05", "과목": "생물의 유전", "진술문": "생명공학기술의 활용 과정에서 나타나는 문제점과 이에 대한 사회적 책임을 인식하고 생명윤리 쟁점에 대해 의사 결정할 수 있다."}, {"code": "12지시01-01", "과목": "지구시스템과학", "진술문": "지구의 탄생 이후 지구 대기, 원시 바다, 생명체 탄생 등의 과정을 통한 지구시스템 각 권역의 형성 과정을 추론할 수 있다."}, {"code": "12지시01-02", "과목": "지구시스템과학", "진술문": "지구시스템이 진화해온 역사에서 물, 탄소, 산소의 순환 과정을 통해 지권, 수권, 기권이 변화해 왔음을 추적할 수 있다."}, {"code": "12지시01-03", "과목": "지구시스템과학", "진술문": "판구조론의 발달사와 관련지어 판을 움직이는 맨틀의 상부 운동과 플룸에 의한 구조 운동을 구분할 수 있다."}, {"code": "12지시01-04", "과목": "지구시스템과학", "진술문": "암석의 순환 과정에서 화산 활동의 역할과 화산 활동으로 생성되는 암석의 특성을 추론할 수 있다."}, {"code": "12지시01-05", "과목": "지구시스템과학", "진술문": "지진파의 종류와 특성을 이해하고, 지진파를 이용하여 지구 내부구조를 알아내는 과정을 탐구할 수 있다."}, {"code": "12지시02-01", "과목": "지구시스템과학", "진술문": "에크만 수송과 관련지어 지형류의 발생 원리를 설명할 수 있다."}, {"code": "12지시02-02", "과목": "지구시스템과학", "진술문": "해파의 발생 과정을 이해하고, 천해파와 심해파의 차이점을 비교⋅설명할 수 있다."}, {"code": "12지시02-03", "과목": "지구시스템과학", "진술문": "해일이 발생하는 여러 가지 원인을 이해하고, 피해 사례와 대처 방안을 제안할 수 있다."}, {"code": "12지시02-04", "과목": "지구시스템과학", "진술문": "조석의 발생 과정을 이해하고 자료 해석을 통해 각 지역에서의 조석 양상을 설명할 수 있다."}, {"code": "12지시03-01", "과목": "지구시스템과학", "진술문": "대기를 구성하는 기체들이 선택적 흡수체임을 이해하고, 온실효과 및 태양 자외선 차단 효과, 물의 존재 등으로 지구 생명체 존재 조건을 추론할 수 있다."}, {"code": "12지시03-02", "과목": "지구시스템과학", "진술문": "지표와 대기의 열 출입과 관련된 물리 과정 및 전 지구 평균 열수지를 해석할 수 있다."}, {"code": "12지시03-03", "과목": "지구시스템과학", "진술문": "기온의 연직 분포와 대기의 안정도와의 관계를 이해하고, 단열변화를 통해 안개나 구름이 생성되는 과정 및 강수 과정을 분석할 수 있다."}, {"code": "12지시03-04", "과목": "지구시스템과학", "진술문": "기압의 연직 분포로 정역학적 균형을 이해하고, 대기 중 연직 운동의 발생 원인을 추론할 수 있다."}, {"code": "12지시03-05", "과목": "지구시스템과학", "진술문": "지균풍, 경도풍, 지상풍의 발생 원리와 관련된 힘의 작용을 설명할 수 있다."}, {"code": "12지시03-06", "과목": "지구시스템과학", "진술문": "행성파의 발달 과정을 이해하고, 지상 고⋅저기압 발달에서 편서풍 파동의 역할을 평가할 수 있다."}, {"code": "12행우01-01", "과목": "행성우주과학", "진술문": "태양계 탐사선의 활동을 통해 알아낸 성과를 이해하고, 인공위성을 활용한 우주탐사의 필요성을 토론할 수 있다."}, {"code": "12행우01-02", "과목": "행성우주과학", "진술문": "태양 활동 감시 시스템과 지구 접근 천체를 비롯한 지구를 위협하는 우주 위험 감시 기술의 중요성을 우주 재난 측면에서 인식할 수 있다."}, {"code": "12행우01-03", "과목": "행성우주과학", "진술문": "태양계를 지배하는 힘이 태양의 중력임을 이해하고, 케플러의 세 가지 법칙을 이용하여 태양계 구성 천체들의 운동을 설명할 수 있다."}, {"code": "12행우01-04", "과목": "행성우주과학", "진술문": "행성과 소천체의 정의를 구분하여 이해하고, 소천체 탐사 자료를 통해 이들의 특징을 추론할 수 있다."}, {"code": "12행우01-05", "과목": "행성우주과학", "진술문": "외 공학 문제를 확인하고 정의한다."}, {"code": "12로봇03-02", "과목": "로봇과 공학세계", "진술문": "로봇공학 프로젝트 수행 과정에서 로봇을 구성하는 하드웨어 및 관련 부품을 제어하는 소프트웨어의 특성을 이해하고, 정보를 수집하고 탐색한다."}, {"code": "12로봇03-03", "과목": "로봇과 공학세계", "진술문": "로봇공학 프로젝트 수행을 위하여 로봇 제어의 원리를 이해하고, 관련 문제해결을 위한 소프트웨어 알고리즘을 구상한다."}, {"code": "12로봇03-04", "과목": "로봇과 공학세계", "진술문": "로봇공학 프로젝트 문제해결을 위한 대안 선정, 제작, 작동을 체험하며, 이를 통해 로봇 제작에 대한 흥미와 협력적 태도를 갖는다."}, {"code": "12로봇03-05", "과목": "로봇과 공학세계", "진술문": "로봇공학 프로젝트 수행 과정과 결과에 대한 평가 및 개선을 통해 창의적 자신감 및 의사소통 능력을 기른다."}, {"code": "12로봇03-06", "과목": "로봇과 공학세계", "진술문": "제작한 로봇을 시연 및 공유하며 로봇의 활용 분야를 제안하여 로봇에 대한 긍정적 사고와 문제해결에 대한 자신감을 갖는다."}, {"code": "12생활01-01", "과목": "생활과학 탐구", "진술문": "인간의 특성에 대한 긍정적 태도를 바탕으로 인간 발달에 대한 이론과 발달의 특성을 탐구한다."}, {"code": "12생활01-02", "과목": "생활과학 탐구", "진술문": "아동기까지의 삶의 질이 전 생애에 끼치는 장기적이며 결정적인 영향을 이해하여 아동상담의 필요성과 사례를 탐구하여, 관련 분야로의 진로를 탐색한다."}, {"code": "12생활01-03", "과목": "생활과학 탐구", "진술문": "사회변화에 따라 파생된 가족생활교육 및 가족생활 복지서비스의 필요성을 이해하고, 새로운 정책을 탐구하며, 관련된 분야로의 진로를 탐색한다."}, {"code": "12생활01-04", "과목": "생활과학 탐구", "진술문": "소비문화를 선도하는 소비자가 되기 위해 현대 소비문화의 이해를 바탕으로 미래 소비 동향을 예측하여 소비 트렌드를 분석하고 제안한다."}, {"code": "12생활01-05", "과목": "생활과학 탐구", "진술문": "소비자 심리를 이해하여 소비 행동을 예측해보며, 소비와 관련한 직업의 세계를 탐색하고 진로를 설계한다."}, {"code": "12생활02-01", "과목": "생활과학 탐구", "진술문": "생활습관병의 원인을 분석하고, 올바른 관리법을 익혀 건강한 삶을 위한 실천 방안을 탐색하고 관련 분야로의 진로를 탐색한다."}, {"code": "12생활02-02", "과목": "생활과학 탐구", "진술문": "식품 가공의 원리를 이해하고 올바른 정보 분별 능력을 길러 가공식품을 건강하고 안전하게 이용하는 방안을 탐색하며, 관련된 분야의 진로를 탐색한다."}, {"code": "12생활02-03", "과목": "생활과학 탐구", "진술문": "올바른 식재료를 선택하고 조리 과정 중에 일어나는 성분 등의 변화를 이해하여 과학적 원리를 적용한 음식을 만든다."}, {"code": "12생활02-04", "과목": "생활과학 탐구", "진술문": "패션디자인의 기본 개념과 유행하는 스타일을 파악하여 패션 산업의 동향을 탐색하며, 관련된 분야의 진로를 탐색한다."}, {"code": "12생활02-05", "과목": "생활과학 탐구", "진술문": "패션디자인과 머천다이징에 대한 이해를 바탕으로 패션상품을 기획하고 디자인을 하며 하나의 브랜드를 기획한다."}, {"code": "12생활02-06", "과목": "생활과학 탐구", "진술문": "정치⋅경제, 사회⋅문화의 변화에 따른 주거 트렌드를 탐구하고 인간다운 주거환경을 실현할 수 있는 주거복지 정책을 제안한다."}, {"code": "12생활02-07", "과목": "생활과학 탐구", "진술문": "주거공간을 구성하고 있는 요소와 원리를 이해하여 라이프 const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);

// ── 요약 카드
const common = D.격자.filter(c => ['초1~2','초3~4','초5~6','중1~3'].includes(c.학년));
const cards = [
  ['공통 교육과정', sum(common,'덮음'), sum(common,'전체'), '초1~중3. 모든 학생이 반드시 지나가는 칸'],
  ['전체', sum(D.격자,'덮음'), sum(D.격자,'전체'), '고교 선택 과목까지 포함'],
  ['제품', Object.keys(D.제품).length, null, '성취기준을 실제로 붙인 제품 수'],
  ['빈 칸', sum(D.격자,'전체') - sum(D.격자,'덮음'), null, '아무 제품도 안 덮은 성취기준'],
];
for (const [label, a, b, note] of cards) {
  const c = el('div','card');
  c.appendChild(el('div','n', b ? `${a}<small> / ${b}</small>` : String(a)));
  c.appendChild(el('div','l', label));
  if (b) { const bar = el('div','bar'); bar.appendChild(el('i')).style.width = (a/b*100).toFixed(1)+'%'; c.appendChild(bar); }
  c.appendChild(el('div','l', note));
  document.getElementById('cards').appendChild(c);
}

// ── 히트맵
const byKey = {};
D.격자.forEach(c => byKey[c.교과+'|'+c.학년] = c);
const g = document.getElementById('grid');
const head = el('tr'); head.appendChild(el('th','sub','교과'));
D.학년순.forEach((y,i) => head.appendChild(el('th', i===4?'split':'', y)));
head.appendChild(el('th','split','합계'));
g.appendChild(el('thead')).appendChild(head);
const tb = el('tbody');
D.교과순.forEach(subj => {
  const tr = el('tr'); tr.appendChild(el('td','sub',subj));
  let t=0, d=0;
  D.학년순.forEach((y,i) => {
    const c = byKey[subj+'|'+y];
    const td = el('td', (i===4?'split ':'') + (!c ? 'none' : c.덮음===0 ? 'cell zero' : 'cell'));
    if (!c) { td.textContent = '·'; }
    else {
      t += c.전체; d += c.덮음;
      const r = c.덮음/c.전체;
      td.innerHTML = `${c.덮음} / ${c.전체}<span class="pct">${(r*100).toFixed(0)}%</span>`;
      td.style.background = `rgba(var(--fill), ${(r*0.82).toFixed(3)})`;
      if (r > 0.55) td.style.color = '#fff';
      td.onclick = () => showCell(c);
    }
    tr.appendChild(td);
  });
  const tot = el('td','split'); tot.innerHTML = `${d} / ${t}<span class="pct">${t?(d/t*100).toFixed(0):0}%</span>`;
  tr.appendChild(tot); tb.appendChild(tr);
});
g.appendChild(tb);

function showCell(c) {
  const box = document.getElementById('detail');
  box.className = 'on'; box.innerHTML = '';
  box.appendChild(el('h3', null, `${c.교과} · ${c.학년}`));
  box.appendChild(el('div','meta', `성취기준 ${c.전체}개 중 ${c.덮음}개를 덮는다. 빈 칸 ${c.빈칸.length}개.`));
  const chips = el('div','chips');
  const ps = Object.entries(c.제품).sort((a,b)=>b[1]-a[1]);
  if (ps.length) ps.forEach(([p,n]) => chips.appendChild(el('span','chip', `${p} <b>${n}</b>`)));
  else chips.appendChild(el('span','chip','덮는 제품 없음'));
  box.appendChild(chips);
  if (c.빈칸.length) {
    box.appendChild(el('div','meta','빈 칸 — 다음에 만들 것'));
    const ul = el('ul','gaps');
    c.빈칸.forEach(s => ul.appendChild(el('li', null, `<code>${s.code}</code>${s.진술문}`)));
    box.appendChild(ul);
  }
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ── 제품표
const pt = document.getElementById('products');
pt.appendChild(el('thead')).innerHTML = '<tr><th class="sub">제품</th><th>붙인 성취기준</th><th>교과</th></tr>';
const ptb = el('tbody');
Object.entries(D.제품).forEach(([name, codes]) => {
  const subj = {};
  D.격자.forEach(c => { if (c.제품[name]) subj[c.교과] = (subj[c.교과]||0) + c.제품[name]; });
  const tr = el('tr');
  tr.appendChild(el('td','sub',name));
  tr.appendChild(el('td',null,String(codes.length)));
  tr.appendChild(el('td',null, Object.entries(subj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(' · ')));
  ptb.appendChild(tr);
});
pt.appendChild(ptb);

// ── 경고
const w = document.getElementById('warnings');
if (D.자체번호파일.length) {
  const box = el('div','warn');
  box.appendChild(el('h3', null, '교육과정 코드가 아니라 자체 번호'));
  box.appendChild(el('p', null, '한 파일 안에서 실재하지 않는 코드가 절반을 넘는다. 형식만 성취기준처럼 생겼을 뿐이라 커버리지에서 통째로 뺐다. 형식이 우연히 맞는 것도 내용은 다른 성취기준이다.'));
  const ul = el('ul');
  D.자체번호파일.forEach(f => ul.appendChild(el('li', null, `<span class="mono">${f.파일}</span> — 유령 ${f.유령}종, 형식만 맞는 것 ${f.실재형식}종`)));
  box.appendChild(ul); w.appendChild(box);
}
if (D.유령코드.length) {
  const d = el('details');
  d.appendChild(el('summary', null, `실재하지 않는 코드 ${D.유령코드.length}종`));
  const ul = el('ul','rule');
  D.유령코드.forEach(x => ul.appendChild(el('li', null, `<span class="mono">${x.코드}</span> — ${x.파일.length}개 파일`)));
  d.appendChild(ul); w.appendChild(d);
}

// ── 판정 규칙
const r = document.getElementById('rules');
const mk = (title, rows) => {
  const d = el('details');
  d.appendChild(el('summary', null, title));
  const ul = el('ul','rule'); rows.forEach(x => ul.appendChild(el('li', null, x)));
  d.appendChild(ul); return d;
};
r.appendChild(mk(`사전으로 보고 뺀 파일 ${D.제외파일.length}개`,
  D.제외파일.map(f => `<span class="mono">${f.파일}</span> — 코드 ${f.코드}종, ${f.처리}`)));
r.appendChild(mk(`아예 세지 않은 곳 ${D.세지않은곳.length}곳`,
  D.세지않은곳.map(s => `<span class="mono">${s.경로}</span> — ${s.이유}`)));
</script>
</body>
</html>
