<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 결함 사냥</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#dfe3e8; --ink:#1b1f24; --dim:#5b6572;
    --accent:#1f5fd0; --good:#0f7b46; --bad:#b3261e; --warn:#8a5a00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       font-size:15px;line-height:1.6}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .hwrap{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:-.02em}
  .steps{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .st{font-size:12px;padding:3px 9px;border-radius:99px;background:#eef1f5;color:var(--dim)}
  .st.on{background:var(--accent);color:#fff}
  .st.done{background:#dbe7fb;color:var(--accent)}
  .clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
  main{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
  h2{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
  h3{font-size:15px;margin:0 0 8px}
  p{margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .muted{color:var(--dim);font-size:13px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1;min-width:300px}
  .col.stat{min-width:150px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 14px}
  button:hover{background:#f0f3f7}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.primary:disabled{background:#b9c3d2;border-color:#b9c3d2;cursor:not-allowed;filter:none}
  button.tab{border-radius:99px;padding:5px 12px;font-size:13px}
  button.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.pickcard{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;margin-bottom:8px}
  button.pickcard.on{border-color:var(--accent);background:#f2f6ff;box-shadow:inset 0 0 0 1px var(--accent)}
  button.pickcard b{display:block;margin-bottom:2px}
  button.pickcard span{font-size:13px;color:var(--dim)}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;max-width:100%}
  textarea{width:100%;resize:vertical}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:3px}
  .tablewrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid #eef1f5;padding:5px 6px;white-space:nowrap;text-align:right}
  th{position:sticky;top:0;background:#f3f5f8;cursor:pointer;user-select:none;text-align:right;font-weight:600}
  th:hover{background:#e8ecf2}
  td.cat,th.cat{text-align:left}
  tbody tr:hover{background:#fafbfd}
  .hl{background:#fff4d6}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--dim);margin-right:5px}
  .ok{color:var(--good)} .no{color:var(--bad)} .wn{color:var(--warn)}
  .rep{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfcfd}
  .rep .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dict dt{font-weight:600;margin-top:12px}
  .dict dd{margin:0;color:var(--dim);font-size:13px}
  .how{display:block;margin-top:4px;color:var(--accent);font-size:12.5px}
  .tip{background:#f8f9fb;border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--dim);margin:10px 0}
  .exp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fbfcfd}
  .exp h4{margin:0 0 6px;font-size:15px}
  .exp .q{display:block;font-size:12px;color:var(--accent);font-weight:600;margin-top:8px}
  .exp .a{font-size:13.5px;color:var(--ink)}
  .kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #e6eaef;padding:3px 0;font-size:13px}
  .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .note{background:#f2f6ff;border:1px solid #d6e3fb;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .err{color:var(--bad);font-size:13px;min-height:19px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  pre.report{white-space:pre-wrap;font-size:12.5px;background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:340px;overflow:auto}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">데이터 결함 사냥</div>
    <div class="steps" id="steps"></div>
    <div class="clock" id="clock"></div>
  </div>
</header>

<main id="stage"></main>

<script>
/* ================= 난수 ================= */
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickN(rng,n,max){const s=new Set();while(s.size<n&&s.size<max)s.add(Math.floor(rng()*max));return[...s]}
function shuffle(rng,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function one(rng,arr){return arr[Math.floor(rng()*arr.length)]}
function ri(rng,a,b){return a+Math.floor(rng()*(b-a+1))}
function rf(rng,a,b,d){return +(a+rng()*(b-a)).toFixed(d)}
function addDays(base,n){const d=new Date(base.getTime()+n*86400000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}

/* ================= 시나리오 =================
   컬럼 메타에 붙는 결함 재료
     missingVal   무응답을 채운 가짜 숫자
     impossibleVal 물리적으로 불가능한 값
     unitAlt      {f:배율, label:'바뀐 단위'}
     scaleDiv     자릿수가 밀린 배수
     outlierVal   가능하지만 극단적인 값
     variants     {원래값:[다른 표기...]}
     ws           앞뒤 공백을 섞어도 되는 범주 컬럼
   ============================================ */

const SCENARIOS=[
{
 id:'survey', title:'학교생활 만족도 설문', n:40, target:'만족도',
 blurb:'2학년 전체를 대상으로 걷은 생활 습관 설문이에요. 만족도를 예측하는 모델에 쓰려고 합니다.',
 goal:'학교생활 만족도(1에서 5점)를 예측하는 모델',
 leakCol:'상담_만족여부', biasCol:'동아리', biasVal:'없음',
 briefNormal:'2학년 전체 학급을 대상으로 조회 시간에 설문지를 배포하고 그 자리에서 회수했어요. 담임 선생님이 미제출자를 확인해 다시 받았습니다.',
 briefBias:'2학년 동아리 활동 시간에 각 동아리실을 돌며 설문지를 배포하고 그 자리에서 회수했어요. 회수율은 100퍼센트였습니다.',
 cols:[
  {k:'번호',t:'num',desc:'응답자 일련번호',spec:'1번부터 차례로, 같은 번호는 한 번만 나와요'},
  {k:'학급',t:'cat',desc:'응답자가 속한 학급',spec:'2-1, 2-2, 2-3, 2-4 네 가지',ws:true},
  {k:'성별',t:'cat',desc:'응답자 성별',spec:'남, 여 두 가지',variants:{'남':['남자','M'],'여':['여자','F']}},
  {k:'공부시간',t:'num',u:'시간',desc:'하루 평균 공부 시간',spec:'보통 0.5에서 5 사이',unitAlt:{f:60,label:'분'}},
  {k:'수면시간',t:'num',u:'시간',desc:'하루 평균 수면 시간',spec:'보통 5에서 9 사이. 24를 넘을 수 없어요',impossibleVal:26},
  {k:'폰사용',t:'num',u:'분',desc:'하루 스마트폰 사용 시간',spec:'보통 40에서 360 사이',missingVal:999,outlierVal:1180},
  {k:'통학시간',t:'num',u:'분',desc:'집에서 학교까지 걸리는 시간',spec:'보통 5에서 65 사이',missingVal:999},
  {k:'월용돈',t:'num',u:'원',desc:'한 달에 받는 용돈',spec:'보통 50,000에서 155,000 사이',scaleDiv:1000},
  {k:'동아리',t:'cat',desc:'소속 동아리',spec:'코딩, 밴드, 축구, 독서, 없음 다섯 가지',ws:true},
  {k:'상담_만족여부',t:'cat',desc:'담임 상담 기록에 적힌 만족 여부',spec:'만족, 보통, 불만 세 가지'},
  {k:'만족도',t:'num',u:'점',desc:'학교생활 만족도. 오늘 맞히려는 목표예요',spec:'1에서 5까지의 정수',impossibleVal:9},
 ],
 gen(rng){
  const CLUB=['코딩','밴드','축구','독서','없음'];
  const rows=[];
  for(let i=1;i<=40;i++){
    const sleep=rf(rng,5,8.4,1), club=one(rng,CLUB);
    let sat=Math.round(2.3+(sleep-6.5)*0.35+(club!=='없음'?0.7:0)+rng()*1.5);
    sat=Math.max(1,Math.min(5,sat));
    rows.push({번호:i,학급:'2-'+ri(rng,1,4),성별:rng()<0.5?'남':'여',
      공부시간:rf(rng,0.5,4.5,1),수면시간:sleep,폰사용:ri(rng,40,360),
      통학시간:ri(rng,5,65),월용돈:ri(rng,10,31)*5000,동아리:club,
      상담_만족여부:'',만족도:sat});
  }
  return rows;
 },
 leakFrom:r=>r.만족도>=4?'만족':(r.만족도===3?'보통':'불만'),
 leakNoise:['만족','보통','불만'],
},
{
 id:'library', title:'학급 도서 대출 기록', n:45, target:'반납지연',
 blurb:'학급문고 대출 기록이에요. 어떤 대출이 반납 지연으로 이어지는지 예측하려고 합니다.',
 goal:'반납이 지연될지(지연/정상) 미리 알아내는 모델',
 leakCol:'독촉문자', biasCol:'학년', biasVal:'1학년',
 briefNormal:'1학년부터 3학년까지 모든 교실 앞에 학급문고를 두고, 대출대장에 적힌 기록을 학기말에 그대로 옮겼어요.',
 briefBias:'2학년과 3학년 교실에만 학급문고 안내문을 붙였고, 대출대장에 적힌 기록을 학기말에 그대로 옮겼어요.',
 datePair:{from:'대출일',to:'반납일',derived:'대출기간'},
 cols:[
  {k:'대출번호',t:'num',desc:'대출 건 일련번호',spec:'1번부터 차례로, 같은 번호는 한 번만 나와요'},
  {k:'학년',t:'cat',desc:'빌린 학생의 학년',spec:'1학년, 2학년, 3학년 세 가지',variants:{'1학년':['1','일학년'],'2학년':['2','이학년']}},
  {k:'장르',t:'cat',desc:'책의 분류',spec:'소설, 과학, 역사, 만화, 시집 다섯 가지',ws:true,variants:{'만화':['만화책','코믹'],'시집':['시','시집(운문)']}},
  {k:'대출일',t:'cat',date:true,desc:'책을 빌려 간 날',spec:'2026-03-02 이후'},
  {k:'반납일',t:'cat',date:true,desc:'책을 돌려준 날',spec:'항상 대출일보다 나중이에요'},
  {k:'대출기간',t:'num',u:'일',desc:'반납일에서 대출일을 뺀 값',spec:'1에서 30 사이. 음수가 될 수 없어요',unitAlt:{f:24,label:'시간'}},
  {k:'대출권수',t:'num',u:'권',desc:'한 번에 빌린 권수',spec:'1에서 5 사이. 0권은 있을 수 없어요',impossibleVal:0},
  {k:'페이지수',t:'num',u:'쪽',desc:'빌린 책의 쪽수 합계',spec:'보통 80에서 800 사이',missingVal:9999,outlierVal:3400},
  {k:'누적대출횟수',t:'num',u:'회',desc:'그 학생이 지금까지 빌린 횟수',spec:'보통 1에서 25 사이',missingVal:99},
  {k:'독촉문자',t:'cat',desc:'사서 도우미가 독촉 문자를 보냈는지',spec:'발송, 미발송 두 가지'},
  {k:'반납지연',t:'cat',desc:'반납이 늦었는지 여부. 오늘 맞히려는 목표예요',spec:'지연, 정상 두 가지'},
 ],
 gen(rng){
  const GEN=['소설','과학','역사','만화','시집'];
  const base=new Date(2026,2,2), rows=[];
  for(let i=1;i<=45;i++){
    const start=ri(rng,0,110), span=ri(rng,1,30);
    const late=rng()<0.38?'지연':'정상';
    rows.push({대출번호:i,학년:one(rng,['1학년','2학년','3학년']),장르:one(rng,GEN),
      대출일:addDays(base,start),반납일:addDays(base,start+span),대출기간:span,
      대출권수:ri(rng,1,5),페이지수:ri(rng,80,800),누적대출횟수:ri(rng,1,25),
      독촉문자:'',반납지연:late});
  }
  return rows;
 },
 leakFrom:r=>r.반납지연==='지연'?'발송':'미발송',
 leakNoise:['발송','미발송'],
},
{
 id:'fitness', title:'학생 체력검사 기록', n:42, target:'종합등급',
 blurb:'2학년 체력검사 측정 기록이에요. 종합등급을 예측하는 모델에 쓰려고 합니다.',
 goal:'체력 종합등급(1에서 5등급)을 예측하는 모델',
 leakCol:'교사_판정', biasCol:'측정구분', biasVal:'추후측정',
 briefNormal:'정규 체육 수업 시간에 2학년 전원을 측정했고, 그날 결석한 학생은 나중에 따로 측정해서 함께 넣었어요.',
 briefBias:'정규 체육 수업 시간에 2학년을 측정했어요. 그날 결석한 학생도 나중에 따로 측정했지만, 기록을 옮길 때는 수업 시간 측정분만 가져왔습니다.',
 datePair:{from:'측정일',to:'입력일',derived:'입력지연'},
 cols:[
  {k:'번호',t:'num',desc:'학생 일련번호',spec:'1번부터 차례로, 같은 번호는 한 번만 나와요'},
  {k:'성별',t:'cat',desc:'학생 성별',spec:'남, 여 두 가지',variants:{'남':['남자','M'],'여':['여자','F']}},
  {k:'측정구분',t:'cat',desc:'언제 측정했는지',spec:'당일측정, 추후측정 두 가지',ws:true},
  {k:'측정일',t:'cat',date:true,desc:'체력검사를 실시한 날',spec:'2026-04-06 이후'},
  {k:'입력일',t:'cat',date:true,desc:'기록을 전산에 입력한 날',spec:'항상 측정일과 같거나 나중이에요'},
  {k:'입력지연',t:'num',u:'일',desc:'입력일에서 측정일을 뺀 값',spec:'0에서 14 사이. 음수가 될 수 없어요'},
  {k:'키',t:'num',u:'cm',desc:'측정한 키',spec:'보통 150에서 185 사이',scaleDiv:100,impossibleVal:250},
  {k:'몸무게',t:'num',u:'kg',desc:'측정한 몸무게',spec:'보통 42에서 88 사이',missingVal:999,outlierVal:171},
  {k:'윗몸일으키기',t:'num',u:'회',desc:'1분간 실시한 횟수',spec:'보통 10에서 60 사이',missingVal:999},
  {k:'오래달리기',t:'num',u:'초',desc:'오래달리기 기록',spec:'보통 240에서 600 사이',unitAlt:{f:1/60,label:'분'}},
  {k:'교사_판정',t:'cat',desc:'담당 교사가 적어 둔 총평',spec:'양호, 보통, 미흡 세 가지',ws:true},
  {k:'종합등급',t:'num',u:'등급',desc:'체력 종합등급. 오늘 맞히려는 목표예요',spec:'1에서 5까지의 정수',impossibleVal:9},
 ],
 gen(rng){
  const base=new Date(2026,3,6), rows=[];
  for(let i=1;i<=42;i++){
    const run=ri(rng,240,600), sit=ri(rng,10,60);
    let grade=Math.round(1+(run-240)/90-(sit-35)/25+rng()*1.2);
    grade=Math.max(1,Math.min(5,grade));
    const m=ri(rng,0,20), lag=ri(rng,0,14);
    rows.push({번호:i,성별:rng()<0.5?'남':'여',측정구분:rng()<0.75?'당일측정':'추후측정',
      측정일:addDays(base,m),입력일:addDays(base,m+lag),입력지연:lag,
      키:ri(rng,150,185),몸무게:ri(rng,42,88),윗몸일으키기:sit,오래달리기:run,
      교사_판정:'',종합등급:grade});
  }
  return rows;
 },

const FLAW_BY_ID=Object.fromEntries(FLAWS.map(f=>[f.id,f]));
const LEVELS=[{id:'easy',name:'입문',n:3,label:'결함 3개'},
              {id:'base',name:'기본',n:4,label:'결함 4개'},
              {id:'hard',name:'도전',n:6,label:'결함 6개'}];

/* ================= 데이터 만들기 ================= */
function buildDataset(code,scenId,levelId){
  const ds=SCENARIOS.find(s=>s.id===scenId)||SCENARIOS[0];
  const lv=LEVELS.find(l=>l.id===levelId)||LEVELS[1];
  const rng=mulberry32(hashSeed(code+'|'+ds.id+'|'+lv.id));
  const rows=ds.gen(rng);
  // 누수 후보 컬럼은 평소에는 잡음을 섞어 둔다
  rows.forEach(r=>{r[ds.leakCol]= rng()<0.3 ? one(rng,ds.leakNoise) : ds.leakFrom(r)});

  // 적용 가능한 (유형, 대상) 짝을 모아 대상이 겹치지 않게 뽑는다
  // 유형을 먼저 섞고 그 안에서 대상을 고른다. 대상 후보가 많은 유형이 과대 출현하는 것을 막는다.
  // foot = 실제로 건드리는 컬럼. 표본 편향은 신고 대상이 조사 개요지만 컬럼 하나를 소비한다
  const order=['bias','constant','space','missing','unit','category','impossible','scale','outlier','dateflip','leak','dupe'];
  const chosen=[],usedCol=new Set();
  for(const f of shuffle(rng,FLAWS)){
    if(chosen.length>=lv.n)break;
    const opts=shuffle(rng,f.pick(ds)).filter(col=>!usedCol.has(f.id==='bias'?ds.biasCol:col));
    if(!opts.length)continue;
    const col=opts[0];
    usedCol.add(f.id==='bias'?ds.biasCol:col);
    chosen.push({f,col});
  }
  chosen.sort((a,b)=>order.indexOf(a.f.id)-order.indexOf(b.f.id));

  let brief=ds.briefNormal;const key=[];
  for(const c of chosen){
    const r=c.f.apply(rows,rng,ds,c.col);
    if(r.brief==='bias')brief=ds.briefBias;
    key.push({id:c.f.id,name:c.f.name,target:c.col,idx:r.idx,why:r.why});
  }
  return{ds,lv,rows,key,brief};
}

  }).join('');

  c.textContent='경과 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+' / 45:00';

/* ================= 통계 ================= */
function colStats(k){
  const m=meta(k), vals=S.rows.map(r=>r[k]);
  const uniq=new Map();
  vals.forEach(v=>uniq.set(v,(uniq.get(v)||0)+1));
  const top=[...uniq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(m.t==='cat')return{type:'cat',n:vals.length,uniq:uniq.size,top};
  const nums=vals.slice().sort((a,b)=>a-b);
  const q=p=>nums[Math.min(nums.length-1,Math.floor(p*(nums.length-1)))];
  const mean=nums.reduce((a,b)=>a+b,0)/nums.length;
  return{type:'num',n:nums.length,uniq:uniq.size,min:nums[0],q1:q(.25),med:q(.5),q3:q(.75),
    max:nums[nums.length-1],mean,top};
}
function crossTab(k){
  const m=meta(k), tk=S.ds.target;
  const tv=[...new Set(S.rows.map(r=>r[tk]))].sort((a,b)=>
    (typeof a==='number'&&typeof b==='number')?a-b:String(a).localeCompare(String(b),'ko'));
  if(m.t==='cat'){
    const cats=[...new Set(S.rows.map(r=>r[k]))];
    const grid=cats.map(c=>({c,cells:tv.map(v=>S.rows.filter(r=>r[k]===c&&r[tk]===v).length)}));
    grid.forEach(g=>g.tot=g.cells.reduce((a,b)=>a+b,0));
    grid.sort((a,b)=>b.tot-a.tot);
    return{type:'cat',tv,grid:grid.slice(0,12),trimmed:Math.max(0,grid.length-12)};
  }
  return{type:'num',grid:tv.map(v=>{const g=S.rows.filter(r=>r[tk]===v);
    return{c:v,n:g.length,mean:g.reduce((a,b)=>a+b[k],0)/(g.length||1)}})};
}

function tableHTML(rows,hl){
  const hlSet=new Set(hl||[]);
  let h='<div class="tablewrap"><table><thead><tr><th class="cat">행</th>';
  cols().forEach(c=>{
    const mark=S.sortKey===c.k?(S.sortDir>0?' ▲':' ▼'):'';
    h+='<th class="'+(c.t==='cat'?'cat':'')+'" data-sort="'+c.k+'">'+c.k+mark+'</th>';
  });
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr class="'+(hlSet.has(r.__i)?'hl':'')+'"><td class="cat">'+(r.__i+1)+'</td>';
    cols().forEach(c=>{h+='<td class="'+(c.t==='cat'?'cat':'')+'">'+esc(r[c.k])+'</td>'});
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function sortedRows(){
  const rows=S.rows.map((r,i)=>Object.assign({__i:i},r));
  if(!S.sortKey)return rows;
  const m=meta(S.sortKey);
  return rows.sort((a,b)=>{
    const x=a[S.sortKey],y=b[S.sortKey];
    if(m.t==='num')return (x-y)*S.sortDir;
    return String(x).localeCompare(String(y),'ko')*S.sortDir;
  });
}

/* ================= 채점 ================= */
function gradeReports(){
  const valid=S.reports.filter(r=>r.target&&r.type&&r.why.trim().length>=10);
  const used=new Set(),taken=new Set(),hits=[],near=[],fps=[];
  valid.forEach((r,ri)=>{
    const i=S.key.findIndex((k,j)=>!used.has(j)&&k.target===r.target&&k.id===r.type);
    if(i>=0){used.add(i);taken.add(ri);hits.push({rep:r,key:S.key[i]})}
  });
  valid.forEach((r,ri)=>{
    if(taken.has(ri))return;
    const i=S.key.findIndex((k,j)=>!used.has(j)&&k.target===r.target);
    if(i>=0){used.add(i);near.push({rep:r,key:S.key[i]})}else fps.push(r);
  });
  const misses=S.key.filter((k,j)=>!used.has(j));
  const found=hits.length+near.length, submitted=valid.length;
  return{hits,near,fps,misses,submitted,found,
    precision:submitted?found/submitted:0,
    recall:S.key.length?found/S.key.length:0,
    score:hits.length*2+near.length-fps.length};
}

/* 헛짚은 신고에 대한 해설을 실제 수치로 만들어 준다 */
function whyClean(target){
  // 같은 자리를 두 번 신고하면 두 번째 건이 오탐으로 떨어진다. 이때 정상이라고 말하면 안 된다
  if(S.key.some(k=>k.target===target))
    return '이 자리에는 결함이 있고, 앞선 신고에서 이미 채점됐어요. 같은 곳을 두 번 신고하면 두 번째 건은 오탐으로 처리되니 한 자리에 한 건만 내세요.';
  if(target==='조사 개요')
    return '조사 개요를 보면 특정 집단만 빠질 만한 대목이 없어요. 데이터 사전에 적힌 종류가 표에도 모두 들어 있습니다.';
  if(target==='행 전체'){
    const first=cols()[0].k, st=colStats(first);
    return first+' 컬럼의 개수가 '+st.n+'개, 고유값이 '+st.uniq+'개로 같아요. 두 값이 같으면 중복된 행이 없다는 뜻입니다.';
  }
  const m=meta(target); if(!m)return '';
  const st=colStats(target);
  if(st.type==='num')
    return target+' 컬럼은 최솟값 '+st.min+', 최댓값 '+st.max+'로 사전 기준('+m.spec+') 안에 들어와요.';
  return target+' 컬럼은 고유값이 '+st.uniq+'종이고 사전 기준은 '+m.spec+'이에요. 표기가 흩어진 흔적이 없습니다.';
}

function rebuttalCase(){
  const g=S.result;
  if(g.misses.length)return{kind:'miss',key:g.misses[0]};
  if(g.fps.length)return{kind:'fp',rep:g.fps[0]};
  return{kind:'what',key:S.key[S.key.length-1]};
}

function reportText(){

  L.push('  이유: '+S.predWhy);
  L.push('');
  L.push('[결과] 정탐 '+g.hits.length+' 부분정탐 '+g.near.length+' 오탐 '+g.fps.length+' 미탐 '+g.misses.length
    +' / 정밀도 '+Math.round(g.precision*100)+'% 재현율 '+Math.round(g.recall*100)+'% / 점수 '+g.score);
  L.push('');
  L.push('[신고 내역] O 정탐, △ 자리만 적중, X 오탐');
  S.reports.filter(r=>r.target&&r.type).forEach((r,i)=>{
    const mark=g.hits.some(h=>h.rep===r)?'O':(g.near.some(h=>h.rep===r)?'△':'X');
    L.push('  '+(i+1)+'. '+mark+' '+r.target+' · '+FLAW_BY_ID[r.type].name);
    L.push('     근거: '+r.why);
  });
  L.push('');
  L.push('[숨어 있던 결함] '+S.key.map(k=>k.target+' · '+k.name).join(', '));
  L.push('[놓친 결함] '+(g.misses.length?g.misses.map(k=>k.target+' · '+k.name).join(', '):'없음'));

  L.push('[반증 서술] '+S.rebuttal);
  L.push('');
  L.push('[백지 복원]');
  BLANK_Q.forEach((q,i)=>L.push('  '+(i+1)+'. '+q+' → '+S.blanks[i]));

  return L.join('\n');
}

  <div class="card">
    <h3>제출 요약</h3>
    <p class="muted">아래 내용을 복사해서 선생님께 제출하면 돼요.</p>
    <pre class="report" id="rep">${esc(reportText())}</pre>
    <div class="actions">
      <button class="primary" id="copy">제출 내용 복사하기</button>
      <button id="again">다른 자료로 한 번 더</button>
      <span class="muted" id="copied"></span>
    </div>
  </div>`;
}

/* ================= 이벤트 ================= */
function bind(){
  const $=s=>stage.querySelector(s);
  const err=m=>{const e=$('#err');if(e)e.textContent=m};

  stage.querySelectorAll('[data-scen]').forEach(b=>b.onclick=()=>{S.scen=b.dataset.scen;render()});
  stage.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.level=b.dataset.lv;render()});

  const st=$('#start');
  if(st)st.onclick=()=>{
    S.code=($('#code').value||'seed').trim();
    const d=buildDataset(S.code,S.scen,S.level);
    S.ds=d.ds;S.lv=d.lv;S.rows=d.rows;S.key=d.key;S.brief=d.brief;
    S.sumCol=d.ds.cols[3].k;S.crossCol=d.ds.cols.find(c=>c.k!==d.ds.target&&!c.date).k;
    S.startedAt=Date.now();
    go(1);
  };

  stage.querySelectorAll('[data-cnt]').forEach(b=>b.onclick=()=>{S.predCount=+b.dataset.cnt;render()});
  const pc=$('#predcol');if(pc)pc.onchange=()=>S.predCol=pc.value;
  const pw=$('#predwhy');if(pw)pw.oninput=()=>S.predWhy=pw.value;

  stage.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
    S.tool=b.dataset.tool;
    if(S.tool==='sum')S.use.summary.add(S.sumCol);
    if(S.tool==='cross')S.use.cross++;
    render();
  });
  const sc=$('#sumcol');if(sc)sc.onchange=()=>{S.sumCol=sc.value;S.use.summary.add(sc.value);render()};
  const cc=$('#crosscol');if(cc)cc.onchange=()=>{S.crossCol=cc.value;S.use.cross++;render()};
  stage.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    S.sortDir=(S.sortKey===k)?-S.sortDir:1;S.sortKey=k;S.use.sort++;render();
  });

  stage.querySelectorAll('[data-rep]').forEach(el=>{
    const i=+el.dataset.rep,f=el.dataset.f;
    const h=()=>{S.reports[i][f]=el.value};
    el.tagName==='SELECT'?el.onchange=h:el.oninput=h;
  });
  stage.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    S.reports.splice(+b.dataset.del,1);
    if(!S.reports.length)S.reports.push({target:'',type:'',why:''});
    render();
  });
  const ar=$('#addrep');if(ar)ar.onclick=()=>{
    if(S.reports.length<maxReports()){S.reports.push({target:'',type:'',why:''});render()}};

  const rb=$('#reb');if(rb)rb.oninput=()=>S.rebuttal=rb.value;
  stage.querySelectorAll('[data-blank]').forEach(el=>el.oninput=()=>S.blanks[+el.dataset.blank]=el.value);

  const nx=$('#next');
  if(nx)nx.onclick=()=>{
    if(S.step===1){
      if(!S.predCount)return err('결함이 몇 개일지 위에서 숫자 하나를 눌러 주세요.');
      if(!S.predCol)return err('의심되는 컬럼을 하나 골라 주세요. 틀려도 감점은 없어요.');
      if(S.predWhy.trim().length<5)return err('이유를 한 줄만 적어 주세요. 짧아도 괜찮아요.');
      return go(2);
    }
    if(S.step===2){
      const valid=S.reports.filter(r=>r.target&&r.type&&r.why.trim().length>=10);
      if(!valid.length)return err('아직 완성된 신고가 없어요. 대상, 결함 유형, 근거 세 가지를 모두 채워야 제출돼요. 근거는 10자 이상 적어 주세요.');
      const partial=S.reports.filter(r=>(r.target||r.type||r.why.trim())&&!(r.target&&r.type&&r.why.trim().length>=10));
      if(partial.length)return err('쓰다 만 신고가 있어요. 빈 곳을 채우거나 삭제 버튼을 눌러 주세요.');
      S.result=gradeReports();
      return go(3);
    }
    if(S.step===3)return go(4);
    if(S.step===4){
      if(S.rebuttal.trim().length<20)return err('조금만 더 자세히 적어 주세요. 20자 이상이면 넘어갈 수 있어요.');
      return go(5);
    }
    if(S.step===5){
      if(S.blanks.some(b=>b.trim().length<5))return err('세 칸을 모두 채워 주세요. 한 줄씩이면 충분해요.');
      return go(6);
    }
  };

  const cp=$('#copy');
  if(cp)cp.onclick=async()=>{
    const t=reportText();
    try{await navigator.clipboard.writeText(t)}catch(e){
      const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();
    }
    $('#copied').textContent='복사했어요. 제출할 곳에 붙여 넣으면 됩니다.';
  };
  const ag=$('#again');
  if(ag)ag.onclick=()=>{
    Object.assign(S,{step:0,startedAt:0,predCount:null,predCol:'',predWhy:'',
      reports:[{target:'',type:'',why:''}],result:null,rebuttal:'',blanks:['','',''],
      tool:'book',sortKey:null,sortDir:1,use:{summary:new Set(),cross:0,sort:0}});
    go(0);
  };
}

render();
</script>
</body>
</html>
